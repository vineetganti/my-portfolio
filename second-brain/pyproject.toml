[project]
name = "newsletter-brief"
version = "0.1.0"
description = "Daily newsletter brief -> approval -> Notion second brain"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client",
  "google-auth-oauthlib",
  "beautifulsoup4",
  "trafilatura",
  "httpx",
  "pydantic>=2",
  "chromadb",
  "gradio",
  "notion-client",
  "python-dotenv",
  "pypdf",
  "cryptography",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
nb = "newsletter_brief.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

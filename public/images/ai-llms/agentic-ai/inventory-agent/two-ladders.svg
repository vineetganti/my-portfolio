<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>two ladders</title><desc>Two ladders to the same kind of agent, both by Shivank Agarwal. The bootcamp's eight steps build a planner from parts: 01 SQLite, 02 embeddings, 03 ChromaDB retrieval, 04 a first LLM chain, 05 a RAG chain, 06 a tool-calling loop, 07 a fixed multi-chain pipeline, 08 the full app with database, notes and tools. The lecture's eight versions grow one shop assistant by one idea each: v0 one prompt, v1 a web form, v2 a database, tools and an agent, v3 guardrails, v4 a cache, v5 an email action, v6 tracing, v7 a calculation tool. The first ladder teaches how an agent is built; the second, what a production-style one needs around it.</desc><defs></defs><rect width="720" height="400" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Two ladders: build an agent, then build around it</text><text x="20" y="60" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">Bootcamp module 4: the parts</text><text x="380" y="60" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">Lecture code: one idea per version</text><rect x="20" y="70" width="320" height="30" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="180" y="89.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">01 SQLite</text><rect x="20" y="106" width="320" height="30" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="180" y="125.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">02 embeddings</text><rect x="20" y="142" width="320" height="30" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="180" y="161.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">03 ChromaDB retrieval</text><rect x="20" y="178" width="320" height="30" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="180" y="197.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">04 first LLM chain</text><rect x="20" y="214" width="320" height="30" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="180" y="233.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">05 RAG chain</text><rect x="20" y="250" width="320" height="30" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="180" y="269.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">06 tool-calling loop</text><rect x="20" y="286" width="320" height="30" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="180" y="305.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">07 multi-chain pipeline</text><rect x="20" y="322" width="320" height="30" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="180" y="341.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">08 full app: DB + RAG + tools</text><rect x="380" y="70" width="320" height="30" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="540" y="89.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">v0 one prompt</text><rect x="380" y="106" width="320" height="30" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="540" y="125.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">v1 a web form</text><rect x="380" y="142" width="320" height="30" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="540" y="161.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">v2 database + tools + agent</text><rect x="380" y="178" width="320" height="30" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="540" y="197.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">v3 guardrails</text><rect x="380" y="214" width="320" height="30" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="540" y="233.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">v4 a cache</text><rect x="380" y="250" width="320" height="30" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="540" y="269.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">v5 an email action</text><rect x="380" y="286" width="320" height="30" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="540" y="305.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">v6 tracing</text><rect x="380" y="322" width="320" height="30" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="540" y="341.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">v7 a calculation tool</text><text x="20" y="370" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Amber: the production ideas that sit around the agent rather than inside it. Trip Buddy climbed a ladder like the</text><text x="20" y="385.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">left one.</text></svg>

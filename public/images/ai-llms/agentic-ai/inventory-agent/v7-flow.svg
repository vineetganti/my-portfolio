<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>v7 flow</title><desc>How one question flows through v7. The message first meets the rule-based guardrail from v3, which blocks known attack phrases. Then the cache from v4 returns a saved answer for the same question within five minutes. Otherwise the agent from v2 calls the model, which calls tools that read the SQLite database, including v7's calculate_reorder_quantity, which does the maths in Python. The answer goes back to the user and is saved in the cache, and the whole question is one trace in LangSmith, from v6. The email alert from v5 is a separate button that a person presses.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="330" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">One question through v7</text><rect x="20" y="70" width="110" height="56" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="75" y="102.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">question</text><rect x="160" y="70" width="120" height="56" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="220" y="95.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">guardrail (v3)</text><text x="220" y="117.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">keyword lists</text><rect x="310" y="70" width="120" height="56" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="370" y="95.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">cache (v4)</text><text x="370" y="117.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">5-minute expiry</text><rect x="460" y="70" width="120" height="56" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="520" y="95.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">agent (v2)</text><text x="520" y="117.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">model + prompt</text><rect x="610" y="70" width="90" height="56" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="655" y="95.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">tools</text><text x="655" y="117.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">DB, v7 maths</text><line x1="130" y1="98" x2="160" y2="98" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="280" y1="98" x2="310" y2="98" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="295" y="90" font-size="11" font-weight="700" fill="#5e5241" text-anchor="middle">safe</text><line x1="430" y1="98" x2="460" y2="98" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="445" y="90" font-size="11" font-weight="700" fill="#5e5241" text-anchor="middle">miss</text><line x1="580" y1="90" x2="608" y2="90" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="608" y1="108" x2="580" y2="108" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="160" y="160" width="120" height="44" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="220" y="186.2" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">refusal</text><rect x="310" y="160" width="120" height="44" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="370" y="186.2" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">saved answer 🔄</text><line x1="220" y1="126" x2="220" y2="158" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="370" y1="126" x2="370" y2="158" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="20" y="236" width="680" height="40" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="360" y="260.2" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">the whole question is one trace in LangSmith (v6)</text><rect x="460" y="160" width="240" height="44" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="580" y="186.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">email alert (v5): a person presses it</text><text x="20" y="292" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">The guardrail and the cache cost nothing; only a cache miss reaches the model.</text></svg>

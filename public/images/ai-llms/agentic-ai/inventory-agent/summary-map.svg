<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 244" width="720" height="244" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>summary map</title><desc>A map of the post in four columns. Build: SQLite, embeddings, Chroma, chains, RAG and a tool loop, eight bootcamp steps. Around it: guardrails, a cache, a write action, tracing and a calculator tool, one idea per version. Measured: the rule in the prompt and a tool changed Claude's answer from 100 units to 20; keyword guardrails failed both ways; the cache answered 1 of 8 lookups. Limits: first match only, no chat history, stale cache, no login.</desc><defs></defs><rect width="720" height="244" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">The inventory agent, in four ideas</text><rect x="20" y="50" width="162" height="124" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="101" y="88.66" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Build it</text><text x="101" y="110.29" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">SQLite, embeddings</text><text x="101" y="124.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Chroma, chains, RAG</text><text x="101" y="138.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">a tool loop</text><text x="101" y="151.87" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">8 bootcamp steps</text><rect x="192" y="50" width="162" height="124" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="273" y="88.66" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Around it</text><text x="273" y="110.29" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">guardrail, cache</text><text x="273" y="124.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">email action</text><text x="273" y="138.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">tracing</text><text x="273" y="151.87" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">a calculator tool</text><rect x="364" y="50" width="162" height="124" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="445" y="88.66" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Measured</text><text x="445" y="110.29" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">v0 Claude: 100 units</text><text x="445" y="124.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">v7 both: 20 units</text><text x="445" y="138.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">keywords wrong both ways</text><text x="445" y="151.87" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">cache: 1 of 8 hits</text><rect x="536" y="50" width="162" height="124" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="617" y="88.66" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Limits</text><text x="617" y="110.29" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">first match only</text><text x="617" y="124.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">no chat history</text><text x="617" y="138.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">stale cache</text><text x="617" y="151.87" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">no login</text><text x="20" y="204" font-size="12" font-weight="700" fill="#5e5241" text-anchor="start">A production-style agent is a small model call surrounded by ordinary engineering.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>rule and tool</title><desc>Before and after for 'Should I reorder toothpaste?' with 20 in stock, 5 sold a day and a 4-day lead time. In v0 the prompt gives the numbers but not the shop's reorder rule: Groq answered 'reorder 20 units', Claude suggested about 100 units with a reorder point of 30, a reasonable answer to a different rule. In v7 the system prompt states the rule, and calculate_reorder_quantity does the maths in Python: both providers answered 'order at least 20 units now'.</desc><defs></defs><rect width="720" height="300" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Before and after: say the rule, and let code do the maths</text><text x="20" y="62" font-size="12.5" font-weight="700" fill="#b0273f" text-anchor="start">v0: numbers, no rule</text><text x="380" y="62" font-size="12.5" font-weight="700" fill="#4b7d33" text-anchor="start">v7: rule in the prompt + a calculator tool</text><rect x="20" y="72" width="320" height="56" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="180" y="97.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Groq gpt-oss-20b</text><text x="180" y="119.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">'reorder 20 units'</text><rect x="20" y="140" width="320" height="56" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="180" y="165.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Claude Haiku 5.5</text><text x="180" y="187.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">'about 100 units, reorder point 30'</text><rect x="380" y="72" width="320" height="56" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="540" y="97.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Groq gpt-oss-20b</text><text x="540" y="119.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">'order at least 20 units'</text><rect x="380" y="140" width="320" height="56" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="540" y="165.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Claude Haiku 5.5</text><text x="540" y="187.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">'order at least 20 units now'</text><text x="20" y="222" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">20 in stock ÷ 5 a day = 4 days, equal to the 4-day lead time, so reorder demand × lead time = 20. Claude's v0</text><text x="20" y="237.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">answer wasn't wrong arithmetic: it answered with its own, more cautious policy, because nobody told it the</text><text x="20" y="253.05" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">shop's.</text></svg>

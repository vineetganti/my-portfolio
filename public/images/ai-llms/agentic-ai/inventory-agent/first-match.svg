<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>first match</title><desc>Why 'Should I reorder shaving?' answered about shaving cream only. The tool runs SELECT … WHERE product_name LIKE '%shaving%' and takes fetchone, the first matching row. Three products match: shaving_cream with 25 in stock, shaving_gel with 10 and shaving_foam with 15. Only shaving_cream reaches the model, which answered 'no need to reorder shaving cream' on both providers, without mentioning that two other products matched.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="280" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">LIKE '%shaving%' matches three, fetchone returns one</text><rect x="20" y="70" width="200" height="56" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="120" y="102.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">'reorder shaving?'</text><rect x="260" y="56" width="200" height="112" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="360" y="95.58" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">3 rows match</text><text x="360" y="117.22" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">shaving_cream  25</text><text x="360" y="131.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">shaving_gel  10</text><text x="360" y="144.94" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">shaving_foam  15</text><rect x="500" y="70" width="200" height="56" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="600" y="95.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">fetchone(): cream only</text><text x="600" y="117.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">'no reorder needed'</text><line x1="220" y1="98" x2="258" y2="98" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="460" y1="98" x2="500" y2="98" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="20" y="196" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Both providers answered about shaving cream and never mentioned the gel or the foam: the model can't report a</text><text x="20" y="211.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">match the tool threw away. Return every match and let the agent ask which one.</text></svg>

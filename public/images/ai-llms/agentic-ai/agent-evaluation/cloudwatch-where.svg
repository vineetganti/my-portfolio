<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Where AgentCore traces land in CloudWatch, and where to look</title><desc>Top left: an agent on AgentCore Runtime writes to its own log group, /aws/bedrock-agentcore/runtimes/&lt;agent&gt;-DEFAULT, with log streams for stdout (dated runtime-logs streams), OpenTelemetry logs (otel-rt-logs) and spans. Top right: an agent run elsewhere with ADOT sends spans to the shared aws/spans log group and its logs to a log group you create. Transaction Search, enabled once per account and Region, is what turns spans into searchable data and indexes 1 percent as trace summaries. Bottom: four places to read them: the AgentCore console's Observability page, CloudWatch GenAI Observability, Application Signals Transaction search, and Logs Insights.</desc><defs></defs><rect width="720" height="420" fill="#ffffff"/><rect x="10" y="10" width="344" height="170" rx="14" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="182" y="34" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">Agent on AgentCore Runtime</text><text x="182" y="51" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">e.g. s07_travel_agent</text><text x="182" y="74" font-size="11" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/aws/bedrock-agentcore/runtimes/</text><text x="182" y="90" font-size="11" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">s07_travel_agent-…-DEFAULT</text><rect x="22" y="102" width="196" height="20" rx="7" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="32" y="115.6" font-size="10" font-weight="400" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">2026/10/31/[runtime-logs]…</text><text x="226" y="116" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="start">stdout, print()</text><rect x="22" y="126" width="196" height="20" rx="7" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="32" y="139.6" font-size="10" font-weight="400" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">otel-rt-logs</text><text x="226" y="140" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="start">OTel log events</text><rect x="22" y="150" width="196" height="20" rx="7" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><text x="32" y="163.6" font-size="10" font-weight="400" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">spans</text><text x="226" y="164" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="start">the trace spans</text><rect x="366" y="10" width="344" height="170" rx="14" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="538" y="34" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">Agent run elsewhere with ADOT</text><text x="538" y="51" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">e.g. s07-account-agent on my laptop</text><rect x="380" y="66" width="150" height="26" rx="7" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><text x="455" y="83.14" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">aws/spans</text><text x="540" y="84" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="start">the shared spans log group</text><rect x="380" y="100" width="150" height="26" rx="7" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="455" y="117.14" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">your log group</text><text x="540" y="112" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="start">OTel logs (from the</text><text x="540" y="126" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="start">x-aws-log-group header)</text><text x="538" y="160" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">service.name = how it's labelled</text><rect x="10" y="192" width="700" height="40" rx="10" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.3"/><text x="360" y="217" font-size="12" font-weight="700" fill="#a3283f" text-anchor="middle">Transaction Search must be enabled (once per account and Region), or there are no spans to see</text><text x="14" y="258" font-size="12.5" font-weight="700" fill="#8a5a00" text-anchor="start">Four places to read them (Region: US East, N. Virginia)</text><rect x="10" y="270" width="168" height="92" rx="10" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.5"/><text x="94" y="299.275" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">AgentCore console</text><text x="94" y="314.775" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">Observability:</text><text x="94" y="328.425" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">Overview, Sessions,</text><text x="94" y="342.075" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">Traces, Spans</text><rect x="187" y="270" width="168" height="92" rx="10" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="271" y="299.275" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">CloudWatch</text><text x="271" y="314.775" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">GenAI Observability &gt;</text><text x="271" y="328.425" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">Bedrock AgentCore:</text><text x="271" y="342.075" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">Agents, Sessions, Traces</text><rect x="364" y="270" width="168" height="92" rx="10" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="448" y="299.275" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">CloudWatch</text><text x="448" y="314.775" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">Application Signals &gt;</text><text x="448" y="328.425" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">Transaction search:</text><text x="448" y="342.075" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">filter by service name</text><rect x="541" y="270" width="168" height="92" rx="10" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="625" y="299.275" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">CloudWatch</text><text x="625" y="314.775" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">Logs Insights:</text><text x="625" y="328.425" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">query aws/spans or</text><text x="625" y="342.075" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">the agent's log group</text><text x="360" y="392" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">Spans can take about 10 minutes to appear the first time; set the time range to cover your run.</text></svg>

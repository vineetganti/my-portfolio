<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>The LangSmith trace, from its API</title><desc>A drawing of the run tree LangSmith stored for the research-assistant question, built from the runs its API returned, not a screenshot. Root invoke_agent Strands Agents, run type llm, 7.58 seconds, shown as 12,752 input and 864 output tokens. Cycle 1, 3.76 seconds: chat, 2.69 seconds, 2,990 in and 147 out, then two tool runs, calculator in 0.01 seconds and http_request in 1.07 seconds. Cycle 2, 3.82 seconds: chat, 3.82 seconds, 3,386 in and 285 out. The root's tokens are exactly twice the sum of the two chat calls, which suggests LangSmith adds the children's tokens to totals Strands already put on the root. Cost is empty because LangSmith has no price for this Bedrock model id.</desc><defs></defs><rect width="720" height="380" fill="#fffdf8"/><rect x="10" y="10" width="700" height="46" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.3"/><text x="24" y="30" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">project: strands-agents-demo  ·  1 trace  ·  7.58 s</text><text x="24" y="48" font-size="10.8" font-weight="400" fill="#5e5241" text-anchor="start">tabs: Threads · Traces · Runs   |   side panel: Trajectory · Turns · Details</text><text x="696" y="39" font-size="10.5" font-weight="400" fill="#b0273f" text-anchor="end" font-style="italic">drawn from the API, not a screenshot</text><text x="24" y="80" font-size="11" font-weight="700" fill="#5e5241" text-anchor="start">run (indent = child)</text><text x="470" y="80" font-size="11" font-weight="700" fill="#5e5241" text-anchor="start">latency</text><text x="560" y="80" font-size="11" font-weight="700" fill="#5e5241" text-anchor="start">tokens in / out</text><rect x="14" y="90" width="692
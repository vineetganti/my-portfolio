<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Why LangSmith answered 403</title><desc>Top: the notebook never loads the .env file, so os.getenv falls back to the key typed into the notebook, which was the same key. It sends spans to api.smith.langchain.com, LangSmith's GCP US region. Bottom: the same key tested against each regional API. GCP US 403, GCP EU 403, GCP APAC 403, AWS US 200. The account lives in the AWS US region, so the endpoint must be aws.api.smith.langchain.com/otel. After that change, the run exported without errors and the project strands-agents-demo appeared.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="360" fill="#fffdf8"/><rect x="14" y="20" width="150" height="64" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="89" y="42.1" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">notebook cell</text><text x="89" y="57.6" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">os.getenv(KEY,</text><text x="89" y="71.25" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">default)</text><line x1="166" y1="52" x2="194" y2="52" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="196" y="20" width="160" height="64" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="276" y="42.1" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">.env not loaded</text><text x="276" y="57.6" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">no load_dotenv()</text><text x="276" y="71.25" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">→ the default is used</text><line x1="358" y1="52" x2="386" y2="52" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="388" y="20" width="318" height="64" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="547" y="41.95" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">OTLP to api.smith.langchain.com/otel</text><text x="547" y="56.83" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">x-api-key=&lt;key&gt;, Langsmith-Project=…</text><text x="547" y="70.48" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Failed to export spans batch code: 403</text><text x="14" y="120" font-size="12.5" font-weight="700" fill="#9a5400" text-anchor="start">The same key, tested against each region's API</text><rect x="14" y="132" width="110" height="28" rx="7" fill="#faf3e3" stroke="#5e5241" stroke-width="1.2"/><text x="24" y="150.14" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start">GCP US</text><rect x="132" y="132" width="330" height="28" rx="7" fill="#fffdf8" stroke="#5e5241" stroke-width="1.2"/><text x="142" y="150.14" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">api.smith.langchain.com</text><rect x="470" y="132" width="70" height="28" rx="7" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.2"/><text x="505" y="150.32" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">403</text><text x="550" y="151" font-size="11" font-weight="400" fill="#b0273f" text-anchor="start">wrong region</text><rect x="14" y="166" width="110" height="28" rx="7" fill="#faf3e3" stroke="#5e5241" stroke-width="1.2"/><text x="24" y="184.14" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start">GCP EU</text><rect x="132" y="166" width="330" height="28" rx="7" fill="#fffdf8" stroke="#5e5241" stroke-width="1.2"/><text x="142" y="184.14" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">eu.api.smith.langchain.com</text><rect x="470" y="166" width="70" height="28" rx="7" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.2"/><text x="505" y="184.32" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">403</text><text x="550" y="185" font-size="11" font-weight="400" fill="#b0273f" text-anchor="start">wrong region</text><rect x="14" y="200" width="110" height="28" rx="7" fill="#faf3e3" stroke="#5e5241" stroke-width="1.2"/><text x="24" y="218.14" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start">GCP APAC</text><rect x="132" y="200" width="330" height="28" rx="7" fill="#fffdf8" stroke="#5e5241" stroke-width="1.2"/><text x="142" y="218.14" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">apac.api.smith.langchain.com</text><rect x="470" y="200" width="70" height="28" rx="7" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.2"/><text x="505" y="218.32" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">403</text><text x="550" y="219" font-size="11" font-weight="400" fill="#b0273f" text-anchor="start">wrong region</text><rect x="14" y="234" width="110" height="28" rx="7" fill="#faf3e3" stroke="#5e5241" stroke-width="1.2"/><text x="24" y="252.14" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start">AWS US</text><rect x="132" y="234" width="330" height="28" rx="7" fill="#fffdf8" stroke="#5e5241" stroke-width="1.2"/><text x="142" y="252.14" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">aws.api.smith.langchain.com</text><rect x="470" y="234" width="70" height="28" rx="7" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="505" y="252.32" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">200</text><text x="550" y="253" font-size="11" font-weight="400" fill="#5e5241" text-anchor="start">the account's region</text><rect x="14" y="276" width="692" height="70" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.3"/><text x="360" y="300" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">Fix: load .env, and point OTEL_EXPORTER_OTLP_ENDPOINT at the account's region:</text><text x="360" y="324" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">https://aws.api.smith.langchain.com/otel  →  no errors; project strands-agents-demo appeared</text></svg>

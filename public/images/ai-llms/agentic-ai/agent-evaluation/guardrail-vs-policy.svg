<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Guardrails check words; policy checks actions</title><desc>The agent loop: a user message goes to the model, the model asks for a tool call, the tool runs, and the model answers. Bedrock Guardrails sit on the text going into and out of the model: user input, system prompt and the model's reply. According to the Converse API docs, they don't evaluate the tool-call arguments the model generates, the tool results or the tool definitions. AgentCore Policy sits on the gateway in front of the tool and checks every tool call against Cedar rules before it runs.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="330" fill="#fffdf8"/><rect x="14" y="110" width="110" height="60" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="69" y="137.075" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">user</text><text x="69" y="153.195" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">message</text><rect x="196" y="100" width="140" height="80" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="266" y="130.25" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">model</text><text x="266" y="146.37" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">decides to answer</text><text x="266" y="160.02" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">or call a tool</text><rect x="500" y="100" width="206" height="80" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="603" y="130.25" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">tool</text><text x="603" y="146.37" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">process_refund(</text><text x="603" y="160.02" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">customer_id, amount)</text><line x1="126" y1="140" x2="194" y2="140" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><line x1="338" y1="130" x2="498" y2="130" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><text x="418" y="122" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">tool call: amount=50000</text><line x1="498" y1="152" x2="338" y2="152" stroke="#5e5241" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah-4f5d36)"/><text x="418" y="166" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">tool result</text><rect x="140" y="30" width="250" height="52" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="265" y="50" font-size="13" font-weight="700" fill="#b0273f" text-anchor="middle">Bedrock Guardrails</text><text x="265" y="68" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">input text and the model's reply</text><line x1="160" y1="82" x2="160" y2="134" stroke="#b0273f" stroke-width="1.4" stroke-dasharray="4 3"/><line x1="316" y1="82" x2="316" y2="100" stroke="#b0273f" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="400" y="30" width="306" height="52" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="553" y="50" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">AgentCore Policy (Cedar)</text><text x="553" y="68" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">every tool call, at the gateway</text><line x1="640" y1="82" x2="640" y2="98" stroke="#5e5241" stroke-width="1.4" stroke-dasharray="4 3"/><text x="14" y="214" font-size="12.5" font-weight="700" fill="#9a5400" text-anchor="start">What a guardrail sees with tools (Converse API docs)</text><rect x="14" y="224" width="420" height="21" rx="7" fill="#faf3e3" stroke="#5e5241" stroke-width="1.2"/><text x="24" y="238.46" font-size="11" font-weight="400" fill="#2f281e" text-anchor="start">user input, system prompt, model reply</text><rect x="440" y="224" width="60" height="21" rx="7" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="470" y="238.46" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">Yes</text><rect x="14" y="249" width="420" height="21" rx="7" fill="#faf3e3" stroke="#5e5241" stroke-width="1.2"/><text x="24" y="263.46" font-size="11" font-weight="400" fill="#2f281e" text-anchor="start">tool-call arguments the model generates</text><rect x="440" y="249" width="60" height="21" rx="7" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.2"/><text x="470" y="263.46" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">No</text><rect x="14" y="274" width="420" height="21" rx="7" fill="#faf3e3" stroke="#5e5241" stroke-width="1.2"/><text x="24" y="288.46" font-size="11" font-weight="400" fill="#2f281e" text-anchor="start">tool results your code returns</text><rect x="440" y="274" width="60" height="21" rx="7" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.2"/><text x="470" y="288.46" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">No</text><rect x="14" y="299" width="420" height="21" rx="7" fill="#faf3e3" stroke="#5e5241" stroke-width="1.2"/><text x="24" y="313.46" font-size="11" font-weight="400" fill="#2f281e" text-anchor="start">tool definitions you send</text><rect x="440" y="299" width="60" height="21" rx="7" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.2"/><text x="470" y="313.46" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">No</text><text x="520" y="262" font-size="12" font-weight="700" fill="#9a5400" text-anchor="start">Say vs do:</text><text x="520" y="282" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start">guardrails for words,</text><text x="520" y="300" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start">policy for actions.</text></svg>

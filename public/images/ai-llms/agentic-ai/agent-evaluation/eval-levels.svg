<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>What an evaluator scores</title><desc>One session of the travel agent, id 7c5ea8d1, holds four traces, one per prompt: flights, a hotel, the weather and an out-of-scope Python question. Each trace holds model calls and, for the first three, one tool call. Session-level evaluators such as Goal Success Rate read the whole conversation. Trace-level evaluators such as Correctness, Helpfulness and the custom travel judge score each turn. Tool-call evaluators such as Tool Selection Accuracy score each tool call. The judge is a Bedrock model reading the spans from CloudWatch.</desc><defs></defs><rect width="720" height="340" fill="#fffdf8"/><rect x="10" y="10" width="700" height="230" rx="14" fill="#faf3e3" stroke="#9a5400" stroke-width="1.6"/><text x="24" y="32" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">session 7c5ea8d1…  (one conversation)</text><rect x="22" y="44" width="162" height="150" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.3"/><text x="103" y="64" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">trace 1</text><text x="103" y="82" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">flights NY → London</text><rect x="32" y="94" width="142" height="24" rx="7" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="103" y="109.78" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">model call</text><rect x="28" y="124" width="150" height="24" rx="7" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.2"/><text x="103" y="139.168" font-size="8.8" font-weight="400" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">get_flight_info</text><rect x="32" y="154" width="142" height="24" rx="7" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="103" y="169.78" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">model call</text><rect x="194" y="44" width="162" height="150" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.3"/><text x="275" y="64" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">trace 2</text><text x="275" y="82" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">mid-range hotel, Paris</text><rect x="204" y="94" width="142" height="24" rx="7" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="275" y="109.78" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">model call</text><rect x="200" y="124" width="150" height="24" rx="7" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.2"/><text x="275" y="139.168" font-size="8.8" font-weight="400" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">get_hotel_recommendations</text><rect x="204" y="154" width="142" height="24" rx="7" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="275" y="169.78" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">model call</text><rect x="366" y="44" width="162" height="150" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.3"/><text x="447" y="64" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">trace 3</text><text x="447" y="82" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">weather in London</text><rect x="376" y="94" width="142" height="24" rx="7" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="447" y="109.78" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">model call</text><rect x="372" y="124" width="150" height="24" rx="7" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.2"/><text x="447" y="139.168" font-size="8.8" font-weight="400" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">get_weather_forecast</text><rect x="376" y="154" width="142" height="24" rx="7" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="447" y="169.78" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">model call</text><rect x="538" y="44" width="162" height="150" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.3"/><text x="619" y="64" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">trace 4</text><text x="619" y="82" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">a Python sort script</text><rect x="548" y="94" width="142" height="24" rx="7" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="619" y="109.78" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">model call</text><text x="619" y="142" font-size="10.5" font-weight="400" fill="#b0273f" text-anchor="middle" font-style="italic">no tool: a refusal</text><text x="360" y="222" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">the judge reads these spans from CloudWatch (wait ~3 minutes after the last call)</text><rect x="10" y="252" width="226" height="76" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="123" y="280.25" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">SESSION</text><text x="123" y="296.37" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">the whole conversation</text><text x="123" y="310.02" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">GoalSuccessRate</text><rect x="247" y="252" width="226" height="76" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="360" y="280.25" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">TRACE</text><text x="360" y="296.37" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">each question and answer</text><text x="360" y="310.02" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Correctness, Helpfulness, custom</text><rect x="484" y="252" width="226" height="76" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="597" y="280.25" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">TOOL_CALL</text><text x="597" y="296.37" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">each tool call</text><text x="597" y="310.02" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">ToolSelectionAccuracy</text></svg>

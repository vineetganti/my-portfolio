<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>three gulfs</title><desc>The three gulfs between a developer, the data and the model. Comprehension, between developer and data: you haven't looked at what users actually ask. Specification, from developer to model: what you want is loosely written in the prompt, as in prompt Version 1, 'Answer the question.' Generalization, from data to model: the model behaves differently on inputs it hasn't seen, such as a question about a supplier that is really a reorder question. Evals exist to find which gulf a failure fell into.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="320" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Three gulfs where agent mistakes come from</text><rect x="40" y="70" width="160" height="56" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="120" y="102.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">developer</text><rect x="280" y="220" width="160" height="56" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="360" y="245.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">data</text><text x="360" y="267.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">what users really ask</text><rect x="520" y="70" width="160" height="56" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="600" y="102.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">model</text><line x1="200" y1="98" x2="518" y2="98" stroke="#5e5241" stroke-width="1.6" marker-start="url(#ah-5e5241)" marker-end="url(#ah-5e5241)"/><line x1="150" y1="126" x2="300" y2="218" stroke="#5e5241" stroke-width="1.6" marker-start="url(#ah-5e5241)" marker-end="url(#ah-5e5241)"/><line x1="570" y1="126" x2="420" y2="218" stroke="#5e5241" stroke-width="1.6" marker-start="url(#ah-5e5241)" marker-end="url(#ah-5e5241)"/><rect x="250" y="38" width="220" height="50" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="360" y="60.27" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">specification</text><text x="360" y="81.41" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">the prompt says too little</text><rect x="40" y="152" width="190" height="50" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="135" y="174.27" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">comprehension</text><text x="135" y="195.41" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">you never read the inputs</text><rect x="490" y="152" width="190" height="50" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="585" y="174.27" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">generalization</text><text x="585" y="195.41" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">new inputs, new errors</text><text x="20" y="292" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Prompt Version 1 ('Answer the question.') against Version 2 (what a good answer contains) is a specification</text><text x="20" y="307.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">experiment.</text></svg>

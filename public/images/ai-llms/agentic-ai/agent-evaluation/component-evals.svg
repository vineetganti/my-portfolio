<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>component evals</title><desc>Four component evals, each built the same way: a small test set with known good answers, run one part of the agent, score each answer, report. The router gets questions with the correct route and is scored on routes. The system prompt, Version 1 against Version 2, is scored by an LLM judge on accuracy, clarity and completeness. Search plus answer is scored on Recall@k without a model, then by a judge on relevance, groundedness and correctness. Tool calling is scored on precision, recall, calls per task, success, latency and cost. A last step checks the judge itself against a second rater with Cohen's kappa.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="330" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Evaluate the parts, not just the whole</text><rect x="20" y="56" width="160" height="110" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="100" y="101.52" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">router</text><text x="100" y="123.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">which specialist?</text><text x="100" y="137.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">scored on routes</text><rect x="192" y="56" width="160" height="110" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="272" y="94.58" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">prompt V1 vs V2</text><text x="272" y="116.22" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">LLM judge:</text><text x="272" y="130.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">accuracy, clarity,</text><text x="272" y="143.94" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">completeness</text><rect x="364" y="56" width="160" height="110" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="444" y="94.58" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">search + answer</text><text x="444" y="116.22" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Recall@k (no model)</text><text x="444" y="130.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">judge: relevance,</text><text x="444" y="143.94" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">groundedness, correct</text><rect x="536" y="56" width="160" height="110" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="616" y="94.58" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">tool calling</text><text x="616" y="116.22" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">precision, recall,</text><text x="616" y="130.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">calls per task,</text><text x="616" y="143.94" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">latency, cost</text><rect x="20" y="196" width="160" height="40" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="100" y="220.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">test set + good answers</text><rect x="192" y="196" width="160" height="40" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="272" y="220.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">run one part</text><line x1="180" y1="216" x2="192" y2="216" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="364" y="196" width="160" height="40" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="444" y="220.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">score each answer</text><line x1="352" y1="216" x2="364" y2="216" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="536" y="196" width="160" height="40" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="616" y="220.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">report + CSV</text><line x1="524" y1="216" x2="536" y2="216" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="20" y="258" width="680" height="40" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="360" y="282.2" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">then check the judge: does a second rater agree beyond chance? (Cohen's kappa)</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>kappa matrix</title><desc>Two LLM judges grading the same 18 answers, the Claude run's prompt-eval answers. Claude's judge passed 10 and failed 8; Groq gpt-oss-20b's judge passed 15 and failed 3. They agreed on 11 of 18: both passed 9, both failed 2. Raw agreement was 61 percent, but agreement expected by chance, given how often each passes, was 54 percent, so Cohen's kappa was 0.16, slight agreement. Most disagreements were answers Claude's judge failed for a missing nuance and Groq's judge passed.</desc><defs></defs><rect width="720" height="330" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Two judges, the same 18 answers: kappa 0.16</text><text x="250" y="64" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">Groq judge: pass</text><text x="430" y="64" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">Groq judge: fail</text><text x="150" y="104" font-size="12" font-weight="700" fill="#2f281e" text-anchor="end">Claude: pass</text><text x="150" y="174" font-size="12" font-weight="700" fill="#2f281e" text-anchor="end">Claude: fail</text><rect x="170" y="76" width="160" height="56" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="250" y="110.3" font-size="18" font-weight="700" fill="#2f281e" text-anchor="middle">9</text><rect x="350" y="76" width="160" height="56" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="430" y="110.3" font-size="18" font-weight="700" fill="#2f281e" text-anchor="middle">1</text><rect x="170" y="146" width="160" height="56" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="250" y="180.3" font-size="18" font-weight="700" fill="#2f281e" text-anchor="middle">6</text><rect x="350" y="146" width="160" height="56" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="430" y="180.3" font-size="18" font-weight="700" fill="#2f281e" text-anchor="middle">2</text><rect x="540" y="76" width="160" height="126" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="620" y="115.66" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">agreement</text><text x="620" y="137.29" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">raw 61%</text><text x="620" y="151.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">by chance 54%</text><text x="620" y="165.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">kappa 0.16</text><text x="620" y="178.87" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">'slight'</text><text x="20" y="230" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Kappa = (observed − chance) / (1 − chance). The Groq judge passes almost everything (15 of 18), so agreeing with</text><text x="20" y="245.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">it is easy by chance; what is left over is little more than luck.</text><text x="20" y="290" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Run with the course's judge_agreement.py; the 'human' column held the second LLM judge, not a person.</text></svg>

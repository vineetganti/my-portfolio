<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Three questions for an agent in production</title><desc>Three panels. Observe: what is the agent doing? Traces and spans, sent through OpenTelemetry to the console, Jaeger, Langfuse, LangSmith or CloudWatch. Evaluate: is it doing it well? An LLM judge scores sessions, traces and tool calls with built-in or custom evaluators. Govern: is it allowed to? Bedrock Guardrails filter what the agent says, and AgentCore Policy with Cedar rules decides which tool calls it may make. Footer: traces feed the evaluations, and both feed governance.</desc><defs><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a5400"/></marker></defs><rect width="720" height="300" fill="#fffdf8"/><rect x="10" y="10" width="226" height="222" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="123" y="34" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Observe</text><text x="123" y="51" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">what is it doing?</text><rect x="22" y="58" width="202" height="30" rx="7" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="123" y="77.14" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="middle">traces and spans</text><rect x="22" y="98" width="202" height="30" rx="7" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><text x="123" y="117.14" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="middle">OpenTelemetry</text><rect x="22" y="138" width="202" height="30" rx="7" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="123" y="157.14" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="middle">five places to read them</text><rect x="22" y="178" width="202" height="30" rx="7" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><text x="123" y="197.14" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="middle">console to CloudWatch</text><line x1="237" y1="30" x2="246" y2="30" stroke="#9a5400" stroke-width="1.6" marker-end="url(#ah-8a5a00)"/><rect x="247" y="10" width="226" height="222" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="34" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Evaluate</text><text x="360" y="51" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">is it doing it well?</text><rect x="259" y="58" width="202" height="30" rx="7" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="360" y="77.14" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="middle">LLM-as-a-judge</text><rect x="259" y="98" width="202" height="30" rx="7" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><text x="360" y="117.14" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="middle">session, trace, tool call</text><rect x="259" y="138" width="202" height="30" rx="7" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="360" y="157.14" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="middle">built-in evaluators</text><rect x="259" y="178" width="202" height="30" rx="7" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><text x="360" y="197.14" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="middle">custom rubrics</text><line x1="474" y1="30" x2="483" y2="30" stroke="#9a5400" stroke-width="1.6" marker-end="url(#ah-8a5a00)"/><rect x="484" y="10" width="226" height="222" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="597" y="34" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Govern</text><text x="597" y="51" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">is it allowed to?</text><rect x="496" y="58" width="202" height="30" rx="7" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="597" y="77.14" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="middle">Guardrails: what it says</text><rect x="496" y="98" width="202" height="30" rx="7" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><text x="597" y="117.14" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="middle">Policy: what it does</text><rect x="496" y="138" width="202" height="30" rx="7" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="597" y="157.14" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="middle">Cedar rules</text><rect x="496" y="178" width="202" height="30" rx="7" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><text x="597" y="197.14" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="middle">default deny</text><rect x="10" y="244" width="700" height="44" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.3"/><text x="360" y="271" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">The traces you collect to observe are the same data the judges read to evaluate.</text></svg>

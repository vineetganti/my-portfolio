<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>AgentCore Policy in front of a refund tool</title><desc>An agent or a direct MCP call reaches the AgentCore Gateway, which asks the policy engine before calling the Lambda refund tool. The engine holds two Cedar policies: permit the refund tool, and forbid it when context.input.amount is over 1,000. It is default-deny and forbid wins. Results: before the policy, $500 and $50,000 both processed. After attaching it in ENFORCE mode, $500 succeeded and $50,000 was denied with Tool Execution Denied, naming the ForbidLargeRefunds policy. The first attempt to create the permit failed validation as overly permissive.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d36"/></marker></defs><rect width="720" height="360" fill="#ffffff"/><rect x="14" y="30" width="120" height="60" rx="10" fill="#ffffff" stroke="#4f5d36" stroke-width="1.5"/><text x="74" y="57.075" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">agent or</text><text x="74" y="73.195" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">MCP client</text><line x1="136" y1="60" x2="166" y2="60" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="168" y="30" width="140" height="60" rx="10" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="238" y="57.075" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">AgentCore</text><text x="238" y="73.195" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">Gateway</text><line x1="310" y1="60" x2="340" y2="60" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="342" y="14" width="220" height="94" rx="12" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.6"/><text x="452" y="34" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">policy engine (ENFORCE)</text><rect x="352" y="44" width="200" height="24" rx="7" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="452" y="59.96" font-size="11" font-weight="400" fill="#2c361c" text-anchor="middle">permit: refund tool</text><rect x="352" y="74" width="200" height="24" rx="7" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.2"/><text x="452" y="89.96" font-size="11" font-weight="400" fill="#2c361c" text-anchor="middle">forbid: amount &gt; 1000</text><line x1="564" y1="60" x2="594" y2="60" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><text x="579" y="52" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">allow</text><rect x="596" y="30" width="110" height="60" rx="10" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.5"/><text x="651" y="57.4" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">Lambda</text><text x="651" y="73.52" font-size="10" font-weight="400" fill="#4f5d36" text-anchor="middle">process_refund</text><text x="452" y="126" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">default deny · forbid wins · decisions logged to CloudWatch</text><text x="14" y="160" font-size="12.5" font-weight="700" fill="#8a5a00" text-anchor="start">What the run returned</text><text x="330" y="182" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">$500</text><text x="520" y="182" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">$50,000</text><rect x="14" y="192" width="220" height="30" rx="7" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.2"/><text x="24" y="211.14" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="start">no policy attached</text><rect x="240" y="192" width="180" height="30" rx="7" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="330" y="210.96" font-size="11" font-weight="700" fill="#2c361c" text-anchor="middle">SUCCESS</text><rect x="430" y="192" width="226" height="30" rx="7" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.2"/><text x="543" y="210.96" font-size="11" font-weight="700" fill="#2c361c" text-anchor="middle">SUCCESS</text><rect x="14" y="228" width="220" height="30" rx="7" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.2"/><text x="24" y="247.14" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="start">policy in ENFORCE mode</text><rect x="240" y="228" width="180" height="30" rx="7" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="330" y="246.96" font-size="11" font-weight="700" fill="#2c361c" text-anchor="middle">SUCCESS</text><rect x="430" y="228" width="226" height="30" rx="7" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.2"/><text x="543" y="246.96" font-size="11" font-weight="700" fill="#2c361c" text-anchor="middle">DENIED by ForbidLargeRefunds</text><rect x="14" y="274" width="692" height="74" rx="10" fill="#f6ebc4" stroke="#8a5a00" stroke-width="1.3"/><text x="360" y="296" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">First attempt: the bare permit was CREATE_FAILED, "Overly Permissive"</text><text x="360" y="316" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">(it would allow every IAM and OAuth principal). Re-running the cell then hit ConflictException.</text><text x="360" y="336" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">Fixed by reusing the engine and creating the policies with validationMode=IGNORE_ALL_FINDINGS.</text></svg>

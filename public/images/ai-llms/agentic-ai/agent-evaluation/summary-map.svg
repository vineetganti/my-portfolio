<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 302" width="720" height="302" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>At a glance: evaluating, observing and governing agents</title><desc>A map of the post in four columns. Traces: a trace per question, a span per step, OpenTelemetry, one provider per process. Where to read them: console and Jaeger, Langfuse and LangSmith, CloudWatch with Transaction Search, and the right region and host. Evaluate: LLM-as-a-judge, session, trace and tool levels, built-in versus custom, test cases that can fail. Govern: guardrails for words, policy for actions, Cedar default deny, forbid wins.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d36"/></marker></defs><rect width="720" height="302" fill="#ffffff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#2c361c" text-anchor="start">At a glance: evaluating, observing and governing agents</text><rect x="10" y="44" width="161.5" height="192" rx="14" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="90.75" y="71" font-size="13.5" font-weight="700" fill="#2c361c" text-anchor="middle">Traces</text><rect x="20" y="88" width="141.5" height="28" rx="8" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.1"/><text x="90.75" y="106.5" font-size="11" font-weight="400" fill="#2c361c" text-anchor="middle">a trace per question</text><rect x="20" y="124" width="141.5" height="28" rx="8" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.1"/><text x="90.75" y="142.5" font-size="11" font-weight="400" fill="#2c361c" text-anchor="middle">a span per step</text><rect x="20" y="160" width="141.5" height="28" rx="8" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.1"/><text x="90.75" y="178.5" font-size="11" font-weight="400" fill="#2c361c" text-anchor="middle">OpenTelemetry</text><rect x="20" y=
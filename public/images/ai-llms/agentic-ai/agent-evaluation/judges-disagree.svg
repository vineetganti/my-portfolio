<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>judges disagree</title><desc>The same eval code scored by two different judges. Prompt evals: with Groq gpt-oss-20b as the judge, Version 1 passed 100 percent and Version 2 85 percent, so the improved prompt looked worse; with Claude Haiku 5.5 as the judge, Version 1 passed 67 percent and Version 2 89 percent. Each judge graded the answers written by its own provider. RAG evals: Recall@k was identical for both runs, 50, 60 and 80 percent for k of 1, 2 and 3, because retrieval is local; but the Groq judge picked configuration B as best at 93 percent and the Claude judge picked C at 80 percent, marking no answer in A or B as grounded.</desc><defs></defs><rect width="720" height="330" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Same evals, two judges, two conclusions</text><text x="20" y="62" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">Prompt evals: overall pass rate</text><rect x="20" y="72" width="330" height="70" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="185" y="97.52" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">judge: Groq gpt-oss-20b</text><text x="185" y="119.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">V1 100%  ·  V2 85%</text><text x="185" y="133.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">'the new prompt is worse'</text><rect x="370" y="72" width="330" height="70" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="535" y="97.52" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">judge: Claude Haiku 5.5</text><text x="535" y="119.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">V1 67%  ·  V2 89%</text><text x="535" y="133.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">'the new prompt is better'</text><text x="20" y="176" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">RAG evals: same retrieval, different winner</text><rect x="20" y="186" width="220" height="70" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="130" y="211.51" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Recall@k, no model</text><text x="130" y="233.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">k=1 50% · k=2 60%</text><text x="130" y="247.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">k=3 80% (both runs)</text><rect x="250" y="186" width="220" height="70" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="360" y="211.51" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Groq judge</text><text x="360" y="233.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">best: B (k=2), 93%</text><text x="360" y="247.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">grounded 40/80/80%</text><rect x="480" y="186" width="220" height="70" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="590" y="211.51" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Claude judge</text><text x="590" y="233.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">best: C (k=3), 80%</text><text x="590" y="247.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">grounded 0/0/40%</text><text x="20" y="278" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Each judge graded its own provider's answers, so model and judge are confounded here; the next diagram puts both</text><text x="20" y="293.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">judges on the same answers.</text></svg>

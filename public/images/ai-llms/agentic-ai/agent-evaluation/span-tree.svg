<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>The spans Strands emits for one question</title><desc>A waterfall from the console-tracing run, 5.8 seconds in total. The root span, invoke_agent, has 3,952 input and 255 output tokens. Under it, cycle 1 holds a chat span, the model call, of 2.9 seconds with 1,916 input and 102 output tokens, then execute_tool calculator, 16 milliseconds. Cycle 2 holds a second chat span of 2.9 seconds with 2,036 input and 153 output tokens, which writes the final answer. The second call's input is larger because it resends the tool result.</desc><defs></defs><rect width="720" height="360" fill="#fffdf8"/><text x="14" y="22" font-size="11.5" font-weight="700" fill="#5e5241" text-anchor="start">span (indent = parent)</text><text x="300" y="22" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">0 s</text><line x1="368.799" y1="30" x2="368.799" y2="268" stroke="#e7dcc5" stroke-width="1" stroke-dasharray="3 3"/><text x="368.799" y="22" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">1 s</text><line x1="437.599" y1="30" x2="437.599" y2="268" stroke="#e7dcc5" stroke-width="1" stroke-dasharray="3 3"/><text x="437.599" y="22" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">2 s</text><line x1="506.398" y1="30" x2="506.398" y2="268" stroke="#e7dcc5" stroke-width="1" stroke-dasharray="3 3"/><text x="506.398" y="22" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">3 s</text><line x1="575.198" y1="30" x2="575.198" y2="268" stroke="#e7dcc5" stroke-width="1" stroke-dasharray="3 3"/><text x="575.198" y="22" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">4 s</text><line x1="643.997" y1="30" x2="643.997" y2="268" stroke="#e7dcc5" stroke-width="1" stroke-dasharray="3 3"/><text x="643.997" y="22" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">5 s</text><text x="14" y="54" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">invoke_agent Strands Agents</text><rect x="300" y="40" width="400" height="22" rx="5" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><text x="500" y="55.5" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">3,952 in / 255 out</text><text x="32" y="92" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">execute_event_loop_cycle</text><rect x="300" y="78" width="202.683" height="22" rx="5" fill="#faf3e3" stroke="#5e5241" stroke-width="1.2"/><text x="401.342" y="93.5" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">cycle 1</text><text x="50" y="130" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">chat</text><rect x="300.069" y="116" width="201.238" height="22" rx="5" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="400.688" y="131.5" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">1,916 in / 102 out</text><text x="50" y="168" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">execute_tool calculator</text><rect x="501.514" y="154" width="4" height="22" rx="5" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.2"/><text x="508.614" y="169.5" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start">16 ms</text><text x="32" y="206" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">execute_event_loop_cycle</text><rect x="502.683" y="192" width="197.248" height="22" rx="5" fill="#faf3e3" stroke="#5e5241" stroke-width="1.2"/><text x="601.307" y="207.5" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">cycle 2</text><text x="50" y="244" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">chat</text><rect x="502.752" y="230" width="197.179" height="22" rx="5" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="601.342" y="245.5" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">2,036 in / 153 out</text><rect x="14" y="282" width="692" height="64" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.3"/><text x="360" y="304" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">One trace = one question. Each reasoning loop is a cycle; each model call is a chat span.</text><text x="360" y="326" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="middle">Call 2 reads 2,036 tokens, not 1,916: it resends the tool result. Tokens on the root add up the calls.</text></svg>

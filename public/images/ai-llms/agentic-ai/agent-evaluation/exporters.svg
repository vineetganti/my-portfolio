<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>One agent, five places to read its spans</title><desc>A Strands agent creates spans through OpenTelemetry. One tracer provider per process decides where they go. The console exporter prints them. The OTLP exporter sends them to Jaeger on localhost port 4318, or to LangSmith's HTTPS endpoint with an API key header, or to an OpenTelemetry Collector that fans out to Datadog and Langfuse. The Langfuse SDK registers itself as the tracer provider. ADOT, the AWS Distro for OpenTelemetry, sends them to CloudWatch, and AgentCore Runtime does that automatically.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d36"/></marker></defs><rect width="720" height="330" fill="#ffffff"/><rect x="14" y="120" width="150" height="70" rx="10" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.5"/><text x="89" y="145.25" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">Strands agent</text><text x="89" y="161.37" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">spans via</text><text x="89" y="175.02" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">OpenTelemetry</text><rect x="190" y="110" width="150" height="90" rx="10" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="265" y="138.125" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">one tracer provider</text><text x="265" y="153.005" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">per Python process</text><text x="265" y="166.655" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">(fresh kernel per</text><text x="265" y="180.305" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">notebook)</text><line x1="166" y1="155" x2="188" y2="155" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="392" y="14" width="120" height="50" rx="10" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.5"/><text x="452" y="42.9" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">console</text><text x="522" y="35" font-size="11" font-weight="400" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">setup_console_exporter()</text><text x="522" y="52" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="start">JSON spans on stdout</text><path d="M 342 155 C 366 155 366 39 390 39" fill="none" stroke="#4f5d36" stroke-width="1.4" marker-end="url(#ah-4f5d36)" stroke-linejoin="round" stroke-linecap="round"/><rect x="392" y="76" width="120" height="50" rx="10" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.5"/><text x="452" y="104.9" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">Jaeger</text><text x="522" y="97" font-size="11" font-weight="400" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">OTLP to localhost:4318</text><text x="522" y="114" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="start">waterfall UI on :16686</text><path d="M 342 155 C 366 155 366 101 390 101" fill="none" stroke="#4f5d36" stroke-width="1.4" marker-end="url(#ah-4f5d36)" stroke-linejoin="round" stroke-linecap="round"/><rect x="392" y="138" width="120" height="50" rx="10" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.5"/><text x="452" y="166.9" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">Langfuse</text><text x="522" y="159" font-size="11" font-weight="400" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">the SDK is the provider</text><text x="522" y="176" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="start">costs, sessions, users</text><path d="M 342 155 C 366 155 366 163 390 163" fill="none" stroke="#4f5d36" stroke-width="1.4" marker-end="url(#ah-4f5d36)" stroke-linejoin="round" stroke-linecap="round"/><rect x="392" y="200" width="120" height="50" rx="10" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.5"/><text x="452" y="228.9" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">LangSmith</text><text x="522" y="221" font-size="11" font-weight="400" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">OTLP + x-api-key header</text><text x="522" y="238" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="start">run tree, datasets</text><path d="M 342 155 C 366 155 366 225 390 225" fill="none" stroke="#4f5d36" stroke-width="1.4" marker-end="url(#ah-4f5d36)" stroke-linejoin="round" stroke-linecap="round"/><rect x="392" y="262" width="120" height="50" rx="10" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.5"/><text x="452" y="290.9" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">CloudWatch</text><text x="522" y="283" font-size="11" font-weight="400" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ADOT or AgentCore Runtime</text><text x="522" y="300" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="start">aws/spans, GenAI views</text><path d="M 342 155 C 366 155 366 287 390 287" fill="none" stroke="#4f5d36" stroke-width="1.4" marker-end="url(#ah-4f5d36)" stroke-linejoin="round" stroke-linecap="round"/><text x="14" y="236" font-size="12" font-weight="700" fill="#8a5a00" text-anchor="start">Langfuse and ADOT can't</text><text x="14" y="256" font-size="12" font-weight="700" fill="#8a5a00" text-anchor="start">share one process:</text><text x="14" y="280" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="start">both want to be the provider,</text><text x="14" y="298" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="start">so the Langfuse version of</text><text x="14" y="316" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="start">the agent is its own script.</text></svg>

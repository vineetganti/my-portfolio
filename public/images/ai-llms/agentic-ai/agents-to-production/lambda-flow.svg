<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>The contract agent on Lambda</title><desc>Top: curl sends a POST to API Gateway at /Prod/analyze, which has no authentication and times out after 29 seconds. API Gateway invokes a Lambda function packaged as a container image, which can run for up to 15 minutes, and the function calls Bedrock. Bottom: a cold start loads the image, imports the code and creates the model once at module level before the handler runs. A warm call skips straight to the handler, which builds a fresh Agent for every request so no caller sees another's history.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker></defs><rect width="720" height="330" fill="#ffffff"/><rect x="14" y="30" width="100" height="56" rx="10" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.5"/><text x="64" y="55.075" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">curl</text><text x="64" y="71.195" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">POST JSON</text><line x1="116" y1="58" x2="150" y2="58" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="152" y="22" width="168" height="72" rx="10" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="236" y="41.425" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">API Gateway</text><text x="236" y="57.545" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">REST API, /Prod/analyze</text><text x="236" y="71.195" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">no auth in the demo</text><text x="236" y="84.845" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">29 s timeout</text><line x1="322" y1="58" x2="356" y2="58" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="358" y="22" width="196" height="72" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="456" y="41.425" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">Lambda</text><text x="456" y="57.545" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">container image, x86_64</text><text x="456" y="71.195" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">1 GB memory</text><text x="456" y="84.845" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">15 min maximum</text><line x1="556" y1="58" x2="590" y2="58" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="592" y="30" width="114" height="56" rx="10" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.5"/><text x="649" y="55.075" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">Bedrock</text><text x="649" y="71.195" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">Sonnet 4.6</text><text x="14" y="134" font-size="12.5" font-weight="700" fill="#8a5a00" text-anchor="start">What one invocation costs in time</text><text x="14" y="164" font-size="12" font-weight="700" fill="#3a3226" text-anchor="start">cold</text><rect x="64" y="150" width="150" height="22" rx="5" fill="#f7e0da" stroke="#a3283f" stroke-width="1.1"/><text x="139" y="165" font-size="10.5" font-weight="400" fill="#3a3226" text-anchor="middle">load image, import</text><rect x="214" y="150" width="110" height="22" rx="5" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="269" y="165" font-size="10.5" font-weight="400" fill="#3a3226" text-anchor="middle">create model</text><rect x="324" y="150" width="260" height="22" rx="5" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="454" y="165" font-size="10.5" font-weight="400" fill="#3a3226" text-anchor="middle">handler: new Agent, call the model</text><text x="14" y="208" font-size="12" font-weight="700" fill="#3a3226" text-anchor="start">warm</text><rect x="324" y="194" width="260" height="22" rx="5" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="454" y="209" font-size="10.5" font-weight="400" fill="#3a3226" text-anchor="middle">handler: new Agent, call the model</text><line x1="64" y1="236" x2="324" y2="236" stroke="#8a5a00" stroke-width="1.3"/><line x1="64" y1="236" x2="64" y2="230" stroke="#8a5a00" stroke-width="1.3"/><line x1="324" y1="236" x2="324" y2="230" stroke="#8a5a00" stroke-width="1.3"/><text x="194" y="251.5" font-size="11.5" font-weight="700" fill="#8a5a00" text-anchor="middle">paid once per container</text><rect x="14" y="274" width="692" height="44" rx="10" fill="#f6e9c8" stroke="#8a5a00" stroke-width="1.3"/><text x="360" y="293" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">Module level: things worth reusing (the model client).</text><text x="360" y="310" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="middle">Inside the handler: things that must not leak between callers (the Agent and its history).</text></svg>

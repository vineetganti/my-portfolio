<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 302" width="720" height="302" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>At a glance: shipping agents to production</title><desc>A map of the post in four columns. Choose a home: Lambda per request, ECS always on, AgentCore per session, the workload decides. AgentCore Runtime: four lines of code, CodeBuild builds ARM64, a microVM per session, destroy and check leftovers. Lambda and ECS: model at module level and agent per call, 29 and 15 minute limits, ALB and two security groups, execution role versus task role. Gateway, Identity and A2A: OpenAPI becomes MCP tools, inbound and outbound auth, three runtimes behind JWT, and Windows path rewriting.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker></defs><rect width="720" height="302" fill="#ffffff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#3a3226" text-anchor="start">At a glance: shipping agents to production</text><rect x="10" y="44" width="161.5" height="192" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="90.75" y="71" font-size="13.5" font-weight="700" fill="#3a3226" text-anchor="middle">Choose a home</text><rect x="20" y="88" width="141.5" height="28" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="90.75" y="106.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">Lambda: per request</text><rect x="20" y="124" width="141.5" height="28" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="90.75" y="142.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">ECS: always on</text><rect x="20" y="160" width="141.5" height="28" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="90.75" y="178.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">AgentCore: per session</text><rect x="20" y="196" width="141.5" height="28" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="90.75" y="214.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">the workload decides</text><line x1="173.5" y1="66" x2="187.5" y2="66" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="189.5" y="44" width="161.5" height="192" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="270.25" y="71" font-size="13.5" font-weight="700" fill="#3a3226" text-anchor="middle">AgentCore Runtime</text><rect x="199.5" y="88" width="141.5" height="28" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="270.25" y="106.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">4 lines of boilerplate</text><rect x="199.5" y="124" width="141.5" height="28" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="270.25" y="142.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">CodeBuild builds ARM64</text><rect x="199.5" y="160" width="141.5" height="28" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="270.25" y="178.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">a microVM per session</text><rect x="199.5" y="196" width="141.5" height="28" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="270.25" y="214.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">destroy, then check</text><line x1="353" y1="66" x2="367" y2="66" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="369" y="44" width="161.5" height="192" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="449.75" y="71" font-size="13.5" font-weight="700" fill="#3a3226" text-anchor="middle">Lambda and ECS</text><rect x="379" y="88" width="141.5" height="28" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="449.75" y="106.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">agent per call</text><rect x="379" y="124" width="141.5" height="28" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="449.75" y="142.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">29 s and 15 min limits</text><rect x="379" y="160" width="141.5" height="28" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="449.75" y="178.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">two security groups</text><rect x="379" y="196" width="141.5" height="28" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="449.75" y="214.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">execution vs task role</text><line x1="532.5" y1="66" x2="546.5" y2="66" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="548.5" y="44" width="161.5" height="192" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="629.25" y="71" font-size="13.5" font-weight="700" fill="#3a3226" text-anchor="middle">Beyond one agent</text><rect x="558.5" y="88" width="141.5" height="28" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="629.25" y="106.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">OpenAPI to MCP tools</text><rect x="558.5" y="124" width="141.5" height="28" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="629.25" y="142.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">inbound vs outbound</text><rect x="558.5" y="160" width="141.5" height="28" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="629.25" y="178.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">3 runtimes behind JWT</text><rect x="558.5" y="196" width="141.5" height="28" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="629.25" y="214.5" font-size="11" font-weight="400" 
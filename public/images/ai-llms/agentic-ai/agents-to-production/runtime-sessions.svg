<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Sessions on AgentCore Runtime</title><desc>Left: three callers, each with their own session id, reach one runtime endpoint, and each session gets its own microVM with its own CPU, memory and filesystem. Right: a session's life. Active while it handles a request, idle while it waits for the next one, with CPU not billed but memory billed. It ends after 15 minutes idle, after 8 hours in total, or when you call stop_runtime_session, and the microVM is then terminated and its memory sanitised.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a5400"/></marker></defs><rect width="720" height="330" fill="#fffdf8"/><rect x="10" y="10" width="330" height="310" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="175" y="34" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">One endpoint, one microVM per session</text><rect x="24" y="58" width="100" height="52" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="74" y="81.1" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">caller 1</text><text x="74" y="95.98" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">session a1b2…</text><line x1="126" y1="84" x2="196" y2="84" stroke="#5e5241" stroke-width="1.5" marker-end="url(#ah-4f5d36)"/><rect x="198" y="58" width="128" height="52" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="262" y="81.1" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">microVM 1</text><text x="262" y="95.98" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">own CPU, memory, disk</text><rect x="24" y="142" width="100" height="52" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="74" y="165.1" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">caller 2</text><text x="74" y="179.98" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">session c3d4…</text><line x1="126" y1="168" x2="196" y2="168" stroke="#5e5241" stroke-width="1.5" marker-end="url(#ah-4f5d36)"/><rect x="198" y="142" width="128" height="52" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="262" y="165.1" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">microVM 2</text><text x="262" y="179.98" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">own CPU, memory, disk</text><rect x="24" y="226" width="100" height="52" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="74" y="249.1" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">caller 3</text><text x="74" y="263.98" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">session e5f6…</text><line x1="126" y1="252" x2="196" y2="252" stroke="#5e5241" stroke-width="1.5" marker-end="url(#ah-4f5d36)"/><rect x="198" y="226" width="128" height="52" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="262" y="249.1" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">microVM 3</text><text x="262" y="263.98" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">own CPU, memory, disk</text><text x="175" y="312" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">runtimeSessionId: 33 characters or more</text><rect x="356" y="10" width="354" height="310" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="533" y="34" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">The life of one session</text><rect x="376" y="50" width="150" height="50" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="451" y="72.4" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Active</text><text x="451" y="88.52" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">handling a request</text><rect x="376" y="124" width="150" height="50" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="451" y="146.4" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Idle</text><text x="451" y="162.52" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">waiting for the next one</text><rect x="376" y="198" width="150" height="50" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="451" y="220.4" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Terminated</text><text x="451" y="236.52" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">microVM wiped, memory too</text><path d="M 451 100 L 451 122" fill="none" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)" stroke-linejoin="round" stroke-linecap="round"/><path d="M 528 140 C 560 140 560 75 528 75" fill="none" stroke="#9a5400" stroke-width="1.8" marker-end="url(#ah-8a5a00)" stroke-linejoin="round" stroke-linecap="round"/><text x="566" y="106" font-size="11" font-weight="400" fill="#9a5400" text-anchor="start">new request</text><path d="M 451 174 L 451 196" fill="none" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)" stroke-linejoin="round" stroke-linecap="round"/><text x="540" y="182" font-size="11" font-weight="400" fill="#5e5241" text-anchor="start">Active: CPU + memory billed</text><text x="540" y="200" font-size="11" font-weight="400" fill="#5e5241" text-anchor="start">Idle: memory billed, CPU not</text><text x="376" y="270" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="start">Ends after 15 min idle (default)</text><text x="376" y="287" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start">or 8 h in total (default)</text><text x="376" y="304" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start">or stop_runtime_session()</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Git Bash rewrites arguments that look like paths</title><desc>Top: you type aws logs create-log-group with the name /ecs/scheduling-agent. Git Bash, an MSYS shell, sees an argument starting with a slash and rewrites it into a Windows path, C:/Program Files/Git/ecs/scheduling-agent, before aws.exe sees it. CloudWatch rejects it, because a colon and a space are not allowed in a log group name. Bottom: the fixes. Turn the conversion off with MSYS_NO_PATHCONV=1 in Git for Windows, or MSYS2_ARG_CONV_EXCL set to a star in MSYS2. A file URL for a /tmp file needs cygpath -m to become a real Windows path.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d36"/></marker></defs><rect width="720" height="330" fill="#ffffff"/><text x="14" y="24" font-size="12.5" font-weight="700" fill="#8a5a00" text-anchor="start">What happened</text><rect x="14" y="34" width="214" height="64" rx="10" fill="#ffffff" stroke="#4f5d36" stroke-width="1.5"/><text x="121" y="55.45" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">you type</text><text x="121" y="70.95" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">--log-group-name</text><text x="121" y="85.25" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">/ecs/scheduling-agent</text><line x1="230" y1="66" x2="262" y2="66" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="264" y="34" width="190" height="64" rx="10" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.5"/><text x="359" y="55.45" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">Git Bash (MSYS)</text><text x="359" y="70.95" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">looks like a POSIX path,</text><text x="359" y="85.25" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">so rewrite it</text><line x1="456" y1="66" x2="488" y2="66" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="490" y="34" width="216" height="64" rx="10" fill="#ffffff" stroke="#4f5d36" stroke-width="1.5"/><text x="598" y="55.45" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">aws.exe receives</text><text x="598" y="70.95" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">C:/Program Files/Git/</text><text x="598" y="85.25" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">ecs/scheduling-agent</text><text x="706" y="120" font-size="11.5" font-weight="400" fill="#a3283f" text-anchor="end">CloudWatch: ':' and ' ' are not allowed in a log group name</text><text x="14" y="160" font-size="12.5" font-weight="700" fill="#8a5a00" text-anchor="start">The fixes</text><rect x="14" y="172" width="140" height="28" rx="7" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.2"/><text x="24" y="190.14" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="start">Git for Windows</text><rect x="162" y="172" width="330" height="28" rx="7" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="172" y="190.14" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">export MSYS_NO_PATHCONV=1</text><text x="504" y="190.5" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="start">turns the rewrite off</text><rect x="14" y="208" width="140" height="28" rx="7" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.2"/><text x="24" y="226.14" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="start">MSYS2 (UCRT64)</text><rect x="162" y="208" width="330" height="28" rx="7" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="172" y="226.14" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">export MSYS2_ARG_CONV_EXCL='*'</text><text x="504" y="226.5" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="start">turns the rewrite off</text><rect x="14" y="244" width="140" height="28" rx="7" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.2"/><text x="24" y="262.14" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="start">a file:// URL</text><rect x="162" y="244" width="330" height="28" rx="7" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="172" y="262.14" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">file://$(cygpath -m /tmp/task-def.json)</text><text x="504" y="262.5" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="start">a real Windows path</text><rect x="14" y="280" width="140" height="28" rx="7" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.2"/><text x="24" y="298.14" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="start">the // trick</text><rect x="162" y="280" width="330" height="28" rx="7" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.2"/><text x="172" y="298.14" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">//ecs/scheduling-agent</text><text x="504" y="298.5" font-size="11.5" font-weight="400" fill="#a3283f" text-anchor="start">breaks once the rewrite is off</text></svg>

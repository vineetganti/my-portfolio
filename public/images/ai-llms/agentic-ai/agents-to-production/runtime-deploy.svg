<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>What configure and launch do</title><desc>Top row: on your laptop, configure reads agent.py and requirements.txt and writes a Dockerfile and .bedrock_agentcore.yaml. Launch zips the source to an S3 bucket, CodeBuild builds an ARM64 image in about 26 seconds and pushes it to ECR, and AgentCore Runtime starts the agent behind a DEFAULT endpoint. Second row: what launch also creates, a runtime execution role, a CodeBuild role, CloudWatch log groups and X-Ray tracing. Bottom: destroy removed ten resources; the S3 sources bucket and the log groups stay behind.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d36"/></marker></defs><rect width="720" height="360" fill="#ffffff"/><text x="14" y="24" font-size="12.5" font-weight="700" fill="#8a5a00" text-anchor="start">1. configure (on your laptop)</text><rect x="14" y="34" width="150" height="62" rx="10" fill="#ffffff" stroke="#4f5d36" stroke-width="1.5"/><text x="89" y="55.1" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">agent.py</text><text x="89" y="70.6" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">+ requirements.txt</text><text x="89" y="84.25" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">4 lines of AgentCore</text><line x1="166" y1="65" x2="196" y2="65" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="198" y="34" width="196" height="62" rx="10" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.5"/><text x="296" y="55.1" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">writes</text><text x="296" y="70.6" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">Dockerfile, .dockerignore</text><text x="296" y="84.25" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">.bedrock_agentcore.yaml</text><text x="14" y="126" font-size="12.5" font-weight="700" fill="#8a5a00" text-anchor="start">2. launch (in your AWS account)</text><rect x="14" y="136" width="150" height="56" rx="10" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.5"/><text x="89" y="161.075" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">S3 bucket</text><text x="89" y="177.195" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">source.zip</text><line x1="166" y1="164" x2="195" y2="164" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="197" y="136" width="150" height="56" rx="10" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.5"/><text x="272" y="161.075" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">CodeBuild</text><text x="272" y="177.195" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">ARM64 build, 26 s</text><line x1="349" y1="164" x2="378" y2="164" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="380" y="136" width="150" height="56" rx="10" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.5"/><text x="455" y="161.075" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">ECR</text><text x="455" y="177.195" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">the image</text><line x1="532" y1="164" x2="561" y2="164" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="563" y="136" width="150" height="56" rx="10" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.5"/><text x="638" y="161.075" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">Runtime</text><text x="638" y="177.195" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">DEFAULT endpoint</text><text x="14" y="222" font-size="12" font-weight="700" fill="#4f5d36" text-anchor="start">also created on the way</text><rect x="14" y="232" width="165" height="28" rx="7" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.2"/><text x="96.5" y="250.14" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">runtime execution role</text><rect x="189" y="232" width="165" height="28" rx="7" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.2"/><text x="271.5" y="250.14" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">CodeBuild role</text><rect x="364" y="232" width="165" height="28" rx="7" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.2"/><text x="446.5" y="250.14" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">CloudWatch log groups</text><rect x="539" y="232" width="165" height="28" rx="7" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.2"/><text x="621.5" y="250.14" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">X-Ray traces</text><rect x="14" y="280" width="692" height="62" rx="10" fill="#f6ebc4" stroke="#8a5a00" stroke-width="1.3"/><text x="360" y="304" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">3. destroy removed 10 resources: runtime, endpoint, image, repo, CodeBuild, roles</text><text x="360" y="326" font-size="12" font-weight="400" fill="#a3283f" text-anchor="middle">Left behind: the CodeBuild sources bucket and the log groups. Delete them by hand.</text></svg>

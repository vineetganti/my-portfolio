<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>AgentCore Gateway: a REST API as MCP tools</title><desc>A Strands agent with an MCP client talks MCP over Streamable HTTP to AgentCore Gateway. The gateway checks the caller with its inbound authorizer, which is none in the lab and a JWT or IAM in production. It holds a target built from an OpenAPI spec read from S3, which became one tool, WeatherAPI___getForecast. When the tool is called, the gateway fetches the outbound credential from AgentCore Identity and calls the Open-Meteo REST API over HTTPS. Its IAM role lets it read the spec and the key.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d36"/></marker><marker id="ah-7d8257" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7d8257"/></marker></defs><rect width="720" height="340" fill="#ffffff"/><rect x="14" y="60" width="150" height="76" rx="10" fill="#ffffff" stroke="#4f5d36" stroke-width="1.5"/><text x="89" y="88.25" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">Strands agent</text><text x="89" y="104.37" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">MCPClient</text><text x="89" y="118.02" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">list_tools, call_tool</text><line x1="166" y1="98" x2="214" y2="98" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)" marker-start="url(#ah-4f5d36)"/><text x="190" y="90" font-size="11" font-weight="700" fill="#4f5d36" text-anchor="middle">MCP</text><rect x="216" y="18" width="300" height="196" rx="14" fill="#fbf6df" stroke="#8a5a00" stroke-width="1.6"/><text x="366" y="40" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">AgentCore Gateway</text><rect x="230" y="52" width="272" height="28" rx="7" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.2"/><text x="366" y="70.14" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">inbound: NONE (lab) · JWT · IAM</text><rect x="230" y="88" width="272" height="28" rx="7" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="366" y="106.14" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">target: WeatherAPI (from OpenAPI)</text><rect x="230" y="124" width="272" height="28" rx="7" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><text x="366" y="142.14" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">tool: WeatherAPI___getForecast</text><rect x="230" y="160" width="272" height="28" rx="7" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="366" y="178.14" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">outbound: API key as X-Api-Key</text><line x1="518" y1="98" x2="566" y2="98" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><text x="542" y="90" font-size="11" font-weight="700" fill="#4f5d36" text-anchor="middle">HTTPS</text><rect x="568" y="60" width="140" height="76" rx="10" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.5"/><text x="638" y="88.25" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">Open-Meteo</text><text x="638" y="104.37" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">GET /v1/forecast</text><text x="638" y="118.02" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">a plain REST API</text><rect x="216" y="250" width="140" height="62" rx="10" fill="#ffffff" stroke="#4f5d36" stroke-width="1.5"/><text x="286" y="277.925" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">S3</text><text x="286" y="293.425" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">weather_openapi.json</text><rect x="376" y="250" width="140" height="62" rx="10" fill="#ffffff" stroke="#4f5d36" stroke-width="1.5"/><text x="446" y="277.925" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">Identity</text><text x="446" y="293.425" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">the API key, stored</text><rect x="536" y="250" width="172" height="62" rx="10" fill="#ffffff" stroke="#4f5d36" stroke-width="1.5"/><text x="622" y="271.6" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">gateway IAM role</text><text x="622" y="286.48" font-size="10" font-weight="400" fill="#4f5d36" text-anchor="middle">get the spec, get the key</text><text x="622" y="299.48" font-size="10" font-weight="400" fill="#4f5d36" text-anchor="middle">trusted only by your account</text><line x1="286" y1="250" x2="286" y2="216" stroke="#7d8257" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah-7d8257)"/><line x1="446" y1="250" x2="446" y2="216" stroke="#7d8257" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah-7d8257)"/><text x="14" y="196" font-size="11.5" font-weight="700" fill="#8a5a00" text-anchor="start">no tool code written:</text><text x="14" y="214" font-size="11.5" font-weight="400" fill="#8a5a00" text-anchor="start">the spec is the tool</text></svg>

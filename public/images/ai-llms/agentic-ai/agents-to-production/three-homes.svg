<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" width="720" height="352" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>One agent, three homes</title><desc>Three panels. AWS Lambda runs a fresh copy of the agent for each request: stateless, at most 15 minutes, paid per call. ECS on Fargate keeps a container running all the time behind a load balancer: no time limit, paid while it runs. AgentCore Runtime gives each user session its own microVM: isolated, up to 8 hours, CPU not billed while the agent waits. Footer: the same agent code, the workload picks the platform.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="352" fill="#fffdf8"/><rect x="10" y="10" width="226" height="284" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="123" y="34" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">AWS Lambda</text><text x="123" y="51" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">a function per request</text><rect x="28" y="66" width="62" height="24" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="59" y="81.3" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">req 1</text><line x1="92" y1="78" x2="128" y2="78" stroke="#5e5241" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><rect x="130" y="66" width="88" height="24" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="174" y="81.3" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">fresh agent</text><rect x="28" y="96" width="62" height="24" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="59" y="111.3" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">req 2</text><line x1="92" y1="108" x2="128" y2="108" stroke="#5e5241" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><rect x="130" y="96" width="88" height="24" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="174" y="111.3" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">fresh agent</text><text x="123" y="140" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">each call starts clean</text><rect x="22" y="156" width="202" height="26" rx="7" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="32" y="173.14" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start">stateless between calls</text><rect x="22" y="188" width="202" height="26" rx="7" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><text x="32" y="205.14" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start">up to 15 min per invocation</text><rect x="22" y="220" width="202" height="26" rx="7" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="32" y="237.14" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start">pay per call and duration</text><rect x="22" y="252" width="202" height="26" rx="7" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><text x="32" y="269.14" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start">cold start of a few seconds</text><rect x="247" y="10" width="226" height="284" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="34" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">ECS on Fargate</text><text x="360" y="51" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">a container that never sleeps</text><rect x="265" y="66" width="62" height="24" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="296" y="81.3" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">user A</text><rect x="265" y="96" width="62" height="24" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="296" y="111.3" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">user B</text><rect x="369" y="66" width="86" height="54" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="412" y="88.975" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">one</text><text x="412" y="103.925" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">container</text><line x1="329" y1="78" x2="367" y2="88" stroke="#5e5241" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><line x1="329" y1="108" x2="367" y2="98" stroke="#5e5241" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><text x="360" y="140" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">always listening on a port</text><rect x="259" y="156" width="202" height="26" rx="7" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="269" y="173.14" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start">one process serves everyone</text><rect x="259" y="188" width="202" height="26" rx="7" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><text x="269" y="205.14" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start">no time limit</text><rect x="259" y="220" width="202" height="26" rx="7" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="269" y="237.14" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start">pay per vCPU and GB, always on</text><rect x="259" y="252" width="202" height="26" rx="7" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><text x="269" y="269.14" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start">you build auth and scaling</text><rect x="484" y="10" width="226" height="284" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="597" y="34" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">AgentCore Runtime</text><text x="597" y="51" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">a microVM per session</text><rect x="502" y="66" width="70" height="24" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="537" y="81.3" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">session A</text><line x1="574" y1="78" x2="602" y2="78" stroke="#5e5241" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><rect x="604" y="66" width="88" height="24" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="648" y="81.3" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">microVM A</text><rect x="502" y="96" width="70" height="24" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="537" y="111.3" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">session B</text><line x1="574" y1="108" x2="602" y2="108" stroke="#5e5241" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><rect x="604" y="96" width="88" height="24" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="648" y="111.3" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">microVM B</text><text x="597" y="140" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">nothing shared between users</text><rect x="496" y="156" width="202" height="26" rx="7" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="506" y="173.14" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start">each session isolated</text><rect x="496" y="188" width="202" height="26" rx="7" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><text x="506" y="205.14" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start">up to 8 h per session</text><rect x="496" y="220" width="202" height="26" rx="7" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="506" y="237.14" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start">CPU not billed while waiting</text><rect x="496" y="252" width="202" height="26" rx="7" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><text x="506" y="269.14" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start">auth and tracing built in</text><rect x="10" y="304" width="700" height="38" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.3"/><text x="360" y="328" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Same agent code in all three. The workload picks the platform.</text></svg>

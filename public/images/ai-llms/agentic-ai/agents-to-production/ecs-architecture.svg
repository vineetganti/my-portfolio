<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>The scheduling agent on ECS Fargate</title><desc>A browser or curl reaches an Application Load Balancer on port 80. Its security group only allows your public IP. The ALB forwards to a Fargate task on port 8080, whose security group only allows traffic from the ALB's group. The task runs uvicorn with two workers, FastAPI and a Strands agent with three mock tools, and calls Bedrock using the task role. Separately, ECS uses the execution role to pull the image from ECR and write logs to CloudWatch. The ALB checks /health, and so does the container.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker></defs><rect width="720" height="380" fill="#ffffff"/><rect x="14" y="60" width="110" height="56" rx="10" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.5"/><text x="69" y="85.075" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">browser</text><text x="69" y="101.195" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">or curl</text><line x1="126" y1="88" x2="168" y2="88" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><text x="147" y="80" font-size="11" font-weight="700" fill="#6b5f4d" text-anchor="middle">:80</text><rect x="170" y="34" width="170" height="108" rx="12" fill="#f3ecdc" stroke="#8d8068" stroke-width="1.3" stroke-dasharray="6 4"/><text x="255" y="52" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">ALB security group</text><text x="255" y="66" font-size="10.5" font-weight="400" fill="#a3283f" text-anchor="middle" font-style="italic">port 80 from your IP/32 only</text><rect x="186" y="76" width="138" height="52" rx="10" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="255" y="98.925" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">Load balancer</text><text x="255" y="114.425" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">checks GET /health</text><line x1="342" y1="88" x2="384" y2="88" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><text x="363" y="80" font-size="11" font-weight="700" fill="#6b5f4d" text-anchor="middle">:8080</text><rect x="386" y="20" width="210" height="136" rx="12" fill="#f3ecdc" stroke="#8d8068" stroke-width="1.3" stroke-dasharray="6 4"/><text x="491" y="38" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">task security group</text><text x="491" y="52" font-size="10.5" font-weight="400" fill="#a3283f" text-anchor="middle" font-style="italic">8080 from the ALB's group only</text><rect x="400" y="62" width="182" height="82" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="491" y="86.425" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">Fargate task</text><text x="491" y="102.545" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">1 vCPU, 2 GB</text><text x="491" y="116.195" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">uvicorn, 2 workers</text><text x="491" y="129.845" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">FastAPI + Strands agent</text><line x1="598" y1="88" x2="628" y2="88" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="630" y="60" width="80" height="56" rx="10" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.5"/><text x="670" y="91.75" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">Bedrock</text><text x="670" y="134" font-size="10.5" font-weight="700" fill="#8a5a00" text-anchor="middle">via the task role</text><text x="14" y="196" font-size="12.5" font-weight="700" fill="#8a5a00" text-anchor="start">Two roles, two jobs</text><rect x="14" y="208" width="336" height="74" rx="10" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="182" y="234.6" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">execution role</text><text x="182" y="250.72" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">used by ECS itself, before your code runs:</text><text x="182" y="265.02" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">pull the image from ECR, send logs to CloudWatch</text><rect x="372" y="208" width="336" height="74" rx="10" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.5"/><text x="540" y="234.6" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">task role</text><text x="540" y="250.72" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">used by your code inside the container:</text><text x="540" y="265.02" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">bedrock:InvokeModel and streaming, nothing more</text><text x="14" y="314" font-size="12.5" font-weight="700" fill="#8a5a00" text-anchor="start">Health checks at two levels</text><text x="14" y="336" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">the container: curl -f localhost:8080/health every 30 s, 3 retries, 60 s start period</text><text x="14" y="356" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">the load balancer: GET /health before sending traffic; the service waits 120 s after start</text></svg>

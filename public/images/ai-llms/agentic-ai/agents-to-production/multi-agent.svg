<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Three agents on AgentCore Runtime</title><desc>curl, holding a Cognito bearer token, sends an A2A message/send to the orchestrator runtime at its URL-encoded ARN. Every runtime checks the token with a JWT authorizer. The orchestrator, an A2A server on port 9000, calls its tool ask_stock_agent, which sends A2A to the stock agent runtime, also on port 9000. The stock agent calls the MCP server runtime on port 8000 at /mcp, which runs get_stock_price with yfinance. Locally the same three run on ports 9000, 9001 and 8000. The agents reuse the user's token, which expires in an hour; production would give each one its own identity.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a00"/></marker></defs><rect width="720" height="400" fill="#ffffff"/><rect x="14" y="34" width="128" height="70" rx="10" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.5"/><text x="78" y="59.9" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">curl</text><text x="78" y="76.02" font-size="10" font-weight="400" fill="#6b5f4d" text-anchor="middle">Bearer token</text><text x="78" y="89.02" font-size="10" font-weight="400" fill="#6b5f4d" text-anchor="middle">session id (64 chars)</text><line x1="144" y1="69" x2="178" y2="69" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><text x="161" y="61" font-size="11" font-weight="700" fill="#8a5a00" text-anchor="middle">A2A</text><rect x="180" y="14" width="156" height="152" rx="12" fill="#fffdf8" stroke="#8a5a00" stroke-width="1.5"/><text x="258" y="34" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">AgentCore runtime</text><rect x="190" y="42" width="136" height="24" rx="7" fill="#f7e0da" stroke="#a3283f" stroke-width="1.2"/><text x="258" y="57.78" font-size="10.5" font-weight="400" fill="#3a3226" text-anchor="middle">JWT authorizer</text><rect x="188" y="74" width="140" height="80" rx="10" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.5"/><text x="258" y="104.75" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">Orchestrator</text><text x="258" y="120.25" font-size="10" font-weight="400" fill="#6b5f4d" text-anchor="middle">A2A server, port 9000</text><text x="258" y="133.25" font-size="10" font-weight="400" fill="#6b5f4d" text-anchor="middle">tool: ask_stock_agent</text><rect x="366" y="14" width="156" height="152" rx="12" fill="#fffdf8" stroke="#8a5a00" stroke-width="1.5"/><text x="444" y="34" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">AgentCore runtime</text><rect x="376" y="42" width="136" height="24" rx="7" fill="#f7e0da" stroke="#a3283f" stroke-width="1.2"/><text x="444" y="57.78" font-size="10.5" font-weight="400" fill="#3a3226" text-anchor="middle">JWT authorizer</text><rect x="374" y="74" width="140" height="80" rx="10" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.5"/><text x="444" y="104.75" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">Stock Agent</text><text x="444" y="120.25" font-size="10" font-weight="400" fill="#6b5f4d" text-anchor="middle">A2A server, port 9000</text><text x="444" y="133.25" font-size="10" font-weight="400" fill="#6b5f4d" text-anchor="middle">MCP tools, http_request</text><rect x="552" y="14" width="156" height="152" rx="12" fill="#fffdf8" stroke="#8a5a00" stroke-width="1.5"/><text x="630" y="34" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">AgentCore runtime</text><rect x="562" y="42" width="136" height="24" rx="7" fill="#f7e0da" stroke="#a3283f" stroke-width="1.2"/><text x="630" y="57.78" font-size="10.5" font-weight="400" fill="#3a3226" text-anchor="middle">JWT authorizer</text><rect x="560" y="74" width="140" height="80" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="630" y="104.75" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">Stock MCP server</text><text x="630" y="120.25" font-size="10" font-weight="400" fill="#6b5f4d" text-anchor="middle">MCP, port 8000, /mcp</text><text x="630" y="133.25" font-size="10" font-weight="400" fill="#6b5f4d" text-anchor="middle">get_stock_price</text><line x1="337" y1="114" x2="365" y2="114" stroke="#8a5a00" stroke-width="1.6" marker-end="url(#ah-8a5a00)"/><text x="351" y="104" font-size="10.5" font-weight="700" fill="#8a5a00" text-anchor="middle">A2A</text><line x1="523" y1="114" x2="551" y2="114" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><text x="537" y="104" font-size="10.5" font-weight="700" fill="#6b5f4d" text-anchor="middle">MCP</text><text x="14" y="210" font-size="12.5" font-weight="700" fill="#8a5a00" text-anchor="start">Locally, the same three programs</text><rect x="14" y="222" width="225" height="28" rx="7" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><text x="126.5" y="240.14" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">orchestrator.py  :9000</text><rect x="247" y="222" width="225" height="28" rx="7" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><text x="359.5" y="240.14" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">stock_a2a_agent.py  :9001</text><rect x="480" y="222" width="225" height="28" rx="7" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><text x="592.5" y="240.14" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">stock_mcp_server.py  :8000/mcp</text><text x="14" y="284" font-size="12.5" font-weight="700" fill="#8a5a00" text-anchor="start">What the cloud version adds</text><rect x="14" y="296" width="100" height="26" rx="7" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.2"/><text x="24" y="313.14" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="start">addresses</text><text x="124" y="313.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">https://bedrock-agentcore.&lt;region&gt;.amazonaws.com/runtimes/&lt;URL-encoded ARN&gt;/invocations</text><rect x="14" y="328" width="100" height="26" rx="7" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.2"/><text x="24" y="345.14" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="start">auth</text><text x="124" y="345.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="start">a Cognito JWT on every hop; the agents reuse the user's token (expires in 1 h)</text><rect x="14" y="360" width="100" height="26" rx="7" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.2"/><text x="24" y="377.14" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="start">ports</text><text x="124" y="377.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="start">A2A agents must listen on 9000 inside AgentCore, so the stock agent moves from 9001</text></svg>

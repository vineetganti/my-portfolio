<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Picking a platform</title><desc>A decision tree. First question: does each request stand alone and finish in seconds? Yes leads to Lambda, for example a fraud check per transaction. No leads to the second question: must it run all the time, or need GPUs or control of the network? Yes leads to ECS on Fargate, for example predictive maintenance. No leads to AgentCore Runtime, for multi-turn sessions such as customer support or a surgical scheduling coordinator.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker></defs><rect width="720" height="330" fill="#ffffff"/><rect x="20" y="16" width="140" height="40" rx="10" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.5"/><text x="90" y="39.9" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">your agent</text><line x1="160" y1="36" x2="196" y2="36" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="198" y="10" width="270" height="52" rx="10" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="333" y="31.95" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">Does each request stand alone</text><text x="333" y="47.45" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="middle">and finish in seconds?</text><line x1="468" y1="36" x2="504" y2="36" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><text x="486" y="29" font-size="11.5" font-weight="700" fill="#6b5f4d" text-anchor="middle">yes</text><rect x="506" y="10" width="196" height="52" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="604" y="33.075" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">AWS Lambda</text><text x="604" y="49.195" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">e.g. a fraud check per payment</text><line x1="333" y1="62" x2="333" y2="114" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><text x="346" y="92" font-size="11.5" font-weight="700" fill="#6b5f4d" text-anchor="start">no</text><rect x="198" y="116" width="270" height="52" rx="10" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="333" y="137.95" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">Must it run all the time, or need</text><text x="333" y="153.45" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="middle">GPUs or control of the network?</text><line x1="468" y1="142" x2="504" y2="142" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><text x="486" y="135" font-size="11.5" font-weight="700" fill="#6b5f4d" text-anchor="middle">yes</text><rect x="506" y="116" width="196" height="52" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="604" y="139.075" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">ECS on Fargate</text><text x="604" y="155.195" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">e.g. predictive maintenance</text><line x1="333" y1="168" x2="333" y2="220" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><text x="346" y="198" font-size="11.5" font-weight="700" fill="#6b5f4d" text-anchor="start">no</text><rect x="198" y="222" width="504" height="56" rx="10" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.5"/><text x="450" y="246.9" font-size="13.5" font-weight="700" fill="#3a3226" text-anchor="middle">AgentCore Runtime</text><text x="450" y="263.64" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">multi-turn sessions: customer support, a surgical scheduling coordinator</text><text x="360" y="312" font-size="12.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">Limits and prices change: check the current AWS documentation before you commit.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>AgentCore Identity: two doors</title><desc>Left door, inbound: a user or app signs in with Cognito, Okta, Entra ID or Auth0 and sends a JWT. The runtime or gateway checks it against the discovery URL and the allowed client ids before the agent runs. Right door, outbound: when the agent needs a third-party API, Identity hands it a token or API key from its vault, encrypted and logged. Bottom: user-delegated access acts for a user with the OAuth authorisation-code flow; machine-to-machine access acts as the agent itself with client credentials. The token that opened the first door is never passed on to the second.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d36"/></marker></defs><rect width="720" height="320" fill="#ffffff"/><rect x="14" y="70" width="120" height="64" rx="10" fill="#ffffff" stroke="#4f5d36" stroke-width="1.5"/><text x="74" y="98.925" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">user or app</text><text x="74" y="114.425" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">signed in</text><line x1="136" y1="102" x2="192" y2="102" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><text x="164" y="94" font-size="11" font-weight="700" fill="#4f5d36" text-anchor="middle">JWT</text><rect x="194" y="24" width="150" height="156" rx="12" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.5"/><text x="269" y="46" font-size="12.5" font-weight="700" fill="#a3283f" text-anchor="middle">door 1: inbound</text><text x="269" y="72" font-size="11" font-weight="400" fill="#2c361c" text-anchor="middle">is this token valid?</text><text x="269" y="87.4" font-size="11" font-weight="400" fill="#2c361c" text-anchor="middle">right issuer?</text><text x="269" y="102.8" font-size="11" font-weight="400" fill="#2c361c" text-anchor="middle">allowed client id?</text><text x="269" y="118.2" font-size="11" font-weight="400" fill="#2c361c" text-anchor="middle">not expired?</text><text x="269" y="166" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">Cognito, Okta, Entra ID</text><line x1="346" y1="102" x2="384" y2="102" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="386" y="70" width="120" height="64" rx="10" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.5"/><text x="446" y="98.925" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">your agent</text><text x="446" y="114.425" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">Runtime or Gateway</text><line x1="508" y1="102" x2="546" y2="102" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="548" y="24" width="160" height="156" rx="12" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.5"/><text x="628" y="46" font-size="12.5" font-weight="700" fill="#4f5d36" text-anchor="middle">door 2: outbound</text><text x="628" y="72" font-size="11" font-weight="400" fill="#2c361c" text-anchor="middle">a token or API key</text><text x="628" y="87.4" font-size="11" font-weight="400" fill="#2c361c" text-anchor="middle">from Identity's vault</text><text x="628" y="102.8" font-size="11" font-weight="400" fill="#2c361c" text-anchor="middle">encrypted with KMS</text><text x="628" y="118.2" font-size="11" font-weight="400" fill="#2c361c" text-anchor="middle">every access logged</text><text x="628" y="166" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">Google, GitHub, Slack…</text><text x="360" y="206" font-size="12" font-weight="700" fill="#8a5a00" text-anchor="middle">Two different keys for two different doors: the inbound token is never replayed downstream.</text><rect x="14" y="226" width="340" height="76" rx="10" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="184" y="247.425" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">user-delegated</text><text x="184" y="263.545" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">acts for a signed-in user</text><text x="184" y="277.195" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">OAuth authorisation code (USER_FEDERATION)</text><text x="184" y="290.845" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">e.g. read this user's calendar</text><rect x="366" y="226" width="340" height="76" rx="10" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="536" y="247.425" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">machine-to-machine</text><text x="536" y="263.545" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">acts as the agent itself</text><text x="536" y="277.195" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">OAuth client credentials (M2M)</text><text x="536" y="290.845" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">e.g. one agent calling another</text></svg>

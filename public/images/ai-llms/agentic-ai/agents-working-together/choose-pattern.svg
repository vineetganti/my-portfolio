<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Which pattern to pick</title><desc>A decision guide. Is the procedure known up front? Yes: use a graph. No: do you need one agent to stay in charge? Yes: supervisor with workers, or agent as tool. No: a swarm, for creative and iterative work.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="300" fill="#fffdf8"/><rect x="230" y="14" width="260" height="40" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="360" y="37.75" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Is the procedure known in advance?</text><line x1="300" y1="54" x2="130" y2="100" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><line x1="420" y1="54" x2="540" y2="100" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><text x="190" y="82" font-size="11" font-weight="700" fill="#9a5400" text-anchor="middle">yes</text><text x="500" y="82" font-size="11" font-weight="700" fill="#9a5400" text-anchor="middle">no</text><rect x="20" y="100" width="220" height="70" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="130" y="124.9" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Graph</text><text x="130" y="142.26" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">fixed, auditable paths:</text><text x="130" y="156.56" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">orders, approvals</text><rect x="400" y="100" width="300" height="40" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="550" y="123.75" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Should one agent stay in charge?</text><line x1="470" y1="140" x2="360" y2="190" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><line x1="630" y1="140" x2="610" y2="190" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><text x="400" y="168" font-size="11" font-weight="700" fill="#9a5400" text-anchor="middle">yes</text><text x="640" y="168" font-size="11" font-weight="700" fill="#9a5400" text-anchor="middle">no</text><rect x="250" y="190" width="220" height="76" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="360" y="217.6" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Supervisor or agent as tool</text><text x="360" y="233.72" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">one voice combines</text><text x="360" y="248.02" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">specialist answers</text><rect x="500" y="190" width="200" height="76" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="600" y="217.9" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Swarm</text><text x="600" y="235.26" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">creative, iterative</text><text x="600" y="249.56" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">work, emergent path</text><text x="360" y="288" font-size="12.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">Agent as tool: simplest, the specialists never talk to each other. Supervisor: same idea with named workers.</text></svg>

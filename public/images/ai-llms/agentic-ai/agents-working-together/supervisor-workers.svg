<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 412" width="720" height="412" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>The supervisor and three workers</title><desc>A question goes to the supervisor, which delegates to a news agent that uses web search, a financial agent that uses Yahoo Finance tools, and a sentiment agent that uses web search. Their answers go back to the supervisor, which writes one recommendation.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-7d8257" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7a6d57"/></marker></defs><rect width="720" height="412" fill="#fffdf8"/><rect x="14" y="160" width="100" height="50" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="64" y="188.75" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">question</text><rect x="150" y="142" width="150" height="86" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="225" y="174.75" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Supervisor</text><text x="225" y="191.49" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">splits the question,</text><text x="225" y="205.79" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">delegates, combines</text><rect x="584" y="160" width="122" height="50" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="645" y="181.925" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">one answer</text><text x="645" y="197.425" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">+ disclaimer</text><line x1="114" y1="185" x2="148" y2="185" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="380" y="20" width="160" height="62" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="460" y="47.925" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">News agent</text><text x="460" y="63.425" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">recent developments</text><rect x="556" y="34" width="0" height="0" rx="10" fill="none"/><line x1="300" y1="185" x2="378" y2="51" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><text x="460" y="98" font-size="10.5" font-weight="700" fill="#9a5400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">web_search</text><line x1="540" y1="51" x2="582" y2="170.6" stroke="#7a6d57" stroke-width="1.2" marker-end="url(#ah-7d8257)"/><rect x="380" y="140" width="160" height="62" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="460" y="167.925" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Financial agent</text><text x="460" y="183.425" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">prices and fundamentals</text><rect x="556" y="154" width="0" height="0" rx="10" fill="none"/><line x1="300" y1="185" x2="378" y2="171" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><text x="460" y="218" font-size="10.5" font-weight="700" fill="#9a5400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">yfinance tools</text><line x1="540" y1="171" x2="582" y2="185" stroke="#7a6d57" stroke-width="1.2" marker-end="url(#ah-7d8257)"/><rect x="380" y="260" width="160" height="62" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="460" y="287.925" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Sentiment agent</text><text x="460" y="303.425" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">investor mood</text><rect x="556" y="274" width="0" height="0" rx="10" fill="none"/><line x1="300" y1="185" x2="378" y2="291" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><text x="460" y="338" font-size="10.5" font-weight="700" fill="#9a5400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">web_search</text><line x1="540" y1="291" x2="582" y2="199.4" stroke="#7a6d57" stroke-width="1.2" marker-end="url(#ah-7d8257)"/><rect x="14" y="336" width="692" height="64" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.3"/><text x="360" y="358" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Groq free tier: a single request over 8,000 tokens fails</text><text x="360" y="378" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">so each worker gets a search wrapper: top 3 results, at most 2 searches per task</text></svg>

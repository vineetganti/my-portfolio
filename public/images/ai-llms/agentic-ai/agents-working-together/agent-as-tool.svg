<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Agent as tool: the teacher in charge</title><desc>A student asks the teacher a question. The teacher calls one specialist as a tool, either math tutor, writing coach or science helper. The specialist returns its answer to the teacher, who presents it to the student.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a00"/></marker><marker id="ah-7d8257" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8d8068"/></marker></defs><rect width="720" height="300" fill="#ffffff"/><rect x="14" y="110" width="100" height="56" rx="10" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.5"/><text x="64" y="141.9" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">student</text><rect x="190" y="90" width="150" height="96" rx="10" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.5"/><text x="265" y="127.9" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">teacher</text><text x="265" y="145.26" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">never solves,</text><text x="265" y="159.56" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">always delegates</text><rect x="470" y="40" width="160" height="52" rx="10" fill="#e3d9c2" stroke="#6b5f4d" stroke-width="1.5"/><text x="550" y="69.75" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">math_tutor</text><line x1="340" y1="138" x2="468" y2="66" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><line x1="468" y1="78" x2="340" y2="150" stroke="#8a5a00" stroke-width="1.4" marker-end="url(#ah-8a5a00)"/><rect x="470" y="120" width="160" height="52" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="550" y="149.75" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">writing_coach</text><line x1="340" y1="138" x2="468" y2="146" stroke="#8d8068" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ah-7d8257)"/><line x1="468" y1="158" x2="340" y2="150" stroke="#8d8068" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-7d8257)"/><rect x="470" y="200" width="160" height="52" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="550" y="229.75" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">science_helper</text><line x1="340" y1="138" x2="468" y2="226" stroke="#8d8068" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ah-7d8257)"/><line x1="468" y1="238" x2="340" y2="150" stroke="#8d8068" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-7d8257)"/><line x1="114" y1="130" x2="188" y2="130" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><line x1="188" y1="152" x2="114" y2="152" stroke="#8a5a00" stroke-width="1.8" marker-end="url(#ah-8a5a00)"/><text x="151" y="118" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">question</text><text x="151" y="170" font-size="10.5" font-weight="400" fill="#8a5a00" text-anchor="middle">answer</text><text x="360" y="276" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">name = tool name, description = when to call it. The teacher is the only voice the student hears.</text></svg>

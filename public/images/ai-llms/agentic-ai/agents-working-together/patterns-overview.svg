<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Four ways to make agents work together</title><desc>Four small diagrams. Supervisor and workers: one coordinator calls several specialists and combines their answers. Agent as tool: a specialist is wrapped as a tool the orchestrator calls. Graph: nodes joined by fixed edges, some with conditions. Swarm: agents hand control to each other with no coordinator.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker><marker id="ah-7d8257" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8d8068"/></marker></defs><rect width="720" height="300" fill="#ffffff"/><rect x="10" y="10" width="166" height="280" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="93" y="34" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Supervisor + workers</text><text x="93" y="51" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">one boss delegates</text><rect x="53" y="70" width="80" height="30" rx="10" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.5"/><text x="93" y="88.6" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">boss</text><circle cx="44" cy="190" r="17" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.4"/><line x1="93" y1="100" x2="44" y2="172" stroke="#6b5f4d" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><circle cx="94" cy="190" r="17" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.4"/><line x1="93" y1="100" x2="94" y2="172" stroke="#6b5f4d" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><circle cx="144" cy="190" r="17" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.4"/><line x1="93" y1="100" x2="144" y2="172" stroke="#6b5f4d" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><text x="93" y="232" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">workers</text><text x="93" y="272" font-size="11" font-weight="700" fill="#8a5a00" text-anchor="middle">who decides: the supervisor</text><rect x="188" y="10" width="166" height="280" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="271" y="34" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Agent as tool</text><text x="271" y="51" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">a specialist is a tool</text><rect x="231" y="70" width="80" height="30" rx="10" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.5"/><text x="271" y="88.6" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">teacher</text><circle cx="222" cy="190" r="17" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.4"/><line x1="271" y1="100" x2="222" y2="172" stroke="#6b5f4d" stroke-width="1.4" marker-end="url(#ah-4f5d36)" marker-start="url(#ah-4f5d36)"/><circle cx="272" cy="190" r="17" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.4"/><line x1="271" y1="100" x2="272" y2="172" stroke="#6b5f4d" stroke-width="1.4" marker-end="url(#ah-4f5d36)" marker-start="url(#ah-4f5d36)"/><circle cx="322" cy="190" r="17" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.4"/><line x1="271" y1="100" x2="322" y2="172" stroke="#6b5f4d" stroke-width="1.4" marker-end="url(#ah-4f5d36)" marker-start="url(#ah-4f5d36)"/><text x="271" y="232" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">specialists</text><text x="271" y="272" font-size="11" font-weight="700" fill="#8a5a00" text-anchor="middle">who decides: the orchestrator</text><rect x="366" y="10" width="166" height="280" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="449" y="34" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Graph</text><text x="449" y="51" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">routes live in code</text><line x1="399" y1="94" x2="399" y2="126" stroke="#6b5f4d" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><line x1="459" y1="94" x2="489" y2="126" stroke="#6b5f4d" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><line x1="399" y1="154" x2="439" y2="186" stroke="#6b5f4d" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><line x1="489" y1="154" x2="439" y2="186" stroke="#6b5f4d" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><circle cx="399" cy="80" r="14" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.4"/><circle cx="459" cy="80" r="14" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.4"/><circle cx="399" cy="140" r="14" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.4"/><circle cx="489" cy="140" r="14" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.4"/><circle cx="439" cy="200" r="14" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.4"/><text x="449" y="240" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">fixed edges, if/else</text><text x="449" y="272" font-size="11" font-weight="700" fill="#8a5a00" text-anchor="middle">who decides: your code</text><rect x="544" y="10" width="166" height="280" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="627" y="34" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Swarm</text><text x="627" y="51" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">agents hand off</text><line x1="587" y1="84" x2="667" y2="84" stroke="#8d8068" stroke-width="1.2" marker-start="url(#ah-7d8257)"/><line x1="587" y1="84" x2="587" y2="190" stroke="#8d8068" stroke-width="1.2" marker-start="url(#ah-7d8257)"/><line x1="587" y1="84" x2="667" y2="190" stroke="#8d8068" stroke-width="1.2" marker-start="url(#ah-7d8257)"/><line x1="667" y1="84" x2="587" y2="190" stroke="#8d8068" stroke-width="1.2" marker-start="url(#ah-7d8257)"/><line x1="667" y1="84" x2="667" y2="190" stroke="#8d8068" stroke-width="1.2" marker-start="url(#ah-7d8257)"/><line x1="587" y1="190" x2="667" y2="190" stroke="#8d8068" stroke-width="1.2" marker-start="url(#ah-7d8257)"/><circle cx="587" cy="84" r="16" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.4"/><circle cx="667" cy="84" r="16" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.4"/><circle cx="587" cy="190" r="16" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.4"/><circle cx="667" cy="190" r="16" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.4"/><text x="627" y="240" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">no central boss</text><text x="627" y="272" font-size="11" font-weight="700" fill="#8a5a00" text-anchor="middle">who decides: the agents</text></svg>

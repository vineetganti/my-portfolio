<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>A swarm run: five turns, four agents</title><desc>Four agents: level designer, difficulty balancer, game designer and narrative designer. In the run the work passed from the level designer to the difficulty balancer, then to the game designer, back to the difficulty balancer, and finally to the game designer, who finished with no handoff. Five iterations, 154 seconds.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="330" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Handoff chain of the game-level run</text><rect x="6" y="60" width="132" height="54" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="72" y="83.175" font-size="10" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">level_designer</text><text x="72" y="95.575" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">turn 1</text><rect x="148" y="60" width="132" height="54" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="214" y="83.175" font-size="10" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">difficulty_balancer</text><text x="214" y="95.575" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">turn 2</text><rect x="290" y="60" width="132" height="54" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="356" y="83.175" font-size="10" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">game_designer</text><text x="356" y="95.575" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">turn 3</text><rect x="432" y="60" width="132" height="54" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="498" y="83.175" font-size="10" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">difficulty_balancer</text><text x="498" y="95.575" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">turn 4</text><rect x="574" y="60" width="132" height="54" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="640" y="83.175" font-size="10" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">game_designer</text><text x="640" y="95.575" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">turn 5</text><line x1="140" y1="87" x2="144" y2="87" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><line x1="282" y1="87" x2="286" y2="87" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><line x1="424" y1="87" x2="428" y2="87" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><line x1="566" y1="87" x2="570" y2="87" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><text x="640" y="134" font-size="11" font-weight="700" fill="#9a5400" text-anchor="middle">no handoff: finished</text><rect x="20" y="160" width="680" height="70" rx="12" fill="#faf3e3" stroke="#5e5241" stroke-width="1.4"/><text x="360" y="184" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">every agent gets one extra tool</text><text x="360" y="208" font-size="13" font-weight="700" fill="#9a5400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">handoff_to_agent(agent_name, message)</text><rect x="20" y="244" width="680" height="70" rx="12" fill="#fde3ad" stroke="#9a5400" stroke-width="1.3"/><text x="360" y="266" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">safety limits used: max_handoffs 20, max_iterations 20, timeouts 1,200 s and 300 s</text><text x="360" y="288" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">repeat detection: window 8 with at least 3 different agents, so two agents can't ping-pong</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>N times M connectors versus N plus M</title><desc>Left: without a protocol, each of three apps is wired to each of three tools, nine connectors. Right: with MCP each app and each tool connects once to the shared protocol, six connectors, and a new tool works with every app.</desc><defs></defs><rect width="720" height="300" fill="#fffdf8"/><rect x="10" y="10" width="340" height="280" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="180" y="34" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Without a protocol: N × M</text><text x="180" y="51" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">every app wires every tool by hand</text><line x1="126" y1="91" x2="224" y2="91" stroke="#7a6d57" stroke-width="1.2"/><line x1="126" y1="91" x2="224" y2="155" stroke="#7a6d57" stroke-width="1.2"/><line x1="126" y1="91" x2="224" y2="219" stroke="#7a6d57" stroke-width="1.2"/><line x1="126" y1="155" x2="224" y2="91" stroke="#7a6d57" stroke-width="1.2"/><line x1="126" y1="155" x2="224" y2="155" stroke="#7a6d57" stroke-width="1.2"/><line x1="126" y1="155" x2="224" y2="219" stroke="#7a6d57" stroke-width="1.2"/><line x1="126" y1="219" x2="224" y2="91" stroke="#7a6d57" stroke-width="1.2"/><line x1="126" y1="219" x2="224" y2="155" stroke="#7a6d57" stroke-width="1.2"/><line x1="126" y1="219" x2="224" y2="219" stroke="#7a6d57" stroke-width="1.2"/><rect x="30" y="72" width="96" height="38" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="78" y="94.6" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">chat app</text><rect x="224" y="72" width="96" height="38" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="272" y="94.6" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">weather</text><rect x="30" y="136" width="96" height="38" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="78" y="158.6" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">IDE</text><rect x="224" y="136" width="96" height="38" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="272" y="158.6" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">AWS docs</text><rect x="30" y="200" width="96" height="38" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="78" y="222.6" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">your agent</text><rect x="224" y="200" width="96" height="38" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="272" y="222.6" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">database</text><text x="180" y="268" font-size="12" font-weight="700" fill="#9a5400" text-anchor="middle">3 apps × 3 tools = 9 connectors</text><rect x="370" y="10" width="340" height="280" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="540" y="34" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">With MCP: N + M</text><text x="540" y="51" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">each side learns one protocol, once</text><rect x="508" y="72" width="44" height="166" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="530" y="158.6" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">MCP</text><rect x="388" y="72" width="92" height="38" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="434" y="94.6" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">chat app</text><rect x="592" y="72" width="100" height="38" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="642" y="94.6" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">weather</text><line x1="480" y1="91" x2="508" y2="91" stroke="#5e5241" stroke-width="1.5"/><line x1="552" y1="91" x2="592" y2="91" stroke="#5e5241" stroke-width="1.5"/><rect x="388" y="136" width="92" height="38" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="434" y="158.6" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">IDE</text><rect x="592" y="136" width="100" height="38" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="642" y="158.6" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">AWS docs</text><line x1="480" y1="155" x2="508" y2="155" stroke="#5e5241" stroke-width="1.5"/><line x1="552" y1="155" x2="592" y2="155" stroke="#5e5241" stroke-width="1.5"/><rect x="388" y="200" width="92" height="38" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="434" y="222.6" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">your agent</text><rect x="592" y="200" width="100" height="38" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="642" y="222.6" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">database</text><line x1="480" y1="219" x2="508" y2="219" stroke="#5e5241" stroke-width="1.5"/><line x1="552" y1="219" x2="592" y2="219" stroke="#5e5241" stroke-width="1.5"/><text x="540" y="268" font-size="11.5" font-weight="700" fill="#9a5400" text-anchor="middle">3 + 3 = 6: add a tool once, every app gets it</text></svg>

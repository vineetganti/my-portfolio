<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>A Strands agent using an MCP server</title><desc>Inside a with mcp_client block, the Strands agent calls tools through MCPClient, which runs on a background thread and sends JSON-RPC to the MCP server, a child process started over stdio. The client takes a recipe for the connection and opens it when the block starts.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a5400"/></marker></defs><rect width="720" height="300" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Strands + MCP: MCP tools become ordinary agent tools</text><rect x="10" y="40" width="700" height="182" rx="12" fill="#fffdf8" stroke="#7a6d57" stroke-width="1.4" stroke-dasharray="6 4"/><text x="24" y="62" font-size="12" font-weight="700" fill="#9a5400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">with mcp_client:</text><text x="150" y="62" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start" font-style="italic">the server process lives only inside this block</text><rect x="28" y="96" width="196" height="112" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="126" y="141.75" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Strands Agent</text><text x="126" y="158.49" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">model on Groq</text><text x="126" y="172.79" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">+ the agent loop</text><rect x="262" y="96" width="196" height="112" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="360" y="134.6" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">MCPClient</text><text x="360" y="151.34" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">runs on a background thread</text><text x="360" y="165.64" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">list_tools_sync()</text><text x="360" y="179.94" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">calls tools for the agent</text><rect x="496" y="96" width="196" height="112" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="594" y="134.6" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">MCP server</text><text x="594" y="151.34" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">a child process (stdio)</text><text x="594" y="165.64" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">server.py, or a package</text><text x="594" y="179.94" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">that uvx downloads</text><line x1="226" y1="140" x2="260" y2="140" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><line x1="260" y1="164" x2="226" y2="164" stroke="#9a5400" stroke-width="1.6" marker-end="url(#ah-8a5a00)"/><line x1="460" y1="140" x2="494" y2="140" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><line x1="494" y1="164" x2="460" y2="164" stroke="#9a5400" stroke-width="1.6" marker-end="url(#ah-8a5a00)"/><text x="243" y="88" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">tool call</text><text x="477" y="88" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">JSON-RPC</text><rect x="10" y="236" width="700" height="54" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.3"/><text x="360" y="258" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">MCPClient(lambda: stdio_client(...)) takes a recipe, not an open connection.</text><text x="360" y="277" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">Strands opens it on its own thread when the block starts, and closes it when the block ends.</text></svg>

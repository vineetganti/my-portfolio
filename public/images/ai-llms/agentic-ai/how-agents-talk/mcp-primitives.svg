<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" width="720" height="336" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>The six MCP primitives</title><desc>The server offers three: tools, which act and are chosen by the model; resources, read-only data chosen by the app; and prompts, reusable templates chosen by the user. The client offers three: roots, the folders a server may use; sampling, where the server uses the client's model; and elicitation, where the server asks the user for input.</desc><defs></defs><rect width="720" height="336" fill="#ffffff"/><rect x="10" y="10" width="382" height="276" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="201" y="34" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">The server offers</text><text x="201" y="51" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">what the server can do for you</text><rect x="24" y="62" width="104" height="62" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="76" y="89.9" font-size="13.5" font-weight="700" fill="#3a3226" text-anchor="middle">Tool</text><text x="76" y="106.64" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">acts</text><text x="140" y="87" font-size="12" font-weight="700" fill="#3a3226" text-anchor="start">chosen by the model</text><text x="140" y="107" font-size="10.5" font-weight="400" fill="#8a5a00" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">get_weather, list_client_roots</text><rect x="24" y="134" width="104" height="62" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="76" y="161.9" font-size="13.5" font-weight="700" fill="#3a3226" text-anchor="middle">Resource</text><text x="76" y="178.64" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">reads</text><text x="140" y="159" font-size="12" font-weight="700" fill="#3a3226" text-anchor="start">chosen by the app</text><text x="140" y="179" font-size="10.5" font-weight="400" fill="#8a5a00" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">greeting://{name}, courses://directory</text><rect x="24" y="206" width="104" height="62" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="76" y="233.9" font-size="13.5" font-weight="700" fill="#3a3226" text-anchor="middle">Prompt</text><text x="76" y="250.64" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">reuses</text><text x="140" y="231" font-size="12" font-weight="700" fill="#3a3226" text-anchor="start">chosen by the user</text><text x="140" y="251" font-size="10.5" font-weight="400" fill="#8a5a00" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">weather_report, generate_study_plan</text><rect x="402" y="10" width="308" height="276" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="556" y="34" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">The client offers</text><text x="556" y="51" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">what the server may ask of you</text><rect x="414" y="62" width="96" height="62" rx="10" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.5"/><text x="462" y="96.75" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">Root</text><text x="520" y="87" font-size="11" font-weight="700" fill="#3a3226" text-anchor="start">client fences the server in</text><text x="520" y="107" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="start" font-style="italic">here: the lab folder</text><rect x="414" y="134" width="96" height="62" rx="10" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.5"/><text x="462" y="168.75" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">Sampling</text><text x="520" y="159" font-size="11" font-weight="700" fill="#3a3226" text-anchor="start">server uses the client's model</text><text x="520" y="179" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="start" font-style="italic">not in this lab</text><rect x="414" y="206" width="96" height="62" rx="10" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.5"/><text x="462" y="240.75" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">Elicitation</text><text x="520" y="231" font-size="11" font-weight="700" fill="#3a3226" text-anchor="start">server asks the user for input</text><text x="520" y="251" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="start" font-style="italic">not in this lab</text><rect x="10" y="296" width="700" height="32" rx="10" fill="#f6e9c8" stroke="#8a5a00" stroke-width="1.3"/><text x="360" y="317" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">Tools act, resources read, prompts reuse. The client sets the fences.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" width="720" height="352" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>One A2A exchange on the wire</title><desc>The orchestrator fetches the weather agent's card from the well-known URL and gets its name, skills and streaming flag. It then posts a message/stream request with the question. While the agent runs its model and the get_weather tool, events stream back: status working, an artifact update with the answer, and status completed. The orchestrator reads the text from the task's artifacts.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a5400"/></marker></defs><rect width="720" height="352" fill="#fffdf8"/><rect x="85" y="14" width="190" height="44" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="180" y="33.075" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Orchestrator</text><text x="180" y="49.195" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">A2A client</text><line x1="180" y1="58" x2="180" y2="304" stroke="#7a6d57" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="450" y="14" width="190" height="44" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="545" y="33.075" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Weather agent</text><text x="545" y="49.195" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">A2A server on :9001</text><line x1="545" y1="58" x2="545" y2="304" stroke="#7a6d57" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="183" y1="92" x2="542" y2="92" stroke="#5e5241" stroke-width="1.7" marker-end="url(#ah-4f5d36)"/><text x="362.5" y="85" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">GET /.well-known/agent-card.json</text><line x1="542" y1="124" x2="183" y2="124" stroke="#5e5241" stroke-width="1.7" marker-end="url(#ah-4f5d36)"/><text x="362.5" y="117" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">agent card: name, skills, streaming: true</text><line x1="183" y1="168" x2="542" y2="168" stroke="#5e5241" stroke-width="1.7" marker-end="url(#ah-4f5d36)"/><text x="362.5" y="161" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">POST /   message/stream</text><text x="362.5" y="186" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">“What is the weather in London?”</text><rect x="539" y="176" width="12" height="124" rx="3" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><text x="566" y="214" font-size="11" font-weight="400" fill="#9a5400" text-anchor="start" font-style="italic">model → get_weather</text><text x="566" y="229" font-size="11" font-weight="400" fill="#9a5400" text-anchor="start" font-style="italic">→ model</text><line x1="536" y1="226" x2="183" y2="226" stroke="#9a5400" stroke-width="1.7" marker-end="url(#ah-8a5a00)"/><text x="359.5" y="219" font-size="11" font-weight="400" fill="#9a5400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">status: working</text><line x1="536" y1="258" x2="183" y2="258" stroke="#9a5400" stroke-width="1.7" marker-end="url(#ah-8a5a00)"/><text x="359.5" y="251" font-size="11" font-weight="400" fill="#9a5400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">artifact-update: the answer text</text><line x1="536" y1="290" x2="183" y2="290" stroke="#9a5400" stroke-width="1.7" marker-end="url(#ah-8a5a00)"/><text x="359.5" y="283" font-size="11" font-weight="400" fill="#9a5400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">status: completed</text><text x="16" y="252" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">extract_text(</text><text x="16" y="267" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">task.artifacts)</text><text x="360" y="334" font-size="12" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">Events stream over SSE because the card says streaming: true. Then the same with the flights agent on :9002.</text></svg>

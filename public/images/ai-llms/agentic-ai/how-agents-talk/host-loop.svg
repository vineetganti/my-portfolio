<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>host loop</title><desc>The notebook's host, with no agent framework. It opens a FastMCP client to the server, lists the tools and converts each one's input schema into the chat API's tool format. It sends the question and tools to the model, runs every requested tool through the client's call_tool, adds the results and asks the model once more, this time without tools. Asked for the time and weather in Tokyo, Claude asked for both tools in its first reply and the single round was enough. Groq's model asked for the time first, saw the result, and wanted to call get_weather in the second reply, but tools were no longer offered, so the API answered with HTTP 400: tool choice is none, but model called a tool.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="350" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">One round of tools is not a loop</text><rect x="20" y="60" width="170" height="70" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="105" y="85.52" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">host (notebook)</text><text x="105" y="107.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">list_tools -&gt; chat format</text><text x="105" y="121.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">then ask the model</text><rect x="275" y="60" width="170" height="70" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="360" y="85.52" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">model</text><text x="360" y="107.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">call 1: tools offered</text><text x="360" y="121.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">call 2: no tools</text><rect x="530" y="60" width="170" height="70" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="615" y="85.52" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">FastMCP server</text><text x="615" y="107.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">get_current_time</text><text x="615" y="121.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">get_weather (Open-Meteo)</text><line x1="190" y1="85" x2="273" y2="85" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="273" y1="108" x2="190" y2="108" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><path d="M105 130 L105 150 L615 150 L615 132" fill="none" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="360" y="164" font-size="11" font-weight="700" fill="#5e5241" text-anchor="middle">call_tool via the client</text><rect x="20" y="180" width="330" height="76" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="185" y="208.51" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Claude: 'time and weather in Tokyo'</text><text x="185" y="230.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">both tools asked for in call 1</text><text x="185" y="244.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">call 2 answers: worked</text><rect x="370" y="180" width="330" height="76" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="535" y="208.51" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Groq: the same question</text><text x="535" y="230.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">call 1 asks for the time only</text><text x="535" y="244.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">call 2 wants get_weather: HTTP 400</text><text x="20" y="276" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">The fix is the loop every framework runs: keep offering the tools and keep calling until the model stops asking.</text><text x="20" y="291.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Both runs also reported 'Bangalore Town' as Bangalore: the geocoder's first match for 'Bangalore' is a place in</text><text x="20" y="307.05" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Sindh, Pakistan.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>The roots round trip</title><desc>The client calls the list_client_roots tool. While that call is open, the server sends a roots/list request back to the client, the client's callback answers with its folder, and then the tool returns that folder as its result.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a5400"/></marker></defs><rect width="720" height="290" fill="#fffdf8"/><rect x="85" y="14" width="190" height="44" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="180" y="33.075" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">MCP client</text><text x="180" y="49.195" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">has a list_roots callback</text><line x1="180" y1="58" x2="180" y2="244" stroke="#7a6d57" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="450" y="14" width="190" height="44" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="545" y="33.075" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">MCP server</text><text x="545" y="49.195" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">runs list_client_roots</text><line x1="545" y1="58" x2="545" y2="244" stroke="#7a6d57" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="539" y="86" width="12" height="150" rx="3" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><line x1="183" y1="92" x2="542" y2="92" stroke="#5e5241" stroke-width="1.7" marker-end="url(#ah-4f5d36)"/><text x="362.5" y="85" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1. tools/call list_client_roots</text><line x1="536" y1="138" x2="183" y2="138" stroke="#9a5400" stroke-width="1.7" marker-end="url(#ah-8a5a00)"/><text x="359.5" y="131" font-size="11" font-weight="400" fill="#9a5400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">2. roots/list: which folders may I use?</text><line x1="183" y1="184" x2="536" y2="184" stroke="#9a5400" stroke-width="1.7" marker-end="url(#ah-8a5a00)"/><text x="359.5" y="177" font-size="11" font-weight="400" fill="#9a5400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">3. Course workspace: file:///…/mcp-basics</text><line x1="542" y1="230" x2="183" y2="230" stroke="#5e5241" stroke-width="1.7" marker-end="url(#ah-4f5d36)"/><text x="362.5" y="223" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">4. result: Course workspace: file:///…/mcp-basics</text><text x="566" y="154" font-size="11" font-weight="400" fill="#9a5400" text-anchor="start" font-style="italic">the tool call</text><text x="566" y="169" font-size="11" font-weight="400" fill="#9a5400" text-anchor="start" font-style="italic">is still open</text><text x="360" y="274" font-size="12.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">JSON-RPC runs both ways: a server can send requests to its client, too.</text></svg>

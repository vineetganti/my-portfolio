<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>mcp threats</title><desc>Four ways an MCP setup is attacked, all because the model reads every piece of text as possible instructions. Prompt injection: a tool result contains hidden instructions, such as a web page saying ignore previous instructions. Tool poisoning: a server hides instructions in a tool's description, which the model reads while planning. Rug pull: a server behaves well when reviewed, then an update changes it; the postmark-mcp npm package worked for 15 versions, then version 1.0.16 blind-copied every email to an attacker. Confused deputy: a powerful server, such as one that can send email, is steered through the model into acting for the attacker. Defences: label tool output as data, pin and hash reviewed tool descriptions, give each server the least power it needs, and ask a human before destructive actions.</desc><defs></defs><rect width="720" height="340" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">The model is the attack surface</text><rect x="20" y="56" width="160" height="76" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="100" y="84.34" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">prompt injection</text><text x="100" y="105.48" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">instructions hidden in</text><text x="100" y="119.34" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">a tool's result</text><rect x="192" y="56" width="160" height="76" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="272" y="84.34" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">tool poisoning</text><text x="272" y="105.48" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">instructions hidden in</text><text x="272" y="119.34" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">a tool's description</text><rect x="364" y="56" width="160" height="76" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="444" y="84.34" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">rug pull</text><text x="444" y="105.48" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">fine when reviewed,</text><text x="444" y="119.34" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">changed by an update</text><rect x="536" y="56" width="160" height="76" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="616" y="84.34" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">confused deputy</text><text x="616" y="105.48" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">a powerful server steered</text><text x="616" y="119.34" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">through the model</text><rect x="20" y="156" width="680" height="56" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="360" y="181.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">postmark-mcp, September 2025</text><text x="360" y="203.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">15 clean versions, then 1.0.16 blind-copied every email the AI sent to the attacker's address</text><rect x="20" y="236" width="160" height="48" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="100" y="264.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">label output as data</text><rect x="192" y="236" width="160" height="48" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="272" y="264.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">pin + hash descriptions</text><rect x="364" y="236" width="160" height="48" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="444" y="264.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">least privilege</text><rect x="536" y="236" width="160" height="48" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="616" y="257.13" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">a human approves</text><text x="616" y="270.93" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">deletes, sends</text><text x="20" y="304" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">For a model, data and code are the same thing: text. Anything it reads can try to steer it.</text></svg>

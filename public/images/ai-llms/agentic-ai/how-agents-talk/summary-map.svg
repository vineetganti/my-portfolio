<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 338" width="720" height="338" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Post 5 at a glance: how agents talk</title><desc>A map of the post in four columns. Why protocols: N times M becomes N plus M, JSON-RPC 2.0, MCP goes down and A2A goes across. MCP: host, client and server, stdio or HTTP, a handshake first, three server and three client primitives. Strands with MCP: MCPClient takes a lambda, the with block is the server's lifetime, list_tools_sync, and a 429 on a spent daily budget that retries can't fix. A2A: opaque agents, an agent card with skills, a message that becomes a task, artifacts as output, and streaming, polling or push.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="338" fill="#fffdf8"/><text x="20" y="28" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Post 5 at a glance: how agents talk</text><rect x="10" y="44" width="161.5" height="228" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="90.75" y="71" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Why protocols</text><rect x="20" y="88" width="141.5" height="28" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="90.75" y="106.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">N × M → N + M</text><rect x="20" y="124" width="141.5" height="28" rx="8" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.1"/><text x="90.75" y="142.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">one shared language</text><rect x="20" y="160" width="141.5" height="28" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="90.75" y="178.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">JSON-RPC 2.0</text><rect x="20" y="196" width="141.5" height="28" rx="8" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.1"/><text x="90.75" y="214.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">MCP down, A2A across</text><rect x="20" y="232" width="141.5" height="28" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="90.75" y="250.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">often both at once</text><line x1="173.5" y1="66" x2="187.5" y2="66" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="189.5" y="44" width="161.5" height="228" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="270.25" y="71" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">MCP</text><rect x="199.5" y="88" width="141.5" height="28" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="270.25" y="106.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">host, client, server</text><rect x="199.5" y="124" width="141.5" height="28" rx="8" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.1"/><text x="270.25" y="142.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">stdio or HTTP</text><rect x="199.5" y="160" width="141.5" height="28" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="270.25" y="178.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">handshake first</text><rect x="199.5" y="196" width="141.5" height="28" rx="8" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.1"/><text x="270.25" y="214.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">server: 3 primitives</text><rect x="199.5" y="232" width="141.5" height="28" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="270.25" y="250.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">client: roots and more</text><line x1="353" y1="66" x2="367" y2="66" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="369" y="44" width="161.5" height="228" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="449.75" y="71" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Strands + MCP</text><rect x="379" y="88" width="141.5" height="28" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="449.75" y="106.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">MCPClient(lambda)</text><rect x="379" y="124" width="141.5" height="28" rx="8" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.1"/><text x="449.75" y="142.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">with block = lifetime</text><rect x="379" y="160" width="141.5" height="28" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="449.75" y="178.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">list_tools_sync()</text><rect x="379" y="196" width="141.5" height="28" rx="8" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.1"/><text x="449.75" y="214.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">429: daily budget</text><rect x="379" y="232" width="141.5" height="28" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="449.75" y="250.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">retries can't fix TPD</text><line x1="532.5" y1="66" x2="546.5" y2="66" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="548.5" y="44" width="161.5" height="228" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="629.25" y="71" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">A2A</text><rect x="558.5" y="88" width="141.5" height="28" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="629.25" y="106.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">opaque agents</text><rect x="558.5" y="124" width="141.5" height="28" rx="8" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.1"/><text x="629.25" y="142.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">agent card: skills</text><rect x="558.5" y="160" width="141.5" height="28" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="629.25" y="178.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">message → task</text><rect x="558.5" y="196" width="141.5" height="28" rx="8" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.1"/><text x="629.25" y="214.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">artifacts = output</text><rect x="558.5" y="232" width="141.5" height="28" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="629.25" y="250.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">stream, poll, push</text><rect x="10" y="288" width="700" height="36" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.3"/><text x="360" y="311" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">MCP connects an agent to tools and data. A2A connects agents to each other.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>The A2A travel planner</title><desc>A travel orchestrator, an A2A client written in plain Python with no LLM, talks A2A over HTTP to two agent servers. The weather agent on port 9001 advertises a get_weather skill in its card and uses a get_weather tool. The flights agent on port 9002 advertises search and book skills and uses matching tools. Each server wraps a Strands agent whose model runs on Groq.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a00"/></marker></defs><rect width="720" height="360" fill="#ffffff"/><rect x="230" y="12" width="260" height="64" rx="10" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.5"/><text x="360" y="41.05" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Travel orchestrator</text><text x="360" y="58.41" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">A2A client: plain Python, no LLM</text><rect x="20" y="140" width="320" height="206" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="36" y="164" font-size="14" font-weight="700" fill="#3a3226" text-anchor="start">Weather agent · port 9001</text><text x="36" y="181" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="start" font-style="italic">weather_agent_server_groq.py</text><rect x="194" y="196" width="130" height="50" rx="10" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.5"/><text x="259" y="217.925" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">A2AServer</text><text x="259" y="233.425" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">card + HTTP</text><rect x="36" y="196" width="130" height="50" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="101" y="217.925" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">Strands Agent</text><text x="101" y="233.425" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">model on Groq</text><line x1="194" y1="221" x2="168" y2="221" stroke="#6b5f4d" stroke-width="1.5" marker-end="url(#ah-4f5d36)"/><text x="259" y="266" font-size="10.5" font-weight="400" fill="#8a5a00" text-anchor="middle" font-style="italic">skills (in the card)</text><text x="101" y="266" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">tools (private)</text><rect x="194" y="274" width="130" height="26" rx="7" fill="#f6e9c8" stroke="#8a5a00" stroke-width="1.2"/><text x="259" y="290.96" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">get_weather</text><rect x="36" y="274" width="130" height="26" rx="7" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.2"/><text x="101" y="290.96" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">get_weather</text><rect x="380" y="140" width="320" height="206" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="684" y="164" font-size="14" font-weight="700" fill="#3a3226" text-anchor="end">Flights agent · port 9002</text><text x="684" y="181" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="end" font-style="italic">flights_agent_server_groq.py</text><rect x="396" y="196" width="130" height="50" rx="10" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.5"/><text x="461" y="217.925" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">A2AServer</text><text x="461" y="233.425" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">card + HTTP</text><rect x="554" y="196" width="130" height="50" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="619" y="217.925" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">Strands Agent</text><text x="619" y="233.425" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">model on Groq</text><line x1="526" y1="221" x2="552" y2="221" stroke="#6b5f4d" stroke-width="1.5" marker-end="url(#ah-4f5d36)"/><text x="461" y="266" font-size="10.5" font-weight="400" fill="#8a5a00" text-anchor="middle" font-style="italic">skills (in the card)</text><text x="619" y="266" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">tools (private)</text><rect x="396" y="274" width="130" height="26" rx="7" fill="#f6e9c8" stroke="#8a5a00" stroke-width="1.2"/><text x="461" y="290.96" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">search_flights</text><rect x="554" y="274" width="130" height="26" rx="7" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.2"/><text x="619" y="290.96" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">search_flights</text><rect x="396" y="306" width="130" height="26" rx="7" fill="#f6e9c8" stroke="#8a5a00" stroke-width="1.2"/><text x="461" y="322.96" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">book_flight</text><rect x="554" y="306" width="130" height="26" rx="7" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.2"/><text x="619" y="322.96" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">book_flight</text><line x1="290" y1="78" x2="259" y2="194" stroke="#8a5a00" stroke-width="1.8" marker-end="url(#ah-8a5a00)" marker-start="url(#ah-8a5a00)"/><line x1="430" y1="78" x2="461" y2="194" stroke="#8a5a00" stroke-width="1.8" marker-end="url(#ah-8a5a00)" marker-start="url(#ah-8a5a00)"/><text x="266" y="118" font-size="11" font-weight="700" fill="#8a5a00" text-anchor="end">A2A over HTTP</text><text x="454" y="118" font-size="11" font-weight="700" fill="#8a5a00" text-anchor="start">A2A over HTTP</text></svg>

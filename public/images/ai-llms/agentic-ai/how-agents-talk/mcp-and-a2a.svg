<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Where MCP and A2A sit</title><desc>A user talks to your agent. Sideways, over A2A, your agent talks to other agents that keep their own model and tools hidden. Downwards, over MCP, it reaches servers that offer tools, resources and prompts.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a00"/></marker></defs><rect width="720" height="330" fill="#ffffff"/><rect x="310" y="12" width="100" height="34" rx="10" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.5"/><text x="360" y="32.75" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">user</text><line x1="360" y1="46" x2="360" y2="90" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="255" y="92" width="210" height="78" rx="10" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.5"/><text x="360" y="120.9" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">your agent</text><text x="360" y="138.26" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">model + agent loop</text><text x="360" y="152.56" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">an MCP client and an A2A client</text><rect x="20" y="92" width="170" height="78" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="105" y="121.1" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">another team's agent</text><text x="105" y="136.6" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">own model, tools, memory</text><text x="105" y="150.25" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">all hidden from you</text><rect x="530" y="92" width="170" height="78" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="615" y="121.1" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">a vendor's agent</text><text x="615" y="136.6" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">own model, tools, memory</text><text x="615" y="150.25" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">all hidden from you</text><line x1="190" y1="131" x2="255" y2="131" stroke="#8a5a00" stroke-width="1.8" marker-end="url(#ah-8a5a00)" marker-start="url(#ah-8a5a00)"/><line x1="465" y1="131" x2="530" y2="131" stroke="#8a5a00" stroke-width="1.8" marker-end="url(#ah-8a5a00)" marker-start="url(#ah-8a5a00)"/><text x="222" y="122" font-size="12" font-weight="700" fill="#8a5a00" text-anchor="middle">A2A</text><text x="497" y="122" font-size="12" font-weight="700" fill="#8a5a00" text-anchor="middle">A2A</text><rect x="105" y="238" width="150" height="52" rx="10" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="180" y="260.925" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">weather server</text><text x="180" y="276.425" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">tool: get_weather</text><line x1="360" y1="172" x2="180" y2="236" stroke="#6b5f4d" stroke-width="1.5" marker-end="url(#ah-4f5d36)" marker-start="url(#ah-4f5d36)"/><rect x="285" y="238" width="150" height="52" rx="10" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="360" y="260.925" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">AWS docs server</text><text x="360" y="276.425" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">tools: search, read</text><line x1="360" y1="172" x2="360" y2="236" stroke="#6b5f4d" stroke-width="1.5" marker-end="url(#ah-4f5d36)" marker-start="url(#ah-4f5d36)"/><rect x="465" y="238" width="150" height="52" rx="10" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="540" y="260.925" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">files server</text><text x="540" y="276.425" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">resources: your files</text><line x1="360" y1="172" x2="540" y2="236" stroke="#6b5f4d" stroke-width="1.5" marker-end="url(#ah-4f5d36)" marker-start="url(#ah-4f5d36)"/><text x="374" y="210" font-size="12" font-weight="700" fill="#6b5f4d" text-anchor="start">MCP</text><text x="360" y="318" font-size="12.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">A2A goes across to other agents. MCP goes down to tools and data.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" width="720" height="392" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>The MCP lifecycle</title><desc>A sequence between client and server. Handshake: the client sends initialize with its version and capabilities, the server replies with its capabilities, and the client sends an initialized notification. Operation: list calls return what the server offers, then calls, reads and prompt requests return results. Shutdown: the client closes the pipes and the server exits.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d36"/></marker></defs><rect width="720" height="392" fill="#ffffff"/><rect x="85" y="14" width="190" height="44" rx="10" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.5"/><text x="180" y="33.075" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">MCP client</text><text x="180" y="49.195" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">client.py</text><line x1="180" y1="58" x2="180" y2="340" stroke="#7d8257" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="450" y="14" width="190" height="44" rx="10" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.5"/><text x="545" y="33.075" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">MCP server</text><text x="545" y="49.195" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">server.py</text><line x1="545" y1="58" x2="545" y2="340" stroke="#7d8257" stroke-width="1.2" stroke-dasharray="5 4"/><text x="16" y="96" font-size="11.5" font-weight="700" fill="#8a5a00" text-anchor="start">1. handshake</text><line x1="183" y1="96" x2="542" y2="96" stroke="#4f5d36" stroke-width="1.7" marker-end="url(#ah-4f5d36)"/><text x="362.5" y="89" font-size="11" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">initialize: version, capabilities {roots}</text><line x1="542" y1="128" x2="183" y2="128" stroke="#4f5d36" stroke-width="1.7" marker-end="url(#ah-4f5d36)"/><text x="362.5" y="121" font-size="11" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">result: capabilities {tools, resources, prompts}</text><line x1="183" y1="160" x2="542" y2="160" stroke="#4f5d36" stroke-width="1.7" marker-end="url(#ah-4f5d36)"/><text x="362.5" y="153" font-size="11" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">notifications/initialized   (no reply)</text><text x="566" y="124" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="start" font-style="italic">each side may use only</text><text x="566" y="139" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="start" font-style="italic">what the other declared</text><line x1="16" y1="180" x2="704" y2="180" stroke="#7d8257" stroke-width="1" stroke-dasharray="3 4"/><text x="16" y="212" font-size="11.5" font-weight="700" fill="#8a5a00" text-anchor="start">2. operation</text><line x1="183" y1="212" x2="542" y2="212" stroke="#4f5d36" stroke-width="1.7" marker-end="url(#ah-4f5d36)"/><text x="362.5" y="205" font-size="11" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">tools/list · resources/list · prompts/list</text><line x1="542" y1="244" x2="183" y2="244" stroke="#4f5d36" stroke-width="1.7" marker-end="url(#ah-4f5d36)"/><text x="362.5" y="237" font-size="11" font-weight="400" fill="#2c361c" text-anchor="middle">names, descriptions, input schemas</text><line x1="183" y1="284" x2="542" y2="284" stroke="#4f5d36" stroke-width="1.7" marker-end="url(#ah-4f5d36)"/><text x="362.5" y="277" font-size="11" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">tools/call · resources/read · prompts/get</text><line x1="542" y1="316" x2="183" y2="316" stroke="#4f5d36" stroke-width="1.7" marker-end="url(#ah-4f5d36)"/><text x="362.5" y="309" font-size="11" font-weight="400" fill="#2c361c" text-anchor="middle">results: text, JSON, prompt messages</text><line x1="16" y1="340" x2="704" y2="340" stroke="#7d8257" stroke-width="1" stroke-dasharray="3 4"/><text x="16" y="370" font-size="11.5" font-weight="700" fill="#8a5a00" text-anchor="start">3. shutdown</text><text x="362" y="370" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">the client closes the pipes, and the server process exits</text></svg>

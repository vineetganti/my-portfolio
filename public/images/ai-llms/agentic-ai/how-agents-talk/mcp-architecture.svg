<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>MCP host, clients and servers</title><desc>A host holds the model and the agent loop and runs one MCP client per server. One client talks to a local server over stdio pipes, the other to a remote server over Streamable HTTP. Every link carries JSON-RPC 2.0 messages.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker></defs><rect width="720" height="300" fill="#ffffff"/><rect x="10" y="10" width="330" height="280" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="175" y="34" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Host</text><text x="175" y="51" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">the app you use: a chat app, an IDE, your agent</text><text x="175" y="84" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">owns the UI, the memory and the model</text><rect x="28" y="120" width="126" height="132" rx="10" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.5"/><text x="91" y="181.625" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">model +</text><text x="91" y="197.875" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">agent loop</text><rect x="186" y="120" width="136" height="50" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="254" y="141.925" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">MCP client</text><text x="254" y="157.425" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">connects to server A</text><rect x="186" y="202" width="136" height="50" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="254" y="223.925" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">MCP client</text><text x="254" y="239.425" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">connects to server B</text><line x1="154" y1="145" x2="184" y2="145" stroke="#6b5f4d" stroke-width="1.4" marker-end="url(#ah-4f5d36)" marker-start="url(#ah-4f5d36)"/><line x1="154" y1="227" x2="184" y2="227" stroke="#6b5f4d" stroke-width="1.4" marker-end="url(#ah-4f5d36)" marker-start="url(#ah-4f5d36)"/><text x="175" y="276" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">one host, many clients; one client, one server</text><rect x="470" y="70" width="230" height="70" rx="10" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="585" y="95.25" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">MCP server A</text><text x="585" y="111.37" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">server.py, a child process</text><text x="585" y="125.02" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">behind it: a dict of fake weather</text><rect x="470" y="188" width="230" height="70" rx="10" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="585" y="213.25" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">MCP server B</text><text x="585" y="229.37" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">a remote service</text><text x="585" y="243.02" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">behind it: a database or an API</text><line x1="322" y1="145" x2="468" y2="105" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)" marker-start="url(#ah-4f5d36)"/><line x1="322" y1="227" x2="468" y2="223" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)" marker-start="url(#ah-4f5d36)"/><text x="392" y="112" font-size="11.5" font-weight="700" fill="#8a5a00" text-anchor="middle">stdio</text><text x="395" y="216" font-size="11.5" font-weight="700" fill="#8a5a00" text-anchor="middle">Streamable HTTP</text><text x="585" y="284" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">JSON-RPC 2.0 messages on every link</text></svg>

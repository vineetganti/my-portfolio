<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>The four A2A building blocks and the task states</title><desc>Top: agent card, message, task and artifact, in order: discover the agent, send a turn, track the work, collect the output. Bottom: a task goes from submitted to working to completed. It can also be rejected, fail, be canceled, or pause at input-required until the caller answers.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker><marker id="ah-a3283f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a3283f"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a00"/></marker></defs><rect width="720" height="350" fill="#ffffff"/><text x="20" y="24" font-size="14" font-weight="700" fill="#3a3226" text-anchor="start">Discover → ask → track → collect</text><rect x="14" y="40" width="150" height="88" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="89" y="73.9" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Agent card</text><text x="89" y="91.26" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">who I am, my skills</text><text x="89" y="105.56" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">found at a fixed URL</text><line x1="166" y1="84" x2="188" y2="84" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="190" y="40" width="150" height="88" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="265" y="73.9" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Message</text><text x="265" y="91.26" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">one turn of talk</text><text x="265" y="105.56" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">parts: text, file, data</text><line x1="342" y1="84" x2="364" y2="84" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="366" y="40" width="150" height="88" rx="10" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.5"/><text x="441" y="73.9" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Task</text><text x="441" y="91.26" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">the unit of work</text><text x="441" y="105.56" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">an id and a state</text><line x1="518" y1="84" x2="540" y2="84" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="542" y="40" width="150" height="88" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="617" y="73.9" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Artifact</text><text x="617" y="91.26" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">the output</text><text x="617" y="105.56" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">parts: text, file, data</text><rect x="14" y="146" width="696" height="194" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="362" y="170" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Task states</text><rect x="40" y="206" width="128" height="32" rx="10" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.5"/><text x="104" y="225.45" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">submitted</text><rect x="230" y="206" width="128" height="32" rx="10" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.5"/><text x="294" y="225.45" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">working</text><rect x="440" y="186" width="128" height="32" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="504" y="205.45" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">completed</text><rect x="440" y="236" width="128" height="32" rx="10" fill="#f7e0da" stroke="#a3283f" stroke-width="1.5"/><text x="504" y="255.45" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">failed</text><rect x="440" y="286" width="128" height="32" rx="10" fill="#f7e0da" stroke="#a3283f" stroke-width="1.5"/><text x="504" y="305.45" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">canceled</text><rect x="230" y="290" width="128" height="32" rx="10" fill="#f6e9c8" stroke="#8a5a00" stroke-width="1.5"/><text x="294" y="309.45" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">input-required</text><rect x="40" y="290" width="128" height="32" rx="10" fill="#f7e0da" stroke="#a3283f" stroke-width="1.5"/><text x="104" y="309.45" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">rejected</text><line x1="168" y1="222" x2="228" y2="222" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><line x1="104" y1="238" x2="104" y2="288" stroke="#a3283f" stroke-width="1.4" marker-end="url(#ah-a3283f)"/><line x1="358" y1="216" x2="438" y2="203" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><line x1="358" y1="224" x2="438" y2="252" stroke="#a3283f" stroke-width="1.4" marker-end="url(#ah-a3283f)"/><line x1="358" y1="232" x2="438" y2="298" stroke="#a3283f" stroke-width="1.4" marker-end="url(#ah-a3283f)"/><line x1="280" y1="238" x2="280" y2="288" stroke="#8a5a00" stroke-width="1.4" marker-end="url(#ah-8a5a00)"/><line x1="310" y1="290" x2="310" y2="240" stroke="#8a5a00" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-8a5a00)"/><text x="318" y="270" font-size="10.5" font-weight="400" fill="#8a5a00" text-anchor="start" font-style="italic">caller answers</text><rect x="596" y="196" width="100" height="28" rx="7" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="646" y="214.5" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="middle">done</text><rect x="596" y="236" width="100" height="28" rx="7" fill="#f7e0da" stroke="#a3283f" stroke-width="1.1"/><text x="646" y="254.5" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="middle">stopped</text><rect x="596" y="276" width="100" height="28" rx="7" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="646" y="294.5" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="middle">still going</text></svg>

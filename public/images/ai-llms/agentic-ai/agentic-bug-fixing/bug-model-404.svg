<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>bug model 404</title><desc>Before and after for the model error. Before: MODEL_NAME was llama-3.3-70b-versatile, the setup check's one test call came back 404 model_not_found, because Groq shut that model down on 16 August 2026. After: a GET to the models endpoint listed the models this key can use, MODEL_NAME became openai/gpt-oss-120b, which Groq names as a replacement, and the check's test call replied OK.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="300" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">A model that no longer exists</text><text x="20" y="62" font-size="12.5" font-weight="700" fill="#b0273f" text-anchor="start">Before</text><text x="380" y="62" font-size="12.5" font-weight="700" fill="#4b7d33" text-anchor="start">After</text><rect x="20" y="72" width="320" height="48" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="180" y="100.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">MODEL_NAME = llama-3.3-70b-versatile</text><line x1="180" y1="120" x2="180" y2="142" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="20" y="142" width="320" height="48" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="180" y="170.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">check_setup.py: one test call</text><line x1="180" y1="190" x2="180" y2="212" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="20" y="212" width="320" height="48" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="180" y="233.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">404 model_not_found</text><text x="180" y="255.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Groq shut it down on 2026-08-16</text><rect x="380" y="72" width="320" height="48" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="540" y="93.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">GET /openai/v1/models</text><text x="540" y="115.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">what can this key use?</text><line x1="540" y1="120" x2="540" y2="142" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="380" y="142" width="320" height="48" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="540" y="163.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">MODEL_NAME = openai/gpt-oss-120b</text><text x="540" y="185.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">a named replacement</text><line x1="540" y1="190" x2="540" y2="212" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="380" y="212" width="320" height="48" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="540" y="233.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">test call replied 'OK'</text><text x="540" y="255.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">then the demo ran</text><text x="20" y="278" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Groq's models page still listed the old model that day; its deprecations page and the API agreed it was gone.</text></svg>

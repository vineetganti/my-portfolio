<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 244" width="720" height="244" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>summary map</title><desc>A map of the post. The loop: run, route, fix, run; the State is a job card; nodes return only what changed; the router only decides. The brakes: MAX_FIX_ATTEMPTS is 3; LangGraph's own limit is 10,007 steps; a fix that won't load keeps the old code; the UI catches API errors. LLM output: strip fences and dedent; ast finds the def; exec is a trust boundary; about three replies in ten had a stray bracket. My run: a model shut down in August; list the models and pick one; two Pythons with a stale venv; dark mode hid the diff. Fixed since: the load error goes back to the model; a give-up says so; the diff is safe in dark mode; the graph draws its loop.</desc><defs></defs><rect width="720" height="244" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">A bug-fixing agent, on one page</text><rect x="20" y="50" width="128" height="124" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="84" y="88.66" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">The loop</text><text x="84" y="110.29" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">run, route, fix, run</text><text x="84" y="124.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">State = job card</text><text x="84" y="138.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">nodes return changes</text><text x="84" y="151.87" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">router only decides</text><rect x="158" y="50" width="128" height="124" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="222" y="88.66" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">The brakes</text><text x="222" y="110.29" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">3 fix attempts max</text><text x="222" y="124.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">LangGraph: 10,007</text><text x="222" y="138.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">bad fix: keep old</text><text x="222" y="151.87" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">UI catches errors</text><rect x="296" y="50" width="128" height="124" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="360" y="88.66" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">LLM output</text><text x="360" y="110.29" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">strip fences, dedent</text><text x="360" y="124.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">ast finds the def</text><text x="360" y="138.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">exec() trusts text</text><text x="360" y="151.87" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">3 in 10: stray )</text><rect x="434" y="50" width="128" height="124" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="498" y="88.66" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">My run</text><text x="498" y="110.29" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">model shut down</text><text x="498" y="124.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">list models, pick</text><text x="498" y="138.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">two Pythons</text><text x="498" y="151.87" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">dark mode hid diff</text><rect x="572" y="50" width="128" height="124" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="636" y="88.66" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Fixed since</text><text x="636" y="110.29" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">sends load error</text><text x="636" y="124.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">says it gave up</text><text x="636" y="138.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">dark-safe diff</text><text x="636" y="151.87" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">draws the loop</text><text x="20" y="204" font-size="12" font-weight="700" fill="#5e5241" text-anchor="start">A retry is only as good as the new information it carries.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 272" width="720" height="272" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>two pythons</title><desc>Two Pythons, one project. The global Python 3.14 is where the Groq switch installed the requirements, so it has langchain-groq 1.2.0 and python -m agentic_bug_fixing works there. The project's .venv was built earlier from the OpenAI requirements, so it has langchain-openai but no langchain-groq, and running the agent from it fails with ModuleNotFoundError: No module named langchain_groq.</desc><defs><marker id="ah-4b7d33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b7d33"/></marker><marker id="ah-b0273f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b0273f"/></marker></defs><rect width="720" height="272" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Two Pythons, one project</text><rect x="20" y="56" width="320" height="70" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="180" y="81.52" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">global Python 3.14</text><text x="180" y="103.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">where the Groq switch ran pip install</text><text x="180" y="117.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">langchain-groq 1.2.0</text><rect x="380" y="56" width="320" height="70" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="540" y="81.52" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">project .venv</text><text x="540" y="103.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">built earlier from the OpenAI requirements</text><text x="540" y="117.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">langchain-openai, no langchain-groq</text><rect x="20" y="160" width="320" height="50" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="180" y="182.27" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">python -m agentic_bug_fixing</text><text x="180" y="203.41" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">works</text><rect x="380" y="160" width="320" height="50" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="540" y="182.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">the same command in .venv</text><text x="540" y="204.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">No module named 'langchain_groq'</text><line x1="180" y1="126" x2="180" y2="160" stroke="#4b7d33" stroke-width="1.6" marker-end="url(#ah-4b7d33)"/><line x1="540" y1="126" x2="540" y2="160" stroke="#b0273f" stroke-width="1.6" marker-end="url(#ah-b0273f)"/><text x="20" y="236" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Which python is first on PATH decides where pip installs. Activate the venv before installing, or check with</text><text x="20" y="251.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">python -c "import sys; print(sys.prefix)".</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>three versions</title><desc>Where the code came from, in three versions. The course original from Scaler Academy used Groq with llama-3.3-70b-versatile and an old langchain.schema import. Shivank Agarwal of Future with Shivank rewrote it for OpenAI's gpt-5-mini with 14 changes and wrote the explainer. My port moved it back to Groq on openai/gpt-oss-120b, as a package with a setup check, and published it on GitHub. I have the last two versions; the first is known only from the explainer's change table.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="230" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">One agent, three versions</text><rect x="20" y="56" width="200" height="96" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="120" y="87.58" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Course original</text><text x="120" y="109.22" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Scaler Academy</text><text x="120" y="123.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Groq, llama-3.3-70b-versatile</text><text x="120" y="136.94" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">langchain.schema import</text><rect x="260" y="56" width="200" height="96" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="360" y="87.58" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Shivank's rewrite</text><text x="360" y="109.22" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Future with Shivank</text><text x="360" y="123.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">OpenAI, gpt-5-mini</text><text x="360" y="136.94" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">14 changes + the explainer</text><rect x="500" y="56" width="200" height="96" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="600" y="87.58" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">My port</text><text x="600" y="109.22" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Groq, openai/gpt-oss-120b</text><text x="600" y="123.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">a package + check_setup</text><text x="600" y="136.94" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">on GitHub</text><line x1="220" y1="104" x2="260" y2="104" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="460" y1="104" x2="500" y2="104" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="20" y="182" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">I have the second and third versions. The first is known only from the explainer's table of what changed.</text></svg>

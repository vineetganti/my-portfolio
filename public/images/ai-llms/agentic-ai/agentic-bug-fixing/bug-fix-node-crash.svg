<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>bug fix node crash</title><desc>Before and after for one of Shivank's changes, from his explainer. Before: code_fix_node asked the LLM, then ran the new function itself; if that still crashed, the exception escaped the graph and the program stopped. After: code_fix_node only loads the new code, and the loop sends it back to code_execution_node, which runs it inside try and except, records the error in the State, and lets the router decide.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="300" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Where the second crash lands</text><text x="20" y="62" font-size="12.5" font-weight="700" fill="#b0273f" text-anchor="start">Before</text><text x="380" y="62" font-size="12.5" font-weight="700" fill="#4b7d33" text-anchor="start">After</text><rect x="20" y="72" width="320" height="48" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="180" y="93.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">code_fix_node runs the new code</text><text x="180" y="115.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">inside the fix step</text><line x1="180" y1="120" x2="180" y2="142" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="20" y="142" width="320" height="48" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="180" y="170.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">the new code crashes too</text><line x1="180" y1="190" x2="180" y2="212" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="20" y="212" width="320" height="48" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="180" y="233.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">exception escapes the graph</text><text x="180" y="255.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">the whole program stops</text><rect x="380" y="72" width="320" height="48" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="540" y="100.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">code_fix_node only loads it</text><line x1="540" y1="120" x2="540" y2="142" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="380" y="142" width="320" height="48" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="540" y="163.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">code_execution_node runs it</text><text x="540" y="185.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">inside try / except</text><line x1="540" y1="190" x2="540" y2="212" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="380" y="212" width="320" height="48" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="540" y="233.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">error recorded in the State</text><text x="540" y="255.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">the router decides</text><text x="20" y="278" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">From Shivank's table of changes. The course original isn't in my log, so this one is described, not re-run.</text></svg>

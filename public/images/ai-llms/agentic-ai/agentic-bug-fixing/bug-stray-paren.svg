<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" width="720" height="370" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>bug stray paren</title><desc>Before and after for the stray bracket. Before: the model's reply ends the fix with an extra closing bracket, exec raises SyntaxError, the agent keeps the old code, re-runs it, sees the same crash, and sends the same prompt again, so the model can send the same broken reply. In my runs 4 of 13 such retries failed again and one run gave up after three. After: the error and the broken reply are saved in the State, the next request carries them, and 10 of 10 retries loaded, 6 in an experiment and 4 in the fixed repo.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="370" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">A stray bracket, and a retry that learns nothing</text><text x="20" y="62" font-size="12.5" font-weight="700" fill="#b0273f" text-anchor="start">Before</text><text x="380" y="62" font-size="12.5" font-weight="700" fill="#4b7d33" text-anchor="start">After</text><rect x="20" y="72" width="320" height="48" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="180" y="93.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">reply ends in an extra )</text><text x="180" y="115.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">return "Error: division by zero")</text><line x1="180" y1="120" x2="180" y2="142" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="20" y="142" width="320" height="48" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="180" y="170.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">SyntaxError, old code kept</text><line x1="180" y1="190" x2="180" y2="212" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="20" y="212" width="320" height="48" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="180" y="233.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">the same prompt again</text><text x="180" y="255.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">nothing says what went wrong</text><line x1="180" y1="260" x2="180" y2="282" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="20" y="282" width="320" height="48" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="180" y="303.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">4 of 13 retries failed again</text><text x="180" y="325.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">one run gave up after 3</text><rect x="380" y="72" width="320" height="48" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="540" y="93.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">reply ends in an extra )</text><text x="540" y="115.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">return "Error: division by zero")</text><line x1="540" y1="120" x2="540" y2="142" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="380" y="142" width="320" height="48" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="540" y="163.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">SyntaxError, old code kept</text><text x="540" y="185.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">and the error + reply saved</text><line x1="540" y1="190" x2="540" y2="212" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="380" y="212" width="320" height="48" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="540" y="233.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">prompt + the load error</text><text x="540" y="255.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">and the reply that broke</text><line x1="540" y1="260" x2="540" y2="282" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="380" y="282" width="320" height="48" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="540" y="303.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">10 of 10 retries loaded</text><text x="540" y="325.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">6 in a test, 4 in the fixed repo</text><text x="20" y="348" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Measured on 2026-11-17 with openai/gpt-oss-120b. The broken reply was the same text every time.</text></svg>

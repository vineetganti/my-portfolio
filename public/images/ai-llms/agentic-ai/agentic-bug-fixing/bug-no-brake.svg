<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>bug no brake</title><desc>Before and after for the attempt limit, run with a stand-in model that always returns the broken reply, so no API calls. Before: with the limit set to a million, the agent made 5,003 fix attempts, one LLM call each with a real model, and stopped only when LangGraph raised GraphRecursionError at its default limit of 10,007 steps. After: with MAX_FIX_ATTEMPTS at 3, it stopped after three attempts and returned the State with error set to True, so the caller decides what to do.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="300" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">What MAX_FIX_ATTEMPTS = 3 protects you from</text><text x="20" y="62" font-size="12.5" font-weight="700" fill="#b0273f" text-anchor="start">Before</text><text x="380" y="62" font-size="12.5" font-weight="700" fill="#4b7d33" text-anchor="start">After</text><rect x="20" y="72" width="320" height="48" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="180" y="100.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">no real limit (1,000,000)</text><line x1="180" y1="120" x2="180" y2="142" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="20" y="142" width="320" height="48" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="180" y="163.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">5,003 fix attempts</text><text x="180" y="185.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">with a real model, 5,003 paid calls</text><line x1="180" y1="190" x2="180" y2="212" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="20" y="212" width="320" height="48" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="180" y="233.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">GraphRecursionError</text><text x="180" y="255.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">LangGraph's default: 10,007 steps</text><rect x="380" y="72" width="320" height="48" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="540" y="100.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">MAX_FIX_ATTEMPTS = 3</text><line x1="540" y1="120" x2="540" y2="142" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="380" y="142" width="320" height="48" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="540" y="170.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">3 fix attempts</text><line x1="540" y1="190" x2="540" y2="212" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="380" y="212" width="320" height="48" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="540" y="233.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">END, error = True</text><text x="540" y="255.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">the caller decides what next</text><text x="20" y="278" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Run with a stand-in model that always sends the broken reply, so neither run cost anything.</text></svg>

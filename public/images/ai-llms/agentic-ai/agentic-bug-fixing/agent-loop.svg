<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>agent loop</title><desc>The agent's graph. START leads to code_execution_node, which runs the function and records the result or the error. The error_router then decides: if the run worked, or three fix attempts have been used, it goes to END. If the function crashed, it goes to code_fix_node, which asks the LLM for a rewrite and loads the new code, and an edge always leads back to code_execution_node to run the new version. Every node reads one shared State and returns only the fields it changed.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-4b7d33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b7d33"/></marker></defs><rect width="720" height="340" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Two nodes, one router, one loop</text><rect x="20" y="104" width="76" height="44" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="58" y="130.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">START</text><rect x="126" y="96" width="190" height="60" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="221" y="123.27" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">code_execution_node</text><text x="221" y="144.41" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">run it, record result or error</text><rect x="366" y="96" width="140" height="60" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="436" y="123.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">error_router</text><text x="436" y="145.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">where next?</text><rect x="624" y="104" width="76" height="44" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="662" y="130.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">END</text><rect x="366" y="216" width="140" height="60" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="436" y="236.34" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">code_fix_node</text><text x="436" y="257.48" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">ask the LLM, load the</text><text x="436" y="271.33" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">code</text><line x1="96" y1="126" x2="126" y2="126" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="316" y1="126" x2="366" y2="126" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="506" y1="126" x2="624" y2="126" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="565" y="116" font-size="11" font-weight="700" fill="#5e5241" text-anchor="middle">ok, or 3 tries</text><line x1="436" y1="156" x2="436" y2="216" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="470" y="190" font-size="11" font-weight="700" fill="#5e5241" text-anchor="middle">crashed</text><path d="M366 246 L221 246 L221 158" fill="none" stroke="#4b7d33" stroke-width="1.6" marker-end="url(#ah-4b7d33)"/><text x="294" y="264" font-size="11" font-weight="700" fill="#4b7d33" text-anchor="middle">run the new version</text><rect x="20" y="196" width="170" height="80" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5" stroke-dasharray="5 4"/><text x="105" y="226.51" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">State</text><text x="105" y="248.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">function, arguments,</text><text x="105" y="262.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">error, attempts, result</text><text x="20" y="310" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Each node gets the whole State and returns only the fields it changed. The router reads the State and changes</text><text x="20" y="325.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">nothing.</text></svg>

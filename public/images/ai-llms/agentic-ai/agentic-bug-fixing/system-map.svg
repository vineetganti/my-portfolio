<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 346" width="720" height="346" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>system map</title><desc>What talks to what. You start the agent from a terminal or open the Gradio app in a browser. Both call the Agent, a LangGraph graph with its State, in one Python process. Only the fix step goes over the network: it sends a prompt to the Groq API, model openai/gpt-oss-120b, using the GROQ_API_KEY loaded from the git-ignored .env file, and gets code back as text. The Agent then runs that text with exec() in the same process, which is the trust boundary.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-b0273f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b0273f"/></marker></defs><rect width="720" height="346" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">What talks to what</text><rect x="20" y="60" width="200" height="54" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="120" y="84.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">your terminal</text><text x="120" y="106.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">python -m agentic_bug_fixing</text><rect x="20" y="150" width="200" height="54" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="120" y="174.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">your browser</text><text x="120" y="196.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Gradio app on port 7860</text><rect x="280" y="100" width="170" height="64" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="365" y="129.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Agent</text><text x="365" y="151.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">LangGraph graph + State</text><rect x="530" y="105" width="170" height="54" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="615" y="129.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Groq API</text><text x="615" y="151.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">openai/gpt-oss-120b</text><rect x="280" y="236" width="170" height="54" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="365" y="260.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">exec()</text><text x="365" y="282.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">runs the LLM's code here</text><rect x="530" y="236" width="170" height="54" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="615" y="260.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">.env</text><text x="615" y="282.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">GROQ_API_KEY, git-ignored</text><line x1="220" y1="87" x2="280" y2="122" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="220" y1="177" x2="280" y2="142" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="450" y1="132" x2="530" y2="132" stroke="#5e5241" stroke-width="1.6" marker-start="url(#ah-5e5241)" marker-end="url(#ah-5e5241)"/><text x="490" y="122" font-size="11" font-weight="700" fill="#5e5241" text-anchor="middle">prompt / code</text><line x1="365" y1="164" x2="365" y2="236" stroke="#b0273f" stroke-width="1.6" marker-end="url(#ah-b0273f)"/><text x="399" y="204" font-size="11" font-weight="700" fill="#b0273f" text-anchor="middle">new code</text><line x1="615" y1="236" x2="615" y2="159" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="633" y="201.5" font-size="11" font-weight="700" fill="#5e5241" text-anchor="middle">key</text><text x="20" y="316" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Only the fix step uses the network. Everything else, including running what the model wrote, happens on your</text><text x="20" y="331.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">machine.</text></svg>

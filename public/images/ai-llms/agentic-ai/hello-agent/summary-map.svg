<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 302" width="720" height="302" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Post 1 at a glance: a first agent</title><desc>A map of post 1 in four columns. Agent: a loop of model, tool call and result. Strands: one Agent class. Groq: an OpenAI-compatible API. Building: tools from plain functions, prebuilt tools, system prompts.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker></defs><rect width="720" height="302" fill="#ffffff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#3a3226" text-anchor="start">Post 1 at a glance: a first agent</text><rect x="10" y="44" width="161.5" height="192" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="90.75" y="71" font-size="13.5" font-weight="700" fill="#3a3226" text-anchor="middle">Agent</text><rect x="20" y="88" width="141.5" height="28" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="90.75" y="106.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">model decides</text><rect x="20" y="124" width="141.5" height="28" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="90.75" y="142.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">calls a tool</text><rect x="20" y="160" width="141.5" height="28" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="90.75" y="178.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">reads the result</text><rect x="20" y="196" width="141.5" height="28" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="90.75" y="214.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">repeats until done</text><line x1="173.5" y1="66" x2="187.5" y2="66" stroke="#6b5f4d" stroke-width="1.6"
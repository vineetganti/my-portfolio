<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Swapping model providers by changing settings</title><desc>The Strands code stays the same. Only the api_key and base_url settings change to point at Groq, another OpenAI-compatible provider, or a local server.</desc><defs><marker id="ah-7d8257" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7a6d57"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a5400"/></marker></defs><rect width="720" height="300" fill="#fffdf8"/><rect x="20" y="30" width="270" height="206" rx="12" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="36" y="54" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Your Strands code</text><rect x="28" y="106" width="254" height="46" rx="6" fill="#fde3ad" stroke="#9a5400" stroke-width="1.2"/><text x="36" y="80" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">OpenAIModel(</text><text x="36" y="100" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">  client_args={</text><text x="36" y="124" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">    "api_key": …,</text><text x="36" y="144" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">    "base_url": …,</text><text x="36" y="166" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">  },</text><text x="36" y="186" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">  model_id="openai/gpt-oss-120b",</text><text x="36" y="206" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">)</text><text x="155" y="256" font-size="12" font-weight="400" fill="#9a5400" text-anchor="middle" font-style="italic">only the highlighted lines change</text><rect x="470" y="36" width="230" height="64" rx="12" fill="#fdf0d4" stroke="#9a5400" stroke-width="2.2"/><text x="585" y="62" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Groq (this post)</text><text x="585" y="82" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">api.groq.com/openai/v1</text><rect x="470" y="118" width="230" height="64" rx="12" fill="#fffdf8" stroke="#7a6d57" stroke-width="1.3" stroke-dasharray="6 4"/><text x="585" y="144" font-size="14" font-weight="700" fill="#7a6d57" text-anchor="middle">Another provider</text><text x="585" y="164" font-size="12" font-weight="400" fill="#7a6d57" text-anchor="middle">any OpenAI-compatible endpoint</text><rect x="470" y="200" width="230" height="64" rx="12" fill="#fffdf8" stroke="#7a6d57" stroke-width="1.3" stroke-dasharray="6 4"/><text x="585" y="226" font-size="14" font-weight="700" fill="#7a6d57" text-anchor="middle">A local server</text><text x="585" y="246" font-size="12" font-weight="400" fill="#7a6d57" text-anchor="middle">a model running on your machine</text><line x1="284" y1="124" x2="466" y2="70" stroke="#9a5400" stroke-width="2" marker-end="url(#ah-8a5a00)"/><line x1="284" y1="130" x2="466" y2="150" stroke="#7a6d57" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-7d8257)"/><line x1="284" y1="136" x2="466" y2="232" stroke="#7a6d57" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-7d8257)"/><text x="360" y="288" font-size="13" font-weight="400" fill="#5e5241" text-anchor="middle">Groq speaks the same protocol as OpenAI, so swapping providers is a settings change, not a rewrite.</text></svg>

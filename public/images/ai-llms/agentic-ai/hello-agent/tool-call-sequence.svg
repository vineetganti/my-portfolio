<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 414" width="720" height="414" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>A tool call for the time question</title><desc>The user asks for the time in two cities. The model has no clock, so it calls the current_time tool once for Asia/Kolkata and once for America/New_York, reads both results and writes the answer.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a00"/></marker></defs><rect width="720" height="414" fill="#ffffff"/><rect x="75" y="14" width="150" height="36" rx="10" fill="#f6ecd6" stroke="#6b5f4d" stroke-width="1.5"/><text x="150" y="37" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">You</text><line x1="150" y1="50" x2="150" y2="366" stroke="#8d8068" stroke-width="1.2" stroke-dasharray="4 5"/><rect x="315" y="14" width="150" height="36" rx="10" fill="#f6ecd6" stroke="#6b5f4d" stroke-width="1.5"/><text x="390" y="37" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Model (Groq)</text><line x1="390" y1="50" x2="390" y2="366" stroke="#8d8068" stroke-width="1.2" stroke-dasharray="4 5"/><rect x="555" y="14" width="150" height="36" rx="10" fill="#f6ecd6" stroke="#6b5f4d" stroke-width="1.5"/><text x="630" y="37" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">current_time tool</text><line x1="630" y1="50" x2="630" y2="366" stroke="#8d8068" stroke-width="1.2" stroke-dasharray="4 5"/><line x1="156" y1="120" x2="384" y2="120" stroke="#6b5f4d" stroke-width="2" marker-end="url(#ah-4f5d36)"/><text x="270" y="90" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">“What time is it right now in</text><text x="270" y="105" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">Bangalore and in New York?”</text><text x="380" y="150" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="end" font-style="italic">has no clock, so it needs a tool</text><line x1="396" y1="186" x2="624" y2="186" stroke="#8a5a00" stroke-width="2" marker-end="url(#ah-8a5a00)"/><text x="510" y="178" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">call 1: timezone = Asia/Kolkata</text><line x1="396" y1="222" x2="624" y2="222" stroke="#8a5a00" stroke-width="2" marker-end="url(#ah-8a5a00)"/><text x="510" y="214" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">call 2: timezone = America/New_York</text><line x1="624" y1="256" x2="396" y2="256" stroke="#8a5a00" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-8a5a00)"/><text x="510" y="248" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="middle">Sunday, 25 October 2026 09:16 PM IST</text><line x1="624" y1="292" x2="396" y2="292" stroke="#8a5a00" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-8a5a00)"/><text x="510" y="284" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="middle">Sunday, 25 October 2026 11:46 AM EDT</text><text x="380" y="308" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="end" font-style="italic">writes the answer in plain English</text><line x1="384" y1="352" x2="156" y2="352" stroke="#6b5f4d" stroke-width="2" marker-end="url(#ah-4f5d36)"/><text x="270" y="330" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">Bangalore: 09:16 PM IST</text><text x="270" y="345" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">New York: 11:46 AM EDT</text><text x="360" y="388" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">The log doesn't show the order of the two calls: the model may ask for</text><text x="360" y="404" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">both at once or one after the other.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 298" width="720" height="298" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>A chat versus an agent</title><desc>A chat is one prompt in and one answer out, so the user has to stitch steps together. An agent is a loop where the model decides, calls a tool, reads the result and decides again until it is done.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a5400"/></marker></defs><rect width="720" height="298" fill="#fffdf8"/><rect x="10" y="14" width="345" height="272" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><rect x="365" y="14" width="345" height="272" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="182" y="40" font-size="15" font-weight="700" fill="#2f281e" text-anchor="middle">A chat: one round trip</text><text x="537" y="40" font-size="15" font-weight="700" fill="#2f281e" text-anchor="middle">An agent: a loop</text><rect x="24" y="70" width="84" height="58" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="66.0" y="91" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">You</text><text x="66.0" y="109" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">one prompt</text><rect x="138" y="70" width="84" height="58" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="180.0" y="91" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Model</text><text x="180.0" y="109" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">predicts</text><text x="180.0" y="123" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">the reply</text><rect x="252" y="70" width="84" height="58" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="294.0" y="91" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Answer</text><text x="294.0" y="109" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">one reply</text><line x1="110" y1="99" x2="136" y2="99" stroke="#5e5241" stroke-width="2" marker-end="url(#ah-4f5d36)"/><line x1="224" y1="99" x2="250" y2="99" stroke="#5e5241" stroke-width="2" marker-end="url(#ah-4f5d36)"/><path d="M294 132 C294 192, 66 192, 66 134" fill="none" stroke="#9a5400" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-8a5a00)"/><text x="180" y="206" font-size="12" font-weight="400" fill="#9a5400" text-anchor="middle" font-style="italic">you copy it into the next prompt</text><text x="180" y="256" font-size="13" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">You are the glue between steps.</text><rect x="384" y="84" width="72" height="58" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="420.0" y="105" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">You</text><text x="420.0" y="123" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">one</text><text x="420.0" y="137" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">request</text><rect x="500" y="60" width="100" height="58" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="550.0" y="81" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Model</text><text x="550.0" y="99" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">decides the</text><text x="550.0" y="113" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">next step</text><rect x="500" y="168" width="100" height="58" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="550.0" y="189" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Tools</text><text x="550.0" y="207" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">search, code,</text><text x="550.0" y="221" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">APIs</text><rect x="628" y="60" width="76" height="58" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="666.0" y="81" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Answer</text><text x="666.0" y="99" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">final</text><text x="666.0" y="113" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">reply</text><line x1="458" y1="110" x2="498" y2="96" stroke="#5e5241" stroke-width="2" marker-end="url(#ah-4f5d36)"/><line x1="602" y1="89" x2="626" y2="89" stroke="#5e5241" stroke-width="2" marker-end="url(#ah-4f5d36)"/><line x1="535" y1="120" x2="535" y2="166" stroke="#5e5241" stroke-width="2" marker-end="url(#ah-4f5d36)"/><line x1="575" y1="166" x2="575" y2="120" stroke="#9a5400" stroke-width="2" marker-end="url(#ah-8a5a00)"/><text x="527" y="148" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="end" font-style="italic">call a tool</text><text x="583" y="148" font-size="11.5" font-weight="400" fill="#9a5400" text-anchor="start" font-style="italic">result</text><text x="537" y="256" font-size="13" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">The loop does the stitching,</text><text x="537" y="272" font-size="13" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">until the model says it's done.</text></svg>

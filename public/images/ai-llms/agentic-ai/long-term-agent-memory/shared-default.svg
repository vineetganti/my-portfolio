<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>shared default</title><desc>Before and after for a bug Shivank fixed in memory_demo_2. Before: each MemoryDemo starts with self.episodic_memory = EPISODIC_MEMORY_DEFAULT, which is the same dictionary, not a copy. Updating a preference changes the default itself, so a second MemoryDemo in the same program starts with the changed values. After: copy.deepcopy(EPISODIC_MEMORY_DEFAULT) gives each instance its own copy, and the default stays as written.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="300" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Before and after: a default that changed itself</text><text x="20" y="62" font-size="12.5" font-weight="700" fill="#b0273f" text-anchor="start">Before</text><text x="380" y="62" font-size="12.5" font-weight="700" fill="#4b7d33" text-anchor="start">After</text><rect x="20" y="72" width="320" height="48" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="180" y="93.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">memory = DEFAULT</text><text x="180" y="115.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">the same dict, not a copy</text><line x1="180" y1="120" x2="180" y2="140" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="20" y="140" width="320" height="48" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="180" y="161.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">update: detail_level = brief</text><text x="180" y="183.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">changes DEFAULT too</text><line x1="180" y1="188" x2="180" y2="208" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="20" y="208" width="320" height="48" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="180" y="229.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">a new MemoryDemo()</text><text x="180" y="251.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">starts already 'brief'</text><rect x="380" y="72" width="320" height="48" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="540" y="93.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">memory = copy.deepcopy(DEFAULT)</text><text x="540" y="115.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">its own copy</text><line x1="540" y1="120" x2="540" y2="140" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="380" y="140" width="320" height="48" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="540" y="161.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">update: detail_level = brief</text><text x="540" y="183.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">changes only the copy</text><line x1="540" y1="188" x2="540" y2="208" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="380" y="208" width="320" height="48" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="540" y="229.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">a new MemoryDemo()</text><text x="540" y="251.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">starts 'detailed', as written</text><text x="20" y="274" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">From the explainer's list of changes; the fixed code is what I ran.</text></svg>

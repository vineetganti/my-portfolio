<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>episode paths</title><desc>Episodic memory in use, from the lecture. A user asks 'Where is my order #78910?'. Episode 1, a failure: the agent asked for the order ID, then sent it straight to the shipping API, which answered 'Invalid ID format'. Episode 2, a success: the agent validated the ID first, turning it into ORD-78910, looked it up in the order database and confirmed the status. When a new request 'Where is my order #55321?' arrives, the agent retrieves both past episodes with the same goal, compares the outcomes, and follows the path that worked.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="330" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Remember what happened, then avoid it</text><text x="20" y="62" font-size="12.5" font-weight="700" fill="#b0273f" text-anchor="start">Episode 1: failure</text><text x="20" y="162" font-size="12.5" font-weight="700" fill="#4b7d33" text-anchor="start">Episode 2: success</text><rect x="20" y="72" width="140" height="44" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="90" y="98.2" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">ask for ID</text><rect x="180" y="72" width="140" height="44" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="250" y="98.2" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">shipping API</text><line x1="162" y1="94" x2="178" y2="94" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="340" y="72" width="140" height="44" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="410" y="98.2" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">'Invalid ID format'</text><line x1="322" y1="94" x2="338" y2="94" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="20" y="172" width="140" height="44" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="90" y="198.2" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">ask for ID</text><rect x="180" y="172" width="140" height="44" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="250" y="198.2" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">validate ID</text><line x1="162" y1="194" x2="178" y2="194" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="340" y="172" width="140" height="44" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="410" y="198.2" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">order database</text><line x1="322" y1="194" x2="338" y2="194" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="500" y="172" width="140" height="44" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="570" y="198.2" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">confirm status</text><line x1="482" y1="194" x2="498" y2="194" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="500" y="62" width="200" height="64" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="600" y="84.52" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">new: order #55321</text><text x="600" y="106.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">find episodes with this goal,</text><text x="600" y="120.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">follow the one that worked</text><text x="20" y="244" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">The shipping API wants the courier's tracking number, not the shop's order number. A person learns that once; an</text><text x="20" y="259.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">agent without episodic memory makes the mistake for every customer. (The lecture's example, not re-run here.)</text></svg>

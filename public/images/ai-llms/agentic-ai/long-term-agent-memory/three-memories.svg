<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>three memories</title><desc>memory_demo_1 as a LangGraph pipeline of four steps. A customer's question enters. Step 1, semantic memory, adds general facts that match keywords in the question, such as the 30-day return policy. Step 2 adds what is stored about this customer: name, preferences such as detail level, and recent interactions; the code calls this episodic memory. Step 3, procedural memory, follows fixed steps to look up the customer's orders. Step 4 sends all three to the model, which writes the reply. The memories are Python dictionaries, so the flow is easy to see.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="320" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Three memories feed one answer</text><rect x="20" y="60" width="140" height="60" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="90" y="80.52" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">question</text><text x="90" y="102.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">orders + return</text><text x="90" y="116.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">policy?</text><rect x="200" y="40" width="220" height="56" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="310" y="65.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">1. semantic</text><text x="310" y="87.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">facts: return period 30 days</text><rect x="200" y="112" width="220" height="56" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="310" y="137.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">2. 'episodic' (the profile)</text><text x="310" y="159.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">name, detail level, past chats</text><rect x="200" y="184" width="220" height="56" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="310" y="209.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">3. procedural</text><text x="310" y="231.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">look up this user's orders</text><rect x="480" y="104" width="220" height="72" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="590" y="130.51" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">4. generate_response</text><text x="590" y="152.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">the model writes the reply</text><text x="590" y="166.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">from all three</text><line x1="160" y1="90" x2="198" y2="68" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="310" y1="96" x2="310" y2="110" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="310" y1="168" x2="310" y2="182" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="420" y1="212" x2="520" y2="178" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="20" y="262" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Semantic facts are found by keywords ('return', 'shipping'): 'Can I get a refund?' finds nothing. The lecture</text><text x="20" y="277.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">would call the customer profile semantic memory about the user; the code calls it episodic.</text></svg>

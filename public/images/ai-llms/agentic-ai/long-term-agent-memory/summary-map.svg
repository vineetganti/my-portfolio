<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 244" width="720" height="244" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>summary map</title><desc>A map of the post in four columns. Three kinds: semantic is what is true, episodic is what happened, procedural is how to act. Mem0: an LLM extracts facts, they are embedded locally and kept in FAISS per user. Three memories in one agent: keyword facts, the customer profile and an order lookup feed one reply. Memory that learns: a detector updates preferences in the hot path and saves them, JSON mode can still fail, and a shared default needs a deep copy.</desc><defs></defs><rect width="720" height="244" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Long-term memory, in four ideas</text><rect x="20" y="50" width="162" height="124" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="101" y="88.66" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Three kinds</text><text x="101" y="110.29" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">semantic: what is true</text><text x="101" y="124.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">episodic: what happened</text><text x="101" y="138.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">procedural: how to act</text><text x="101" y="151.87" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">kept per user</text><rect x="192" y="50" width="162" height="124" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="273" y="88.66" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Mem0</text><text x="273" y="110.29" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">an LLM extracts facts</text><text x="273" y="124.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">local embeddings</text><text x="273" y="138.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">FAISS, per user_id</text><text x="273" y="151.87" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">search before answering</text><rect x="364" y="50" width="162" height="124" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="445" y="88.66" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">One agent, three</text><text x="445" y="110.29" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">keyword facts</text><text x="445" y="124.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">the customer profile</text><text x="445" y="138.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">an order procedure</text><text x="445" y="151.87" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">one reply</text><rect x="536" y="50" width="162" height="124" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="617" y="88.66" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Memory that learns</text><text x="617" y="110.29" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">detect, update, save</text><text x="617" y="124.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">hot path, same turn</text><text x="617" y="138.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">JSON mode can fail</text><text x="617" y="151.87" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">deep-copy defaults</text><text x="20" y="204" font-size="12" font-weight="700" fill="#5e5241" text-anchor="start">Long-term memory is a store plus a rule for what goes in and how it comes back out.</text></svg>

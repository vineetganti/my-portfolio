<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>preference update</title><desc>memory_demo_2 over three turns. Turn 1, 'What is the status of my orders and the return policy?': the detector finds no preference change, and the reply is detailed. Turn 2, 'Please keep your answers brief from now on': the detector returns detail_level brief, the preference is updated at once, saved to episodic_memory.json with an audit trail, and the same turn's reply is already brief. Turn 3, 'Can you give me an update on all my orders?': on Claude the detector found no change and the reply was a short list; on Groq gpt-oss-120b the JSON-mode call itself returned HTTP 400 'Failed to generate JSON', which the code did not catch, so the program stopped.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="340" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Memory that updates itself, three turns</text><rect x="20" y="60" width="220" height="100" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="130" y="93.58" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">turn 1</text><text x="130" y="115.22" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">'status + return policy?'</text><text x="130" y="129.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">no change</text><text x="130" y="142.94" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">detailed reply</text><rect x="250" y="60" width="220" height="100" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="360" y="93.58" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">turn 2</text><text x="360" y="115.22" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">'keep your answers brief'</text><text x="360" y="129.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">detail_level -&gt; brief</text><text x="360" y="142.94" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">saved to JSON, brief reply</text><line x1="242" y1="110" x2="250" y2="110" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="480" y="60" width="220" height="100" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="590" y="93.58" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">turn 3</text><text x="590" y="115.22" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">'update on all my orders?'</text><text x="590" y="129.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Claude: no change, short list</text><text x="590" y="142.94" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Groq: HTTP 400, crash</text><line x1="472" y1="110" x2="480" y2="110" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="250" y="190" width="220" height="50" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="212.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">episodic_memory.json</text><text x="360" y="234.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">preferences + preference_history</text><line x1="360" y1="160" x2="360" y2="188" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="20" y="260" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">The detector asks the model for JSON in JSON mode. On Groq, output that isn't valid JSON is rejected by the API</text><text x="20" y="275.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">itself, as an error, before the code's json.loads ever runs, and the code only caught json.JSONDecodeError.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>retrieve rerank</title><desc>Two-stage search on eight sentences for the query 'COVID-19 Symptoms'. Stage one, the bi-encoder, embeds query and sentences separately and ranks by cosine similarity: the short sentence 'COVID-19 has many symptoms.' comes first at 0.92, and the sentence that actually lists symptoms is fourth. Stage two, the cross-encoder, reads each query and sentence pair together: the sentence that lists a high temperature, a cough and a lost sense of smell moves to first at 10.4. But the false sentence 'COVID-19 has the following symptom: memory loss, poor judgment, and confusion' moves up to second at 9.8. A reranker judges relevance, not truth.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-b0273f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b0273f"/></marker></defs><rect width="720" height="360" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Retrieve fast, then rerank carefully</text><rect x="20" y="64" width="150" height="70" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="95" y="89.52" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">8 sentences</text><text x="95" y="111.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">query:</text><text x="95" y="125.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">COVID-19 Symptoms</text><rect x="210" y="56" width="220" height="86" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="320" y="82.58" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">1. bi-encoder</text><text x="320" y="104.22" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">each text embedded alone</text><text x="320" y="118.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">#1 'has many symptoms' 0.92</text><text x="320" y="131.94" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">real list of symptoms: #4</text><rect x="470" y="56" width="230" height="86" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="585" y="82.58" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">2. cross-encoder</text><text x="585" y="104.22" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">reads query + sentence together</text><text x="585" y="118.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">#1 the real list 10.4</text><text x="585" y="131.94" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">#8 dementia −9.9</text><line x1="170" y1="99" x2="210" y2="99" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="430" y1="99" x2="470" y2="99" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="450" y="91" font-size="11" font-weight="700" fill="#5e5241" text-anchor="middle">top K</text><rect x="470" y="182" width="230" height="70" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="585" y="207.51" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">but #2 at 9.8</text><text x="585" y="229.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">'COVID-19 … memory loss,</text><text x="585" y="243.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">poor judgment, confusion'</text><line x1="585" y1="142" x2="585" y2="180" stroke="#b0273f" stroke-width="1.6" marker-end="url(#ah-b0273f)"/><text x="20" y="182" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">The bi-encoder's document vectors are computed once and stored, so it</text><text x="20" y="197.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">can search millions in milliseconds. The cross-encoder runs the whole</text><text x="20" y="213.05" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">model per pair, so it only sees the top K.</text><text x="20" y="300" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">The false sentence has the right topic and the right shape, so it scores as relevant. Checking truth needs</text><text x="20" y="315.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">trusted sources in the knowledge base.</text></svg>

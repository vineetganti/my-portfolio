<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>hyde</title><desc>HyDE in two rows. Without it, the shopper's query 'I want running shoes' is searched with BM25 word matching against a product catalogue, and only one product matches, the Adidas Ultraboost, at a score of 1.59, because its title has the word Shoes. With HyDE, a model first writes four made-up product titles, and the query plus those titles is searched. On Groq the top three were all running shoes: Nike Pegasus 8.09, Adidas Ultraboost 6.32, Asics Gel-Kayano 4.45. Two Claude runs wrote different titles: in one, the top score rose to 11.06 but third place was Puma casual footwear, because the made-up titles said 'everyday comfort'; in the other, all three were running shoes.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="330" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">HyDE: search with a made-up answer, not the question</text><rect x="20" y="60" width="200" height="60" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="120" y="87.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">shopper's query</text><text x="120" y="109.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">I want running shoes</text><rect x="270" y="60" width="180" height="60" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="87.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">BM25 word match</text><text x="360" y="109.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">catalogue of products</text><rect x="500" y="60" width="200" height="60" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="600" y="87.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">1 hit, score 1.59</text><text x="600" y="109.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">only 'Shoes' matched</text><line x1="220" y1="90" x2="270" y2="90" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="450" y1="90" x2="498" y2="90" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="20" y="170" width="200" height="60" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="120" y="197.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">model writes 4 titles</text><text x="120" y="219.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">fake listings, never shown</text><rect x="270" y="170" width="180" height="60" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="197.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">BM25 again</text><text x="360" y="219.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">query + fake listings</text><rect x="500" y="150" width="200" height="50" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="600" y="172.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Groq: 3 running shoes</text><text x="600" y="194.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">8.09, 6.32, 4.45</text><rect x="500" y="210" width="200" height="50" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="600" y="232.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Claude: 2 runs differ</text><text x="600" y="254.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">one put Puma casual 3rd</text><line x1="120" y1="120" x2="120" y2="170" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="220" y1="200" x2="270" y2="200" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="450" y1="200" x2="498" y2="178" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="450" y1="200" x2="498" y2="230" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="20" y="284" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">The made-up words do the finding. 'Everyday comfort' in one Claude run matched 'casual footwear for everyday</text><text x="20" y="299.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">wear': HyDE can pull in the wrong neighbours, and which ones changes from run to run.</text></svg>

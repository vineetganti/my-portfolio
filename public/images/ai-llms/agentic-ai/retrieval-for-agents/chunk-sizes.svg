<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>chunk sizes</title><desc>The same short article about the heart, split three ways, and what comes back for the question 'What is the primary function of the heart?'. At 50 characters there are 16 chunks and the top result is a fragment: 'the body and removes metabolic waste. The heart'. At 150 characters there are 6 chunks and the top result is a whole sentence: 'The human heart is a muscular organ that pumps blood through the circulatory system.' At 400 characters there are 2 chunks and the answer is buried in half the article.</desc><defs></defs><rect width="720" height="280" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">One article, three chunk sizes, the same question</text><rect x="20" y="56" width="220" height="150" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="130" y="100.72" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">50 characters</text><text x="130" y="122.36" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">16 chunks</text><text x="130" y="136.22" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">top hit: 'the body and</text><text x="130" y="150.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">removes metabolic waste.</text><text x="130" y="163.94" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">The heart'</text><text x="130" y="177.8" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">too small: ideas split</text><rect x="250" y="56" width="220" height="150" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="360" y="100.72" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">150 characters</text><text x="360" y="122.36" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">6 chunks</text><text x="360" y="136.22" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">top hit: 'The human heart</text><text x="360" y="150.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">is a muscular organ that</text><text x="360" y="163.94" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">pumps blood…'</text><text x="360" y="177.8" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">one idea per chunk</text><rect x="480" y="56" width="220" height="150" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="590" y="100.72" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">400 characters</text><text x="590" y="122.36" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">2 chunks</text><text x="590" y="136.22" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">top hit: four sentences</text><text x="590" y="150.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">in one block</text><text x="590" y="163.94" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle"></text><text x="590" y="177.8" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">too big: answer buried</text><text x="20" y="230" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">RecursiveCharacterTextSplitter with 10% overlap. Measured on both runs; the splitter has no model in it, so the</text><text x="20" y="245.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">numbers are identical.</text></svg>

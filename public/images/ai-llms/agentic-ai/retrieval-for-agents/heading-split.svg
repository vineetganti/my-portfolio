<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>heading split</title><desc>Before and after for headings. Before, a fixed-length splitter that may only cut at line breaks packs lines into 200-character chunks, so chunk 3 ends with the heading '### Unsupervised Learning' while the text under it starts chunk 4. After, a Markdown header splitter makes one chunk per section, and each chunk carries its address as metadata: Header 1 Machine Learning Fundamentals, Header 2 Types of Machine Learning, Header 3 Unsupervised Learning.</desc><defs></defs><rect width="720" height="320" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Before and after: a heading cut away from its text</text><text x="20" y="62" font-size="12.5" font-weight="700" fill="#b0273f" text-anchor="start">Fixed length, cut at line breaks</text><text x="380" y="62" font-size="12.5" font-weight="700" fill="#4b7d33" text-anchor="start">Split at the headings</text><rect x="20" y="74" width="320" height="84" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="180" y="99.58" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">chunk 3</text><text x="180" y="121.22" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">- Classification …</text><text x="180" y="135.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">- Regression …</text><text x="180" y="148.94" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">### Unsupervised Learning</text><rect x="20" y="174" width="320" height="84" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="180" y="199.59" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">chunk 4</text><text x="180" y="221.22" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Unsupervised learning finds</text><text x="180" y="235.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">hidden patterns …</text><text x="180" y="248.94" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">(its heading is in chunk 3)</text><rect x="380" y="74" width="320" height="184" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="540" y="128.79" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">one chunk per section</text><text x="540" y="150.43" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Unsupervised learning finds</text><text x="540" y="164.29" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">hidden patterns …</text><text x="540" y="178.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle"></text><text x="540" y="192.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">metadata: Header 1 Machine Learning</text><text x="540" y="205.87" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Fundamentals &gt; Header 2 Types of</text><text x="540" y="219.73" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Machine Learning &gt; Header 3 Unsupervised</text><text x="20" y="282" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">The metadata can be shown as the source, used as a filter, or added to the chunk text before embedding.</text></svg>

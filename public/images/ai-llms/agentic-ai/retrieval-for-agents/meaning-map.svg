<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>meaning map</title><desc>Text becomes numbers before it can be compared. A sentence such as 'Bananas are a great source of potassium' goes into an embedding model, all-MiniLM-L6-v2, which returns 384 numbers. The question 'fruit and nutrition' goes through the same model. Cosine similarity compares the two lists: 0.47 for bananas, 0.71 for 'Apples and oranges are healthy fruits', and 0.10 for a cricket sentence, so the two fruit sentences win although the banana one shares no word with the question.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="300" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Turn text into numbers, then compare the numbers</text><rect x="20" y="60" width="190" height="60" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="115" y="87.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">a document</text><text x="115" y="109.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Bananas are a great source…</text><rect x="20" y="170" width="190" height="60" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="115" y="197.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">the question</text><text x="115" y="219.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">fruit and nutrition</text><rect x="260" y="112" width="170" height="64" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="345" y="134.51" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">embedding model</text><text x="345" y="156.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">all-MiniLM-L6-v2, 384</text><text x="345" y="170.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">numbers</text><rect x="480" y="112" width="220" height="64" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="590" y="141.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">cosine similarity</text><text x="590" y="163.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">same direction = same meaning</text><line x1="210" y1="90" x2="258" y2="130" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="210" y1="200" x2="258" y2="158" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="430" y1="144" x2="480" y2="144" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="480" y="196" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Measured: apples and oranges 0.71,</text><text x="480" y="211.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">bananas 0.47, cricket 0.10.</text><text x="20" y="262" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">The banana sentence shares no word with the question and still ranks second. Keyword search could not do that.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>colang bug</title><desc>Before and after for the bug Shivank found in the original guardrails demo. Before: rails.co tried to classify every message with a flow that said 'bot classify intent', defined as the sentence 'I need to classify the user's intent'. In Colang, define bot is a message the bot says, not an instruction to the model, so for every message the bot replied with that sentence, and the flows waiting for a classified intent never fired: no attack was ever blocked. After: NeMo's built-in self check input and self check output rails, with the policy written as two plain-English yes or no questions in prompts.yml.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="300" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Before and after: a guardrail that couldn't block anything</text><text x="20" y="62" font-size="12.5" font-weight="700" fill="#b0273f" text-anchor="start">Before (the original rails.co)</text><text x="380" y="62" font-size="12.5" font-weight="700" fill="#4b7d33" text-anchor="start">After</text><rect x="20" y="72" width="320" height="48" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="180" y="100.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">flow: user ... -&gt; bot classify intent</text><line x1="180" y1="120" x2="180" y2="140" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="20" y="140" width="320" height="48" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="180" y="161.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">'define bot' = a sentence to SAY</text><text x="180" y="183.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">not an instruction to the model</text><line x1="180" y1="188" x2="180" y2="208" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="20" y="208" width="320" height="48" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="180" y="229.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">intent flows never fire</text><text x="180" y="251.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">no attack ever blocked</text><rect x="380" y="72" width="320" height="48" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="540" y="93.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">rails: input: self check input</text><text x="540" y="115.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">and output: self check output</text><line x1="540" y1="120" x2="540" y2="140" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="380" y="140" width="320" height="48" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="540" y="161.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">prompts.yml: two yes/no policies</text><text x="540" y="183.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">readable by non-programmers</text><line x1="540" y1="188" x2="540" y2="208" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="380" y="208" width="320" height="48" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="540" y="229.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">attacks stop at the input rail</text><text x="540" y="251.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">measured: 6–7 of 11 messages</text><text x="20" y="274" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">From the explainer's list of changes; the fixed configuration is what I ran.</text></svg>

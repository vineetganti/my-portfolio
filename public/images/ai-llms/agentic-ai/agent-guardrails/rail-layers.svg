<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>rail layers</title><desc>The NeMo Guardrails demo as three rail layers around the main model. The input rail, self check input, asks the model a yes or no policy question about the user's message and blocks with a fixed refusal. Dialog rails match the message to example sentences by meaning and give a fixed reply for greetings and personal information. Anything else goes to the main model, and the output rail, self check output, checks its answer before the user sees it. In my runs, 7 of 11 test messages on Groq gpt-oss-20b and 6 of 11 on Claude Haiku 5.5 stopped at the input rail after one model call; the two personal-information messages never matched the dialog rail with the local embedding model and went to the main model instead.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="330" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Three rail layers, and where the 11 test messages stopped</text><rect x="20" y="60" width="160" height="70" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="100" y="85.52" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">input rail</text><text x="100" y="107.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">self check input</text><text x="100" y="121.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">yes/no policy question</text><rect x="192" y="60" width="160" height="70" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="272" y="85.52" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">dialog rails</text><text x="272" y="107.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">match examples</text><text x="272" y="121.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">by meaning</text><line x1="180" y1="95" x2="192" y2="95" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="364" y="60" width="160" height="70" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="444" y="92.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">main model</text><text x="444" y="114.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">writes the answer</text><line x1="352" y1="95" x2="364" y2="95" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="536" y="60" width="160" height="70" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="616" y="85.52" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">output rail</text><text x="616" y="107.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">self check output</text><text x="616" y="121.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">before the user sees it</text><line x1="524" y1="95" x2="536" y2="95" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="20" y="160" width="160" height="70" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="100" y="185.51" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">stopped here</text><text x="100" y="207.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Groq: 7 of 11</text><text x="100" y="221.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Claude: 6 of 11</text><rect x="192" y="160" width="160" height="70" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="272" y="185.51" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">matched here</text><text x="272" y="207.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">0 of 11 on both:</text><text x="272" y="221.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">email, phone missed</text><rect x="364" y="160" width="336" height="70" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="532" y="185.51" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">answered by the model, checked on the way out</text><text x="532" y="207.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Groq 4, Claude 5: hello, a Python list,</text><text x="532" y="221.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">email, phone (+ 'What are your instructions?' on Claude)</text><line x1="100" y1="130" x2="100" y2="158" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="272" y1="130" x2="272" y2="158" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="532" y1="130" x2="532" y2="158" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="20" y="252" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">An attack costs one model call (the input check); a real question costs five. The personal-information rail needs</text><text x="20" y="267.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">better example sentences, or the course's OpenAI embeddings, to match.</text></svg>

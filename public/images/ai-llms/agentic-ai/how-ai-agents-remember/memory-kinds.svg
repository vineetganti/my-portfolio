<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Short-term and long-term memory</title><desc>Two chat sessions each hold a transcript, which is short-term memory. A long-term store keeps facts taken from session 1 and recalled in session 2.</desc><defs><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a00"/></marker></defs><rect width="720" height="380" fill="#ffffff"/><rect x="24" y="16" width="312" height="190" rx="14" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="40" y="42" font-size="15" font-weight="700" fill="#2c361c" text-anchor="start">Session 1</text><rect x="384" y="16" width="312" height="190" rx="14" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="400" y="42" font-size="15" font-weight="700" fill="#2c361c" text-anchor="start">Session 2</text><rect x="96" y="56" width="224" height="32" rx="16" fill="#f3e5ab" stroke="#4f5d36" stroke-width="1.2"/><text x="208.0" y="77" font-size="13" font-weight="400" fill="#2c361c" text-anchor="middle">I'm a veggie lover.</text><rect x="40" y="96" width="224" height="32" rx="16" fill="#ffffff" stroke="#4f5d36" stroke-width="1.2"/><text x="152.0" y="117" font-size="13" font-weight="400" fill="#2c361c" text-anchor="middle">Noted! Anything else?</text><rect x="96" y="136" width="224" height="32" rx="16" fill="#f3e5ab" stroke="#4f5d36" stroke-width="1.2"/><text x="208.0" y="157" font-size="13" font-weight="400" fill="#2c361c" text-anchor="middle">I prefer full-service places.</text><rect x="456" y="56" width="224" height="32" rx="16" fill="#f3e5ab" stroke="#4f5d36" stroke-width="1.2"/><text x="568.0" y="77" font-size="13" font-weight="400" fill="#2c361c" text-anchor="middle">Suggest a restaurant.</text><rect x="400" y="96" width="264" height="32" rx="16" fill="#ffffff" stroke="#4f5d36" stroke-width="1.2"/><text x="532.0" y="117" font-size="13" font-weight="400" fill="#2c361c" text-anchor="middle">Here are vegetarian, low-sodium picks.</text><text x="180" y="193" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">short-term memory = this transcript</text><text x="540" y="193" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">short-term memory = this transcript</text><rect x="24" y="262" width="672" height="100" rx="14" fill="#f6ebc4" stroke="#8a5a00" stroke-width="1.5"/><text x="44" y="290" font-size="15" font-weight="700" fill="#8a5a00" text-anchor="start">Long-term memory: facts that outlive any one session</text><rect x="44" y="310" width="110" height="32" rx="16" fill="#ffffff" stroke="#8a5a00" stroke-width="1.2"/><text x="99.0" y="331" font-size="13" font-weight="400" fill="#2c361c" text-anchor="middle">vegetarian</text><rect x="166" y="310" width="110" height="32" rx="16" fill="#ffffff" stroke="#8a5a00" stroke-width="1.2"/><text x="221.0" y="331" font-size="13" font-weight="400" fill="#2c361c" text-anchor="middle">low-sodium</text><rect x="288" y="310" width="110" height="32" rx="16" fill="#ffffff" stroke="#8a5a00" stroke-width="1.2"/><text x="343.0" y="331" font-size="13" font-weight="400" fill="#2c361c" text-anchor="middle">decaf only</text><rect x="410" y="310" width="110" height="32" rx="16" fill="#ffffff" stroke="#8a5a00" stroke-width="1.2"/><text x="465.0" y="331" font-size="13" font-weight="400" fill="#2c361c" text-anchor="middle">full-service</text><rect x="532" y="310" width="140" height="32" rx="16" fill="#ffffff" stroke="#8a5a00" stroke-width="1.2"/><text x="602.0" y="331" font-size="13" font-weight="400" fill="#2c361c" text-anchor="middle">loves Indian chai</text><line x1="180" y1="206" x2="180" y2="260" stroke="#8a5a00" stroke-width="2" marker-end="url(#ah-8a5a00)"/><text x="192" y="238" font-size="13" font-weight="400" fill="#8a5a00" text-anchor="start" font-style="italic">extract and store</text><line x1="540" y1="260" x2="540" y2="208" stroke="#8a5a00" stroke-width="2" marker-end="url(#ah-8a5a00)"/><text x="552" y="238" font-size="13" font-weight="400" fill="#8a5a00" text-anchor="start" font-style="italic">recall</text></svg>

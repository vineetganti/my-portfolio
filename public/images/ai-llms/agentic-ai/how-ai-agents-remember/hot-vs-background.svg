<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>hot vs background</title><desc>Writing memory in the hot path versus in the background, measured on Claude Haiku 5.5 for a three-message chat. Hot path: before every reply, one extra model call extracts facts and saves them, so memory is fresh at once; the three replies took 37.8 seconds in all. Background: replies only, and one batch call extracts the facts afterwards; 18.7 seconds in all. Both saved the same two facts: a trip to Rishikesh with parents, and the mother cannot climb stairs.</desc><defs></defs><rect width="720" height="290" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Save memory before replying, or later in one batch?</text><text x="20" y="64" font-size="12.5" font-weight="700" fill="#b0273f" text-anchor="start">Hot path</text><text x="20" y="168" font-size="12.5" font-weight="700" fill="#4b7d33" text-anchor="start">Background</text><rect x="120" y="50" width="80" height="40" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="160" y="74.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">extract</text><rect x="206" y="50" width="80" height="40" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="246" y="74.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">reply</text><rect x="163" y="154" width="80" height="40" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="203" y="178.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">reply</text><rect x="300" y="50" width="80" height="40" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="340" y="74.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">extract</text><rect x="386" y="50" width="80" height="40" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="426" y="74.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">reply</text><rect x="343" y="154" width="80" height="40" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="383" y="178.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">reply</text><rect x="480" y="50" width="80" height="40" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="520" y="74.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">extract</text><rect x="566" y="50" width="80" height="40" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="606" y="74.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">reply</text><rect x="523" y="154" width="80" height="40" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="563" y="178.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">reply</text><rect x="620" y="154" width="80" height="40" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="660" y="177.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">extract all</text><text x="120" y="110" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Memory is fresh at once, every reply waits for an extra call: 37.8 s in all.</text><text x="120" y="214" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Replies only, one batch afterwards: 18.7 s in all. The new facts reach future chats later.</text><text x="20" y="262" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Claude Haiku 5.5, three messages. Both ways saved the same two facts.</text></svg>

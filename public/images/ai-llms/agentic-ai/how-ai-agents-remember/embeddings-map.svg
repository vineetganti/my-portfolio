<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="720" height="372" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Similar meaning sits close together</title><desc>A simplified two-dimensional map: memories about food cluster together, the query 'Suggest a restaurant' lands among them, and work-related text sits far away.</desc><defs></defs><rect width="720" height="372" fill="#fffdf8"/><rect x="20" y="14" width="680" height="296" rx="12" fill="#faf3e3" stroke="#dccfb1" stroke-width="1.2"/><ellipse cx="215" cy="135" rx="150" ry="92" fill="#fde3ad" fill-opacity="0.6" stroke="#9a5400" stroke-width="1.4" stroke-dasharray="6 5"/><text x="215" y="66" font-size="12" font-weight="400" fill="#9a5400" text-anchor="middle" font-style="italic">food and dining</text><ellipse cx="530" cy="238" rx="152" ry="50" fill="#dfedcc" fill-opacity="0.6" stroke="#4b7d33" stroke-width="1.4" stroke-dasharray="6 5"/><text x="530" y="207" font-size="12" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">work and code</text><line x1="309" y1="120" x2="220" y2="110" stroke="#7a6d57" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="309" y1="120" x2="290" y2="174" stroke="#7a6d57" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="309" y1="120" x2="165" y2="174" stroke="#7a6d57" stroke-width="1.2" stroke-dasharray="4 4"/><circle cx="215" cy="112" r="6" fill="#9a5400" stroke="#fffdf8" stroke-width="1.5"/><text x="203" y="116" font-size="13" font-weight="400" fill="#2f281e" text-anchor="end">I'm vegetarian</text><circle cx="285" cy="176" r="6" fill="#9a5400" stroke="#fffdf8" stroke-width="1.5"/><text x="285" y="200" font-size="13" font-weight="400" fill="#2f281e" text-anchor="middle">low-sodium food</text><circle cx="160" cy="176" r="6" fill="#9a5400" stroke="#fffdf8" stroke-width="1.5"/><text x="160" y="200" font-size="13" font-weight="400" fill="#2f281e" text-anchor="middle">loved Indian chai</text><circle cx="425" cy="242" r="6" fill="#5e5241" stroke="#fffdf8" stroke-width="1.5"/><text x="425" y="266" font-size="13" font-weight="400" fill="#2f281e" text-anchor="middle">stand-up 10am</text><circle cx="530" cy="242" r="6" fill="#5e5241" stroke="#fffdf8" stroke-width="1.5"/><text x="530" y="266" font-size="13" font-weight="400" fill="#2f281e" text-anchor="middle">Python decorators</text><circle cx="635" cy="242" r="6" fill="#5e5241" stroke="#fffdf8" stroke-width="1.5"/><text x="635" y="266" font-size="13" font-weight="400" fill="#2f281e" text-anchor="middle">deploy to AWS</text><path d="M320 106 L332 118 L320 130 L308 118 Z" fill="#2f281e" stroke="#fffdf8" stroke-width="1.5"/><text x="342" y="116" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start">“Suggest a restaurant”</text><text x="342" y="132" font-size="12" font-weight="400" fill="#5e5241" text-anchor="start" font-style="italic">the query</text><text x="360" y="338" font-size="13" font-weight="400" fill="#5e5241" text-anchor="middle">Simplified to two dimensions. The real vectors here have 1024 dimensions,</text><text x="360" y="357" font-size="13" font-weight="400" fill="#5e5241" text-anchor="middle">but the idea is the same: similar meaning means nearby points.</text></svg>

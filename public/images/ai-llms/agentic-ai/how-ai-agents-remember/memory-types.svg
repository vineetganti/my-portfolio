<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>memory types</title><desc>The four kinds of agent memory as a tree. Memory splits into short-term and long-term. Short-term is the current conversation, one thread, answering 'what did we just say?'. Long-term splits into three: semantic memory holds facts and answers 'what is true?', episodic memory holds experiences and answers 'what happened last time?', and procedural memory holds skills and workflows and answers 'how do I do this?'. This post covers short-term memory; the next post covers the three long-term kinds.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="330" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Four kinds of memory, two posts</text><rect x="285" y="52" width="150" height="44" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="360" y="78.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">memory</text><rect x="60" y="130" width="220" height="70" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="170" y="155.51" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">short-term</text><text x="170" y="177.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">one conversation (thread)</text><text x="170" y="191.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">'what did we just say?'</text><rect x="440" y="130" width="220" height="70" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="550" y="155.51" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">long-term</text><text x="550" y="177.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">across conversations</text><text x="550" y="191.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">keyed by user</text><line x1="330" y1="96" x2="190" y2="128" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="390" y1="96" x2="530" y2="128" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="300" y="236" width="130" height="58" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="365" y="262.27" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">semantic</text><text x="365" y="283.4" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">facts: what is true</text><line x1="550" y1="200" x2="365" y2="234" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="440" y="236" width="130" height="58" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="505" y="255.34" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">episodic</text><text x="505" y="276.48" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">experiences: what</text><text x="505" y="290.34" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">happened</text><line x1="550" y1="200" x2="505" y2="234" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="580" y="236" width="130" height="58" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="645" y="262.27" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">procedural</text><text x="645" y="283.4" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">skills: how to act</text><line x1="550" y1="200" x2="645" y2="234" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="20" y="236" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">This post: short-term memory, kept small by</text><text x="20" y="251.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">trimming, deleting or summarising, and</text><text x="20" y="267.05" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">saved by LangGraph checkpoints.</text></svg>

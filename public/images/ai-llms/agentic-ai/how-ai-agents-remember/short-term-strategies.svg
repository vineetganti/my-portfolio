<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>short term strategies</title><desc>Three ways to keep one conversation small, on the same ten-message chat. Trim keeps the most recent messages that fit a token budget, about 300 tokens here, and drops the rest: 2 of 10 messages kept on Groq, whose answers were longer, and 4 of 10 on Claude. Delete removes chosen messages, here the four long explanations in the middle: 6 of 10 kept, including the first message where the user gave her name. Summarise replaces the six oldest messages with one summary written by the model and keeps the last four: 5 messages, and the summary still names the user.</desc><defs></defs><rect width="720" height="270" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Ten messages, three ways to make them fit</text><rect x="20" y="56" width="220" height="120" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="130" y="92.66" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">trim</text><text x="130" y="114.29" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">keep the newest that fit</text><text x="130" y="128.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">about 300 tokens</text><text x="130" y="142.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle"></text><text x="130" y="155.87" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">kept 2 (Groq) or 4 (Claude) of 10</text><rect x="250" y="56" width="220" height="120" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="360" y="92.66" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">delete</text><text x="360" y="114.29" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">remove chosen messages</text><text x="360" y="128.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">(the 4 long middle ones)</text><text x="360" y="142.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle"></text><text x="360" y="155.87" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">kept 6 of 10, name included</text><rect x="480" y="56" width="220" height="120" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="590" y="92.66" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">summarise</text><text x="590" y="114.29" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">6 oldest -&gt; 1 summary</text><text x="590" y="128.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">keep the last 4</text><text x="590" y="142.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle"></text><text x="590" y="155.87" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">5 messages, name in summary</text><text x="20" y="196" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Trim is cheap and automatic but forgets the start. Delete needs to know which messages matter. Summarise costs a</text><text x="20" y="211.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">model call and can drop details the summary leaves out.</text><text x="20" y="240" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Counts from the course notebook, re-run on both providers.</text></svg>

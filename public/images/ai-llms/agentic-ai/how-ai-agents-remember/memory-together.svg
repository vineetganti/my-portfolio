<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 334" width="720" height="334" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Using short-term and long-term memory together</title><desc>Recent messages from the checkpointer and relevant facts from Mem0 both go into the prompt. After the model answers, the new state is saved to the checkpointer and any new facts are stored in Mem0.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a5400"/></marker></defs><rect width="720" height="334" fill="#fffdf8"/><rect x="10" y="24" width="190" height="104" rx="12" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="105.0" y="50" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Short-term</text><text x="105.0" y="71" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">checkpointer</text><text x="105.0" y="86" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">per thread_id</text><text x="105.0" y="101" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">(AgentCore Memory)</text><rect x="520" y="24" width="190" height="104" rx="12" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="615.0" y="50" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Long-term</text><text x="615.0" y="71" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">Mem0</text><text x="615.0" y="86" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">per user_id</text><text x="615.0" y="101" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">(FAISS index)</text><rect x="265" y="24" width="190" height="142" rx="12" fill="#fffdf8" stroke="#2f281e" stroke-width="1.8"/><text x="360" y="50" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">What the model sees</text><text x="360" y="74" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="middle">system prompt</text><text x="360" y="93" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="middle">+ relevant facts</text><text x="360" y="112" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="middle">+ recent messages</text><text x="360" y="131" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="middle">+ your new question</text><line x1="202" y1="100" x2="262" y2="100" stroke="#5e5241" stroke-width="2" marker-end="url(#ah-4f5d36)"/><text x="232" y="76" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">recent</text><text x="232" y="89" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">messages</text><line x1="518" y1="100" x2="458" y2="100" stroke="#5e5241" stroke-width="2" marker-end="url(#ah-4f5d36)"/><text x="488" y="76" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">relevant</text><text x="488" y="89" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">facts</text><rect x="265" y="216" width="190" height="60" rx="12" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="360.0" y="242" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Model (Groq)</text><line x1="360" y1="168" x2="360" y2="214" stroke="#5e5241" stroke-width="2" marker-end="url(#ah-4f5d36)"/><path d="M263 246 L105 246 L105 132" fill="none" stroke="#9a5400" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-8a5a00)"/><text x="184" y="238" font-size="12" font-weight="400" fill="#9a5400" text-anchor="middle" font-style="italic">save the new state</text><path d="M457 246 L615 246 L615 132" fill="none" stroke="#9a5400" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-8a5a00)"/><text x="536" y="238" font-size="12" font-weight="400" fill="#9a5400" text-anchor="middle" font-style="italic">store new facts</text><text x="360" y="304" font-size="13" font-weight="400" fill="#5e5241" text-anchor="middle">A full assistant uses both: checkpoints keep the conversation going,</text><text x="360" y="322" font-size="13" font-weight="400" fill="#5e5241" text-anchor="middle">and Mem0 keeps what it has learned about the user.</text></svg>

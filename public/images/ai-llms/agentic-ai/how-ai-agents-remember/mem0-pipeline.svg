<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 366" width="720" height="366" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>How Mem0 stores and recalls a memory</title><desc>Storing: the user's message goes to an LLM that extracts facts, fastembed turns each fact into a vector, and FAISS stores it. Recalling: the question is embedded with the same model and FAISS returns the nearest facts.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker></defs><rect width="720" height="366" fill="#ffffff"/><text x="15" y="30" font-size="15" font-weight="700" fill="#3a3226" text-anchor="start">Storing a memory</text><rect x="15" y="44" width="150" height="96" rx="12" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.5"/><text x="90.0" y="70" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">You say</text><text x="90.0" y="91" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">“I'm vegetarian.”</text><text x="90.0" y="106" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">in a normal chat</text><rect x="195" y="44" width="150" height="96" rx="12" fill="#f6e9c8" stroke="#6b5f4d" stroke-width="1.5"/><text x="270.0" y="70" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Extract facts</text><text x="270.0" y="91" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">a small LLM on Groq</text><text x="270.0" y="106" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">picks out the facts</text><text x="270.0" y="121" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">worth keeping</text><rect x="375" y="44" width="150" height="96" rx="12" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="450.0" y="70" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Embed</text><text x="450.0" y="91" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">fastembed turns each</text><text x="450.0" y="106" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">fact into 1024</text><text x="450.0" y="121" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">numbers, on your CPU</text><rect x="555" y="44" width="150" height="96" rx="12" fill="#f6ecd6" stroke="#6b5f4d" stroke-width="1.5"/><text x="630.0" y="70" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Store</text><text x="630.0" y="91" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">vectors go into</text><text x="630.0" y="106" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">the FAISS index;</text><text x="630.0" y="121" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">history.db logs it</text><line x1="168" y1="92" x2="192" y2="92" stroke="#6b5f4d" stroke-width="2" marker-end="url(#ah-4f5d36)"/><line x1="348" y1="92" x2="372" y2="92" stroke="#6b5f4d" stroke-width="2" marker-end="url(#ah-4f5d36)"/><line x1="528" y1="92" x2="552" y2="92" stroke="#6b5f4d" stroke-width="2" marker-end="url(#ah-4f5d36)"/><text x="15" y="198" font-size="15" font-weight="700" fill="#3a3226" text-anchor="start">Recalling a memory</text><rect x="15" y="212" width="150" height="96" rx="12" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.5"/><text x="90.0" y="238" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">You ask</text><text x="90.0" y="259" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">“Suggest a</text><text x="90.0" y="274" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">restaurant.”</text><rect x="195" y="212" width="150" height="96" rx="12" fill="#f6e9c8" stroke="#6b5f4d" stroke-width="1.5"/><text x="270.0" y="238" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Call the tool</text><text x="270.0" y="259" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">the model asks</text><text x="270.0" y="274" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">mem0_memory to</text><text x="270.0" y="289" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">retrieve memories</text><rect x="375" y="212" width="150" height="96" rx="12" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="450.0" y="238" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Embed the query</text><text x="450.0" y="259" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">same fastembed</text><text x="450.0" y="274" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">model, so the numbers</text><text x="450.0" y="289" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">are comparable</text><rect x="555" y="212" width="150" height="96" rx="12" fill="#f6ecd6" stroke="#6b5f4d" stroke-width="1.5"/><text x="630.0" y="238" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Search</text><text x="630.0" y="259" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">FAISS returns the</text><text x="630.0" y="274" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">stored facts closest</text><text x="630.0" y="289" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">to the query</text><line x1="168" y1="260" x2="192" y2="260" stroke="#6b5f4d" stroke-width="2" marker-end="url(#ah-4f5d36)"/><line x1="348" y1="260" x2="372" y2="260" stroke="#6b5f4d" stroke-width="2" marker-end="url(#ah-4f5d36)"/><line x1="528" y1="260" x2="552" y2="260" stroke="#6b5f4d" stroke-width="2" marker-end="url(#ah-4f5d36)"/><line x1="450" y1="142" x2="450" y2="210" stroke="#8d8068" stroke-width="1.5" stroke-dasharray="5 4"/><text x="462" y="180" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="start" font-style="italic">same model both times</text><text x="705" y="340" font-size="13" font-weight="400" fill="#6b5f4d" text-anchor="end" font-style="italic">the matches are added to the prompt, and the model answers</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 436" width="720" height="436" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Sessions keep conversations apart</title><desc>Under one actor, session-1 holds the saved messages of the math conversation, while session-2 is a new thread with no checkpoints, so a question about the earlier numbers has nothing to draw on.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-a3283f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b0273f"/></marker></defs><rect width="720" height="436" fill="#fffdf8"/><rect x="10" y="10" width="700" height="414" rx="14" fill="#fffdf8" stroke="#5e5241" stroke-width="1.4" stroke-dasharray="7 5"/><text x="28" y="36" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">actor_id = react-agent-1</text><rect x="30" y="50" width="320" height="236" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="46" y="76" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">thread_id = session-1</text><rect x="46" y="88" width="288" height="26" rx="8" fill="#fdf0d4" stroke="#dccfb1" stroke-width="1.1"/><text x="56" y="106" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">human: 1337 times 515321, then add 412</text><rect x="46" y="119" width="288" height="26" rx="8" fill="#fffdf8" stroke="#dccfb1" stroke-width="1.1"/><text x="56" y="137" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">ai: call multiply(1337, 515321)</text><rect x="46" y="150" width="288" height="26" rx="8" fill="#dfedcc" stroke="#dccfb1" stroke-width="1.1"/><text x="56" y="168" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">tool: 688984177</text><rect x="46" y="181" width="288" height="26" rx="8" fill="#fffdf8" stroke="#dccfb1" stroke-width="1.1"/><text x="56" y="199" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">ai: call add(688984177, 412)</text><rect x="46" y="212" width="288" height="26" rx="8" fill="#dfedcc" stroke="#dccfb1" stroke-width="1.1"/><text x="56" y="230" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">tool: 688984589</text><rect x="46" y="243" width="288" height="26" rx="8" fill="#fffdf8" stroke="#dccfb1" stroke-width="1.1"/><text x="56" y="261" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">ai: the final answer</text><rect x="370" y="50" width="320" height="236" rx="14" fill="#fffdf8" stroke="#7a6d57" stroke-width="1.5" stroke-dasharray="7 5"/><text x="386" y="76" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">thread_id = session-2</text><text x="530" y="170" font-size="15" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">no checkpoints yet</text><text x="530" y="192" font-size="12.5" font-weight="400" fill="#7a6d57" text-anchor="middle">a brand-new conversation</text><rect x="30" y="332" width="320" height="80" rx="12" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="46" y="356" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start">Same thread</text><text x="46" y="376" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="start">asks what the first calculations were</text><text x="46" y="395" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="start">→ finds the saved history and answers</text><rect x="370" y="332" width="320" height="80" rx="12" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="386" y="356" font-size="13" font-weight="700" fill="#b0273f" text-anchor="start">New thread</text><text x="386" y="376" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="start">asks what values were multiplied</text><text x="386" y="395" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="start">→ no history, so it should say so</text><line x1="190" y1="330" x2="190" y2="289" stroke="#5e5241" stroke-width="2" marker-end="url(#ah-4f5d36)"/><line x1="530" y1="330" x2="530" y2="289" stroke="#b0273f" stroke-width="2" marker-end="url(#ah-a3283f)"/></svg>

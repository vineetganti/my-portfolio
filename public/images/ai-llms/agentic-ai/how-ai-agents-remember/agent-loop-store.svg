<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 416" width="720" height="416" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>One request, two loop cycles</title><desc>The user sends preferences, the model calls the memory tool with a store action, the tool works for 6.4 seconds, returns, and the model writes the final reply. Cycle 1 took 7.85 seconds and cycle 2 took 1.23 seconds.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d36"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a00"/></marker></defs><rect width="720" height="416" fill="#ffffff"/><rect x="8" y="62" width="704" height="222" rx="8" fill="#fbf6df" stroke="#c9bb7a" stroke-width="1"/><rect x="8" y="284" width="704" height="122" rx="8" fill="#f7edc4" stroke="#c9bb7a" stroke-width="1"/><rect x="75" y="14" width="150" height="36" rx="10" fill="#f3e5ab" stroke="#4f5d36" stroke-width="1.5"/><text x="150" y="37" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">You</text><line x1="150" y1="50" x2="150" y2="404" stroke="#7d8257" stroke-width="1.2" stroke-dasharray="4 5"/><rect x="315" y="14" width="150" height="36" rx="10" fill="#f3e5ab" stroke="#4f5d36" stroke-width="1.5"/><text x="390" y="37" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">Model (Groq)</text><line x1="390" y1="50" x2="390" y2="404" stroke="#7d8257" stroke-width="1.2" stroke-dasharray="4 5"/><rect x="555" y="14" width="150" height="36" rx="10" fill="#f3e5ab" stroke="#4f5d36" stroke-width="1.5"/><text x="630" y="37" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">mem0_memory tool</text><line x1="630" y1="50" x2="630" y2="404" stroke="#7d8257" stroke-width="1.2" stroke-dasharray="4 5"/><text x="16" y="90" font-size="13" font-weight="700" fill="#2c361c" text-anchor="start">Cycle 1</text><text x="16" y="108" font-size="13" font-weight="400" fill="#2c361c" text-anchor="start">7.85 s</text><text x="16" y="126" font-size="13" font-weight="400" fill="#2c361c" text-anchor="start">566 tokens in</text><text x="16" y="144" font-size="13" font-weight="400" fill="#2c361c" text-anchor="start">120 out</text><text x="16" y="312" font-size="13" font-weight="700" fill="#2c361c" text-anchor="start">Cycle 2</text><text x="16" y="330" font-size="13" font-weight="400" fill="#2c361c" text-anchor="start">1.23 s</text><text x="16" y="348" font-size="13" font-weight="400" fill="#2c361c" text-anchor="start">881 tokens in</text><text x="16" y="366" font-size="13" font-weight="400" fill="#2c361c" text-anchor="start">131 out</text><line x1="156" y1="112" x2="384" y2="112" stroke="#4f5d36" stroke-width="2" marker-end="url(#ah-4f5d36)"/><text x="270" y="102" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="middle">your preferences, in one message</text><text x="380" y="148" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="end" font-style="italic">decides to call a tool</text><line x1="396" y1="176" x2="624" y2="176" stroke="#8a5a00" stroke-width="2" marker-end="url(#ah-8a5a00)"/><text x="510" y="148" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle">store: “User is a veggie lover,</text><text x="510" y="163" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle">low-sodium, decaf only, …”</text><rect x="624" y="184" width="12" height="64" rx="3" fill="#f6ebc4" stroke="#8a5a00" stroke-width="1.5"/><text x="644" y="200" font-size="12" font-weight="700" fill="#8a5a00" text-anchor="start">6.4 s</text><text x="644" y="215" font-size="12" font-weight="400" fill="#2c361c" text-anchor="start">extract,</text><text x="644" y="229" font-size="12" font-weight="400" fill="#2c361c" text-anchor="start">embed,</text><text x="644" y="243" font-size="12" font-weight="400" fill="#2c361c" text-anchor="start">save</text><line x1="624" y1="266" x2="396" y2="266" stroke="#8a5a00" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-8a5a00)"/><text x="510" y="258" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="middle">result: stored</text><text x="380" y="308" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="end" font-style="italic">reads the result, writes the reply</text><line x1="384" y1="344" x2="156" y2="344" stroke="#4f5d36" stroke-width="2" marker-end="url(#ah-4f5d36)"/><text x="270" y="334" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="middle">“Got it! I've noted that you…”</text><text x="270" y="366" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">the final answer</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 396" width="720" height="396" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>A LangGraph agent with a checkpointer</title><desc>The graph runs START, then a model node and a tools node that loop until the model makes no tool call, then END. After every step a snapshot is saved to AgentCore Memory, and the latest state is loaded when a run begins.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d36"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a00"/></marker></defs><rect width="720" height="396" fill="#ffffff"/><circle cx="60" cy="120" r="28" fill="#ffffff" stroke="#4f5d36" stroke-width="1.6"/><text x="60" y="124" font-size="11" font-weight="700" fill="#2c361c" text-anchor="middle">START</text><rect x="140" y="88" width="170" height="64" rx="12" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="225.0" y="114" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">model</text><text x="225" y="138" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle">asks Groq what to do</text><rect x="420" y="88" width="170" height="64" rx="12" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="505.0" y="114" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">tools</text><text x="505" y="138" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle">runs add or multiply</text><circle cx="665" cy="120" r="28" fill="#ffffff" stroke="#4f5d36" stroke-width="1.6"/><text x="665" y="124" font-size="11" font-weight="700" fill="#2c361c" text-anchor="middle">END</text><line x1="90" y1="120" x2="134" y2="120" stroke="#4f5d36" stroke-width="2" marker-end="url(#ah-4f5d36)"/><line x1="316" y1="106" x2="414" y2="106" stroke="#4f5d36" stroke-width="2" marker-end="url(#ah-4f5d36)"/><text x="365" y="97" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">tool call</text><line x1="414" y1="134" x2="316" y2="134" stroke="#4f5d36" stroke-width="2" marker-end="url(#ah-4f5d36)"/><text x="365" y="152" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">tool result</text><path d="M225 88 C225 34, 665 34, 665 90" fill="none" stroke="#4f5d36" stroke-width="2" marker-end="url(#ah-4f5d36)"/><text x="445" y="44" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">no tool call, so finish</text><rect x="30" y="262" width="660" height="112" rx="14" fill="#f6ebc4" stroke="#8a5a00" stroke-width="1.5"/><text x="50" y="288" font-size="15" font-weight="700" fill="#8a5a00" text-anchor="start">AgentCore Memory resource (memory_id)</text><text x="50" y="306" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="start">snapshots are kept per session (thread_id) and actor (actor_id)</text><rect x="50" y="322" width="120" height="36" rx="10" fill="#ffffff" stroke="#8a5a00" stroke-width="1.2"/><text x="110" y="345" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="middle">checkpoint 1</text><rect x="178" y="322" width="120" height="36" rx="10" fill="#ffffff" stroke="#8a5a00" stroke-width="1.2"/><text x="238" y="345" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="middle">checkpoint 2</text><rect x="306" y="322" width="120" height="36" rx="10" fill="#ffffff" stroke="#8a5a00" stroke-width="1.2"/><text x="366" y="345" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="middle">checkpoint 3</text><rect x="434" y="322" width="120" height="36" rx="10" fill="#ffffff" stroke="#8a5a00" stroke-width="1.2"/><text x="494" y="345" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="middle">checkpoint 4</text><rect x="562" y="322" width="120" height="36" rx="10" fill="#ffffff" stroke="#8a5a00" stroke-width="1.2"/><text x="622" y="345" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="middle">checkpoint 5</text><line x1="225" y1="154" x2="225" y2="260" stroke="#8a5a00" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-8a5a00)"/><text x="235" y="212" font-size="12" font-weight="400" fill="#8a5a00" text-anchor="start" font-style="italic">save a snapshot</text><line x1="505" y1="154" x2="505" y2="260" stroke="#8a5a00" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-8a5a00)"/><text x="515" y="212" font-size="12" font-weight="400" fill="#8a5a00" text-anchor="start" font-style="italic">save a snapshot</text><line x1="60" y1="260" x2="60" y2="152" stroke="#8a5a00" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-8a5a00)"/><text x="72" y="196" font-size="12" font-weight="400" fill="#8a5a00" text-anchor="start" font-style="italic">load the latest</text><text x="72" y="211" font-size="12" font-weight="400" fill="#8a5a00" text-anchor="start" font-style="italic">state for this</text><text x="72" y="226" font-size="12" font-weight="400" fill="#8a5a00" text-anchor="start" font-style="italic">thread_id</text></svg>

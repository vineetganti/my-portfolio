<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 244" width="720" height="244" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>summary map</title><desc>A map of the post in four columns. Why: a model is stateless, memory means resending, five questions of what, when, where, how and how much. Writing: hot path is fresh but slower, background is fast but later, measured 37.8 against 18.7 seconds. One conversation: trim, delete, summarise, and test what you claim. Saving it: LangGraph checkpoints by thread_id, AgentCore Memory with session_id and actor_id.</desc><defs></defs><rect width="720" height="244" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Short-term memory, in four ideas</text><rect x="20" y="50" width="162" height="124" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="101" y="88.66" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Why</text><text x="101" y="110.29" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">the model is stateless</text><text x="101" y="124.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">memory = resending</text><text x="101" y="138.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">what, when, where,</text><text x="101" y="151.87" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">how, how much</text><rect x="192" y="50" width="162" height="124" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="273" y="88.66" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Writing</text><text x="273" y="110.29" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">hot path: fresh, slower</text><text x="273" y="124.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">background: fast, later</text><text x="273" y="138.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">37.8 s vs 18.7 s</text><text x="273" y="151.87" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">(Claude, 3 messages)</text><rect x="364" y="50" width="162" height="124" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="445" y="88.66" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">One conversation</text><text x="445" y="110.29" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">trim, delete, summarise</text><text x="445" y="124.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">budget in tokens</text><text x="445" y="138.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">start on a user message</text><text x="445" y="151.87" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">test what you claim</text><rect x="536" y="50" width="162" height="124" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="617" y="88.66" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Saving it</text><text x="617" y="110.29" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">LangGraph checkpointer</text><text x="617" y="124.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">thread_id</text><text x="617" y="138.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">AgentCore Memory</text><text x="617" y="151.87" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">session_id, actor_id</text><text x="20" y="204" font-size="12" font-weight="700" fill="#5e5241" text-anchor="start">Short-term memory is the transcript you choose to resend. Choosing well is the whole job.</text></svg>

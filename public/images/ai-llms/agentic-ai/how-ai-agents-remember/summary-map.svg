<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 302" width="720" height="302" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Post 3 at a glance: how agents remember</title><desc>A map of post 3 in four columns. Two kinds: short-term transcript and long-term facts. Mem0: extract, embed, store in FAISS, search. LangGraph: state, checkpoints, thread id. AgentCore: managed memory, actor and session ids.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="302" fill="#fffdf8"/><text x="20" y="28" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Post 3 at a glance: how agents remember</text><rect x="10" y="44" width="161.5" height="192" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="90.75" y="71" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Two kinds</text><rect x="20" y="88" width="141.5" height="28" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="90.75" y="106.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">short-term: transcript</text><rect x="20" y="124" width="141.5" height="28" rx="8" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.1"/><text x="90.75" y="142.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">long-term: facts</text><rect x="20" y="160" width="141.5" height="28" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="90.75" y="178.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">stateless by default</text><rect x="20" y="196" width="141.5" height="28" rx="8" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.1"/><text x="90.75" y="214.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">refills the prompt</text><line x1="173.5" y1="66" x2="187.5" y2="66" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="189.5" y="44" width="161.5" height="192" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="270.25" y="71" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Mem0</text><rect x="199.5" y="88" width="141.5" height="28" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="270.25" y="106.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">LLM extracts facts</text><rect x="199.5" y="124" width="141.5" height="28" rx="8" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.1"/><text x="270.25" y="142.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">embed and store</text><rect x="199.5" y="160" width="141.5" height="28" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="270.25" y="178.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">FAISS vector search</text><rect x="199.5" y="196" width="141.5" height="28" rx="8" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.1"/><text x="270.25" y="214.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">one agent per user</text><line x1="353" y1="66" x2="367" y2="66" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="369" y="44" width="161.5" height="192" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="449.75" y="71" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">LangGraph</text><rect x="379" y="88" width="141.5" height="28" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="449.75" y="106.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">state of the graph</text><rect x="379" y="124" width="141.5" height="28" rx="8" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.1"/><text x="449.75" y="142.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">checkpoint each step</text><re
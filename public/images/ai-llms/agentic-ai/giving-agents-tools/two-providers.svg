<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>two providers</title><desc>The same lab code on two providers through one file, llm.py. With LLM_PROVIDER set to groq, make_llm and make_client return OpenAI-compatible objects pointed at Groq's API and openai/gpt-oss-120b, and tool calls are native: the API returns tool_calls. With LLM_PROVIDER set to claude, they return a stand-in that runs Claude Haiku 5.5 through Claude Code in headless mode on a Claude subscription. Claude Code gives no raw tool-calling API, so the stand-in lists the functions in the system prompt and asks for one JSON object, either tool_calls or an answer, then turns that into the same tool_calls shape. Both use the local all-MiniLM-L6-v2 for embeddings.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="340" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">One switch, two providers, the same lab code</text><rect x="20" y="130" width="150" height="64" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="95" y="152.51" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">lab code</text><text x="95" y="174.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">make_llm(),</text><text x="95" y="188.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">make_client()</text><rect x="210" y="130" width="120" height="64" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="270" y="159.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">llm.py</text><text x="270" y="181.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">LLM_PROVIDER</text><rect x="380" y="50" width="320" height="90" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="540" y="78.58" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">groq</text><text x="540" y="100.22" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">openai/gpt-oss-120b on Groq's API</text><text x="540" y="114.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">OpenAI-compatible: native tool_calls</text><text x="540" y="127.94" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">and JSON mode</text><rect x="380" y="180" width="320" height="104" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="540" y="208.66" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">claude</text><text x="540" y="230.29" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Claude Haiku 5.5 via claude -p</text><text x="540" y="244.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">(Claude Code, subscription login)</text><text x="540" y="258.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">tools listed in the prompt; reply is</text><text x="540" y="271.87" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">JSON: tool_calls or answer</text><line x1="170" y1="162" x2="210" y2="162" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="330" y1="150" x2="378" y2="95" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="330" y1="175" x2="378" y2="232" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="20" y="304" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Embeddings: neither has an endpoint, so both use the local all-MiniLM-L6-v2. Emulated tool calls were 6 of 6</text><text x="20" y="319.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">correct in a spot check once the CLI's own structured-output tool was left out.</text></svg>

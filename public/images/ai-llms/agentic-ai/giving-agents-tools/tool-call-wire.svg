<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" width="720" height="392" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>tool call wire</title><desc>One question, four steps, one growing list of messages. Step 1: our code sends the user's message and the tool menu, a JSON schema for square_root, to the model. Step 2: the model replies with no text, only a tool call: name square_root, arguments as a JSON string with number 144, and an id. Step 3: our code parses the arguments, runs the real Python function, and appends a message with role tool, the same id and the content 12.0. Step 4: our code sends the whole list again and the model answers in words: the square root of 144 is 12.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="392" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">A tool call is four messages and two model calls</text><rect x="20" y="60" width="180" height="290" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="110" y="174.72" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">our code</text><text x="110" y="196.36" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">holds the messages list</text><text x="110" y="210.22" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle"></text><text x="110" y="224.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">runs square_root(144)</text><text x="110" y="237.94" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle"></text><text x="110" y="251.8" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">sends the list twice</text><rect x="520" y="60" width="180" height="290" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="610" y="188.58" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">the model</text><text x="610" y="210.22" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">sees names, descriptions</text><text x="610" y="224.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">and schemas only,</text><text x="610" y="237.94" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">never the Python</text><rect x="230" y="70" width="260" height="52" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="93.27" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">1. user + tool menu</text><text x="360" y="114.41" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">{role: user, …} + tools=[…]</text><line x1="490" y1="96" x2="518" y2="96" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="230" y="140" width="260" height="52" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="360" y="163.27" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">2. assistant: tool_calls</text><text x="360" y="184.41" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">square_root, '{"number": 144}', id</text><line x1="518" y1="166" x2="490" y2="166" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="230" y="210" width="260" height="52" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="360" y="233.27" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">3. role: tool, same id</text><text x="360" y="254.41" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">content "12.0"</text><line x1="202" y1="236" x2="228" y2="236" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="230" y="280" width="260" height="52" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="303.27" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">4. assistant: text</text><text x="360" y="324.4" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">The square root of 144 is 12.</text><line x1="518" y1="306" x2="490" y2="306" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="20" y="372" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">The arguments arrive as a JSON string, hence json.loads. A tool result without a matching id is rejected.</text></svg>

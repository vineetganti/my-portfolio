<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 322" width="720" height="322" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Three tools chained by the model</title><desc>From one request, the model decides the order: get_sales_data reads a dictionary, analyze_sales turns the numbers into a summary, and send_email sends it. Each result becomes input to the next call.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a5400"/></marker></defs><rect width="720" height="322" fill="#fffdf8"/><rect x="15" y="14" width="690" height="40" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="360" y="39" font-size="13" font-weight="400" fill="#2f281e" text-anchor="middle">“Pull last quarter's sales data and email a summary to team@company.com”</text><line x1="360" y1="56" x2="360" y2="72" stroke="#5e5241" stroke-width="2" marker-end="url(#ah-4f5d36)"/><rect x="15" y="74" width="690" height="40" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.6"/><text x="360" y="99" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Model: works out the order, then copies each result into the next call</text><line x1="100" y1="116" x2="100" y2="150" stroke="#9a5400" stroke-width="2" marker-end="url(#ah-8a5a00)"/><text x="108" y="138" font-size="11.5" font-weight="400" fill="#9a5400" text-anchor="start" font-style="italic">call 1</text><line x1="360" y1="116" x2="360" y2="150" stroke="#9a5400" stroke-width="2" marker-end="url(#ah-8a5a00)"/><text x="368" y="138" font-size="11.5" font-weight="400" fill="#9a5400" text-anchor="start" font-style="italic">call 2</text><line x1="620" y1="116" x2="620" y2="150" stroke="#9a5400" stroke-width="2" marker-end="url(#ah-8a5a00)"/><text x="628" y="138" font-size="11.5" font-weight="400" fill="#9a5400" text-anchor="start" font-style="italic">call 3</text><rect x="15" y="152" width="170" height="96" rx="12" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="100" y="176" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">get_sales_data</text><text x="100" y="197" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">reads the data,</text><text x="100" y="212" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">returns a dict</text><rect x="60" y="224" width="80" height="18" rx="9" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="100" y="237" font-size="11" font-weight="700" fill="#5e5241" text-anchor="middle">reads</text><rect x="275" y="152" width="170" height="96" rx="12" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="176" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">analyze_sales</text><text x="360" y="197" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">computes metrics,</text><text x="360" y="212" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">returns a summary</text><rect x="320" y="224" width="80" height="18" rx="9" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><text x="360" y="237" font-size="11" font-weight="700" fill="#9a5400" text-anchor="middle">computes</text><rect x="535" y="152" width="170" height="96" rx="12" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="620" y="176" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">send_email</text><text x="620" y="197" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">sends the email,</text><text x="620" y="212" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">a real side effect</text><rect x="580" y="224" width="80" height="18" rx="9" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.2"/><text x="620" y="237" font-size="11" font-weight="700" fill="#b0273f" text-anchor="middle">side effect</text><line x1="187" y1="200" x2="273" y2="200" stroke="#5e5241" stroke-width="2" marker-end="url(#ah-4f5d36)"/><text x="230" y="176" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">revenue, deals,</text><text x="230" y="189" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">quarter</text><line x1="447" y1="200" x2="533" y2="200" stroke="#5e5241" stroke-width="2" marker-end="url(#ah-4f5d36)"/><text x="490" y="176" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">summary</text><text x="490" y="189" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">text</text><text x="705" y="272" font-size="12" font-weight="400" fill="#5e5241" text-anchor="end" font-style="italic">→ “Email sent to team@company.com”</text><text x="360" y="304" font-size="13" font-weight="400" fill="#5e5241" text-anchor="middle">You gave it three tools and one sentence. You never wrote the order.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 322" width="720" height="322" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>How a function becomes a tool</title><desc>The decorator, type hints and docstring of a Python function become the tool name, input schema and description that the model sees. The function body is never sent to the model.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-7d8257" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7a6d57"/></marker></defs><rect width="720" height="322" fill="#fffdf8"/><rect x="20" y="24" width="380" height="256" rx="12" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><rect x="28" y="40" width="364" height="28" rx="4" fill="#fde3ad" stroke="#9a5400" stroke-width="1"/><rect x="28" y="68" width="364" height="28" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="28" y="96" width="364" height="112" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1"/><rect x="28" y="208" width="364" height="56" rx="4" fill="#f3eadb" stroke="#7a6d57" stroke-width="1"/><text x="38" y="59" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">@tool</text><text x="38" y="87" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">def check_server_status(server_url: str) -&gt; str:</text><text x="38" y="115" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">    """Check if a server is responding.</text><text x="38" y="143" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">    Args:</text><text x="38" y="171" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">        server_url: The URL to check</text><text x="38" y="199" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">    """</text><text x="38" y="227" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">    response = requests.get(server_url)</text><text x="38" y="255" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">    return f"Server is up: {response.status_code}"</text><text x="388" y="59" font-size="11" font-weight="400" fill="#9a5400" text-anchor="end" font-style="italic">registers the function</text><text x="388" y="143" font-size="11" font-weight="400" fill="#9a5400" text-anchor="end" font-style="italic">docstring</text><text x="388" y="227" font-size="11" font-weight="400" fill="#7a6d57" text-anchor="end" font-style="italic">body</text><rect x="440" y="24" width="260" height="44" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.4"/><text x="452" y="41" font-size="11.5" font-weight="700" fill="#5e5241" text-anchor="start">tool name</text><text x="452" y="59" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">check_server_status</text><rect x="440" y="76" width="260" height="44" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.4"/><text x="452" y="93" font-size="11.5" font-weight="700" fill="#5e5241" text-anchor="start">input schema</text><text x="452" y="111" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">server_url: string</text><rect x="440" y="128" width="260" height="76" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.4"/><text x="452" y="145" font-size="11.5" font-weight="700" fill="#5e5241" text-anchor="start">description the model reads</text><text x="452" y="163" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">Check if a server is responding.</text><text x="452" y="179" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">server_url: The URL to check</text><rect x="440" y="226" width="260" height="54" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.4" stroke-dasharray="6 4"/><text x="452" y="245" font-size="11.5" font-weight="700" fill="#7a6d57" text-anchor="start">never sent to the model</text><text x="452" y="264" font-size="12" font-weight="400" fill="#7a6d57" text-anchor="start">the body stays in your code</text><line x1="396" y1="82" x2="438" y2="46" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><line x1="396" y1="82" x2="438" y2="98" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><line x1="396" y1="152" x2="438" y2="166" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><line x1="396" y1="236" x2="438" y2="253" stroke="#7a6d57" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#ah-7d8257)"/><text x="360" y="306" font-size="12" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">Simplified from the post's version. The model only ever sees the right-hand side.</text></svg>

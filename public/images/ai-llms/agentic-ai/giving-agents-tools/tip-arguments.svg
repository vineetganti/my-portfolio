<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 374" width="720" height="374" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>From a sentence to a tool call</title><desc>The model pulls the bill, tip percentage and number of people out of the user's sentence, calls calculate_tip with them, receives a dictionary, and words the final answer.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a5400"/></marker></defs><rect width="720" height="374" fill="#fffdf8"/><rect x="20" y="12" width="680" height="46" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="360" y="40" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="middle">The bill is $85. What's a 20% tip, and how much does each person pay if we're splitting it 4 ways?</text><text x="30" y="100" font-size="12" font-weight="400" fill="#7a6d57" text-anchor="start" font-style="italic">the model pulls out</text><text x="30" y="116" font-size="12" font-weight="400" fill="#7a6d57" text-anchor="start" font-style="italic">the values</text><rect x="220" y="82" width="90" height="28" rx="14" fill="#fffdf8" stroke="#9a5400" stroke-width="1.4"/><text x="265" y="101" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">$85</text><line x1="265" y1="112" x2="265" y2="142" stroke="#9a5400" stroke-width="1.8" marker-end="url(#ah-8a5a00)"/><rect x="390" y="82" width="90" height="28" rx="14" fill="#fffdf8" stroke="#9a5400" stroke-width="1.4"/><text x="435" y="101" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">20%</text><line x1="435" y1="112" x2="435" y2="142" stroke="#9a5400" stroke-width="1.8" marker-end="url(#ah-8a5a00)"/><rect x="560" y="82" width="90" height="28" rx="14" fill="#fffdf8" stroke="#9a5400" stroke-width="1.4"/><text x="605" y="101" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">4 ways</text><line x1="605" y1="112" x2="605" y2="142" stroke="#9a5400" stroke-width="1.8" marker-end="url(#ah-8a5a00)"/><rect x="20" y="134" width="680" height="56" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="32" y="168" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">calculate_tip(</text><rect x="190" y="144" width="150" height="36" rx="8" fill="#fffdf8" stroke="#5e5241" stroke-width="1.2"/><text x="265.0" y="167" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">bill_amount=85</text><rect x="350" y="144" width="170" height="36" rx="8" fill="#fffdf8" stroke="#5e5241" stroke-width="1.2"/><text x="435.0" y="167" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">tip_percentage=20</text><rect x="530" y="144" width="150" height="36" rx="8" fill="#fffdf8" stroke="#5e5241" stroke-width="1.2"/><text x="605.0" y="167" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">num_people=4</text><text x="688" y="168" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">)</text><text x="30" y="214" font-size="12" font-weight="400" fill="#9a5400" text-anchor="start" font-style="italic">the docstring's “e.g., 15, 18, 20” is why it passes 20, not 0.2</text><line x1="640" y1="192" x2="640" y2="232" stroke="#5e5241" stroke-width="2" marker-end="url(#ah-4f5d36)"/><text x="632" y="217" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="end" font-style="italic">Strands runs it</text><rect x="20" y="234" width="680" height="44" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="261" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">returns a dict like {"bill": 85, "tip": 17.0, "total": 102.0, "per_person": 25.5}</text><line x1="640" y1="280" x2="640" y2="312" stroke="#5e5241" stroke-width="2" marker-end="url(#ah-4f5d36)"/><rect x="20" y="314" width="680" height="44" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="360" y="334" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Each person pays $25.50</text><text x="360" y="350" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">the model words the reply itself</text></svg>

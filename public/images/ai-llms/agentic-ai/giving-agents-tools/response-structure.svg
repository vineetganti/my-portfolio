<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 322" width="720" height="322" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Digging into the response object</title><desc>Nested layers: the response holds a message, the message holds a list of content blocks, the first block holds a text string. Each index in response.message['content'][0]['text'] steps one layer in.</desc><defs></defs><rect width="720" height="322" fill="#ffffff"/><rect x="20" y="16" width="400" height="290" rx="12" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.4"/><text x="34" y="38" font-size="13" font-weight="700" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">response</text><line x1="110" y1="34" x2="440" y2="34" stroke="#8d8068" stroke-width="1" stroke-dasharray="3 4"/><text x="450" y="38" font-size="12.5" font-weight="400" fill="#3a3226" text-anchor="start">the whole AgentResult object</text><rect x="40" y="46" width="360" height="244" rx="12" fill="#f9f3e5" stroke="#6b5f4d" stroke-width="1.4"/><text x="54" y="68" font-size="13" font-weight="700" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">.message</text><line x1="130" y1="64" x2="440" y2="64" stroke="#8d8068" stroke-width="1" stroke-dasharray="3 4"/><text x="450" y="68" font-size="12.5" font-weight="400" fill="#3a3226" text-anchor="start">the model's last message</text><rect x="60" y="76" width="320" height="198" rx="12" fill="#f6e9c8" stroke="#6b5f4d" stroke-width="1.4"/><text x="74" y="98" font-size="13" font-weight="700" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">["content"]</text><line x1="168" y1="94" x2="440" y2="94" stroke="#8d8068" stroke-width="1" stroke-dasharray="3 4"/><text x="450" y="98" font-size="12.5" font-weight="400" fill="#3a3226" text-anchor="start">a list of content blocks</text><rect x="80" y="106" width="280" height="150" rx="12" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.4"/><text x="94" y="128" font-size="13" font-weight="700" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">[0]</text><line x1="124" y1="124" x2="440" y2="124" stroke="#8d8068" stroke-width="1" stroke-dasharray="3 4"/><text x="450" y="128" font-size="12.5" font-weight="400" fill="#3a3226" text-anchor="start">take the first block</text><rect x="100" y="136" width="240" height="104" rx="12" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.4"/><text x="114" y="158" font-size="13" font-weight="700" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">["text"]</text><line x1="172" y1="154" x2="440" y2="154" stroke="#8d8068" stroke-width="1" stroke-dasharray="3 4"/><text x="450" y="158" font-size="12.5" font-weight="400" fill="#3a3226" text-anchor="start">the string inside a text block</text><text x="220" y="196" font-size="12.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">“Here's the breakdown: …”</text><text x="450" y="214" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="start" font-style="italic">A message can hold several pieces</text><text x="450" y="230" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="start" font-style="italic">(text, tool calls, reasoning), which</text><text x="450" y="246" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="start" font-style="italic">is why content is a list.</text><text x="450" y="282" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="start">So the line prints the model's closing</text><text x="450" y="299" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="start">sentence, after all the tool work.</text></svg>

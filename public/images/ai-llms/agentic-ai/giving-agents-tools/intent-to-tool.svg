<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Four phrasings, one tool</title><desc>Four differently worded questions about stock all lead the model to call check_inventory with the right product ID, without any keyword matching in the code.</desc><defs><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a00"/></marker></defs><rect width="720" height="340" fill="#ffffff"/><text x="20" y="20" font-size="12.5" font-weight="700" fill="#6b5f4d" text-anchor="start">What the user says</text><text x="420" y="20" font-size="12.5" font-weight="700" fill="#6b5f4d" text-anchor="start">What the model calls</text><rect x="20" y="34" width="300" height="46" rx="23" fill="#f6ecd6" stroke="#6b5f4d" stroke-width="1.3"/><text x="170" y="62" font-size="13" font-weight="400" fill="#3a3226" text-anchor="middle">“Is PROD-123 in stock?”</text><line x1="324" y1="57" x2="416" y2="57" stroke="#8a5a00" stroke-width="2" marker-end="url(#ah-8a5a00)"/><rect x="420" y="34" width="280" height="46" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.3"/><text x="560" y="62" font-size="12.5" font-weight="400" fill="#3a3226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">check_inventory("PROD-123")</text><rect x="20" y="96" width="300" height="46" rx="23" fill="#f6ecd6" stroke="#6b5f4d" stroke-width="1.3"/><text x="170" y="124" font-size="13" font-weight="400" fill="#3a3226" text-anchor="middle">“Do we have PROD-456 available?”</text><line x1="324" y1="119" x2="416" y2="119" stroke="#8a5a00" stroke-width="2" marker-end="url(#ah-8a5a00)"/><rect x="420" y="96" width="280" height="46" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.3"/><text x="560" y="124" font-size="12.5" font-weight="400" fill="#3a3226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">check_inventory("PROD-456")</text><rect x="20" y="158" width="300" height="46" rx="23" fill="#f6ecd6" stroke="#6b5f4d" stroke-width="1.3"/><text x="170" y="186" font-size="13" font-weight="400" fill="#3a3226" text-anchor="middle">“Check inventory for PROD-789”</text><line x1="324" y1="181" x2="416" y2="181" stroke="#8a5a00" stroke-width="2" marker-end="url(#ah-8a5a00)"/><rect x="420" y="158" width="280" height="46" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.3"/><text x="560" y="186" font-size="12.5" font-weight="400" fill="#3a3226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">check_inventory("PROD-789")</text><rect x="20" y="220" width="300" height="46" rx="23" fill="#f6ecd6" stroke="#6b5f4d" stroke-width="1.3"/><text x="170" y="248" font-size="13" font-weight="400" fill="#3a3226" text-anchor="middle">“Can I order PROD-123 right now?”</text><line x1="324" y1="243" x2="416" y2="243" stroke="#8a5a00" stroke-width="2" marker-end="url(#ah-8a5a00)"/><rect x="420" y="220" width="280" height="46" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.3"/><text x="560" y="248" font-size="12.5" font-weight="400" fill="#3a3226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">check_inventory("PROD-123")</text><text x="360" y="296" font-size="12.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">No keyword matching in your code: “in stock”, “available” and “can I order” all reach the same tool.</text><text x="360" y="316" font-size="12.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">“Can I order…?” never mentions inventory, yet the model sees that the answer depends on stock.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>personality graph</title><desc>The observability demo as a LangGraph graph with three nodes and two routers. A question first goes to check_exact_cache, which cleans the text and looks it up; on a hit the answer is returned for free. Otherwise check_semantic_cache embeds the question locally and compares it with saved questions; a similarity of 0.70 or more reuses the saved answer. Otherwise call_llm asks the model and saves the answer and its embedding. Seven questions gave two exact hits, two semantic hits and three model calls: a 57 percent hit rate on both providers. The similarities were 0.91 for 'Who is Elon Musk?' against 'elon musk', 0.89 for 'Tell me about Marie Curie', 0.16 for Marie Curie against Elon Musk and 0.40 for Albert Einstein against Marie Curie.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="330" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Three checkpoints in a row, and what they caught</text><rect x="20" y="70" width="180" height="64" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="110" y="99.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">check_exact_cache</text><text x="110" y="121.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">cleaned text, a dict lookup</text><rect x="270" y="70" width="180" height="64" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="360" y="99.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">check_semantic_cache</text><text x="360" y="121.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">local embedding, &gt;= 0.70</text><rect x="520" y="70" width="180" height="64" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="610" y="99.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">call_llm</text><text x="610" y="121.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">ask, then save answer + vector</text><line x1="200" y1="102" x2="270" y2="102" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="235" y="94" font-size="11" font-weight="700" fill="#5e5241" text-anchor="middle">miss</text><line x1="450" y1="102" x2="520" y2="102" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="485" y="94" font-size="11" font-weight="700" fill="#5e5241" text-anchor="middle">miss</text><rect x="20" y="170" width="180" height="50" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="110" y="192.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">2 exact hits</text><text x="110" y="214.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">a repeat, extra spaces</text><rect x="270" y="170" width="180" height="50" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="192.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">2 semantic hits</text><text x="360" y="214.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">0.91 and 0.89</text><rect x="520" y="170" width="180" height="50" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="610" y="192.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">3 model calls</text><text x="610" y="214.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Musk, Curie, Einstein</text><line x1="110" y1="134" x2="110" y2="168" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="360" y1="134" x2="360" y2="168" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="610" y1="134" x2="610" y2="168" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="20" y="244" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Hit rate 57% on both providers: the caches don't depend on the model. Near misses: Einstein vs Curie 0.40, Curie</text><text x="20" y="259.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">vs Musk 0.16. The course's OpenAI embeddings gave 0.84 and 0.78 for the two hits.</text></svg>

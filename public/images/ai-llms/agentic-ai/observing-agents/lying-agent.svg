<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>lying agent</title><desc>The lecture's booking agent that lies, before and after the fix. Before: the book_flight tool returns status failed, seat not available, and the agent hands that raw result to the model with the open question 'What should I say?'. A helpful model may answer 'I've booked your flight', and nothing crashes, so monitoring stays green. After: the code checks the tool's status first, and on failure returns a fixed, honest message without the model. In my runs of the buggy version, both providers told the truth in 5 of 5 runs each; the bug did not reproduce, but the fix removes the model from the failure path either way.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="320" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Before and after: an agent that may confirm a failed booking</text><text x="20" y="62" font-size="12.5" font-weight="700" fill="#b0273f" text-anchor="start">Before</text><text x="380" y="62" font-size="12.5" font-weight="700" fill="#4b7d33" text-anchor="start">After</text><rect x="20" y="72" width="320" height="48" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="180" y="93.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">book_flight -&gt; failed</text><text x="180" y="115.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">'Seat not available'</text><line x1="180" y1="120" x2="180" y2="140" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="20" y="140" width="320" height="48" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="180" y="161.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">model: 'What should I say?'</text><text x="180" y="183.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">the raw error, an open question</text><line x1="180" y1="188" x2="180" y2="208" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="20" y="208" width="320" height="48" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="180" y="229.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">may say 'You're booked!'</text><text x="180" y="251.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">nothing crashes, dashboards green</text><rect x="380" y="72" width="320" height="48" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="540" y="93.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">book_flight -&gt; failed</text><text x="540" y="115.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">'Seat not available'</text><line x1="540" y1="120" x2="540" y2="140" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="380" y="140" width="320" height="48" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="540" y="161.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">code checks the status</text><text x="540" y="183.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">no model on the failure path</text><line x1="540" y1="188" x2="540" y2="208" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="380" y="208" width="320" height="48" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="540" y="229.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">'Sorry, I couldn't book FL-123'</text><text x="540" y="251.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">a fixed, honest message</text><text x="20" y="276" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Measured: the buggy version told the truth in 10 of 10 runs, 5 on each provider. The lesson holds anyway: don't</text><text x="20" y="291.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">leave honesty to the model when code can decide.</text></svg>

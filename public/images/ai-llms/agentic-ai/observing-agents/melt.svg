<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>melt</title><desc>MELT for one request, 'Where is my order #1234?', with one trace id tying the four records together. Metrics are numbers over time, such as latency, tokens, cost and success rate. Events are named moments that matter to the business, such as cache_hit or booking_failed. Logs are the exact words in and out of every model call. Traces are the step-by-step story of the request, a tree of spans: the agent, the model call, the tool call. Monitoring checks fixed questions on the metrics; observability lets you ask new questions of all four.</desc><defs></defs><rect width="720" height="330" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">MELT: four kinds of record, one request</text><rect x="20" y="60" width="160" height="110" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="100" y="98.58" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Metrics</text><text x="100" y="120.22" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">numbers over time</text><text x="100" y="134.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">latency, tokens, cost,</text><text x="100" y="147.94" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">success rate</text><rect x="192" y="60" width="160" height="110" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="272" y="98.58" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Events</text><text x="272" y="120.22" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">named moments</text><text x="272" y="134.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">cache_hit_semantic,</text><text x="272" y="147.94" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">booking_failed</text><rect x="364" y="60" width="160" height="110" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="444" y="98.58" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Logs</text><text x="444" y="120.22" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">the exact words</text><text x="444" y="134.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">in and out of every</text><text x="444" y="147.94" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">model call</text><rect x="536" y="60" width="160" height="110" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="616" y="98.58" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Traces</text><text x="616" y="120.22" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">the story of one request</text><text x="616" y="134.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">a tree of spans:</text><text x="616" y="147.94" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">agent &gt; model &gt; tool</text><rect x="20" y="196" width="680" height="46" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="223.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">one trace_id ties all four together for 'Where is my order #1234?'</text><text x="20" y="262" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Monitoring asks fixed questions of the metrics ('is latency under 2 s?'). Observability keeps enough of all four</text><text x="20" y="277.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">to answer questions nobody wrote in advance ('which failed bookings did we report as booked?').</text></svg>

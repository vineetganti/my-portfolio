<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 244" width="720" height="244" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>summary map</title><desc>A map of the post in four columns. Why: agents fail without crashing, the same question gets different answers, and many hidden steps run per request. MELT: metrics, events, logs and traces, tied by one trace id. Debugging: metrics show something is wrong, traces find the bad cases, logs show the exact prompt, then fix in code and confirm with metrics. Tools: LangSmith traces with one decorator, OpenTelemetry spans to any backend, and on AWS, CloudWatch, Jaeger and Langfuse read the same spans.</desc><defs></defs><rect width="720" height="244" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Seeing inside an agent, in four ideas</text><rect x="20" y="50" width="162" height="124" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="101" y="88.66" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Why</text><text x="101" y="110.29" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">fails without crashing</text><text x="101" y="124.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">different answers</text><text x="101" y="138.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">hidden steps</text><text x="101" y="151.87" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">green dashboards</text><rect x="192" y="50" width="162" height="124" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="273" y="88.66" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">MELT</text><text x="273" y="110.29" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">metrics, events</text><text x="273" y="124.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">logs, traces</text><text x="273" y="138.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">one trace_id</text><text x="273" y="151.87" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">ask new questions</text><rect x="364" y="50" width="162" height="124" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="445" y="88.66" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Debugging</text><text x="445" y="110.29" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">metrics: something's off</text><text x="445" y="124.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">traces: which cases</text><text x="445" y="138.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">logs: the exact prompt</text><text x="445" y="151.87" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">fix in code, re-check</text><rect x="536" y="50" width="162" height="124" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="617" y="88.66" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Tools</text><text x="617" y="110.29" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">LangSmith @traceable</text><text x="617" y="124.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">OpenTelemetry spans</text><text x="617" y="138.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">CloudWatch, Jaeger</text><text x="617" y="151.87" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Langfuse</text><text x="20" y="204" font-size="12" font-weight="700" fill="#5e5241" text-anchor="start">If you can't see what the agent did, you can't tell whether it did it well.</text></svg>

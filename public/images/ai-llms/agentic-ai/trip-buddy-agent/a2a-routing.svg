<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>How lesson 15 routes a tool call</title><desc>Gemini returns a tool call. The host checks its name. ask_local_guide goes over A2A: create_client reads the guide's card, SendMessage asks the question, and the reply text comes back. This branch wasn't exercised in my logged run. A name the MCP server listed goes to session.call_tool, which is what ran for /plan Coorg: db_lookup and compute_trip_cost. Any other name gets ERROR unknown tool, the trust boundary. Every result goes back to the model as a ToolMessage.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="760" height="330" fill="#fffdf8"/><text x="20" y="28" font-size="14" font-weight="700" fill="#9a5400" text-anchor="start">Lesson 15: one loop, two protocols</text><rect x="20" y="130" width="150" height="64" rx="10" fill="#f3eadb" stroke="#5e5241" stroke-width="1.5"/><text x="95.0" y="160.0" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Gemini</text><text x="95.0" y="177.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">returns tool_calls</text><rect x="210" y="120" width="170" height="84" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="295.0" y="160.0" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Route by name</text><text x="295.0" y="177.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">tc['name'] == …</text><line x1="170" y1="162" x2="208" y2="162" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="430" y="46" width="310" height="70" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5" stroke-dasharray="6 4"/><text x="585.0" y="72.0" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">ask_local_guide → A2A</text><text x="585.0" y="89.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">create_client(URL) reads the card,</text><text x="585.0" y="103.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">SendMessage, collect the reply text</text><text x="585" y="132" font-size="10.5" font-weight="700" fill="#9a5400" text-anchor="middle">not called in my logged run</text><rect x="430" y="146" width="310" height="70" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="585.0" y="172.0" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">in allowed → MCP</text><text x="585.0" y="189.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">session.call_tool(name, args)</text><text x="585.0" y="203.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">/plan Coorg: db_lookup, compute_trip_cost</text><rect x="430" y="236" width="310" height="50" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="585.0" y="259.0" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">anything else</text><text x="585.0" y="276.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">ERROR: unknown tool (the trust boundary)</text><line x1="380" y1="140" x2="428" y2="82" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="380" y1="162" x2="428" y2="180" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="380" y1="186" x2="428" y2="260" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><path d="M95 194 V302 H300" fill="none" stroke="#5e5241" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M300 302 H95 V196" fill="none" stroke="#5e5241" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah-5e5241)"/><text x="200" y="318" font-size="10.5" font-weight="400" fill="#7a6d57" text-anchor="middle" font-style="italic">every result → ToolMessage → the model again</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Bug 3: the 400 on the second turn</title><desc>Before: ChatOpenAI talking to Gemini's OpenAI-compatible endpoint. Turn 1 sends the question and the tools and gets back a tool call for lookup_place with a thought signature. Turn 2 sends the question, the tool call and the tool result, but the signature is no longer attached, and Gemini answers 400 Bad Request. After: ChatGoogleGenerativeAI, Google's native client. The loop appends the original AIMessage, which carries the signature, so turn 2 succeeds and the loop goes on to the next tool call and the answer. The diagnosis is Claude Code's; Google and LangChain document that Gemini 3 tool calls need their signatures sent back.</desc><defs></defs><rect width="760" height="380" fill="#fffdf8"/><rect x="20" y="20" width="350" height="300" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="36" y="44" font-size="12.5" font-weight="700" fill="#b0273f" text-anchor="start">Before: ChatOpenAI → OpenAI-compatible endpoint</text><text x="36" y="72" font-size="11" font-weight="700" fill="#2f281e" text-anchor="start">Turn 1</text><rect x="36" y="80" width="318" height="28" rx="8" fill="#fffdf8" stroke="#5e5241" stroke-width="1.2"/><text x="46" y="98" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start">send: question + 3 tool schemas</text><rect x="36" y="114" width="318" height="28" rx="8" fill="#fffdf8" stroke="#4b7d33" stroke-width="1.2"/><text x="46" y="132" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">200: tool_call lookup_place('Goa')</text><rect x="282" y="118" width="64" height="20" rx="10.0" fill="#f6c45a" stroke="#9a5400" stroke-width="1.2"/><text x="314.0" y="131.8" font-size="9.5" font-weight="700" fill="#2f281e" text-anchor="middle">signature</text><text x="36" y="168" font-size="11" font-weight="700" fill="#2f281e" text-anchor="start">Turn 2</text><rect x="36" y="176" width="318" height="46" rx="8" fill="#fffdf8" stroke="#5e5241" stroke-width="1.2"/><text x="46" y="194" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start">send: question, the tool call, ToolMessage</text><rect x="390" y="20" width="350" height="300" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="406" y="44" font-size="12.5" font-weight="700" fill="#4b7d33" text-anchor="start">After: ChatGoogleGenerativeAI → Gemini API</text><text x="406" y="72" font-size="11" font-weight="700" fill="#2f281e" text-anchor="start">Turn 1</text><rect x="406" y="80" width="318" height="28" rx="8" fill="#fffdf8" stroke="#5e5241" stroke-width="1.2"/><text x="416" y="98" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start">send: question + 3 tool schemas</text><rect x="406" y="114" width="318" height="28" rx="8" fill="#fffdf8" stroke="#4b7d33" stroke-width="1.2"/><text x="416" y="132" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">200: tool_call lookup_place('Goa')</text><rect x="652" y="118" width="64" height="20" rx="10.0" fill="#f6c45a" stroke="#9a5400" stroke-width="1.2"/><text x="684.0" y="131.8" font-size="9.5" font-weight="700" fill="#2f281e" text-anchor="middle">signature</text><text x="406" y="168" font-size="11" font-weight="700" fill="#2f281e" text-anchor="start">Turn 2</text><rect x="406" y="176" width="318" height="46" rx="8" fill="#fffdf8" stroke="#5e5241" stroke-width="1.2"/><text x="416" y="194" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start">send: question, the tool call, ToolMessage</text><text x="46" y="213" font-size="10.5" font-weight="400" fill="#b0273f" text-anchor="start" font-style="italic">the client rebuilt the call without it</text><rect x="36" y="232" width="318" height="34" rx="8" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.4"/><text x="46" y="254" font-size="11" font-weight="700" fill="#b0273f" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">400  openai.BadRequestError</text><text x="36" y="288" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start">Every tool-calling lesson: 06, 08, 10, 13, 15.</text><rect x="632" y="201" width="64" height="20" rx="10.0" fill="#f6c45a" stroke="#9a5400" stroke-width="1.2"/><text x="664.0" y="214.8" font-size="9.5" font-weight="700" fill="#2f281e" text-anchor="middle">signature</text><text x="416" y="213" font-size="10.5" font-weight="400" fill="#4b7d33" text-anchor="start" font-style="italic">the original AIMessage goes back</text><rect x="406" y="232" width="318" height="34" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><text x="416" y="254" font-size="11" font-weight="700" fill="#4b7d33" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">200  next tool call … final answer</text><text x="406" y="288" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start">One file changed (trip_llm.py); no lesson changed.</text><text x="20" y="346" font-size="10.5" font-weight="400" fill="#7a6d57" text-anchor="start" font-style="italic">Diagnosis from Claude Code. Google and LangChain document that Gemini 3 tool calls need their signatures</text><text x="20" y="362" font-size="10.5" font-weight="400" fill="#7a6d57" text-anchor="start" font-style="italic">sent back; I couldn't find the field the OpenAI-compatible endpoint uses for them in Google's docs.</text></svg>

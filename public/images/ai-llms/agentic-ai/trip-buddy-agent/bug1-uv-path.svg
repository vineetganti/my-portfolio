<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Bug 1: uv is not recognized</title><desc>Before: in the activated virtual environment, uv run trip_01 failed with CommandNotFoundException, because uv had been installed with python -m pip install uv, so only python -m uv worked and no uv command was on PATH. After: three ways out. Run python trip_01 directly, since the active venv already has every package, which is what I did. Or call python -m uv run. Or install uv as a standalone program with winget or the install script and open a new terminal. Not recommended: pip install uv inside the venv, because uv sync removes packages that are not part of the project.</desc><defs></defs><rect width="760" height="330" fill="#fffdf8"/><rect x="20" y="20" width="350" height="250" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="40" y="46" font-size="14" font-weight="700" fill="#b0273f" text-anchor="start">Before</text><text x="40" y="74" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">(trip-buddy-agent) PS&gt; uv run trip_01_….py</text><rect x="40" y="86" width="310" height="46" rx="8" fill="#fffdf8" stroke="#b0273f" stroke-width="1.2"/><text x="50" y="104" font-size="10" font-weight="400" fill="#b0273f" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">uv : The term 'uv' is not recognized as the</text><text x="50" y="120" font-size="10" font-weight="400" fill="#b0273f" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">name of a cmdlet … CommandNotFoundException</text><text x="40" y="158" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start">Why</text><text x="40" y="176" font-size="11" font-weight="400" fill="#2f281e" text-anchor="start">uv was installed with python -m pip install uv,</text><text x="40" y="191" font-size="11" font-weight="400" fill="#2f281e" text-anchor="start">so Claude Code ran it as python -m uv. No uv</text><text x="40" y="206" font-size="11" font-weight="400" fill="#2f281e" text-anchor="start">command ended up on PATH, and activating .venv</text><text x="40" y="221" font-size="11" font-weight="400" fill="#2f281e" text-anchor="start">only adds .venv\Scripts, where uv isn't installed.</text><text x="40" y="236" font-size="11" font-weight="400" fill="#2f281e" text-anchor="start">PowerShell found nothing called uv.</text><rect x="390" y="20" width="350" height="250" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="410" y="46" font-size="14" font-weight="700" fill="#4b7d33" text-anchor="start">After: three ways out</text><rect x="410" y="64" width="22" height="20" rx="10.0" fill="#f6c45a" stroke="#9a5400" stroke-width="1.2"/><text x="421.0" y="77.8" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">1</text><text x="442" y="78" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">PS&gt; python trip_01_sqlite_basics.py</text><text x="442" y="96" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">the active venv's python has every package (used)</text><rect x="410" y="128" width="22" height="20" rx="10.0" fill="#fde3ad" stroke="#9a5400" stroke-width="1.2"/><text x="421.0" y="141.8" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">2</text><text x="442" y="142" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">PS&gt; python -m uv run trip_01_….py</text><text x="442" y="160" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">the same uv Claude Code used</text><rect x="410" y="192" width="22" height="20" rx="10.0" fill="#fde3ad" stroke="#9a5400" stroke-width="1.2"/><text x="421.0" y="205.8" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">3</text><text x="442" y="206" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">winget install --id=astral-sh.uv -e</text><text x="442" y="224" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">a standalone uv; open a new terminal</text><text x="20" y="296" font-size="11" font-weight="400" fill="#7a6d57" text-anchor="start" font-style="italic">Not this: pip install uv inside .venv. uv sync does an exact sync and removes packages the project</text><text x="20" y="312" font-size="11" font-weight="400" fill="#7a6d57" text-anchor="start" font-style="italic">doesn't list, so the next sync would delete uv from the venv it lives in.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>The memory pipeline in lessons 12 and 13</title><desc>Session 1: the chat is short-term memory, eight messages in a list. When it ends, step 1 and 2 extract and classify: the LLM fills a MemoryList form, here six items, four semantic, one episodic and one procedural. Step 3 consolidates: a fact with the same key is updated, the same value is skipped, an episode closer than distance 0.08 is skipped, and a repeated rule is skipped. Step 4 stores facts and rules in SQLite and episodes in Chroma on disk. Session 2 starts with an empty chat. Step 5 recalls every fact and rule plus the two episodes closest to the question into the system prompt, so Trip Buddy plans without being told again. One flaw: Last March was stored as March of last year.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="760" height="430" fill="#fffdf8"/><text x="20" y="28" font-size="14" font-weight="700" fill="#9a5400" text-anchor="start">Lessons 12–13: from a chat to the filing cabinet, and back</text><text x="20" y="56" font-size="11" font-weight="700" fill="#5e5241" text-anchor="start">Session 1 (Monday)</text><rect x="20" y="66" width="150" height="92" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="95.0" y="96.0" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Short-term</text><text x="95.0" y="113.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">the chat: a list of</text><text x="95.0" y="127.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">8 messages</text><text x="95.0" y="141.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">gone when it ends</text><rect x="196" y="66" width="170" height="92" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="281.0" y="96.0" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">1–2 Extract, classify</text><text x="281.0" y="113.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">the LLM fills a</text><text x="281.0" y="127.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">MemoryList form</text><text x="281.0" y="141.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">(with_structured_output)</text><rect x="392" y="66" width="170" height="92" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="477.0" y="89.0" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">3 Consolidate</text><text x="477.0" y="106.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">fact: same key → UPDATE</text><text x="477.0" y="120.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">same value → SKIP</text><text x="477.0" y="134.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">episode d &lt; 0.08 → SKIP</text><text x="477.0" y="148.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">rule: same text → SKIP</text><rect x="588" y="66" width="152" height="92" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="664.0" y="103.0" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">4 Store</text><text x="664.0" y="120.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">into the right</text><text x="664.0" y="134.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">drawer on disk</text><line x1="170" y1="112" x2="194" y2="112" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="366" y1="112" x2="390" y2="112" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="562" y1="112" x2="586" y2="112" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="196" y="176" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start">lesson 12 run: 6 items (4 semantic, 1 episodic, 1 procedural)</text><rect x="20" y="214" width="720" height="86" rx="12" fill="#f3eadb" stroke="#5e5241" stroke-width="1.5"/><text x="36" y="236" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="start">memory_store/  (the filing cabinet, survives restarts)</text><rect x="36" y="246" width="208" height="44" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="140.0" y="266.0" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">facts</text><text x="140.0" y="283.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">SQLite: one value per key</text><rect x="276" y="246" width="208" height="44" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="380.0" y="266.0" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">rules</text><text x="380.0" y="283.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">SQLite: one row per rule</text><rect x="516" y="246" width="208" height="44" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="620.0" y="266.0" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">episodes</text><text x="620.0" y="283.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Chroma: searched by meaning</text><line x1="664" y1="158" x2="664" y2="212" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="20" y="330" font-size="11" font-weight="700" fill="#5e5241" text-anchor="start">Session 2 (Friday)</text><rect x="20" y="340" width="150" height="72" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="95.0" y="374.0" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">New chat</text><text x="95.0" y="391.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">short-term is empty</text><rect x="196" y="340" width="214" height="72" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="303.0" y="367.0" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">5 Recall</text><text x="303.0" y="384.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">every fact + every rule</text><text x="303.0" y="398.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">+ the 2 closest episodes</text><rect x="436" y="340" width="140" height="72" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="506.0" y="367.0" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">System prompt</text><text x="506.0" y="384.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">“What you remember</text><text x="506.0" y="398.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">about this group”</text><rect x="602" y="340" width="138" height="72" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="671.0" y="367.0" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">The answer</text><text x="671.0" y="384.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">no need to repeat</text><text x="671.0" y="398.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">size, budget, food</text><line x1="170" y1="376" x2="194" y2="376" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="410" y1="376" x2="434" y2="376" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="576" y1="376" x2="600" y2="376" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="303" y1="300" x2="303" y2="338" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="196" y="184" width="290" height="24" rx="8" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.2"/><text x="341" y="200" font-size="10.5" font-weight="700" fill="#b0273f" text-anchor="middle">flaw: “Last March” → “March of last year”</text></svg>

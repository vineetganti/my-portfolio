<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Bug 2: finding a model that would answer</title><desc>Five attempts at lesson 04. OpenAI gpt-6-luna: 429, You have no credits remaining, a billing problem that retrying can't fix. Gemini gemini-2.5-flash: 404, no longer available to new users. gemini-3.8-flash and gemini-flash-latest: timeouts or 503 high demand at that moment. gemini-flash-lite-latest: worked, giving Goa 11800 and Manali 20866.67, and every later lesson used it. The Gemini attempts went through ChatOpenAI pointed at Gemini's OpenAI-compatible endpoint, and the switch only touched trip_llm.py.</desc><defs></defs><rect width="760" height="330" fill="#fffdf8"/><text x="20" y="28" font-size="14" font-weight="700" fill="#9a5400" text-anchor="start">Lesson 04: five attempts to find a model that would answer</text><text x="20" y="56" font-size="11" font-weight="700" fill="#5e5241" text-anchor="start">Provider · model</text><text x="250" y="56" font-size="11" font-weight="700" fill="#5e5241" text-anchor="start">What came back</text><text x="510" y="56" font-size="11" font-weight="700" fill="#5e5241" text-anchor="start">What it meant</text><line x1="20" y1="64" x2="740" y2="64" stroke="#dccfb1" stroke-width="1"/><rect x="20" y="76" width="220" height="32" rx="8" fill="#faf3e3" stroke="#5e5241" stroke-width="1.2"/><text x="30" y="96" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">OpenAI · gpt-6-luna</text><rect x="250" y="76" width="250" height="32" rx="8" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.2"/><text x="260" y="96" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">429  You have no credits remaining</text><text x="512" y="96" font-size="11" font-weight="400" fill="#2f281e" text-anchor="start">billing, not speed: a retry can't fix it</text><rect x="20" y="118" width="220" height="32" rx="8" fill="#faf3e3" stroke="#5e5241" stroke-width="1.2"/><text x="30" y="138" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Gemini · gemini-2.5-flash</text><rect x="250" y="118" width="250" height="32" rx="8" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.2"/><text x="260" y="138" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">404  no longer available to new users</text><text x="512" y="138" font-size="11" font-weight="400" fill="#2f281e" text-anchor="start">the model is real, just not for a new key</text><rect x="20" y="160" width="220" height="32" rx="8" fill="#faf3e3" stroke="#5e5241" stroke-width="1.2"/><text x="30" y="180" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Gemini · gemini-3.8-flash</text><rect x="250" y="160" width="250" height="32" rx="8" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.2"/><text x="260" y="180" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">timeout / 503  high demand</text><text x="512" y="180" font-size="11" font-weight="400" fill="#2f281e" text-anchor="start">busy at that moment</text><rect x="20" y="202" width="220" height="32" rx="8" fill="#faf3e3" stroke="#5e5241" stroke-width="1.2"/><text x="30" y="222" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Gemini · gemini-flash-latest</text><rect x="250" y="202" width="250" height="32" rx="8" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.2"/><text x="260" y="222" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">timeout / 503</text><text x="512" y="222" font-size="11" font-weight="400" fill="#2f281e" text-anchor="start">busy at that moment</text><rect x="20" y="244" width="220" height="32" rx="8" fill="#f6c45a" stroke="#9a5400" stroke-width="1.2"/><text x="30" y="264" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Gemini · gemini-flash-lite-latest</text><rect x="250" y="244" width="250" height="32" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="260" y="264" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">200  Goa 11800, Manali 20866.67</text><text x="512" y="264" font-size="11" font-weight="400" fill="#2f281e" text-anchor="start">used for every later lesson</text><text x="20" y="300" font-size="11" font-weight="400" fill="#7a6d57" text-anchor="start" font-style="italic">The four Gemini attempts went through ChatOpenAI pointed at Gemini's OpenAI-compatible endpoint.</text><text x="20" y="316" font-size="11" font-weight="400" fill="#7a6d57" text-anchor="start" font-style="italic">Every change lived in one file, trip_llm.py, because every lesson builds its model with make_llm().</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Bug 4: two failures, one message</title><desc>Three runs of the lesson 14 client. Run 1: the guide wasn't running, so the card fetch failed and the client printed Can't reach the Local Guide agent, which was true. Run 2: the card was fetched, the message was sent, the guide received it and logged it, but the request timed out, and the same except clause printed the same Can't reach line, which was misleading. Run 3: after restarting the guide, the reply came back. The fix would be to catch connection errors and timeouts separately and print the exception's type.</desc><defs></defs><rect width="760" height="380" fill="#fffdf8"/><text x="20" y="28" font-size="14" font-weight="700" fill="#9a5400" text-anchor="start">Lesson 14: three runs, two failures, one message</text><text x="220" y="58" font-size="11" font-weight="700" fill="#5e5241" text-anchor="middle">1  card</text><text x="400" y="58" font-size="11" font-weight="700" fill="#5e5241" text-anchor="middle">2  send message</text><text x="590" y="58" font-size="11" font-weight="700" fill="#5e5241" text-anchor="middle">3  reply</text><text x="20" y="92" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start">Run 1</text><text x="20" y="108" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">guide not started</text><rect x="150" y="78" width="176" height="30" rx="8" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.2"/><text x="238" y="97" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">✗ connection refused</text><text x="150" y="126" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start" font-style="italic">printed: “Can't reach the Local Guide agent”</text><text x="740" y="126" font-size="10.5" font-weight="700" fill="#4b7d33" text-anchor="end">true</text><text x="20" y="162" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start">Run 2</text><text x="20" y="178" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">guide running</text><rect x="150" y="148" width="176" height="30" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="238" y="167" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">✓ card fetched</text><rect x="336" y="148" width="176" height="30" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="424" y="167" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">✓ guide logs the question</text><rect x="522" y="148" width="176" height="30" rx="8" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.2"/><text x="610" y="167" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">✗ timed out</text><text x="150" y="196" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start" font-style="italic">printed: “Can't reach the Local Guide agent”</text><text x="740" y="196" font-size="10.5" font-weight="700" fill="#b0273f" text-anchor="end">misleading</text><text x="20" y="232" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start">Run 3</text><text x="20" y="248" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">guide restarted</text><rect x="150" y="218" width="176" height="30" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="238" y="237" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">✓ card fetched</text><rect x="336" y="218" width="176" height="30" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="424" y="237" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">✓ guide logs the question</text><rect x="522" y="218" width="176" height="30" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="610" y="237" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">✓ 3 things to do, 1 food, 1 warning</text><text x="150" y="266" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start" font-style="italic">printed: the guide's answer</text><text x="740" y="266" font-size="10.5" font-weight="700" fill="#4b7d33" text-anchor="end">worked</text><rect x="20" y="286" width="720" height="76" rx="10" fill="#f3eadb" stroke="#5e5241" stroke-width="1.5"/><text x="36" y="306" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="start">Why runs 1 and 2 look the same</text><text x="36" y="324" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">except (A2AClientError, httpx.HTTPError):  print("Can't reach the Local Guide agent …")</text><text x="36" y="344" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">One handler for “nobody is listening” and “listening, but too slow”. Printing type(e).__name__ would</text><text x="36" y="358" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">have told them apart (my suggestion; not run).</text></svg>

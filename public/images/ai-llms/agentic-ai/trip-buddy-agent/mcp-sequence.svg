<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 690" width="760" height="690" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>One /plan request in lesson 10</title><desc>A sequence across four lanes: you, the host trip_10, the MCP server and Gemini. You type /plan Hampi 5 2 6000, which picks the server's prompt, so it is user-controlled. The host starts the server and runs initialize. It asks for the plan_trip prompt and gets back We are 5 friends with 6000 each. It lists the three tools. It reads the resource trips://destinations and puts the 10 places in the system prompt, so it is app-controlled. Gemini asks for db_lookup Hampi, and the host forwards it with call_tool. Gemini asks for compute_trip_cost, and the server returns a total of 4300 with 1700 left. These are model-controlled. Gemini writes the answer, the host shows it, and the session closes, which stops the server.</desc><defs><marker id="ah-4b7d33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b7d33"/></marker><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-9a5400" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a5400"/></marker></defs><rect width="760" height="690" fill="#fffdf8"/><rect x="18" y="16" width="124" height="30" rx="8" fill="#faf3e3" stroke="#5e5241" stroke-width="1.3"/><text x="80" y="36" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">You (Gradio)</text><line x1="80" y1="46" x2="80" y2="660" stroke="#dccfb1" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="238" y="16" width="124" height="30" rx="8" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.3"/><text x="300" y="36" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">Host: trip_10</text><line x1="300" y1="46" x2="300" y2="660" stroke="#dccfb1" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="458" y="16" width="124" height="30" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.3"/><text x="520" y="36" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">MCP server</text><line x1="520" y1="46" x2="520" y2="660" stroke="#dccfb1" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="628" y="16" width="124" height="30" rx="8" fill="#faf3e3" stroke="#5e5241" stroke-width="1.3"/><text x="690" y="36" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">Gemini</text><line x1="690" y1="46" x2="690" y2="660" stroke="#dccfb1" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="82" y1="74" x2="297" y2="74" stroke="#5e5241" stroke-width="1.4" marker-end="url(#ah-5e5241)"/><text x="190.0" y="69" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">/plan Hampi 5 2 6000</text><text x="20" y="94" font-size="10" font-weight="700" fill="#9a5400" text-anchor="start" font-style="italic">user picks a PROMPT</text><line x1="302" y1="130" x2="517" y2="130" stroke="#5e5241" stroke-width="1.4" marker-end="url(#ah-5e5241)"/><text x="410.0" y="125" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">spawn + initialize</text><line x1="518" y1="147" x2="303" y2="147" stroke="#4b7d33" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ah-4b7d33)"/><text x="410.0" y="160" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">capabilities: tools, resources, prompts</text><line x1="302" y1="186" x2="517" y2="186" stroke="#5e5241" stroke-width="1.4" marker-end="url(#ah-5e5241)"/><text x="410.0" y="181" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">get_prompt plan_trip</text><line x1="518" y1="203" x2="303" y2="203" stroke="#4b7d33" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ah-4b7d33)"/><text x="410.0" y="216" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">“We are 5 friends with ₹6000 each …”</text><line x1="302" y1="242" x2="517" y2="242" stroke="#5e5241" stroke-width="1.4" marker-end="url(#ah-5e5241)"/><text x="410.0" y="237" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">list_tools</text><line x1="518" y1="259" x2="303" y2="259" stroke="#4b7d33" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ah-4b7d33)"/><text x="410.0" y="272" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">3 schemas → bind_tools</text><line x1="302" y1="298" x2="517" y2="298" stroke="#5e5241" stroke-width="1.4" marker-end="url(#ah-5e5241)"/><text x="410.0" y="293" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">read_resource trips://destinations</text><line x1="518" y1="315" x2="303" y2="315" stroke="#4b7d33" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ah-4b7d33)"/><text x="410.0" y="328" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">10 places → system prompt</text><text x="20" y="318" font-size="10" font-weight="700" fill="#9a5400" text-anchor="start" font-style="italic">app reads a RESOURCE</text><line x1="302" y1="354" x2="687" y2="354" stroke="#5e5241" stroke-width="1.4" marker-end="url(#ah-5e5241)"/><text x="495.0" y="349" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">messages + tools</text><line x1="688" y1="371" x2="303" y2="371" stroke="#9a5400" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ah-9a5400)"/><text x="495.0" y="384" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">tool_call db_lookup('Hampi')</text><text x="20" y="374" font-size="10" font-weight="700" fill="#4b7d33" text-anchor="start" font-style="italic">model picks a TOOL</text><line x1="302" y1="410" x2="517" y2="410" stroke="#5e5241" stroke-width="1.4" marker-end="url(#ah-5e5241)"/><text x="410.0" y="405" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">call_tool db_lookup</text><line x1="518" y1="427" x2="303" y2="427" stroke="#4b7d33" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ah-4b7d33)"/><text x="410.0" y="440" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">Hampi: 1500, 900, 800</text><line x1="302" y1="466" x2="687" y2="466" stroke="#5e5241" stroke-width="1.4" marker-end="url(#ah-5e5241)"/><text x="495.0" y="461" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">+ ToolMessage</text><line x1="688" y1="483" x2="303" y2="483" stroke="#9a5400" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ah-9a5400)"/><text x="495.0" y="496" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">tool_call compute_trip_cost(…)</text><line x1="302" y1="522" x2="517" y2="522" stroke="#5e5241" stroke-width="1.4" marker-end="url(#ah-5e5241)"/><text x="410.0" y="517" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">call_tool compute_trip_cost</text><line x1="518" y1="539" x2="303" y2="539" stroke="#4b7d33" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ah-4b7d33)"/><text x="410.0" y="552" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">total 4300, money left 1700</text><line x1="302" y1="578" x2="687" y2="578" stroke="#5e5241" stroke-width="1.4" marker-end="url(#ah-5e5241)"/><text x="495.0" y="573" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">+ ToolMessage</text><line x1="688" y1="595" x2="303" y2="595" stroke="#9a5400" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ah-9a5400)"/><text x="495.0" y="608" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">final answer</text><line x1="298" y1="634" x2="83" y2="634" stroke="#9a5400" stroke-width="1.4" marker-end="url(#ah-9a5400)"/><text x="190" y="629" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">₹4,300 each, ₹1,700 left</text><text x="410" y="658" font-size="10.5" font-weight="400" fill="#7a6d57" text-anchor="middle" font-style="italic">the session closes, and the server process exits</text></svg>

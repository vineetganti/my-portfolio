<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>The tool-calling loop in lesson 06</title><desc>Left: the loop. Start with the question in a messages list, call the model with the whole list, and if the reply has tool calls, run each one from TOOL_MAP and append a ToolMessage with the matching tool_call_id, then call the model again. With no tool calls, return the text. MAX_STEPS stops a runaway loop. Right: the real messages list for the Manali question: the question, then lookup_place, its result, calculate_stay_share giving 2 rooms and 6666.67, calculate_trip_cost giving 20866.67, and a final answer saying it's slightly over the 20,000 budget. That's four model calls and three tool calls.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="760" height="420" fill="#fffdf8"/><text x="20" y="28" font-size="14" font-weight="700" fill="#9a5400" text-anchor="start">Lesson 06: the loop, and the list it builds</text><rect x="20" y="46" width="300" height="42" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="170.0" y="72.0" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">messages = [HumanMessage(question)]</text><rect x="20" y="110" width="300" height="46" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="170.0" y="131.0" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">response = llm.invoke(messages)</text><text x="170.0" y="148.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">the model reads the whole list every time</text><rect x="60" y="178" width="260" height="42" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="190.0" y="204.0" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">response.tool_calls?</text><rect x="60" y="246" width="260" height="58" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="190.0" y="273.0" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">run each tool: TOOL_MAP[name].invoke(args)</text><text x="190.0" y="290.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">append ToolMessage(result, tool_call_id)</text><rect x="20" y="340" width="150" height="46" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="95.0" y="361.0" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">return response.text</text><text x="95.0" y="378.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">the final answer</text><line x1="170" y1="88" x2="170" y2="108" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="170" y1="156" x2="170" y2="176" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="190" y1="220" x2="190" y2="244" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="200" y="237" font-size="10.5" font-weight="700" fill="#4b7d33" text-anchor="start">yes</text><path d="M60 199 H35 V338" fill="none" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="42" y="232" font-size="10.5" font-weight="700" fill="#b0273f" text-anchor="start">no</text><path d="M320 275 H340 V133 H322" fill="none" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="176" y="405" font-size="10.5" font-weight="400" fill="#7a6d57" text-anchor="middle" font-style="italic">for _ in range(MAX_STEPS): a guard against looping forever</text><text x="370" y="58" font-size="11" font-weight="700" fill="#2f281e" text-anchor="start">The list for: Can 3 friends do Manali for 4 nights with ₹20,000 each?</text><rect x="370" y="72" width="370" height="30" rx="8" fill="#faf3e3" stroke="#5e5241" stroke-width="1.2"/><text x="382" y="91" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="start">Human</text><text x="426" y="91" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start">the question</text><rect x="370" y="110" width="370" height="30" rx="8" fill="#fde3ad" stroke="#9a5400" stroke-width="1.2"/><text x="382" y="129" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="start">AI</text><text x="426" y="129" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">→ lookup_place(place='Manali')</text><rect x="370" y="148" width="370" height="30" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="382" y="167" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="start">Tool</text><text x="426" y="167" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">room 2500, travel 9000, daily 1300</text><rect x="370" y="186" width="370" height="30" rx="8" fill="#fde3ad" stroke="#9a5400" stroke-width="1.2"/><text x="382" y="205" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="start">AI</text><text x="426" y="205" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">→ calculate_stay_share(people=3, nights=4, …)</text><rect x="370" y="224" width="370" height="30" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="382" y="243" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="start">Tool</text><text x="426" y="243" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">rooms_needed 2, stay_share 6666.67</text><rect x="370" y="262" width="370" height="30" rx="8" fill="#fde3ad" stroke="#9a5400" stroke-width="1.2"/><text x="382" y="281" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="start">AI</text><text x="426" y="281" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">→ calculate_trip_cost(9000, 6666.67, 1300, 4)</text><rect x="370" y="300" width="370" height="30" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="382" y="319" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="start">Tool</text><text x="426" y="319" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">20866.67</text><rect x="370" y="338" width="370" height="30" rx="8" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><text x="382" y="357" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="start">AI</text><text x="426" y="357" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start">“Yes, but it's slightly tight … ₹20,866.67”</text><text x="555" y="400" font-size="10.5" font-weight="400" fill="#7a6d57" text-anchor="middle" font-style="italic">4 model calls, 3 tool calls; the last reply has no tool call</text></svg>

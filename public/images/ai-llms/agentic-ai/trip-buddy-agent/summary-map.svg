<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Trip Buddy: what to remember</title><desc>Five columns. Setup: pyproject.toml makes it a uv project, uv sync builds .venv, use python -m uv when uv isn't on PATH, and keep the key in .env. Model: make_llm is the one seam, a 429 can mean billing, check model access for a new key, and send thought signatures back. Agent: RAG grounds the answer, tools do the maths, loop until no tool call, and cap the steps. Protocols: MCP has tools, resources and prompts controlled by model, app and user; A2A is a card then a message; print the error type. Memory: short-term is the list; semantic, episodic and procedural; extract, consolidate, store; recall into the prompt; resolve relative dates.</desc><defs></defs><rect width="760" height="270" fill="#fffdf8"/><rect x="20" y="16" width="134" height="238" rx="12" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="87" y="42" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Setup</text><line x1="36" y1="54" x2="138" y2="54" stroke="#dccfb1" stroke-width="1"/><text x="87" y="76" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">pyproject.toml makes</text><text x="87" y="90" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">it a uv project</text><text x="87" y="116" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">uv sync builds .venv</text><text x="87" y="142" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">python -m uv when uv</text><text x="87" y="156" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">isn't on PATH</text><text x="87" y="182" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">keys go in .env,</text><text x="87" y="196" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">never in a chat</text><rect x="166" y="16" width="134" height="238" rx="12" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="233" y="42" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Model</text><line x1="182" y1="54" x2="284" y2="54" stroke="#dccfb1" stroke-width="1"/><text x="233" y="76" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">make_llm(): one place</text><text x="233" y="90" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">to swap providers</text><text x="233" y="116" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">a 429 can mean</text><text x="233" y="130" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">billing, not speed</text><text x="233" y="156" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">new keys can't use</text><text x="233" y="170" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">every model</text><text x="233" y="196" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">send thought</text><text x="233" y="210" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">signatures back</text><rect x="312" y="16" width="134" height="238" rx="12" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="379" y="42" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Agent</text><line x1="328" y1="54" x2="430" y2="54" stroke="#dccfb1" stroke-width="1"/><text x="379" y="76" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">RAG grounds</text><text x="379" y="90" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">the answer</text><text x="379" y="116" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">tools do the maths</text><text x="379" y="142" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">loop until there's</text><text x="379" y="156" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">no tool call</text><text x="379" y="182" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">cap it: MAX_STEPS</text><rect x="458" y="16" width="134" height="238" rx="12" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="525" y="42" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Protocols</text><line x1="474" y1="54" x2="576" y2="54" stroke="#dccfb1" stroke-width="1"/><text x="525" y="76" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">MCP: tools, resources,</text><text x="525" y="90" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">prompts</text><text x="525" y="116" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">model, app and user</text><text x="525" y="130" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">each control one</text><text x="525" y="156" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">A2A: read the card,</text><text x="525" y="170" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">then send a message</text><text x="525" y="196" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">print the error type</text><rect x="604" y="16" width="134" height="238" rx="12" fill="#f3eadb" stroke="#5e5241" stroke-width="1.5"/><text x="671" y="42" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Memory</text><line x1="620" y1="54" x2="722" y2="54" stroke="#dccfb1" stroke-width="1"/><text x="671" y="76" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">short-term = the</text><text x="671" y="90" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">message list</text><text x="671" y="116" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">semantic, episodic,</text><text x="671" y="130" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">procedural</text><text x="671" y="156" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">extract → consolidate</text><text x="671" y="170" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">→ store → recall</text><text x="671" y="196" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">resolve relative</text><text x="671" y="210" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">dates first</text></svg>

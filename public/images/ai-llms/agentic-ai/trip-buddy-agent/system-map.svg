<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Trip Buddy after lesson 15</title><desc>The host program trip_15 holds the Gradio chat UI, the ReAct loop, the RAG notebook in Chroma and make_llm. It starts the MCP server as a subprocess for every message and talks JSON-RPC over stdio to reach three tools, two resources and one prompt backed by an in-memory SQLite database of 10 places. It reaches the Local Guide agent, a separate process on port 9999, over A2A. Both the host and the guide call the Gemini API. Lesson 13's long-term memory on disk is a separate app.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="760" height="450" fill="#fffdf8"/><text x="20" y="28" font-size="14" font-weight="700" fill="#9a5400" text-anchor="start">Trip Buddy after lesson 15: who talks to whom</text><rect x="20" y="150" width="130" height="74" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="85.0" y="178.0" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">You</text><text x="85.0" y="195.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">a browser tab</text><text x="85.0" y="209.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">127.0.0.1:7860</text><rect x="190" y="50" width="270" height="318" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="325" y="74" font-size="13" font-weight="700" fill="#9a5400" text-anchor="middle">Host: trip_15_a2a_agent.py</text><rect x="208" y="88" width="234" height="46" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="325.0" y="109.0" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Gradio chat UI</text><text x="325.0" y="126.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">/plan, list, or a question</text><rect x="208" y="144" width="234" height="64" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="325.0" y="167.0" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">ReAct loop</text><text x="325.0" y="184.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">model picks a tool → run it → repeat</text><text x="325.0" y="198.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">stops with no tool call or MAX_STEPS = 10</text><rect x="208" y="218" width="234" height="60" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="325.0" y="239.0" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">RAG notebook</text><text x="325.0" y="256.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Chroma in memory, 13 tips</text><text x="325.0" y="270.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">top 3 pasted into the system prompt</text><rect x="208" y="288" width="234" height="60" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="325.0" y="309.0" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">make_llm()</text><text x="325.0" y="326.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">trip_llm.py</text><text x="325.0" y="340.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">ChatGoogleGenerativeAI, temperature 0</text><rect x="520" y="40" width="222" height="196" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="631" y="62" font-size="13" font-weight="700" fill="#4b7d33" text-anchor="middle">MCP server</text><text x="631" y="80" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">trip_mcp_server.py</text><text x="631" y="94" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">a subprocess per message, over stdio</text><text x="534" y="120" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start">tools: db_lookup, list_destinations,</text><text x="534" y="135" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start">        compute_trip_cost</text><text x="534" y="150" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start">resources: trips://destinations,</text><text x="534" y="165" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start">        trips://place/{place_id}</text><text x="534" y="180" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="start">prompt: plan_trip</text><rect x="534" y="202" width="194" height="24" rx="8" fill="#fffdf8" stroke="#5e5241" stroke-width="1.2"/><text x="631" y="218" font-size="10.5" font-weight="400" fill="#2f281e" text-anchor="middle">SQLite :memory:, 10 places</text><rect x="520" y="258" width="222" height="110" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="631.0" y="290.0" font-size="12.5" font-weight="700" fill="#4b7d33" text-anchor="middle">Local Guide agent</text><text x="631.0" y="307.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">trip_guide_agent.py, its own process</text><text x="631.0" y="321.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">A2A over HTTP on 127.0.0.1:9999</text><text x="631.0" y="335.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">card: /.well-known/agent-card.json</text><text x="631.0" y="349.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">notes for 10 places + its own LLM</text><rect x="190" y="394" width="552" height="42" rx="10" fill="#f3eadb" stroke="#5e5241" stroke-width="1.5"/><text x="466.0" y="413.0" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Gemini API</text><text x="466.0" y="430.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">gemini-flash-lite-latest, called by the host and by the guide</text><rect x="20" y="268" width="140" height="100" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5" stroke-dasharray="5 4"/><text x="90.0" y="302.0" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Lesson 13 only</text><text x="90.0" y="319.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">memory_store/ on disk</text><text x="90.0" y="333.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">SQLite: facts, rules</text><text x="90.0" y="347.0" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Chroma: episodes</text><line x1="150" y1="187" x2="206" y2="111" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="442" y1="160" x2="518" y2="130" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="490" y="110" font-size="10.5" font-weight="700" fill="#4b7d33" text-anchor="middle">stdio</text><text x="490" y="123" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">JSON-RPC</text><line x1="442" y1="200" x2="518" y2="300" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="490" y="216" font-size="10.5" font-weight="700" fill="#4b7d33" text-anchor="middle">A2A</text><text x="490" y="229" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">HTTP</text><line x1="325" y1="348" x2="325" y2="392" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="631" y1="368" x2="631" y2="392" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="160" y1="318" x2="206" y2="318" stroke="#5e5241" stroke-width="1.4" stroke-dasharray="4 3"/></svg>

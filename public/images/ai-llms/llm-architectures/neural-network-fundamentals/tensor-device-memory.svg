<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>A tensor is a small handle to a block of memory on a device</title><desc>A torch.Tensor object holds metadata, the shape, strides, data type and device, plus a pointer to a storage block. The block lives either in host RAM, allocated with malloc, or in GPU VRAM, allocated with cudaMalloc. Calling .to cuda copies the block across PCIe and gives the tensor a new pointer.</desc><defs><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a00"/></marker></defs><rect width="720" height="360" fill="#ffffff"/><rect x="10" y="10" width="230" height="330" rx="14" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="125" y="34" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">torch.Tensor</text><text x="125" y="51" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">a Python object, tiny</text><rect x="26" y="62" width="198" height="38" rx="6" fill="#ffffff" stroke="#4f5d36" stroke-width="1.3"/><text x="38" y="86" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="start">shape</text><text x="214" y="86" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">(1000, 1000)</text><rect x="26" y="108" width="198" height="38" rx="6" fill="#ffffff" stroke="#4f5d36" stroke-width="1.3"/><text x="38" y="132" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="start">stride</text><text x="214" y="132" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">(1000, 1)</text><rect x="26" y="154" width="198" height="38" rx="6" fill="#ffffff" stroke="#4f5d36" stroke-width="1.3"/><text x="38" y="178" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="start">dtype</text><text x="214" y="178" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">float32</text><rect x="26" y="200" width="198" height="38" rx="6" fill="#ffffff" stroke="#4f5d36" stroke-width="1.3"/><text x="38" y="224" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="start">device</text><text x="214" y="224" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">cuda:0</text><rect x="26" y="246" width="198" height="38" rx="6" fill="#ffffff" stroke="#4f5d36" stroke-width="1.3"/><text x="38" y="270" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="start">data_ptr</text><text x="214" y="270" font-size="12.5" font-weight="700" fill="#8a5a00" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">→ storage</text><text x="125" y="318" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">the data itself is not here</text><rect x="290" y="10" width="420" height="150" rx="14" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="500" y="34" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">Host RAM (CPU)</text><text x="500" y="51" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">allocated with malloc</text><rect x="312" y="70" width="25" height="30" rx="2" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="339" y="70" width="25" height="30" rx="2" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="366" y="70" width="25" height="30" rx="2" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="393" y="70" width="25" height="30" rx="2" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="420" y="70" width="25" height="30" rx="2" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="447" y="70" width="25" height="30" rx="2" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="474" y="70" width="25" height="30" rx="2" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="501" y="70" width="25" height="30" rx="2" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="528" y="70" width="25" height="30" rx="2" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="555" y="70" width="25" height="30" rx="2" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="582" y="70" width="25" height="30" rx="2" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="609" y="70" width="25" height="30" rx="2" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="636" y="70" width="25" height="30" rx="2" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="663" y="70" width="25" height="30" rx="2" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><text x="500" y="124" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">4 MB = 1000 × 1000 × 4 bytes</text><text x="500" y="142" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">the tensor starts here, on device cpu</text><rect x="290" y="190" width="420" height="150" rx="14" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="500" y="214" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">GPU VRAM</text><text x="500" y="231" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">allocated with cudaMalloc</text><rect x="312" y="250" width="25" height="30" rx="2" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="339" y="250" width="25" height="30" rx="2" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="366" y="250" width="25" height="30" rx="2" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="393" y="250" width="25" height="30" rx="2" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="420" y="250" width="25" height="30" rx="2" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="447" y="250" width="25" height="30" rx="2" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="474" y="250" width="25" height="30" rx="2" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="501" y="250" width="25" height="30" rx="2" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="528" y="250" width="25" height="30" rx="2" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="555" y="250" width="25" height="30" rx="2" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="582" y="250" width="25" height="30" rx="2" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="609" y="250" width="25" height="30" rx="2" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="636" y="250" width="25" height="30" rx="2" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="663" y="250" width="25" height="30" rx="2" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><text x="500" y="304" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">same bytes, copied across the bus</text><text x="500" y="322" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">after x.to('cuda'): device cuda:0</text><line x1="500" y1="164" x2="500" y2="188" stroke="#8a5a00" stroke-width="2.4" marker-end="url(#ah-8a5a00)"/><text x="514" y="180" font-size="12" font-weight="700" fill="#8a5a00" text-anchor="start">.to('cuda')  copy over PCIe</text><line x1="226" y1="265" x2="288" y2="265" stroke="#8a5a00" stroke-width="2.2" marker-end="url(#ah-8a5a00)"/></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Weight tying: one matrix used twice</title><desc>Token ids select rows of the embedding matrix E at the input. At the output, the final hidden state is multiplied by E transposed to produce logits over the vocabulary. Tying the two means one V by D matrix serves both, saving V times D parameters, about 38.6 million for GPT-2 small.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a00"/></marker></defs><rect width="720" height="340" fill="#ffffff"/><rect x="20" y="140" width="110" height="50" rx="8" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.5"/><text x="75" y="160.625" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">token ids</text><text x="75" y="176.875" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">[15, 2201, 7]</text><rect x="240" y="70" width="120" height="200" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="2"/><line x1="240" y1="95" x2="360" y2="95" stroke="#8a5a00" stroke-width="0.8" opacity="0.6"/><line x1="240" y1="120" x2="360" y2="120" stroke="#8a5a00" stroke-width="0.8" opacity="0.6"/><line x1="240" y1="145" x2="360" y2="145" stroke="#8a5a00" stroke-width="0.8" opacity="0.6"/><line x1="240" y1="170" x2="360" y2="170" stroke="#8a5a00" stroke-width="0.8" opacity="0.6"/><line x1="240" y1="195" x2="360" y2="195" stroke="#8a5a00" stroke-width="0.8" opacity="0.6"/><line x1="240" y1="220" x2="360" y2="220" stroke="#8a5a00" stroke-width="0.8" opacity="0.6"/><line x1="240" y1="245" x2="360" y2="245" stroke="#8a5a00" stroke-width="0.8" opacity="0.6"/><line x1="240" y1="270" x2="360" y2="270" stroke="#8a5a00" stroke-width="0.8" opacity="0.6"/><text x="300" y="52" font-size="14" font-weight="700" fill="#8a5a00" text-anchor="middle">E  (V × D)</text><text x="300" y="292" font-size="12" font-weight="700" fill="#8a5a00" text-anchor="middle">one shared Parameter</text><text x="300" y="310" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">50,257 × 768 in GPT-2 small</text><line x1="132" y1="165" x2="238" y2="108" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><text x="176" y="120" font-size="12" font-weight="700" fill="#6b5f4d" text-anchor="middle">pick rows</text><rect x="430" y="90" width="120" height="50" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="490" y="110.45" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">Transformer</text><text x="490" y="127.35" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">blocks</text><line x1="362" y1="108" x2="428" y2="112" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><text x="395" y="100" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">embeddings</text><rect x="590" y="90" width="110" height="50" rx="8" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.5"/><text x="645" y="110.45" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">hidden h</text><text x="645" y="127.35" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">(D)</text><line x1="552" y1="115" x2="588" y2="115" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><path d="M645 142 L645 200 L362 200" fill="none" stroke="#8a5a00" stroke-width="1.8" marker-end="url(#ah-8a5a00)" stroke-linejoin="round" stroke-linecap="round"/><text x="505" y="192" font-size="12.5" font-weight="700" fill="#8a5a00" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">multiply h by Eᵀ</text><line x1="362" y1="262" x2="428" y2="262" stroke="#8a5a00" stroke-width="1.8" marker-end="url(#ah-8a5a00)"/><rect x="430" y="240" width="270" height="44" rx="8" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.5"/><text x="565" y="265.75" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">logits over the vocabulary (V)</text><text x="560" y="318" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">saves V × D ≈ 38.6M parameters</text></svg>

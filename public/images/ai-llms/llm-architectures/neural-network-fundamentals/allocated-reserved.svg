<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>memory_allocated versus memory_reserved</title><desc>Three snapshots of PyTorch's CUDA memory pool, ten blocks. With seven live tensors, allocated is 7 and reserved is 10. After del, allocated drops to 3 but reserved stays at 10, the freed blocks sit in the cache. After torch.cuda.empty_cache, reserved drops to 3 too.</desc><defs></defs><rect width="720" height="340" fill="#fffdf8"/><text x="20" y="24" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">PyTorch's caching allocator holds on to freed blocks</text><text x="20" y="66" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start">1. tensors alive</text><rect x="24" y="76" width="40" height="30" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><rect x="68" y="76" width="40" height="30" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><rect x="112" y="76" width="40" height="30" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><rect x="156" y="76" width="40" height="30" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><rect x="200" y="76" width="40" height="30" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><rect x="244" y="76" width="40" height="30" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><rect x="288" y="76" width="40" height="30" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><rect x="332" y="76" width="40" height="30" rx="3" fill="#fde3ad" stroke="#9a5400" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="376" y="76" width="40" height="30" rx="3" fill="#fde3ad" stroke="#9a5400" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="420" y="76" width="40" height="30" rx="3" fill="#fde3ad" stroke="#9a5400" stroke-width="1.4" stroke-dasharray="4 3"/><text x="500" y="88" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">memory_allocated = 7</text><text x="500" y="104" font-size="12.5" font-weight="400" fill="#9a5400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">memory_reserved = 10</text><text x="20" y="154" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start">2. after  del big_tensor</text><rect x="24" y="164" width="40" height="30" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><rect x="68" y="164" width="40" height="30" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><rect x="112" y="164" width="40" height="30" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><rect x="156" y="164" width="40" height="30" rx="3" fill="#fde3ad" stroke="#9a5400" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="200" y="164" width="40" height="30" rx="3" fill="#fde3ad" stroke="#9a5400" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="244" y="164" width="40" height="30" rx="3" fill="#fde3ad" stroke="#9a5400" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="288" y="164" width="40" height="30" rx="3" fill="#fde3ad" stroke="#9a5400" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="332" y="164" width="40" height="30" rx="3" fill="#fde3ad" stroke="#9a5400" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="376" y="164" width="40" height="30" rx="3" fill="#fde3ad" stroke="#9a5400" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="420" y="164" width="40" height="30" rx="3" fill="#fde3ad" stroke="#9a5400" stroke-width="1.4" stroke-dasharray="4 3"/><text x="500" y="176" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">memory_allocated = 3</text><text x="500" y="192" font-size="12.5" font-weight="400" fill="#9a5400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">memory_reserved = 10</text><text x="20" y="242" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start">3. after  torch.cuda.empty_cache()</text><rect x="24" y="252" width="40" height="30" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><rect x="68" y="252" width="40" height="30" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><rect x="112" y="252" width="40" height="30" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><rect x="156" y="252" width="40" height="30" rx="3" fill="#fffdf8" stroke="#dccfb1" stroke-width="1" stroke-dasharray="2 4"/><rect x="200" y="252" width="40" height="30" rx="3" fill="#fffdf8" stroke="#dccfb1" stroke-width="1" stroke-dasharray="2 4"/><rect x="244" y="252" width="40" height="30" rx="3" fill="#fffdf8" stroke="#dccfb1" stroke-width="1" stroke-dasharray="2 4"/><rect x="288" y="252" width="40" height="30" rx="3" fill="#fffdf8" stroke="#dccfb1" stroke-width="1" stroke-dasharray="2 4"/><rect x="332" y="252" width="40" height="30" rx="3" fill="#fffdf8" stroke="#dccfb1" stroke-width="1" stroke-dasharray="2 4"/><rect x="376" y="252" width="40" height="30" rx="3" fill="#fffdf8" stroke="#dccfb1" stroke-width="1" stroke-dasharray="2 4"/><rect x="420" y="252" width="40" height="30" rx="3" fill="#fffdf8" stroke="#dccfb1" stroke-width="1" stroke-dasharray="2 4"/><text x="500" y="264" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">memory_allocated = 3</text><text x="500" y="280" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">memory_reserved = 3</text><rect x="24" y="318" width="14" height="14" rx="2" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="44" y="328" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start">live tensor</text><rect x="150" y="318" width="14" height="14" rx="2" fill="#fde3ad" stroke="#9a5400" stroke-width="1.2"/><text x="170" y="329" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start">free, but still reserved by PyTorch (cached)</text><rect x="430" y="318" width="14" height="14" rx="2" fill="#fffdf8" stroke="#dccfb1" stroke-width="1"/><text x="450" y="329" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start">returned to the CUDA driver</text></svg>

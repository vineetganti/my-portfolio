<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 368" width="720" height="368" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Tiled matrix multiplication on a GPU</title><desc>One thread block computes one tile of C. It walks along K, loading a tile of A and a tile of B from slow global memory into fast shared memory, multiplying them and accumulating the result in registers.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="368" fill="#fffdf8"/><text x="20" y="36" font-size="15" font-weight="700" fill="#2f281e" text-anchor="start">C  =  A  ×  B</text><rect x="20" y="60" width="100" height="100" rx="4" fill="#fffdf8" stroke="#5e5241" stroke-width="1.4"/><rect x="50" y="100" width="30" height="30" rx="3" fill="#f6c45a" stroke="#9a5400" stroke-width="1.6"/><text x="145" y="118" font-size="20" font-weight="700" fill="#2f281e" text-anchor="middle">=</text><rect x="170" y="60" width="100" height="100" rx="4" fill="#fffdf8" stroke="#5e5241" stroke-width="1.4"/><rect x="170" y="100" width="100" height="30" rx="2" fill="#fde3ad" stroke="#9a5400" stroke-width="1.4"/><text x="295" y="118" font-size="20" font-weight="700" fill="#2f281e" text-anchor="middle">×</text><rect x="320" y="60" width="100" height="100" rx="4" fill="#fffdf8" stroke="#5e5241" stroke-width="1.4"/><rect x="350" y="60" width="30" height="100" rx="2" fill="#fde3ad" stroke="#9a5400" stroke-width="1.4"/><text x="70" y="182" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="middle">C  (M × N)</text><text x="220" y="182" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="middle">A  (M × K)</text><text x="370" y="182" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="middle">B  (K × N)</text><text x="20" y="218" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="start">One thread block computes one tile of C.</text><text x="20" y="236" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="start">It slides along K: each step loads one tile of A and</text><text x="20" y="254" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="start">one tile of B into shared memory, multiplies them</text><text x="20" y="272" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="start">and accumulates the result in registers.</text><text x="20" y="308" font-size="12.5" font-weight="400" fill="#5e5241" text-anchor="start" font-style="italic">Tiling means each value fetched from slow global memory</text><text x="20" y="326" font-size="12.5" font-weight="400" fill="#5e5241" text-anchor="start" font-style="italic">is reused many times from fast on-chip memory.</text><rect x="450" y="14" width="260" height="92" rx="12" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.4"/><text x="580" y="40" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Global memory (HBM / DRAM)</text><text x="580" y="60" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">largest and slowest,</text><text x="580" y="75" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">shared by every SM</text><rect x="450" y="138" width="260" height="92" rx="12" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="580" y="164" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Shared memory (on-chip)</text><text x="580" y="184" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">small and fast,</text><text x="580" y="199" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">shared by one thread block</text><rect x="450" y="262" width="260" height="76" rx="12" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><text x="580" y="288" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Registers (on-chip)</text><text x="580" y="308" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">fastest, private to each thread</text><line x1="580" y1="108" x2="580" y2="136" stroke="#5e5241" stroke-width="2" marker-end="url(#ah-4f5d36)"/><text x="592" y="128" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start" font-style="italic">load a tile once</text><line x1="580" y1="232" x2="580" y2="260" stroke="#5e5241" stroke-width="2" marker-end="url(#ah-4f5d36)"/><text x="592" y="252" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start" font-style="italic">reuse many times</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="720" height="372" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>NCHW versus NHWC memory layout</title><desc>A 2 by 2 image with three channels is stored in memory in two ways. In NCHW the whole red plane comes first, then green, then blue. In NHWC the three channel values of each pixel sit next to each other.</desc><defs></defs><rect width="720" height="372" fill="#ffffff"/><text x="20" y="24" font-size="14" font-weight="700" fill="#2c361c" text-anchor="start">One 2 × 2 image with 3 channels (N = 1, C = 3, H = 2, W = 2)</text><rect x="60" y="50" width="34" height="30" rx="0" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.2"/><text x="77" y="70" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">R00</text><rect x="94" y="50" width="34" height="30" rx="0" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.2"/><text x="111" y="70" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">R01</text><rect x="60" y="80" width="34" height="30" rx="0" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.2"/><text x="77" y="100" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">R10</text><rect x="94" y="80" width="34" height="30" rx="0" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.2"/><text x="111" y="100" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">R11</text><text x="94" y="130" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">red plane</text><rect x="160" y="50" width="34" height="30" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="177" y="70" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">G00</text><rect x="194" y="50" width="34" height="30" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="211" y="70" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">G01</text><rect x="160" y="80" width="34" height="30" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="177" y="100" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">G10</text><rect x="194" y="80" width="34" height="30" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="211" y="100" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">G11</text><text x="194" y="130" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">green plane</text><rect x="260" y="50" width="34" height="30" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><text x="277" y="70" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">B00</text><rect x="294" y="50" width="34" height="30" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><text x="311" y="70" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">B01</text><rect x="260" y="80" width="34" height="30" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><text x="277" y="100" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">B10</text><rect x="294" y="80" width="34" height="30" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><text x="311" y="100" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">B11</text><text x="294" y="130" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">blue plane</text><text x="470" y="74" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="start">pixel (row, col) has three values:</text><text x="470" y="94" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="start">R, G and B at the same position</text><text x="20" y="186" font-size="14" font-weight="700" fill="#2c361c" text-anchor="start">NCHW</text><text x="20" y="202" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="start">channels first</text><rect x="150" y="168" width="46" height="36" rx="0" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.2"/><text x="173" y="191" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">R00</text><rect x="196" y="168" width="46" height="36" rx="0" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.2"/><text x="219" y="191" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">R01</text><rect x="242" y="168" width="46" height="36" rx="0" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.2"/><text x="265" y="191" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">R10</text><rect x="288" y="168" width="46" height="36" rx="0" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.2"/><text x="311" y="191" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">R11</text><rect x="334" y="168" width="46" height="36" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="357" y="191" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">G00</text><rect x="380" y="168" width="46" height="36" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="403" y="191" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">G01</text><rect x="426" y="168" width="46" height="36" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="449" y="191" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">G10</text><rect x="472" y="168" width="46" height="36" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="495" y="191" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">G11</text><rect x="518" y="168" width="46" height="36" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><text x="541" y="191" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">B00</text><rect x="564" y="168" width="46" height="36" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><text x="587" y="191" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">B01</text><rect x="610" y="168" width="46" height="36" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><text x="633" y="191" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">B10</text><rect x="656" y="168" width="46" height="36" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><text x="679" y="191" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">B11</text><text x="150" y="224" font-size="12" font-weight="700" fill="#8a5a00" text-anchor="start">each channel plane is contiguous: suits per-channel work</text><text x="702" y="162" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="end" font-style="italic">memory address →</text><text x="20" y="282" font-size="14" font-weight="700" fill="#2c361c" text-anchor="start">NHWC</text><text x="20" y="298" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="start">channels last</text><rect x="150" y="264" width="46" height="36" rx="0" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.2"/><text x="173" y="287" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">R00</text><rect x="196" y="264" width="46" height="36" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="219" y="287" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">G00</text><rect x="242" y="264" width="46" height="36" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><text x="265" y="287" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">B00</text><rect x="288" y="264" width="46" height="36" rx="0" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.2"/><text x="311" y="287" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">R01</text><rect x="334" y="264" width="46" height="36" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="357" y="287" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">G01</text><rect x=
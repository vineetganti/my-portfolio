<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 322" width="720" height="322" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Memory: training versus inference</title><desc>In an FP32 example with Adam, training needs about four times the parameter memory, from weights, gradients and two optimizer states, plus activations. Inference needs the weights plus a small working set.</desc><defs></defs><rect width="720" height="322" fill="#ffffff"/><text x="20" y="82" font-size="14" font-weight="700" fill="#2c361c" text-anchor="start">Training</text><text x="20" y="99" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="start">FP32 weights, Adam</text><rect x="190" y="60" width="100" height="56" rx="4" fill="#f6ebc4" stroke="#8a5a00" stroke-width="1.4"/><text x="240.0" y="93" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">weights 1×</text><rect x="290" y="60" width="100" height="56" rx="4" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.4"/><text x="340.0" y="93" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">gradients 1×</text><rect x="390" y="60" width="100" height="56" rx="4" fill="#f3e5ab" stroke="#b99a2f" stroke-width="1.4"/><text x="440.0" y="93" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">Adam m 1×</text><rect x="490" y="60" width="100" height="56" rx="4" fill="#f7edc4" stroke="#b99a2f" stroke-width="1.4"/><text x="540.0" y="93" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">Adam v 1×</text><rect x="590" y="60" width="120" height="56" rx="4" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4" stroke-dasharray="4 3"/><text x="650.0" y="93" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">activations</text><text x="190" y="138" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="start">about 4× the parameter memory, plus activations kept for backpropagation</text><text x="20" y="192" font-size="14" font-weight="700" fill="#2c361c" text-anchor="start">Inference</text><text x="20" y="209" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="start">same model</text><rect x="190" y="170" width="100" height="56" rx="4" fill="#f6ebc4" stroke="#8a5a00" stroke-width="1.4"/><text x="240" y="203" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">weights 1×</text><rect x="290" y="170" width="56" height="56" rx="4" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4" stroke-dasharray="4 3"/><text x="318" y="195" font-size="10.5" font-weight="700" fill="#2c361c" text-anchor="middle">inputs</text><text x="318" y="209" font-size="10.5" font-weight="700" fill="#2c361c" text-anchor="middle">+ temp</text><text x="190" y="248" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="start">about 1× the parameter memory, plus a small working set (and the KV cache for LLMs)</text><text x="360" y="296" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">FP32 example: 4 bytes per parameter for each of weights, gradients, m and v.</text><text x="360" y="312" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">Mixed precision changes the ratio.</text></svg>

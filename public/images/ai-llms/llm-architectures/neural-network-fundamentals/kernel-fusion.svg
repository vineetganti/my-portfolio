<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="720" height="372" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Kernel fusion</title><desc>Without fusion, matmul, bias and ReLU are three kernels that each read from and write to global memory. With fusion they are one kernel and the intermediate results stay in registers and shared memory.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker></defs><rect width="720" height="372" fill="#ffffff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#3a3226" text-anchor="start">Without fusion: 3 kernel launches, 6 trips to global memory</text><rect x="40" y="44" width="170" height="46" rx="10" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="125" y="73" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">matmul</text><line x1="91" y1="114" x2="91" y2="92" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><line x1="159" y1="92" x2="159" y2="112" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="275" y="44" width="170" height="46" rx="10" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="360" y="73" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">+ bias</text><line x1="326" y1="114" x2="326" y2="92" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><line x1="394" y1="92" x2="394" y2="112" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="510" y="44" width="170" height="46" rx="10" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="595" y="73" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">ReLU</text><line x1="561" y1="114" x2="561" y2="92" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><line x1="629" y1="92" x2="629" y2="112" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="20" y="114" width="680" height="28" rx="8" fill="#f3ecdc" stroke="#8d8068" stroke-width="1.3" stroke-dasharray="6 4"/><text x="360" y="133" font-size="12.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">global memory (slow)</text><text x="20" y="196" font-size="14" font-weight="700" fill="#3a3226" text-anchor="start">With fusion: 1 kernel launch, 2 trips (one read, one write)</text><rect x="40" y="212" width="640" height="80" rx="12" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.6"/><rect x="70" y="224" width="130" height="34" rx="8" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.3"/><text x="135" y="246" font-size="13.5" font-weight="700" fill="#3a3226" text-anchor="middle">matmul</text><rect x="295" y="224" width="130" height="34" rx="8" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.3"/><text x="360" y="246" font-size="13.5" font-weight="700" fill="#3a3226" text-anchor="middle">+ bias</text><rect x="520" y="224" width="130" height="34" rx="8" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.3"/><text x="585" y="246" font-size="13.5" font-weight="700" fill="#3a3226" text-anchor="middle">ReLU</text><line x1="202" y1="241" x2="293" y2="241" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><line x1="427" y1="241" x2="518" y2="241" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><text x="360" y="281" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">intermediate results stay in registers and shared memory</text><rect x="20" y="318" width="680" height="28" rx="8" fill="#f3ecdc" stroke="#8d8068" stroke-width="1.3" stroke-dasharray="6 4"/><text x="360" y="337" font-size="12.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">global memory (slow)</text><line x1="135" y1="316" x2="135" y2="294" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><line x1="585" y1="294" x2="585" y2="316" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><text x="360" y="364" font-size="11.5" font-weight="400" fill="#8d8068" text-anchor="middle" font-style="italic">Reads of the weights themselves are ignored in these counts.</text></svg>

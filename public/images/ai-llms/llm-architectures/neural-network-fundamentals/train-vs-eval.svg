<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>What model.eval() changes for Dropout and BatchNorm</title><desc>In training mode, dropout zeroes a random half of the activations and scales the survivors by two, and batch normalization uses the mean and variance of the current mini-batch while updating running averages. In eval mode, dropout passes everything through unchanged and batch normalization uses the saved running mean and variance.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="400" fill="#fffdf8"/><rect x="10" y="10" width="700" height="190" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="34" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Dropout (p = 0.5)</text><text x="28" y="82" font-size="13" font-weight="700" fill="#b0273f" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">train()</text><circle cx="160" cy="76" r="17" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="160" y="81" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">×2</text><circle cx="216" cy="76" r="17" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><line x1="207" y1="67" x2="225" y2="85" stroke="#b0273f" stroke-width="2"/><line x1="207" y1="85" x2="225" y2="67" stroke="#b0273f" stroke-width="2"/><text x="216" y="110" font-size="11" font-weight="400" fill="#7a6d57" text-anchor="middle">0</text><circle cx="272" cy="76" r="17" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="272" y="81" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">×2</text><circle cx="328" cy="76" r="17" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="328" y="81" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">×2</text><circle cx="384" cy="76" r="17" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><line x1="375" y1="67" x2="393" y2="85" stroke="#b0273f" stroke-width="2"/><line x1="375" y1="85" x2="393" y2="67" stroke="#b0273f" stroke-width="2"/><text x="384" y="110" font-size="11" font-weight="400" fill="#7a6d57" text-anchor="middle">0</text><circle cx="440" cy="76" r="17" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><line x1="431" y1="67" x2="449" y2="85" stroke="#b0273f" stroke-width="2"/><line x1="431" y1="85" x2="449" y2="67" stroke="#b0273f" stroke-width="2"/><text x="440" y="110" font-size="11" font-weight="400" fill="#7a6d57" text-anchor="middle">0</text><circle cx="496" cy="76" r="17" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="496" y="81" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">×2</text><circle cx="552" cy="76" r="17" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><line x1="543" y1="67" x2="561" y2="85" stroke="#b0273f" stroke-width="2"/><line x1="543" y1="85" x2="561" y2="67" stroke="#b0273f" stroke-width="2"/><text x="552" y="110" font-size="11" font-weight="400" fill="#7a6d57" text-anchor="middle">0</text><text x="28" y="140" font-size="13" font-weight="700" fill="#5e5241" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">eval()</text><circle cx="160" cy="134" r="17" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="160" y="139" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">×1</text><circle cx="216" cy="134" r="17" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="216" y="139" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">×1</text><circle cx="272" cy="134" r="17" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="272" y="139" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">×1</text><circle cx="328" cy="134" r="17" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="328" y="139" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">×1</text><circle cx="384" cy="134" r="17" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="384" y="139" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">×1</text><circle cx="440" cy="134" r="17" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="440" y="139" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">×1</text><circle cx="496" cy="134" r="17" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="496" y="139" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">×1</text><circle cx="552" cy="134" r="17" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="552" y="139" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">×1</text><text x="612" y="82" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">random mask,</text><text x="612" y="97" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">survivors × 1/(1−p)</text><text x="612" y="140" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">everything passes,</text><text x="612" y="155" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">deterministic output</text><rect x="10" y="210" width="700" height="180" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="234" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Batch Normalization</text><text x="28" y="266" font-size="13" font-weight="700" fill="#b0273f" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">train()</text><rect x="120" y="244" width="150" height="44" rx="8" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="195" y="269.75" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">this mini-batch</text><line x1="272" y1="266" x2="298" y2="266" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="300" y="244" width="190" height="44" rx="8" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="395" y="269.75" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">μ_B, σ²_B of this batch</text><line x1="492" y1="266" x2="518" y2="266" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="520" y="244" width="170" height="44" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="605" y="269.6" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">normalize (x − μ) / σ</text><text x="395" y="310" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">and update the running mean / variance (moving average)</text><text x="28" y="354" font-size="13" font-weight="700" fill="#5e5241" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">eval()</text><rect x="120" y="332" width="150" height="44" rx="8" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="195" y="357.75" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">any input, even 1</text><line x1="272" y1="354" x2="298" y2="354" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="300" y="332" width="190" height="44" rx="8" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="395" y="357.75" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">saved running μ, σ²</text><line x1="492" y1="354" x2="518" y2="354" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="520" y="332" width="170" height="44" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="605" y="357.6" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">normalize (x − μ) / σ</text></svg>

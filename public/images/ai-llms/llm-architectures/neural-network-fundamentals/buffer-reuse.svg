<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" width="720" height="262" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Two activation buffers are reused layer after layer</title><desc>During inference, layer 1 reads buffer A and writes buffer B, layer 2 reads B and writes A, and so on. Only two activation buffers are alive at any time, however deep the network is.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="262" fill="#fffdf8"/><text x="20" y="24" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Ping-pong buffers during inference</text><rect x="20" y="44" width="150" height="44" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="95" y="70.05" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">layer 1</text><line x1="172" y1="66" x2="198" y2="66" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><text x="28" y="116" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">reads</text><rect x="78" y="100" width="84" height="24" rx="6" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><text x="120" y="117" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">buffer A</text><text x="28" y="150" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">writes</text><rect x="78" y="134" width="84" height="24" rx="6" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.4"/><text x="120" y="151" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">buffer B</text><rect x="200" y="44" width="150" height="44" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="275" y="70.05" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">layer 2</text><line x1="352" y1="66" x2="378" y2="66" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><text x="208" y="116" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">reads</text><rect x="258" y="100" width="84" height="24" rx="6" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.4"/><text x="300" y="117" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">buffer B</text><text x="208" y="150" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">writes</text><rect x="258" y="134" width="84" height="24" rx="6" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><text x="300" y="151" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">buffer A</text><rect x="380" y="44" width="150" height="44" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="455" y="70.05" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">layer 3</text><line x1="532" y1="66" x2="558" y2="66" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><text x="388" y="116" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">reads</text><rect x="438" y="100" width="84" height="24" rx="6" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><text x="480" y="117" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">buffer A</text><text x="388" y="150" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">writes</text><rect x="438" y="134" width="84" height="24" rx="6" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.4"/><text x="480" y="151" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">buffer B</text><rect x="560" y="44" width="150" height="44" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="635" y="70.05" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">layer 4</text><text x="568" y="116" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">reads</text><rect x="618" y="100" width="84" height="24" rx="6" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.4"/><text x="660" y="117" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">buffer B</text><text x="568" y="150" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">writes</text><rect x="618" y="134" width="84" height="24" rx="6" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><text x="660" y="151" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">buffer A</text><rect x="14" y="186" width="692" height="58" rx="12" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="30" y="210" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">Peak activation memory is the two largest layer outputs, not the sum over all layers.</text><text x="30" y="230" font-size="12.5" font-weight="400" fill="#5e5241" text-anchor="start">Training cannot do this: backward needs every layer's activations, so they all stay alive.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="720" height="372" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>VRAM grows with batch size, weights do not</title><desc>Illustrative stacked bars for batch sizes 1, 8, 32 and 64. The weights and framework overhead stay constant, while inputs and activations grow in proportion to the batch size, so the total eventually crosses the 24 GB limit of the GPU.</desc><defs></defs><rect width="720" height="372" fill="#ffffff"/><text x="20" y="24" font-size="14" font-weight="700" fill="#3a3226" text-anchor="start">Illustrative: a 7B model in FP16 with 0.4 GB of activations per sample</text><line x1="60" y1="168" x2="690" y2="168" stroke="#a3283f" stroke-width="1.6" stroke-dasharray="7 4"/><text x="690" y="162" font-size="12" font-weight="700" fill="#a3283f" text-anchor="end">24 GB GPU</text><line x1="60" y1="296" x2="690" y2="296" stroke="#6b5f4d" stroke-width="1.6"/><rect x="120" y="221.333" width="80" height="74.6667" rx="2" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.3"/><rect x="120" y="216" width="80" height="5.33333" rx="2" fill="#f3ecdc" stroke="#8d8068" stroke-width="1.3"/><rect x="120" y="213.867" width="80" height="2.13333" rx="2" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.3"/><text x="160" y="205.867" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">15.4 GB</text><text x="160" y="314" font-size="12.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">batch 1</text><rect x="250" y="221.333" width="80" height="74.6667" rx="2" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.3"/><rect x="250" y="216" width="80" height="5.33333" rx="2" fill="#f3ecdc" stroke="#8d8068" stroke-width="1.3"/><rect x="250" y="198.933" width="80" height="17.0667" rx="2" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.3"/><text x="290" y="190.933" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">18.2 GB</text><text x="290" y="314" font-size="12.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">batch 8</text><rect x="380" y="221.333" width="80" height="74.6667" rx="2" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.3"/><rect x="380" y="216" width="80" height="5.33333" rx="2" fill="#f3ecdc" stroke="#8d8068" stroke-width="1.3"/><rect x="380" y="147.733" width="80" height="68.2667" rx="2" fill="#f6ecd6" stroke="#a3283f" stroke-width="1.8"/><text x="420" y="139.733" font-size="12.5" font-weight="700" fill="#a3283f" text-anchor="middle">27.8 GB</text><text x="420" y="314" font-size="12.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">batch 32</text><rect x="510" y="221.333" width="80" height="74.6667" rx="2" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.3"/><rect x="510" y="216" width="80" height="5.33333" rx="2" fill="#f3ecdc" stroke="#8d8068" stroke-width="1.3"/><rect x="510" y="79.4667" width="80" height="136.533" rx="2" fill="#f6ecd6" stroke="#a3283f" stroke-width="1.8"/><text x="550" y="71.4667" font-size="12.5" font-weight="700" fill="#a3283f" text-anchor="middle">40.6 GB</text><text x="550" y="314" font-size="12.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">batch 64</text><rect x="120" y="326" width="14" height="14" rx="2" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><text x="140" y="338" font-size="12" font-weight="400" fill="#3a3226" text-anchor="start">weights (fixed)</text><rect x="270" y="326" width="14" height="14" rx="2" fill="#f3ecdc" stroke="#8d8068" stroke-width="1.2"/><text x="290" y="338" font-size="12" font-weight="400" fill="#3a3226" text-anchor="start">CUDA context + overhead (fixed)</text><rect x="500" y="326" width="14" height="14" rx="2" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.2"/><text x="520" y="338" font-size="12" font-weight="400" fill="#3a3226" text-anchor="start">inputs + activations (× B)</text><text x="360" y="362" font-size="12.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">Total ≈ parameters + overhead + B × (input + activations per sample)</text></svg>

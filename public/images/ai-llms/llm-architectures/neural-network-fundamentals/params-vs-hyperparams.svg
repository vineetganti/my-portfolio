<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Trainable parameters versus hyperparameters</title><desc>Hyperparameters such as layer sizes, learning rate, activation function, dropout rate and batch size are chosen by the designer and stay fixed during a run. Trainable parameters, the weights and biases, are updated by the optimizer using gradients computed from the data.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker></defs><rect width="720" height="290" fill="#ffffff"/><rect x="10" y="10" width="330" height="270" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="175" y="34" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Hyperparameters</text><text x="175" y="51" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">constants you choose</text><rect x="30" y="62" width="290" height="30" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><text x="175" y="80.75" font-size="12.5" font-weight="400" fill="#3a3226" text-anchor="middle">layer sizes, number of layers</text><rect x="30" y="100" width="290" height="30" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><text x="175" y="118.75" font-size="12.5" font-weight="400" fill="#3a3226" text-anchor="middle">activation function</text><rect x="30" y="138" width="290" height="30" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><text x="175" y="156.75" font-size="12.5" font-weight="400" fill="#3a3226" text-anchor="middle">learning rate, batch size</text><rect x="30" y="176" width="290" height="30" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><text x="175" y="194.75" font-size="12.5" font-weight="400" fill="#3a3226" text-anchor="middle">dropout rate p</text><rect x="30" y="214" width="290" height="30" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><text x="175" y="232.75" font-size="12.5" font-weight="400" fill="#3a3226" text-anchor="middle">optimizer type (AdamW …)</text><rect x="380" y="10" width="330" height="270" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="545" y="34" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Trainable parameters</text><text x="545" y="51" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">learned from data</text><rect x="400" y="62" width="290" height="40" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.4"/><text x="545" y="85.9" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">weights W of every layer</text><rect x="400" y="108" width="290" height="40" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.4"/><text x="545" y="131.9" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">biases b of every layer</text><rect x="400" y="154" width="290" height="40" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.4"/><text x="545" y="177.9" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">embeddings, norm scales γ, β</text><text x="545" y="224" font-size="12.5" font-weight="700" fill="#8a5a00" text-anchor="middle">gradient descent updates them</text><text x="545" y="244" font-size="12.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">every step: θ ← θ − lr · update</text><line x1="342" y1="130" x2="378" y2="130" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><text x="360" y="120" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">shape</text><text x="360" y="152" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">the</text><text x="360" y="164" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">model</text></svg>

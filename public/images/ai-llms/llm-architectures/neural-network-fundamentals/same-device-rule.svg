<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Tensors in one operation must live on the same device</title><desc>Left: multiplying a CPU tensor by a GPU tensor raises a RuntimeError. Right: after moving both the model and the input to cuda, the operation runs on the GPU.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="290" fill="#fffdf8"/><rect x="10" y="10" width="340" height="270" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="180" y="34" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Mixed devices: error</text><rect x="30" y="62" width="130" height="44" rx="8" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="95" y="79.45" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">x</text><text x="95" y="96.35" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">cpu</text><rect x="200" y="62" width="130" height="44" rx="8" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="265" y="79.45" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">W</text><text x="265" y="96.35" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">cuda:0</text><text x="180" y="90" font-size="18" font-weight="700" fill="#2f281e" text-anchor="middle">@</text><line x1="95" y1="108" x2="180" y2="150" stroke="#b0273f" stroke-width="1.8"/><line x1="265" y1="108" x2="180" y2="150" stroke="#b0273f" stroke-width="1.8"/><rect x="80" y="150" width="200" height="44" rx="8" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="180" y="176.2" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">x @ W</text><text x="180" y="226" font-size="12" font-weight="700" fill="#b0273f" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">RuntimeError: Expected all tensors</text><text x="180" y="244" font-size="12" font-weight="700" fill="#b0273f" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">to be on the same device</text><rect x="370" y="10" width="340" height="270" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="540" y="34" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Same device: runs on the GPU</text><rect x="390" y="62" width="130" height="44" rx="8" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="455" y="79.625" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">x.to('cuda')</text><text x="455" y="95.875" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">cuda:0</text><rect x="560" y="62" width="130" height="44" rx="8" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="625" y="79.45" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">W</text><text x="625" y="96.35" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">cuda:0</text><text x="540" y="90" font-size="18" font-weight="700" fill="#2f281e" text-anchor="middle">@</text><line x1="455" y1="108" x2="520" y2="148" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><line x1="625" y1="108" x2="560" y2="148" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="440" y="150" width="200" height="44" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="540" y="176.2" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">y  (cuda:0)</text><text x="540" y="226" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">model.to('cuda')</text><text x="540" y="244" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">x = x.to('cuda')</text><text x="540" y="266" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">move both, once, before computing</text></svg>

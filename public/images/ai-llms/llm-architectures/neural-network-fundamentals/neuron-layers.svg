<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>A neuron and a layered network</title><desc>Left: one neuron multiplies each input by a weight, adds a bias, sums, and applies an activation function. Right: neurons are arranged in an input layer of four, a hidden layer of five and an output layer of two, fully connected, which gives 37 parameters.</desc><defs><marker id="ah-7d8257" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8d8068"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a00"/></marker><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker></defs><rect width="720" height="340" fill="#ffffff"/><rect x="10" y="10" width="340" height="320" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="180" y="34" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">One neuron</text><text x="180" y="51" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">a weighted sum, then an activation</text><circle cx="46" cy="110" r="15" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.4"/><text x="46" y="115" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">x₁</text><line x1="62" y1="110" x2="170" y2="156" stroke="#8d8068" stroke-width="1.6" marker-end="url(#ah-7d8257)"/><text x="112" y="132" font-size="12.5" font-weight="700" fill="#8a5a00" text-anchor="middle">w₁</text><circle cx="46" cy="170" r="15" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.4"/><text x="46" y="175" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">x₂</text><line x1="62" y1="170" x2="170" y2="170" stroke="#8d8068" stroke-width="1.6" marker-end="url(#ah-7d8257)"/><text x="112" y="164" font-size="12.5" font-weight="700" fill="#8a5a00" text-anchor="middle">w₂</text><circle cx="46" cy="230" r="15" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.4"/><text x="46" y="235" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">x₃</text><line x1="62" y1="230" x2="170" y2="184" stroke="#8d8068" stroke-width="1.6" marker-end="url(#ah-7d8257)"/><text x="112" y="214" font-size="12.5" font-weight="700" fill="#8a5a00" text-anchor="middle">w₃</text><circle cx="188" cy="170" r="20" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.8"/><text x="188" y="176" font-size="20" font-weight="700" fill="#3a3226" text-anchor="middle">Σ</text><line x1="188" y1="100" x2="188" y2="148" stroke="#8a5a00" stroke-width="1.6" marker-end="url(#ah-8a5a00)"/><text x="188" y="92" font-size="12.5" font-weight="700" fill="#8a5a00" text-anchor="middle">bias b</text><line x1="210" y1="170" x2="232" y2="170" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="234" y="150" width="44" height="40" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.5"/><text x="256" y="174.8" font-size="16" font-weight="700" fill="#3a3226" text-anchor="middle">f</text><line x1="280" y1="170" x2="306" y2="170" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><text x="322" y="175" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">a</text><text x="180" y="272" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">a = f( w₁x₁ + w₂x₂ + w₃x₃ + b )</text><text x="180" y="296" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">f: ReLU, GELU, sigmoid … gives non-linearity</text><rect x="365" y="10" width="345" height="320" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="537.5" y="34" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">A network of neurons</text><text x="537.5" y="51" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">every neuron feeds every neuron in the next layer</text><line x1="412" y1="113" x2="537" y2="94" stroke="#ddd0b4" stroke-width="1.0"/><line x1="412" y1="113" x2="537" y2="132" stroke="#ddd0b4" stroke-width="1.0"/><line x1="412" y1="113" x2="537" y2="170" stroke="#ddd0b4" stroke-width="1.0"/><line x1="412" y1="113" x2="537" y2="208" stroke="#ddd0b4" stroke-width="1.0"/><line x1="412" y1="113" x2="537" y2="246" stroke="#ddd0b4" stroke-width="1.0"/><line x1="412" y1="151" x2="537" y2="94" stroke="#ddd0b4" stroke-width="1.0"/><line x1="412" y1="151" x2="537" y2="132" stroke="#ddd0b4" stroke-width="1.0"/><line x1="412" y1="151" x2="537" y2="170" stroke="#ddd0b4" stroke-width="1.0"/><line x1="412" y1="151" x2="537" y2="208" stroke="#ddd0b4" stroke-width="1.0"/><line x1="412" y1="151" x2="537" y2="246" stroke="#ddd0b4" stroke-width="1.0"/><line x1="412" y1="189" x2="537" y2="94" stroke="#ddd0b4" stroke-width="1.0"/><line x1="412" y1="189" x2="537" y2="132" stroke="#ddd0b4" stroke-width="1.0"/><line x1="412" y1="189" x2="537" y2="170" stroke="#ddd0b4" stroke-width="1.0"/><line x1="412" y1="189" x2="537" y2="208" stroke="#ddd0b4" stroke-width="1.0"/><line x1="412" y1="189" x2="537" y2="246" stroke="#ddd0b4" stroke-width="1.0"/><line x1="412" y1="227" x2="537" y2="94" stroke="#ddd0b4" stroke-width="1.0"/><line x1="412" y1="227" x2="537" y2="132" stroke="#ddd0b4" stroke-width="1.0"/><line x1="412" y1="227" x2="537" y2="170" stroke="#ddd0b4" stroke-width="1.0"/><line x1="412" y1="227" x2="537" y2="208" stroke="#ddd0b4" stroke-width="1.0"/><line x1="412" y1="227" x2="537" y2="246" stroke="#ddd0b4" stroke-width="1.0"/><line x1="537" y1="94" x2="662" y2="151" stroke="#ddd0b4" stroke-width="1.0"/><line x1="537" y1="94" x2="662" y2="189" stroke="#ddd0b4" stroke-width="1.0"/><line x1="537" y1="132" x2="662" y2="151" stroke="#ddd0b4" stroke-width="1.0"/><line x1="537" y1="132" x2="662" y2="189" stroke="#ddd0b4" stroke-width="1.0"/><line x1="537" y1="170" x2="662" y2="151" stroke="#ddd0b4" stroke-width="1.0"/><line x1="537" y1="170" x2="662" y2="189" stroke="#ddd0b4" stroke-width="1.0"/><line x1="537" y1="208" x2="662" y2="151" stroke="#ddd0b4" stroke-width="1.0"/><line x1="537" y1="208" x2="662" y2="189" stroke="#ddd0b4" stroke-width="1.0"/><line x1="537" y1="246" x2="662" y2="151" stroke="#ddd0b4" stroke-width="1.0"/><line x1="537" y1="246" x2="662" y2="189" stroke="#ddd0b4" stroke-width="1.0"/><circle cx="412" cy="113" r="12" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.4"/><circle cx="412" cy="151" r="12" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.4"/><circle cx="412" cy="189" r="12" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.4"/><circle cx="412" cy="227" r="12" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.4"/><text x="412" y="268" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">input layer</text><circle cx="537" cy="94" r="12" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.4"/><circle cx="537" cy="132" r="12" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.4"/><circle cx="537" cy="170" r="12" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.4"/><circle cx="537" cy="208" r="12" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.4"/><circle cx="537" cy="246" r="12" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.4"/><text x="537" y="268" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">hidden layer</text><circle cx="662" cy="151" r="12" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.4"/><circle cx="662" cy="189" r="12" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.4"/><text x="662" y="268" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">output layer</text><text x="537" y="292" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">parameters: (4×5 + 5) + (5×2 + 2) = 37</text><text x="537" y="312" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">weights W and biases b of every layer</text></svg>

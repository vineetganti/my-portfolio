<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" width="720" height="352" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Strides: how a tensor maps onto flat memory</title><desc>A 2 by 3 tensor is stored row by row in one flat block. Transposing it only changes the strides, so the same memory is read in a different order and the tensor is no longer contiguous. Calling contiguous copies the data into a new row-major block.</desc><defs></defs><rect width="720" height="352" fill="#fffdf8"/><text x="20" y="24" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">x  ·  shape (2, 3)  ·  strides (3, 1)  ·  contiguous</text><rect x="20" y="36" width="26" height="26" rx="3" fill="#fde3ad" stroke="#9a5400" stroke-width="1.2"/><text x="33.0" y="53.16" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">1</text><rect x="46" y="36" width="26" height="26" rx="3" fill="#fde3ad" stroke="#9a5400" stroke-width="1.2"/><text x="59.0" y="53.16" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">2</text><rect x="72" y="36" width="26" height="26" rx="3" fill="#fde3ad" stroke="#9a5400" stroke-width="1.2"/><text x="85.0" y="53.16" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">3</text><rect x="20" y="62" width="26" height="26" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="33.0" y="79.16" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">4</text><rect x="46" y="62" width="26" height="26" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="59.0" y="79.16" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">5</text><rect x="72" y="62" width="26" height="26" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="85.0" y="79.16" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">6</text><text x="300" y="50" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start" font-style="italic">memory (one flat block)</text><rect x="300" y="56" width="64" height="36" rx="4" fill="#fde3ad" stroke="#9a5400" stroke-width="1.2"/><text x="332" y="80" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">1</text><text x="332" y="106" font-size="10" font-weight="400" fill="#7a6d57" text-anchor="middle">offset 0</text><rect x="364" y="56" width="64" height="36" rx="4" fill="#fde3ad" stroke="#9a5400" stroke-width="1.2"/><text x="396" y="80" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">2</text><text x="396" y="106" font-size="10" font-weight="400" fill="#7a6d57" text-anchor="middle">offset 1</text><rect x="428" y="56" width="64" height="36" rx="4" fill="#fde3ad" stroke="#9a5400" stroke-width="1.2"/><text x="460" y="80" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">3</text><text x="460" y="106" font-size="10" font-weight="400" fill="#7a6d57" text-anchor="middle">offset 2</text><rect x="492" y="56" width="64" height="36" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="524" y="80" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">4</text><text x="524" y="106" font-size="10" font-weight="400" fill="#7a6d57" text-anchor="middle">offset 3</text><rect x="556" y="56" width="64" height="36" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="588" y="80" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">5</text><text x="588" y="106" font-size="10" font-weight="400" fill="#7a6d57" text-anchor="middle">offset 4</text><rect x="620" y="56" width="64" height="36" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="652" y="80" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">6</text><text x="652" y="106" font-size="10" font-weight="400" fill="#7a6d57" text-anchor="middle">offset 5</text><text x="300" y="120" font-size="12" font-weight="400" fill="#5e5241" text-anchor="start" font-style="italic">row-major: the last dimension is contiguous</text><text x="20" y="136" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">x.T  ·  shape (3, 2)  ·  strides (1, 3)  ·  not contiguous</text><rect x="20" y="148" width="26" height="26" rx="3" fill="#fde3ad" stroke="#9a5400" stroke-width="1.2"/><text x="33.0" y="165.16" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">1</text><rect x="46" y="148" width="26" height="26" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="59.0" y="165.16" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">4</text><rect x="20" y="174" width="26" height="26" rx="3" fill="#fde3ad" stroke="#9a5400" stroke-width="1.2"/><text x="33.0" y="191.16" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">2</text><rect x="46" y="174" width="26" height="26" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="59.0" y="191.16" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">5</text><rect x="20" y="200" width="26" height="26" rx="3" fill="#fde3ad" stroke="#9a5400" stroke-width="1.2"/><text x="33.0" y="217.16" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">3</text><rect x="46" y="200" width="26" height="26" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="59.0" y="217.16" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">6</text><text x="300" y="162" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start" font-style="italic">memory (one flat block)</text><rect x="300" y="168" width="64" height="36" rx="4" fill="#fde3ad" stroke="#9a5400" stroke-width="1.2"/><text x="332" y="192" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">1</text><text x="332" y="218" font-size="10" font-weight="400" fill="#7a6d57" text-anchor="middle">offset 0</text><rect x="364" y="168" width="64" height="36" rx="4" fill="#fde3ad" stroke="#9a5400" stroke-width="1.2"/><text x="396" y="192" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">2</text><text x="396" y="218" font-size="10" font-weight="400" fill="#7a6d57" text-anchor="middle">offset 1</text><rect x="428" y="168" width="64" height="36" rx="4" fill="#fde3ad" stroke="#9a5400" stroke-width="1.2"/><text x="460" y="192" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">3</text><text x="460" y="218" font-size="10" font-weight="400" fill="#7a6d57" text-anchor="middle">offset 2</text><rect x="492" y="168" width="64" height="36" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="524" y="192" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">4</text><text x="524" y="218" font-size="10" font-weight="400" fill="#7a6d57" text-anchor="middle">offset 3</text><rect x="556" y="168" width="64" height="36" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="588" y="192" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">5</text><text x="588" y="218" font-size="10" font-weight="400" fill="#7a6d57" text-anchor="middle">offset 4</text><rect x="620" y="168" width="64" height="36" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="652" y="192" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">6</text><text x="652" y="218" font-size="10" font-weight="400" fill="#7a6d57" text-anchor="middle">offset 5</text><text x="300" y="232" font-size="12" font-weight="400" fill="#5e5241" text-anchor="start" font-style="italic">no data moved: only the strides changed</text><text x="20" y="248" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">x.T.contiguous()  ·  shape (3, 2)  ·  strides (2, 1)</text><rect x="20" y="260" width="26" height="26" rx="3" fill="#fde3ad" stroke="#9a5400" stroke-width="1.2"/><text x="33.0" y="277.16" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">1</text><rect x="46" y="260" width="26" height="26" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="59.0" y="277.16" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">4</text><rect x="20" y="286" width="26" height="26" rx="3" fill="#fde3ad" stroke="#9a5400" stroke-width="1.2"/><text x="33.0" y="303.16" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">2</text><rect x="46" y="286" width="26" height="26" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="59.0" y="303.16" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">5</text><rect x="20" y="312" width="26" height="26" rx="3" fill="#fde3ad" stroke="#9a5400" stroke-width="1.2"/><text x="33.0" y="329.16" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">3</text><rect x="46" y="312" width="26" height="26" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="59.0" y="329.16" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">6</text><text x="300" y="274" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start" font-style="italic">memory (one flat block)</text><rect x="300" y="280" width="64" height="36" rx="4" fill="#fde3ad" stroke="#9a5400" stroke-width="1.2"/><text x="332" y="304" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">1</text><text x="332" y="330" font-size="10" font-weight="400" fill="#7a6d57" text-anchor="middle">offset 0</text><rect x="364" y="280" width="64" height="36" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="396" y="304" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">4</text><text x="396" y="330" font-size="10" font-weight="400" fill="#7a6d57" text-anchor="middle">offset 1</text><rect x="428" y="280" width="64" height="36" rx="4" fill="#fde3ad" stroke="#9a5400" stroke-width="1.2"/><text x="460" y="304" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">2</text><text x="460" y="330" font-size="10" font-weight="400" fill="#7a6d57" text-anchor="middle">offset 2</text><rect x="492" y="280" width="64" height="36" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="524" y="304" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">5</text><text x="524" y="330" font-size="10" font-weight="400" fill="#7a6d57" text-anchor="middle">offset 3</text><rect x="556" y="280" width="64" height="36" rx="4" fill="#fde3ad" stroke="#9a5400" stroke-width="1.2"/><text x="588" y="304" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">3</text><text x="588" y="330" font-size="10" font-weight="400" fill="#7a6d57" text-anchor="middle">offset 4</text><rect x="620" y="280" width="64" height="36" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="652" y="304" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">6</text><text x="652" y="330" font-size="10" font-weight="400" fill="#7a6d57" text-anchor="middle">offset 5</text><text x="300" y="344" font-size="12" font-weight="400" fill="#5e5241" text-anchor="start" font-style="italic">a copy: the data is physically rearranged</text></svg>

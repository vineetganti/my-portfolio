<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 296" width="720" height="296" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>VRAM fragmentation</title><desc>A row of GPU memory blocks has eight free blocks, but they are scattered in runs of at most two, so a request for four contiguous blocks fails even though enough total memory is free.</desc><defs></defs><rect width="720" height="296" fill="#ffffff"/><text x="40" y="38" font-size="14" font-weight="700" fill="#3a3226" text-anchor="start">GPU memory as a row of blocks</text><rect x="40" y="56" width="32" height="50" rx="3" fill="#e3d9c2" stroke="#6b5f4d" stroke-width="1.2"/><rect x="72" y="56" width="32" height="50" rx="3" fill="#e3d9c2" stroke="#6b5f4d" stroke-width="1.2"/><rect x="104" y="56" width="32" height="50" rx="3" fill="#ffffff" stroke="#8d8068" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="136" y="56" width="32" height="50" rx="3" fill="#e3d9c2" stroke="#6b5f4d" stroke-width="1.2"/><rect x="168" y="56" width="32" height="50" rx="3" fill="#e3d9c2" stroke="#6b5f4d" stroke-width="1.2"/><rect x="200" y="56" width="32" height="50" rx="3" fill="#ffffff" stroke="#8d8068" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="232" y="56" width="32" height="50" rx="3" fill="#ffffff" stroke="#8d8068" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="264" y="56" width="32" height="50" rx="3" fill="#e3d9c2" stroke="#6b5f4d" stroke-width="1.2"/><rect x="296" y="56" width="32" height="50" rx="3" fill="#ffffff" stroke="#8d8068" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="328" y="56" width="32" height="50" rx="3" fill="#e3d9c2" stroke="#6b5f4d" stroke-width="1.2"/><rect x="360" y="56" width="32" height="50" rx="3" fill="#e3d9c2" stroke="#6b5f4d" stroke-width="1.2"/><rect x="392" y="56" width="32" height="50" rx="3" fill="#e3d9c2" stroke="#6b5f4d" stroke-width="1.2"/><rect x="424" y="56" width="32" height="50" rx="3" fill="#ffffff" stroke="#8d8068" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="456" y="56" width="32" height="50" rx="3" fill="#e3d9c2" stroke="#6b5f4d" stroke-width="1.2"/><rect x="488" y="56" width="32" height="50" rx="3" fill="#ffffff" stroke="#8d8068" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="520" y="56" width="32" height="50" rx="3" fill="#ffffff" stroke="#8d8068" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="552" y="56" width="32" height="50" rx="3" fill="#e3d9c2" stroke="#6b5f4d" stroke-width="1.2"/><rect x="584" y="56" width="32" height="50" rx="3" fill="#e3d9c2" stroke="#6b5f4d" stroke-width="1.2"/><rect x="616" y="56" width="32" height="50" rx="3" fill="#ffffff" stroke="#8d8068" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="648" y="56" width="32" height="50" rx="3" fill="#e3d9c2" stroke="#6b5f4d" stroke-width="1.2"/><rect x="40" y="120" width="14" height="14" rx="2" fill="#e3d9c2" stroke="#6b5f4d" stroke-width="1"/><text x="62" y="131" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="start">allocated</text><rect x="150" y="120" width="14" height="14" rx="2" fill="#ffffff" stroke="#8d8068" stroke-width="1" stroke-dasharray="3 2"/><text x="172" y="131" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="start">free</text><text x="40" y="168" font-size="13" font-weight="400" fill="#3a3226" text-anchor="start">8 free blocks, but in 6 scattered runs: the longest run is 2.</text><rect x="40" y="190" width="128" height="50" rx="6" fill="#f7e0da" stroke="#a3283f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="104" y="213" font-size="12.5" font-weight="700" fill="#a3283f" text-anchor="middle">needs 4 blocks</text><text x="104" y="229" font-size="12.5" font-weight="700" fill="#a3283f" text-anchor="middle">in a row</text><line x1="176" y1="215" x2="206" y2="215" stroke="#a3283f" stroke-width="2"/><text x="216" y="211" font-size="13" font-weight="700" fill="#a3283f" text-anchor="start">✕  allocation fails with an out-of-memory error,</text><text x="216" y="229" font-size="13" font-weight="700" fill="#a3283f" text-anchor="start">though total free memory is enough</text><text x="360" y="278" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">Allocators rarely compact memory in real time, so the scattered gaps persist.</text></svg>

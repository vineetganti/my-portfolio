<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452" width="720" height="452" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>AdamW state and bytes per parameter</title><desc>For every parameter tensor, AdamW keeps a first-moment tensor and a second-moment tensor of the same shape. Per parameter, FP32 training needs 4 plus 4 plus 8, 16 bytes, mixed-precision training needs 2 plus 2 plus 4 plus 4 plus 4, also 16 bytes, while inference in FP16 needs 2 bytes.</desc><defs></defs><rect width="720" height="452" fill="#fffdf8"/><rect x="10" y="10" width="700" height="176" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="34" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Three tensors of the same shape per parameter</text><rect x="40" y="64" width="22" height="22" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="62" y="64" width="22" height="22" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="84" y="64" width="22" height="22" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="106" y="64" width="22" height="22" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="40" y="86" width="22" height="22" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="62" y="86" width="22" height="22" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="84" y="86" width="22" height="22" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="106" y="86" width="22" height="22" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="40" y="108" width="22" height="22" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="62" y="108" width="22" height="22" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="84" y="108" width="22" height="22" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="106" y="108" width="22" height="22" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><text x="140" y="92" font-size="20" font-weight="700" fill="#2f281e" text-anchor="start">θ</text><rect x="270" y="64" width="22" height="22" rx="0" fill="#fdf0d4" stroke="#9a5400" stroke-width="1"/><rect x="292" y="64" width="22" height="22" rx="0" fill="#fdf0d4" stroke="#9a5400" stroke-width="1"/><rect x="314" y="64" width="22" height="22" rx="0" fill="#fdf0d4" stroke="#9a5400" stroke-width="1"/><rect x="336" y="64" width="22" height="22" rx="0" fill="#fdf0d4" stroke="#9a5400" stroke-width="1"/><rect x="270" y="86" width="22" height="22" rx="0" fill="#fdf0d4" stroke="#9a5400" stroke-width="1"/><rect x="292" y="86" width="22" height="22" rx="0" fill="#fdf0d4" stroke="#9a5400" stroke-width="1"/><rect x="314" y="86" width="22" height="22" rx="0" fill="#fdf0d4" stroke="#9a5400" stroke-width="1"/><rect x="336" y="86" width="22" height="22" rx="0" fill="#fdf0d4" stroke="#9a5400" stroke-width="1"/><rect x="270" y="108" width="22" height="22" rx="0" fill="#fdf0d4" stroke="#9a5400" stroke-width="1"/><rect x="292" y="108" width="22" height="22" rx="0" fill="#fdf0d4" stroke="#9a5400" stroke-width="1"/><rect x="314" y="108" width="22" height="22" rx="0" fill="#fdf0d4" stroke="#9a5400" stroke-width="1"/><rect x="336" y="108" width="22" height="22" rx="0" fill="#fdf0d4" stroke="#9a5400" stroke-width="1"/><text x="370" y="92" font-size="20" font-weight="700" fill="#2f281e" text-anchor="start">m</text><rect x="500" y="64" width="22" height="22" rx="0" fill="#fdf0d4" stroke="#9a5400" stroke-width="1"/><rect x="522" y="64" width="22" height="22" rx="0" fill="#fdf0d4" stroke="#9a5400" stroke-width="1"/><rect x="544" y="64" width="22" height="22" rx="0" fill="#fdf0d4" stroke="#9a5400" stroke-width="1"/><rect x="566" y="64" width="22" height="22" rx="0" fill="#fdf0d4" stroke="#9a5400" stroke-width="1"/><rect x="500" y="86" width="22" height="22" rx="0" fill="#fdf0d4" stroke="#9a5400" stroke-width="1"/><rect x="522" y="86" width="22" height="22" rx="0" fill="#fdf0d4" stroke="#9a5400" stroke-width="1"/><rect x="544" y="86" width="22" height="22" rx="0" fill="#fdf0d4" stroke="#9a5400" stroke-width="1"/><rect x="566" y="86" width="22" height="22" rx="0" fill="#fdf0d4" stroke="#9a5400" stroke-width="1"/><rect x="500" y="108" width="22" height="22" rx="0" fill="#fdf0d4" stroke="#9a5400" stroke-width="1"/><rect x="522" y="108" width="22" height="22" rx="0" fill="#fdf0d4" stroke="#9a5400" stroke-width="1"/><rect x="544" y="108" width="22" height="22" rx="0" fill="#fdf0d4" stroke="#9a5400" stroke-width="1"/><rect x="566" y="108" width="22" height="22" rx="0" fill="#fdf0d4" stroke="#9a5400" stroke-width="1"/><text x="600" y="92" font-size="20" font-weight="700" fill="#2f281e" text-anchor="start">v</text><text x="40" y="150" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">the weights</text><text x="270" y="143" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">first moment:</text><text x="270" y="158" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">average of gradients</text><text x="500" y="143" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">second moment:</text><text x="500" y="158" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">average of squared gradients</text><text x="370" y="178" font-size="12" font-weight="700" fill="#9a5400" text-anchor="middle">m and v have exactly the size of θ</text><text x="20" y="222" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Bytes per parameter</text><text x="20" y="260" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start">FP32 training</text><rect x="190" y="238" width="88" height="34" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.3"/><text x="234" y="260" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">w 4</text><rect x="278" y="238" width="88" height="34" rx="0" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.3"/><text x="322" y="260" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">grad 4</text><rect x="366" y="238" width="88" height="34" rx="0" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.3"/><text x="410" y="260" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">m 4</text><rect x="454" y="238" width="88" height="34" rx="0" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.3"/><text x="498" y="260" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">v 4</text><text x="554" y="260" font-size="12.5" font-weight="700" fill="#b0273f" text-anchor="start">16 B → 112 GB for 7B</text><text x="20" y="312" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start">mixed precision</text><rect x="190" y="290" width="44" height="34" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.3"/><text x="212" y="312" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">w 2</text><rect x="234" y="290" width="44" height="34" rx="0" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.3"/><text x="256" y="312" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">g 2</text><rect x="278" y="290" width="88" height="34" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.3"/><text x="322" y="312" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">master 4</text><rect x="366" y="290" width="88" height="34" rx="0" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.3"/><text x="410" y="312" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">m 4</text><rect x="454" y="290" width="88" height="34" rx="0" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.3"/><text x="498" y="312" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">v 4</text><text x="554" y="312" font-size="12.5" font-weight="700" fill="#b0273f" text-anchor="start">16 B → 112 GB for 7B</text><text x="20" y="364" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start">FP16 inference</text><rect x="190" y="342" width="44" height="34" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.3"/><text x="212" y="364" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">w 2</text><text x="246" y="364" font-size="12.5" font-weight="700" fill="#5e5241" text-anchor="start">2 B → 14 GB for 7B</text><text x="360" y="424" font-size="12.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">Optimizer state alone is 2× the FP32 weight size. With gradients it is 4×. Inference drops all of it.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" width="720" height="392" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>GPU memory hierarchy</title><desc>From fastest and smallest to slowest and largest: registers in each thread, shared memory or SRAM per streaming multiprocessor at about 19 terabytes per second in aggregate, a 40 megabyte L2 cache, HBM global memory of 40 to 80 gigabytes at 1.5 to 2 terabytes per second, and host RAM reached over PCIe at about 32 gigabytes per second. Figures are for an A100.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="392" fill="#fffdf8"/><text x="20" y="24" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Closer to the cores means faster and smaller (A100 figures)</text><rect x="285" y="48" width="150" height="50" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.6"/><text x="360" y="69" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Registers</text><text x="360" y="86" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle">~256 KB per SM</text><text x="447" y="78" font-size="12" font-weight="700" fill="#9a5400" text-anchor="start">fastest, private to a thread</text><rect x="230" y="110" width="260" height="50" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.6"/><text x="360" y="131" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Shared memory / SRAM</text><text x="360" y="148" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle">up to ~192 KB per SM</text><text x="502" y="140" font-size="12" font-weight="700" fill="#9a5400" text-anchor="start">~19 TB/s aggregate</text><rect x="175" y="172" width="370" height="50" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.6"/><text x="360" y="193" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">L2 cache</text><text x="360" y="210" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle">40 MB, shared by all SMs</text><text x="557" y="202" font-size="12" font-weight="700" fill="#9a5400" text-anchor="start">hardware managed</text><rect x="120" y="234" width="480" height="50" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.6"/><text x="360" y="255" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">HBM (global memory)</text><text x="360" y="272" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle">40–80 GB</text><text x="612" y="264" font-size="12" font-weight="700" fill="#9a5400" text-anchor="start">1.5–2 TB/s</text><rect x="65" y="296" width="590" height="50" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.6" stroke-dasharray="6 4"/><text x="360" y="317" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Host RAM over PCIe</text><text x="360" y="334" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle">system memory · ~32 GB/s over PCIe 4.0 x16</text><text x="651" y="362" font-size="1" font-weight="400" fill="#2f281e" text-anchor="middle"></text><line x1="36" y1="56" x2="36" y2="330" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><text transform="translate(24 193) rotate(90)" font-size="11.5" font-style="italic" fill="#5e5241" text-anchor="middle">faster, smaller  →  slower, larger</text><text x="360" y="376" font-size="12.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">Fast kernels (tiled matmul, FlashAttention) load data from HBM once, then reuse it from SRAM and registers.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" width="720" height="310" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Weight memory of a 7-billion-parameter model at different precisions</title><desc>A 7 billion parameter model needs 28 GB in FP32, 14 GB in FP16 or BF16, 7 GB in INT8 and 3.5 GB in INT4. A 24 GB GPU can hold the FP16, INT8 and INT4 versions but not the FP32 one.</desc><defs></defs><rect width="720" height="310" fill="#ffffff"/><text x="20" y="24" font-size="14" font-weight="700" fill="#2c361c" text-anchor="start">7B parameters × bytes per parameter</text><line x1="602" y1="40" x2="602" y2="252" stroke="#a3283f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="602" y="268" font-size="12" font-weight="700" fill="#a3283f" text-anchor="middle">24 GB GPU</text><text x="20" y="70" font-size="13" font-weight="700" fill="#2c361c" text-anchor="start">FP32</text><text x="20" y="86" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="start">4 bytes</text><rect x="170" y="52" width="504" height="34" rx="4" fill="#e9efcf" stroke="#a3283f" stroke-width="1.6"/><text x="684" y="75" font-size="13" font-weight="700" fill="#a3283f" text-anchor="start">28 GB  does not fit</text><text x="20" y="120" font-size="13" font-weight="700" fill="#2c361c" text-anchor="start">FP16 / BF16</text><text x="20" y="136" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="start">2 bytes</text><rect x="170" y="102" width="252" height="34" rx="4" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.6"/><text x="432" y="125" font-size="13" font-weight="700" fill="#2c361c" text-anchor="start">14 GB</text><text x="20" y="170" font-size="13" font-weight="700" fill="#2c361c" text-anchor="start">INT8</text><text x="20" y="186" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="start">1 byte</text><rect x="170" y="152" width="126" height="34" rx="4" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.6"/><text x="306" y="175" font-size="13" font-weight="700" fill="#2c361c" text-anchor="start">7 GB</text><text x="20" y="220" font-size="13" font-weight="700" fill="#2c361c" text-anchor="start">INT4</text><text x="20" y="236" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="start">½ byte</text><rect x="170" y="202" width="63" height="34" rx="4" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.6"/><text x="243" y="225" font-size="13" font-weight="700" fill="#2c361c" text-anchor="start">3.5 GB</text><text x="360" y="296" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">Weights only. Activations, the KV cache and framework overhead come on top of this.</text></svg>

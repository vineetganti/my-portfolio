<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>A Linear layer is a matrix multiplication</title><desc>The input matrix X, shaped batch by in_features, is multiplied by the transposed weight matrix, shaped in_features by out_features, and the bias row is added to give Y, shaped batch by out_features. Each output cell is a dot product of one input row and one weight column.</desc><defs></defs><rect width="720" height="360" fill="#ffffff"/><rect x="24" y="90" width="34" height="34" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><rect x="58" y="90" width="34" height="34" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><rect x="92" y="90" width="34" height="34" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><rect x="126" y="90" width="34" height="34" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><rect x="24" y="124" width="34" height="34" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><rect x="58" y="124" width="34" height="34" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><rect x="92" y="124" width="34" height="34" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><rect x="126" y="124" width="34" height="34" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><rect x="24" y="158" width="34" height="34" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><rect x="58" y="158" width="34" height="34" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><rect x="92" y="158" width="34" height="34" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><rect x="126" y="158" width="34" height="34" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="92" y="78" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">X</text><text x="92" y="210" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle">(batch 3, in 4)</text><text x="180" y="152" font-size="24" font-weight="700" fill="#2c361c" text-anchor="middle">·</text><rect x="206" y="56" width="34" height="34" rx="0" fill="#efefe0" stroke="#4f5d36" stroke-width="1.2"/><rect x="240" y="56" width="34" height="34" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><rect x="206" y="90" width="34" height="34" rx="0" fill="#efefe0" stroke="#4f5d36" stroke-width="1.2"/><rect x="240" y="90" width="34" height="34" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><rect x="206" y="124" width="34" height="34" rx="0" fill="#efefe0" stroke="#4f5d36" stroke-width="1.2"/><rect x="240" y="124" width="34" height="34" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><rect x="206" y="158" width="34" height="34" rx="0" fill="#efefe0" stroke="#4f5d36" stroke-width="1.2"/><rect x="240" y="158" width="34" height="34" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><text x="240" y="44" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">Wᵀ</text><text x="240" y="210" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle">(in 4, out 2)</text><text x="306" y="152" font-size="22" font-weight="700" fill="#2c361c" text-anchor="middle">+</text><rect x="326" y="135" width="34" height="34" rx="0" fill="#efefe0" stroke="#4f5d36" stroke-width="1.2"/><rect x="360" y="135" width="34" height="34" rx="0" fill="#efefe0" stroke="#4f5d36" stroke-width="1.2"/><text x="360" y="123" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">b</text><text x="360" y="187" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle">(out 2)</text><text x="424" y="152" font-size="24" font-weight="700" fill="#2c361c" text-anchor="middle">=</text><rect x="446" y="90" width="34" height="34" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><rect x="480" y="90" width="34" height="34" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><rect x="446" y="124" width="34" height="34" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><rect x="480" y="124" width="34" height="34" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="2"/><rect x="446" y="158" width="34" height="34" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><rect x="480" y="158" width="34" height="34" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="480" y="78" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">Y</text><text x="480" y="210" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle">(batch 3, out 2)</text><text x="480" y="156" font-size="1" font-weight="400" fill="#2c361c" text-anchor="middle"></text><rect x="560" y="80" width="144" height="150" rx="10" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.4"/><text x="632" y="104" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Y[i][j] =</text><text x="632" y="121" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">dot(X[i, :],</text><text x="632" y="138" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">      W[j, :]) + b[j]</text><text x="632" y="155" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"></text><text x="632" y="172" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">highlighted:</text><text x="632" y="189" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">row 2 of X with</text><text x="632" y="206" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">column 2 of Wᵀ</text><rect x="24" y="262" width="672" height="72" rx="12" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="360" y="293.1" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">Y = X · Wᵀ + b</text><text x="360" y="311.3" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">PyTorch stores W as (out_features, in_features), so the product uses its transpose</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 302" width="720" height="302" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Post 02 at a glance: a network, its memory and its kernels</title><desc>A map of post 02 in four columns. Building blocks: layers of neurons, weights and biases, non-linear activations, and the loss that training adds. Parameters: tensors on a device, bytes per element, one device per operation, and weight tying. On the GPU: a Linear layer is a tiled matmul, launch overhead, fusion and CUDA graphs, and the memory hierarchy. Memory: AdamW needs 16 bytes per parameter, FP16 inference 2, no_grad drops the graph, and fragmentation causes out-of-memory errors.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker></defs><rect width="720" height="302" fill="#ffffff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#3a3226" text-anchor="start">Post 02 at a glance: a network, its memory and its kernels</text><rect x="10" y="44" width="161.5" height="192" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="90.75" y="71" font-size="13.5" font-weight="700" fill="#3a3226" text-anchor="middle">Building blocks</text><rect x="20" y="88" width="141.5" height="28" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="90.75" y="106.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">layers of neurons</text><rect x="20" y="124" width="141.5" height="28" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="90.75" y="142.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">weights and biases</text><rect x="20" y="160" width="141.5" height="28" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="90.75" y="178.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">non-linear activations</text><rect x="20" y="196" width="141.5" height="28" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="90.75" y="214.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">training adds a loss</text><line x1="173.5" y1="66" x2="187.5" y2="66" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="189.5" y="44" width="161.5" height="192" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="270.25" y="71" font-size="13.5" font-weight="700" fill="#3a3226" text-anchor="middle">Parameters</text><rect x="199.5" y="88" width="141.5" height="28" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="270.25" y="106.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">tensors on a device</text><rect x="199.5" y="124" width="141.5" height="28" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="270.25" y="142.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">bytes = n × dtype size</text><rect x="199.5" y="160" width="141.5" height="28" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="270.25" y="178.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">one device per op</text><rect x="199.5" y="196" width="141.5" height="28" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="270.25" y="214.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">weight tying shares</text><line x1="353" y1="66" x2="367" y2="66" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="369" y="44" width="161.5" height="192" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="449.75" y="71" font-size="13.5" font-weight="700" fill="#3a3226" text-anchor="middle">On the GPU</text><rect x="379" y="88" width="141.5" height="28" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="449.75" y="106.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">Linear = tiled matmul</text><rect x="379" y="124" width="141.5" height="28" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="449.75" y="142.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">launch overhead</text><rect x="379" y="160" width="141.5" height="28" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="449.75" y="178.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">fusion, CUDA graphs</text><rect x="379" y="196" width="141.5" height="28" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="449.75" y="214.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">registers → HBM</text><line x1="532.5" y1="66" x2="546.5" y2="66" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="548.5" y="44" width="161.5" height="192" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="629.25" y="71" font-size="13.5" font-weight="700" fill="#3a3226" text-anchor="middle">Memory</text><rect x="558.5" y="88" width="141.5" height="28" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="629.25" y="106.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">AdamW: 16 B per param</text><rect x="558.5" y="124" width="141.5" height="28" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="629.25" y="142.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">inference: 2 B (FP16)</text><rect x="558.5" y="160" width="141.5" height="28" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="629.25" y="178.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">no_grad: no graph</text><rect x="558.5" y="196" width="141.5" height="28" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="629.25" y="214.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">fragmentation, OOM</text><rect x="10" y="252" width="700" height="36" rx="10" fill="#f6e9c8" stroke="#8a5a00" stroke-width="1.3"/><text x="360" y="275" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">Inference is just the forward pass: weights plus a small, batch-sized working set.</text></svg>

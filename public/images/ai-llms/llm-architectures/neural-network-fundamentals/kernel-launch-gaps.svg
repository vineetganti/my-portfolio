<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Kernel launch overhead</title><desc>Timeline of GPU activity. With three separate small kernels, short idle gaps appear between launches while the CPU submits the next kernel. A single fused kernel does the same work with no gaps and one launch.</desc><defs><marker id="ah-7d8257" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7a6d57"/></marker></defs><rect width="720" height="250" fill="#fffdf8"/><text x="20" y="26" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start">Three small kernels (GPU timeline)</text><rect x="20" y="44" width="130" height="44" rx="6" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><text x="85" y="71" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">matmul</text><rect x="200" y="44" width="90" height="44" rx="6" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><text x="245" y="71" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">+ bias</text><rect x="340" y="44" width="90" height="44" rx="6" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><text x="385" y="71" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">ReLU</text><rect x="150" y="44" width="50" height="44" rx="0" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.2" stroke-dasharray="3 3"/><text x="175" y="71" font-size="11.5" font-weight="700" fill="#b0273f" text-anchor="middle">idle</text><rect x="290" y="44" width="50" height="44" rx="0" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.2" stroke-dasharray="3 3"/><text x="315" y="71" font-size="11.5" font-weight="700" fill="#b0273f" text-anchor="middle">idle</text><text x="450" y="62" font-size="12.5" font-weight="700" fill="#b0273f" text-anchor="start">3 launches, 2 idle gaps,</text><text x="450" y="80" font-size="12.5" font-weight="700" fill="#b0273f" text-anchor="start">6 trips to global memory</text><text x="20" y="142" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start">One fused kernel</text><rect x="20" y="160" width="320" height="44" rx="6" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.6"/><text x="180" y="187" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">matmul + bias + ReLU</text><text x="360" y="178" font-size="12.5" font-weight="700" fill="#5e5241" text-anchor="start">1 launch, no gaps,</text><text x="360" y="196" font-size="12.5" font-weight="700" fill="#5e5241" text-anchor="start">2 trips to global memory</text><line x1="20" y1="226" x2="400" y2="226" stroke="#7a6d57" stroke-width="1.4" marker-end="url(#ah-7d8257)"/><text x="406" y="230" font-size="12" font-weight="400" fill="#5e5241" text-anchor="start" font-style="italic">time</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 378" width="720" height="378" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>How RNNs, CNNs and attention connect tokens</title><desc>An RNN passes information along the sequence one step at a time. A CNN layer connects each token only to its neighbours in a local window. Attention connects every token directly to every other token in a single step.</desc><defs><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a00"/></marker></defs><rect width="720" height="378" fill="#ffffff"/><rect x="10" y="8" width="700" height="116" rx="12" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="24" y="58" font-size="13.5" font-weight="700" fill="#2c361c" text-anchor="start">Recurrent (RNN)</text><text x="24" y="76" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="start" font-style="italic">one step at a time</text><rect x="10" y="130" width="700" height="116" rx="12" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="24" y="180" font-size="13.5" font-weight="700" fill="#2c361c" text-anchor="start">Convolutional (CNN)</text><text x="24" y="198" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="start" font-style="italic">a local window</text><rect x="10" y="252" width="700" height="116" rx="12" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="24" y="302" font-size="13.5" font-weight="700" fill="#2c361c" text-anchor="start">Attention</text><text x="24" y="320" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="start" font-style="italic">everything at once</text><line x1="184" y1="84" x2="256" y2="84" stroke="#8a5a00" stroke-width="2.2" marker-end="url(#ah-8a5a00)"/><line x1="284" y1="84" x2="356" y2="84" stroke="#8a5a00" stroke-width="2.2" marker-end="url(#ah-8a5a00)"/><line x1="384" y1="84" x2="456" y2="84" stroke="#8a5a00" stroke-width="2.2" marker-end="url(#ah-8a5a00)"/><line x1="484" y1="84" x2="556" y2="84" stroke="#8a5a00" stroke-width="2.2" marker-end="url(#ah-8a5a00)"/><line x1="584" y1="84" x2="656" y2="84" stroke="#8a5a00" stroke-width="2.2" marker-end="url(#ah-8a5a00)"/><circle cx="170" cy="84" r="12" fill="#ffffff" stroke="#4f5d36" stroke-width="1.6"/><text x="170" y="89" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">1</text><circle cx="270" cy="84" r="12" fill="#ffffff" stroke="#4f5d36" stroke-width="1.6"/><text x="270" y="89" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">2</text><circle cx="370" cy="84" r="12" fill="#ffffff" stroke="#4f5d36" stroke-width="1.6"/><text x="370" y="89" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">3</text><circle cx="470" cy="84" r="12" fill="#ffffff" stroke="#4f5d36" stroke-width="1.6"/><text x="470" y="89" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">4</text><circle cx="570" cy="84" r="12" fill="#ffffff" stroke="#4f5d36" stroke-width="1.6"/><text x="570" y="89" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">5</text><circle cx="670" cy="84" r="12" fill="#ffffff" stroke="#4f5d36" stroke-width="1.6"/><text x="670" y="89" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">6</text><text x="440" y="28" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">token 1's information reaches token 6 only after 5 steps</text><rect x="346" y="180" width="248" height="52" rx="12" fill="#f6ebc4" stroke="#8a5a00" stroke-width="1.3" stroke-dasharray="5 4" fill-opacity="0.5"/><path d="M470 194 Q 420 162 370 194" fill="none" stroke="#8a5a00" stroke-width="2.2"/><path d="M470 194 Q 520 162 570 194" fill="none" stroke="#8a5a00" stroke-width="2.2"/><circle cx="170" cy="206" r="12" fill="#ffffff" stroke="#4f5d36" stroke-width="1.6"/><text x="170" y="211" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">1</text><circle cx="270" cy="206" r="12" fill="#ffffff" stroke="#4f5d36" stroke-width="1.6"/><text x="270" y="211" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">2</text><circle cx="370" cy="206" r="12" fill="#ffffff" stroke="#4f5d36" stroke-width="1.6"/><text x="370" y="211" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">3</text><circle cx="470" cy="206" r="12" fill="#f6ebc4" stroke="#4f5d36" stroke-width="1.6"/><text x="470" y="211" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">4</text><circle cx="570" cy="206" r="12" fill="#ffffff" stroke="#4f5d36" stroke-width="1.6"/><text x="570" y="211" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">5</text><circle cx="670" cy="206" r="12" fill="#ffffff" stroke="#4f5d36" stroke-width="1.6"/><text x="670" y="211" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">6</text><text x="440" y="150" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">each layer sees only a window of neighbours; stack layers to see further</text><path d="M470 316 Q 320 244 170 316" fill="none" stroke="#8a5a00" stroke-width="1.8"/><path d="M470 316 Q 370 266 270 316" fill="none" stroke="#8a5a00" stroke-width="1.8"/><path d="M470 316 Q 420 288 370 316" fill="none" stroke="#8a5a00" stroke-width="1.8"/><path d="M470 316 Q 520 288 570 316" fill="none" stroke="#8a5a00" stroke-width="1.8"/><path d="M470 316 Q 570 266 670 316" fill="none" stroke="#8a5a00" stroke-width="1.8"/><circle cx="170" cy="328" r="12" fill="#ffffff" stroke="#4f5d36" stroke-width="1.6"/><text x="170" y="333" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">1</text><circle cx="270" cy="328" r="12" fill="#ffffff" stroke="#4f5d36" stroke-width="1.6"/><text x="270" y="333" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">2</text><circle cx="370" cy="328" r="12" fill="#ffffff" stroke="#4f5d36" stroke-width="1.6"/><text x="370" y="333" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">3</text><circle cx="470" cy="328" r="12" fill="#f6ebc4" stroke="#4f5d36" stroke-width="1.6"/><text x="470" y="333" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">4</text><circle cx="570" cy="328" r="12" fill="#ffffff" stroke="#4f5d36" stroke-width="1.6"/><text x="570" y="333" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">5</text><circle cx="670" cy="328" r="12" fill="#ffffff" stroke="#4f5d36" stroke-width="1.6"/><text x="670" y="333" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">6</text><text x="440" y="272" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">every token can look directly at every other token in one step</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 398" width="720" height="398" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Cross-attention in translation</title><desc>The encoder turns the English source sentence into contextual embeddings. At each step the decoder runs masked self-attention over the tokens so far, then cross-attention that takes queries from the decoder and keys and values from the encoder output, and predicts the next French token, which is fed back in.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a00"/></marker></defs><rect width="720" height="398" fill="#ffffff"/><rect x="20" y="20" width="210" height="56" rx="10" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.5"/><text x="125.0" y="41" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Source sentence</text><text x="125.0" y="59" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">“The cat sat on the mat.”</text><rect x="20" y="104" width="210" height="70" rx="10" fill="#f6ecd6" stroke="#6b5f4d" stroke-width="1.5"/><text x="125.0" y="125" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Encoder stack</text><text x="125.0" y="143" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">bidirectional self-attention</text><text x="125.0" y="157" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">in every block</text><rect x="20" y="202" width="210" height="70" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="125.0" y="223" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Encoder output</text><text x="125.0" y="241" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">one contextual embedding</text><text x="125.0" y="255" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">per source token</text><line x1="125" y1="78" x2="125" y2="102" stroke="#6b5f4d" stroke-width="2" marker-end="url(#ah-4f5d36)"/><line x1="125" y1="176" x2="125" y2="200" stroke="#6b5f4d" stroke-width="2" marker-end="url(#ah-4f5d36)"/><rect x="420" y="16" width="280" height="46" rx="10" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.4"/><text x="560" y="35" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">Decoder input</text><text x="560" y="52" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">[SOS] Le</text><line x1="560" y1="63" x2="560" y2="73" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="420" y="74" width="280" height="46" rx="10" fill="#f6e9c8" stroke="#8a5a00" stroke-width="1.4"/><text x="560" y="93" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">Masked self-attention</text><text x="560" y="110" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="middle">sees only the tokens so far</text><line x1="560" y1="121" x2="560" y2="131" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="420" y="132" width="280" height="46" rx="10" fill="#f6e9c8" stroke="#8a5a00" stroke-width="1.6"/><text x="560" y="151" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">Cross-attention</text><text x="560" y="168" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="middle">queries: decoder · keys, values: encoder</text><line x1="560" y1="179" x2="560" y2="189" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="420" y="190" width="280" height="46" rx="10" fill="#f6e9c8" stroke="#8a5a00" stroke-width="1.4"/><text x="560" y="209" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">Feed-forward network</text><text x="560" y="226" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="middle">per-position MLP</text><line x1="560" y1="237" x2="560" y2="247" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="420" y="248" width="280" height="46" rx="10" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.4"/><text x="560" y="267" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">Linear + softmax</text><text x="560" y="284" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="middle">probabilities over the French vocabulary</text><line x1="560" y1="295" x2="560" y2="305" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="420" y="306" width="280" height="46" rx="10" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.4"/><text x="560" y="325" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">Next token</text><text x="560" y="342" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="middle">“chat”, the highest probability</text><path d="M232 240 C330 240, 330 155, 418 155" fill="none" stroke="#8a5a00" stroke-width="2.2" marker-end="url(#ah-8a5a00)"/><text x="322" y="186" font-size="12" font-weight="700" fill="#8a5a00" text-anchor="end">keys and values</text><path d="M702 329 L714 329 L714 39 L702 39" fill="none" stroke="#6b5f4d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah-4f5d36)"/><text x="360" y="380" font-size="12.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">The new token is fed back in, and the loop repeats until the decoder emits [EOS].</text></svg>

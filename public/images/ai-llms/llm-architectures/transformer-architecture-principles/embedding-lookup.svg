<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Embedding lookup: token ids select rows of a matrix</title><desc>The embedding matrix E has one row of D numbers for each of V vocabulary entries. The token ids 15, 2201 and 7 select rows 15, 2201 and 7, which are stacked into a 3 by D tensor that enters the Transformer.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d36"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a00"/></marker><marker id="ah-a3283f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a3283f"/></marker></defs><rect width="720" height="330" fill="#ffffff"/><rect x="20" y="110" width="130" height="80" rx="10" fill="#ffffff" stroke="#4f5d36" stroke-width="1.5"/><text x="85" y="145.45" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">token ids</text><text x="85" y="162.35" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">[15, 2201, 7]</text><text x="300" y="26" font-size="14" font-weight="700" fill="#8a5a00" text-anchor="middle">E   (V × D)</text><rect x="230" y="36" width="140" height="258" rx="6" fill="#efefe0" stroke="#7d8257" stroke-width="1.6"/><line x1="230" y1="57.5" x2="370" y2="57.5" stroke="#c9bb7a" stroke-width="0.7"/><line x1="230" y1="79" x2="370" y2="79" stroke="#c9bb7a" stroke-width="0.7"/><line x1="230" y1="100.5" x2="370" y2="100.5" stroke="#c9bb7a" stroke-width="0.7"/><line x1="230" y1="122" x2="370" y2="122" stroke="#c9bb7a" stroke-width="0.7"/><line x1="230" y1="143.5" x2="370" y2="143.5" stroke="#c9bb7a" stroke-width="0.7"/><line x1="230" y1="165" x2="370" y2="165" stroke="#c9bb7a" stroke-width="0.7"/><line x1="230" y1="186.5" x2="370" y2="186.5" stroke="#c9bb7a" stroke-width="0.7"/><line x1="230" y1="208" x2="370" y2="208" stroke="#c9bb7a" stroke-width="0.7"/><line x1="230" y1="229.5" x2="370" y2="229.5" stroke="#c9bb7a" stroke-width="0.7"/><line x1="230" y1="251" x2="370" y2="251" stroke="#c9bb7a" stroke-width="0.7"/><line x1="230" y1="272.5" x2="370" y2="272.5" stroke="#c9bb7a" stroke-width="0.7"/><rect x="230" y="70" width="140" height="22" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.8"/><text x="240" y="86" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="start">row 15</text><text x="360" y="86" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="end">D numbers</text><rect x="230" y="170" width="140" height="22" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.8"/><text x="240" y="186" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="start">row 2201</text><text x="360" y="186" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="end">D numbers</text><rect x="230" y="238" width="140" height="22" rx="0" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.8"/><text x="240" y="254" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="start">row 7</text><text x="360" y="254" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="end">D numbers</text><text x="300" y="312" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">V rows, one per token in the vocabulary</text><line x1="152" y1="150" x2="226" y2="80" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><line x1="152" y1="150" x2="226" y2="180" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><line x1="152" y1="150" x2="226" y2="248" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><line x1="372" y1="81" x2="486" y2="118" stroke="#4f5d36" stroke-width="1.5" marker-end="url(#ah-4f5d36)"/><rect x="488" y="100" width="150" height="36" rx="4" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.6"/><text x="563" y="123" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">vector of token 1</text><line x1="372" y1="181" x2="486" y2="162" stroke="#8a5a00" stroke-width="1.5" marker-end="url(#ah-8a5a00)"/><rect x="488" y="144" width="150" height="36" rx="4" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.6"/><text x="563" y="167" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">vector of token 2</text><line x1="372" y1="249" x2="486" y2="206" stroke="#a3283f" stroke-width="1.5" marker-end="url(#ah-a3283f)"/><rect x="488" y="188" width="150" height="36" rx="4" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.6"/><text x="563" y="211" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">vector of token 3</text><text x="563" y="90" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">output: (3, D)</text><text x="563" y="248" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">one dense vector per token,</text><text x="563" y="264" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">learned during training</text></svg>

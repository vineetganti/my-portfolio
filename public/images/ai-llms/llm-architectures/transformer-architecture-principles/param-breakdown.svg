<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Where Llama-2-7B's parameters are</title><desc>Llama-2-7B's 6.74 billion parameters: the feed-forward networks hold 4.33 billion (64%), attention projections 2.15 billion (32%), and the input embedding and output head 0.26 billion (4%). Each of the 32 layers has 67 million attention and 135 million feed-forward parameters.</desc><defs></defs><rect width="720" height="300" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Llama-2-7B: 6.74 billion parameters, and where they are</text><rect x="30" y="52" width="423.961" height="54" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.3"/><text x="241.98" y="75" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">feed-forward (SwiGLU)</text><text x="241.98" y="93" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">4.33 B  (64%)</text><rect x="453.961" y="52" width="210.337" height="54" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.3"/><text x="559.129" y="75" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">attention: Q, K, V, O</text><text x="559.129" y="93" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">2.15 B  (32%)</text><rect x="664.298" y="52" width="25.6759" height="54" rx="4" fill="#e7dcc5" stroke="#5e5241" stroke-width="1.3"/><line x1="677.136" y1="108" x2="659.974" y2="128" stroke="#5e5241" stroke-width="1"/><text x="655.974" y="140" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="end">embeddings + output head: 0.26 B (4%)</text><rect x="30" y="152" width="660" height="100" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="176" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">One of the 32 layers</text><rect x="48" y="196" width="300" height="44" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="198" y="221.75" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">attention: 4 × 4,096² = 67.1 M</text><rect x="372" y="196" width="300" height="44" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="522" y="221.75" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">feed-forward: 3 × 4,096 × 11,008 = 135.3 M</text><text x="360" y="276" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">rule of thumb: 12 × L × d² = 12 × 32 × 4,096² ≈ 6.44 B, plus 0.26 B of embeddings ≈ 6.70 B</text><text x="360" y="294" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">norms add only 0.27 M. The feed-forward networks, not attention, hold most of the weights.</text></svg>

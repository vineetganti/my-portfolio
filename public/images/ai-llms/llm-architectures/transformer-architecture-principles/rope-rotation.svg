<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 324" width="720" height="324" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>RoPE: relative position from rotations</title><desc>RoPE rotates the query and key vectors by an angle proportional to their position. A query at position 3 and a key at position 1, and a query at position 7 and a key at position 5, are both two positions apart, so the angle between them is the same and so is their dot product.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d36"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a00"/></marker></defs><rect width="720" height="324" fill="#ffffff"/><text x="360" y="22" font-size="13.5" font-weight="700" fill="#2c361c" text-anchor="middle">RoPE rotates q and k by (position × θ)</text><text x="180" y="52" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">q at position 3, k at position 1</text><circle cx="180" cy="172" r="92" fill="#ffffff" stroke="#c9bb7a" stroke-width="1.4"/><line x1="88" y1="172" x2="272" y2="172" stroke="#7d8257" stroke-width="1" stroke-dasharray="4 4"/><line x1="180" y1="172" x2="258.9341801460163" y2="143.27030796064383" stroke="#4f5d36" stroke-width="2.4" marker-end="url(#ah-4f5d36)"/><text x="279.6074178033063" y="139.7458648074791" font-size="12" font-weight="700" fill="#4f5d36" text-anchor="start">k (pos 1)</text><line x1="180" y1="172" x2="222.0" y2="99.25386608210715" stroke="#8a5a00" stroke-width="2.4" marker-end="url(#ah-8a5a00)"/><text x="233.0" y="84.2013071988495" font-size="12" font-weight="700" fill="#8a5a00" text-anchor="start">q (pos 3)</text><path d="M219.5 157.6 A 42 42 0 0 0 201.0 135.6" fill="none" stroke="#a3283f" stroke-width="2"/><text x="225.96266658713867" y="137.43274341880766" font-size="13" font-weight="700" fill="#a3283f" text-anchor="middle">2θ</text><text x="540" y="52" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">q at position 7, k at position 5</text><circle cx="540" cy="172" r="92" fill="#ffffff" stroke="#c9bb7a" stroke-width="1.4"/><line x1="448" y1="172" x2="632" y2="172" stroke="#7d8257" stroke-width="1" stroke-dasharray="4 4"/><line x1="540" y1="172" x2="525.4135530759778" y2="89.27614874697453" stroke="#4f5d36" stroke-width="2.4" marker-end="url(#ah-4f5d36)"/><text x="521.5932931673054" y="71.61037818070595" font-size="12" font-weight="700" fill="#4f5d36" text-anchor="end">k (pos 5)</text><line x1="540" y1="172" x2="475.65226677800587" y2="118.00584078633068" stroke="#8a5a00" stroke-width="2.4" marker-end="url(#ah-8a5a00)"/><text x="458.7992890293883" y="107.86451337322681" font-size="12" font-weight="700" fill="#8a5a00" text-anchor="end">q (pos 7)</text><path d="M532.7 130.6 A 42 42 0 0 0 507.8 145.0" fill="none" stroke="#a3283f" stroke-width="2"/><text x="510.0" y="124.03847577293368" font-size="13" font-weight="700" fill="#a3283f" text-anchor="middle">2θ</text><text x="360" y="296" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">Both pairs are 2 positions apart, so the angle between q and k is 2θ in both,</text><text x="360" y="314" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">and so is their dot product. Absolute position goes in, relative position comes out.</text></svg>

"#8a5a00" stroke-width="1.5"/><text x="317" y="247.625" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">Linear  D → K</text><text x="317" y="263.875" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">+ softmax</text><line x1="414" y1="252" x2="450" y2="252" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><text x="454" y="238" font-size="12" font-weight="400" fill="#3a3226" text-anchor="start">negative</text><rect x="530" y="226" width="11.2" height="16" rx="3" fill="#f3ecdc" stroke="#8d8068" stroke-width="1.2"/><text x="549.2" y="239" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="start">0.07</text><text x="454" y="264" font-size="12" font-weight="400" fill="#3a3226" text-anchor="start">neutral</text><rect x="530" y="252" width="20.8" height="16" rx="3" fill="#f3ecdc" stroke="#8d8068" stroke-width="1.2"/><text x="558.8" y="265" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="start">0.13</text><text x="454" y="290" font-size="12" font-weight="400" fill="#3a3226" text-anchor="start">positive</text><rect x="530" y="278" width="128" height="16" rx="3" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><text x="666" y="291" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="start">0.80</text><rect x="14" y="312" width="692" height="56" rx="10" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.4"/><text x="30" y="336" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="start">[CLS] has no word of its own, so attention lets it collect a summary of the sentence.</text><text x="30" y="356" font-size="12.5" font-weight="400" fill="#6b5f4d" text-anchor="start">Alternative: mean-pool all hidden vectors (h1 … hN), then use the same linear layer and softmax.</text></svg>

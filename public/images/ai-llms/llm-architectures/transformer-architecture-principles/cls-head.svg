<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Classification with the [CLS] token</title><desc>A [CLS] token is prepended to the sentence tokens. The encoder turns every token into a hidden vector. The hidden vector of [CLS], which has attended to all tokens, goes through a linear layer and a softmax to give class probabilities. Mean pooling over all tokens is an alternative.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a00"/></marker></defs><rect width="720" height="380" fill="#ffffff"/><rect x="14" y="24" width="100" height="36" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.5"/><text x="64" y="45.9" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">[CLS]</text><line x1="64" y1="62" x2="64" y2="90" stroke="#6b5f4d" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><rect x="129" y="24" width="100" height="36" rx="8" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.5"/><text x="179" y="45.9" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">the</text><line x1="179" y1="62" x2="179" y2="90" stroke="#6b5f4d" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><rect x="244" y="24" width="100" height="36" rx="8" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.5"/><text x="294" y="45.9" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">movie</text><line x1="294" y1="62" x2="294" y2="90" stroke="#6b5f4d" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><rect x="359" y="24" width="100" height="36" rx="8" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.5"/><text x="409" y="45.9" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">was</text><line x1="409" y1="62" x2="409" y2="90" stroke="#6b5f4d" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><rect x="474" y="24" width="100" height="36" rx="8" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.5"/><text x="524" y="45.9" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">great</text><line x1="524" y1="62" x2="524" y2="90" stroke="#6b5f4d" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><rect x="589" y="24" width="100" height="36" rx="8" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.5"/><text x="639" y="45.9" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">[SEP]</text><line x1="639" y1="62" x2="639" y2="90" stroke="#6b5f4d" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><rect x="14" y="92" width="675" height="56" rx="12" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.6"/><text x="360" y="126" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">Transformer encoder (self-attention: every token sees every token)</text><line x1="64" y1="150" x2="64" y2="176" stroke="#6b5f4d" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><rect x="14" y="178" width="100" height="36" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="2"/><text x="64" y="199.75" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">h_[CLS]</text><line x1="179" y1="150" x2="179" y2="176" stroke="#6b5f4d" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><rect x="129" y="178" width="100" height="36" rx="8" fill="#ffffff" stroke="#8d8068" stroke-width="1.2"/><text x="179" y="199.75" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">h
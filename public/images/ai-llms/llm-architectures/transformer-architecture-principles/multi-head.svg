<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" width="720" height="392" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Multi-head attention</title><desc>The input of shape sequence length by D is projected into several heads, each with its own queries, keys and values of size D divided by the number of heads. Each head runs attention on its own, the head outputs are concatenated back to width D, and a final linear projection mixes them.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker></defs><rect width="720" height="392" fill="#ffffff"/><text x="20" y="24" font-size="14" font-weight="700" fill="#3a3226" text-anchor="start">8 heads, D = 512, each head works in 64 dimensions</text><rect x="14" y="150" width="90" height="70" rx="10" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.5"/><text x="59" y="180.1" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">X</text><text x="59" y="198.3" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">(S × 512)</text><rect x="150" y="50" width="280" height="60" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.6"/><text x="164" y="72" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="start">head 1</text><text x="164" y="92" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="start">W_Q, W_K, W_V → Q, K, V  (S × 64)</text><text x="420" y="72" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">softmax(Q·Kᵀ/√64)·V</text><text x="420" y="92" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="end">output (S × 64)</text><line x1="106" y1="185" x2="148" y2="80" stroke="#6b5f4d" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><line x1="432" y1="80" x2="468" y2="185" stroke="#6b5f4d" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><rect x="150" y="118" width="280" height="60" rx="10" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.6"/><text x="164" y="140" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="start">head 2</text><text x="164" y="160" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="start">W_Q, W_K, W_V → Q, K, V  (S × 64)</text><text x="420" y="140" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">softmax(Q·Kᵀ/√64)·V</text><text x="420" y="160" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="end">output (S × 64)</text><line x1="106" y1="185" x2="148" y2="148" stroke="#6b5f4d" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><line x1="432" y1="148" x2="468" y2="185" stroke="#6b5f4d" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><text x="300" y="245" font-size="22" font-weight="700" fill="#6b5f4d" text-anchor="middle">⋮</text><rect x="150" y="262" width="280" height="60" rx="10" fill="#f7e0da" stroke="#a3283f" stroke-width="1.6"/><text x="164" y="284" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="start">head 8</text><text x="164" y="304" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="start">W_Q, W_K, W_V → Q, K, V  (S × 64)</text><text x="420" y="284" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">softmax(Q·Kᵀ/√64)·V</text><text x="420" y="304" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="end">output (S × 64)</text><line x1="106" y1="185" x2="148" y2="292" stroke="#6b5f4d" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><line x1="432" y1="292" x2="468" y2="185" stroke="#6b5f4d" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><rect x="470" y="150" width="96" height="70" rx="10" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="518" y="180.45" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">concat</text><text x="518" y="197.35" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">(S × 512)</text><line x1="568" y1="185" x2="590" y2="185" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="592" y="150" width="112" height="70" rx="10" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.5"/><text x="648" y="180.45" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">× W_O</text><text x="648" y="197.35" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">(S × 512)</text><rect x="14" y="336" width="692" height="44" rx="10" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.4"/><text x="360" y="362" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">8 heads × 64 dims = 512: same cost as one big head, 8 relationships at once</text></svg>

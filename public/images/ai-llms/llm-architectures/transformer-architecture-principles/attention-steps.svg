<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" width="720" height="356" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>The four steps of attention</title><desc>The input X is projected into queries, keys and values. Q times K transpose gives an N by N score matrix, which is scaled by the square root of the key dimension, passed through softmax into attention weights, and used to take a weighted sum of the values.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="356" fill="#fffdf8"/><rect x="20" y="82" width="80" height="58" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="60" y="108" font-size="15" font-weight="700" fill="#2f281e" text-anchor="middle">X</text><text x="60" y="126" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle">N × D</text><rect x="150" y="16" width="140" height="50" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.4"/><text x="220" y="37" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Q  query</text><text x="220" y="55" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="middle">what am I looking for?</text><line x1="102" y1="111" x2="148" y2="41" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="150" y="84" width="140" height="50" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.4"/><text x="220" y="105" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">K  key</text><text x="220" y="123" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="middle">what do I contain?</text><line x1="102" y1="111" x2="148" y2="109" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="150" y="152" width="140" height="50" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.4"/><text x="220" y="173" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">V  value</text><text x="220" y="191" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="middle">what do I hand over?</text><line x1="102" y1="111" x2="148" y2="177" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><text x="20" y="224" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start" font-style="italic">× W_Q, W_K, W_V (learned)</text><rect x="330" y="24" width="120" height="84" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="390" y="46" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Q · Kᵀ</text><text x="390" y="64" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">similarity of every</text><text x="390" y="78" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">query with every key</text><text x="390" y="92" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">(an N × N matrix)</text><rect x="460" y="24" width="120" height="84" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="520" y="46" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">÷ √d_k</text><text x="520" y="64" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">tame the scale so</text><text x="520" y="78" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">softmax doesn't</text><text x="520" y="92" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">saturate</text><rect x="590" y="24" width="120" height="84" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="650" y="46" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">softmax</text><text x="650" y="64" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">each row becomes</text><text x="650" y="78" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">weights that</text><text x="650" y="92" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">sum to 1</text><line x1="292" y1="41" x2="328" y2="56" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><line x1="292" y1="109" x2="328" y2="76" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><line x1="452" y1="66" x2="458" y2="66" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><line x1="582" y1="66" x2="588" y2="66" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><line x1="650" y1="110" x2="650" y2="148" stroke="#5e5241" stroke-width="2" marker-end="url(#ah-4f5d36)"/><text x="660" y="134" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start">A</text><rect x="590" y="150" width="120" height="62" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="650" y="172" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">A · V</text><text x="650" y="190" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">weighted sum of</text><text x="650" y="204" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">the value vectors</text><line x1="292" y1="177" x2="588" y2="177" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><text x="440" y="169" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">V</text><line x1="650" y1="214" x2="650" y2="244" stroke="#5e5241" stroke-width="2" marker-end="url(#ah-4f5d36)"/><rect x="590" y="246" width="120" height="46" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="650" y="266" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Output</text><text x="650" y="282" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">context-aware</text><text x="360" y="322" font-size="12.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">Q · Kᵀ is an N × N matrix: this is where attention memory grows</text><text x="360" y="340" font-size="12.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">quadratically with sequence length.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 306" width="720" height="306" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Attention masks in three kinds of model</title><desc>Encoder-only models let every token see every real token. Decoder-only models add a causal mask so each token sees only itself and earlier tokens. Encoder-decoder models use a causal mask in the decoder's self-attention and no causal mask in cross-attention.</desc><defs></defs><rect width="720" height="306" fill="#ffffff"/><rect x="6" y="10" width="228" height="236" rx="14" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="120" y="34" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">Encoder-only</text><text x="120" y="52" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">bidirectional context</text><rect x="246" y="10" width="228" height="236" rx="14" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="360" y="34" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">Decoder-only</text><text x="360" y="52" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">autoregressive: no peeking ahead</text><rect x="486" y="10" width="228" height="236" rx="14" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="600" y="34" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">Encoder–decoder</text><text x="600" y="52" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">causal self-attention + cross-attention</text><rect x="55" y="84" width="26" height="26" rx="2" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="81" y="84" width="26" height="26" rx="2" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="107" y="84" width="26" height="26" rx="2" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="133" y="84" width="26" 
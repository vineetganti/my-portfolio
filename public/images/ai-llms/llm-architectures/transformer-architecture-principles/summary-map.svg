<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 302" width="720" height="302" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Post 03 at a glance: the Transformer, from text to token</title><desc>A map of post 03 in four columns. Input: BPE subword tokens, special tokens and masks, the embedding lookup, and positions. The block: attention and a feed-forward network, residuals and norms, causal masks, and about 12 L d squared parameters. Attention: softmax of Q K transpose over root d times V, an N by N score matrix, multiple heads, and RoPE. Output: logits over the vocabulary, greedy, top-p and beam search, temperature, and CLS or pooled vectors.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker></defs><rect width="720" height="302" fill="#ffffff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#3a3226" text-anchor="start">Post 03 at a glance: the Transformer, from text to token</text><rect x="10" y="44" width="161.5" height="192" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="90.75" y="71" font-size="13.5" font-weight="700" fill="#3a3226" text-anchor="middle">Input</text><rect x="20" y="88" width="141.5" height="28" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="90.75" y="106.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">BPE subword tokens</text><rect x="20" y="124" width="141.5" height="28" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="90.75" y="142.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">special tokens, masks</text><rect x="20" y="160" width="141.5" height="28" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="90.75" y="178.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">embedding lookup</text><rect x="20" y="196" width="141.5" height="28" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="90.75" y="214.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">positions added</text><line x1="173.5" y1="66" x2="187.5" y2="66" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="189.5" y="44" width="161.5" height="192" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="270.25" y="71" font-size="13.5" font-weight="700" fill="#3a3226" text-anchor="middle">The block</text><rect x="199.5" y="88" width="141.5" height="28" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="270.25" y="106.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">attention + FFN</text><rect x="199.5" y="124" width="141.5" height="28" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="270.25" y="142.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">residuals and norms</text><rect x="199.5" y="160" width="141.5" height="28" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="270.25" y="178.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">causal masks</text><rect x="199.5" y="196" width="141.5" height="28" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="270.25" y="214.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">12·L·d² parameters</text><line x1="353" y1="66" x2="367" y2="66" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="369" y="44" width="161.5" height="192" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="449.75" y="71" font-size="13.5" font-weight="700" fill="#3a3226" text-anchor="middle">Attention</text><rect x="379" y="88" width="141.5" height="28" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="449.75" y="106.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">softmax(QKᵀ/√d)·V</text><rect x="379" y="124" width="141.5" height="28" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="449.75" y="142.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">N × N scores: O(N²)</text><rect x="379" y="160" width="141.5" height="28" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="449.75" y="178.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">heads: many subspaces</text><rect x="379" y="196" width="141.5" height="28" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="449.75" y="214.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">RoPE: relative angles</text><line x1="532.5" y1="66" x2="546.5" y2="66" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="548.5" y="44" width="161.5" height="192" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="629.25" y="71" font-size="13.5" font-weight="700" fill="#3a3226" text-anchor="middle">Output</text><rect x="558.5" y="88" width="141.5" height="28" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="629.25" y="106.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">logits over the vocab</text><rect x="558.5" y="124" width="141.5" height="28" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="629.25" y="142.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">greedy, top-p, beam</text><rect x="558.5" y="160" width="141.5" height="28" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="629.25" y="178.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">temperature τ</text><rect x="558.5" y="196" width="141.5" height="28" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="629.25" y="214.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">CLS or pooled vector</text><rect x="10" y="252" width="700" height="36" rx="10" fill="#f6e9c8" stroke="#8a5a00" stroke-width="1.3"/><text x="360" y="275" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">Every token looks at every other token in parallel, so position has to be added.</text></svg>

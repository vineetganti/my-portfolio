<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>How temperature and top-p reshape the next-token distribution</title><desc>The logits for cat, dog, car and the turned into probabilities at three temperatures: at 0.5 the top token gets 86%, at 1 it gets 64%, and at 2 the distribution flattens to 45%, 27%, 17% and 10%. With top-p of 0.9 at temperature 1, only cat, dog and car are kept and renormalised.</desc><defs></defs><rect width="720" height="300" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">The same logits [2.0, 1.0, 0.1, −1.0], four ways to sample</text><rect x="10" y="40" width="166" height="236" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="93" y="64" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">temperature 0.5</text><text x="93" y="81" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">sharper</text><rect x="26" y="106.71" width="28" height="129.29" rx="3" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.1"/><text x="40" y="100.71" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">86%</text><text x="40" y="252" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">cat</text><rect x="62" y="218.503" width="28" height="17.4975" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="76" y="212.503" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">12%</text><text x="76" y="252" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">dog</text><rect x="98" y="233.108" width="28" height="2.89231" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="112" y="227.108" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">2%</text><text x="112" y="252" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">car</text><rect x="134" y="235.68" width="28" height="0.320477" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="148" y="229.68" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">0.2%</text><text x="148" y="252" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">the</text><rect x="188" y="40" width="166" height="236" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="271" y="64" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">temperature 1</text><text x="271" y="81" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">plain softmax</text><rect x="204" y="140.29" width="28" height="95.71" rx="3" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.1"/><text x="218" y="134.29" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">64%</text><text x="218" y="252" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">cat</text><rect x="240" y="200.79" width="28" height="35.2097" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="254" y="194.79" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">23%</text><text x="254" y="252" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">dog</text><rect x="276" y="221.685" width="28" height="14.3152" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="290" y="215.685" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">10%</text><text x="290" y="252" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">car</text><rect x="312" y="231.235" width="28" height="4.76512" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="326" y="225.235" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">3%</text><text x="326" y="252" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">the</text><rect x="366" y="40" width="166" height="236" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="449" y="64" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">temperature 2</text><text x="449" y="81" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">flatter</text><rect x="382" y="168.323" width="28" height="67.6773" rx="3" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.1"/><text x="396" y="162.323" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">45%</text><text x="396" y="252" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">cat</text><rect x="418" y="194.952" width="28" height="41.0483" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="432" y="188.952" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">27%</text><text x="432" y="252" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">dog</text><rect x="454" y="209.826" width="28" height="26.1736" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="468" y="203.826" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">17%</text><text x="468" y="252" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">car</text><rect x="490" y="220.899" width="28" height="15.1008" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="504" y="214.899" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">10%</text><text x="504" y="252" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">the</text><rect x="544" y="40" width="166" height="236" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="627" y="64" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">top-p 0.9 at τ = 1</text><text x="627" y="81" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">the unlikely tail is cut</text><rect x="560" y="137.15" width="28" height="98.8502" rx="3" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.1"/><text x="574" y="131.15" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">66%</text><text x="574" y="252" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">cat</text><rect x="596" y="199.635" width="28" height="36.3649" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="610" y="193.635" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">24%</text><text x="610" y="252" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">dog</text><rect x="632" y="221.215" width="28" height="14.7849" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="646" y="215.215" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">10%</text><text x="646" y="252" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">car</text><rect x="668" y="230" width="28" height="6" rx="2" fill="#fffdf8" stroke="#7a6d57" stroke-width="1" stroke-dasharray="2 2"/><text x="682" y="224" font-size="11" font-weight="400" fill="#7a6d57" text-anchor="middle">0</text><text x="682" y="252" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">the</text><text x="360" y="294" font-size="12.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">p_i = e^(z_i / τ) ÷ Σ e^(z_j / τ). Lower τ sharpens, higher τ flattens, top-p cuts the unlikely tail.</text></svg>

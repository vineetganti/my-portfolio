<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 324" width="720" height="324" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>From text to prediction in a Transformer</title><desc>Raw text is tokenized into subwords, each mapped to an integer ID, looked up in an embedding matrix with position information added, and passed through a stack of Transformer blocks. A task head then turns the final hidden states into generated text, a class label, or embeddings.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="324" fill="#fffdf8"/><rect x="10" y="18" width="120" height="92" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="70.0" y="39" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Raw text</text><text x="70.0" y="57" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">“The cat sat”</text><rect x="155" y="18" width="120" height="92" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="215.0" y="39" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Tokenizer</text><text x="215.0" y="57" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">BPE splits text</text><text x="215.0" y="71" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">into subwords</text><rect x="300" y="18" width="120" height="92" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="360.0" y="39" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Token IDs</text><text x="360.0" y="57" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">each subword gets</text><text x="360.0" y="71" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">an integer ID</text><rect x="445" y="18" width="120" height="92" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="505.0" y="39" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Embedding</text><text x="505.0" y="57" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">ID picks a row of</text><text x="505.0" y="71" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">a V × D matrix,</text><text x="505.0" y="85" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">plus position info</text><rect x="590" y="18" width="120" height="92" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="650.0" y="39" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Transformer</text><text x="650.0" y="57" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">a stack of N blocks:</text><text x="650.0" y="71" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">attention + FFN</text><line x1="132" y1="64" x2="153" y2="64" stroke="#5e5241" stroke-width="2" marker-end="url(#ah-4f5d36)"/><line x1="277" y1="64" x2="298" y2="64" stroke="#5e5241" stroke-width="2" marker-end="url(#ah-4f5d36)"/><line x1="422" y1="64" x2="443" y2="64" stroke="#5e5241" stroke-width="2" marker-end="url(#ah-4f5d36)"/><line x1="567" y1="64" x2="588" y2="64" stroke="#5e5241" stroke-width="2" marker-end="url(#ah-4f5d36)"/><line x1="650" y1="112" x2="650" y2="140" stroke="#5e5241" stroke-width="2"/><path d="M650 140 L120 140" fill="none" stroke="#5e5241" stroke-width="2"/><text x="385" y="132" font-size="12" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">same stack, a different head for each task</text><rect x="20" y="176" width="200" height="90" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="120.0" y="197" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Text generation</text><text x="120.0" y="215" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">project to vocabulary logits,</text><text x="120.0" y="229" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">softmax or sampling picks</text><text x="120.0" y="243" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">a token, then detokenize</text><line x1="120" y1="140" x2="120" y2="174" stroke="#5e5241" stroke-width="2" marker-end="url(#ah-4f5d36)"/><rect x="260" y="176" width="200" height="90" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="360.0" y="197" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Classification</text><text x="360.0" y="215" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">the [CLS] hidden state goes</text><text x="360.0" y="229" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">through a small classifier</text><text x="360.0" y="243" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">to give label scores</text><line x1="360" y1="140" x2="360" y2="174" stroke="#5e5241" stroke-width="2" marker-end="url(#ah-4f5d36)"/><rect x="500" y="176" width="200" height="90" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="600.0" y="197" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Embeddings</text><text x="600.0" y="215" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">use the final hidden</text><text x="600.0" y="229" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">states directly,</text><text x="600.0" y="243" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">no projection</text><line x1="600" y1="140" x2="600" y2="174" stroke="#5e5241" stroke-width="2" marker-end="url(#ah-4f5d36)"/><text x="360" y="300" font-size="12.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">Tokenizing and embedding are the input side; the head decides how the final hidden states are used.</text></svg>

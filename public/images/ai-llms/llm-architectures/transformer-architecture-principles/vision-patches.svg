<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 376" width="720" height="376" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Turning an image into a sequence of tokens</title><desc>A 224 by 224 image is cut into 14 by 14 equal patches of 16 by 16 pixels. Each patch is flattened to 768 numbers and projected to the model dimension. A classification token and position embeddings are added, and the 197 vectors enter the Transformer like word tokens.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="376" fill="#fffdf8"/><text x="20" y="24" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Vision Transformer: image → patches → tokens</text><rect x="30" y="46" width="20" height="20" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="50" y="46" width="20" height="20" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="70" y="46" width="20" height="20" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="90" y="46" width="20" height="20" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="110" y="46" width="20" height="20" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="130" y="46" width="20" height="20" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="30" y="66" width="20" height="20" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="50" y="66" width="20" height="20" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="70" y="66" width="20" height="20" rx="0" fill="#fdf0d4" stroke="#9a5400" stroke-width="2"/><rect x="90" y="66" width="20" height="20" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="110" y="66" width="20" height="20" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="130" y="66" width="20" height="20" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="30" y="86" width="20" height="20" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="50" y="86" width="20" height="20" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="70" y="86" width="20" height="20" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="90" y="86" width="20" height="20" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="110" y="86" width="20" height="20" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="130" y="86" width="20" height="20" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="30" y="106" width="20" height="20" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="50" y="106" width="20" height="20" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="70" y="106" width="20" height="20" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="90" y="106" width="20" height="20" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="110" y="106" width="20" height="20" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="130" y="106" width="20" height="20" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="30" y="126" width="20" height="20" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="50" y="126" width="20" height="20" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="70" y="126" width="20" height="20" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="90" y="126" width="20" height="20" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="110" y="126" width="20" height="20" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="130" y="126" width="20" height="20" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="30" y="146" width="20" height="20" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="50" y="146" width="20" height="20" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="70" y="146" width="20" height="20" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="90" y="146" width="20" height="20" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="110" y="146" width="20" height="20" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="130" y="146" width="20" height="20" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><text x="90" y="184" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">224 × 224 image</text><text x="90" y="200" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle">196 patches of 16 × 16</text><line x1="158" y1="106" x2="190" y2="106" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="194" y="72" width="150" height="68" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="269" y="101.625" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">flatten a patch</text><text x="269" y="117.875" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">16·16·3 = 768</text><line x1="346" y1="106" x2="376" y2="106" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="378" y="72" width="150" height="68" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="453" y="101.625" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">linear projection</text><text x="453" y="117.875" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">768 → D</text><line x1="530" y1="106" x2="560" y2="106" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="562" y="72" width="140" height="68" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="632" y="101.625" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">+ position</text><text x="632" y="117.875" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">embedding</text><text x="20" y="236" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">token sequence fed to the Transformer</text><rect x="20" y="248" width="86" height="40" rx="6" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="63" y="274" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">[CLS]</text><rect x="116" y="248" width="86" height="40" rx="6" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="159" y="274" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">p1</text><rect x="212" y="248" width="86" height="40" rx="6" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="255" y="274" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">p2</text><rect x="308" y="248" width="86" height="40" rx="6" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="351" y="274" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">p3</text><rect x="404" y="248" width="86" height="40" rx="6" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="447" y="274" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">p4</text><rect x="500" y="248" width="86" height="40" rx="6" fill="#fffdf8" stroke="#7a6d57" stroke-width="1.5"/><text x="543" y="274" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">…</text><rect x="596" y="248" width="86" height="40" rx="6" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="639" y="274" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">p196</text><text x="360" y="318" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">197 vectors of size D, exactly like word tokens: the Transformer does not know they were pixels</text><text x="360" y="340" font-size="12" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">Audio works the same way: slice a spectrogram into frames or patches, then project them.</text></svg>

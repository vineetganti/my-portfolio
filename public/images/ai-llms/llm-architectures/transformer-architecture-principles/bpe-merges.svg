<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Byte pair encoding on a tiny corpus</title><desc>Starting from single characters, BPE repeatedly merges the most frequent adjacent pair into a new token: u and g become ug with 20 occurrences, then u and n become un with 16, then h and ug become hug with 15.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker></defs><rect width="720" height="330" fill="#ffffff"/><rect x="10" y="14" width="250" height="218" rx="12" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="24" y="40" font-size="14" font-weight="700" fill="#3a3226" text-anchor="start">Training corpus</text><text x="34" y="70" font-size="13" font-weight="400" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">hug   × 10</text><text x="34" y="94" font-size="13" font-weight="400" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">pug   × 5</text><text x="34" y="118" font-size="13" font-weight="400" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">pun   × 12</text><text x="34" y="142" font-size="13" font-weight="400" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">bun   × 4</text><text x="34" y="166" font-size="13" font-weight="400" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">hugs  × 5</text><text x="24" y="202" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="start" font-style="italic">start: every character is a token</text><text x="34" y="220" font-size="12" font-weight="700" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">b  g  h  n  p  s  u</text><rect x="290" y="14" width="420" height="60" rx="10" fill="#f6e9c8" stroke="#6b5f4d" stroke-width="1.4"/><text x="304" y="39" font-size="13.5" font-weight="700" fill="#3a3226" text-anchor="start">Merge 1:  (u, g) → ug   ·   20 occurrences</text><text x="304" y="60" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">hug → h ug   ·   pug → p ug   ·   hugs → h ug s</text><line x1="500" y1="76" x2="500" y2="94" stroke="#6b5f4d" stroke-width="2" marker-end="url(#ah-4f5d36)"/><rect x="290" y="96" width="420" height="60" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.4"/><text x="304" y="121" font-size="13.5" font-weight="700" fill="#3a3226" text-anchor="start">Merge 2:  (u, n) → un   ·   16 occurrences</text><text x="304" y="142" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">pun → p un   ·   bun → b un</text><line x1="500" y1="158" x2="500" y2="176" stroke="#6b5f4d" stroke-width="2" marker-end="url(#ah-4f5d36)"/><rect x="290" y="178" width="420" height="60" rx="10" fill="#f6ecd6" stroke="#6b5f4d" stroke-width="1.4"/><text x="304" y="203" font-size="13.5" font-weight="700" fill="#3a3226" text-anchor="start">Merge 3:  (h, ug) → hug   ·   15 occurrences</text><text x="304" y="224" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">hug → hug   ·   hugs → hug s</text><rect x="10" y="252" width="700" height="62" rx="12" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.4"/><text x="24" y="276" font-size="13" font-weight="700" fill="#3a3226" text-anchor="start">Vocabulary grows:</text><text x="24" y="300" font-size="13" font-weight="400" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">b g h n p s u     + ug     + un     + hug</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 446" width="720" height="446" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Data flow through one Transformer block</title><desc>Input X goes through multi-head attention, a residual addition and layer norm, then a feed-forward network, a second residual addition and a second layer norm, before moving on to the next block.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a00"/></marker></defs><rect width="720" height="446" fill="#ffffff"/><text x="300" y="16" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">input X</text><line x1="300" y1="22" x2="300" y2="38" stroke="#6b5f4d" stroke-width="2" marker-end="url(#ah-4f5d36)"/><rect x="190" y="40" width="220" height="44" rx="10" fill="#f6e9c8" stroke="#8a5a00" stroke-width="1.5"/><text x="300" y="67" font-size="13.5" font-weight="700" fill="#3a3226" text-anchor="middle">Multi-head attention</text><line x1="300" y1="84" x2="300" y2="102" stroke="#6b5f4d" stroke-width="2" marker-end="url(#ah-4f5d36)"/><circle cx="300" cy="118" r="14" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.6"/><text x="300" y="124" font-size="18" font-weight="700" fill="#3a3226" text-anchor="middle">+</text><circle cx="300" cy="296" r="14" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.6"/><text x="300" y="302" font-size="18" font-weight="700" fill="#3a3226" text-anchor="middle">+</text><line x1="300" y1="132" x2="300" y2="142" stroke="#6b5f4d" stroke-width="2" marker-end="url(#ah-4f5d36)"/><rect x="190" y="144" width="220" height="44" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="300" y="171" font-size="13.5" font-weight="700" fill="#3a3226" text-anchor="middle">Layer norm</text><line x1="300" y1="188" x2="300" y2="216" stroke="#6b5f4d" stroke-width="2" marker-end="url(#ah-4f5d36)"/><rect x="190" y="218" width="220" height="44" rx="10" fill="#f6e9c8" stroke="#8a5a00" stroke-width="1.5"/><text x="300" y="245" font-size="13.5" font-weight="700" fill="#3a3226" text-anchor="middle">Feed-forward network</text><line x1="300" y1="262" x2="300" y2="280" stroke="#6b5f4d" stroke-width="2" marker-end="url(#ah-4f5d36)"/><line x1="300" y1="310" x2="300" y2="320" stroke="#6b5f4d" stroke-width="2" marker-end="url(#ah-4f5d36)"/><rect x="190" y="322" width="220" height="44" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="300" y="349" font-size="13.5" font-weight="700" fill="#3a3226" text-anchor="middle">Layer norm</text><line x1="300" y1="366" x2="300" y2="392" stroke="#6b5f4d" stroke-width="2" marker-end="url(#ah-4f5d36)"/><text x="300" y="410" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">output: the input to the next block</text><path d="M300 30 L470 30 L470 118 L316 118" fill="none" stroke="#8a5a00" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-8a5a00)"/><path d="M300 203 L470 203 L470 296 L316 296" fill="none" stroke="#8a5a00" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-8a5a00)"/><text x="176" y="58" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="end" font-style="italic">mixes information</text><text x="176" y="73" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="end" font-style="italic">between tokens</text><text x="176" y="162" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="end" font-style="italic">normalises each</text><text x="176" y="177" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="end" font-style="italic">token's activations</text><text x="176" y="236" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="end" font-style="italic">the same small MLP,</text><text x="176" y="251" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="end" font-style="italic">applied to every position</text><text x="176" y="340" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="end" font-style="italic">normalises each</text><text x="176" y="355" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="end" font-style="italic">token's activations</text><text x="484" y="64" font-size="12" font-weight="700" fill="#8a5a00" text-anchor="start">skip connection</text><text x="484" y="82" font-size="12" font-weight="400" fill="#3a3226" text-anchor="start">output = X + F(X)</text><text x="484" y="97" font-size="12" font-weight="400" fill="#3a3226" text-anchor="start">gradients flow straight</text><text x="484" y="112" font-size="12" font-weight="400" fill="#3a3226" text-anchor="start">through the shortcut</text><text x="484" y="238" font-size="12" font-weight="400" fill="#3a3226" text-anchor="start">the same trick again,</text><text x="484" y="253" font-size="12" font-weight="400" fill="#3a3226" text-anchor="start">around the FFN</text><text x="360" y="436" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">Post-norm layout, as in the original Transformer. Many modern LLMs normalise before each sub-layer instead.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Which parts of a quantized block stay in higher precision</title><desc>Matrix multiplications run in INT8. Between them, results are dequantized to FP16 or FP32 for the numerically sensitive operations, softmax in FP32 and layer normalisation statistics in FP32, then requantized to INT8 for the next matrix multiplication.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="360" fill="#fffdf8"/><text x="20" y="24" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Attention: INT8 matmuls with an FP32 softmax in the middle</text><rect x="14" y="40" width="118" height="56" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><text x="73" y="64.425" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Q · Kᵀ</text><text x="73" y="80.545" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle">INT8 matmul</text><line x1="134" y1="68" x2="155" y2="68" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="157" y="40" width="118" height="56" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.4"/><text x="216" y="64.425" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">dequantize</text><text x="216" y="80.545" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle">INT32 → FP32</text><line x1="277" y1="68" x2="298" y2="68" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="300" y="40" width="118" height="56" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.4"/><text x="359" y="64.425" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">softmax</text><text x="359" y="80.545" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle">FP32</text><line x1="420" y1="68" x2="441" y2="68" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="443" y="40" width="118" height="56" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.4"/><text x="502" y="64.425" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">requantize</text><text x="502" y="80.545" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle">P → INT8</text><line x1="563" y1="68" x2="584" y2="68" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="586" y="40" width="118" height="56" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><text x="645" y="64.425" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">P · V</text><text x="645" y="80.545" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle">INT8 matmul</text><text x="20" y="140" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">After attention: residual add and LayerNorm</text><rect x="14" y="156" width="150" height="56" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.4"/><text x="89" y="180.75" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">dequantize</text><text x="89" y="196.87" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">+ residual add, FP16</text><line x1="166" y1="184" x2="192" y2="184" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="194" y="156" width="150" height="56" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.4"/><text x="269" y="180.75" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">LayerNorm</text><text x="269" y="196.87" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">mean, variance in FP32</text><line x1="346" y1="184" x2="372" y2="184" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="374" y="156" width="150" height="56" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.4"/><text x="449" y="180.75" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">requantize</text><text x="449" y="196.87" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">→ INT8</text><line x1="526" y1="184" x2="552" y2="184" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="554" y="156" width="150" height="56" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><text x="629" y="180.75" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">FFN matmul</text><text x="629" y="196.87" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">INT8</text><rect x="30" y="244" width="16" height="16" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.3"/><text x="56" y="257" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="start">INT8: matmuls, where almost all the FLOPs are</text><rect x="30" y="272" width="16" height="16" rx="3" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.3"/><text x="56" y="285" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="start">FP32 or FP16: wide dynamic range, tiny cost</text><rect x="30" y="300" width="16" height="16" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.3"/><text x="56" y="313" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="start">quantize / dequantize: cheap scale-and-round</text><text x="360" y="346" font-size="12.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">In practice these steps are fused into a few kernels, so the FP32 values stay in registers and never reach HBM.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452" width="720" height="452" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Standard attention versus FlashAttention memory traffic</title><desc>Standard attention runs three separate kernels, and the N by N score matrix S and probability matrix P are written to and read back from HBM. FlashAttention runs one fused kernel that loads tiles of Q, K and V into SRAM, computes scores, softmax and the weighted sum there, and writes only the output O back.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a00"/></marker></defs><rect width="720" height="452" fill="#ffffff"/><text x="20" y="24" font-size="14" font-weight="700" fill="#3a3226" text-anchor="start">Standard attention: 3 kernels, S and P make a round trip through HBM</text><rect x="30" y="40" width="190" height="46" rx="10" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="125" y="67.2" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">S = Q · Kᵀ</text><rect x="265" y="40" width="190" height="46" rx="10" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="360" y="67.2" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">P = softmax(S)</text><rect x="500" y="40" width="190" height="46" rx="10" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="595" y="67.2" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">O = P · V</text><line x1="85" y1="122" x2="85" y2="88" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><line x1="165" y1="88" x2="165" y2="120" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><line x1="320" y1="122" x2="320" y2="88" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><line x1="400" y1="88" x2="400" y2="120" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><line x1="555" y1="122" x2="555" y2="88" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><line x1="635" y1="88" x2="635" y2="120" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="20" y="122" width="680" height="28" rx="8" fill="#f3ecdc" stroke="#8d8068" stroke-width="1.3" stroke-dasharray="6 4"/><text x="360" y="140.5" font-size="12.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">HBM (slow, large)</text><text x="125" y="170" font-size="12" font-weight="400" fill="#a3283f" text-anchor="middle">reads Q, K</text><text x="125" y="185" font-size="12" font-weight="400" fill="#a3283f" text-anchor="middle">writes S (N × N)</text><text x="360" y="170" font-size="12" font-weight="400" fill="#a3283f" text-anchor="middle">reads S (N × N)</text><text x="360" y="185" font-size="12" font-weight="400" fill="#a3283f" text-anchor="middle">writes P (N × N)</text><text x="595" y="170" font-size="12" font-weight="400" fill="#a3283f" text-anchor="middle">reads P (N × N), V</text><text x="595" y="185" font-size="12" font-weight="400" fill="#a3283f" text-anchor="middle">writes O</text><text x="360" y="214" font-size="12.5" font-weight="700" fill="#a3283f" text-anchor="middle">HBM traffic grows like N²: the score and probability matrices dominate</text><text x="20" y="256" font-size="14" font-weight="700" fill="#3a3226" text-anchor="start">FlashAttention: 1 fused kernel, tiles stay in SRAM</text><rect x="20" y="270" width="680" height="28" rx="8" fill="#f3ecdc" stroke="#8d8068" stroke-width="1.3" stroke-dasharray="6 4"/><text x="360" y="288.5" font-size="12.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">HBM (slow, large)</text><rect x="30" y="332" width="660" height="78" rx="12" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="360" y="352" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">SRAM (fast, tiny): loop over tiles, nothing large is written out</text><rect x="50" y="362" width="180" height="36" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.3"/><text x="140" y="383.75" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">S_ij = Q_i · K_jᵀ</text><rect x="255" y="362" width="180" height="36" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.3"/><text x="345" y="383.75" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">online softmax</text><rect x="460" y="362" width="180" height="36" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.3"/><text x="550" y="383.75" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">O_i += P_ij · V_j</text><line x1="232" y1="380" x2="253" y2="380" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><line x1="437" y1="380" x2="458" y2="380" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><line x1="140" y1="300" x2="140" y2="330" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><text x="150" y="318" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="start">read tiles of Q, K, V</text><line x1="580" y1="330" x2="580" y2="302" stroke="#8a5a00" stroke-width="1.8" marker-end="url(#ah-8a5a00)"/><text x="570" y="318" font-size="11.5" font-weight="700" fill="#8a5a00" text-anchor="end">write O once</text><text x="360" y="440" font-size="12.5" font-weight="700" fill="#6b5f4d" text-anchor="middle">S and P never exist in HBM. Memory for the attention matrices drops from N² to N.</text></svg>

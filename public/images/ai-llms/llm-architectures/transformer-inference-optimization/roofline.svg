<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="720" height="372" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Roofline model for LLM inference</title><desc>A log-log roofline chart for an A100-class GPU. Performance rises along a bandwidth-limited slope up to a ridge point near 156 FLOPs per byte, then flattens at the compute peak. Decode at batch size 1 sits far left on the slope, large-batch decode moves right, and prefill sits in the compute-bound region.</desc><defs></defs><rect width="720" height="372" fill="#ffffff"/><text x="20" y="24" font-size="14" font-weight="700" fill="#3a3226" text-anchor="start">Roofline: A100-class GPU (312 TFLOP/s FP16, 2 TB/s HBM)</text><rect x="90" y="46" width="470.986" height="250" rx="0" fill="#f7e0da" opacity="0.55"/><rect x="560.986" y="46" width="119.014" height="250" rx="0" fill="#e6ecd5" opacity="0.8"/><text x="325.493" y="62" font-size="12" font-weight="700" fill="#a3283f" text-anchor="middle">MEMORY-BOUND</text><text x="620.493" y="62" font-size="12" font-weight="700" fill="#6b5f4d" text-anchor="middle">COMPUTE-BOUND</text><line x1="90" y1="296" x2="90" y2="301" stroke="#6b5f4d" stroke-width="1.2"/><text x="90" y="315" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">0.1</text><line x1="85" y1="296" x2="90" y2="296" stroke="#6b5f4d" stroke-width="1.2"/><text x="81" y="300" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="end">0.1</text><line x1="90" y1="296" x2="680" y2="296" stroke="#ddd0b4" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.7"/><line x1="237.5" y1="296" x2="237.5" y2="301" stroke="#6b5f4d" stroke-width="1.2"/><text x="237.5" y="315" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">1</text><line x1="85" y1="236" x2="90" y2="236" stroke="#6b5f4d" stroke-width="1.2"/><text x="81" y="240" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="end">1</text><line x1="90" y1="236" x2="680" y2="236" stroke="#ddd0b4" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.7"/><line x1="385" y1="296" x2="385" y2="301" stroke="#6b5f4d" stroke-width="1.2"/><text x="385" y="315" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">10</text><line x1="85" y1="176" x2="90" y2="176" stroke="#6b5f4d" stroke-width="1.2"/><text x="81" y="180" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="end">10</text><line x1="90" y1="176" x2="680" y2="176" stroke="#ddd0b4" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.7"/><line x1="532.5" y1="296" x2="532.5" y2="301" stroke="#6b5f4d" stroke-width="1.2"/><text x="532.5" y="315" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">100</text><line x1="85" y1="116" x2="90" y2="116" stroke="#6b5f4d" stroke-width="1.2"/><text x="81" y="120" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="end">100</text><line x1="90" y1="116" x2="680" y2="116" stroke="#ddd0b4" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.7"/><line x1="680" y1="296" x2="680" y2="301" stroke="#6b5f4d" stroke-width="1.2"/><text x="680" y="315" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">1000</text><line x1="85" y1="56" x2="90" y2="56" stroke="#6b5f4d" stroke-width="1.2"/><text x="81" y="60" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="end">1000</text><line x1="90" y1="56" x2="680" y2="56" stroke="#ddd0b4" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.7"/><line x1="90" y1="296" x2="680" y2="296" stroke="#6b5f4d" stroke-width="1.6"/><line x1="90" y1="296" x2="90" y2="46" stroke="#6b5f4d" stroke-width="1.6"/><text x="385" y="334" font-size="12.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">operational intensity I (FLOPs per byte moved from HBM)</text><text transform="translate(24 176) rotate(-90)" font-size="12.5" fill="#6b5f4d" text-anchor="middle">attainable TFLOP/s</text><path d="M115.973 267.373 L560.986 86.3507 L680 86.3507" fill="none" stroke="#8a5a00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="560.986" y1="86.3507" x2="560.986" y2="296" stroke="#8a5a00" stroke-width="1.2" stroke-dasharray="5 4"/><text x="554.986" y="288" font-size="11.5" font-weight="700" fill="#8a5a00" text-anchor="end">ridge ≈ 156 FLOPs/byte</text><text x="326.304" y="215.455" font-size="11.5" font-weight="400" fill="#8a5a00" text-anchor="start" font-style="italic">slope = memory bandwidth</text><circle cx="237.5" cy="217.938" r="6" fill="#a3283f" stroke="#ffffff" stroke-width="1.5"/><text x="225.5" y="185.938" font-size="12" font-weight="700" fill="#3a3226" text-anchor="end">decode, batch 1</text><text x="225.5" y="200.938" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="end">≈0.6% of peak</text><circle cx="459.51" cy="127.629" r="6" fill="#a3283f" stroke="#ffffff" stroke-width="1.5"/><text x="447.51" y="95.6292" font-size="12" font-weight="700" fill="#3a3226" text-anchor="end">decode, batch 32</text><text x="447.51" y="110.629" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="end">≈20% of peak</text><circle cx="647.277" cy="86.3507" r="6" fill="#6b5f4d" stroke="#ffffff" stroke-width="1.5"/><text x="647.277" y="114.351" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">prefill,</text><text x="647.277" y="128.351" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">long prompt</text><text x="647.277" y="143.351" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">I in the hundreds+</text><text x="360" y="362" font-size="12.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">Decode at batch B reads each weight once and does about B FLOPs on it, so I ≈ B. Raising I is the way up.</text></svg>

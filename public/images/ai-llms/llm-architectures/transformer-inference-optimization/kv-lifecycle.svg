<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="720" height="372" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Life of a KV cache inside an inference engine</title><desc>The engine owns a pool of free KV blocks. A request takes blocks from the pool for its prompt at prefill and one more each time its generation fills a block. When the request ends with an end-of-sequence token, a length limit or a cancellation, all its blocks go back to the pool automatically. If the pool is empty, new requests wait or a running request is preempted.</desc><defs><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a00"/></marker><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d36"/></marker></defs><rect width="720" height="372" fill="#ffffff"/><rect x="14" y="20" width="200" height="196" rx="14" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="114" y="44" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">Free block pool</text><rect x="32" y="66" width="34" height="28" rx="4" fill="#ffffff" stroke="#7d8257" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="74" y="66" width="34" height="28" rx="4" fill="#ffffff" stroke="#7d8257" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="116" y="66" width="34" height="28" rx="4" fill="#ffffff" stroke="#7d8257" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="158" y="66" width="34" height="28" rx="4" fill="#ffffff" stroke="#7d8257" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="32" y="104" width="34" height="28" rx="4" fill="#ffffff" stroke="#7d8257" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="74" y="104" width="34" height="28" rx="4" fill="#ffffff" stroke="#7d8257" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="116" y="104" width="34" height="28" rx="4" fill="#ffffff" stroke="#7d8257" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="158" y="104" width="34" height="28" rx="4" fill="#ffffff" stroke="#7d8257" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="32" y="142" width="34" height="28" rx="4" fill="#ffffff" stroke="#7d8257" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="74" y="142" width="34" height="28" rx="4" fill="#ffffff" stroke="#7d8257" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="116" y="142" width="34" height="28" rx="4" fill="#ffffff" stroke="#7d8257" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="158" y="142" width="34" height="28" rx="4" fill="#ffffff" stroke="#7d8257" stroke-width="1.2" stroke-dasharray="4 3"/><text x="114" y="196" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">owned by the engine</text><rect x="506" y="20" width="200" height="196" rx="14" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="606" y="44" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">Running requests</text><text x="520" y="86" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="start">req 1</text><rect x="566" y="70" width="24" height="24" rx="3" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><rect x="594" y="70" width="24" height="24" rx="3" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><rect x="622" y="70" width="24" height="24" rx="3" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="520" y="126" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="start">req 2</text><rect x="566" y="110" width="24" height="24" rx="3" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><rect x="594" y="110" width="24" height="24" rx="3" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><rect x="622" y="110" width="24" height="24" rx="3" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><rect x="650" y="110" width="24" height="24" rx="3" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><rect x="678" y="110" width="24" height="24" rx="3" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><text x="520" y="166" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="start">req 3</text><rect x="566" y="150" width="24" height="24" rx="3" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><rect x="594" y="150" width="24" height="24" rx="3" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="606" y="196" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">each holds a block table</text><line x1="216" y1="90" x2="504" y2="90" stroke="#8a5a00" stroke-width="2.4" marker-end="url(#ah-8a5a00)"/><text x="360" y="80" font-size="13" font-weight="700" fill="#8a5a00" text-anchor="middle">allocate</text><text x="360" y="110" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle">prompt blocks at prefill,</text><text x="360" y="125" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle">+1 block per 16 new tokens</text><line x1="504" y1="168" x2="216" y2="168" stroke="#4f5d36" stroke-width="2.4" marker-end="url(#ah-4f5d36)"/><text x="360" y="158" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">free</text><text x="360" y="188" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle">on EOS, max length or abort</text><text x="360" y="203" font-size="11.5" font-weight="700" fill="#4f5d36" text-anchor="middle">no manual clearing</text><rect x="14" y="240" width="692" height="112" rx="12" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.4"/><text x="30" y="266" font-size="13" font-weight="700" fill="#a3283f" text-anchor="start">Pool empty?</text><text x="30" y="290" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="start">The scheduler stops admitting new requests. If running requests still need blocks, it preempts one:</text><text x="30" y="311" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="start">it swaps that request's blocks to CPU memory, or drops them and recomputes its prefill later.</text><text x="30" y="336" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="start">A full cache makes the server slower, not dead.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Attention matrix memory versus sequence length</title><desc>A log-log chart of the memory needed per head per sequence. Standard attention stores the N by N score matrix in FP16, 2 MiB at 1k tokens, 512 MiB at 16k, 2 GiB at 32k and 32 GiB at 128k. FlashAttention only keeps one FP32 statistic per row, 128 KiB at 32k tokens.</desc><defs></defs><rect width="720" height="400" fill="#ffffff"/><text x="20" y="24" font-size="14" font-weight="700" fill="#2c361c" text-anchor="start">Per head, per sequence: the N × N matrix versus FlashAttention's row statistics</text><line x1="95" y1="316" x2="100" y2="316" stroke="#4f5d36" stroke-width="1.2"/><text x="91" y="320" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="end">1 KiB</text><line x1="100" y1="316" x2="670" y2="316" stroke="#c9bb7a" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.8"/><line x1="95" y1="216" x2="100" y2="216" stroke="#4f5d36" stroke-width="1.2"/><text x="91" y="220" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="end">1 MiB</text><line x1="100" y1="216" x2="670" y2="216" stroke="#c9bb7a" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.8"/><line x1="95" y1="116" x2="100" y2="116" stroke="#4f5d36" stroke-width="1.2"/><text x="91" y="120" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="end">1 GiB</text><line x1="100" y1="116" x2="670" y2="116" stroke="#c9bb7a" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.8"/><line x1="134.713" y1="316" x2="134.713" y2="321" stroke="#4f5d36" stroke-width="1.2"/><text x="134.713" y="335" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle">1k</text><line x1="277.734" y1="316" x2="277.734" y2="321" stroke="#4f5d36" stroke-width="1.2"/><text x="277.734" y="335" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle">4k</text><line x1="420.755" y1="316" x2="420.755" y2="321" stroke="#4f5d36" stroke-width="1.2"/><text x="420.755" y="335" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle">16k</text><line x1="492.266" y1="316" x2="492.266" y2="321" stroke="#4f5d36" stroke-width="1.2"/><text x="492.266" y="335" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle">32k</text><line x1="635.287" y1="316" x2="635.287" y2="321" stroke="#4f5d36" stroke-width="1.2"/><text x="635.287" y="335" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle">128k</text><line x1="100" y1="316" x2="670" y2="316" stroke="#4f5d36" stroke-width="1.6"/><line x1="100" y1="316" x2="100" y2="48" stroke="#4f5d36" stroke-width="1.6"/><text x="385" y="354" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="middle">sequence length N (tokens)</text><path d="M134.713 206 L635.287 66 L635.287 226 L134.713 296 Z" fill="#f6ebc4" stroke="#8a5a00" stroke-width="0" opacity="0.9"/><line x1="134.713" y1="206" x2="635.287" y2="66" stroke="#a3283f" stroke-width="3"/><line x1="134.713" y1="296" x2="635.287" y2="226" stroke="#4f5d36" stroke-width="3"/><circle cx="134.713" cy="206" r="5" fill="#a3283f" stroke="#ffffff" stroke-width="1.4"/><text x="138.713" y="194" font-size="11.5" font-weight="700" fill="#a3283f" text-anchor="start">2 MiB</text><circle cx="277.734" cy="166" r="5" fill="#a3283f" stroke="#ffffff" stroke-width="1.4"/><text x="269.734" y="158" font-size="11.5" font-weight="700" fill="#a3283f" text-anchor="end">32 MiB</text><circle cx="420.755" cy="126" r="5" fill="#a3283f" stroke="#ffffff" stroke-width="1.4"/><text x="412.755" y="118" font-size="11.5" font-weight="700" fill="#a3283f" text-anchor="end">512 MiB</text><circle cx="492.266" cy="106" r="5" fill="#a3283f" stroke="#ffffff" stroke-width="1.4"/><text x="484.266" y="98" font-size="11.5" font-weight="700" fill="#a3283f" text-anchor="end">2 GiB</text><circle cx="635.287" cy="66" r="5" fill="#a3283f" stroke="#ffffff" stroke-width="1.4"/><text x="627.287" y="58" font-size="11.5" font-weight="700" fill="#a3283f" text-anchor="end">32 GiB</text><circle cx="134.713" cy="296" r="5" fill="#4f5d36" stroke="#ffffff" stroke-width="1.4"/><text x="144.713" y="288" font-size="11.5" font-weight="700" fill="#4f5d36" text-anchor="start">4 KiB</text><circle cx="492.266" cy="246" r="5" fill="#4f5d36" stroke="#ffffff" stroke-width="1.4"/><text x="492.266" y="266" font-size="11.5" font-weight="700" fill="#4f5d36" text-anchor="middle">128 KiB</text><circle cx="635.287" cy="226" r="5" fill="#4f5d36" stroke="#ffffff" stroke-width="1.4"/><text x="635.287" y="246" font-size="11.5" font-weight="700" fill="#4f5d36" text-anchor="end">512 KiB</text><text x="245.608" y="170.985" font-size="1" font-weight="400" fill="#2c361c" text-anchor="middle"></text><text x="116" y="96" font-size="12.5" font-weight="700" fill="#a3283f" text-anchor="start">standard attention: S stored in FP16</text><text x="116" y="113" font-size="12" font-weight="400" fill="#a3283f" text-anchor="start">grows with N²</text><text x="560" y="288" font-size="12.5" font-weight="700" fill="#4f5d36" text-anchor="end">FlashAttention: one FP32 value per row</text><text x="560" y="305" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="end">grows with N</text><text x="360" y="214" font-size="12" font-weight="700" fill="#8a5a00" text-anchor="middle" font-style="italic">memory that FlashAttention never allocates</text><text x="360" y="372" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">Multiply by heads, layers kept for backward, and batch size for real training memory.</text><text x="360" y="390" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">At 128k tokens a single head's matrix is 32 GiB: it cannot be materialised.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>KV cache size formula</title><desc>The KV cache size is the product of two for K and V, the number of layers, batch size, number of KV heads, sequence length, head dimension and bytes per element. For Llama-2-7B in FP16 with 4096 tokens at batch size 1 this is 2 GiB. The bar chart compares bytes per token for multi-head, grouped-query and multi-query layouts.</desc><defs></defs><rect width="720" height="400" fill="#ffffff"/><text x="20" y="26" font-size="14" font-weight="700" fill="#3a3226" text-anchor="start">KV cache bytes = product of seven factors</text><rect x="27" y="44" width="78" height="58" rx="10" fill="#f3ecdc" stroke="#6b5f4d" stroke-width="1.5"/><text x="66" y="80" font-size="22" font-weight="700" fill="#3a3226" text-anchor="middle">2</text><text x="66" y="120" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="middle">K and V</text><text x="115" y="80" font-size="18" font-weight="700" fill="#6b5f4d" text-anchor="middle">×</text><rect x="125" y="44" width="78" height="58" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="164" y="80" font-size="22" font-weight="700" fill="#3a3226" text-anchor="middle">L</text><text x="164" y="120" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="middle">layers</text><text x="213" y="80" font-size="18" font-weight="700" fill="#6b5f4d" text-anchor="middle">×</text><rect x="223" y="44" width="78" height="58" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="262" y="80" font-size="22" font-weight="700" fill="#3a3226" text-anchor="middle">B</text><text x="262" y="120" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="middle">batch</text><text x="311" y="80" font-size="18" font-weight="700" fill="#6b5f4d" text-anchor="middle">×</text><rect x="321" y="44" width="78" height="58" rx="10" fill="#f6ecd6" stroke="#6b5f4d" stroke-width="1.5"/><text x="360" y="80" font-size="22" font-weight="700" fill="#3a3226" text-anchor="middle">H_kv</text><text x="360" y="120" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="middle">KV heads</text><text x="409" y="80" font-size="18" font-weight="700" fill="#6b5f4d" text-anchor="middle">×</text><rect x="419" y="44" width="78" height="58" rx="10" fill="#f6ecd6" stroke="#6b5f4d" stroke-width="1.5"/><text x="458" y="80" font-size="22" font-weight="700" fill="#3a3226" text-anchor="middle">T</text><text x="458" y="120" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="middle">tokens</text><text x="507" y="80" font-size="18" font-weight="700" fill="#6b5f4d" text-anchor="middle">×</text><rect x="517" y="44" width="78" height="58" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="556" y="80" font-size="22" font-weight="700" fill="#3a3226" text-anchor="middle">d</text><text x="556" y="120" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="middle">head dim</text><text x="605" y="80" font-size="18" font-weight="700" fill="#6b5f4d" text-anchor="middle">×</text><rect x="615" y="44" width="78" height="58" rx="10" fill="#f3ecdc" stroke="#6b5f4d" stroke-width="1.5"/><text x="654" y="80" font-size="22" font-weight="700" fill="#3a3226" text-anchor="middle">b</text><text x="654" y="120" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="middle">bytes each</text><rect x="14" y="140" width="692" height="92" rx="12" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="30" y="164" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="start">Llama-2-7B, FP16, batch 1, 4096 tokens</text><text x="30" y="190" font-size="15" font-weight="700" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">2 × 32 × 1 × 32 × 4096 × 128 × 2 B  =  2,147,483,648 B  =  2 GiB</text><text x="30" y="216" font-size="13" font-weight="400" fill="#6b5f4d" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">per token: 2 × 32 × 32 × 128 × 2 B = 524,288 B = 512 KiB</text><text x="20" y="262" font-size="14" font-weight="700" fill="#3a3226" text-anchor="start">Bytes per token for the same model (32 layers, d = 128, FP16)</text><text x="30" y="299" font-size="12.5" font-weight="400" fill="#3a3226" text-anchor="start">MHA, 32 KV heads</text><rect x="190" y="282" width="400" height="24" rx="3" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.3"/><text x="598" y="299" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="start">512 KiB</text><text x="30" y="335" font-size="12.5" font-weight="400" fill="#3a3226" text-anchor="start">GQA, 8 KV heads</text><rect x="190" y="318" width="100" height="24" rx="3" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.3"/><text x="298" y="335" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="start">128 KiB</text><text x="30" y="371" font-size="12.5" font-weight="400" fill="#3a3226" text-anchor="start">MQA, 1 KV head</text><rect x="190" y="354" width="12.5" height="24" rx="3" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.3"/><text x="210.5" y="371" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="start">16 KiB</text></svg>

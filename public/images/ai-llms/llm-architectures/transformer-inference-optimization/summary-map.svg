<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 302" width="720" height="302" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Post 04 at a glance: making inference fast</title><desc>A map of post 04 in four columns. The bottleneck: decoding is memory-bound, the roofline ridge is about 156 FLOPs per byte, per-token time is bytes divided by bandwidth, and batching raises reuse. The KV cache: its size formula, fewer heads with GQA and MQA, paging and prefix sharing, and prefill versus decode. FlashAttention: tiles in SRAM, a fused kernel, online softmax and linear extra memory. Quantization: number formats, scales and zero points, GPTQ and QAT, and FP32 softmax and norms.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker></defs><rect width="720" height="302" fill="#ffffff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#3a3226" text-anchor="start">Post 04 at a glance: making inference fast</text><rect x="10" y="44" width="161.5" height="192" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="90.75" y="71" font-size="13.5" font-weight="700" fill="#3a3226" text-anchor="middle">The bottleneck</text><rect x="20" y="88" width="141.5" height="28" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="90.75" y="106.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">memory-bound decode</text><rect x="20" y="124" width="141.5" height="28" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="90.75" y="142.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">roofline: ridge ≈ 156</text><rect x="20" y="160" width="141.5" height="28" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="90.75" y="178.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">t ≈ bytes ÷ bandwidth</text><rect x="20" y="196" width="141.5" height="28" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="90.75" y="214.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">batching raises reuse</text><line x1="173.5" y1="66" x2="187.5" y2="66" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="189.5" y="44" width="161.5" height="192" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="270.25" y="71" font-size="13.5" font-weight="700" fill="#3a3226" text-anchor="middle">KV cache</text><rect x="199.5" y="88" width="141.5" height="28" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="270.25" y="106.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">2·L·B·H·T·d·b bytes</text><rect x="199.5" y="124" width="141.5" height="28" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="270.25" y="142.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">GQA, MQA: fewer heads</text><rect x="199.5" y="160" width="141.5" height="28" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="270.25" y="178.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">paged, prefix-shared</text><rect x="199.5" y="196" width="141.5" height="28" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="270.25" y="214.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">prefill vs decode</text><line x1="353" y1="66" x2="367" y2="66" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="369" y="44" width="161.5" height="192" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="449.75" y="71" font-size="13.5" font-weight="700" fill="#3a3226" text-anchor="middle">FlashAttention</text><rect x="379" y="88" width="141.5" height="28" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="449.75" y="106.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">tiles in SRAM</text><rect x="379" y="124" width="141.5" height="28" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="449.75" y="142.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">one fused kernel</text><rect x="379" y="160" width="141.5" height="28" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="449.75" y="178.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">online softmax</text><rect x="379" y="196" width="141.5" height="28" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="449.75" y="214.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">O(N) extra memory</text><line x1="532.5" y1="66" x2="546.5" y2="66" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="548.5" y="44" width="161.5" height="192" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="629.25" y="71" font-size="13.5" font-weight="700" fill="#3a3226" text-anchor="middle">Quantization</text><rect x="558.5" y="88" width="141.5" height="28" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="629.25" y="106.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">FP16, BF16, FP8, INT8</text><rect x="558.5" y="124" width="141.5" height="28" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="629.25" y="142.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">scale and zero point</text><rect x="558.5" y="160" width="141.5" height="28" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="629.25" y="178.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">GPTQ, QAT with STE</text><rect x="558.5" y="196" width="141.5" height="28" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="629.25" y="214.5" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">FP32 softmax, norms</text><rect x="10" y="252" width="700" height="36" rx="10" fill="#f6e9c8" stroke="#8a5a00" stroke-width="1.3"/><text x="360" y="275" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">Inference speed is mostly about moving fewer bytes, less often.</text></svg>

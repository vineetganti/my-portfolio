<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" width="720" height="392" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Decoding with and without a KV cache</title><desc>Rows are decoding steps and columns are tokens. Without a cache, every step recomputes keys and values for every token in the context, 18 computations over four steps. With a cache, only the prefill and the one new token per step are computed, 6 computations, and the rest are read from the cache.</desc><defs></defs><rect width="720" height="392" fill="#fffdf8"/><rect x="10" y="10" width="340" height="300" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="180" y="34" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Without a KV cache</text><text x="114" y="62" font-size="12" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">The</text><text x="156" y="62" font-size="12" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">cat</text><text x="198" y="62" font-size="12" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">sat</text><text x="240" y="62" font-size="12" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">on</text><text x="282" y="62" font-size="12" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">the</text><text x="324" y="62" font-size="12" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">mat</text><text x="26" y="93" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start">prefill</text><rect x="94" y="74" width="40" height="28" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.3"/><text x="114" y="92" font-size="10.5" font-weight="700" fill="#9a5400" text-anchor="middle">K,V</text><rect x="136" y="74" width="40" height="28" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.3"/><text x="156" y="92" font-size="10.5" font-weight="700" fill="#9a5400" text-anchor="middle">K,V</text><rect x="178" y="74" width="40" height="28" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.3"/><text x="198" y="92" font-size="10.5" font-weight="700" fill="#9a5400" text-anchor="middle">K,V</text><text x="26" y="137" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start">step 2</text><rect x="94" y="118" width="40" height="28" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.3"/><text x="114" y="136" font-size="10.5" font-weight="700" fill="#9a5400" text-anchor="middle">K,V</text><rect x="136" y="118" width="40" height="28" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.3"/><text x="156" y="136" font-size="10.5" font-weight="700" fill="#9a5400" text-anchor="middle">K,V</text><rect x="178" y="118" width="40" height="28" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.3"/><text x="198" y="136" font-size="10.5" font-weight="700" fill="#9a5400" text-anchor="middle">K,V</text><rect x="220" y="118" width="40" height="28" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.3"/><text x="240" y="136" font-size="10.5" font-weight="700" fill="#9a5400" text-anchor="middle">K,V</text><text x="26" y="181" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start">step 3</text><rect x="94" y="162" width="40" height="28" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.3"/><text x="114" y="180" font-size="10.5" font-weight="700" fill="#9a5400" text-anchor="middle">K,V</text><rect x="136" y="162" width="40" height="28" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.3"/><text x="156" y="180" font-size="10.5" font-weight="700" fill="#9a5400" text-anchor="middle">K,V</text><rect x="178" y="162" width="40" height="28" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.3"/><text x="198" y="180" font-size="10.5" font-weight="700" fill="#9a5400" text-anchor="middle">K,V</text><rect x="220" y="162" width="40" height="28" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.3"/><text x="240" y="180" font-size="10.5" font-weight="700" fill="#9a5400" text-anchor="middle">K,V</text><rect x="262" y="162" width="40" height="28" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.3"/><text x="282" y="180" font-size="10.5" font-weight="700" fill="#9a5400" text-anchor="middle">K,V</text><text x="26" y="225" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start">step 4</text><rect x="94" y="206" width="40" height="28" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.3"/><text x="114" y="224" font-size="10.5" font-weight="700" fill="#9a5400" text-anchor="middle">K,V</text><rect x="136" y="206" width="40" height="28" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.3"/><text x="156" y="224" font-size="10.5" font-weight="700" fill="#9a5400" text-anchor="middle">K,V</text><rect x="178" y="206" width="40" height="28" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.3"/><text x="198" y="224" font-size="10.5" font-weight="700" fill="#9a5400" text-anchor="middle">K,V</text><rect x="220" y="206" width="40" height="28" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.3"/><text x="240" y="224" font-size="10.5" font-weight="700" fill="#9a5400" text-anchor="middle">K,V</text><rect x="262" y="206" width="40" height="28" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.3"/><text x="282" y="224" font-size="10.5" font-weight="700" fill="#9a5400" text-anchor="middle">K,V</text><rect x="304" y="206" width="40" height="28" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.3"/><text x="324" y="224" font-size="10.5" font-weight="700" fill="#9a5400" text-anchor="middle">K,V</text><text x="180" y="282" font-size="14" font-weight="700" fill="#b0273f" text-anchor="middle">18 K/V computations</text><text x="180" y="300" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">in total</text><rect x="370" y="10" width="340" height="300" rx="14" fill="#faf3e3" stroke="#5e5241
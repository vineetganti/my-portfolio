eight="28" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.3"/><text x="516" y="224" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">cache</text><rect x="538" y="206" width="40" height="28" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.3"/><text x="558" y="224" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">cache</text><rect x="580" y="206" width="40" height="28" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.3"/><text x="600" y="224" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">cache</text><rect x="622" y="206" width="40" height="28" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.3"/><text x="642" y="224" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">cache</text><rect x="664" y="206" width="40" height="28" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.3"/><text x="684" y="224" font-size="10.5" font-weight="700" fill="#9a5400" text-anchor="middle">K,V</text><text x="540" y="282" font-size="14" font-weight="700" fill="#5e5241" text-anchor="middle">6 K/V computations</text><text x="540" y="300" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">in total</text><rect x="130" y="326" width="14" height="14" rx="3" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><text x="150" y="338" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">compute K and V for this token</text><rect x="380" y="326" width="14" height="14" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="400" y="338" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">read K and V from the cache</text><text x="360" y="372" font-size="12.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">Projection work per step falls from O(T) to O(1). Attention still reads all T cached entries, so it stays O(T).</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" width="720" height="392" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>PagedAttention: a block table maps logical blocks to physical blocks</title><desc>Two sequences each see their KV cache as a list of logical blocks of 16 tokens. A per-sequence block table maps each logical block to a physical block anywhere in GPU memory. Physical blocks of different sequences interleave, free blocks are reused, and only the last block of a sequence can be partly empty.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a5400"/></marker></defs><rect width="720" height="392" fill="#fffdf8"/><text x="20" y="24" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Logical view: what each sequence sees</text><text x="20" y="238" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Physical GPU memory: blocks of 16 tokens</text><rect x="23" y="262" width="62" height="44" rx="6" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><text x="54" y="289" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">A1</text><text x="54" y="324" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">P0</text><rect x="91" y="262" width="62" height="44" rx="6" fill="#fffdf8" stroke="#7a6d57" stroke-width="1.4" stroke-dasharray="4 3"/><text x="122" y="289" font-size="13" font-weight="700" fill="#7a6d57" text-anchor="middle" font-style="italic">free</text><text x="122" y="324" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">P1</text><rect x="159" y="262" width="62" height="44" rx="6" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><text x="190" y="289" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">A0</text><text x="190" y="324" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">P2</text><rect x="227" y="262" width="62" height="44" rx="6" fill="#fffdf8" stroke="#7a6d57" stroke-width="1.4" stroke-dasharray="4 3"/><text x="258" y="289" font-size="13" font-weight="700" fill="#7a6d57" text-anchor="middle" font-style="italic">free</text><text x="258" y="324" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">P3</text><rect x="295" y="262" width="62" height="44" rx="6" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.4"/><text x="326" y="289" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">B0</text><text x="326" y="324" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">P4</text><rect x="363" y="262" width="62" height="44" rx="6" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><text x="394" y="289" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">A2</text><text x="394" y="324" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">P5</text><rect x="431" y="262" width="62" height="44" rx="6" fill="#fffdf8" stroke="#7a6d57" stroke-width="1.4" stroke-dasharray="4 3"/><text x="462" y="289" font-size="13" font-weight="700" fill="#7a6d57" text-anchor="middle" font-style="italic">free</text><text x="462" y="324" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">P6</text><rect x="499" y="262" width="62" height="44" rx="6" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.4"/><text x="530" y="289" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">B1</text><text x="530" y="324" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">P7</text><rect x="567" y="262" width="62" height="44" rx="6" fill="#fffdf8" stroke="#7a6d57" stroke-width="1.4" stroke-dasharray="4 3"/><text x="598" y="289" font-size="13" font-weight="700" fill="#7a6d57" text-anchor="middle" font-style="italic">free</text><text x="598" y="324" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">P8</text><rect x="635" y="262" width="62" height="44" rx="6" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.4"/><text x="666" y="289" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">B2</text><text x="666" y="324" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">P9</text><text x="20" y="54" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">sequence A</text><rect x="20" y="66" width="76" height="44" rx="6" fill="#fffdf8" stroke="#5e5241" stroke-width="1.4"/><rect x="20" y="66" width="76" height="44" rx="6" fill="#dfedcc"/><rect x="20" y="66" width="76" height="44" rx="6" fill="none" stroke="#5e5241" stroke-width="1.4"/><text x="58" y="85" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">logical 0</text><text x="58" y="101" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">16 / 16 used</text><line x1="58" y1="112" x2="190" y2="259" stroke="#5e5241" stroke-width="1.5" marker-end="url(#ah-4f5d36)" opacity="0.9"/><rect x="106" y="66" width="76" height="44" rx="6" fill="#fffdf8" stroke="#5e5241" stroke-width="1.4"/><rect x="106" y="66" width="76" height="44" rx="6" fill="#dfedcc"/><rect x="106" y="66" width="76" height="44" rx="6" fill="none" stroke="#5e5241" stroke-width="1.4"/><text x="144" y="85" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">logical 1</text><text x="144" y="101" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">16 / 16 used</text><line x1="144" y1="112" x2="54" y2="259" stroke="#5e5241" stroke-width="1.5" marker-end="url(#ah-4f5d36)" opacity="0.9"/><rect x="192" y="66" width="76" height="44" rx="6" fill="#fffdf8" stroke="#5e5241" stroke-width="1.4"/><rect x="192" y="66" width="28.5" height="44" rx="6" fill="#dfedcc"/><rect x="192" y="66" width="76" height="44" rx="6" fill="none" stroke="#5e5241" stroke-width="1.4"/><text x="230" y="85" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">logical 2</text><text x="230" y="101" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">6 / 16 used</text><line x1="230" y1="112" x2="394" y2="259" stroke="#5e5241" stroke-width="1.5" marker-end="url(#ah-4f5d36)" opacity="0.9"/><text x="116" y="54" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">block table</text><text x="192" y="54" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">[P2, P0, P5]</text><text x="392" y="54" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">sequence B</text><rect x="392" y="66" width="76" height="44" rx="6" fill="#fffdf8" stroke="#9a5400" stroke-width="1.4"/><rect x="392" y="66" width="76" height="44" rx="6" fill="#fdf0d4"/><rect x="392" y="66" width="76" height="44" rx="6" fill="none" stroke="#9a5400" stroke-width="1.4"/><text x="430" y="85" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">logical 0</text><text x="430" y="101" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">16 / 16 used</text><line x1="430" y1="112" x2="326" y2="259" stroke="#9a5400" stroke-width="1.5" marker-end="url(#ah-8a5a00)" opacity="0.9"/><rect x="478" y="66" width="76" height="44" rx="6" fill="#fffdf8" stroke="#9a5400" stroke-width="1.4"/><rect x="478" y="66" width="76" height="44" rx="6" fill="#fdf0d4"/><rect x="478" y="66" width="76" height="44" rx="6" fill="none" stroke="#9a5400" stroke-width="1.4"/><text x="516" y="85" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">logical 1</text><text x="516" y="101" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">16 / 16 used</text><line x1="516" y1="112" x2="530" y2="259" stroke="#9a5400" stroke-width="1.5" marker-end="url(#ah-8a5a00)" opacity="0.9"/><rect x="564" y="66" width="76" height="44" rx="6" fill="#fffdf8" stroke="#9a5400" stroke-width="1.4"/><rect x="564" y="66" width="42.75" height="44" rx="6" fill="#fdf0d4"/><rect x="564" y="66" width="76" height="44" rx="6" fill="none" stroke="#9a5400" stroke-width="1.4"/><text x="602" y="85" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">logical 2</text><text x="602" y="101" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">9 / 16 used</text><line x1="602" y1="112" x2="666" y2="259" stroke="#9a5400" stroke-width="1.5" marker-end="url(#ah-8a5a00)" opacity="0.9"/><text x="488" y="54" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">block table</text><text x="564" y="54" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">[P4, P7, P9]</text><text x="360" y="352" font-size="12.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">Contiguous allocation (reserve max_len per request) used only 20–38% of KV memory for real tokens in the vLLM paper.</text><text x="360" y="372" font-size="12.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">With paging, at most one partial block per sequence is wasted, and freed blocks are reused by any sequence.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 472" width="720" height="472" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>FlashAttention v1 versus v2</title><desc>Each grid shows the order in which score tiles are visited. Version 1 loops over key and value blocks in the outer loop, so the partial outputs for every query block are read and written to HBM repeatedly. Version 2 loops over query blocks in the outer loop and keeps the output block in SRAM, which also lets different query blocks run in parallel on different thread blocks.</desc><defs></defs><rect width="720" height="472" fill="#ffffff"/><rect x="10" y="10" width="340" height="452" rx="14" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="180" y="34" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">FlashAttention v1</text><text x="180" y="51" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">outer loop: K/V blocks, inner loop: Q blocks</text><rect x="92" y="76" width="44" height="44" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.8"/><text x="114" y="103" font-size="13" font-weight="700" fill="#8a5a00" text-anchor="middle">1</text><rect x="136" y="76" width="44" height="44" rx="0" fill="#ffffff" stroke="#4f5d36" stroke-width="1.1"/><text x="158" y="103" font-size="13" font-weight="400" fill="#4f5d36" text-anchor="middle">5</text><rect x="180" y="76" width="44" height="44" rx="0" fill="#ffffff" stroke="#4f5d36" stroke-width="1.1"/><text x="202" y="103" font-size="13" font-weight="400" fill="#4f5d36" text-anchor="middle">9</text><rect x="224" y="76" width="44" height="44" rx="0" fill="#ffffff" stroke="#4f5d36" stroke-width="1.1"/><text x="246" y="103" font-size="13" font-weight="400" fill="#4f5d36" text-anchor="middle">13</text><rect x="92" y="120" width="44" height="44" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.8"/><text x="114" y="147" font-size="13" font-weight="700" fill="#8a5a00" text-anchor="middle">2</text><rect x="136" y="120" width="44" height="44" rx="0" fill="#ffffff" stroke="#4f5d36" stroke-width="1.1"/><text x="158" y="147" font-size="13" font-weight="400" fill="#4f5d36" text-anchor="middle">6</text><rect x="180" y="120" width="44" height="44" rx="0" fill="#ffffff" stroke="#4f5d36" stroke-width="1.1"/><text x="202" y="147" font-size="13" font-weight="400" fill="#4f5d36" text-anchor="middle">10</text><rect x="224" y="120" width="44" height="44" rx="0" fill="#ffffff" stroke="#4f5d36" stroke-width="1.1"/><text x="246" y="147" font-size="13" font-weight="400" fill="#4f5d36" text-anchor="middle">14</text><rect x="92" y="164" width="44" height="44" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.8"/><text x="114" y="191" font-size="13" font-weight="700" fill="#8a5a00" text-anchor="middle">3</text><rect x="136" y="164" width="44" height="44" rx="0" fill="#ffffff" stroke="#4f5d36" stroke-width="1.1"/><text x="158" y="191" font-size="13" font-weight="400" fill="#4f5d36" text-anchor="middle">7</text><rect x="180" y="164" width="44" height="44" rx="0" fill="#ffffff" stroke="#4f5d36" stroke-width="1.1"/><text x="202" y="191" font-size="13" font-weight="400" fill="#4f5d36" text-anchor="middle">11</text><rect x="224" y="164" width="44" height="44" rx="0" fill="#ffffff" stroke="#4f5d36" stroke-width="1.1"/><text x="246" y="191" font-size="13" font-weight="400" fill="#4f5d36" text-anchor="middle">15</text><rect x="92" y="208" width="44" height="44" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.8"/><text x="114" y="235" font-size="13" font-weight="700" fill="#8a5a00" text-anchor="middle">4</text><rect x="136" y="208" width="44" height="44" rx="0" fill="#ffffff" stroke="#4f5d36" stroke-width="1.1"/><text x="158" y="235" font-size="13" font-weight="400" fill="#4f5d36" text-anchor="middle">8</text><rect x="180" y="208" width="44" height="44" rx="0" fill="#ffffff" stroke="#4f5d36" stroke-width="1.1"/><text x="202" y="235" font-size="13" font-weight="400" fill="#4f5d36" text-anchor="middle">12</text><rect x="224" y="208" width="44" height="44" rx="0" fill="#ffffff" stroke="#4f5d36" stroke-width="1.1"/><text x="246" y="235" font-size="13" font-weight="400" fill="#4f5d36" text-anchor="middle">16</text><text x="180" y="68" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">K/V blocks →</text><text transform="translate(78 164) rotate(-90)" font-size="11.5" font-style="italic" fill="#4f5d36" text-anchor="middle">Q blocks →</text><text x="180" y="272" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">numbers = order in which tiles are visited</text><text x="180" y="300" font-size="12" font-weight="400" fill="#a3283f" text-anchor="middle">each K/V block is held in SRAM while</text><text x="180" y="315.5" font-size="12" font-weight="400" fill="#a3283f" text-anchor="middle">every Q block streams past it, so the</text><text x="180" y="331" font-size="12" font-weight="400" fill="#a3283f" text-anchor="middle">running O_i, m_i, l_i of every row are</text><text x="180" y="346.5" font-size="12" font-weight="400" fill="#a3283f" text-anchor="middle">loaded from and stored to HBM again</text><text x="180" y="362" font-size="12" font-weight="400" fill="#a3283f" text-anchor="middle">and again</text><text x="180" y="402" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="middle">work split inside a block: K is split</text><text x="180" y="417.5" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="middle">across warps, so partial results need</text><text x="180" y="433" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="middle">shared memory and a sync</text><rect x="370" y="10" width="340" height="452" rx="14" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="540" y="34" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">FlashAttention v2</text><text x="540" y="51" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">outer loop: Q blocks, inner loop: K/V blocks</text><rect x="452" y="76" width="44" height="44" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.8"/><text x="474" y="103" font-size="13" font-weight="700" fill="#8a5a00" text-anchor="middle">1</text><rect x="496" y="76" width="44" height="44" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.8"/><text x="518" y="103" font-size="13" font-weight="700" fill="#8a5a00" text-anchor="middle">2</text><rect x="540" y="76" width="44" height="44" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.8"/><text x="562" y="103" font-size="13" font-weight="700" fill="#8a5a00" text-anchor="middle">3</text><rect x="584" y="76" width="44" height="44" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.8"/><text x="606" y="103" font-size="13" font-weight="700" fill="#8a5a00" text-anchor="middle">4</text><rect x="452" y="120" width="44" height="44" rx="0" fill="#ffffff" stroke="#4f5d36" stroke-width="1.1"/><text x="474" y="147" font-size="13" font-weight="400" fill="#4f5d36" text-anchor="middle">5</text><rect x="496" y="120" width="44" height="44" rx="0" fill="#ffffff" stroke="#4f5d36" stroke-width="1.1"/><text x="518" y="147" font-size="13" font-weight="400" fill="#4f5d36" text-anchor="middle">6</text><rect x="540" y="120" width="44" height="44" rx="0" fill="#ffffff" stroke="#4f5d36" stroke-width="1.1"/><text x="562" y="147" font-size="13" font-weight="400" fill="#4f5d36" text-anchor="middle">7</text><rect x="584" y="120" width="44" height="44" rx="0" fill="#ffffff" stroke="#4f5d36" stroke-width="1.1"/><text x="606" y="147" font-size="13" font-weight="400" fill="#4f5d36" text-anchor="middle">8</text><rect x="452" y="164" width="44" height="44" rx="0" fill="#ffffff" stroke="#4f5d36" stroke-width="1.1"/><text x="474" y="191" font-size="13" font-weight="400" fill="#4f5d36" text-anchor="middle">9</text><rect x="496" y="164" width="44" height="44" rx="0" fill="#ffffff" stroke="#4f5d36" stroke-width="1.1"/><text x="518" y="191" font-size="13" font-weight="400" fill="#4f5d36" text-anchor="middle">10</text><rect x="540" y="164" width="44" height="44" rx="0" fill="#ffffff" stroke="#4f5d36" stroke-width="1.1"/><text x="562" y="191" font-size="13" font-weight="400" fill="#4f5d36" text-anchor="middle">11</text><rect x="584" y="164" width="44" height="44" rx="0" fill="#ffffff" stroke="#4f5d36" stroke-width="1.1"/><text x="606" y="191" font-size="13" font-weight="400" fill="#4f5d36" text-anchor="middle">12</text><rect x="452" y="208" width="44" height="44" rx="0" fill="#ffffff" stroke="#4f5d36" stroke-width="1.1"/><text x="474" y="235" font-size="13" font-weight="400" fill="#4f5d36" text-anchor="middle">13</text><rect x="496" y="208" width="44" height="44" rx="0" fill="#ffffff" stroke="#4f5d36" stroke-width="1.1"/><text x="518" y="235" font-size="13" font-weight="400" fill="#4f5d36" text-anchor="middle">14</text><rect x="540" y="208" width="44" height="44" rx="0" fill="#ffffff" stroke="#4f5d36" stroke-width="1.1"/><text x="562" y="235" font-size="13" font-weight="400" fill="#4f5d36" text-anchor="middle">15</text><rect x="584" y="208" width="44" height="44" rx="0" fill="#ffffff" stroke="#4f5d36" stroke-width="1.1"/><text x="606" y="235" font-size="13" font-weight="400" fill="#4f5d36" text-anchor="middle">16</text><text x="540" y="68" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">K/V blocks →</text><text transform="translate(438 164) rotate(-90)" font-size="11.5" font-style="italic" fill="#4f5d36" text-anchor="middle">Q blocks →</text><text x="540" y="272" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">numbers = order in which tiles are visited</text><text x="540" y="300" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="middle">each Q block stays in SRAM with its</text><text x="540" y="315.5" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="middle">O_i, m_i, l_i while K/V blocks stream</text><text x="540" y="331" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="middle">past, and O_i is written to HBM once</text><text x="540" y="346.5" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="middle"></text><text x="540" y="362" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="middle">different Q blocks are independent,</text><text x="540" y="377.5" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="middle">so they run on different SMs</text><text x="540" y="402" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="middle">work split inside a block: Q is split</text><text x="540" y="417.5" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="middle">across warps, no communication needed</text></svg>

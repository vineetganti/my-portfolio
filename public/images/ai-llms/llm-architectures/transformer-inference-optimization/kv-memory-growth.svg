<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="720" height="372" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>VRAM use as the context grows</title><desc>Stacked bars for Llama-2-7B in FP16 at batch size 1. The weights take a fixed 12.6 GiB. The KV cache adds 0.5, 2, 8, 16, 32 and 64 GiB at 1k, 4k, 16k, 32k, 64k and 128k tokens, and at 128k the total passes the capacity of an 80 GB GPU.</desc><defs></defs><rect width="720" height="372" fill="#ffffff"/><text x="20" y="24" font-size="14" font-weight="700" fill="#2c361c" text-anchor="start">Llama-2-7B, FP16, batch 1: weights are fixed, the KV cache is not</text><line x1="70" y1="92.3667" x2="700" y2="92.3667" stroke="#a3283f" stroke-width="1.6" stroke-dasharray="7 4"/><text x="76" y="86.3667" font-size="11.5" font-weight="700" fill="#a3283f" text-anchor="start">80 GB GPU ≈ 74.5 GiB</text><line x1="70" y1="296" x2="700" y2="296" stroke="#4f5d36" stroke-width="1.6"/><rect x="100" y="261.56" width="62" height="34.44" rx="2" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.3"/><rect x="100" y="260.193" width="62" height="1.36667" rx="2" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.3"/><text x="131" y="252.193" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">13.1 GiB</text><text x="131" y="314" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="middle">1k tokens</text><rect x="198" y="261.56" width="62" height="34.44" rx="2" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.3"/><rect x="198" y="256.093" width="62" height="5.46667" rx="2" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.3"/><text x="229" y="248.093" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">14.6 GiB</text><text x="229" y="314" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="middle">4k tokens</text><rect x="296" y="261.56" width="62" height="34.44" rx="2" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.3"/><rect x="296" y="239.693" width="62" height="21.8667" rx="2" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.3"/><text x="327" y="231.693" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">20.6 GiB</text><text x="327" y="314" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="middle">16k tokens</text><text x="327" y="254.627" font-size="12" font-weight="700" fill="#8a5a00" text-anchor="middle">+8</text><rect x="394" y="261.56" width="62" height="34.44" rx="2" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.3"/><rect x="394" y="217.827" width="62" height="43.7333" rx="2" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.3"/><text x="425" y="209.827" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">28.6 GiB</text><text x="425" y="314" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="middle">32k tokens</text><text x="425" y="243.693" font-size="12" font-weight="700" fill="#8a5a00" text-anchor="middle">+16</text><rect x="492" y="261.56" width="62" height="34.44" rx="2" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.3"/><rect x="492" y="174.093" width="62" height="87.4667" rx="2" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.3"/><text x="523" y="166.093" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">44.6 GiB</text><text x="523" y="314" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="middle">64k tokens</text><text x="523" y="221.827" font-size="12" font-weight="700" fill="#8a5a00" text-anchor="middle">+32</text><rect x="590" y="261.56" width="62" height="34.44" rx="2" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.3"/><rect x="590" y="86.6267" width="62" height="174.933" rx="2" fill="#f3e5ab" stroke="#a3283f" stroke-width="1.8"/><text x="621" y="78.6267" font-size="12" font-weight="700" fill="#a3283f" text-anchor="middle">76.6 GiB</text><text x="621" y="314" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="middle">128k tokens</text><text x="621" y="178.093" font-size="12" font-weight="700" fill="#8a5a00" text-anchor="middle">+64</text><text x="621" y="108.627" font-size="13" font-weight="700" fill="#a3283f" text-anchor="middle">OOM</text><rect x="100" y="326" width="14" height="14" rx="2" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="120" y="338" font-size="12" font-weight="400" fill="#2c361c" text-anchor="start">weights, 12.6 GiB (fixed)</text><rect x="300" y="326" width="14" height="14" rx="2" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><text x="320" y="338" font-size="12" font-weight="400" fill="#2c361c" text-anchor="start">KV cache: 0.5 MiB per token, times the batch size</text></svg>

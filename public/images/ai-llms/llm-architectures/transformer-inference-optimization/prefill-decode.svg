" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="505" y="262" width="30" height="30" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="535" y="262" width="30" height="30" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="565" y="262" width="30" height="30" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="595" y="262" width="30" height="30" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><text x="535" y="104" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">keys  K  (6, from the cache)</text><text transform="translate(433 202) rotate(-90)" font-size="11.5" font-style="italic" fill="#4f5d36" text-anchor="middle">queries  Q  (6)</text><text x="535" y="314" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">only the last row is computed</text><text x="535" y="334" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">green: finished in earlier steps</text><text x="537" y="362" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">q (1×d) · Kᵀ (d×6)  →  s (1×6)</text><text x="537" y="384" font-size="12" font-weight="700" fill="#a3283f" text-anchor="middle">vector × matrix: low intensity, memory-bound</text></svg>

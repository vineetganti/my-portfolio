<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" width="720" height="410" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Prefill versus decode in the attention score matrix</title><desc>Left: during prefill the whole lower triangle of the score matrix is computed at once, a matrix times matrix product. Right: during a decode step only the newest row is needed, a vector times matrix product against the cached keys, because the earlier rows were produced by earlier steps.</desc><defs></defs><rect width="720" height="410" fill="#ffffff"/><rect x="10" y="10" width="345" height="390" rx="14" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="182.5" y="34" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">Prefill: the whole prompt at once</text><text x="182.5" y="51" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">5 prompt tokens</text><rect x="90" y="112" width="30" height="30" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="120" y="112" width="30" height="30" rx="0" fill="#efefe0" stroke="#c9bb7a" stroke-width="1"/><rect x="150" y="112" width="30" height="30" rx="0" fill="#efefe0" stroke="#c9bb7a" stroke-width="1"/><rect x="180" y="112" width="30" height="30" rx="0" fill="#efefe0" stroke="#c9bb7a" stroke-width="1"/><rect x="210" y="112" width="30" height="30" rx="0" fill="#efefe0" stroke="#c9bb7a" stroke-width="1"/><rect x="90" y="142" width="30" height="30" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="120" y="142" width="30" height="30" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="150" y="142" width="30" height="30" rx="0" fill="#efefe0" stroke="#c9bb7a" stroke-width="1"/><rect x="180" y="142" width="30" height="30" rx="0" fill="#efefe0" stroke="#c9bb7a" stroke-width="1"/><rect x="210" y="142" width="30" height="30" rx="0" fill="#efefe0" stroke="#c9bb7a" stroke-width="1"/><rect x="90" y="172" width="30" height="30" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="120" y="172" width="30" height="30" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="150" y="172" width="30" height="30" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="180" y="172" width="30" height="30" rx="0" fill="#efefe0" stroke="#c9bb7a" stroke-width="1"/><rect x="210" y="172" width="30" height="30" rx="0" fill="#efefe0" stroke="#c9bb7a" stroke-width="1"/><rect x="90" y="202" width="30" height="30" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="120" y="202" width="30" height="30" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="150" y="202" width="30" height="30" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="180" y="202" width="30" height="30" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="210" y="202" width="30" height="30" rx="0" fill="#efefe0" stroke="#c9bb7a" stroke-width="1"/><rect x="90" y="232" width="30" height="30" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="120" y="232" width="30" height="30" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="150" y="232" width="30" height="30" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="180" y="232" width="30" height="30" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="210" y="232" width="30" height="30" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><text x="165" y="104" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">keys  K  (5)</text><text transform="translate(78 187) rotate(-90)" font-size="11.5" font-style="italic" fill="#4f5d36" text-anchor="middle">queries  Q  (5)</text><text x="165" y="284" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">all 15 cells computed in parallel</text><text x="165" y="304" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">grey: masked (future tokens)</text><text x="182" y="362" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Q (5×d) · Kᵀ (d×5)  →  S (5×5)</text><text x="182" y="384" font-size="12" font-weight="700" fill="#8a5a00" text-anchor="middle">matrix × matrix: high intensity, compute-bound</text><rect x="365" y="10" width="345" height="390" rx="14" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="537.5" y="34" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">Decode: one new token</text><text x="537.5" y="51" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">token 6 arrives</text><rect x="445" y="112" width="30" height="30" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="475" y="112" width="30" height="30" rx="0" fill="#efefe0" stroke="#c9bb7a" stroke-width="1"/><rect x="505" y="112" width="30" height="30" rx="0" fill="#efefe0" stroke="#c9bb7a" stroke-width="1"/><rect x="535" y="112" width="30" height="30" rx="0" fill="#efefe0" stroke="#c9bb7a" stroke-width="1"/><rect x="565" y="112" width="30" height="30" rx="0" fill="#efefe0" stroke="#c9bb7a" stroke-width="1"/><rect x="595" y="112" width="30" height="30" rx="0" fill="#efefe0" stroke="#c9bb7a" stroke-width="1"/><rect x="445" y="142" width="30" height="30" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="475" y="142" width="30" height="30" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="505" y="142" width="30" height="30" rx="0" fill="#efefe0" stroke="#c9bb7a" stroke-width="1"/><rect x="535" y="142" width="30" height="30" rx="0" fill="#efefe0" stroke="#c9bb7a" stroke-width="1"/><rect x="565" y="142" width="30" height="30" rx="0" fill="#efefe0" stroke="#c9bb7a" stroke-width="1"/><rect x="595" y="142" width="30" height="30" rx="0" fill="#efefe0" stroke="#c9bb7a"
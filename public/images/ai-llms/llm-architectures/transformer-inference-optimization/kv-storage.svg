<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Two ways to keep a contiguous KV cache</title><desc>Left: growing by concatenation allocates a new, larger buffer every step and copies the old cache into it. Right: a static cache reserves the maximum length once and writes each new token in place, at the cost of holding memory that is not yet used.</desc><defs><marker id="ah-7d8257" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8d8068"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a00"/></marker></defs><rect width="720" height="350" fill="#ffffff"/><rect x="10" y="10" width="345" height="330" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="182.5" y="34" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Grow by concatenation</text><text x="182.5" y="51" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">torch.cat along the sequence axis</text><text x="28" y="84" font-size="12" font-weight="700" fill="#3a3226" text-anchor="start">step t: 4 tokens</text><rect x="28" y="94" width="28" height="28" rx="2" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><rect x="56" y="94" width="28" height="28" rx="2" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><rect x="84" y="94" width="28" height="28" rx="2" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><rect x="112" y="94" width="28" height="28" rx="2" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><line x1="42" y1="124" x2="42" y2="162" stroke="#8d8068" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ah-7d8257)"/><line x1="70" y1="124" x2="70" y2="162" stroke="#8d8068" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ah-7d8257)"/><line x1="98" y1="124" x2="98" y2="162" stroke="#8d8068" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ah-7d8257)"/><line x1="126" y1="124" x2="126" y2="162" stroke="#8d8068" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#ah-7d8257)"/><rect x="28" y="166" width="28" height="28" rx="2" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><rect x="56" y="166" width="28" height="28" rx="2" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><rect x="84" y="166" width="28" height="28" rx="2" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><rect x="112" y="166" width="28" height="28" rx="2" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><rect x="140" y="166" width="28" height="28" rx="2" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.2"/><text x="176" y="185" font-size="11.5" font-weight="700" fill="#8a5a00" text-anchor="start">← new token</text><text x="28" y="216" font-size="12" font-weight="700" fill="#3a3226" text-anchor="start">step t+1: allocate a bigger buffer, copy, append</text><rect x="28" y="228" width="112" height="22" rx="2" fill="#ffffff" stroke="#8d8068" stroke-width="1.2" stroke-dasharray="4 3"/><text x="152" y="243" font-size="11.5" font-weight="400" fill="#8d8068" text-anchor="start" font-style="italic">old buffer freed</text><text x="28" y="282" font-size="12" font-weight="400" fill="#a3283f" text-anchor="start">O(T) bytes copied every step</text><text x="28" y="299" font-size="12" font-weight="400" fill="#a3283f" text-anchor="start">allocator churn, fragmentation,</text><text x="28" y="316" font-size="12" font-weight="400" fill="#a3283f" text-anchor="start">shape changes break CUDA graphs</text><rect x="365" y="10" width="345" height="330" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="537.5" y="34" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Preallocate max_len</text><text x="537.5" y="51" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">StaticCache: write in place</text><text x="383" y="84" font-size="12" font-weight="700" fill="#3a3226" text-anchor="start">one buffer, allocated once</text><rect x="383" y="94" width="29" height="28" rx="2" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><rect x="412" y="94" width="29" height="28" rx="2" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><rect x="441" y="94" width="29" height="28" rx="2" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><rect x="470" y="94" width="29" height="28" rx="2" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><rect x="499" y="94" width="29" height="28" rx="2" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><rect x="528" y="94" width="29" height="28" rx="2" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.2"/><rect x="557" y="94" width="29" height="28" rx="2" fill="#ffffff" stroke="#8d8068" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="586" y="94" width="29" height="28" rx="2" fill="#ffffff" stroke="#8d8068" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="615" y="94" width="29" height="28" rx="2" fill="#ffffff" stroke="#8d8068" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="644" y="94" width="29" height="28" rx="2" fill="#ffffff" stroke="#8d8068" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="542.5" y1="164" x2="542.5" y2="126" stroke="#8a5a00" stroke-width="1.8" marker-end="url(#ah-8a5a00)"/><text x="542.5" y="182" font-size="12" font-weight="700" fill="#8a5a00" text-anchor="middle">write at position t</text><text x="383" y="218" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="start">filled</text><text x="538" y="218" font-size="11.5" font-weight="400" fill="#8d8068" text-anchor="start" font-style="italic">reserved but empty</text><line x1="383" y1="226" x2="528" y2="226" stroke="#6b5f4d" stroke-width="1.6"/><line x1="557" y1="226" x2="673" y2="226" stroke="#8d8068" stroke-width="1.6" stroke-dasharray="3 3"/><text x="383" y="278" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="start">no copies, fixed shapes (torch.compile, CUDA graphs)</text><text x="383" y="295" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="start">but max_len is reserved for every sequence</text><text x="383" y="312" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="start">even if most of it is never used</text></svg>

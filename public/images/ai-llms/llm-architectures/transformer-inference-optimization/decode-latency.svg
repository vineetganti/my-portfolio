<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" width="720" height="392" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Decode latency per token versus context length</title><desc>A stacked chart of the idealised time per decode step. Reading the weights costs a constant 7 milliseconds. Reading the KV cache adds time that grows linearly with context length and overtakes the weight cost at about 27 thousand tokens.</desc><defs></defs><rect width="720" height="392" fill="#ffffff"/><text x="20" y="24" font-size="14" font-weight="700" fill="#2c361c" text-anchor="start">Idealised time per generated token, batch 1 (Llama-2-7B, FP16, 2 TB/s)</text><rect x="84" y="204.111" width="580" height="87.8889" rx="0" fill="#e9efcf"/><path d="M84 204.111 L664 204.111 L664 96.2597 Z" fill="#f3e5ab" stroke="#8a5a00" stroke-width="0"/><line x1="84" y1="204.111" x2="664" y2="204.111" stroke="#4f5d36" stroke-width="1.4"/><line x1="84" y1="204.111" x2="664" y2="96.2597" stroke="#8a5a00" stroke-width="2.6"/><line x1="84" y1="292" x2="664" y2="292" stroke="#4f5d36" stroke-width="1.6"/><line x1="84" y1="292" x2="84" y2="58" stroke="#4f5d36" stroke-width="1.6"/><line x1="84" y1="292" x2="84" y2="297" stroke="#4f5d36" stroke-width="1.2"/><text x="84" y="311" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle">0</text><line x1="229" y1="292" x2="229" y2="297" stroke="#4f5d36" stroke-width="1.2"/><text x="229" y="311" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle">8k</text><line x1="374" y1="292" x2="374" y2="297" stroke="#4f5d36" stroke-width="1.2"/><text x="374" y="311" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle">16k</text><line x1="519" y1="292" x2="519" y2="297" stroke="#4f5d36" stroke-width="1.2"/><text x="519" y="311" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle">24k</text><line x1="664" y1="292" x2="664" y2="297" stroke="#4f5d36" stroke-width="1.2"/><text x="664" y="311" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle">32k</text><line x1="79" y1="292" x2="84" y2="292" stroke="#4f5d36" stroke-width="1.2"/><text x="75" y="296" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="end">0</text><line x1="79" y1="229.222" x2="84" y2="229.222" stroke="#4f5d36" stroke-width="1.2"/><text x="75" y="233.222" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="end">5</text><line x1="79" y1="166.444" x2="84" y2="166.444" stroke="#4f5d36" stroke-width="1.2"/><text x="75" y="170.444" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="end">10</text><line x1="79" y1="103.667" x2="84" y2="103.667" stroke="#4f5d36" stroke-width="1.2"/><text x="75" y="107.667" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="end">15</text><text x="374" y="330" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="middle">context length T (tokens already in the KV cache)</text><text transform="translate(26 179) rotate(-90)" font-size="12.5" fill="#4f5d36" text-anchor="middle">ms per token</text><text x="100" y="249.311" font-size="13" font-weight="700" fill="#2c361c" text-anchor="start">read the weights: 14 GB ÷ 2 TB/s = 7 ms (constant)</text><text x="444" y="165.189" font-size="13" font-weight="700" fill="#8a5a00" text-anchor="start">read the KV cache: grows with T</text><line x1="556.646" y1="204.111" x2="556.646" y2="292" stroke="#8a5a00" stroke-width="1.3" stroke-dasharray="5 4"/><text x="550.646" y="284" font-size="11.5" font-weight="700" fill="#8a5a00" text-anchor="end">≈27k tokens: KV reads = weight reads</text><text x="360" y="362" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">t_token ≈ (weight bytes + B · T · KV bytes per token) ÷ HBM bandwidth</text><text x="360" y="380" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">More sequences in the batch (B) make the KV term dominate sooner.</text></svg>

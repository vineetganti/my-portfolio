<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>How FlashAttention tiles the attention computation</title><desc>The N by N score matrix is divided into tiles. For one block of queries Q_i, the kernel sweeps across blocks of keys and values K_j and V_j, keeping the running maximum, running sum and output accumulator for that query block in SRAM, and writes the output block to HBM once at the end.</desc><defs><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a5400"/></marker><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="420" fill="#fffdf8"/><text x="20" y="24" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">The score matrix S is never stored: it is swept tile by tile</text><rect x="96" y="86" width="42" height="42" rx="0" fill="#f3eadb" stroke="#dccfb1" stroke-width="1"/><rect x="138" y="86" width="42" height="42" rx="0" fill="#f3eadb" stroke="#dccfb1" stroke-width="1"/><rect x="180" y="86" width="42" height="42" rx="0" fill="#f3eadb" stroke="#dccfb1" stroke-width="1"/><rect x="222" y="86" width="42" height="42" rx="0" fill="#f3eadb" stroke="#dccfb1" stroke-width="1"/><rect x="264" y="86" width="42" height="42" rx="0" fill="#f3eadb" stroke="#dccfb1" stroke-width="1"/><rect x="306" y="86" width="42" height="42" rx="0" fill="#f3eadb" stroke="#dccfb1" stroke-width="1"/><rect x="96" y="128" width="42" height="42" rx="0" fill="#f3eadb" stroke="#dccfb1" stroke-width="1"/><rect x="138" y="128" width="42" height="42" rx="0" fill="#f3eadb" stroke="#dccfb1" stroke-width="1"/><rect x="180" y="128" width="42" height="42" rx="0" fill="#f3eadb" stroke="#dccfb1" stroke-width="1"/><rect x="222" y="128" width="42" height="42" rx="0" fill="#f3eadb" stroke="#dccfb1" stroke-width="1"/><rect x="264" y="128" width="42" height="42" rx="0" fill="#f3eadb" stroke="#dccfb1" stroke-width="1"/><rect x="306" y="128" width="42" height="42" rx="0" fill="#f3eadb" stroke="#dccfb1" stroke-width="1"/><rect x="96" y="170" width="42" height="42" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.6"/><rect x="138" y="170" width="42" height="42" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.6"/><rect x="180" y="170" width="42" height="42" rx="0" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.6"/><rect x="222" y="170" width="42" height="42" rx="0" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.6"/><rect x="264" y="170" width="42" height="42" rx="0" fill="#fffdf8" stroke="#5e5241" stroke-width="1.6" stroke-dasharray="3 3"/><rect x="306" y="170" width="42" height="42" rx="0" fill="#fffdf8" stroke="#5e5241" stroke-width="1.6" stroke-dasharray="3 3"/><rect x="96" y="212" width="42" height="42" rx="0" fill="#f3eadb" stroke="#dccfb1" stroke-width="1"/><rect x="138" y="212" width="42" height="42" rx="0" fill="#f3eadb" stroke="#dccfb1" stroke-width="1"/><rect x="180" y="212" width="42" height="42" rx="0" fill="#f3eadb" stroke="#dccfb1" stroke-width="1"/><rect x="222" y="212" width="42" height="42" rx="0" fill="#f3eadb" stroke="#dccfb1" stroke-width="1"/><rect x="264" y="212" width="42" height="42" rx="0" fill="#f3eadb" stroke="#dccfb1" stroke-width="1"/><rect x="306" y="212" width="42" height="42" rx="0" fill="#f3eadb" stroke="#dccfb1" stroke-width="1"/><rect x="96" y="254" width="42" height="42" rx="0" fill="#f3eadb" stroke="#dccfb1" stroke-width="1"/><rect x="138" y="254" width="42" height="42" rx="0" fill="#f3eadb" stroke="#dccfb1" stroke-width="1"/><rect x="180" y="254" width="42" height="42" rx="0" fill="#f3eadb" stroke="#dccfb1" stroke-width="1"/><rect x="222" y="254" width="42" height="42" rx="0" fill="#f3eadb" stroke="#dccfb1" stroke-width="1"/><rect x="264" y="254" width="42" height="42" rx="0" fill="#f3eadb" stroke="#dccfb1" stroke-width="1"/><rect x="306" y="254" width="42" height="42" rx="0" fill="#f3eadb" stroke="#dccfb1" stroke-width="1"/><rect x="96" y="296" width="42" height="42" rx="0" fill="#f3eadb" stroke="#dccfb1" stroke-width="1"/><rect x="138" y="296" width="42" height="42" rx="0" fill="#f3eadb" stroke="#dccfb1" stroke-width="1"/><rect x="180" y="296" width="42" height="42" rx="0" fill="#f3eadb" stroke="#dccfb1" stroke-width="1"/><rect x="222" y="296" width="42" height="42" rx="0" fill="#f3eadb" stroke="#dccfb1" stroke-width="1"/><rect x="264" y="296" width="42" height="42" rx="0" fill="#f3eadb" stroke="#dccfb1" stroke-width="1"/><rect x="306" y="296" width="42" height="42" rx="0" fill="#f3eadb" stroke="#dccfb1" stroke-width="1"/><rect x="222" y="170" width="42" height="42" rx="0" fill="#fdf0d4" stroke="#9a5400" stroke-width="2.6"/><text x="243" y="196" font-size="12" font-weight="700" fill="#9a5400" text-anchor="middle">S_ij</text><text x="222" y="58" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">K/V blocks  j = 1 … Tc</text><text transform="translate(56 212) rotate(-90)" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Q blocks  i = 1 … Tr</text><text x="117" y="78" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">1</text><text x="86" y="111" font-size="11" font-weight="400" fill="#5e5241" text-anchor="end">1</text><text x="159" y="78" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">2</text><text x="86" y="153" font-size="11" font-weight="400" fill="#5e5241" text-anchor="end">2</text><text x="201" y="78" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">3</text><text x="86" y="195" font-size="11" font-weight="400" fill="#5e5241" text-anchor="end">3</text><text x="243" y="78" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">4</text><text x="86" y="237" font-size="11" font-weight="400" fill="#5e5241" text-anchor="end">4</text><text x="285" y="78" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">5</text><text x="86" y="279" font-size="11" font-weight="400" fill="#5e5241" text-anchor="end">5</text><text x="327" y="78" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">6</text><text x="86" y="321" font-size="11" font-weight="400" fill="#5e5241" text-anchor="end">6</text><line x1="100" y1="228" x2="344" y2="228" stroke="#9a5400" stroke-width="2" marker-end="url(#ah-8a5a00)"/><text x="222" y="246" font-size="11.5" font-weight="700" fill="#9a5400" text-anchor="middle">inner loop: sweep j for this Q block</text><text x="222" y="364" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">green: done · amber: now · dashed: still to come</text><text x="222" y="382" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">grey: other Q blocks (other SMs in FlashAttention-2)</text><rect x="390" y="50" width="320" height="78" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5" stroke-dasharray="6 4"/><text x="550" y="77.95" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">HBM</text><text x="550" y="94.07" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle">Q, K, V and the output O</text><text x="550" y="109.02" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle">each tile is read once per use</text><rect x="390" y="190" width="320" height="196" rx="12" fill="#faf3e3" stroke="#5e5241" stroke-width="1.6"/><text x="550" y="212" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">SRAM, for the current (i, j)</text><rect x="404" y="224" width="292" height="32" rx="6" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.3"/><text x="416" y="245" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Q_i K_j V_j</text><text x="686" y="245" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="end">input tiles</text><rect x="404" y="264" width="292" height="32" rx="6" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.3"/><text x="416" y="285" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">m_i</text><text x="686" y="285" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="end">running row max</text><rect x="404" y="304" width="292" height="32" rx="6" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.3"/><text x="416" y="325" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">l_i</text><text x="686" y="325" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="end">running row sum</text><rect x="404" y="344" width="292" height="32" rx="6" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.3"/><text x="416" y="365" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">O_i</text><text x="686" y="365" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="end">partial output (rescaled)</text><line x1="450" y1="130" x2="450" y2="188" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><text x="462" y="164" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">load tiles</text><line x1="650" y1="188" x2="650" y2="130" stroke="#9a5400" stroke-width="1.8" marker-end="url(#ah-8a5a00)"/><text x="638" y="164" font-size="11.5" font-weight="700" fill="#9a5400" text-anchor="end">write O_i once</text></svg>

52" x2="467.165" y2="202" stroke="#8a5a00" stroke-width="1.3" stroke-dasharray="3 3"/><circle cx="467.165" cy="148" r="5.5" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.6"/><circle cx="467.165" cy="206" r="5.5" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.6"/><text x="467.165" y="136" font-size="12" font-weight="700" fill="#8a5a00" text-anchor="middle">0.35</text><text x="467.165" y="228" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">35</text><line x1="670" y1="152" x2="670" y2="202" stroke="#8a5a00" stroke-width="1.3" stroke-dasharray="3 3"/><circle cx="670" cy="148" r="5.5" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.6"/><circle cx="670" cy="206" r="5.5" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.6"/><text x="670" y="136" font-size="12" font-weight="700" fill="#8a5a00" text-anchor="middle">1.27</text><text x="670" y="228" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">127</text><rect x="10" y="256" width="700" height="236" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="26" y="282" font-size="14" font-weight="700" fill="#3a3226" text-anchor="start">Asymmetric (activations): a zero-point shifts the range</text><text x="26" y="306" font-size="12.5" font-weight="400" fill="#6b5f4d" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">s = (max − min) / 255 = 2.55 / 255 = 0.01</text><text x="26" y="324" font-size="12.5" font-weight="400" fill="#6b5f4d" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">z = round(−min / s) = 50</text><text x="26" y="342" font-size="12.5" font-weight="400" fill="#6b5f4d" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">q = clamp(round(x / s) + z, 0, 255)    x̂ = s · (q − z)</text><text x="22" y="398" font-size="12" font-weight="700" fill="#3a3226" text-anchor="start">float x</text><text x="22" y="456" font-size="12" font-weight="700" fill="
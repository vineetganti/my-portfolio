<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 524" width="720" height="524" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Mapping floating-point values to INT8</title><desc>Top panel, symmetric quantization: the float range minus 1.27 to 1.27 maps to integers minus 127 to 127 with a scale of 0.01, and zero maps to zero. Bottom panel, asymmetric quantization: the float range minus 0.5 to 2.05 maps to 0 to 255 with a scale of 0.01 and a zero point of 50.</desc><defs></defs><rect width="720" height="524" fill="#ffffff"/><rect x="10" y="10" width="700" height="236" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="26" y="36" font-size="14" font-weight="700" fill="#3a3226" text-anchor="start">Symmetric (weights): zero stays zero</text><text x="26" y="60" font-size="12.5" font-weight="400" fill="#6b5f4d" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">s = α / 127 = 1.27 / 127 = 0.01</text><text x="26" y="78" font-size="12.5" font-weight="400" fill="#6b5f4d" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">q = clamp(round(x / s), −127, 127)</text><text x="26" y="96" font-size="12.5" font-weight="400" fill="#6b5f4d" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">x̂ = s · q</text><text x="22" y="152" font-size="12" font-weight="700" fill="#3a3226" text-anchor="start">float x</text><text x="22" y="210" font-size="12" font-weight="700" fill="#3a3226" text-anchor="start">integer q</text><line x1="110" y1="148" x2="670" y2="148" stroke="#6b5f4d" stroke-width="2"/><line x1="110" y1="206" x2="670" y2="206" stroke="#6b5f4d" stroke-width="2"/><line x1="110" y1="202" x2="110" y2="210" stroke="#8d8068" stroke-width="0.8"/><line x1="132.047" y1="202" x2="132.047" y2="210" stroke="#8d8068" stroke-width="0.8"/><line x1="154.094" y1="202" x2="154.094" y2="210" stroke="#8d8068" stroke-width="0.8"/><line x1="176.142" y1="202" x2="176.142" y2="210" stroke="#8d8068" stroke-width="0.8"/><line x1="198.189" y1="202" x2="198.189" y2="210" stroke="#8d8068" stroke-width="0.8"/><line x1="220.236" y1="202" x2="220.236" y2="210" stroke="#8d8068" stroke-width="0.8"/><line x1="242.283" y1="202" x2="242.283" y2="210" stroke="#8d8068" stroke-width="0.8"/><line x1="264.331" y1="202" x2="264.331" y2="210" stroke="#8d8068" stroke-width="0.8"/><line x1="286.378" y1="202" x2="286.378" y2="210" stroke="#8d8068" stroke-width="0.8"/><line x1="308.425" y1="202" x2="308.425" y2="210" stroke="#8d8068" stroke-width="0.8"/><line x1="330.472" y1="202" x2="330.472" y2="210" stroke="#8d8068" stroke-width="0.8"/><line x1="352.52" y1="202" x2="352.52" y2="210" stroke="#8d8068" stroke-width="0.8"/><line x1="374.567" y1="202" x2="374.567" y2="210" stroke="#8d8068" stroke-width="0.8"/><line x1="396.614" y1="202" x2="396.614" y2="210" stroke="#8d8068" stroke-width="0.8"/><line x1="418.661" y1="202" x2="418.661" y2="210" stroke="#8d8068" stroke-width="0.8"/><line x1="440.709" y1="202" x2="440.709" y2="210" stroke="#8d8068" stroke-width="0.8"/><line x1="462.756" y1="202" x2="462.756" y2="210" stroke="#8d8068" stroke-width="0.8"/><line x1="484.803" y1="202" x2="484.803" y2="210" stroke="#8d8068" stroke-width="0.8"/><line x1="506.85" y1="202" x2="506.85" y2="210" stroke="#8d8068" stroke-width="0.8"/><line x1="528.898" y1="202" x2="528.898" y2="210" stroke="#8d8068" stroke-width="0.8"/><line x1="550.945" y1="202" x2="550.945" y2="210" stroke="#8d8068" stroke-width="0.8"/><line x1="572.992" y1="202" x2="572.992" y2="210" stroke="#8d8068" stroke-width="0.8"/><line x1="595.039" y1="202" x2="595.039" y2="210" stroke="#8d8068" stroke-width="0.8"/><line x1="617.087" y1="202" x2="617.087" y2="210" stroke="#8d8068" stroke-width="0.8"/><line x1="639.134" y1="202" x2="639.134" y2="210" stroke="#8d8068" stroke-width="0.8"/><line x1="661.181" y1="202" x2="661.181" y2="210" stroke="#8d8068
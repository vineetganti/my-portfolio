<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Prefix caching shares KV blocks between requests</title><desc>Two requests start with the same system prompt. Their block tables point at the same three physical blocks, which carry a reference count of two, so request two skips the prefill for those tokens. Only the blocks that differ are private to each request.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a00"/></marker></defs><rect width="720" height="340" fill="#ffffff"/><text x="20" y="36" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="start">request 1</text><rect x="60" y="46" width="84" height="34" rx="6" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.4"/><text x="102" y="66.45" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="middle">system 0</text><rect x="158" y="46" width="84" height="34" rx="6" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.4"/><text x="200" y="66.45" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="middle">system 1</text><rect x="256" y="46" width="84" height="34" rx="6" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.4"/><text x="298" y="66.45" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="middle">system 2</text><rect x="354" y="46" width="84" height="34" rx="6" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.4"/><text x="396" y="66.45" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="middle">user A 0</text><rect x="452" y="46" width="84" height="34" rx="6" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.4"/><text x="494" y="66.45" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="middle">user A 1</text><text x="650" y="154" font-size="12" font-weight="700" fill="#3a3226" text-anchor="start">physical</text><text x="650" y="169" font-size="12" font-weight="700" fill="#3a3226" text-anchor="start">blocks</text><rect x="60" y="136" width="84" height="44" rx="6" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.8"/><text x="102" y="157" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">S0</text><text x="102" y="173" font-size="11" font-weight="700" fill="#8a5a00" text-anchor="middle">ref count 2</text><rect x="158" y="136" width="84" height="44" rx="6" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.8"/><text x="200" y="157" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">S1</text><text x="200" y="173" font-size="11" font-weight="700" fill="#8a5a00" text-anchor="middle">ref count 2</text><rect x="256" y="136" width="84" height="44" rx="6" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.8"/><text x="298" y="157" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">S2</text><text x="298" y="173" font-size="11" font-weight="700" fill="#8a5a00" text-anchor="middle">ref count 2</text><rect x="354" y="136" width="84" height="44" rx="6" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.4"/><text x="396" y="162.2" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">A0</text><rect x="452" y="136" width="84" height="44" rx="6" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.4"/><text x="494" y="162.2" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">A1</text><rect x="550" y="136" width="84" height="44" rx="6" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.4"/><text x="592" y="162.2" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">B0</text><line x1="102" y1="82" x2="102" y2="134" stroke="#6b5f4d" stroke-width="1.5" marker-end="url(#ah-4f5d36)"/><line x1="200" y1="82" x2="200" y2="134" stroke="#6b5f4d" stroke-width="1.5" marker-end="url(#ah-4f5d36)"/><line x1="298" y1="82" x2="298" y2="134" stroke="#6b5f4d" stroke-width="1.5" marker-end="url(#ah-4f5d36)"/><line x1="396" y1="82" x2="396" y2="134" stroke="#6b5f4d" stroke-width="1.5" marker-end="url(#ah-4f5d36)"/><line x1="494" y1="82" x2="494" y2="134" stroke="#6b5f4d" stroke-width="1.5" marker-end="url(#ah-4f5d36)"/><text x="20" y="240" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="start">request 2</text><rect x="60" y="248" width="84" height="34" rx="6" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.4"/><text x="102" y="268.45" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="middle">system 0</text><line x1="102" y1="246" x2="102" y2="182" stroke="#6b5f4d" stroke-width="1.5" marker-end="url(#ah-4f5d36)"/><rect x="158" y="248" width="84" height="34" rx="6" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.4"/><text x="200" y="268.45" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="middle">system 1</text><line x1="200" y1="246" x2="200" y2="182" stroke="#6b5f4d" stroke-width="1.5" marker-end="url(#ah-4f5d36)"/><rect x="256" y="248" width="84" height="34" rx="6" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.4"/><text x="298" y="268.45" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="middle">system 2</text><line x1="298" y1="246" x2="298" y2="182" stroke="#6b5f4d" stroke-width="1.5" marker-end="url(#ah-4f5d36)"/><rect x="354" y="248" width="84" height="34" rx="6" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.4"/><text x="396" y="268.45" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="middle">user B 0</text><line x1="396" y1="246" x2="592" y2="182" stroke="#8a5a00" stroke-width="1.5" marker-end="url(#ah-8a5a00)"/><text x="360" y="312" font-size="12.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">A block's identity is a hash of its tokens and everything before them, so equal prefixes find the same blocks.</text><text x="360" y="330" font-size="12.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">Request 2 skips prefill for 3 blocks and starts decoding after its own user tokens: lower time to first token.</text></svg>

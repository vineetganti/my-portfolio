<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 382" width="720" height="382" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Why softmax subtracts the maximum first</title><desc>For the logits 12 and 14, exp gives 162,755 and 1,202,604, both above the FP16 maximum of 65,504, so they become infinity and the division gives NaN. Subtracting the maximum 14 first gives exponents minus 2 and 0, values 0.135 and 1, and the correct probabilities 0.119 and 0.881.</desc><defs><marker id="ah-a3283f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b0273f"/></marker><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="382" fill="#fffdf8"/><text x="20" y="24" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">softmax([12, 14]) in FP16</text><rect x="10" y="40" width="340" height="236" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="180" y="64" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Naive</text><rect x="28" y="74" width="304" height="52" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.4"/><text x="40" y="95" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start">e^z</text><text x="40" y="114" font-size="12.5" font-weight="400" fill="#b0273f" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">[162,755 , 1,202,604]</text><line x1="180" y1="128" x2="180" y2="138" stroke="#b0273f" stroke-width="1.6" marker-end="url(#ah-a3283f)"/><rect x="28" y="140" width="304" height="52" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.4"/><text x="40" y="161" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start">fits in FP16?</text><text x="40" y="180" font-size="12.5" font-weight="400" fill="#b0273f" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">no: max is 65,504, so [inf , inf]</text><line x1="180" y1="194" x2="180" y2="204" stroke="#b0273f" stroke-width="1.6" marker-end="url(#ah-a3283f)"/><rect x="28" y="206" width="304" height="52" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.4"/><text x="40" y="227" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start">divide by the sum</text><text x="40" y="246" font-size="12.5" font-weight="700" fill="#b0273f" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">inf / inf = NaN</text><rect x="370" y="40" width="340" height="236" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="540" y="64" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Subtract the max first</text><rect x="388" y="74" width="304" height="52" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><text x="400" y="95" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start">z − max(z)</text><text x="400" y="114" font-size="12.5" font-weight="400" fill="#5e5241" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">[12 − 14 , 14 − 14] = [−2 , 0]</text><line x1="540" y1="128" x2="540" y2="138" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="388" y="140" width="304" height="52" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><text x="400" y="161" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start">e^(z − max)</text><text x="400" y="180" font-size="12.5" font-weight="400" fill="#5e5241" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">[0.135 , 1.000]  (all ≤ 1)</text><line x1="540" y1="194" x2="540" y2="204" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="388" y="206" width="304" height="52" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><text x="400" y="227" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start">divide by the sum 1.135</text><text x="400" y="246" font-size="12.5" font-weight="700" fill="#5e5241" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">[0.119 , 0.881]  ✓</text><rect x="14" y="292" width="692" height="78" rx="12" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="30" y="316" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">softmax(z)_j = e^(z_j) / Σ e^(z_k) = e^(z_j − z_max) / Σ e^(z_k − z_max)</text><text x="30" y="340" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="start">Same result: the common factor e^(−z_max) cancels. Only the safe form fits the number format.</text><text x="30" y="358" font-size="12.5" font-weight="400" fill="#5e5241" text-anchor="start">FP16 overflows once z reaches about 11.09 (e^11.09 ≈ 65,504). Fused softmax kernels also accumulate the sum in FP32.</text></svg>

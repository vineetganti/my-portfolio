<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" width="720" height="392" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>How quantized weights run on a GPU</title><desc>Two lanes. W8A8: INT8 weights and activations are multiplied on tensor cores with INT32 accumulation, then rescaled by the product of the two scales. Weight-only INT4: packed 4-bit weights are loaded from HBM, dequantized to FP16 in registers, and multiplied on tensor cores in FP16 with FP32 accumulation.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="392" fill="#fffdf8"/><text x="20" y="24" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Lane A: INT8 weights and activations (W8A8)</text><rect x="14" y="40" width="118" height="62" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.4" stroke-dasharray="6 4"/><text x="73" y="66.8" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">INT8 weights</text><text x="73" y="82.4" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">in HBM, 1 B each</text><line x1="134" y1="71" x2="155" y2="71" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="157" y="40" width="118" height="62" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.4"/><text x="216" y="66.8" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">load into</text><text x="216" y="82.4" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">SRAM / registers</text><line x1="277" y1="71" x2="298" y2="71" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="300" y="40" width="118" height="62" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><text x="359" y="66.8" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">Tensor Core</text><text x="359" y="82.4" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">INT8 × INT8</text><line x1="420" y1="71" x2="441" y2="71" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="443" y="40" width="118" height="62" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.4"/><text x="502" y="66.8" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">INT32 accumulator</text><text x="502" y="82.4" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">no overflow</text><line x1="563" y1="71" x2="584" y2="71" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="586" y="40" width="118" height="62" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.4"/><text x="645" y="66.8" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">rescale</text><text x="645" y="82.4" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">× s_x · s_w → FP16</text><text x="360" y="124" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Y ≈ s_x · s_w · ( X_q · W_qᵀ ),   X_q·W_qᵀ computed entirely in integers</text><text x="20" y="168" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Lane B: weight-only INT4 (GPTQ, AWQ)</text><rect x="14" y="184" width="118" height="62" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.4" stroke-dasharray="6 4"/><text x="73" y="210.8" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">packed INT4</text><text x="73" y="226.4" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">2 weights per byte</text><line x1="134" y1="215" x2="155" y2="215" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="157" y="184" width="118" height="62" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.4"/><text x="216" y="210.8" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">load into</text><text x="216" y="226.4" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">registers</text><line x1="277" y1="215" x2="298" y2="215" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="300" y="184" width="118" height="62" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.4"/><text x="359" y="210.8" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">dequantize</text><text x="359" y="226.4" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">w = s · (q − z) → FP16</text><line x1="420" y1="215" x2="441" y2="215" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="443" y="184" width="118" height="62" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><text x="502" y="210.8" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">Tensor Core</text><text x="502" y="226.4" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">FP16 × FP16 → FP32</text><line x1="563" y1="215" x2="584" y2="215" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="586" y="184" width="118" height="62" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.4"/><text x="645" y="210.8" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">output</text><text x="645" y="226.4" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">FP16</text><text x="360" y="268" font-size="12.5" font-weight="700" fill="#9a5400" text-anchor="middle">the dequantize step is fused into the matmul kernel, so FP16 weights never touch HBM</text><rect x="14" y="292" width="692" height="88" rx="12" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="30" y="316" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">Why it is faster: decode is memory-bound, so fewer bytes per weight means more tokens per second.</text><text x="30" y="338" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">FP16 weights: 2 bytes each.   INT8: 1 byte (2× less traffic).   INT4: ½ byte (4× less traffic).</text><text x="30" y="360" font-size="12.5" font-weight="400" fill="#5e5241" text-anchor="start">Dedicated kernels: cuBLASLt and CUTLASS (INT8), Marlin and bitsandbytes (INT4), TensorRT-LLM.</text></svg>

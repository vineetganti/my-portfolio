<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452" width="720" height="452" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>FlashAttention in training and in inference</title><desc>Four panels. Training forward pass: a fused kernel writes the output and one log-sum-exp value per row, and does not save S or P. Training backward pass: tiles of S and P are recomputed in SRAM from Q, K, V and the saved statistics to produce the gradients. Inference prefill: the same fused forward kernel with nothing saved. Inference decode: Flash-Decoding splits the long KV cache across thread blocks, each computing a partial result that a small reduction merges.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker></defs><rect width="720" height="452" fill="#ffffff"/><rect x="10" y="10" width="345" height="212" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="182.5" y="34" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Training: forward</text><text x="182.5" y="51" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">saves little, not S or P</text><rect x="365" y="10" width="345" height="212" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="537.5" y="34" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Training: backward</text><text x="537.5" y="51" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">recompute instead of store</text><rect x="10" y="234" width="345" height="212" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="182.5" y="258" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Inference: prefill</text><text x="182.5" y="275" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">same kernel, nothing saved</text><rect x="365" y="234" width="345" height="212" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="537.5" y="258" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Inference: decode</text><text x="537.5" y="275" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">Flash-Decoding: split the KV cache</text><rect x="30" y="74" width="80" height="36" rx="8" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.3"/><text x="70" y="95.75" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">Q, K, V</text><rect x="136" y="74" width="96" height="36" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.3"/><text x="184" y="95.75" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">fused kernel</text><line x1="112" y1="92" x2="138" y2="92" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><line x1="234" y1="92" x2="254" y2="92" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="256" y="62" width="90" height="26" rx="6" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.3"/><text x="301" y="78.75" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">O</text><rect x="256" y="96" width="90" height="26" rx="6" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.3"/><text x="301" y="112.45" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="middle">L (N floats)</text><text x="182" y="150" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="middle">L = log-sum-exp of each row</text><text x="182" y="167" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="middle">S and P (N × N) are thrown away</text><text x="182" y="200" font-size="12.5" font-weight="700" fill="#8a5a00" text-anchor="middle">memory: O(N) instead of O(N²)</text><rect x="373" y="74" width="100" height="36" rx="8" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.3"/><text x="423" y="95.45" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="middle">Q, K, V, O, L</text><rect x="491" y="66" width="100" height="52" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.3"/><text x="541" y="87.8" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">recompute</text><text x="541" y="103.4" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">S, P per tile</text><line x1="475" y1="92" x2="489" y2="92" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><line x1="593" y1="92" x2="611" y2="92" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="613" y="66" width="84" height="52" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.3"/><text x="655" y="95.6" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">dQ, dK, dV</text><text x="537" y="150" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="middle">extra FLOPs for the recompute,</text><text x="537" y="167" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="middle">but no N × N tensor is ever stored</text><text x="537" y="200" font-size="12.5" font-weight="700" fill="#8a5a00" text-anchor="middle">trading compute for memory (checkpointing)</text><rect x="24" y="298" width="126" height="36" rx="8" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.3"/><text x="87" y="319.45" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="middle">prompt of N tokens</text><rect x="166" y="298" width="96" height="36" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.3"/><text x="214" y="319.75" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">fused kernel</text><line x1="152" y1="316" x2="164" y2="316" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><line x1="264" y1="316" x2="272" y2="316" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="274" y="298" width="68" height="36" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.3"/><text x="308" y="319.6" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">O + KV</text><text x="182" y="374" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="middle">a long prompt is a big N × N problem,</text><text x="182" y="391" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="middle">so prefill benefits most (time to first token)</text><text x="182" y="424" font-size="12.5" font-weight="700" fill="#8a5a00" text-anchor="middle">no L needed: no backward pass</text><text x="385" y="296" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="start" font-style="italic">KV cache, split along the sequence axis</text><rect x="385" y="302" width="72" height="22" rx="3" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><text x="421" y="318" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">chunk 1</text><line x1="421" y1="326" x2="421" y2="342" stroke="#6b5f4d" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><rect x="389" y="344" width="64" height="26" rx="5" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.2"/><text x="421" y="360.45" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="middle">SM 1</text><line x1="421" y1="372" x2="537" y2="386" stroke="#8d8068" stroke-width="1.2"/><rect x="461" y="302" width="72" height="22" rx="3" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><text x="497" y="318" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">chunk 2</text><line x1="497" y1="326" x2="497" y2="342" stroke="#6b5f4d" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><rect x="465" y="344" width="64" height="26" rx="5" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.2"/><text x="497" y="360.45" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="middle">SM 2</text><line x1="497" y1="372" x2="537" y2="386" stroke="#8d8068" stroke-width="1.2"/><rect x="537" y="302" width="72" height="22" rx="3" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><text x="573" y="318" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">chunk 3</text><line x1="573" y1="326" x2="573" y2="342" stroke="#6b5f4d" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><rect x="541" y="344" width="64" height="26" rx="5" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.2"/><text x="573" y="360.45" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="middle">SM 3</text><line x1="573" y1="372" x2="537" y2="386" stroke="#8d8068" stroke-width="1.2"/><rect x="613" y="302" width="72" height="22" rx="3" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><text x="649" y="318" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">chunk 4</text><line x1="649" y1="326" x2="649" y2="342" stroke="#6b5f4d" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><rect x="617" y="344" width="64" height="26" rx="5" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.2"/><text x="649" y="360.45" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="middle">SM 4</text><line x1="649" y1="372" x2="537" y2="386" stroke="#8d8068" stroke-width="1.2"/><rect x="457" y="386" width="160" height="28" rx="8" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.3"/><text x="537" y="403.6" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">merge (m, l, O) parts</text><text x="537" y="433" font-size="11.5" font-weight="700" fill="#8a5a00" text-anchor="middle">q has 1 row, so parallelise over the KV length</text></svg>

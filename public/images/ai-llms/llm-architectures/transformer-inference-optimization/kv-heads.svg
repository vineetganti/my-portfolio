<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Multi-head, grouped-query and multi-query attention</title><desc>Eight query heads are shown in three layouts. In multi-head attention every query head has its own key and value head, so eight are cached. In grouped-query attention four query heads share each of two KV heads, a quarter of the cache. In multi-query attention all eight share one KV head, an eighth of the cache.</desc><defs></defs><rect width="720" height="330" fill="#ffffff"/><rect x="10" y="10" width="220" height="256" rx="14" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="120" y="34" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">MHA</text><text x="120" y="51" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">every query head has its own K/V</text><text x="120" y="78" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">8 query heads</text><line x1="32" y1="106" x2="32" y2="178" stroke="#7d8257" stroke-width="1.2"/><line x1="57" y1="106" x2="57" y2="178" stroke="#7d8257" stroke-width="1.2"/><line x1="82" y1="106" x2="82" y2="178" stroke="#7d8257" stroke-width="1.2"/><line x1="107" y1="106" x2="107" y2="178" stroke="#7d8257" stroke-width="1.2"/><line x1="132" y1="106" x2="132" y2="178" stroke="#7d8257" stroke-width="1.2"/><line x1="157" y1="106" x2="157" y2="178" stroke="#7d8257" stroke-width="1.2"/><line x1="182" y1="106" x2="182" y2="178" stroke="#7d8257" stroke-width="1.2"/><line x1="207" y1="106" x2="207" y2="178" stroke="#7d8257" stroke-width="1.2"/><circle cx="32" cy="98" r="9" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><circle cx="57" cy="98" r="9" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><circle cx="82" cy="98" r="9" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><circle cx="107" cy="98" r="9" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><circle cx="132" cy="98" r="9" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><circle cx="157" cy="98" r="9" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><circle cx="182" cy="98" r="9" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><circle cx="207" cy="98" r="9" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><rect x="22" y="178" width="20" height="20" rx="3" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.6"/><rect x="47" y="178" width="20" height="20" rx="3" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.6"/><rect x="72" y="178" width="20" height="20" rx="3" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.6"/><rect x="97" y="178" width="20" height="20" rx="3" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.6"/><rect x="122" y="178" width="20" height="20" rx="3" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.6"/><rect x="147" y="178" width="20" height="20" rx="3" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.6"/><rect x="172" y="178" width="20" height="20" rx="3" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.6"/><rect x="197" y="178" width="20" height="20" rx="3" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.6"/><text x="120" y="222" font-size="12" font-weight="700" fill="#8a5a00" text-anchor="middle">8 KV heads cached</text><text x="120" y="247" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">cache: 1×</text><rect x="250" y="10" width="220" height="256" rx="14" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="360" y="34" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">GQA</text><text x="360" y="51" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">groups of query heads share K/V</text><text x="360" y="78" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">8 query heads</text><line x1="272" y1="106" x2="309.5" y2="178" stroke="#7d8257" stroke-width="1.2"/><line x1="297" y1="106" x2="309.5" y2="178" stroke="#7d8257" stroke-width="1.2"/><line x1="322" y1="106" x2="309.5" y2="178" stroke="#7d8257" stroke-width="1.2"/><line x1="347" y1="106" x2="309.5" y2="178" stroke="#7d8257" stroke-width="1.2"/><line x1="372" y1="106" x2="409.5" y2="178" stroke="#7d8257" stroke-width="1.2"/><line x1="397" y1="106" x2="409.5" y2="178" stroke="#7d8257" stroke-width="1.2"/><line x1="422" y1="106" x2="409.5" y2="178" stroke="#7d8257" stroke-width="1.2"/><line x1="447" y1="106" x2="409.5" y2="178" stroke="#7d8257" stroke-width="1.2"/><circle cx="272" cy="98" r="9" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><circle cx="297" cy="98" r="9" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><circle cx="322" cy="98" r="9" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><circle cx="347" cy="98" r="9" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><circle cx="372" cy="98" r="9" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><circle cx="397" cy="98" r="9" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><circle cx="422" cy="98" r="9" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><circle cx="447" cy="98" r="9" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><rect x="299.5" y="178" width="20" height="20" rx="3" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.6"/><rect x="399.5" y="178" width="20" height="20" rx="3" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.6"/><text x="360" y="222" font-size="12" font-weight="700" fill="#8a5a00" text-anchor="middle">2 KV heads cached</text><text x="360" y="247" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">cache: ¼×</text><rect x="490" y="10" width="220" height="256" rx="14" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="600" y="34" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">MQA</text><text x="600" y="51" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">all query heads share one K/V</text><text x="600" y="78" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">8 query heads</text><line x1="512" y1="106" x2="599.5" y2="178" stroke="#7d8257" stroke-width="1.2"/><line x1="537" y1="106" x2="599.5" y2="178" stroke="#7d8257" stroke-width="1.2"/><line x1="562" y1="106" x2="599.5" y2="178" stroke="#7d8257" stroke-width="1.2"/><line x1="587" y1="106" x2="599.5" y2="178" stroke="#7d8257" stroke-width="1.2"/><line x1="612" y1="106" x2="599.5" y2="178" stroke="#7d8257" stroke-width="1.2"/><line x1="637" y1="106" x2="599.5" y2="178" stroke="#7d8257" stroke-width="1.2"/><line x1="662" y1="106" x2="599.5" y2="178" stroke="#7d8257" stroke-width="1.2"/><line x1="687" y1="106" x2="599.5" y2="178" stroke="#7d8257" stroke-width="1.2"/><circle cx="512" cy="98" r="9" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><circle cx="537" cy="98" r="9" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><circle cx="562" cy="98" r="9" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><circle cx="587" cy="98" r="9" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><circle cx="612" cy="98" r="9" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><circle cx="637" cy="98" r="9" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><circle cx="662" cy="98" r="9" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><circle cx="687" cy="98" r="9" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><rect x="589.5" y="178" width="20" height="20" rx="3" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.6"/><text x="600" y="222" font-size="12" font-weight="700" fill="#8a5a00" text-anchor="middle">1 KV head cached</text><text x="600" y="247" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">cache: ⅛×</text><text x="360" y="292" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">Llama-2-7B uses MHA (32 query / 32 KV heads). Llama-3-8B uses GQA (32 / 8). Falcon-7B and PaLM use MQA.</text><text x="360" y="312" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">Fewer KV heads means a smaller KV cache and less HBM traffic per token, at a small cost in quality.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Memory follows requests, not users</title><desc>Left: a request moves from waiting, holding no blocks, to running, holding one block per 16 tokens, to finished, and may be preempted back to waiting with its blocks freed. Right: the block pool holds blocks in use by running requests, cached blocks left by finished requests such as an idle user's last turn, and empty blocks. A returning user's next request can reuse their cached blocks, and when space runs out the least recently used cached blocks are reused first.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-a3283f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b0273f"/></marker></defs><rect width="720" height="350" fill="#fffdf8"/><rect x="10" y="10" width="340" height="300" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="180" y="34" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">A request's states</text><rect x="24" y="86" width="92" height="54" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="70" y="109.6" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">waiting</text><text x="70" y="125.1" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">0 blocks</text><rect x="134" y="86" width="92" height="54" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="180" y="109.6" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">running</text><text x="180" y="125.1" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">⌈T/B⌉ blocks</text><rect x="244" y="86" width="92" height="54" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="290" y="109.6" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">finished</text><text x="290" y="125.1" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">blocks cached</text><rect x="134" y="200" width="92" height="54" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="180" y="223.6" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">preempted</text><text x="180" y="239.1" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">blocks freed</text><line x1="117" y1="113" x2="132" y2="113" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><line x1="227" y1="113" x2="242" y2="113" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><text x="125" y="78" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">admitted</text><text x="236" y="78" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">done</text><line x1="180" y1="141" x2="180" y2="198" stroke="#b0273f" stroke-width="1.6" marker-end="url(#ah-a3283f)"/><text x="188" y="172" font-size="10.5" font-weight="400" fill="#b0273f" text-anchor="start">pool empty</text><path d="M 134 227 L 70 227 L 70 143" fill="none" stroke="#5e5241" stroke-width="1.5" marker-end="url(#ah-4f5d36)" stroke-linejoin="round" stroke-linecap="round"/><text x="76" y="182" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">retry later,</text><text x="76" y="195" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">recompute</text><text x="180" y="280" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="middle" font-style="italic">An idle user is just a finished request:</text><text x="180" y="297" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="middle" font-style="italic">nothing is held for them until the next turn.</text><rect x="370" y="10" width="340" height="300" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="540" y="34" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">The shared block pool</text><rect x="386" y="60" width="44" height="30" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="408" y="80" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">A</text><rect x="437" y="60" width="44" height="30" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="459" y="80" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">A</text><rect x="488" y="60" width="44" height="30" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><text x="510" y="80" font-size="12" font-weight="700" fill="#9a5400" text-anchor="middle">C</text><rect x="539" y="60" width="44" height="30" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="561" y="80" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">B</text><rect x="590" y="60" width="44" height="30" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><text x="612" y="80" font-size="12" font-weight="700" fill="#9a5400" text-anchor="middle">C</text><rect x="641" y="60" width="44" height="30" rx="4" fill="#fffdf8" stroke="#7a6d57" stroke-width="1" stroke-dasharray="3 3"/><rect x="386" y="97" width="44" height="30" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="408" y="117" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">B</text><rect x="437" y="97" width="44" height="30" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><text x="459" y="117" font-size="12" font-weight="700" fill="#9a5400" text-anchor="middle">D</text><rect x="488" y="97" width="44" height="30" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="510" y="117" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">A</text><rect x="539" y="97" width="44" height="30" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><text x="561" y="117" font-size="12" font-weight="700" fill="#9a5400" text-anchor="middle">C</text><rect x="590" y="97" width="44" height="30" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="612" y="117" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">B</text><rect x="641" y="97" width="44" height="30" rx="4" fill="#fffdf8" stroke="#7a6d57" stroke-width="1" stroke-dasharray="3 3"/><rect x="386" y="134" width="44" height="30" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="408" y="154" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">A</text><rect x="437" y="134" width="44" height="30" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><text x="459" y="154" font-size="12" font-weight="700" fill="#9a5400" text-anchor="middle">C</text><rect x="488" y="134" width="44" height="30" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><text x="510" y="154" font-size="12" font-weight="700" fill="#9a5400" text-anchor="middle">D</text><rect x="539" y="134" width="44" height="30" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="561" y="154" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">B</text><rect x="590" y="134" width="44" height="30" rx="4" fill="#fffdf8" stroke="#7a6d57" stroke-width="1" stroke-dasharray="3 3"/><rect x="641" y="134" width="44" height="30" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><text x="663" y="154" font-size="12" font-weight="700" fill="#9a5400" text-anchor="middle">C</text><rect x="386" y="171" width="44" height="30" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><text x="408" y="191" font-size="12" font-weight="700" fill="#9a5400" text-anchor="middle">D</text><rect x="437" y="171" width="44" height="30" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="459" y="191" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">A</text><rect x="488" y="171" width="44" height="30" rx="4" fill="#fffdf8" stroke="#7a6d57" stroke-width="1" stroke-dasharray="3 3"/><rect x="539" y="171" width="44" height="30" rx="4" fill="#fffdf8" stroke="#7a6d57" stroke-width="1" stroke-dasharray="3 3"/><rect x="590" y="171" width="44" height="30" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><text x="612" y="191" font-size="12" font-weight="700" fill="#9a5400" text-anchor="middle">C</text><rect x="641" y="171" width="44" height="30" rx="4" fill="#fffdf8" stroke="#7a6d57" stroke-width="1" stroke-dasharray="3 3"/><rect x="386" y="211" width="14" height="14" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><text x="406" y="222" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start">in use: running requests A and B</text><rect x="386" y="231" width="14" height="14" rx="3" fill="#fdf0d4" stroke="#9a5400" stroke-width="1"/><text x="406" y="242" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start">cached: finished requests C and D</text><rect x="386" y="251" width="14" height="14" rx="3" fill="#fffdf8" stroke="#7a6d57" stroke-width="1" stroke-dasharray="3 3"/><text x="406" y="262" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start">empty</text><text x="540" y="282" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">C comes back: the next turn reuses C's blocks</text><text x="540" y="298" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">space needed: older D blocks are reused first</text><text x="360" y="334" font-size="12.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">A and B are active. C is an idle user whose last turn is still cached. D finished longer ago.</text></svg>

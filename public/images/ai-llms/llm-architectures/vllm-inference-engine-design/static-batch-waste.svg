<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" width="720" height="352" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>A static batch wastes slots on padding and idle time</title><desc>Four requests in a static batch, drawn as rows of 13 slots. Prompts of 3, 6, 2 and 5 tokens are left-padded to 6, and outputs of 4, 2, 7 and 3 tokens all wait for the longest one, so only 32 of the 52 slots do useful work, about 62%. New requests wait until the whole batch is done.</desc><defs></defs><rect width="720" height="352" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">A static batch: padding at the start, idle slots at the end</text><line x1="91" y1="66" x2="293" y2="66" stroke="#5e5241" stroke-width="1.3"/><line x1="91" y1="66" x2="91" y2="72" stroke="#5e5241" stroke-width="1.3"/><line x1="293" y1="66" x2="293" y2="72" stroke="#5e5241" stroke-width="1.3"/><text x="192" y="60" font-size="11.5" font-weight="700" fill="#5e5241" text-anchor="middle">prompt, left-padded to 6</text><line x1="303" y1="66" x2="531" y2="66" stroke="#5e5241" stroke-width="1.3"/><line x1="303" y1="66" x2="303" y2="72" stroke="#5e5241" stroke-width="1.3"/><line x1="531" y1="66" x2="531" y2="72" stroke="#5e5241" stroke-width="1.3"/><text x="417" y="60" font-size="11.5" font-weight="700" fill="#5e5241" text-anchor="middle">decode until the longest ends</text><text x="78" y="105" font-size="12" font-weight="700" fill="#2f281e" text-anchor="end">request A</text><rect x="91" y="84" width="32" height="32" rx="3" fill="#f3eadb" stroke="#7a6d57" stroke-width="1" stroke-dasharray="3 3"/><rect x="125" y="84" width="32" height="32" rx="3" fill="#f3eadb" stroke="#7a6d57" stroke-width="1" stroke-dasharray="3 3"/><rect x="159" y="84" width="32" height="32" rx="3" fill="#f3eadb" stroke="#7a6d57" stroke-width="1" stroke-dasharray="3 3"/><rect x="193" y="84" width="32" height="32" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="227" y="84" width="32" height="32" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="261" y="84" width="32" height="32" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="295" y="84" width="32" height="32" rx="3" fill="#fdf0d4" stroke="#9a5400" stroke-width="1"/><rect x="329" y="84" width="32" height="32" rx="3" fill="#fdf0d4" stroke="#9a5400" stroke-width="1"/><rect x="363" y="84" width="32" height="32" rx="3" fill="#fdf0d4" stroke="#9a5400" stroke-width="1"/><rect x="397" y="84" width="32" height="32" rx="3" fill="#fdf0d4" stroke="#9a5400" stroke-width="1"/><rect x="431" y="84" width="32" height="32" rx="3" fill="#fbd8d1" stroke="#b0273f" stroke-width="1" stroke-dasharray="3 3"/><rect x="465" y="84" width="32" height="32" rx="3" fill="#fbd8d1" stroke="#b0273f" stroke-width="1" stroke-dasharray="3 3"/><rect x="499" y="84" width="32" height="32" rx="3" fill="#fbd8d1" stroke="#b0273f" stroke-width="1" stroke-dasharray="3 3"/><text x="548" y="105" font-size="12" font-weight="400" fill="#5e5241" text-anchor="start">7 of 13 useful</text><text x="78" y="147" font-size="12" font-weight="700" fill="#2f281e" text-anchor="end">request B</text><rect x="91" y="126" width="32" height="32" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="125" y="126" width="32" height="32" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="159" y="126" width="32" height="32" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="193" y="126" width="32" height="32" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="227" y="126" width="32" height="32" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="261" y="126" width="32" height="32" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><rect x="295" y="126" width="32" height="32" rx="3" fill="#fdf0d4" stroke="#9a5400" stroke-width="1"/><rect x="329" y="126" width="32" height="32" rx
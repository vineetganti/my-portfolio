" font-weight="400" fill="#5e5241" text-anchor="start">8 of 13 useful</text><rect x="70" y="260" width="16" height="16" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><text x="92" y="273" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">prompt token</text><rect x="200" y="260" width="16" height="16" rx="3" fill="#fdf0d4" stroke="#9a5400" stroke-width="1"/><text x="222" y="273" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">generated token</text><rect x="350" y="260" width="16" height="16" rx="3" fill="#f3eadb" stroke="#7a6d57" stroke-width="1" stroke-dasharray="3 3"/><text x="372" y="273" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">padding</text><rect x="455" y="260" width="16" height="16" rx="3" fill="#fbd8d1" stroke="#b0273f" stroke-width="1" stroke-dasharray="3 3"/><text x="477" y="273" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">idle: done but still in the batch</text><text x="360" y="312" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">useful work: 32 of 52 slots, about 62%</text><text x="360" y="336" font-size="12.5" font-weight="400" fill="#b0273f" text-anchor="middle" font-style="italic">and a request that arrives now waits until all four have finished</text></svg>

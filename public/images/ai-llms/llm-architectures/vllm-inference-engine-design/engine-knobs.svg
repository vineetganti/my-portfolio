<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 478" width="720" height="478" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Where each vLLM setting acts</title><desc>The engine's components with the settings that control them: tokenizer and chat template flags in the API server; max-num-seqs, max-num-batched-tokens, scheduling-policy and scheduler-cls in the scheduler; gpu-memory-utilization, block-size, kv-cache-dtype, prefix caching and max-model-len in the KV cache manager; and dtype, quantization, tensor parallelism and CPU offload in the model executor.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d36"/></marker></defs><rect width="720" height="478" fill="#ffffff"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2c361c" text-anchor="start">Where each setting acts</text><rect x="20" y="44" width="326" height="178" rx="12" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><rect x="20" y="44" width="326" height="34" rx="12" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.3"/><text x="36" y="66" font-size="13.5" font-weight="700" fill="#2c361c" text-anchor="start">API server</text><text x="332" y="66" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="end" font-style="italic">text in and text out</text><text x="36" y="104" font-size="11" font-weight="700" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">--tokenizer</text><text x="202" y="104" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="start">which tokenizer</text><text x="36" y="128" font-size="11" font-weight="700" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">--tokenizer-mode</text><text x="202" y="128" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="start">auto, slow or mistral</text><text x="36" y="152" font-size="11" font-weight="700" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">--chat-template</text><text x="202" y="152" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="start">override the template</text><text x="36" y="176" font-size="11" font-weight="700" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">--skip-tokenizer-init</text><text x="202" y="176" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="start">send token ids</text><rect x="374" y="44" width="326" height="178" rx="12" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><rect x="374" y="44" width="326" height="34" rx="12" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.3"/><text x="390" y="66" font-size="13.5" font-weight="700" fill="#2c361c" text-anchor="start">Scheduler</text><text x="686" y="66" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="end" font-style="italic">who runs in each step</text><text x="390" y="104" font-size="11" font-weight="700" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">--max-num-seqs</text><text x="556" y="104" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="start">sequences per step</text><text x="390" y="128" font-size="11" font-weight="700" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">--max-num-batched-tokens</text><text x="556" y="128" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="start">token budget per step</text><text x="390" y="152" font-size="11" font-weight="700" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">--scheduling-policy</text><text x="556" y="152" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="start">fcfs or priority</text><text x="390" y="176" font-size="11" font-weight="700" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">--scheduler-cls</text><text x="556" y="176" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="start">your own scheduler</text><rect x="20" y="262" width="326" height="178" rx="12" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><rect x="20" y="262" width="326" height="34" rx="12" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.3"/><text x="36" y="284" font-size="13.5" font-weight="700" fill="#2c361c" text-anchor="start">Model executor</text><text x="332" y="284" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="end" font-style="italic">how the model runs</text><text x="36" y="322" font-size="11" font-weight="700" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">--dtype</text><text x="202" y="322" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="start">float16 or bfloat16</text><text x="36" y="346" font-size="11" font-weight="700" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">--quantization</text><text x="202" y="346" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="start">awq, gptq or fp8</text><text x="36" y="370" font-size="11" font-weight="700" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">--tensor-parallel-size</text><text x="202" y="370" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="start">split across GPUs</text><text x="36" y="394" font-size="11" font-weight="700" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">--cpu-offload-gb</text><text x="202" y="394" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="start">weights in CPU memory</text><rect x="374" y="262" width="326" height="178" rx="12" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><rect x="374" y="262" width="326" height="34" rx="12" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.3"/><text x="390" y="284" font-size="13.5" font-weight="700" fill="#2c361c" text-anchor="start">KV cache manager</text><text x="686" y="284" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="end" font-style="italic">where the cache lives</text><text x="390" y="322" font-size="11" font-weight="700" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">--gpu-memory-utilization</text><text x="556" y="322" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="start">size of the pool</text><text x="390" y="346" font-size="11" font-weight="700" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">--max-model-len</text><text x="556" y="346" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="start">longest request</text><text x="390" y="370" font-size="11" font-weight="700" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">--block-size</text><text x="556" y="370" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="start">tokens per block</text><text x="390" y="394" font-size="11" font-weight="700" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">--kv-cache-dtype</text><text x="556" y="394" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="start">fp8 halves KV memory</text><text x="390" y="418" font-size="11" font-weight="700" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">--enable-prefix-caching</text><text x="556" y="418" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="start">share prefixes</text><line x1="348" y1="133" x2="372" y2="133" stroke="#4f5d36" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><line x1="537" y1="224" x2="537" y2="260" stroke="#4f5d36" stroke-width="1.8" marker-end="url(#ah-4f5d36)" marker-start="url(#ah-4f5d36)"/><text x="545" y="247" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="start">blocks</text><line x1="380" y1="224" x2="340" y2="260" stroke="#4f5d36" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><text x="352" y="236" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="end">batches</text><text x="360" y="466" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">Most tuning is these flags. The scheduler class is the hook for policies the flags can't express.</text></svg>

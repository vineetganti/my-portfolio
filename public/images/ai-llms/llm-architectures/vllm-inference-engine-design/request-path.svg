<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" width="720" height="392" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>The path of one request through vLLM</title><desc>A request goes from the client to the API server process, which assigns a request id, applies the chat template and tokenizes the prompt, then to the engine core process, where the scheduler queues it, the KV cache manager allocates blocks and the model runs one step at a time. Each new token goes back to the API server, which detokenizes it and streams the text to the client.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a5400"/></marker></defs><rect width="720" height="392" fill="#fffdf8"/><rect x="14" y="160" width="104" height="70" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="66" y="184.6" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">client</text><text x="66" y="200.72" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">HTTP request</text><text x="66" y="215.02" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">stream=true</text><rect x="140" y="10" width="252" height="370" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="266" y="34" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">API server process</text><rect x="154" y="64" width="224" height="40" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="266" y="87.6" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">1  assign a request id</text><rect x="154" y="112" width="224" height="40" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="266" y="135.6" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">2  apply the chat template</text><rect x="154" y="160" width="224" height="44" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="266" y="178.775" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">3  tokenize</text><text x="266" y="193.655" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">→ prompt token ids</text><rect x="154" y="262" width="224" height="44" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="266" y="280.775" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">6  detokenize</text><text x="266" y="295.655" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">check stop strings</text><rect x="154" y="316" width="224" height="44" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="266" y="334.775" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">7  stream text back</text><text x="266" y="349.655" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">server-sent events</text><line x1="266" y1="104" x2="266" y2="110" stroke="#5e5241" stroke-width="1.5" marker-end="url(#ah-4f5d36)"/><line x1="266" y1="152" x2="266" y2="158" stroke="#5e5241" stroke-width="1.5" marker-end="url(#ah-4f5d36)"/><line x1="266" y1="306" x2="266" y2="314" stroke="#5e5241" stroke-width="1.5" marker-end="url(#ah-4f5d36)"/><rect x="410" y="10" width="300" height="370" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="560" y="34" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">engine core process</text><rect x="426" y="64" width="268" height="50" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="560" y="85.925" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">KV cache manager</text><text x="560" y="101.425" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">allocates blocks, keeps the block table</text><rect x="426" y="158" width="268" height="50" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="560" y="179.925" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">4  scheduler</text><text x="560" y="195.425" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">waiting queue → running batch</text><rect x="426" y="252" width="268" height="50" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="560" y="273.925" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">5  model executor on the GPU</text><text x="560" y="289.425" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">one forward pass, sample a token</text><line x1="560" y1="156" x2="560" y2="116" stroke="#5e5241" stroke-width="1.5" marker-end="url(#ah-4f5d36)" marker-start="url(#ah-4f5d36)"/><line x1="560" y1="210" x2="560" y2="250" stroke="#5e5241" stroke-width="1.5" marker-end="url(#ah-4f5d36)"/><path d="M 694 277 L 704 277 L 704 183 L 698 183" fill="none" stroke="#5e5241" stroke-width="1.4" marker-end="url(#ah-4f5d36)" stroke-linejoin="round" stroke-linecap="round"/><text x="560" y="330" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">steps 4 and 5 repeat every step</text><text x="560" y="346" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">until the request finishes</text><line x1="118" y1="178" x2="152" y2="90" stroke="#5e5241" stroke-width="1.5" marker-end="url(#ah-4f5d36)"/><line x1="378" y1="182" x2="424" y2="182" stroke="#5e5241" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><line x1="424" y1="282" x2="380" y2="284" stroke="#9a5400" stroke-width="1.8" marker-end="url(#ah-8a5a00)"/><line x1="152" y1="342" x2="118" y2="216" stroke="#9a5400" stroke-width="1.5" marker-end="url(#ah-8a5a00)"/></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 462" width="720" height="462" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Streaming, and what happens when the client disconnects</title><desc>A sequence diagram: the client sends a streaming request, the API server forwards the token ids to the engine core, and after every engine step a new piece of text is streamed back. When the client disconnects, the server aborts the request. The step already on the GPU finishes, and at the next step boundary the engine drops the request and returns its blocks to the pool.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker><marker id="ah-a3283f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a3283f"/></marker></defs><rect width="720" height="462" fill="#ffffff"/><rect x="30" y="14" width="140" height="34" rx="10" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="100" y="34.9" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">client</text><line x1="100" y1="50" x2="100" y2="436" stroke="#8d8068" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="290" y="14" width="140" height="34" rx="10" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="360" y="34.9" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">API server</text><line x1="360" y1="50" x2="360" y2="436" stroke="#8d8068" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="540" y="14" width="140" height="34" rx="10" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="610" y="34.9" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">engine core</text><line x1="610" y1="50" x2="610" y2="436" stroke="#8d8068" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="100" y1="76" x2="356" y2="76" stroke="#6b5f4d" stroke-width="1.5" marker-end="url(#ah-4f5d36)"/><text x="230" y="70" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">request, stream=true</text><line x1="360" y1="100" x2="606" y2="100" stroke="#6b5f4d" stroke-width="1.5" marker-end="url(#ah-4f5d36)"/><text x="485" y="94" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">token ids and sampling parameters</text><rect x="602" y="122" width="16" height="20" rx="3" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.2"/><text x="626" y="137" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="start">step 1</text><line x1="610" y1="152" x2="364" y2="152" stroke="#6b5f4d" stroke-width="1.5" marker-end="url(#ah-4f5d36)"/><text x="485" y="146" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">new token</text><line x1="360" y1="162" x2="104" y2="162" stroke="#6b5f4d" stroke-width="1.5" marker-end="url(#ah-4f5d36)"/><text x="230" y="156" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">text chunk 1</text><rect x="602" y="174" width="16" height="20" rx="3" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.2"/><text x="626" y="189" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="start">step 2</text><line x1="610" y1="204" x2="364" y2="204" stroke="#6b5f4d" stroke-width="1.5" marker-end="url(#ah-4f5d36)"/><text x="485" y="198" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">new token</text><line x1="360" y1="214" x2="104" y2="214" stroke="#6b5f4d" stroke-width="1.5" marker-end="url(#ah-4f5d36)"/><text x="230" y="208" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">text chunk 2</text><rect x="602" y="226" width="16" height="20" rx="3" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.2"/><text x="626" y="241" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="start">step 3</text><line x1="610" y1="256" x2="364" y2="256" stroke="#6b5f4d" stroke-width="1.5" marker-end="url(#ah-4f5d36)"/><text x="485" y="250" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">new token</text><line x1="360" y1="266" x2="104" y2="266" stroke="#6b5f4d" stroke-width="1.5" marker-end="url(#ah-4f5d36)"/><text x="230" y="260" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">text chunk 3</text><text x="100" y="298" font-size="20" font-weight="700" fill="#a3283f" text-anchor="middle">✕</text><text x="90" y="300" font-size="11.5" font-weight="700" fill="#a3283f" text-anchor="end">disconnects</text><line x1="100" y1="314" x2="356" y2="314" stroke="#a3283f" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ah-a3283f)"/><text x="230" y="308" font-size="11.5" font-weight="400" fill="#a3283f" text-anchor="middle">connection closed</text><rect x="602" y="292" width="16" height="36" rx="3" fill="#f3ecdc" stroke="#8d8068" stroke-width="1.2"/><text x="626" y="308" font-size="11" font-weight="400" fill="#8d8068" text-anchor="start">step 4 was</text><text x="626" y="322" font-size="11" font-weight="400" fill="#8d8068" text-anchor="start">already running</text><line x1="360" y1="344" x2="606" y2="344" stroke="#a3283f" stroke-width="1.5" marker-end="url(#ah-a3283f)"/><text x="485" y="338" font-size="11.5" font-weight="400" fill="#a3283f" text-anchor="middle">abort(request id)</text><rect x="400" y="364" width="304" height="64" rx="10" fill="#f6e9c8" stroke="#8a5a00" stroke-width="1.3"/><text x="552" y="386" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">at the next step boundary the engine</text><text x="552" y="403" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">drops the request and returns its blocks</text><text x="552" y="420" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">to the pool, still cached for reuse</text><text x="24" y="402" font-size="12.5" font-weight="700" fill="#8a5a00" text-anchor="start">at most one step of work</text><text x="24" y="420" font-size="12.5" font-weight="700" fill="#8a5a00" text-anchor="start">is wasted</text><text x="360" y="452" font-size="12.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">Normal endings set finish_reason to stop (end-of-sequence token or stop string) or length (max_tokens).</text></svg>

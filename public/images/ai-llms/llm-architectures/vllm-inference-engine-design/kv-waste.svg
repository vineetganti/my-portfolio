<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" width="720" height="352" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Contiguous reservation versus paging for the same three requests</title><desc>Top: contiguous allocation reserves 2,048 slots for each of three requests that end at 300, 1,100 and 600 tokens, so most of each reservation is never used, and the gaps between reservations are too small for a new one: 2,000 of 6,144 slots used, 33%. Bottom: paging allocates blocks of 16 as tokens arrive, 2,016 slots for the same 2,000 tokens, 99%, and every free block can serve any request.</desc><defs></defs><rect width="720" height="352" fill="#fffdf8"/><rect x="10" y="10" width="700" height="158" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="24" y="34" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="start">Contiguous: reserve max_len = 2,048 slots for every request</text><text x="134" y="58" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle">request 1: 300 tokens</text><rect x="30" y="64" width="208" height="38" rx="4" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.1" stroke-dasharray="3 3"/><rect x="30" y="64" width="30.4688" height="38" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="149.234" y="88" font-size="11" font-weight="400" fill="#b0273f" text-anchor="middle" font-style="italic">never used</text><rect x="239" y="64" width="20" height="38" rx="3" fill="#f3eadb" stroke="#7a6d57" stroke-width="1"/><text x="249.5" y="116" font-size="10.5" font-weight="400" fill="#7a6d57" text-anchor="middle" font-style="italic">gap</text><text x="364" y="58" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle">request 2: 1,100 tokens</text><rect x="260" y="64" width="208" height="38" rx="4" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.1" stroke-dasharray="3 3"/><rect x="260" y="64" width="111.719" height="38" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="419.859" y="88" font-size="11" font-weight="400" fill="#b0273f" text-anchor="middle" font-style="italic">never used</text><rect x="469" y="64" width="20" height="38" rx="3" fill="#f3eadb" stroke="#7a6d57" stroke-width="1"/><text x="479.5" y="116" font-size="10.5" font-weight="400" fill="#7a6d57" text-anchor="middle" font-style="italic">gap</text><text x="594" y="58" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle">request 3: 600 tokens</text><rect x="490" y="64" width="208" height="38" rx="4" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.1" stroke-dasharray="3 3"/><rect x="490" y="64" width="60.9375" height="38" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="624.469" y="88" font-size="11" font-weight="400" fill="#b0273f" text-anchor="middle" font-style="italic">never used</text><text x="360" y="136" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">2,000 of 6,144 reserved slots hold tokens: 33% used.</text><text x="360" y="156" font-size="12" font-weight="400" fill="#5e5241" text-anchor="middle">The gaps between reservations are too small for a new 2,048-slot request.</text><rect x="10" y="180" width="700" height="158" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="24" y="204" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="start">Paged: blocks of 16 slots, allocated as tokens arrive</text><rect x="30" y="234" width="30.875" height="38" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="45.4375" y="228" font-size="11.5" font-weight="700" fill="#5e5241" text-anchor="middle">1</text><rect x="62.875" y="234" width="112.125" height="38" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="118.938" y="228" font-size="11.5" font-weight="700" fill="#5e5241" text-anchor="middle">2</text><rect x="177" y="234" width="61.75" height="38" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="207.875" y="228" font-size="11.5" font-weight="700" fill="#5e5241" text-anchor="middle">3</text><rect x="242.75" y="234" width="455.25" height="38" rx="4" fill="#fffdf8" stroke="#7a6d57" stroke-width="1.1" stroke-dasharray="4 3"/><text x="470.375" y="258" font-size="11.5" font-weight="400" fill="#7a6d57" text-anchor="middle" font-style="italic">free blocks: any of them can serve any request</text><text x="360" y="306" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">2,016 slots allocated for 2,000 tokens: 99% used.</text><text x="360" y="326" font-size="12" font-weight="400" fill="#5e5241" text-anchor="middle">The only waste is the unused end of each request's last block, fewer than 16 slots.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 396" width="720" height="396" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>A long prompt with and without chunked prefill</title><desc>Two timelines of streaming requests A and B while a 4,000-token prompt C arrives at 45 milliseconds, with illustrative timings. Without chunking, one 375-millisecond step processes the whole prompt and A and B get no tokens in that time. With 1,000-token chunks, four steps of about 105 milliseconds each also carry A's and B's tokens, so their longest gap drops from 375 to 105 milliseconds, while C's first token comes 45 milliseconds later.</desc><defs></defs><rect width="720" height="396" fill="#ffffff"/><text x="20" y="24" font-size="14" font-weight="700" fill="#3a3226" text-anchor="start">A 4,000-token prompt arrives while A and B are streaming</text><text x="700" y="24" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="end" font-style="italic">illustrative timings for a 7B model</text><rect x="10" y="36" width="700" height="160" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="24" y="58" font-size="13" font-weight="700" fill="#3a3226" text-anchor="start">Without chunked prefill</text><line x1="127.536" y1="86" x2="127.536" y2="156" stroke="#ddd0b4" stroke-width="0.8"/><line x1="143.071" y1="86" x2="143.071" y2="156" stroke="#ddd0b4" stroke-width="0.8"/><line x1="158.607" y1="86" x2="158.607" y2="156" stroke="#ddd0b4" stroke-width="0.8"/><line x1="547" y1="86" x2="547" y2="156" stroke="#ddd0b4" stroke-width="0.8"/><line x1="562.536" y1="86" x2="562.536" y2="156" stroke="#ddd0b4" stroke-width="0.8"/><line x1="578.071" y1="86" x2="578.071" y2="156" stroke="#ddd0b4" stroke-width="0.8"/><line x1="593.607" y1="86" x2="593.607" y2="156" stroke="#ddd0b4" stroke-width="0.8"/><line x1="609.143" y1="86" x2="609.143" y2="156" stroke="#ddd0b4" stroke-width="0.8"/><line x1="624.679" y1="86" x2="
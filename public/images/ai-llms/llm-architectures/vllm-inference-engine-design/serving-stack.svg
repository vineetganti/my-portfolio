<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 398" width="720" height="398" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>A multi-user serving stack around vLLM</title><desc>Users reach a gateway for authentication and rate limits, then an application layer for retrieval, prompt assembly and moderation, then a router that spreads requests over several vLLM replicas and keeps a conversation on the replica that has its cache. Each replica's API server handles templates, tokenization, detokenization and streaming, and its engine core handles scheduling, the KV cache and the GPU. Every replica exposes metrics for monitoring.</desc><defs><marker id="ah-7d8257" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7a6d57"/></marker><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="398" fill="#fffdf8"/><rect x="14" y="104" width="66" height="32" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="47" y="123.6" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">user</text><rect x="14" y="148" width="66" height="32" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="47" y="167.6" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">user</text><rect x="14" y="192" width="66" height="32" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="47" y="211.6" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">user</text><rect x="98" y="96" width="122" height="136" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="159" y="146.45" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">gateway</text><text x="159" y="162.57" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">authentication</text><text x="159" y="176.87" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">rate limits</text><text x="159" y="191.17" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">quotas</text><rect x="236" y="96" width="132" height="136" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="302" y="139.3" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">app layer</text><text x="302" y="155.42" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">retrieval (RAG)</text><text x="302" y="169.72" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">prompt assembly</text><text x="302" y="184.02" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">moderation</text><text x="302" y="198.32" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">in and out</text><rect x="384" y="96" width="106" height="136" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="437" y="139.3" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">router</text><text x="437" y="155.42" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">load balancing</text><text x="437" y="169.72" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">keeps a chat on</text><text x="437" y="184.02" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">the replica with</text><text x="437" y="198.32" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">its cache</text><line x1="80" y1="120" x2="96" y2="164" stroke="#7a6d57" stroke-width="1.2" marker-end="url(#ah-7d8257)"/><line x1="80" y1="164" x2="96" y2="164" stroke="#7a6d57" stroke-width="1.2" marker-end="url(#ah-7d8257)"/><line x1="80" y1="208" x2="96" y2="164" stroke="#7a6d57" stroke-width="1.2" marker-end="url(#ah-7d8257)"/><line x1="220" y1="164" x2="234" y2="164" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><line x1="368" y1="164" x2="382" y2="164" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="506" y="14" width="204" height="96" rx="12" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="608" y="34" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">vLLM replica 1</text><rect x="514" y="44" width="92" height="58" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="560" y="63.45" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">API server</text><text x="560" y="77.71" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">templates,</text><text x="560" y="90.71" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">tokens, streaming</text><rect x="612" y="44" width="92" height="58" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="658" y="63.45" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">engine core</text><text x="658" y="77.71" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">scheduler,</text><text x="658" y="90.71" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">KV cache, GPU</text><line x1="490" y1="164" x2="504" y2="62" stroke="#5e5241" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><rect x="506" y="120" width="204" height="96" rx="12" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="608" y="140" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">vLLM replica 2</text><rect x="514" y="150" width="92" height="58" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="560" y="169.45" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">API server</text><text x="560" y="183.71" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">templates,</text><text x="560" y="196.71" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">tokens, streaming</text><rect x="612" y="150" width="92" height="58" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="658" y="169.45" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">engine core</text><text x="658" y="183.71" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">scheduler,</text><text x="658" y="196.71" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">KV cache, GPU</text><line x1="490" y1="164" x2="504" y2="168" stroke="#5e5241" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><rect x="506" y="226" width="204" height="96" rx="12" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="608" y="246" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">vLLM replica 3</text><rect x="514" y="256" width="92" height="58" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="560" y="275.45" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">API server</text><text x="560" y="289.71" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">templates,</text><text x="560" y="302.71" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">tokens, streaming</text><rect x="612" y="256" width="92" height="58" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="658" y="275.45" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">engine core</text><text x="658" y="289.71" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">scheduler,</text><text x="658" y="302.71" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">KV cache, GPU</text><line x1="490" y1="164" x2="504" y2="274" stroke="#5e5241" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><rect x="98" y="254" width="392" height="82" rx="12" fill="#fde3ad" stroke="#9a5400" stroke-width="1.3"/><text x="294" y="278" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">monitoring</text><text x="294" y="298" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="middle">Prometheus scrapes /metrics on every replica:</text><text x="294" y="316" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="middle">running and waiting requests, KV cache use, TTFT, TPOT</text><text x="360" y="372" font-size="12.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">vLLM covers what happens per request inside each replica. Everything to its left is your system.</text></svg>

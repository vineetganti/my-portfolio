<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>How vLLM splits GPU memory at startup</title><desc>A bar for an 80 GiB A100: 12.6 GiB of Llama-2-7B weights, about 1.5 GiB for activations, about 58 GiB of KV cache blocks, and 8 GiB of headroom outside the 90% budget. The pool holds about 7,400 blocks of 16 tokens, about 118,000 tokens: 29 requests at 4,096 tokens, or about 230 at 512.</desc><defs></defs><rect width="720" height="320" fill="#ffffff"/><text x="20" y="26" font-size="14" font-weight="700" fill="#3a3226" text-anchor="start">How vLLM splits an 80 GiB A100 for Llama-2-7B</text><text x="700" y="26" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="end" font-style="italic">FP16, default settings</text><rect x="20" y="70" width="107.1" height="46" rx="4" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.3"/><text x="73.55" y="90" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">weights</text><text x="73.55" y="106" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="middle">12.6 GiB</text><rect x="127.1" y="70" width="12.75" height="46" rx="2" fill="#e3d9c2" stroke="#6b5f4d" stroke-width="1.1"/><line x1="133.475" y1="68" x2="147.475" y2="56" stroke="#6b5f4d" stroke-width="1"/><text x="150.475" y="56" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="start">activations, about 1.5 GiB</text><rect x="139.85" y="70" width="492.15" height="46" rx="4" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.4"/><text x="385.925" y="90" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">KV cache pool, about 58 GiB</text><text x="385.925" y="106" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="middle">about 7,400 blocks of 8 MiB</text><rect x="632" y="70" width="68" height="46" rx="4" fill="#ffffff" stroke="#8d8068" stroke-width="1.2" stroke-dasharray="4 3"/><text x="666" y="90" font-size="11.5" font-weight="700" fill="#8d8068" text-anchor="middle">10%</text><text x="666" y="106" font-size="11" font-weight="400" fill="#8d8068" text-anchor="middle" font-style="italic">left free</text><line x1="632" y1="60" x2="632" y2="126" stroke="#a3283f" stroke-width="1.4" stroke-dasharray="4 3"/><text x="628" y="140" font-size="11.5" font-weight="700" fill="#a3283f" text-anchor="end">gpu_memory_utilization = 0.9  →  72 GiB</text><text x="20" y="140" font-size="11" font-weight="400" fill="#8d8068" text-anchor="start">0</text><text x="700" y="140" font-size="11" font-weight="400" fill="#8d8068" text-anchor="end">80 GiB</text><line x1="139.85" y1="118" x2="80" y2="162" stroke="#8d8068" stroke-width="1" stroke-dasharray="3 3"/><line x1="632" y1="118" x2="640" y2="162" stroke="#8d8068" stroke-width="1" stroke-dasharray="3 3"/><rect x="60" y="162" width="600" height="60" rx="10" fill="#fffdf8" stroke="#8d8068" stroke-width="1.2"/><rect x="80" y="172" width="14" height="14" rx="2" fill="#f6ecd6" stroke="#8a5a00" stroke-width="0.8"/><rect x="97" y="172" width="14" height="14" rx="2" fill="#f6ecd6" stroke="#8a5a00" stroke-width="0.8"/><rect x="114" y="172" width="14" height="14" rx="2" fill="#f6ecd6" stroke="#8a5a00" stroke-width="0.8"/><rect x="131" y="172" width="14" height="14" rx="2" fill="#f6ecd6" stroke="#8a5a00" stroke-width="0.8"/><rect x="148" y="172" width="14" height="14" rx="2" fill="#f6ecd6" stroke="#8a5a00" stroke-width="0.8"/><rect x="165" y="172" width="14" height="14" rx="2" fill="#f6ecd6" stroke="#8a5a00" stroke-width="0.8"/><rect x="182" y="172" width="14" height="14" rx="2" fill="#f6ecd6" stroke="#8a5a00" stroke-width="0.8"/><rect x="199" y="172" width="14" height="14" rx="2" fill="#f6ecd6" stroke="#8a5a00" stroke-width="0.8"/><rect x="216" y="172" width="14" height="14" rx="2" fill="#f6ecd6" stroke="#8a5a00" stroke-width="0.8"/><rect x="233" y="172" width="14" height="14" rx="2" fill="#f6ecd6" stroke="#8a5a0
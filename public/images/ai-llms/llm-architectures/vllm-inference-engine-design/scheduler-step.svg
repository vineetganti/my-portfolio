<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 404" width="720" height="404" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>One scheduler step under a token budget</title><desc>A token budget of 512 for one step is filled in order: one decode token each for running requests A, B and C, the last 150 prompt tokens of D, and a 359-token chunk of new request E's 600-token prompt, while request F waits. After the forward pass A, B, C and D each have a new token, and E continues its prompt in the next step.</desc><defs></defs><rect width="720" height="404" fill="#ffffff"/><text x="20" y="26" font-size="14" font-weight="700" fill="#3a3226" text-anchor="start">One scheduler step: running requests first, then new ones, within a token budget</text><rect x="20" y="42" width="330" height="140" rx="12" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="185" y="64" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">running: served first</text><rect x="34" y="76" width="302" height="21" rx="7" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><text x="44" y="90.82" font-size="12" font-weight="400" fill="#3a3226" text-anchor="start">A   decoding  →  1 token</text><rect x="34" y="101" width="302" height="21" rx="7" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><text x="44" y="115.82" font-size="12" font-weight="400" fill="#3a3226" text-anchor="start">B   decoding  →  1 token</text><rect x="34" y="126" width="302" height="21" rx="7" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><text x="44" y="140.82" font-size="12" font-weight="400" fill="#3a3226" text-anchor="start">C   decoding  →  1 token</text><rect x="34" y="151" width="302" height="21" rx="7" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><text x="44" y="165.82" font-size="12" font-weight="400" fill="#3a3226" text-anchor="start">D   150 prompt tokens left  →  150</text><rect x="370" y="42" width="330" height="140" rx="12" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="535" y="64" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">waiting: admitted in arrival order</text><rect x="384" y="76" width="302" height="21" rx="7" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.2"/><text x="394" y="90.82" font-size="12" font-weight="400" fill="#3a3226" text-anchor="start">E   new, 600-token prompt  →  359 now</text><rect x="384" y="101" width="302" height="21" rx="7" fill="#ffffff" stroke="#8d8068" stroke-width="1.2"/><text x="394" y="115.82" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="start">F   new, 40-token prompt  →  waits</text><text x="535" y="150" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">a long prompt is cut to fit what is left</text><text x="535" y="168" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">of the budget: chunked prefill</text><text x="360" y="210" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">token budget for this step: max_num_batched_tokens = 512</text><rect x="40" y="220" width="26" height="44" rx="4" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><text x="53" y="247" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">A</text><rect x="66" y="220" width="26" height="44" rx="4" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><text x="79" y="247" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">B</text><rect x="92" y="220" width="26" height="44" rx="4" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><text x="105" y="247" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">C</text><rect x="118" y="220" width="165.619" height="44" rx="4" fill="#e3d9c2" stroke="#6b5f4d" stroke-width="1.2"/><text x="200.809" y="240" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">D</text><text x="200.809" y="256" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">last 150 prompt tokens</text><rect x="283.619" y="220" width="396.381" height="44" rx="4" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.4"/><text x="481.809" y="240" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">E</text><text x="481.809" y="256" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">first 359 of its 600 prompt tokens</text><line x1="40" y1="274" x2="118" y2="274" stroke="#6b5f4d" stroke-width="1.3"/><line x1="40" y1="274" x2="40" y2="268" stroke="#6b5f4d" stroke-width="1.3"/><line x1="118" y1="274" x2="118" y2="268" stroke="#6b5f4d" stroke-width="1.3"/><text x="79" y="289" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">3 decode tokens</text><line x1="120" y1="274" x2="680" y2="274" stroke="#6b5f4d" stroke-width="1.3"/><line x1="120" y1="274" x2="120" y2="268" stroke="#6b5f4d" stroke-width="1.3"/><line x1="680" y1="274" x2="680" y2="268" stroke="#6b5f4d" stroke-width="1.3"/><text x="400" y="289" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">509 prompt tokens</text><rect x="20" y="306" width="680" height="66" rx="12" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.3"/><text x="36" y="328" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="start">after one forward pass</text><text x="36" y="347" font-size="12" font-weight="400" fill="#3a3226" text-anchor="start">A, B and C each get a new token. D finishes its prompt and gets its first token.</text><text x="36" y="365" font-size="12" font-weight="400" fill="#3a3226" text-anchor="start">E has 241 prompt tokens left for the next step. F waits until there is budget.</text><text x="360" y="394" font-size="12.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">No free block for a running request? The newest running request is preempted to make room.</text></svg>

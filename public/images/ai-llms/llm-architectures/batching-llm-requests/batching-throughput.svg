<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 344" width="720" height="344" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Decode throughput against batch size</title><desc>Bars of decode throughput for Llama-2-7B on an A100 with 512 tokens of context per sequence: about 140 tokens per second at batch 1, 1,750 at batch 16 and 4,100 at batch 64, while the time per step grows only from 7.1 to 15.6 milliseconds.</desc><defs></defs><rect width="720" height="344" fill="#ffffff"/><text x="20" y="26" font-size="14" font-weight="700" fill="#3a3226" text-anchor="start">Throughput grows almost linearly with the batch, the step time barely moves</text><text x="700" y="46" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="end" font-style="italic">Llama-2-7B, FP16, A100, 512 tokens of context, post 04's model</text><line x1="80" y1="270" x2="690" y2="270" stroke="#6b5f4d" stroke-width="1.2"/><text x="72" y="274" font-size="10.5" font-weight="400" fill="#8d8068" text-anchor="end">0</text><line x1="80" y1="224.222" x2="690" y2="224.222" stroke="#ddd0b4" stroke-width="0.8"/><text x="72" y="228.222" font-size="10.5" font-weight="400" fill="#8d8068" text-anchor="end">1,000</text><line x1="80" y1="178.444" x2="690" y2="178.444" stroke="#ddd0b4" stroke-width="0.8"/><text x="72" y="182.444" font-size="10.5" font-weight="400" fill="#8d8068" text-anchor="end">2,000</text><line x1="80" y1="132.667" x2="690" y2="132.667" stroke="#ddd0b4" stroke-width="0.8"/><text x="72" y="136.667" font-size="10.5" font-weight="400" fill="#8d8068" text-anchor="end">3,000</text><line x1="80" y1="86.8889" x2="690" y2="86.8889" stroke="#ddd0b4" stroke-width="0.8"/><text x="72" y="90.8889" font-size="10.5" font-weight="400" fill="#8d8068" text-anchor="end">4,000</text><text transform="translate(26 167) rotate(-90)" font-size="11.5" fill="#6b5f4d" text-anchor="middle">tokens per second</text><rect x="93.5714" y="263.583" width="60" height="6.41665" rx="4" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="123.571" y="255.583" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">140</text><text x="123.571" y="288" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="middle">B = 1</text><text x="123.571" y="304" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">7.1 ms</text><rect x="180.714" y="257.404" width="60" height="12.5963" rx="4" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="210.714" y="249.404" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">275</text><text x="210.714" y="288" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="middle">B = 2</text><text x="210.714" y="304" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">7.3 ms</text><rect x="267.857" y="245.705" width="60" height="24.2954" rx="4" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="297.857" y="237.705" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">531</text><text x="297.857" y="288" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="middle">B = 4</text><text x="297.857" y="304" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">7.5 ms</text><rect x="355" y="224.64" width="60" height="45.3597" rx="4" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="385" y="216.64" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">991</text><text x="385" y="288" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="middle">B = 8</text><text x="385" y="304" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">8.1 ms</text><rect x="442.143" y="189.929" width="60" height="80.0706" rx="4" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.4"/><text x="472.143" y="181.929" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">1,749</text><text x="472.143" y="288" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="middle">B = 16</text><text x="472.143" y="304" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">9.1 ms</text><rect x="529.286" y="140.306" width="60" height="129.694" rx="4" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="559.286" y="132.306" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">2,833</text><text x="559.286" y="288" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="middle">B = 32</text><text x="559.286" y="304" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">11.3 ms</text><rect x="616.429" y="82.0725" width="60" height="187.928" rx="4" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.1"/><text x="646.429" y="74.0725" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">4,105</text><text x="646.429" y="288" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="middle">B = 64</text><text x="646.429" y="304" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">15.6 ms</text><text x="72" y="304" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="end">step:</text><text x="360" y="334" font-size="12.5" font-weight="700" fill="#8a5a00" text-anchor="middle">16 sequences give about 12 times the tokens per second for 1.3 times the step time</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 306" width="720" height="306" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>The lifecycle of a request object</title><desc>A request is created as queued with its arrival time. It becomes running when the scheduler puts it in a batch and stamps the scheduled time, records the first token time when its first token appears, and ends as finished with a completion time, or as failed with an error. Either way its done event is set and a frozen response with the metrics is produced.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker><marker id="ah-a3283f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a3283f"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a00"/></marker></defs><rect width="720" height="306" fill="#ffffff"/><text x="20" y="26" font-size="14" font-weight="700" fill="#3a3226" text-anchor="start">One request, four timestamps, one state at a time</text><rect x="14" y="66" width="84" height="54" rx="10" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.5"/><text x="56" y="89.925" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">submit()</text><text x="56" y="105.425" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">traffic</text><rect x="150" y="66" width="104" height="54" rx="10" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.5"/><text x="202" y="90.075" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">QUEUED</text><text x="202" y="106.195" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">in the queue</text><rect x="330" y="56" width="164" height="74" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="412" y="80" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">RUNNING</text><text x="412" y="98" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">in a batch on the GPU</text><circle cx="366" cy="116" r="4" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.4"/><text x="374" y="120" font-size="10.5" font-weight="700" fill="#8a5a00" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">first_token_time</text><rect x="570" y="66" width="136" height="54" rx="10" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.5"/><text x="638" y="90.075" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">FINISHED</text><text x="638" y="106.195" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">all tokens out</text><rect x="330" y="180" width="164" height="50" rx="10" fill="#f7e0da" stroke="#a3283f" stroke-width="1.5"/><text x="412" y="202.075" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">FAILED</text><text x="412" y="218.195" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">error recorded</text><line x1="98" y1="93" x2="148" y2="93" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><line x1="123" y1="96" x2="123" y2="140" stroke="#8a5a00" stroke-width="1.1" stroke-dasharray="2 2"/><text x="123" y="154" font-size="10.5" font-weight="700" fill="#8a5a00" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">arrival_time</text><line x1="254" y1="93" x2="328" y2="93" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><line x1="291" y1="96" x2="291" y2="140" stroke="#8a5a00" stroke-width="1.1" stroke-dasharray="2 2"/><text x="291" y="154" font-size="10.5" font-weight="700" fill="#8a5a00" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">scheduled_time</text><line x1="494" y1="93" x2="568" y2="93" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><line x1="531" y1="96" x2="531" y2="140" stroke="#8a5a00" stroke-width="1.1" stroke-dasharray="2 2"/><text x="531" y="154" font-size="10.5" font-weight="700" fill="#8a5a00" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">completion_time</text><line x1="412" y1="130" x2="412" y2="178" stroke="#a3283f" stroke-width="1.6" marker-end="url(#ah-a3283f)"/><text x="420" y="162" font-size="10.5" font-weight="400" fill="#a3283f" text-anchor="start">exception</text><rect x="570" y="180" width="136" height="50" rx="10" fill="#f6e9c8" stroke="#8a5a00" stroke-width="1.3"/><text x="638" y="201" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">done.set()</text><text x="638" y="218" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">Response snapshot</text><line x1="638" y1="122" x2="638" y2="178" stroke="#8a5a00" stroke-width="1.4" marker-end="url(#ah-8a5a00)"/><line x1="494" y1="205" x2="568" y2="205" stroke="#a3283f" stroke-width="1.4" marker-end="url(#ah-a3283f)"/><text x="360" y="270" font-size="12.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">Every metric is a difference of these timestamps, so a finished request is its own metrics record.</text><text x="360" y="290" font-size="12.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">The submitter just awaits request.done.wait(); the frozen Response can't be changed by a late write.</text></svg>

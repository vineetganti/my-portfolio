<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>How the dynamic batcher decides when to launch</title><desc>A flowchart of the dynamic batcher: wait for a first request, take everything already waiting, start a deadline at the oldest request's arrival plus max_wait, then keep adding arrivals until the batch reaches its size limit, the deadline passes, or the next request would exceed the memory budget, and launch the batch on a worker thread.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a00"/></marker></defs><rect width="720" height="470" fill="#ffffff"/><text x="20" y="26" font-size="14" font-weight="700" fill="#3a3226" text-anchor="start">The dynamic batcher's loop</text><rect x="40" y="44" width="330" height="40" rx="10" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.5"/><text x="205" y="67.75" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">wait for the first request</text><rect x="40" y="100" width="330" height="40" rx="10" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.5"/><text x="205" y="123.75" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">take every request already waiting</text><rect x="40" y="156" width="330" height="40" rx="10" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.5"/><text x="205" y="179.75" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">deadline = oldest arrival + max_wait</text><line x1="205" y1="84" x2="205" y2="98" stroke="#6b5f4d" stroke-width="1.5" marker-end="url(#ah-4f5d36)"/><line x1="205" y1="140" x2="205" y2="154" stroke="#6b5f4d" stroke-width="1.5" marker-end="url(#ah-4f5d36)"/><line x1="205" y1="196" x2="205" y2="210" stroke="#6b5f4d" stroke-width="1.5" marker-end="url(#ah-4f5d36)"/><rect x="40" y="212" width="330" height="48" rx="10" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.5"/><text x="205" y="232.925" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">1  batch full?</text><text x="205" y="248.425" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">len(batch) = max_batch_size</text><rect x="40" y="276" width="330" height="48" rx="10" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.5"/><text x="205" y="296.925" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">2  deadline passed?</text><text x="205" y="312.425" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">the oldest waited max_wait</text><rect x="40" y="340" width="330" height="48" rx="10" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.5"/><text x="205" y="360.925" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">3  next request breaks memory?</text><text x="205" y="376.425" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">padding-aware budget (0.4)</text><line x1="205" y1="260" x2="205" y2="274" stroke="#6b5f4d" stroke-width="1.5" marker-end="url(#ah-4f5d36)"/><text x="213" y="271" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="start">no</text><line x1="205" y1="324" x2="205" y2="338" stroke="#6b5f4d" stroke-width="1.5" marker-end="url(#ah-4f5d36)"/><text x="213" y="335" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="start">no</text><line x1="205" y1="388" x2="205" y2="402" stroke="#6b5f4d" stroke-width="1.5" marker-end="url(#ah-4f5d36)"/><text x="213" y="399" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="start">no</text><rect x="40" y="404" width="330" height="40" rx="10" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.5"/><text x="205" y="427.6" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">wait for the next arrival until the deadline, add it</text><path d="M 40 424 L 18 424 L 18 236 L 36 236" fill="none" stroke="#6b5f4d" stroke-width="1.4" marker-end="url(#ah-4f5d36)" stroke-linejoin="round" stroke-linecap="round"/><rect x="470" y="252" width="236" height="88" rx="12" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.6"/><text x="588" y="280" font-size="13.5" font-weight="700" fill="#3a3226" text-anchor="middle">launch the batch</text><text x="588" y="300" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="middle">run_batch() on a worker thread,</text><text x="588" y="318" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="middle">so the event loop keeps going</text><line x1="370" y1="236" x2="468" y2="270" stroke="#8a5a00" stroke-width="1.6" marker-end="url(#ah-8a5a00)"/><text x="380" y="230" font-size="10.5" font-weight="700" fill="#8a5a00" text-anchor="start">yes</text><line x1="370" y1="300" x2="468" y2="296" stroke="#8a5a00" stroke-width="1.6" marker-end="url(#ah-8a5a00)"/><text x="380" y="294" font-size="10.5" font-weight="700" fill="#8a5a00" text-anchor="start">yes</text><line x1="370" y1="364" x2="468" y2="322" stroke="#8a5a00" stroke-width="1.6" marker-end="url(#ah-8a5a00)"/><text x="380" y="380" font-size="10.5" font-weight="700" fill="#8a5a00" text-anchor="start">yes</text><path d="M 588 252 L 588 64 L 374 64" fill="none" stroke="#6b5f4d" stroke-width="1.4" marker-end="url(#ah-4f5d36)" stroke-linejoin="round" stroke-linecap="round"/><text x="596" y="160" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="start" font-style="italic">then start over</text></svg>

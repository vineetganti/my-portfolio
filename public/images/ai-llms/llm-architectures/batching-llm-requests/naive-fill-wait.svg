<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" width="720" height="356" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>How long requests wait for a naive batch to fill</title><desc>Two timelines with a batch size of four. At 1 request per second the first request waits about 3 seconds for the batch to fill, an average of 1.5 seconds per request. At 20 requests per second the batch fills in about 0.15 seconds, an average of 0.075 seconds.</desc><defs></defs><rect width="720" height="356" fill="#ffffff"/><text x="20" y="26" font-size="14" font-weight="700" fill="#3a3226" text-anchor="start">Waiting for a batch of N = 4 to fill</text><text x="700" y="26" font-size="12" font-weight="700" fill="#6b5f4d" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">E[wait] = (N − 1) ÷ 2λ</text><rect x="10" y="42" width="700" height="134" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="24" y="64" font-size="13" font-weight="700" fill="#3a3226" text-anchor="start">1 request per second</text><text x="78" y="84" font-size="11" font-weight="700" fill="#3a3226" text-anchor="end">R1</text><line x1="95" y1="80" x2="452.25" y2="80" stroke="#a3283f" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="90" cy="80" r="4" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.2"/><text x="464.25" y="84" font-size="11" font-weight="400" fill="#a3283f" text-anchor="start">waits 3.1 s</text><text x="78" y="102" font-size="11" font-weight="700" fill="#3a3226" text-anchor="end">R2</text><line x1="200.75" y1="98" x2="452.25" y2="98" stroke="#a3283f" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="195.75" cy="98" r="4" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.2"/><text x="464.25" y="102" font-size="11" font-weight="400" fill="#a3283f" text-anchor="start">waits 2.2 s</text><text x="78" y="120" font-size="11" font-weight="700" fill="#3a3226" text-anchor="end">R3</text><line x1="365.25" y1="116" x2="452.25" y2="116" stroke="#a3283f" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="360.25" cy="116" r="4" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.2"/><text x="464.25" y="120" font-size="11" font-weight="400" fill="#a3283f" text-anchor="start">waits 0.8 s</text><text x="78" y="138" font-size="11" font-weight="700" fill="#3a3226" text-anchor="end">R4</text><circle cx="454.25" cy="134" r="4" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.2"/><text x="464.25" y="138" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="start">waits 0.0 s</text><line x1="454.25" y1="72" x2="454.25" y2="146" stroke="#8a5a00" stroke-width="1.4" stroke-dasharray="5 3"/><line x1="90" y1="154" x2="560" y2="154" stroke="#6b5f4d" stroke-width="1.1"/><text x="90" y="168" font-size="10.5" font-weight="400" fill="#8d8068" text-anchor="middle">0.0 s</text><text x="207.5" y="168" font-size="10.5" font-weight="400" fill="#8d8068" text-anchor="middle">1.0 s</text><text x="325" y="168" font-size="10.5" font-weight="400" fill="#8d8068" text-anchor="middle">2.0 s</text><text x="442.5" y="168" font-size="10.5" font-weight="400" fill="#8d8068" text-anchor="middle">3.0 s</text><text x="560" y="168" font-size="10.5" font-weight="400" fill="#8d8068" text-anchor="middle">4.0 s</text><text x="640" y="104" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">average wait</text><text x="640" y="126" font-size="15" font-weight="700" fill="#a3283f" text-anchor="middle">1.5 s</text><rect x="10" y="190" width="700" height="134" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="24" y="212" font-size="13" font-weight="700" fill="#3a3226" text-anchor="start">20 requests per second</text><text x="78" y="232" font-size="11" font-weight="700" fill="#3a3226" text-anchor="end">R1</text><line x1="95" y1="228" x2="440.5" y2="228" stroke="#a3283f" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="90" cy="228" r="4" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.2"/><text x="452.5" y="232" font-size="11" font-weight="400" fill="#a3283f" text-anchor="start">waits 0.15 s</text><text x="78" y="250" font-size="11" font-weight="700" fill="#3a3226" text-anchor="end">R2</text><line x1="189" y1="246" x2="440.5" y2="246" stroke="#a3283f" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="184" cy="246" r="4" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.2"/><text x="452.5" y="250" font-size="11" font-weight="400" fill="#a3283f" text-anchor="start">waits 0.11 s</text><text x="78" y="268" font-size="11" font-weight="700" fill="#3a3226" text-anchor="end">R3</text><line x1="353.5" y1="264" x2="440.5" y2="264" stroke="#a3283f" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="348.5" cy="264" r="4" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.2"/><text x="452.5" y="268" font-size="11" font-weight="400" fill="#a3283f" text-anchor="start">waits 0.04 s</text><text x="78" y="286" font-size="11" font-weight="700" fill="#3a3226" text-anchor="end">R4</text><circle cx="442.5" cy="282" r="4" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.2"/><text x="452.5" y="286" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="start">waits 0.00 s</text><line x1="442.5" y1="220" x2="442.5" y2="294" stroke="#8a5a00" stroke-width="1.4" stroke-dasharray="5 3"/><line x1="90" y1="302" x2="560" y2="302" stroke="#6b5f4d" stroke-width="1.1"/><text x="90" y="316" font-size="10.5" font-weight="400" fill="#8d8068" text-anchor="middle">0.00 s</text><text x="207.5" y="316" font-size="10.5" font-weight="400" fill="#8d8068" text-anchor="middle">0.05 s</text><text x="325" y="316" font-size="10.5" font-weight="400" fill="#8d8068" text-anchor="middle">0.10 s</text><text x="442.5" y="316" font-size="10.5" font-weight="400" fill="#8d8068" text-anchor="middle">0.15 s</text><text x="560" y="316" font-size="10.5" font-weight="400" fill="#8d8068" text-anchor="middle">0.20 s</text><text x="640" y="252" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">average wait</text><text x="640" y="274" font-size="15" font-weight="700" fill="#a3283f" text-anchor="middle">0.075 s</text><text x="360" y="346" font-size="12.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">The batch starts at the 4th arrival (dashed line). Twenty times the traffic, a twentieth of the wait.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 302" width="720" height="302" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>The four timestamps of a request and the metrics between them</title><desc>One request's timeline: it arrives, waits in the queue until it is scheduled, the prefill produces the first token, more tokens follow at regular gaps, and the last token marks completion. Queue wait is scheduled time minus arrival, TTFT is first token minus arrival, TPOT is the average gap between tokens after the first, and end-to-end latency is completion minus arrival.</desc><defs></defs><rect width="720" height="302" fill="#ffffff"/><text x="20" y="26" font-size="14" font-weight="700" fill="#3a3226" text-anchor="start">Four timestamps per request, and every metric is a difference of two</text><line x1="30" y1="120" x2="690" y2="120" stroke="#6b5f4d" stroke-width="1.5"/><rect x="60" y="108" width="150" height="24" rx="4" fill="#f7e0da" stroke="#a3283f" stroke-width="1" stroke-dasharray="3 3"/><text x="135" y="124" font-size="11" font-weight="400" fill="#a3283f" text-anchor="middle" font-style="italic">in the queue</text><rect x="210" y="108" width="120" height="24" rx="4" fill="#e3d9c2" stroke="#6b5f4d" stroke-width="1"/><text x="270" y="124" font-size="11" font-weight="700" fill="#3a3226" text-anchor="middle">prefill</text><circle cx="330" cy="120" r="6" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.4"/><circle cx="392" cy="120" r="6" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.4"/><circle cx="454" cy="120" r="6" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.4"/><circle cx="516" cy="120" r="6" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.4"/><circle cx="578" cy="120" r="6" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.4"/><circle cx="640" cy="120" r="6" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.4"/><line x1="60" y1="104" x2="60" y2="80" stroke="#6b5f4d" stroke-width="1.1"/><text x="60" y="62" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">arrival</text><text x="60" y="76" font-size="10.5" font-weight="400" fill="#8a5a00" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">arrival_time</text><line x1="210" y1="104" x2="210" y2="80" stroke="#6b5f4d" stroke-width="1.1"/><text x="210" y="62" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">scheduled</text><text x="210" y="76" font-size="10.5" font-weight="400" fill="#8a5a00" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">scheduled_time</text><line x1="330" y1="104" x2="330" y2="80" stroke="#6b5f4d" stroke-width="1.1"/><text x="330" y="62" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">first token</text><text x="330" y="76" font-size="10.5" font-weight="400" fill="#8a5a00" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">first_token_time</text><line x1="640" y1="104" x2="640" y2="80" stroke="#6b5f4d" stroke-width="1.1"/><text x="640" y="62" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">last token</text><text x="640" y="76" font-size="10.5" font-weight="400" fill="#8a5a00" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">completion_time</text><line x1="454" y1="140" x2="516" y2="140" stroke="#8a5a00" stroke-width="1.3"/><line x1="454" y1="140" x2="454" y2="134" stroke="#8a5a00" stroke-width="1.3"/><line x1="516" y1="140" x2="516" y2="134" stroke="#8a5a00" stroke-width="1.3"/><text x="485" y="155" font-size="11" font-weight="700" fill="#8a5a00" text-anchor="middle">TPOT: the average gap</text><line x1="60" y1="140" x2="210" y2="140" stroke="#a3283f" stroke-width="1.3"/><line x1="60" y1="140" x2="60" y2="134" stroke="#a3283f" stroke-width="1.3"/><line x1="210" y1="140" x2="210" y2="134" stroke="#a3283f" stroke-width="1.3"/><text x="135" y="155" font-size="11" font-weight="700" fill="#a3283f" text-anchor="middle">queue wait</text><line x1="60" y1="176" x2="330" y2="176" stroke="#3a3226" stroke-width="1.3"/><line x1="60" y1="176" x2="60" y2="170" stroke="#3a3226" stroke-width="1.3"/><line x1="330" y1="176" x2="330" y2="170" stroke="#3a3226" stroke-width="1.3"/><text x="195" y="192" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">TTFT</text><line x1="60" y1="212" x2="640" y2="212" stroke="#3a3226" stroke-width="1.3"/><line x1="60" y1="212" x2="60" y2="206" stroke="#3a3226" stroke-width="1.3"/><line x1="640" y1="212" x2="640" y2="206" stroke="#3a3226" stroke-width="1.3"/><text x="350" y="228" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">end-to-end latency</text><text x="360" y="262" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">TPOT = (completion − first token) ÷ (tokens − 1)</text><text x="360" y="284" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">E2E  = TTFT + (tokens − 1) × TPOT</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Waiting time against utilization</title><desc>The average time in an M/M/1 queue, as a multiple of the service time, plotted against utilization: 2 times at 50% load, 5 at 80%, 10 at 90% and 20 at 95%. The curve is flat at first and shoots up near full load.</desc><defs></defs><rect width="720" height="330" fill="#ffffff"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2c361c" text-anchor="start">Time in the system shoots up as utilization approaches 100%</text><text x="700" y="46" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="end" font-style="italic" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">M/M/1 queue: W ÷ service time = 1 ÷ (1 − ρ)</text><rect x="560" y="60" width="120" height="222" rx="0" fill="#f8e1d6" opacity="0.6"/><text x="620" y="76" font-size="11.5" font-weight="700" fill="#a3283f" text-anchor="middle">the knee</text><line x1="80" y1="282" x2="680" y2="282" stroke="#4f5d36" stroke-width="1.2"/><text x="72" y="286" font-size="10.5" font-weight="400" fill="#7d8257" text-anchor="end">0×</text><line x1="80" y1="237.6" x2="680" y2="237.6" stroke="#c9bb7a" stroke-width="0.8"/><text x="72" y="241.6" font-size="10.5" font-weight="400" fill="#7d8257" text-anchor="end">5×</text><line x1="80" y1="193.2" x2="680" y2="193.2" stroke="#c9bb7a" stroke-width="0.8"/><text x="72" y="197.2" font-size="10.5" font-weight="400" fill="#7d8257" text-anchor="end">10×</text><line x1="80" y1="148.8" x2="680" y2="148.8" stroke="#c9bb7a" stroke-width="0.8"/><text x="72" y="152.8" font-size="10.5" font-weight="400" fill="#7d8257" text-anchor="end">15×</text><line x1="80" y1="104.4" x2="680" y2="104.4" stroke="#c9bb7a" stroke-width="0.8"/><text x="72" y="108.4" font-size="10.5" font-weight="400" fill="#7d8257" text-anchor="end">20×</text>
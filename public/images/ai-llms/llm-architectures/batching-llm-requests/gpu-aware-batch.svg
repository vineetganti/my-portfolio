<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="720" height="372" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Choosing a batch size that fits the memory budget</title><desc>Five queued requests with prompts of 180, 420, 260, 1,900 and 300 tokens are added oldest first under a budget of 6,000 KV slots, where each row costs the longest prompt plus 128 new tokens because of padding. Three requests cost 1,644 slots, but adding the 1,900-token prompt would make four rows of 2,028 slots, 8,112 in total, so the batch launches with three. B = min(queue length 5, cap 16, memory 3).</desc><defs></defs><rect width="720" height="372" fill="#ffffff"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2c361c" text-anchor="start">Adding requests oldest first, until padding would break the budget</text><text x="24" y="56" font-size="12" font-weight="700" fill="#2c361c" text-anchor="start">queue, oldest first</text><rect x="160" y="40" width="98" height="28" rx="10" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.5"/><text x="209" y="57.6" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">R1: 180</text><rect x="270" y="40" width="98" height="28" rx="10" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.5"/><text x="319" y="57.6" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">R2: 420</text><rect x="380" y="40" width="98" height="28" rx="10" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.5"/><text x="429" y="57.6" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">R3: 260</text><rect x="490" y="40" width="98" height="28" rx="10" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.5"/><text x="539" y="57.6" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">R4: 1,900</text><rect x="600" y="40" width="98" height="28" rx="10" fill="#ffffff" stroke="#7d8257" stroke-width="1.5"/><text x="649" y="57.6" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">R5: 300</text><text x="24" y="88" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="start" font-style="italic">prompt lengths in tokens; max_new_tokens = 128; budget = 6,000 KV slots</text><text x="40" y="118" font-size="12" font-weight="700" fill="#2c361c" text-anchor="start">add</text><text x="110" y="118" font-size="12" font-weight="700" fill="#2c361c" text-anchor="start">P_max</text><text x="200" y="118" font-size="12" font-weight="700" fill="#2c361c" text-anchor="start">cost = rows × (P_max + 128)</text><text x="420" y="118" font-size="12" font-weight="700" fill="#2c361c" text-anchor="start">fits 6,000?</text><line x1="30" y1="126" x2="530" y2="126" stroke="#4f5d36" stroke-width="1"/><text x="40" y="148" font-size="12" font-weight="700" fill="#2c361c" text-anchor="start">R1</text><text x="110" y="148" font-size="12" font-weight="400" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">180</text><text x="200" y="148" font-size="12" font-weight="400" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1 × 308 = 308</text><text x="420" y="148" font-size="12" font-weight="700" fill="#4f5d36" text-anchor="start">yes</text><text x="40" y="172" font-size="12" font-weight="700" fill="#2c361c" text-anchor="start">R2</text><text x="110" y="172" font-size="12" font-weight="400" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">420</text><text x="200" y="172" font-size="12" font-weight="400" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">2 × 548 = 1,096</text><text x="420" y="172" font-size="12" font-weight="700" fill="#4f5d36" text-anchor="start">yes</text><text x="40" y="196" font-size="12" font-weight="700" fill="#2c361c" text-anchor="start">R3</text><text x="110" y="196" font-size="12" font-weight="400" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">420</text><text x="200" y="196" font-size="12" font-weight="400" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">3 × 548 = 1,644</text><text x="420" y="196" font-size="12" font-weight="700" fill="#4f5d36" text-anchor="start">yes</text><text x="40" y="220" font-size="12" font-weight="700" fill="#a3283f" text-anchor="start">R4</text><text x="110" y="220" font-size="12" font-weight="400" fill="#a3283f" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1,900</text><text x="200" y="220" font-size="12" font-weight="400" fill="#a3283f" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">4 × 2,028 = 8,112</text><text x="420" y="220" font-size="12" font-weight="700" fill="#a3283f" text-anchor="start">no: stop here</text><text x="40" y="246" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="start">KV slots used</text><rect x="40" y="256" width="480" height="30" rx="4" fill="#ffffff" stroke="#4f5d36" stroke-width="1.3"/><rect x="40" y="256" width="131.52" height="30" rx="4" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="105.76" y="276" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">R1 to R3: 1,644</text><rect x="171.52" y="292" width="517.44" height="16" rx="3" fill="#f8e1d6" stroke="#a3283f" stroke-width="1" stroke-dasharray="3 3"/><text x="177.52" y="304" font-size="10.5" font-weight="700" fill="#a3283f" text-anchor="start">with R4: 8,112</text><line x1="520" y1="250" x2="520" y2="314" stroke="#a3283f" stroke-width="1.6"/><text x="516" y="246" font-size="11" font-weight="700" fill="#a3283f" text-anchor="end">budget 6,000</text><rect x="548" y="106" width="158" height="118" rx="12" fill="#f6ebc4" stroke="#8a5a00" stroke-width="1.3"/><text x="627" y="130" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">B = min(</text><text x="627" y="152" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">queue 5,</text><text x="627" y="172" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">cap 16,</text><text x="627" y="192" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">memory 3 )</text><text x="627" y="214" font-size="14" font-weight="700" fill="#8a5a00" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">= 3</text><text x="360" y="340" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">R4 leads the next batch. Padding makes every row pay for the longest prompt in the batch.</text><text x="360" y="360" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">For Mistral-7B, one KV slot is 128 KiB, so this toy budget is 750 MiB.</text></svg>

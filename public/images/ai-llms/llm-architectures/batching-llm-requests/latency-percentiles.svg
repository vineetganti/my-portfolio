<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>A latency distribution and its percentiles</title><desc>A histogram of 1,000 simulated time-to-first-token values with a long right tail. The median is 303 milliseconds and the mean is higher at about 353, while the 90th percentile is about 610 and the 99th about 1,208.</desc><defs></defs><rect width="720" height="330" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">1,000 simulated TTFTs: the mean hides the tail</text><text x="700" y="26" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="end" font-style="italic">log-normal, median 300 ms</text><line x1="70" y1="268" x2="690" y2="268" stroke="#5e5241" stroke-width="1.2"/><text x="62" y="272" font-size="10.5" font-weight="400" fill="#7a6d57" text-anchor="end">0</text><line x1="70" y1="210.037" x2="690" y2="210.037" stroke="#dccfb1" stroke-width="0.8"/><text x="62" y="214.037" font-size="10.5" font-weight="400" fill="#7a6d57" text-anchor="end">40</text><line x1="70" y1="152.075" x2="690" y2="152.075" stroke="#dccfb1" stroke-width="0.8"/><text x="62" y="156.075" font-size="10.5" font-weight="400" fill="#7a6d57" text-anchor="end">80</text><line x1="70" y1="94.1124" x2="690" y2="94.1124" stroke="#dccfb1" stroke-width="0.8"/><text x="62" y="98.1124" font-size="10.5" font-weight="400" fill="#7a6d57" text-anchor="end">120</text><rect x="71" y="266.551" width="17.375" height="1.44906" rx="1.5" fill="#dfedcc" stroke="#4b7d33" stroke-width="0.8"/><rect x="90.375" y="208.588" width="17.375" height="59.4116" rx="1.5" fill="#dfedcc" stroke="#4b7d33" stroke-width="0.8"/><rect x="109.75" y="133.237" width="17.375" height="134.763" rx="1.5" fill="#dfedcc" stroke="#4b7d33" stroke-width="0.8"/><rect x="129.125" y="91.2143" width="17.375" height="176.786" rx="1.5" fill="#dfedcc"
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 318" width="720" height="318" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>The project in one picture</title><desc>A Poisson stream of requests with variable prompt lengths enters a queue. A swappable scheduler (naive, dynamic or vLLM) forms batches, a swappable backend (Hugging Face Transformers or vLLM, with TinyLlama for smoke tests and Mistral-7B or LLaMA-13B for full runs) runs them, and each request's output and metrics are collected into plots and a report.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker></defs><rect width="720" height="318" fill="#ffffff"/><text x="20" y="26" font-size="14" font-weight="700" fill="#3a3226" text-anchor="start">A minimal LLM queue scheduler</text><rect x="14" y="50" width="118" height="176" rx="10" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="73" y="113.3" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">traffic</text><text x="73" y="129.42" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">Poisson arrivals</text><text x="73" y="143.72" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">variable prompt</text><text x="73" y="158.02" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">lengths</text><text x="73" y="172.32" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">seeded trace</text><rect x="150" y="50" width="92" height="176" rx="10" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="196" y="76" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">queue</text><rect x="166" y="96" width="60" height="20" rx="4" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.1"/><rect x="166" y="122" width="60" height="20" rx="4" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.1"/><rect x="166" y="148" width="60" height="20" rx="4" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.1"/><rect x="166" y="174" width="60" height="20" rx="4" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.1"/><text x="196" y="214" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">oldest at the front</text><rect x="260" y="50" width="150" height="176" rx="10" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5" stroke-dasharray="6 4"/><text x="335" y="76" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">scheduler</text><rect x="272" y="94" width="126" height="26" rx="7" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><text x="335" y="110.96" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">naive: wait for N</text><rect x="272" y="128" width="126" height="26" rx="7" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><text x="335" y="144.96" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">dynamic: size or age</text><rect x="272" y="162" width="126" height="26" rx="7" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.2"/><text x="335" y="178.96" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">vLLM: pass through</text><text x="335" y="214" font-size="10.5" font-weight="700" fill="#8a5a00" text-anchor="middle">swappable strategy</text><rect x="428" y="50" width="140" height="176" rx="10" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5" stroke-dasharray="6 4"/><text x="498" y="76" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">backend</text><rect x="440" y="94" width="116" height="26" rx="7" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><text x="498" y="110.96" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">HF Transformers</text><rect x="440" y="128" width="116" height="26" rx="7" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.2"/><text x="498" y="144.96" font-size="11" font-weight="400" fill="#3a3226" text-anchor="middle">vLLM server</text><text x="498" y="178" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">TinyLlama-1.1B to test,</text><text x="498" y="194" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">Mistral-7B or LLaMA-13B</text><text x="498" y="214" font-size="10.5" font-weight="700" fill="#8a5a00" text-anchor="middle">swappable model</text><rect x="586" y="50" width="120" height="176" rx="10" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="646" y="113.3" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">results</text><text x="646" y="129.42" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">each output</text><text x="646" y="143.72" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">a metrics row</text><text x="646" y="158.02" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">per request</text><text x="646" y="172.32" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle">plots, report</text><line x1="132" y1="138" x2="148" y2="138" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><line x1="242" y1="138" x2="258" y2="138" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><line x1="410" y1="138" x2="426" y2="138" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><line x1="568" y1="138" x2="584" y2="138" stroke="#6b5f4d" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="14" y="246" width="692" height="58" rx="10" fill="#f6e9c8" stroke="#8a5a00" stroke-width="1.3"/><text x="360" y="270" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">measured: throughput (tokens/s), TTFT, TPOT, end-to-end latency, peak GPU memory</text><text x="360" y="290" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">compared: naive vs dynamic batching on Hugging Face, against vLLM's continuous batching</text></svg>

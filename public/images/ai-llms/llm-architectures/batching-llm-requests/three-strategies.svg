="10" font-weight="400" fill="#7a6d57" text-anchor="middle">8</text><text x="424" y="574" font-size="10" font-weight="400" fill="#7a6d57" text-anchor="middle">10</text><text x="492" y="574" font-size="10" font-weight="400" fill="#7a6d57" text-anchor="middle">12</text><text x="560" y="574" font-size="10" font-weight="400" fill="#7a6d57" text-anchor="middle">14</text><text x="586" y="470" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start">mean TTFT</text><text x="586" y="489" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="start">1.0 step</text><text x="586" y="508" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">no waiting,</text><text x="586" y="527" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">no idle slots</text><text x="24" y="26" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start" font-style="italic">dot = arrival, red dashes = waiting in the queue, green = decoding (steps), pink = idle in the batch</text></svg>

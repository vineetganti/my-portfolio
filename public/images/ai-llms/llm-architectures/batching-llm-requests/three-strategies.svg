<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="720" height="600" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Naive, dynamic and continuous batching on the same five requests</title><desc>Five requests arriving at steps 0, 1, 5, 6 and 7, needing 6, 3, 4, 2 and 5 steps, under three strategies with room for four. Naive batching waits for four requests, so the first waits 6 steps, everyone finishes with the longest, and the fifth never starts. Dynamic batching launches the first two after a 2-step wait, but the next three wait for that batch to finish. Continuous batching starts every request when it arrives and frees each slot as soon as it finishes. Mean time to first token: 4.0, 2.8 and 1.0 steps.</desc><defs><marker id="ah-a3283f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b0273f"/></marker></defs><rect width="720" height="600" fill="#fffdf8"/><rect x="10" y="36" width="700" height="176" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="24" y="58" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start">Naive: launch when exactly 4 requests are waiting</text><line x1="288" y1="68" x2="288" y2="190" stroke="#9a5400" stroke-width="1.2" stroke-dasharray="5 3"/><text x="292" y="76" font-size="10" font-weight="700" fill="#9a5400" text-anchor="start">4th arrival: launch</text><line x1="492" y1="68" x2="492" y2="190" stroke="#9a5400" stroke-width="1.2" stroke-dasharray="5 3"/><text x="496" y="76" font-size="10" font-weight="700" fill="#9a5400" text-anchor="start">batch ends</text><text x="72" y="93" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="end">R1</text><line x1="89" y1="89" x2="286" y2="89" stroke="#b0273f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah-a3283f)"/><rect x="289" y="81" width="202" height="17" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="390" y="93.5" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">6</text><circle cx="84" cy="89" r="4.2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><text x="72" y="115" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="end">R2</text><line x1="123" y1="111" x2="286" y2="111" stroke="#b0273f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah-a3283f)"/><rect x="289" y="103" width="100" height="17" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="339" y="115.5" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">3</text><rect x="391" y="103" width="100" height="17" rx="4" fill="#fbd8d1" stroke="#b0273f" stroke-width="1" stroke-dasharray="3 3"/><text x="441" y="115.5" font-size="10" font-weight="400" fill="#b0273f" text-anchor="middle" font-style="italic">idle</text><circle cx="118" cy="111" r="4.2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><text x="72" y="137" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="end">R3</text><line x1="259" y1="133" x2="286" y2="133" stroke="#b0273f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah-a3283f)"/><rect x="289" y="125" width="134" height="17" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="356" y="137.5" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">4</text><rect x="425" y="125" width="66" height="17" rx="4" fill="#fbd8d1" stroke="#b0273f" stroke-width="1" stroke-dasharray="3 3"/><text x="458" y="137.5" font-size="10" font-weight="400" fill="#b0273f" text-anchor="middle" font-style="italic">idle</text><circle cx="254" cy="133" r="4.2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><text x="72" y="159" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="end">R4</text><rect x="289" y="147" width="66" height="17" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="322" y="159.5" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">2</text><rect x="357" y="147" width="134" height="17" rx="4" fill="#fbd8d1" stroke="#b0273f" stroke-width="1" stroke-dasharray="3 3"/><text x="424" y="159.5" font-size="10" font-weight="400" fill="#b0273f" text-anchor="middle" font-style="italic">idle</text><circle cx="288" cy="155" r="4.2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><text x="72" y="181" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="end">R5</text><line x1="327" y1="177" x2="566" y2="177" stroke="#b0273f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah-a3283f)"/><text x="342.4" y="190" font-size="10.5" font-weight="400" fill="#b0273f" text-anchor="start" font-style="italic">still waiting for 3 more requests</text><circle cx="322" cy="177" r="4.2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><text x="84" y="202" font-size="10" font-weight="400" fill="#7a6d57" text-anchor="middle">0</text><text x="152" y="202" font-size="10" font-weight="400" fill="#7a6d57" text-anchor="middle">2</text><text x="220" y="202" font-size="10" font-weight="400" fill="#7a6d57" text-anchor="middle">4</text><text x="288" y="202" font-size="10" font-weight="400" fill="#7a6d57" text-anchor="middle">6</text><text x="356" y="202" font-size="10" font-weight="400" fill="#7a6d57" text-anchor="middle">8</text><text x="424" y="202" font-size="10" font-weight="400" fill="#7a6d57" text-anchor="middle">10</text><text x="492" y="202" font-size="10" font-weight="400" fill="#7a6d57" text-anchor="middle">12</text><text x="560" y="202" font-size="10" font-weight="400" fill="#7a6d57" text-anchor="middle">14</text><text x="586" y="98" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start">mean TTFT</text><text x="586" y="117" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="start">4.0 steps</text><text x="586" y="136" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">(R1 to R4)</text><text x="586" y="155" font-size="11.5" font-weight="400" fill="#b0273f" text-anchor="start">R5 never</text><text x="586" y="174" font-size="11.5" font-weight="400" fill="#b0273f" text-anchor="start">starts</text><rect x="10" y="222" width="700" height="176" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="24" y="244" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start">Dynamic: launch when 4 are waiting, or the oldest has waited 2 steps</text><line x1="152" y1="254" x2="152" y2="376" stroke="#9a5400" stroke-width="1.2" stroke-dasharray="5 3"/><text x="156" y="262" font-size="10" font-weight="700" fill="#9a5400" text-anchor="start">timer fires</text><line x1="356" y1="254" x2="356" y2="376" stroke="#9a5400" stroke-width="1.2" stroke-dasharray="5 3"/><text x="360" y="262" font-size="10" font-weight="700" fill="#9a5400" text-anchor="start">batch 1 ends</text><text x="72" y="279" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="end">R1</text><line x1="89" y1="275" x2="150" y2="275" stroke="#b0273f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah-a3283f)"/><rect x="153" y="267" width="202" height="17" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="254" y="279.5" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">6</text><circle cx="84" cy="275" r="4.2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><text x="72" y="301" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="end">R2</text><line x1="123" y1="297" x2="150" y2="297" stroke="#b0273f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah-a3283f)"/><rect x="153" y="289" width="100" height="17" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="203" y="301.5" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">3</text><rect x="255" y="289" width="100" height="17" rx="4" fill="#fbd8d1" stroke="#b0273f" stroke-width="1" stroke-dasharray="3 3"/><text x="305" y="301.5" font-size="10" font-weight="400" fill="#b0273f" text-anchor="middle" font-style="italic">idle</text><circle cx="118" cy="297" r="4.2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><text x="72" y="323" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="end">R3</text><line x1="259" y1="319" x2="354" y2="319" stroke="#b0273f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah-a3283f)"/><rect x="357" y="311" width="134" height="17" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="424" y="323.5" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">4</text><rect x="493" y="311" width="32" height="17" rx="4" fill="#fbd8d1" stroke="#b0273f" stroke-width="1" stroke-dasharray="3 3"/><circle cx="254" cy="319" r="4.2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><text x="72" y="345" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="end">R4</text><line x1="293" y1="341" x2="354" y2="341" stroke="#b0273f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah-a3283f)"/><rect x="357" y="333" width="66" height="17" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="390" y="345.5" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">2</text><rect x="425" y="333" width="100" height="17" rx="4" fill="#fbd8d1" stroke="#b0273f" stroke-width="1" stroke-dasharray="3 3"/><text x="475" y="345.5" font-size="10" font-weight="400" fill="#b0273f" text-anchor="middle" font-style="italic">idle</text><circle cx="288" cy="341" r="4.2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.2"/><text x="72" y="367" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="end">R5</text><line x1="327" y1="363" x2="354" y2="363" stroke="#b0273f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah-a3283f)"/><rect x="357" y="355" width="168" height="17" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="441" y="367.5" font-size="10.5" font-weight="70
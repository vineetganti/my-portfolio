<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Path of one PyTorch call from Python to the hardware</title><desc>A call like torch.matmul goes through six steps: the Python API call, a bridge that turns Python objects into C++ tensors, the dispatcher that picks a backend from the device and data type, the ATen kernel, the backend library such as MKL on the CPU or cuBLAS on the GPU, and finally the result wrapped back into a Python object.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d36"/></marker></defs><rect width="720" height="300" fill="#ffffff"/><text x="20" y="24" font-size="14" font-weight="700" fill="#2c361c" text-anchor="start">torch.matmul(a, b)</text><rect x="8" y="52" width="104" height="100" rx="10" fill="#ffffff" stroke="#4f5d36" stroke-width="1.5"/><circle cx="24" cy="68" r="11" fill="#8a5a00"/><text x="24" y="72" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="60" y="100" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">Python API</text><text x="60" y="118" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">torch.matmul</text><line x1="113" y1="102" x2="127" y2="102" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="128" y="52" width="104" height="100" rx="10" fill="#ffffff" stroke="#4f5d36" stroke-width="1.5"/><circle cx="144" cy="68" r="11" fill="#8a5a00"/><text x="144" y="72" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="180" y="100" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">Data bridge</text><text x="180" y="118" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">PyObject →</text><text x="180" y="133" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">at::Tensor</text><line x1="233" y1="102" x2="247" y2="102" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="248" y="52" width="104" height="100" rx="10" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.5"/><circle cx="264" cy="68" r="11" fill="#8a5a00"/><text x="264" y="72" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="300" y="100" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">Dispatcher</text><text x="300" y="118" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">device, dtype,</text><text x="300" y="133" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">autograd</text><line x1="353" y1="102" x2="367" y2="102" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="368" y="52" width="104" height="100" rx="10" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.5"/><circle cx="384" cy="68" r="11" fill="#8a5a00"/><text x="384" y="72" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="420" y="100" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">ATen kernel</text><text x="420" y="118" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">C++ op</text><line x1="473" y1="102" x2="487" y2="102" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="488" y="52" width="104" height="100" rx="10" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.5"/><circle cx="504" cy="68" r="11" fill="#8a5a00"/><text x="504" y="72" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="540" y="100" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">Backend lib</text><text x="540" y="118" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">MKL / OpenBLAS</text><text x="540" y="133" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">cuBLAS (GPU)</text><line x1="593" y1="102" x2="607" y2="102" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="608" y="52" width="104" height="100" rx="10" fill="#ffffff" stroke="#4f5d36" stroke-width="1.5"/><circle cx="624" cy="68" r="11" fill="#8a5a00"/><text x="624" y="72" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="660" y="100" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">Result</text><text x="660" y="118" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">wrapped as a</text><text x="660" y="133" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">Python tensor</text><rect x="8" y="178" width="704" height="52" rx="10" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.4"/><text x="20" y="200" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="start">Python's part: steps 1, 2 and 6: object handling, microseconds.</text><text x="20" y="220" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="start">Compute part: steps 4 and 5: native code that does the real arithmetic with SIMD or on the GPU.</text><text x="360" y="258" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">The same Python line reaches different backends: the dispatcher reads the tensor's device and picks the kernel.</text></svg>

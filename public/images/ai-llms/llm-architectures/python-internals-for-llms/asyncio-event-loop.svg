<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 332" width="720" height="332" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>An asyncio event loop overlapping three network waits</title><desc>One thread runs an event loop that switches between three coroutines. Each coroutine runs for 8 milliseconds, awaits a network reply for about 90 milliseconds, then runs 8 more. While one waits, the loop runs another, so all three finish at 128 milliseconds instead of 324 if they ran one after another.</desc><defs></defs><rect width="720" height="332" fill="#ffffff"/><text x="20" y="26" font-size="14" font-weight="700" fill="#3a3226" text-anchor="start">One thread, many waits: an event loop overlaps the time spent waiting</text><text x="136" y="71" font-size="12" font-weight="700" fill="#3a3226" text-anchor="end">coroutine A</text><rect x="150" y="56" width="30.8571" height="22" rx="4" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><line x1="182.857" y1="67" x2="533.714" y2="67" stroke="#8d8068" stroke-width="1.4" stroke-dasharray="4 3"/><text x="358.286" y="63" font-size="10.5" font-weight="400" fill="#8d8068" text-anchor="middle" font-style="italic">await: waiting for the network</text><rect x="535.714" y="56" width="30.8571" height="22" rx="4" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><text x="136" y="111" font-size="12" font-weight="700" fill="#3a3226" text-anchor="end">coroutine B</text><rect x="180.857" y="96" width="30.8571" height="22" rx="4" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.2"/><line x1="213.714" y1="107" x2="572.286" y2="107" stroke="#8d8068" stroke-width="1.4" stroke-dasharray="4 3"/><text x="393" y="103" font-size="10.5" font-weight="400" fill="#8d8068" text-anchor="middle" font-style="italic">await: waiting for the network</text><rect x="574.286" y="96" width="30.8571" height="22" rx="4" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.2"/><text x="136" y="151" font-size="12" font-weight="700" fill="#3a3226" text-anchor="end">coroutine C</text><rect x="211.714" y="136" width="30.8571" height="22" rx="4" fill="#e3d9c2" stroke="#6b5f4d" stroke-width="1.2"/><line x1="244.571" y1="147" x2="610.857" y2="147" stroke="#8d8068" stroke-width="1.4" stroke-dasharray="4 3"/><text x="427.714" y="143" font-size="10.5" font-weight="400" fill="#8d8068" text-anchor="middle" font-style="italic">await: waiting for the network</text><rect x="612.857" y="136" width="30.8571" height="22" rx="4" fill="#e3d9c2" stroke="#6b5f4d" stroke-width="1.2"/><text x="136" y="205" font-size="12" font-weight="700" fill="#3a3226" text-anchor="end">event loop</text><text x="136" y="219" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="end">(one thread)</text><rect x="150" y="190" width="540" height="22" rx="4" fill="#ffffff" stroke="#8d8068" stroke-width="1" stroke-dasharray="3 3"/><rect x="150" y="190" width="30.8571" height="22" rx="3" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><text x="165.429" y="205" font-size="10.5" font-weight="700" fill="#3a3226" text-anchor="middle">A</text><rect x="535.714" y="190" width="30.8571" height="22" rx="3" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><text x="551.143" y="205" font-size="10.5" font-weight="700" fill="#3a3226" text-anchor="middle">A</text><rect x="180.857" y="190" width="30.8571" height="22" rx="3" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.2"/><text x="196.286" y="205" font-size="10.5" font-weight="700" fill="#3a3226" text-anchor="middle">B</text><rect x="574.286" y="190" width="30.8571" height="22" rx="3" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.2"/><text x="589.714" y="205" font-size="10.5" font-weight="700" fill="#3a3226" text-anchor="middle">B</text><rect x="211.714" y="190" width="30.8571" height="22" rx="3" fill="#e3d9c2" stroke="#6b5f4d" stroke-width="1.2"/><text x="227.143" y="205" font-size="10.5" font-weight="700" fill="#3a3226" text-anchor="middle">C</text><rect x="612.857" y="190" width="30.8571" height="22" rx="3" fill="#e3d9c2" stroke="#6b5f4d" stroke-width="1.2"/><text x="628.286" y="205" font-size="10.5" font-weight="700" fill="#3a3226" text-anchor="middle">C</text><text x="389.143" y="205" font-size="10.5" font-weight="400" fill="#8d8068" text-anchor="middle" font-style="italic">nothing ready: the thread sleeps</text><text x="150" y="236" font-size="10.5" font-weight="400" fill="#8d8068" text-anchor="middle">0</text><text x="227.143" y="236" font-size="10.5" font-weight="400" fill="#8d8068" text-anchor="middle">20</text><text x="304.286" y="236" font-size="10.5" font-weight="400" fill="#8d8068" text-anchor="middle">40</text><text x="381.429" y="236" font-size="10.5" font-weight="400" fill="#8d8068" text-anchor="middle">60</text><text x="458.571" y="236" font-size="10.5" font-weight="400" fill="#8d8068" text-anchor="middle">80</text><text x="535.714" y="236" font-size="10.5" font-weight="400" fill="#8d8068" text-anchor="middle">100</text><text x="612.857" y="236" font-size="10.5" font-weight="400" fill="#8d8068" text-anchor="middle">120</text><text x="690" y="236" font-size="10.5" font-weight="400" fill="#8d8068" text-anchor="middle">140 ms</text><rect x="20" y="254" width="680" height="62" rx="10" fill="#f6e9c8" stroke="#8a5a00" stroke-width="1.3"/><text x="360" y="278" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">all three finish at 128 ms, against 3 × 108 = 324 ms one after another</text><text x="360" y="300" font-size="12" font-weight="400" fill="#6b5f4d" text-anchor="middle">no parallelism and no GIL contention: the overlap comes from awaiting, not from extra threads</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 304" width="720" height="304" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>The CPU runs ahead of the GPU until it synchronizes</title><desc>The CPU launches three kernels quickly, carries on with other Python code, then blocks at a synchronization point until the GPU has finished its queue.</desc><defs><marker id="ah-7d8257" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8d8068"/></marker></defs><rect width="720" height="304" fill="#ffffff"/><text x="20" y="98" font-size="14" font-weight="700" fill="#3a3226" text-anchor="start">CPU</text><text x="20" y="114" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="start">Python thread</text><text x="20" y="198" font-size="14" font-weight="700" fill="#3a3226" text-anchor="start">GPU</text><text x="20" y="214" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="start">stream (queue)</text><text x="150" y="56" font-size="12.5" font-weight="400" fill="#6b5f4d" text-anchor="start" font-style="italic">kernel launches return immediately, so the CPU runs ahead</text><rect x="160" y="72" width="28" height="40" rx="5" fill="#f6e9c8" stroke="#8a5a00" stroke-width="1.2"/><text x="174" y="96" font-size="11" font-weight="700" fill="#3a3226" text-anchor="middle">L1</text><rect x="192" y="72" width="28" height="40" rx="5" fill="#f6e9c8" stroke="#8a5a00" stroke-width="1.2"/><text x="206" y="96" font-size="11" font-weight="700" fill="#3a3226" text-anchor="middle">L2</text><rect x="224" y="72" width="28" height="40" rx="5" fill="#f6e9c8" stroke="#8a5a00" stroke-width="1.2"/><text x="238" y="96" font-size="11" font-weight="700" fill="#3a3226" text-anchor="middle">L3</text><rect x="260" y="72" width="90" height="40" rx="6" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.2"/><text x="305" y="90" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="middle">other</text><text x="305" y="104" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="middle">Python code</text><rect x="350" y="72" width="210" height="40" rx="6" fill="#f7e0da" stroke="#a3283f" stroke-width="1.4" stroke-dasharray="5 3"/><text x="455" y="90" font-size="12" font-weight="700" fill="#a3283f" text-anchor="middle">blocked, waiting for the GPU</text><text x="455" y="104" font-size="11.5" font-weight="400" fill="#a3283f" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">torch.cuda.synchronize()</text><rect x="560" y="72" width="90" height="40" rx="6" fill="#f6ecd6" stroke="#6b5f4d" stroke-width="1.2"/><text x="605" y="90" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="middle">read result</text><text x="605" y="104" font-size="10.5" font-weight="400" fill="#3a3226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">.item() / .cpu()</text><rect x="176" y="172" width="114" height="40" rx="6" fill="#f6e9c8" stroke="#8a5a00" stroke-width="1.2"/><text x="233.0" y="197" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">kernel 1</text><rect x="290" y="172" width="135" height="40" rx="6" fill="#f6e9c8" stroke="#8a5a00" stroke-width="1.2"/><text x="357.5" y="197" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">kernel 2</text><rect x="425" y="172" width="135" height="40" rx="6" fill="#f6e9c8" stroke="#8a5a00" stroke-width="1.2"/><text x="492.5" y="197" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">kernel 3</text><line x1="174" y1="114" x2="176" y2="170" stroke="#8d8068" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-7d8257)"/><line x1="206" y1="114" x2="292" y2="170" stroke="#8d8068" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-7d8257)"/><line x1="238" y1="114" x2="427" y2="170" stroke="#8d8068" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ah-7d8257)"/><text x="176" y="238" font-size="12.5" font-weight="400" fill="#6b5f4d" text-anchor="start" font-style="italic">the GPU works through its queue at its own pace</text><line x1="150" y1="262" x2="700" y2="262" stroke="#8d8068" stroke-width="1.4" marker-end="url(#ah-7d8257)"/><text x="700" y="280" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="end" font-style="italic">time</text><text x="20" y="280" font-size="12.5" font-weight="400" fill="#6b5f4d" text-anchor="start" font-style="italic">synchronize(), .cpu() and .item() make the CPU wait until the GPU has caught up.</text></svg>

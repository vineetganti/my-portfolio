<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" width="720" height="356" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Several Python processes on one GPU</title><desc>Two Python processes each create their own CUDA context and receive their own slice of VRAM. The driver time-slices the streaming multiprocessors between the contexts unless MPS or MIG is used to share or partition them.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d36"/></marker></defs><rect width="720" height="356" fill="#ffffff"/><rect x="20" y="24" width="200" height="70" rx="12" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.5"/><text x="120" y="54.275" font-size="13.5" font-weight="700" fill="#2c361c" text-anchor="middle">Process A</text><text x="120" y="71.825" font-size="13.5" font-weight="700" fill="#2c361c" text-anchor="middle">own CUDA context</text><rect x="260" y="24" width="200" height="70" rx="12" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.5"/><text x="360" y="54.275" font-size="13.5" font-weight="700" fill="#2c361c" text-anchor="middle">Process B</text><text x="360" y="71.825" font-size="13.5" font-weight="700" fill="#2c361c" text-anchor="middle">own CUDA context</text><rect x="500" y="24" width="200" height="70" rx="12" fill="#ffffff" stroke="#7d8257" stroke-width="1.5" stroke-dasharray="5 4"/><text x="600" y="54.275" font-size="13.5" font-weight="700" fill="#2c361c" text-anchor="middle">Process C</text><text x="600" y="71.825" font-size="13.5" font-weight="700" fill="#2c361c" text-anchor="middle">(optional)</text><rect x="20" y="134" width="680" height="44" rx="10" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.5"/><text x="360" y="152.425" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">CUDA driver</text><text x="360" y="168.545" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle">checks each request, schedules contexts onto the GPU</text><line x1="120" y1="96" x2="120" y2="132" stroke="#4f5d36" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><line x1="360" y1="96" x2="360" y2="132" stroke="#4f5d36" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><line x1="600" y1="96" x2="600" y2="132" stroke="#4f5d36" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="14" y="196" width="692" height="148" rx="14" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="360" y="220" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">One GPU</text><text x="26" y="256" font-size="12" font-weight="700" fill="#2c361c" text-anchor="start">VRAM</text><rect x="76" y="236" width="250" height="32" rx="4" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><text x="201" y="257" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">A: weights, activations</text><rect x="326" y="236" width="190" height="32" rx="4" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.4"/><text x="421" y="257" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">B: weights, KV</text><rect x="516" y="236" width="160" height="32" rx="4" fill="#ffffff" stroke="#7d8257" stroke-width="1.4" stroke-dasharray="4 3"/><text x="596" y="257" font-size="11.5" font-weight="400" fill="#7d8257" text-anchor="middle" font-style="italic">free</text><text x="26" y="302" font-size="12" font-weight="700" fill="#2c361c" text-anchor="start">SMs</text><rect x="76" y="286" width="74" height="26" rx="4" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><rect x="154" y="286" width="74" height="26" rx="4" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><rect x="232" y="286" width="74" height="26" rx="4" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><rect x="310" y="286" width="74" height="26" rx="4" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><rect x="388" y="286" width="74" height="26" rx="4" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><rect x="466" y="286" width="74" height="26" rx="4" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><rect x="544" y="286" width="74" height="26" rx="4" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><rect x="622" y="286" width="74" height="26" rx="4" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><text x="388" y="332" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">default: contexts take turns on the SMs (time slicing). MPS shares them; MIG partitions the GPU.</text></svg>

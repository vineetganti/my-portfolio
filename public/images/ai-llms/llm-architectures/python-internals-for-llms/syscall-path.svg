<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384" width="720" height="384" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>From open() to the kernel and back</title><desc>A Python open call goes through CPython and the C library, then crosses into the kernel as a system call. The kernel checks permissions and returns either a file descriptor or an error code, which Python turns into a PermissionError.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-a3283f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b0273f"/></marker></defs><rect width="720" height="384" fill="#fffdf8"/><rect x="150" y="14" width="360" height="48" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="330" y="34" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Your code</text><text x="330" y="52" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">open('my_file.txt', 'w')</text><rect x="150" y="80" width="360" height="48" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="330" y="100" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">CPython</text><text x="330" y="118" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">io module and C code (fileio.c)</text><rect x="150" y="146" width="360" height="48" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="330" y="166" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">C standard library (libc)</text><text x="330" y="184" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">its open() wrapper prepares the arguments</text><line x1="330" y1="62" x2="330" y2="78" stroke="#5e5241" stroke-width="2" marker-end="url(#ah-4f5d36)"/><line x1="330" y1="128" x2="330" y2="144" stroke="#5e5241" stroke-width="2" marker-end="url(#ah-4f5d36)"/><line x1="330" y1="194" x2="330" y2="238" stroke="#5e5241" stroke-width="2" marker-end="url(#ah-4f5d36)"/><line x1="20" y1="214" x2="700" y2="214" stroke="#b0273f" stroke-width="1.6" stroke-dasharray="8 5"/><text x="26" y="207" font-size="12" font-weight="700" fill="#b0273f" text-anchor="start">user space</text><text x="26" y="231" font-size="12" font-weight="700" fill="#b0273f" text-anchor="start">kernel space</text><text x="660" y="207" font-size="12" font-weight="400" fill="#b0273f" text-anchor="end" font-style="italic">the crossing is a system call and a context switch</text><rect x="150" y="240" width="360" height="54" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.6"/><text x="330" y="262" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">OS kernel</text><text x="330" y="280" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">checks the user and group IDs against the file's owner</text><rect x="90" y="320" width="260" height="48" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="220" y="340" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">allowed</text><text x="220" y="357" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">returns a file descriptor</text><rect x="370" y="320" width="260" height="48" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.6"/><text x="500" y="340" font-size="13.5" font-weight="700" fill="#b0273f" text-anchor="middle">denied</text><text x="500" y="357" font-size="12" font-weight="400" fill="#2f281e" text-anchor="middle">returns an error code</text><line x1="260" y1="296" x2="220" y2="318" stroke="#5e5241" stroke-width="2" marker-end="url(#ah-4f5d36)"/><line x1="400" y1="296" x2="500" y2="318" stroke="#b0273f" stroke-width="2" marker-end="url(#ah-a3283f)"/><path d="M632 344 L684 344 L684 38 L512 38" fill="none" stroke="#b0273f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ah-a3283f)"/><text x="676" y="112" font-size="12" font-weight="400" fill="#b0273f" text-anchor="end" font-style="italic">Python raises</text><text x="676" y="127" font-size="12" font-weight="400" fill="#b0273f" text-anchor="end" font-style="italic">PermissionError</text></svg>

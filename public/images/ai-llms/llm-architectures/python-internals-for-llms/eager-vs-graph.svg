<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Eager execution versus a compiled graph</title><desc>In eager mode each operation is dispatched from Python as it is reached, so the CPU does Python work between many small GPU kernels and the GPU idles between them. In a compiled graph the model is traced once, optimised and fused, and later calls run as a few large kernels with little Python in the loop.</desc><defs></defs><rect width="720" height="330" fill="#fffdf8"/><text x="20" y="24" font-size="13.5" font-weight="700" fill="#b0273f" text-anchor="start">Eager (PyTorch default)</text><text x="20" y="62" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start">CPU</text><text x="20" y="100" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start">GPU</text><rect x="130" y="46" width="56" height="28" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.3"/><text x="158" y="65" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">python</text><rect x="186" y="46" width="28" height="28" rx="4" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.3"/><text x="200" y="65" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">↗</text><rect x="200" y="84" width="40" height="28" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.3"/><text x="220" y="103" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">k</text><rect x="240" y="46" width="56" height="28" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.3"/><text x="268" y="65" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">python</text><rect x="296" y="46" width="28" height="28" rx="4" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.3"/><text x="310" y="65" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">↗</text><rect x="310" y="84" width="40" height="28" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.3"/><text x="330" y="103" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">k</text><rect x="350" y="46" width="56" height="28" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.3"/><text x="378" y="65" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">python</text><rect x="406" y="46" width="28" height="28" rx="4" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.3"/><text x="420" y="65" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">↗</text><rect x="420" y="84" width="40" height="28" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.3"/><text x="440" y="103" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">k</text><rect x="460" y="46" width="56" height="28" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.3"/><text x="488" y="65" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">python</text><rect x="516" y="46" width="28" height="28" rx="4" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.3"/><text x="530" y="65" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">↗</text><rect x="530" y="84" width="40" height="28" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.3"/><text x="550" y="103" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">k</text><rect x="570" y="46" width="56" height="28" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.3"/><text x="598" y="65" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">python</text><rect x="626" y="46" width="28" height="28" rx="4" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.3"/><text x="640" y="65" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">↗</text><rect x="640" y="84" width="40" height="28" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.3"/><text x="660" y="103" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">k</text><text x="690" y="140" font-size="12" font-weight="700" fill="#b0273f" text-anchor="end">many launches, GPU idles between small kernels</text><text x="20" y="176" font-size="13.5" font-weight="700" fill="#5e5241" text-anchor="start">Compiled graph (torch.compile, tf.function)</text><text x="20" y="214" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start">CPU</text><text x="20" y="252" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start">GPU</text><rect x="130" y="198" width="70" height="28" rx="4" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.3"/><text x="165" y="217" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">one call</text><rect x="170" y="236" width="360" height="28" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="350" y="255" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">few large fused kernels, back to back</text><text x="690" y="292" font-size="12" font-weight="700" fill="#5e5241" text-anchor="end">traced once; later calls skip most Python and fuse operations</text><text x="360" y="318" font-size="12.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">Eager is easy to debug and always ready. Compilation pays a one-time tracing cost for speed.</text></svg>

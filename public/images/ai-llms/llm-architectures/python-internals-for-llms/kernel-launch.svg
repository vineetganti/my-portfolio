<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 332" width="720" height="332" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>From kernel source to running on the GPU</title><desc>A kernel is written in CUDA C++, compiled to a device binary, loaded by the driver into GPU memory, and launched from the CPU with a grid and block configuration and its arguments. The launch becomes a command in a stream's queue and the GPU runs the thread blocks on its streaming multiprocessors asynchronously.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="332" fill="#fffdf8"/><rect x="8" y="52" width="104" height="100" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><circle cx="24" cy="68" r="11" fill="#9a5400"/><text x="24" y="72" font-size="11.5" font-weight="700" fill="#fffdf8" text-anchor="middle">1</text><text x="60" y="98" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Write</text><text x="60" y="116" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">kernel.cu</text><line x1="113" y1="102" x2="127" y2="102" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="128" y="52" width="104" height="100" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><circle cx="144" cy="68" r="11" fill="#9a5400"/><text x="144" y="72" font-size="11.5" font-weight="700" fill="#fffdf8" text-anchor="middle">2</text><text x="180" y="98" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Compile</text><text x="180" y="116" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">nvcc → PTX / SASS</text><line x1="233" y1="102" x2="247" y2="102" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="248" y="52" width="104" height="100" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><circle cx="264" cy="68" r="11" fill="#9a5400"/><text x="264" y="72" font-size="11.5" font-weight="700" fill="#fffdf8" text-anchor="middle">3</text><text x="300" y="98" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Load</text><text x="300" y="116" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">driver puts the</text><text x="300" y="131" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">binary on the GPU</text><line x1="353" y1="102" x2="367" y2="102" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="368" y="52" width="104" height="100" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><circle cx="384" cy="68" r="11" fill="#9a5400"/><text x="384" y="72" font-size="11.5" font-weight="700" fill="#fffdf8" text-anchor="middle">4</text><text x="420" y="98" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Launch</text><text x="420" y="116" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">kernel&lt;&lt;&lt;grid,</text><text x="420" y="131" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">block&gt;&gt;&gt;(args)</text><line x1="473" y1="102" x2="487" y2="102" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="488" y="52" width="104" height="100" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><circle cx="504" cy="68" r="11" fill="#9a5400"/><text x="504" y="72" font-size="11.5" font-weight="700" fill="#fffdf8" text-anchor="middle">5</text><text x="540" y="98" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Queue</text><text x="540" y="116" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">command in a</text><text x="540" y="131" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">stream</text><line x1="593" y1="102" x2="607" y2="102" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="608" y="52" width="104" height="100" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><circle cx="624" cy="68" r="11" fill="#9a5400"/><text x="624" y="72" font-size="11.5" font-weight="700" fill="#fffdf8" text-anchor="middle">6</text><text x="660" y="98" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Run</text><text x="660" y="116" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">thread blocks on</text><text x="660" y="131" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">the SMs</text><text x="248" y="40" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">on the CPU (host)</text><text x="548" y="40" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">on the GPU (device)</text><line x1="480" y1="44" x2="480" y2="160" stroke="#7a6d57" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="14" y="186" width="692" height="112" rx="12" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="30" y="210" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">The launch call returns as soon as the command is queued: the CPU does not wait for the kernel.</text><text x="30" y="234" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="start">Pointers to device memory and scalar parameters travel in the launch arguments.</text><text x="30" y="256" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="start">Frameworks hide steps 1–4: PyTorch ships pre-compiled kernels and calls them for you.</text><text x="30" y="280" font-size="12.5" font-weight="700" fill="#9a5400" text-anchor="start">To see which kernel ran, use the PyTorch profiler or Nsight Systems.</text></svg>

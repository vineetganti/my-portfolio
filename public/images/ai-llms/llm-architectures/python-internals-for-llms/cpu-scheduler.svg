<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 296" width="720" height="296" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>The OS scheduler shares CPU cores between processes</title><desc>Two CPU cores run three Python processes. The scheduler gives each process a time slice, then switches to another, saving and restoring state. Different processes run at the same moment on different cores.</desc><defs><marker id="ah-7d8257" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7d8257"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a00"/></marker></defs><rect width="720" height="296" fill="#ffffff"/><text x="20" y="24" font-size="14" font-weight="700" fill="#2c361c" text-anchor="start">2 cores, 3 Python processes: time slices and context switches</text><text x="20" y="86" font-size="13" font-weight="700" fill="#2c361c" text-anchor="start">core 1</text><rect x="100" y="60" width="84" height="42" rx="5" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><text x="142" y="86" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">P1</text><rect x="188" y="60" width="84" height="42" rx="5" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.4"/><text x="230" y="86" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">P2</text><rect x="276" y="60" width="84" height="42" rx="5" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><text x="318" y="86" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">P1</text><rect x="364" y="60" width="84" height="42" rx="5" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.4"/><text x="406" y="86" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">P3</text><rect x="452" y="60" width="84" height="42" rx="5" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><text x="494" y="86" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">P1</text><rect x="540" y="60" width="84" height="42" rx="5" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.4"/><text x="582" y="86" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">P2</text><text x="20" y="156" font-size="13" font-weight="700" fill="#2c361c" text-anchor="start">core 2</text><rect x="100" y="130" width="84" height="42" rx="5" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.4"/><text x="142" y="156" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">P3</text><rect x="188" y="130" width="84" height="42" rx="5" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.4"/><text x="230" y="156" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">P3</text><rect x="276" y="130" width="84" height="42" rx="5" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.4"/><text x="318" y="156" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">P2</text><rect x="364" y="130" width="84" height="42" rx="5" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.4"/><text x="406" y="156" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">P3</text><rect x="452" y="130" width="84" height="42" rx="5" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.4"/><text x="494" y="156" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">P2</text><rect x="540" y="130" width="84" height="42" rx="5" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><text x="582" y="156" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">P1</text><line x1="100" y1="204" x2="628" y2="204" stroke="#7d8257" stroke-width="1.4" marker-end="url(#ah-7d8257)"/><text x="628" y="222" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="end" font-style="italic">time</text><line x1="100" y1="184" x2="184" y2="184" stroke="#8a5a00" stroke-width="1.6" marker-start="url(#ah-8a5a00)"/><text x="292" y="188" font-size="11.5" font-weight="700" fill="#8a5a00" text-anchor="middle" font-style="italic">← one time slice (quantum)</text><text x="20" y="250" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="start">Preemptive: when a slice ends the kernel saves the process state and loads the next (a context switch).</text><text x="20" y="268" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="start">I/O-bound processes often give up the CPU early; CPU-bound ones use their whole slice.</text></svg>

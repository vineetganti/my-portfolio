<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Three ways Python reaches C code</title><desc>Python code can call C through a compiled extension module using the C API, through the ctypes module that loads a shared library at runtime, or through a binding generator such as Cython, pybind11 or CFFI that writes the glue code. All end in native code, and long calls can release the GIL.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="340" fill="#fffdf8"/><rect x="20" y="120" width="150" height="90" rx="12" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="95" y="160.1" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Python code</text><text x="95" y="178.3" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">import mod</text><rect x="220" y="20" width="340" height="80" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="234" y="44" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start">1. Extension module (C API)</text><text x="234" y="64" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">mymodule.so / .pyd, PyInit_mymodule registers functions</text><text x="234" y="82" font-size="11.5" font-weight="400" fill="#9a5400" text-anchor="start">manages reference counts: Py_INCREF / Py_DECREF</text><line x1="172" y1="165" x2="218" y2="60" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><line x1="562" y1="60" x2="596" y2="165" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="220" y="128" width="340" height="80" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="234" y="152" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start">2. ctypes</text><text x="234" y="172" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">load a shared library at runtime, no compiling</text><text x="234" y="190" font-size="11.5" font-weight="400" fill="#9a5400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ctypes.CDLL(find_library('c')).abs(-5)</text><line x1="172" y1="165" x2="218" y2="168" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><line x1="562" y1="168" x2="596" y2="165" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="220" y="236" width="340" height="80" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="234" y="260" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start">3. Binding generators</text><text x="234" y="280" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Cython, pybind11, CFFI write the glue for you</text><text x="234" y="298" font-size="11.5" font-weight="400" fill="#9a5400" text-anchor="start">typed Python or C++ signatures become Python calls</text><line x1="172" y1="165" x2="218" y2="276" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><line x1="562" y1="276" x2="596" y2="165" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="598" y="120" width="112" height="90" rx="12" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="654" y="152" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">C / C++ /</text><text x="654" y="168.9" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Fortran</text><text x="654" y="185.8" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">library</text><rect x="220" y="316" width="340" height="0.1" rx="0" fill="#fffdf8"/><text x="360" y="332" font-size="12.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">During a long C call the extension can release the GIL (Py_BEGIN_ALLOW_THREADS) so other threads run.</text></svg>

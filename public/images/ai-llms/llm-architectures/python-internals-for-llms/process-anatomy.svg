<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" width="720" height="390" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>What the OS gives a Python process</title><desc>A running Python program is one process with a PID, a virtual address space containing code, shared libraries, a heap for Python objects and a stack, and a file descriptor table whose entries point to open files, sockets and the terminal. The kernel keeps all of this and enforces access.</desc><defs></defs><rect width="720" height="390" fill="#fffdf8"/><rect x="10" y="10" width="460" height="368" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.6"/><text x="26" y="36" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Process</text><rect x="110" y="18" width="150" height="26" rx="6" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="185" y="34.75" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">PID 4242</text><text x="280" y="36" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">(python3 app.py)</text><text x="240" y="66" font-size="12" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">virtual address space</text><rect x="40" y="78" width="400" height="50" rx="8" fill="#fffdf8" stroke="#7a6d57" stroke-width="1.4"/><text x="56" y="100" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start">stack</text><text x="56" y="118" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">function frames, locals of C code</text><rect x="40" y="136" width="400" height="50" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><text x="56" y="158" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start">memory-mapped libraries</text><text x="56" y="176" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">libpython, libc, numpy .so files</text><rect x="40" y="194" width="400" height="50" rx="8" fill="#fdf0d4" stroke="#9a5400" stroke-width="2"/><text x="56" y="216" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start">heap  ↑ grows</text><text x="56" y="234" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">every Python object: ints, lists, dicts, tensors' metadata</text><rect x="40" y="252" width="400" height="50" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><text x="56" y="274" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start">data</text><text x="56" y="292" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">globals of the interpreter</text><rect x="40" y="310" width="400" height="50" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><text x="56" y="332" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start">code</text><text x="56" y="350" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">the CPython interpreter machine code</text><text x="240" y="366" font-size="1" font-weight="400" fill="#2f281e" text-anchor="middle"></text><rect x="490" y="10" width="220" height="250" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="600" y="34" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">File descriptors</text><rect x="504" y="60" width="192" height="32" rx="6" fill="#fffdf8" stroke="#5e5241" stroke-width="1.2"/><text x="518" y="81" font-size="13" font-weight="700" fill="#9a5400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0</text><text x="544" y="81" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">stdin</text><text x="690" y="81" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="end">keyboard / pipe</text><rect x="504" y="98" width="192" height="32" rx="6" fill="#fffdf8" stroke="#5e5241" stroke-width="1.2"/><text x="518" y="119" font-size="13" font-weight="700" fill="#9a5400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1</text><text x="544" y="119" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">stdout</text><text x="690" y="119" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="end">terminal</text><rect x="504" y="136" width="192" height="32" rx="6" fill="#fffdf8" stroke="#5e5241" stroke-width="1.2"/><text x="518" y="157" font-size="13" font-weight="700" fill="#9a5400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">2</text><text x="544" y="157" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">stderr</text><text x="690" y="157" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="end">terminal</text><rect x="504" y="174" width="192" height="32" rx="6" fill="#fffdf8" stroke="#5e5241" stroke-width="1.2"/><text x="518" y="195" font-size="13" font-weight="700" fill="#9a5400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">3</text><text x="544" y="195" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">my_file.txt</text><text x="690" y="195" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="end">open file</text><rect x="504" y="212" width="192" height="32" rx="6" fill="#fffdf8" stroke="#5e5241" stroke-width="1.2"/><text x="518" y="233" font-size="13" font-weight="700" fill="#9a5400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">4</text><text x="544" y="233" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">socket</text><text x="690" y="233" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="end">network peer</text><rect x="490" y="276" width="220" height="102" rx="14" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="600" y="308.475" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Kernel</text><text x="600" y="324.595" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle">keeps the PID, page tables and</text><text x="600" y="339.545" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle">fd table; every file, socket or</text><text x="600" y="354.495" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="middle">memory request goes through it</text></svg>

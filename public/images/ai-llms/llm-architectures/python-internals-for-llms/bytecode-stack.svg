<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Python bytecode runs on a value stack</title><desc>For the statement total equals price times qty, with price 12 and qty 5, four bytecode instructions run. Two loads push 12 and 5, a multiply pops both and pushes 60, and a store pops 60 into the name total.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d36"/></marker></defs><rect width="720" height="340" fill="#ffffff"/><text x="20" y="24" font-size="14" font-weight="700" fill="#2c361c" text-anchor="start">total = price * qty        (price = 12, qty = 5)</text><rect x="20" y="44" width="150" height="40" rx="8" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="95" y="67.75" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">LOAD_NAME price</text><text x="95" y="108" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">after instruction 1</text><rect x="45" y="122" width="100" height="130" rx="4" fill="#ffffff" stroke="#7d8257" stroke-width="1.3" stroke-dasharray="4 3"/><rect x="51" y="220" width="88" height="30" rx="5" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.5"/><text x="95" y="241" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">12</text><text x="95" y="270" font-size="11" font-weight="400" fill="#7d8257" text-anchor="middle" font-style="italic">value stack</text><line x1="172" y1="64" x2="198" y2="64" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="200" y="44" width="150" height="40" rx="8" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="275" y="67.75" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">LOAD_NAME qty</text><text x="275" y="108" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">after instruction 2</text><rect x="225" y="122" width="100" height="130" rx="4" fill="#ffffff" stroke="#7d8257" stroke-width="1.3" stroke-dasharray="4 3"/><rect x="231" y="220" width="88" height="30" rx="5" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.5"/><text x="275" y="241" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">12</text><rect x="231" y="184" width="88" height="30" rx="5" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.5"/><text x="275" y="205" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">5</text><text x="275" y="270" font-size="11" font-weight="400" fill="#7d8257" text-anchor="middle" font-style="italic">value stack</text><line x1="352" y1="64" x2="378" y2="64" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="380" y="44" width="150" height="40" rx="8" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="455" y="67.75" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">BINARY_OP  *</text><text x="455" y="108" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">after instruction 3</text><rect x="405" y="122" width="100" height="130" rx="4" fill="#ffffff" stroke="#7d8257" stroke-width="1.3" stroke-dasharray="4 3"/><rect x="411" y="220" width="88" height="30" rx="5" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.5"/><text x="455" y="241" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">60</text><text x="455" y="270" font-size="11" font-weight="400" fill="#7d8257" text-anchor="middle" font-style="italic">value stack</text><line x1="532" y1="64" x2="558" y2="64" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="560" y="44" width="150" height="40" rx="8" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="635" y="67.75" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">STORE_NAME total</text><text x="635" y="108" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">after instruction 4</text><rect x="585" y="122" width="100" height="130" rx="4" fill="#ffffff" stroke="#7d8257" stroke-width="1.3" stroke-dasharray="4 3"/><text x="635" y="270" font-size="11" font-weight="400" fill="#7d8257" text-anchor="middle" font-style="italic">value stack</text><text x="635" y="200" font-size="12" font-weight="700" fill="#4f5d36" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">names = {</text><text x="635" y="218" font-size="12" font-weight="700" fill="#8a5a00" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">'total': 60 }</text><text x="360" y="306" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">Try it: import dis; dis.dis(compile('total = price * qty', 'x', 'exec')). Exact opcode names vary by Python version.</text><text x="360" y="324" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">The PVM is a loop that fetches one instruction, does it with pre-compiled C code, and moves on.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 322" width="720" height="322" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>How GPU work escapes the GIL</title><desc>Timeline with three lanes. The Python thread calls into a C extension, which releases the GIL and queues a kernel on the GPU. While the GPU computes, the GIL is free for other Python threads. When the extension returns, it takes the GIL back and Python continues.</desc><defs></defs><rect width="720" height="322" fill="#fffdf8"/><text x="20" y="92" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start">Python thread</text><text x="20" y="162" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start">the GIL</text><text x="20" y="232" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start">GPU</text><rect x="130" y="70" width="100" height="34" rx="5" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><text x="180" y="92" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">run Python</text><rect x="230" y="70" width="70" height="34" rx="5" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.4"/><text x="265" y="92" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">launch</text><rect x="300" y="70" width="220" height="34" rx="5" fill="#fffdf8" stroke="#7a6d57" stroke-width="1.4" stroke-dasharray="4 3"/><text x="410" y="92" font-size="11.5" font-weight="400" fill="#7a6d57" text-anchor="middle" font-style="italic">free to wait or do other work</text><rect x="520" y="70" width="80" height="34" rx="5" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><text x="560" y="92" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">continue</text><rect x="130" y="140" width="100" height="34" rx="5" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><text x="180" y="162" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">held</text><rect x="230" y="140" width="70" height="34" rx="5" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><text x="265" y="162" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">held</text><rect x="300" y="140" width="220" height="34" rx="5" fill="#fffdf8" stroke="#7a6d57" stroke-width="1.4" stroke-dasharray="4 3"/><text x="410" y="162" font-size="11.5" font-weight="400" fill="#7a6d57" text-anchor="middle" font-style="italic">released: other Python threads can run</text><rect x="520" y="140" width="80" height="34" rx="5" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><text x="560" y="162" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">held</text><rect x="300" y="210" width="190" height="34" rx="5" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.6"/><text x="395" y="232" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">kernel runs on the GPU</text><rect x="130" y="210" width="170" height="34" rx="5" fill="#fffdf8" stroke="#dccfb1" stroke-width="1" stroke-dasharray="2 4"/><rect x="490" y="210" width="110" height="34" rx="5" fill="#fffdf8" stroke="#dccfb1" stroke-width="1" stroke-dasharray="2 4"/><text x="215" y="232" font-size="11.5" font-weight="400" fill="#7a6d57" text-anchor="middle" font-style="italic">idle</text><text x="545" y="232" font-size="11.5" font-weight="400" fill="#7a6d57" text-anchor="middle" font-style="italic">idle</text><circle cx="230" cy="52" r="10" fill="#9a5400"/><text x="230" y="56" font-size="11" font-weight="700" fill="#fffdf8" text-anchor="middle">1</text><circle cx="300" cy="52" r="10" fill="#9a5400"/><text x="300" y="56" font-size="11" font-weight="700" fill="#fffdf8" text-anchor="middle">2</text><circle cx="520" cy="52" r="10" fill="#9a5400"/><text x="520" y="56" font-size="11" font-weight="700" fill="#fffdf8" text-anchor="middle">4</text><circle cx="395" cy="192" r="10" fill="#9a5400"/><text x="395" y="196" font-size="11" font-weight="700" fill="#fffdf8" text-anchor="middle">3</text><text x="360" y="28" font-size="12" font-weight="700" fill="#9a5400" text-anchor="middle">1 delegate to C  ·  2 release the GIL  ·  3 GPU computes asynchronously  ·  4 take the GIL back</text><text x="365" y="276" font-size="12" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">time →</text><text x="360" y="304" font-size="12.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">The GIL only guards the interpreter. The GPU's work is native code, so it never competes for it.</text></svg>

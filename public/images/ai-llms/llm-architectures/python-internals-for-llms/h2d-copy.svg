<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" width="720" height="392" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Copying a tensor to the GPU</title><desc>The copy goes from host RAM over PCIe into GPU memory. A pageable source is first staged through a pinned buffer. A blocking copy makes the Python thread wait. A non_blocking copy from pinned memory is queued so the CPU carries on and the copy overlaps with other work.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d36"/></marker><marker id="ah-7d8257" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7d8257"/></marker></defs><rect width="720" height="392" fill="#ffffff"/><rect x="20" y="24" width="170" height="60" rx="10" fill="#efefe0" stroke="#7d8257" stroke-width="1.5"/><text x="105" y="49.45" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">Host RAM</text><text x="105" y="66.35" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">pageable tensor</text><rect x="230" y="24" width="170" height="60" rx="10" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.5"/><text x="315" y="49.45" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">pinned buffer</text><text x="315" y="66.35" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">page-locked staging</text><rect x="440" y="24" width="80" height="60" rx="10" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.5"/><text x="480" y="50.75" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">PCIe</text><text x="480" y="66.87" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">~32 GB/s</text><rect x="560" y="24" width="140" height="60" rx="10" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.5"/><text x="630" y="49.45" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">GPU HBM</text><text x="630" y="66.35" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">device tensor</text><line x1="192" y1="54" x2="228" y2="54" stroke="#4f5d36" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><line x1="402" y1="54" x2="438" y2="54" stroke="#4f5d36" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><line x1="522" y1="54" x2="558" y2="54" stroke="#4f5d36" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><text x="360" y="108" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">x.to('cuda')  moves the bytes across the bus</text><text x="20" y="150" font-size="13" font-weight="700" fill="#a3283f" text-anchor="start">Blocking copy (default)</text><text x="20" y="172" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="start">CPU thread</text><rect x="150" y="156" width="190" height="28" rx="5" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.4"/><text x="245" y="175" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">waits for the copy</text><rect x="340" y="156" width="120" height="28" rx="5" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><text x="400" y="175" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">next Python line</text><text x="20" y="204" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="start">GPU / DMA</text><rect x="150" y="190" width="190" height="28" rx="5" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.4"/><text x="245" y="209" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">copy</text><text x="20" y="262" font-size="13" font-weight="700" fill="#4f5d36" text-anchor="start">non_blocking=True (pinned source)</text><text x="20" y="284" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="start">CPU thread</text><rect x="150" y="268" width="40" height="28" rx="5" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.4"/><text x="170" y="287" font-size="11" font-weight="700" fill="#2c361c" text-anchor="middle">queue</text><rect x="190" y="268" width="270" height="28" rx="5" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><text x="325" y="287" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">CPU keeps going: next lines, data loading</text><text x="20" y="316" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="start">GPU / DMA</text><rect x="190" y="302" width="190" height="28" rx="5" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.4"/><text x="285" y="321" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">copy overlaps with CPU work</text><line x1="150" y1="350" x2="460" y2="350" stroke="#7d8257" stroke-width="1.4" marker-end="url(#ah-7d8257)"/><text x="466" y="354" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="start" font-style="italic">time</text><text x="360" y="378" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">Kernel launches, by contrast, return immediately in both cases: they are queued on the GPU.</text></svg>

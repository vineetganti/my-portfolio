<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 322" width="720" height="322" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Threads share one GIL, processes each have their own</title><desc>With threads, only one thread runs Python bytecode at a time, so they take turns. With processes, each has its own memory and its own GIL, so they run in parallel on separate cores.</desc><defs><marker id="ah-7d8257" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7d8257"/></marker></defs><rect width="720" height="322" fill="#ffffff"/><rect x="10" y="14" width="345" height="294" rx="14" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><rect x="365" y="14" width="345" height="294" rx="14" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="182" y="40" font-size="15" font-weight="700" fill="#2c361c" text-anchor="middle">Threads: one shared GIL</text><text x="537" y="40" font-size="15" font-weight="700" fill="#2c361c" text-anchor="middle">Processes: one GIL each</text><text x="30" y="92" font-size="12" font-weight="700" fill="#2c361c" text-anchor="start">thread A</text><rect x="30" y="100" width="52" height="30" rx="6" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="56.0" y="120" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">runs</text><rect x="86" y="100" width="52" height="30" rx="6" fill="#ffffff" stroke="#7d8257" stroke-width="1" stroke-dasharray="4 3"/><text x="112.0" y="120" font-size="11" font-weight="400" fill="#7d8257" text-anchor="middle" font-style="italic">waits</text><rect x="142" y="100" width="52" height="30" rx="6" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="168.0" y="120" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">runs</text><rect x="198" y="100" width="52" height="30" rx="6" fill="#ffffff" stroke="#7d8257" stroke-width="1" stroke-dasharray="4 3"/><text x="224.0" y="120" font-size="11" font-weight="400" fill="#7d8257" text-anchor="middle" font-style="italic">waits</text><rect x="254" y="100" width="52" height="30" rx="6" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="280.0" y="120" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">runs</text><text x="30" y="150" font-size="12" font-weight="700" fill="#2c361c" text-anchor="start">thread B</text><rect x="30" y="158" width="52" height="30" rx="6" fill="#ffffff" stroke="#7d8257" stroke-width="1" stroke-dasharray="4 3"/><text x="56.0" y="178" font-size="11" font-weight="400" fill="#7d8257" text-anchor="middle" font-style="italic">waits</text><rect x="86" y="158" width="52" height="30" rx="6" fill="#f3e5ab" stroke="#4f5d36" stroke-width="1.2"/><text x="112.0" y="178" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">runs</text><rect x="142" y="158" width="52" height="30" rx="6" fill="#ffffff" stroke="#7d8257" stroke-width="1" stroke-dasharray="4 3"/><text x="168.0" y="178" font-size="11" font-weight="400" fill="#7d8257" text-anchor="middle" font-style="italic">waits</text><rect x="198" y="158" width="52" height="30" rx="6" fill="#f3e5ab" stroke="#4f5d36" stroke-width="1.2"/><text x="224.0" y="178" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">runs</text><rect x="254" y="158" width="52" height="30" rx="6" fill="#ffffff" stroke="#7d8257" stroke-width="1" stroke-dasharray="4 3"/><text x="280.0" y="178" font-size="11" font-weight="400" fill="#7d8257" text-anchor="middle" font-style="italic">waits</text><line x1="30" y1="214" x2="322" y2="214" stroke="#7d8257" stroke-width="1.4" marker-end="url(#ah-7d8257)"/><text x="322" y="232" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="end" font-style="italic">time</text><text x="182" y="256" font-size="13" font-weight="400" fill="#2c361c" text-anchor="middle">Only one thread runs Python bytecode at a time.</text><text x="182" y="275" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">Threads waiting on I/O release the GIL,</text><text x="182" y="292" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">so threads still help for I/O-bound work.</text><text x="385" y="92" font-size="12" font-weight="700" fill="#2c361c" text-anchor="start">process 1 (own GIL, core 1)</text><rect x="385" y="100" width="52" height="30" rx="6" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="411.0" y="120" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">runs</text><rect x="441" y="100" width="52" height="30" rx="6" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="467.0" y="120" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">runs</text><rect x="497" y="100" width="52" height="30" rx="6" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="523.0" y="120" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">runs</text><rect x="553" y="100" width="52" height="30" rx="6" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="579.0" y="120" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">runs</text><rect x="609" y="100" width="52" height="30" rx="6" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="635.0" y="120" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">runs</text><text x="385" y="150" font-size="12" font-weight="700" fill="#2c361c" text-anchor="start">process 2 (own GIL, core 2)</text><rect x="385" y="158" width="52" height="30" rx="6" fill="#f3e5ab" stroke="#4f5d36" stroke-width="1.2"/><text x="411.0" y="178" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">runs</text><rect x="441" y="158" width="52" height="30" rx="6" fill="#f3e5ab" stroke="#4f5d36" stroke-width="1.2"/><text x="467.0" y="178" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">runs</text><rect x="497" y="158" width="52" height="30" rx="6" fill="#f3e5ab" stroke="#4f5d36" stroke-width="1.2"/><text x="523.0" y="178" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">runs</text><rect x="553" y="158" width="52" height="30" rx="6" fill="#f3e5ab" stroke="#4f5d36" stroke-width="1.2"/><text x="579.0" y="178" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">runs</text><rect x="609" y="158" width="52" height="30" rx="6" fill="#f3e5ab" stroke="#4f5d36" stroke-width="1.2"/><text x="635.0" y="178" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">runs</text><line x1="385" y1="214" x2="677" y2="214" stroke="#7d8257" stroke-width="1.4" marker-end="url(#ah-7d8257)"/><text x="677" y="232" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="end" font-style="italic">time</text><text x="537" y="256" font-size="13" font-weight="400" fill="#2c361c" text-anchor="middle">Separate memory and a separate GIL each:</text><text x="537" y="275" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">CPU-bound work runs truly in parallel</text><text x="537" y="292" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">on different cores.</text></svg>

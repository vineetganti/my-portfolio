<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>PyTorch's CUDA caching allocator</title><desc>When a tensor needs memory, the allocator first looks for a free cached block that is large enough. If one exists it is reused immediately. If not, it asks the CUDA driver with cudaMalloc, which is slow. When a tensor is freed its block goes back to the cache, not to the driver. Only empty_cache returns cached blocks with cudaFree.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d36"/></marker></defs><rect width="720" height="350" fill="#ffffff"/><rect x="20" y="24" width="160" height="56" rx="10" fill="#ffffff" stroke="#4f5d36" stroke-width="1.5"/><text x="100" y="47.45" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">new tensor</text><text x="100" y="64.35" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">needs N bytes</text><line x1="182" y1="52" x2="218" y2="52" stroke="#4f5d36" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="220" y="24" width="200" height="56" rx="10" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.5"/><text x="320" y="47.625" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">cache has a free block</text><text x="320" y="63.875" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">that is big enough?</text><line x1="320" y1="82" x2="320" y2="126" stroke="#4f5d36" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><text x="332" y="108" font-size="12" font-weight="700" fill="#a3283f" text-anchor="start">no</text><line x1="422" y1="52" x2="468" y2="52" stroke="#4f5d36" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><text x="446" y="44" font-size="12" font-weight="700" fill="#4f5d36" text-anchor="middle">yes</text><rect x="470" y="24" width="230" height="56" rx="10" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.5"/><text x="585" y="47.45" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">reuse it</text><text x="585" y="64.35" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">fast: no driver call</text><rect x="220" y="128" width="200" height="56" rx="10" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.5"/><text x="320" y="151.45" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">cudaMalloc</text><text x="320" y="168.35" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">slow, asks the driver</text><path d="M422 156 L586 156 L586 82" fill="none" stroke="#4f5d36" stroke-width="1.8" marker-end="url(#ah-4f5d36)" stroke-linejoin="round" stroke-linecap="round"/><text x="500" y="148" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle">block joins the pool, then is used</text><rect x="14" y="214" width="692" height="124" rx="12" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="30" y="238" font-size="13" font-weight="700" fill="#2c361c" text-anchor="start">When the tensor is deleted</text><text x="30" y="262" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="start">its block goes back to PyTorch's cache, not to the driver, ready for the next request.</text><text x="30" y="288" font-size="12.5" font-weight="700" fill="#8a5a00" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">torch.cuda.empty_cache()</text><text x="250" y="288" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="start">→ cudaFree on cached blocks that are unused: frees VRAM for other processes.</text><text x="30" y="314" font-size="12.5" font-weight="700" fill="#4f5d36" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">memory_allocated()</text><text x="250" y="314" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="start">counts live tensors;   memory_reserved()  also counts cached free blocks.</text></svg>

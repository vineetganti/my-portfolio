<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Ways to use several GPUs</title><desc>Four panels. Data parallelism copies the whole model to each GPU and splits the batch, then averages gradients. Model or tensor parallelism splits the weights of the layers across GPUs. Pipeline parallelism puts consecutive layer groups on different GPUs and streams micro-batches through them. Sharding such as ZeRO or FSDP splits parameters, gradients and optimizer states so each GPU holds only a slice.</desc><defs><marker id="ah-a3283f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a3283f"/></marker><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker></defs><rect width="720" height="470" fill="#ffffff"/><rect x="10" y="10" width="345" height="220" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="182.5" y="34" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Data parallelism</text><text x="182.5" y="51" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">same model, different data</text><rect x="365" y="10" width="345" height="220" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="537.5" y="34" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Model / tensor parallelism</text><text x="537.5" y="51" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">one layer split across GPUs</text><rect x="10" y="240" width="345" height="220" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="182.5" y="264" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Pipeline parallelism</text><text x="182.5" y="281" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">different layers, micro-batches</text><rect x="365" y="240" width="345" height="220" rx="14" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="537.5" y="264" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Sharding (ZeRO, FSDP)</text><text x="537.5" y="281" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">each GPU holds a slice of the state</text><rect x="34" y="72" width="136" height="76" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="102" y="98.15" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">GPU 1</text><text x="102" y="114.4" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">full model copy</text><text x="102" y="129.9" font-size="11.5" font-weight="400" fill="#8a5a00" text-anchor="middle">batch part 1</text><rect x="194" y="72" width="136" height="76" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="262" y="98.15" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">GPU 2</text><text x="262" y="114.4" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">full model copy</text><text x="262" y="129.9" font-size="11.5" font-weight="400" fill="#8a5a00" text-anchor="middle">batch part 2</text><line x1="102" y1="150" x2="102" y2="152" stroke="#6b5f4d" stroke-width="1"/><path d="M102 150 L102 182 L262 182 L262 150" fill="none" stroke="#a3283f" stroke-width="1.6" marker-end="url(#ah-a3283f)" stroke-linejoin="round" stroke-linecap="round"/><text x="182" y="200" font-size="11.5" font-weight="700" fill="#a3283f" text-anchor="middle">all-reduce: average the gradients</text><text x="182" y="218" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">most common way to scale training</text><rect x="393" y="76" width="140" height="64" rx="6" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><rect x="541" y="76" width="140" height="64" rx="6" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.5"/><text x="463" y="104" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">W columns 1…k</text><text x="463" y="122" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">on GPU 1</text><text x="611" y="104" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">W columns k…n</text><text x="611" y="122" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">on GPU 2</text><text x="537" y="166" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">y = [x·W₁ , x·W₂]</text><text x="537" y="188" font-size="11.5" font-weight="700" fill="#a3283f" text-anchor="middle">partial results are gathered</text><text x="537" y="210" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">for layers too big for one GPU</text><rect x="30" y="302" width="96" height="40" rx="8" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="78" y="317.8" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">GPU 1</text><text x="78" y="333.4" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">layers 1–4</text><line x1="127" y1="322" x2="135" y2="322" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="136" y="302" width="96" height="40" rx="8" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.5"/><text x="184" y="317.8" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">GPU 2</text><text x="184" y="333.4" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">layers 5–8</text><line x1="233" y1="322" x2="241" y2="322" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="242" y="302" width="96" height="40" rx="8" fill="#f7e0da" stroke="#a3283f" stroke-width="1.5"/><text x="290" y="317.8" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">GPU 3</text><text x="290" y="333.4" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">layers 9–12</text><rect x="48" y="364" width="28" height="18" rx="3" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1"/><text x="62" y="377" font-size="10" font-weight="700" fill="#3a3226" text-anchor="middle">m1</text><rect x="78" y="386" width="28" height="18" rx="3" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1"/><text x="92" y="399" font-size="10" font-weight="700" fill="#3a3226" text-anchor="middle">m1</text><rect x="108" y="408" width="28" height="18" rx="3" fill="#f7e0da" stroke="#a3283f" stroke-width="1"/><text x="122" y="421" font-size="10" font-weight="700" fill="#3a3226" text-anchor="middle">m1</text><rect x="78" y="364" width="28" height="18" rx="3" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1"/><text x="92" y="377" font-size="10" font-weight="700" fill="#3a3226" text-anchor="middle">m2</text><rect x="108" y="386" width="28" height="18" rx="3" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1"/><text x="122" y="399" font-size="10" font-weight="700" fill="#3a3226" text-anchor="middle">m2</text><rect x="138" y="408" width="28" height="18" rx="3" fill="#f7e0da" stroke="#a3283f" stroke-width="1"/><text x="152" y="421" font-size="10" font-weight="700" fill="#3a3226" text-anchor="middle">m2</text><rect x="108" y="364" width="28" height="18" rx="3" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1"/><text x="122" y="377" font-size="10" font-weight="700" fill="#3a3226" text-anchor="middle">m3</text><rect x="138" y="386" width="28" height="18" rx="3" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1"/><text x="152" y="399" font-size="10" font-weight="700" fill="#3a3226" text-anchor="middle">m3</text><rect x="168" y="408" width="28" height="18" rx="3" fill="#f7e0da" stroke="#a3283f" stroke-width="1"/><text x="182" y="421" font-size="10" font-weight="700" fill="#3a3226" text-anchor="middle">m3</text><rect x="138" y="364" width="28" height="18" rx="3" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1"/><text x="152" y="377" font-size="10" font-weight="700" fill="#3a3226" text-anchor="middle">m4</text><rect x="168" y="386" width="28" height="18" rx="3" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1"/><text x="182" y="399" font-size="10" font-weight="700" fill="#3a3226" text-anchor="middle">m4</text><rect x="198" y="408" width="28" height="18" rx="3" fill="#f7e0da" stroke="#a3283f" stroke-width="1"/><text x="212" y="421" font-size="10" font-weight="700" fill="#3a3226" text-anchor="middle">m4</text><text x="182" y="448" font-size="11.5" font-weight="700" fill="#6b5f4d" text-anchor="middle">micro-batches keep every GPU busy</text><rect x="387" y="302" width="70" height="84" rx="8" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.4"/><text x="422" y="320" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="middle">GPU 1</text><rect x="393" y="328" width="58" height="14" rx="2" fill="#ffffff" stroke="#ddd0b4" stroke-width="1" stroke-dasharray="2 2"/><rect x="393" y="328" width="14.5" height="14" rx="2" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1"/><rect x="393" y="345" width="58" height="14" rx="2" fill="#ffffff" stroke="#ddd0b4" stroke-width="1" stroke-dasharray="2 2"/><rect x="393" y="345" width="14.5" height="14" rx="2" fill="#f7e0da" stroke="#a3283f" stroke-width="1"/><rect x="393" y="362" width="58" height="14" rx="2" fill="#ffffff" stroke="#ddd0b4" stroke-width="1" stroke-dasharray="2 2"/><rect x="393" y="362" width="14.5" height="14" rx="2" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1"/><rect x="465" y="302" width="70" height="84" rx="8" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.4"/><text x="500" y="320" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="middle">GPU 2</text><rect x="471" y="328" width="58" height="14" rx="2" fill="#ffffff" stroke="#ddd0b4" stroke-width="1" stroke-dasharray="2 2"/><rect x="485.5" y="328" width="14.5" height="14" rx="2" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1"/><rect x="471" y="345" width="58" height="14" rx="2" fill="#ffffff" stroke="#ddd0b4" stroke-width="1" stroke-dasharray="2 2"/><rect x="485.5" y="345" width="14.5" height="14" rx="2" fill="#f7e0da" stroke="#a3283f" stroke-width="1"/><rect x="471" y="362" width="58" height="14" rx="2" fill="#ffffff" stroke="#ddd0b4" stroke-width="1" stroke-dasharray="2 2"/><rect x="485.5" y="362" width="14.5" height="14" rx="2" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1"/><rect x="543" y="302" width="70" height="84" rx="8" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.4"/><text x="578" y="320" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="middle">GPU 3</text><rect x="549" y="328" width="58" height="14" rx="2" fill="#ffffff" stroke="#ddd0b4" stroke-width="1" stroke-dasharray="2 2"/><rect x="578" y="328" width="14.5" height="14" rx="2" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1"/><rect x="549" y="345" width="58" height="14" rx="2" fill="#ffffff" stroke="#ddd0b4" stroke-width="1" stroke-dasharray="2 2"/><rect x="578" y="345" width="14.5" height="14" rx="2" fill="#f7e0da" stroke="#a3283f" stroke-width="1"/><rect x="549" y="362" width="58" height="14" rx="2" fill="#ffffff" stroke="#ddd0b4" stroke-width="1" stroke-dasharray="2 2"/><rect x="578" y="362" width="14.5" height="14" rx="2" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1"/><rect x="621" y="302" width="70" height="84" rx="8" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.4"/><text x="656" y="320" font-size="11.5" font-weight="700" fill="#3a3226" text-anchor="middle">GPU 4</text><rect x="627" y="328" width="58" height="14" rx="2" fill="#ffffff" stroke="#ddd0b4" stroke-width="1" stroke-dasharray="2 2"/><rect x="670.5" y="328" width="14.5" height="14" rx="2" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1"/><rect x="627" y="345" width="58" height="14" rx="2" fill="#ffffff" stroke="#ddd0b4" stroke-width="1" stroke-dasharray="2 2"/><rect x="670.5" y="345" width="14.5" height="14" rx="2" fill="#f7e0da" stroke="#a3283f" stroke-width="1"/><rect x="627" y="362" width="58" height="14" rx="2" fill="#ffffff" stroke="#ddd0b4" stroke-width="1" stroke-dasharray="2 2"/><rect x="670.5" y="362" width="14.5" height="14" rx="2" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1"/><text x="537" y="408" font-size="12" font-weight="700" fill="#3a3226" text-anchor="middle">each GPU owns ¼ of every state</text><text x="537" y="426" font-size="11.5" font-weight="700" fill="#a3283f" text-anchor="middle">and gathers the rest just in time</text><text x="537" y="446" font-size="11" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">memory per GPU falls roughly as 1 / N</text></svg>

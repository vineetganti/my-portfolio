<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>bytearray, memoryview and physical memory</title><desc>A bytearray object owns a block of memory. A memoryview obtained through the buffer protocol holds a pointer to the same block, so writing through the view changes the bytearray with no copy. Addresses are virtual, and the MMU translates them to physical RAM through page tables.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d36"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a00"/></marker></defs><rect width="720" height="360" fill="#ffffff"/><rect x="20" y="30" width="190" height="66" rx="10" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.5"/><text x="115" y="59.425" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">buf = bytearray(100)</text><text x="115" y="75.545" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle">owns the memory</text><rect x="20" y="164" width="190" height="66" rx="10" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.5"/><text x="115" y="193.425" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">mv = memoryview(buf)</text><text x="115" y="209.545" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle">a view, no copy</text><text x="240" y="26" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="start">heap block (virtual address 0x7f3a…)</text><rect x="240" y="36" width="40" height="56" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.6"/><text x="260" y="70" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">255</text><rect x="280" y="36" width="40" height="56" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.1"/><text x="300" y="70" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="middle">0</text><rect x="320" y="36" width="40" height="56" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.1"/><text x="340" y="70" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="middle">0</text><rect x="360" y="36" width="40" height="56" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.1"/><text x="380" y="70" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="middle">0</text><rect x="400" y="36" width="40" height="56" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.1"/><text x="420" y="70" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="middle">0</text><rect x="440" y="36" width="40" height="56" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.1"/><text x="460" y="70" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="middle">0</text><rect x="480" y="36" width="40" height="56" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.1"/><text x="500" y="70" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="middle">0</text><rect x="520" y="36" width="40" height="56" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.1"/><text x="540" y="70" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="middle">0</text><rect x="560" y="36" width="40" height="56" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.1"/><text x="580" y="70" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="middle">0</text><rect x="600" y="36" width="40" height="56" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.1"/><text x="620" y="70" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="middle">0</text><text x="646" y="70" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="start">… 100 bytes</text><line x1="212" y1="64" x2="238" y2="64" stroke="#4f5d36" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><path d="M212 197 Q232 150 260 98" fill="none" stroke="#8a5a00" stroke-width="1.8" marker-end="url(#ah-8a5a00)" stroke-linejoin="round" stroke-linecap="round"/><text x="300" y="140" font-size="12" font-weight="700" fill="#8a5a00" text-anchor="start">same block: mv[0] = 255 writes into buf</text><text x="300" y="158" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="start">through Py_buffer (pointer, length, itemsize)</text><rect x="20" y="262" width="160" height="50" rx="8" fill="#ffffff" stroke="#4f5d36" stroke-width="1.5"/><text x="100" y="282.625" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">virtual address</text><text x="100" y="298.875" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0x7f3a…</text><line x1="182" y1="287" x2="218" y2="287" stroke="#4f5d36" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="220" y="262" width="170" height="50" rx="8" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.5"/><text x="305" y="283.425" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">MMU + page table</text><text x="305" y="299.545" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle">translates on the fly</text><line x1="392" y1="287" x2="428" y2="287" stroke="#4f5d36" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="430" y="262" width="270" height="50" rx="8" fill="#efefe0" stroke="#7d8257" stroke-width="1.5"/><text x="565" y="283.75" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">physical RAM frame</text><text x="565" y="299.87" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">the same bytes, no matter which view reads them</text><text x="360" y="340" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">Zero-copy: both objects reach the same physical bytes, which is why slicing a memoryview is cheap.</text></svg>

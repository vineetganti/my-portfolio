<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" width="720" height="336" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Who actually runs torch.matmul</title><desc>Your Python code calls the torch or numpy API, which dispatches into a C++ or C core, which calls tuned libraries: BLAS and LAPACK such as MKL and OpenBLAS on the CPU, or cuBLAS and cuDNN on the GPU.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker></defs><rect width="720" height="336" fill="#ffffff"/><rect x="10" y="14" width="124" height="108" rx="12" fill="#f6ecd6" stroke="#6b5f4d" stroke-width="1.5"/><text x="72" y="62" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Python</text><text x="72" y="80" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">layer</text><rect x="10" y="134" width="124" height="190" rx="12" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="72" y="218" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">Native code</text><text x="72" y="236" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">C, C++, Fortran,</text><text x="72" y="254" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">CUDA</text><rect x="150" y="14" width="560" height="44" rx="10" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.5"/><text x="430" y="42" font-size="13.5" font-weight="700" fill="#3a3226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">Your code:  torch.matmul(a, b)</text><rect x="150" y="70" width="560" height="52" rx="10" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="430" y="92" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">torch / numpy Python API</text><text x="430" y="110" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">object creation, memory handles, dispatching the call</text><rect x="150" y="134" width="560" height="52" rx="10" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="430" y="156" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">C++ core: ATen (PyTorch) or C code (NumPy)</text><text x="430" y="174" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">the foreign function interface into compiled code</text><rect x="150" y="204" width="270" height="62" rx="10" fill="#f6e9c8" stroke="#8a5a00" stroke-width="1.4"/><text x="285" y="226" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">CPU: BLAS / LAPACK</text><text x="285" y="244" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">Intel MKL, OpenBLAS, using SIMD / AVX</text><rect x="440" y="204" width="270" height="62" rx="10" fill="#f6e9c8" stroke="#8a5a00" stroke-width="1.4"/><text x="575" y="226" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">GPU: CUDA libraries</text><text x="575" y="244" font-size="12" font-weight="400" fill="#3a3226" text-anchor="middle">cuBLAS, cuDNN, TensorRT, NCCL</text><rect x="150" y="284" width="270" height="40" rx="10" fill="#f3ecdc" stroke="#8d8068" stroke-width="1.3"/><text x="285" y="309" font-size="13.5" font-weight="700" fill="#3a3226" text-anchor="middle">CPU cores</text><rect x="440" y="284" width="270" height="40" rx="10" fill="#f3ecdc" stroke="#8d8068" stroke-width="1.3"/><text x="575" y="309" font-size="13.5" font-weight="700" fill="#3a3226" text-anchor="middle">GPU (CUDA cores, Tensor Cores)</text><line x1="430" y1="59" x2="430" y2="69" stroke="#6b5f4d" stroke-width="2" marker-end="url(#ah-4f5d36)"/><line x1="430" y1="123" x2="430" y2="133" stroke="#6b5f4d" stroke-width="2" marker-end="url(#ah-4f5d36)"/><line x1="330" y1="188" x2="285" y2="202" stroke="#6b5f4d" stroke-width="2" marker-end="url(#ah-4f5d36)"/><line x1="530" y1="188" x2="575" y2="202" stroke="#6b5f4d" stroke-width="2" marker-end="url(#ah-4f5d36)"/><line x1="285" y1="268" x2="285" y2="282" stroke="#6b5f4d" stroke-width="2" marker-end="url(#ah-4f5d36)"/><line x1="575" y1="268" x2="575" y2="282" stroke="#6b5f4d" stroke-width="2" marker-end="url(#ah-4f5d36)"/></svg>

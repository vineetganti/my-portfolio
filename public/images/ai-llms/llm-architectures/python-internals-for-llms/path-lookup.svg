<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>How the python3 command is found</title><desc>The shell reads the PATH variable, splits it into directories, and checks each in order for an executable named python3. The first match wins. The OS then starts it as a new process, and that interpreter runs the script.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d36"/></marker></defs><rect width="720" height="250" fill="#ffffff"/><rect x="20" y="20" width="200" height="44" rx="10" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="120" y="46.2" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$ python3 app.py</text><line x1="222" y1="42" x2="248" y2="42" stroke="#4f5d36" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><text x="256" y="34" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="start">shell reads PATH, splits on ':' and checks each folder in order</text><rect x="20" y="96" width="160" height="54" rx="10" fill="#ffffff" stroke="#7d8257" stroke-width="1.3"/><text x="100" y="120" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/usr/local/sbin</text><text x="100" y="139" font-size="11.5" font-weight="700" fill="#a3283f" text-anchor="middle">no python3</text><line x1="182" y1="123" x2="190" y2="123" stroke="#4f5d36" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><rect x="192" y="96" width="160" height="54" rx="10" fill="#ffffff" stroke="#7d8257" stroke-width="1.3"/><text x="272" y="120" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/home/me/.local/bin</text><text x="272" y="139" font-size="11.5" font-weight="700" fill="#a3283f" text-anchor="middle">no python3</text><line x1="354" y1="123" x2="362" y2="123" stroke="#4f5d36" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><rect x="364" y="96" width="160" height="54" rx="10" fill="#e9efcf" stroke="#4f5d36" stroke-width="2"/><text x="444" y="120" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/usr/bin</text><text x="444" y="139" font-size="11.5" font-weight="700" fill="#4f5d36" text-anchor="middle">python3 found ✓</text><line x1="526" y1="123" x2="534" y2="123" stroke="#4f5d36" stroke-width="1.4" marker-end="url(#ah-4f5d36)"/><rect x="536" y="96" width="160" height="54" rx="10" fill="#ffffff" stroke="#7d8257" stroke-width="1.3" stroke-dasharray="4 3"/><text x="616" y="120" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/bin</text><text x="616" y="139" font-size="11.5" font-weight="400" fill="#7d8257" text-anchor="middle" font-style="italic">never checked</text><text x="360" y="84" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">PATH = /usr/local/sbin:/home/me/.local/bin:/usr/bin:/bin</text><line x1="444" y1="152" x2="444" y2="184" stroke="#4f5d36" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="250" y="186" width="220" height="44" rx="10" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.5"/><text x="360" y="211.75" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">OS starts it as a new process</text><text x="484" y="212" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="start" font-style="italic">then it compiles and runs app.py</text></svg>

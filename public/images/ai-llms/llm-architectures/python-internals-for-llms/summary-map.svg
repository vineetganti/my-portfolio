<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 302" width="720" height="302" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Post 01 at a glance: from a Python call to the GPU</title><desc>A map of post 01 in four columns. What Python is: source compiled to bytecode, CPython written in C, torch and numpy calling C, and the GIL. The OS: a process with a PID and heap, syscalls through libc, permission checks in the kernel, and processes to get around the GIL. The CPU: BLAS and MKL, SIMD, threads inside an operation and the ATen dispatch path. The GPU: blocking copies, asynchronous kernels, the caching allocator and synchronization.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="302" fill="#fffdf8"/><text x="20" y="28" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Post 01 at a glance: from a Python call to the GPU</text><rect x="10" y="44" width="161.5" height="192" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="90.75" y="71" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">What Python is</text><rect x="20" y="88" width="141.5" height="28" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="90.75" y="106.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">source → bytecode</text><rect x="20" y="124" width="141.5" height="28" rx="8" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.1"/><text x="90.75" y="142.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">CPython, written in C</text><rect x="20" y="160" width="141.5" height="28" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="90.75" y="178.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">torch, numpy call C</text><rect x="20" y="196" width="141.5" height="28" rx="8" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.1"/><text x="90.75" y="214.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">GIL: one at a time</text><line x1="173.5" y1="66" x2="187.5" y2="66" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="189.5" y="44" width="161.5" height="192" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="270.25" y="71" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">The OS</text><rect x="199.5" y="88" width="141.5" height="28" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="270.25" y="106.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">a process: PID, heap</text><rect x="199.5" y="124" width="141.5" height="28" rx="8" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.1"/><text x="270.25" y="142.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">syscalls through libc</text><rect x="199.5" y="160" width="141.5" height="28" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="270.25" y="178.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">kernel checks rights</text><rect x="199.5" y="196" width="141.5" height="28" rx="8" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.1"/><text x="270.25" y="214.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">processes beat the GIL</text><line x1="353" y1="66" x2="367" y2="66" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="369" y="44" width="161.5" height="192" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="449.75" y="71" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">The CPU</text><rect x="379" y="88" width="141.5" height="28" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="449.75" y="106.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">BLAS, MKL, OpenBLAS</text><rect x="379" y="124" width="141.5" height="28" rx="8" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.1"/><text x="449.75" y="142.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">SIMD: many at once</text><rect x="379" y="160" width="141.5" height="28" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="449.75" y="178.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">threads within an op</text><rect x="379" y="196" width="141.5" height="28" rx="8" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.1"/><text x="449.75" y="214.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">ATen dispatch path</text><line x1="532.5" y1="66" x2="546.5" y2="66" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="548.5" y="44" width="161.5" height="192" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="629.25" y="71" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">The GPU</text><rect x="558.5" y="88" width="141.5" height="28" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="629.25" y="106.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">copy: blocking default</text><rect x="558.5" y="124" width="141.5" height="28" rx="8" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.1"/><text x="629.25" y="142.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">kernels: asynchronous</text><rect x="558.5" y="160" width="141.5" height="28" rx="8" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.1"/><text x="629.25" y="178.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">caching allocator</text><rect x="558.5" y="196" width="141.5" height="28" rx="8" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.1"/><text x="629.25" y="214.5" font-size="11" font-weight="400" fill="#2f281e" text-anchor="middle">synchronize to time</text><rect x="10" y="252" width="700" height="36" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.3"/><text x="360" y="275" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Python decides what to run; compiled libraries and the GPU do the work.</text></svg>

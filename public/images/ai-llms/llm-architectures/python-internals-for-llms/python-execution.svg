<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" width="720" height="292" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>How Python runs a script</title><desc>Source text goes through the lexer into tokens, the parser into an abstract syntax tree, the compiler into bytecode, and the Python virtual machine executes the bytecode.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker></defs><rect width="720" height="292" fill="#ffffff"/><rect x="10" y="22" width="120" height="192" rx="12" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.5"/><text x="70.0" y="46" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Source</text><text x="70.0" y="65" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="middle">app.py as text</text><rect x="18" y="112" width="104" height="94" rx="6" fill="#ffffff" stroke="#ddd0b4" stroke-width="1"/><text x="24" y="130" font-size="10.5" font-weight="400" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">total = price</text><text x="24" y="145" font-size="10.5" font-weight="400" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">        * qty</text><rect x="155" y="22" width="120" height="192" rx="12" fill="#f6e9c8" stroke="#6b5f4d" stroke-width="1.5"/><text x="215.0" y="46" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Lexer</text><text x="215.0" y="65" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="middle">groups characters</text><text x="215.0" y="79" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="middle">into tokens</text><rect x="163" y="112" width="104" height="94" rx="6" fill="#ffffff" stroke="#ddd0b4" stroke-width="1"/><text x="169" y="130" font-size="10.5" font-weight="400" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">NAME  total</text><text x="169" y="145" font-size="10.5" font-weight="400" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">OP    =</text><text x="169" y="160" font-size="10.5" font-weight="400" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">NAME  price</text><text x="169" y="175" font-size="10.5" font-weight="400" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">OP    *</text><text x="169" y="190" font-size="10.5" font-weight="400" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">NAME  qty</text><rect x="300" y="22" width="120" height="192" rx="12" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="360.0" y="46" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Parser</text><text x="360.0" y="65" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="middle">checks the grammar,</text><text x="360.0" y="79" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="middle">builds the AST</text><rect x="308" y="112" width="104" height="94" rx="6" fill="#ffffff" stroke="#ddd0b4" stroke-width="1"/><text x="314" y="130" font-size="10.5" font-weight="400" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">Assign</text><text x="314" y="145" font-size="10.5" font-weight="400" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">  target: total</text><text x="314" y="160" font-size="10.5" font-weight="400" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">  value: Mult</text><text x="314" y="175" font-size="10.5" font-weight="400" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">    price</text><text x="314" y="190" font-size="10.5" font-weight="400" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">    qty</text><rect x="445" y="22" width="120" height="192" rx="12" fill="#f6ecd6" stroke="#6b5f4d" stroke-width="1.5"/><text x="505.0" y="46" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">Compiler</text><text x="505.0" y="65" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="middle">turns the AST</text><text x="505.0" y="79" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="middle">into bytecode</text><rect x="453" y="112" width="104" height="94" rx="6" fill="#ffffff" stroke="#ddd0b4" stroke-width="1"/><text x="459" y="130" font-size="10.5" font-weight="400" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">LOAD_NAME price</text><text x="459" y="145" font-size="10.5" font-weight="400" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">LOAD_NAME qty</text><text x="459" y="160" font-size="10.5" font-weight="400" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">BINARY_OP *</text><text x="459" y="175" font-size="10.5" font-weight="400" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">STORE_NAME total</text><rect x="590" y="22" width="120" height="192" rx="12" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.5"/><text x="650.0" y="46" font-size="14" font-weight="700" fill="#3a3226" text-anchor="middle">PVM</text><text x="650.0" y="65" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="middle">runs the bytecode,</text><text x="650.0" y="79" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="middle">one instruction</text><text x="650.0" y="93" font-size="11.5" font-weight="400" fill="#3a3226" text-anchor="middle">at a time</text><rect x="598" y="112" width="104" height="94" rx="6" fill="#ffffff" stroke="#ddd0b4" stroke-width="1"/><text x="604" y="130" font-size="10.5" font-weight="400" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">push price</text><text x="604" y="145" font-size="10.5" font-weight="400" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">push qty</text><text x="604" y="160" font-size="10.5" font-weight="400" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">multiply</text><text x="604" y="175" font-size="10.5" font-weight="400" fill="#3a3226" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">bind total</text><line x1="132" y1="118" x2="153" y2="118" stroke="#6b5f4d" stroke-width="2" marker-end="url(#ah-4f5d36)"/><line x1="277" y1="118" x2="298" y2="118" stroke="#6b5f4d" stroke-width="2" marker-end="url(#ah-4f5d36)"/><line x1="422" y1="118" x2="443" y2="118" stroke="#6b5f4d" stroke-width="2" marker-end="url(#ah-4f5d36)"/><line x1="567" y1="118" x2="588" y2="118" stroke="#6b5f4d" stroke-width="2" marker-end="url(#ah-4f5d36)"/><text x="505" y="208" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">cached as .pyc</text><text x="360" y="246" font-size="13" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">A syntax error is caught by the lexer or parser, before any line of the script runs.</text><text x="360" y="268" font-size="13" font-weight="400" fill="#6b5f4d" text-anchor="middle" font-style="italic">eval(string) runs this same pipeline at runtime, on a string.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 225" width="720" height="225" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>summary map</title><desc>A map of the diagrams post. Inline: SVGs are read at build time and put into the page. Palette: fixed hex codes mapped to theme tokens. Motion: a scroll reveal and a looping message flow driven by one clock. Live charts: React state, sliders and a sentence that restates the numbers.</desc><defs></defs><rect width="720" height="225" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Diagrams that move</text><rect x="20" y="50" width="162" height="105" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="101" y="86.08" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Inline</text><text x="101" y="107.72" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">read at build time</text><text x="101" y="121.58" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">ids prefixed</text><text x="101" y="135.44" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">role img + alt</text><rect x="192" y="50" width="162" height="105" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="273" y="86.08" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Palette</text><text x="273" y="107.72" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">fixed hex codes</text><text x="273" y="121.58" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">attribute rules</text><text x="273" y="135.44" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">light + dark tokens</text><rect x="364" y="50" width="162" height="105" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="445" y="86.08" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Motion</text><text x="445" y="107.72" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">reveal on scroll</text><text x="445" y="121.58" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">flow by text match</text><text x="445" y="135.44" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">one clock</text><rect x="536" y="50" width="162" height="105" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="617" y="86.08" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Live charts</text><text x="617" y="107.72" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">ChartFrame</text><text x="617" y="121.58" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">sliders</text><text x="617" y="135.44" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">readout sentence</text><text x="20" y="185" font-size="12" font-weight="700" fill="#5e5241" text-anchor="start">No extra library: plain SVG, CSS and two small client components.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>flow matching</title><desc>How the animation finds its path without any ids in the SVG. A step names two boxes by their text. A box is the smallest rectangle around that text. An arrow is a line or path with an arrowhead marker. The arrow that joins the two boxes is the one whose two ends touch them, within 8 pixels. The diagram file is never edited; only inline styles and one marker group are added, and removed again on unmount.</desc><defs><marker id="ah-9a5400" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a5400"/></marker></defs><rect width="720" height="260" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Matching a step to the drawing, by text and geometry</text><rect x="40" y="70" width="150" height="60" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="115" y="97.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">client</text><text x="115" y="119.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">a box: text in a rect</text><rect x="320" y="70" width="150" height="60" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="395" y="97.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">server</text><text x="395" y="119.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">the other box</text><line x1="190" y1="100" x2="320" y2="100" stroke="#9a5400" stroke-width="1.6" marker-end="url(#ah-9a5400)"/><text x="255" y="94" font-size="11" font-weight="700" fill="#9a5400" text-anchor="middle">HTTP</text><text x="500" y="70" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">{ "from": "client", "to":</text><text x="500" y="84.175" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">"server", "label": "HTTP",</text><text x="500" y="98.35" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">"type": "request" }</text><text x="40" y="170" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">1. Find each box: the smallest rect around the named text.</text><text x="40" y="190" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">2. Find the arrow: a line with a marker whose two ends touch the two boxes, within 8 px.</text><text x="40" y="210" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">3. Find the label: the same text outside any box, nearest the middle of the arrow.</text></svg>

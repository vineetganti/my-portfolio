<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>inline svg</title><desc>What happens to a Markdown image. MdxContent's image override checks the path. A PNG is served as a normal img tag. A local SVG is read from disk at build time, its ids are prefixed with the file name so two diagrams cannot clash, and it is inlined as a span with role img and the alt text as its label. If a flow.json file sits beside it, the SVG goes to FlowDiagram instead and gets a message animation.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-4b7d33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b7d33"/></marker><marker id="ah-9a5400" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a5400"/></marker></defs><rect width="720" height="300" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">A Markdown image becomes one of three things</text><rect x="20" y="118" width="130" height="60" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="85" y="152.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">![alt](x.svg)</text><rect x="200" y="118" width="140" height="60" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="270" y="145.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Image override</text><text x="270" y="167.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">in MdxContent</text><rect x="410" y="40" width="290" height="56" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="555" y="65.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">PNG or remote: &lt;img&gt;</text><text x="555" y="87.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">served as it is</text><rect x="410" y="118" width="290" height="60" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="555" y="145.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">SVG: inlined span.diagram</text><text x="555" y="167.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">ids prefixed, alt as aria-label</text><rect x="410" y="200" width="290" height="56" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="555" y="225.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">SVG + flow.json: FlowDiagram</text><text x="555" y="247.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">looping message animation</text><line x1="150" y1="148" x2="200" y2="148" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="340" y1="132" x2="408" y2="68" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="340" y1="148" x2="408" y2="148" stroke="#4b7d33" stroke-width="1.6" marker-end="url(#ah-4b7d33)"/><line x1="340" y1="164" x2="408" y2="228" stroke="#9a5400" stroke-width="1.6" marker-end="url(#ah-9a5400)"/><text x="20" y="196" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">Inlining is what lets the</text><text x="20" y="210.175" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">page's CSS recolour the drawing</text><text x="20" y="224.35" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">for dark mode, which an &lt;img&gt;</text><text x="20" y="238.525" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">can't do.</text></svg>

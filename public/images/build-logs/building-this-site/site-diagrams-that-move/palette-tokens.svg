<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>palette tokens</title><desc>How one diagram works in both themes. The SVG is drawn only with palette hex codes, for example an amber tint fill. A CSS attribute rule in globals.css maps that hex to a token, var(--dg-amber-t). The light theme defines the token as the same pale amber; the dark theme redefines it as a deep brown, so the same file reads well on both backgrounds.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="260" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Hex in the file, token on the page</text><rect x="20" y="90" width="150" height="60" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="95" y="117.09" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">fill="#fde3ad"</text><text x="95" y="137.73" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">in the SVG</text><rect x="220" y="90" width="210" height="60" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="325" y="117.25" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">.diagram [fill=…] →</text><text x="325" y="130.45" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">var(--dg-amber-t)</text><rect x="500" y="50" width="200" height="50" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="600" y="79.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">light: #fde3ad</text><rect x="500" y="140" width="200" height="50" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="600" y="169.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">dark: #3e3116</text><line x1="170" y1="120" x2="220" y2="120" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="430" y1="110" x2="498" y2="75" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="430" y1="130" x2="498" y2="165" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="20" y="214" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">A hex outside the palette has no rule, so it stays the same colour in dark mode and usually looks wrong. That is</text><text x="20" y="229.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">why every drawing uses only the palette.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>flow step</title><desc>The timeline of one animation step, 1,900 milliseconds long. For the first 220 ms the arrow and its label fade in. From 220 to 1,320 ms a marker travels along the arrow with an ease-in-out curve. When it arrives, the destination box pulses for 320 ms, and from 1,580 ms the arrow and label fade back. After the last step the loop pauses for 800 ms.</desc><defs></defs><rect width="720" height="230" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">One step of a message flow, as a function of time</text><line x1="40" y1="140" x2="680" y2="140" stroke="#5e5241" stroke-width="1.5"/><rect x="40" y="90" width="72.10526315789474" height="40" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><rect x="114.10526315789474" y="90" width="368.5263157894737" height="40" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="298.36842105263156" y="114.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">marker travels</text><rect x="484.63157894736844" y="90" width="105.78947368421052" height="40" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="537.5263157894738" y="114.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">pulse</text><text x="77.05263157894737" y="84" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">fade in</text><text x="538.5263157894736" y="84" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">pulse</text><rect x="572.2105263157895" y="60" width="107.78947368421052" height="14" rx="4" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="626.1052631578947" y="54" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">edge and label fade</text><line x1="40" y1="136" x2="40" y2="146" stroke="#5e5241" stroke-width="1.5"/><text x="40" y="162" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">0 ms</text><line x1="114.10526315789474" y1="136" x2="114.10526315789474" y2="146" stroke="#5e5241" stroke-width="1.5"/><text x="114.10526315789474" y="162" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">220 ms</text><line x1="484.63157894736844" y1="136" x2="484.63157894736844" y2="146" stroke="#5e5241" stroke-width="1.5"/><text x="484.63157894736844" y="162" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">1320 ms</text><line x1="572.2105263157895" y1="136" x2="572.2105263157895" y2="146" stroke="#5e5241" stroke-width="1.5"/><text x="572.2105263157895" y="162" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">1580 ms</text><line x1="592.421052631579" y1="136" x2="592.421052631579" y2="146" stroke="#5e5241" stroke-width="1.5"/><text x="592.421052631579" y="162" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">1640 ms</text><line x1="680" y1="136" x2="680" y2="146" stroke="#5e5241" stroke-width="1.5"/><text x="680" y="162" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">1900 ms</text><text x="40" y="192" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Everything drawn is a pure function of one number, elapsed time. Pausing stops adding to it, so resuming</text><text x="40" y="207.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">continues from the exact frame.</text></svg>

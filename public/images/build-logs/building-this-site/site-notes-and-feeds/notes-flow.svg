<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>notes flow</title><desc>Where a note goes. A Markdown file in content/notes with a date and plain text is read by notes.ts, which drops notes without text or with a bad date and sorts the rest newest first. Three places use the same list: the /notes page, a scrolling box on the home page, and the RSS feed at /notes/feed.xml.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-4b7d33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b7d33"/></marker></defs><rect width="720" height="260" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">One folder, three readers</text><rect x="20" y="100" width="140" height="60" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="90" y="127.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">content/notes</text><text x="90" y="149.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">date + plain text</text><rect x="210" y="100" width="140" height="60" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="280" y="127.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">notes.ts</text><text x="280" y="149.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">filter, sort newest</text><rect x="420" y="40" width="150" height="50" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="495" y="62.45" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">/notes</text><text x="495" y="84.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">the full feed</text><rect x="420" y="105" width="150" height="50" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="495" y="127.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">home page</text><text x="495" y="149.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">scrolling box</text><rect x="420" y="170" width="150" height="50" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="495" y="192.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">/notes/feed.xml</text><text x="495" y="214.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">RSS 2.0</text><line x1="160" y1="130" x2="210" y2="130" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="350" y1="118" x2="418" y2="65" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="350" y1="130" x2="418" y2="130" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="350" y1="142" x2="418" y2="195" stroke="#4b7d33" stroke-width="1.6" marker-end="url(#ah-4b7d33)"/><text x="590" y="70" font-size="11" font-weight="400" fill="#5e5241" text-anchor="start">NoteList renders</text><text x="590" y="84.85" font-size="11" font-weight="400" fill="#5e5241" text-anchor="start">both pages, so they</text><text x="590" y="99.7" font-size="11" font-weight="400" fill="#5e5241" text-anchor="start">cannot drift apart.</text></svg>

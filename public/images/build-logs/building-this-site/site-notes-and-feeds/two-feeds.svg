<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>two feeds</title><desc>The site's two RSS feeds come from different places. The notes feed is built from files in the repository at build time. The Second brain feed is built at request time from data that has already passed signature verification, never by copying the uploaded XML file.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="250" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Two RSS routes, two levels of trust</text><text x="20" y="60" font-size="12.5" font-weight="700" fill="#9a5400" text-anchor="start">Notes: from the repository</text><rect x="20" y="72" width="150" height="50" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="95" y="94.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">markdown files</text><text x="95" y="116.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">in git, reviewed</text><rect x="220" y="72" width="150" height="50" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="295" y="94.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">route handler</text><text x="295" y="116.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">escapes, builds XML</text><line x1="170" y1="97" x2="220" y2="97" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="20" y="160" font-size="12.5" font-weight="700" fill="#4b7d33" text-anchor="start">Second brain: from verified data</text><rect x="20" y="172" width="150" height="50" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="95" y="194.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">signed JSON</text><text x="95" y="216.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">from Blob</text><rect x="220" y="172" width="150" height="50" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="295" y="194.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">verify + validate</text><text x="295" y="216.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">secondBrainCore</text><rect x="420" y="172" width="150" height="50" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="495" y="194.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">feed.xml route</text><text x="495" y="216.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">builds XML from it</text><line x1="170" y1="197" x2="220" y2="197" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="370" y1="197" x2="420" y2="197" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="420" y="82" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">The uploaded feed.xml is signed too, but the</text><text x="420" y="97.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">site never serves it: it rebuilds the XML from</text><text x="420" y="113.05" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">the checked JSON.</text></svg>

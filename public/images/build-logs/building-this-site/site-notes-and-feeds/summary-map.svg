<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 191" width="720" height="191" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>summary map</title><desc>A map of the notes post. Writing: one Markdown file with a date. Reading: notes.ts filters and sorts. Showing: /notes, the home page box and NoteList. Feeding: RSS 2.0 built by a route handler.</desc><defs></defs><rect width="720" height="191" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Notes and feeds</text><rect x="20" y="50" width="162" height="105" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="101" y="86.08" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Write</text><text x="101" y="107.72" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">one .md file</text><text x="101" y="121.58" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">date + plain text</text><text x="101" y="135.44" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">no title or tags</text><rect x="192" y="50" width="162" height="105" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="273" y="86.08" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Read</text><text x="273" y="107.72" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">notes.ts</text><text x="273" y="121.58" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">drop bad dates</text><text x="273" y="135.44" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">newest first</text><rect x="364" y="50" width="162" height="105" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="445" y="86.08" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Show</text><text x="445" y="107.72" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">/notes</text><text x="445" y="121.58" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">home page box</text><text x="445" y="135.44" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">one NoteList</text><rect x="536" y="50" width="162" height="105" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="617" y="86.08" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Feed</text><text x="617" y="107.72" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">route handler</text><text x="617" y="121.58" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">RSS 2.0</text><text x="617" y="135.44" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">escaped XML</text></svg>

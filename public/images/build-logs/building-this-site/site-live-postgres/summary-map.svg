<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 191" width="720" height="191" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>summary map</title><desc>A map of the live Postgres post. Load: nothing until Run, then one instance per page. Isolation: a schema per box and statements run one at a time. Size: 5.74 MB after gzipping the data file. Tests: every control clicked and every box run, on desktop and phone, in production.</desc><defs></defs><rect width="720" height="191" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Real PostgreSQL in the browser</text><rect x="20" y="50" width="162" height="105" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="101" y="86.08" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Load</text><text x="101" y="107.72" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">on first Run</text><text x="101" y="121.58" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">one per page</text><text x="101" y="135.44" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">6 extensions</text><rect x="192" y="50" width="162" height="105" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="273" y="86.08" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Isolation</text><text x="273" y="107.72" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">schema per box</text><text x="273" y="121.58" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">statement by statement</text><text x="273" y="135.44" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Reset rebuilds</text><rect x="364" y="50" width="162" height="105" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="445" y="86.08" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Size</text><text x="445" y="107.72" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">9.86 → 5.74 MB</text><text x="445" y="121.58" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">gzip at build</text><text x="445" y="135.44" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">unpack in browser</text><rect x="536" y="50" width="162" height="105" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="617" y="86.08" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Tests</text><text x="617" y="107.72" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">220 controls</text><text x="617" y="121.58" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">106 box steps</text><text x="617" y="135.44" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">desktop + phone</text></svg>

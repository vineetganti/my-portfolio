<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>stale cache</title><desc>A bug found in the final review. Before: dbLab.ts kept each recording file in a module-level cache, so a dev server started before a re-record kept serving the old recording, and the roles box looked broken. After: the cache is used only in production builds, where the files cannot change, and the dev server reads the file on every request.</desc><defs><marker id="ah-b0273f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b0273f"/></marker><marker id="ah-4b7d33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b7d33"/></marker></defs><rect width="720" height="240" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Before and after: a cache that outlived the file</text><text x="20" y="62" font-size="12.5" font-weight="700" fill="#b0273f" text-anchor="start">Before</text><rect x="20" y="72" width="150" height="42" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="95" y="97.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">dev server starts</text><rect x="192" y="72" width="150" height="42" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="267" y="97.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">file read, cached</text><line x1="170" y1="93" x2="190" y2="93" stroke="#b0273f" stroke-width="1.6" marker-end="url(#ah-b0273f)"/><rect x="364" y="72" width="150" height="42" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="439" y="97.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">re-record writes file</text><line x1="342" y1="93" x2="362" y2="93" stroke="#b0273f" stroke-width="1.6" marker-end="url(#ah-b0273f)"/><rect x="536" y="72" width="150" height="42" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="611" y="97.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">old data served</text><line x1="514" y1="93" x2="534" y2="93" stroke="#b0273f" stroke-width="1.6" marker-end="url(#ah-b0273f)"/><text x="20" y="150" font-size="12.5" font-weight="700" fill="#4b7d33" text-anchor="start">After</text><rect x="20" y="160" width="150" height="42" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="95" y="185.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">NODE_ENV check</text><rect x="192" y="160" width="150" height="42" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="267" y="185.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">dev: read each time</text><line x1="170" y1="181" x2="190" y2="181" stroke="#4b7d33" stroke-width="1.6" marker-end="url(#ah-4b7d33)"/><rect x="364" y="160" width="150" height="42" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="439" y="185.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">production: cache</text><line x1="342" y1="181" x2="362" y2="181" stroke="#4b7d33" stroke-width="1.6" marker-end="url(#ah-4b7d33)"/><rect x="536" y="160" width="150" height="42" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="611" y="185.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">fresh in dev</text><line x1="514" y1="181" x2="534" y2="181" stroke="#4b7d33" stroke-width="1.6" marker-end="url(#ah-4b7d33)"/></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>download size</title><desc>The download before and after the fix, measured on a production server. Before: 9.86 MB, of which pglite.data was 6.24 MB because hosts do not compress a .data file, plus 3.29 MB of gzipped WebAssembly and 0.33 MB of the rest. After gzipping the data file at build time and unpacking it in the browser: 5.74 MB, with the data file at 2.13 MB.</desc><defs></defs><rect width="720" height="250" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">What a reader downloads on the first Run</text><text x="20" y="84" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start">Before</text><rect x="100" y="60" width="322.48" height="36" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="261.24" y="81.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">pglite.data 6.24</text><rect x="424.48" y="60" width="169.08" height="36" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="509.02000000000004" y="81.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">wasm 3.29</text><rect x="595.5600000000001" y="60" width="15.16" height="36" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="20" y="154" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start">After</text><rect x="100" y="130" width="108.75999999999999" height="36" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="154.38" y="145.25" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">data.gzipped</text><text x="154.38" y="158.45" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">2.13</text><rect x="210.76" y="130" width="169.08" height="36" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="295.3" y="151.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">wasm 3.29</text><rect x="381.84000000000003" y="130" width="15.16" height="36" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="620.72" y="84" font-size="12" font-weight="700" fill="#b0273f" text-anchor="start">9.86 MB</text><text x="407" y="154" font-size="12" font-weight="700" fill="#4b7d33" text-anchor="start">5.74 MB</text><text x="20" y="206" font-size="11" font-weight="400" fill="#5e5241" text-anchor="start">Measured with Edge's network events on next start. Vercel compresses .wasm but not application/octet-stream, so the</text><text x="20" y="220.85" font-size="11" font-weight="400" fill="#5e5241" text-anchor="start">fix is to ship the data file already gzipped.</text></svg>

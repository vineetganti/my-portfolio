<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>load on click</title><desc>What happens when a reader presses Run in a live box for the first time on a page. Three downloads start together: PGlite's JavaScript entry, the six extension modules, and the gzipped file system image, which the browser unpacks with DecompressionStream. PGlite then starts PostgreSQL in WebAssembly, the box creates its own schema and runs its setup, and then the reader's SQL runs one statement at a time.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-4b7d33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b7d33"/></marker></defs><rect width="720" height="300" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Nothing loads until the first press of Run</text><rect x="20" y="118" width="110" height="60" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="75" y="145.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Run</text><text x="75" y="167.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">first press</text><rect x="180" y="44" width="200" height="50" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="280" y="73.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/pglite/index.js</text><rect x="180" y="123" width="200" height="50" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="280" y="145.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">6 extension modules</text><text x="280" y="167.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">pageinspect, bloom, …</text><rect x="180" y="202" width="200" height="50" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="280" y="224.09" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">pglite.data.gzipped</text><text x="280" y="244.73" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">unpacked in the browser</text><rect x="430" y="118" width="130" height="60" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="495" y="145.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">PGlite.create</text><text x="495" y="167.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Postgres in WASM</text><rect x="600" y="118" width="100" height="60" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="650" y="145.1" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">lab_&lt;id&gt;</text><text x="650" y="165.73" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">schema + setup</text><line x1="130" y1="132" x2="178" y2="69" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="130" y1="148" x2="178" y2="148" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="130" y1="164" x2="178" y2="227" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="380" y1="69" x2="428" y2="132" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="380" y1="148" x2="428" y2="148" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="380" y1="227" x2="428" y2="164" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="560" y1="148" x2="600" y2="148" stroke="#4b7d33" stroke-width="1.6" marker-end="url(#ah-4b7d33)"/><text x="430" y="214" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">Later boxes on the page reuse the same instance:</text><text x="430" y="228.175" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">one download per page load.</text></svg>

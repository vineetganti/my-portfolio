<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>schema per box</title><desc>Several live boxes on one page share one PGlite database. Each box creates its own schema named lab_ plus its id and sets the search path to it, so two boxes can each have a table t without clashing. Queries should look a table up with 't'::regclass, which follows the search path, rather than relname = 't', which can match another box's table.</desc><defs></defs><rect width="720" height="260" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">One database per page, one schema per box</text><rect x="20" y="50" width="680" height="150" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="36" y="74" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">PGlite: one PostgreSQL instance</text><rect x="40" y="90" width="190" height="90" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="135" y="124.99" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">lab_acid_transfer</text><text x="135" y="145.13" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">accounts</text><text x="135" y="158.98" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">search_path → here</text><rect x="260" y="90" width="190" height="90" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="355" y="124.99" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">lab_acid_rule_break</text><text x="355" y="145.13" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">accounts</text><text x="355" y="158.98" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">its own copy</text><rect x="480" y="90" width="200" height="90" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="580" y="124.99" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">public</text><text x="580" y="145.13" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">extensions</text><text x="580" y="158.98" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">shared</text><text x="20" y="222" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Use 't'::regclass, which follows the search path. relname = 't' in pg_class matches every box's t on the page.</text></svg>

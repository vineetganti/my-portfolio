<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>speech pipeline</title><desc>The browser-voice player in three steps. Prepare: collectChunks reads the rendered article, keeps prose and image descriptions, replaces code, tables and recall questions with a short spoken note, and joins sentences into chunks of up to 180 characters, although a single longer sentence stays whole. Speak: each chunk becomes an utterance, and its end event starts the next one only if no newer speak call has happened. Along the way the current block is highlighted and preferences are saved.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-4b7d33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b7d33"/></marker></defs><rect width="720" height="330" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Prepare once, then speak one chunk at a time</text><text x="20" y="60" font-size="12.5" font-weight="700" fill="#9a5400" text-anchor="start">1. Prepare</text><rect x="20" y="70" width="150" height="56" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="95" y="95.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">#post-content</text><text x="95" y="117.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">the rendered page</text><rect x="210" y="70" width="170" height="56" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="295" y="95.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">collectChunks()</text><text x="295" y="117.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">prose + alt text, skip notes</text><rect x="420" y="70" width="140" height="56" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="490" y="95.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">chunks</text><text x="490" y="117.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">text + element</text><line x1="170" y1="98" x2="210" y2="98" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="380" y1="98" x2="420" y2="98" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="580" y="82" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">Sentences are joined</text><text x="580" y="96.175" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">up to 180 characters;</text><text x="580" y="110.35" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">one longer sentence</text><text x="580" y="124.525" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">stays whole.</text><text x="20" y="170" font-size="12.5" font-weight="700" fill="#4b7d33" text-anchor="start">2. Speak</text><rect x="20" y="180" width="150" height="56" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="95" y="205.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">speak(i)</text><text x="95" y="227.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">gen = ++generation</text><rect x="250" y="180" width="190" height="56" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="345" y="205.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">utterance</text><text x="345" y="227.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">text, voice, rate</text><rect x="520" y="180" width="140" height="56" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="590" y="205.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">onend</text><text x="590" y="227.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">is gen still current?</text><line x1="170" y1="208" x2="250" y2="208" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="440" y1="208" x2="520" y2="208" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><path d="M590 236 L590 262 L95 262 L95 238" fill="none" stroke="#4b7d33" stroke-width="1.6" marker-end="url(#ah-4b7d33)"/><text x="342" y="256" font-size="11" font-weight="700" fill="#4b7d33" text-anchor="middle">yes: speak(i + 1)</text><text x="20" y="290" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Pause, skip, a new speed or a new voice all cancel and bump the generation, so an end event from the old</text><text x="20" y="305.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">utterance does nothing.</text></svg>

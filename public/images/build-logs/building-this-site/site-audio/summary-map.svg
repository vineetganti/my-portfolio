<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 244" width="720" height="244" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>summary map</title><desc>A map of the audio post. Browser voice: the Web Speech API reads the rendered prose and diagram descriptions and skips code and tables with a note. Robustness: a generation counter, phone fixes and a watchdog. Podcast: NotebookLM recordings, re-encoded to mono 64 kbps and stored in Vercel Blob. The switch: content/audio.json decides which player a post shows.</desc><defs></defs><rect width="720" height="244" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Two players, one button per post</text><rect x="20" y="50" width="162" height="124" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="101" y="88.66" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Browser voice</text><text x="101" y="110.29" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Web Speech API</text><text x="101" y="124.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">reads the rendered page</text><text x="101" y="138.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">alt text for diagrams</text><text x="101" y="151.87" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">skip notes for code</text><rect x="192" y="50" width="162" height="124" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="273" y="88.66" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Robustness</text><text x="273" y="110.29" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">generation counter</text><text x="273" y="124.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">four phone fixes</text><text x="273" y="138.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">a watchdog</text><text x="273" y="151.87" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">messages, not silence</text><rect x="364" y="50" width="162" height="124" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="445" y="88.66" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Podcast</text><text x="445" y="110.29" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">NotebookLM overview</text><text x="445" y="124.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">mono AAC, 64 kbps</text><text x="445" y="138.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Vercel Blob</text><text x="445" y="151.87" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">preload none</text><rect x="536" y="50" width="162" height="124" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="617" y="88.66" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">The switch</text><text x="617" y="110.29" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">content/audio.json</text><text x="617" y="124.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">audioSrc in parsePost</text><text x="617" y="138.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">one player per post</text><text x="617" y="151.87" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">no frontmatter edit</text><text x="20" y="204" font-size="12" font-weight="700" fill="#5e5241" text-anchor="start">Free speech for every post, and a recorded version where it is worth the storage.</text></svg>

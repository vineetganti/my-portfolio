<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>which player</title><desc>Where a post's audio comes from. A recording saved as the post's slug in public/audio is uploaded by upload-audio.mjs to Vercel Blob, and its slug and length are listed in audio.json and audio-durations.json. At build time parsePost sets audioSrc. Every post page shows the browser-voice player; a post with an audioSrc also gets a link to its episode. The /podcasts pages list every episode and hold the one podcast player.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="330" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Every post has the browser voice; the podcasts have their own pages</text><rect x="20" y="56" width="140" height="54" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="90" y="80.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">public/audio</text><text x="90" y="102.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">git-ignored</text><rect x="200" y="56" width="150" height="54" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="275" y="80.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">upload-audio.mjs</text><text x="275" y="102.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">files + lengths</text><rect x="390" y="56" width="140" height="54" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="460" y="80.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Vercel Blob</text><text x="460" y="102.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">the files</text><rect x="570" y="56" width="130" height="54" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="635" y="80.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">audio.json</text><text x="635" y="102.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">+ audio-durations</text><rect x="570" y="140" width="130" height="54" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="635" y="164.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">parsePost</text><text x="635" y="186.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">sets audioSrc</text><rect x="390" y="230" width="140" height="54" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="460" y="254.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">post page</text><text x="460" y="276.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">AudioPlayer, always</text><rect x="570" y="230" width="130" height="54" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="635" y="254.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">/podcasts</text><text x="635" y="276.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">list + episodes</text><line x1="160" y1="83" x2="200" y2="83" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="350" y1="83" x2="390" y2="83" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="530" y1="83" x2="570" y2="83" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="635" y1="110" x2="635" y2="140" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="635" y1="194" x2="635" y2="230" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="570" y1="180" x2="462" y2="228" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="530" y1="257" x2="570" y2="257" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="550" y="251" font-size="11" font-weight="700" fill="#5e5241" text-anchor="middle">link</text><text x="20" y="140" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Nothing in a post's frontmatter changes. A recording is</text><text x="20" y="155.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">two commands and a commit of the two lists.</text><text x="20" y="230" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">A post without a recording shows only the browser voice</text><text x="20" y="245.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">and no link.</text></svg>

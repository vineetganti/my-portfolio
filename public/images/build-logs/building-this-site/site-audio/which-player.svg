<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>which player</title><desc>How a post gets its audio. A recording saved as the post's slug in public/audio is uploaded by upload-audio.mjs to Vercel Blob and listed in content/audio.json. At build time parsePost looks the slug up and sets audioSrc. The post page then shows the podcast player if there is an audioSrc, and the browser-voice player if not.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="300" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">One list decides which player a post gets</text><rect x="20" y="56" width="140" height="54" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="90" y="80.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">public/audio</text><text x="90" y="102.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">git-ignored</text><rect x="200" y="56" width="150" height="54" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="275" y="80.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">upload-audio.mjs</text><text x="275" y="102.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">needs the Blob token</text><rect x="390" y="56" width="140" height="54" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="460" y="80.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Vercel Blob</text><text x="460" y="102.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">the files</text><rect x="390" y="140" width="140" height="54" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="460" y="164.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">audio.json</text><text x="460" y="186.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">slug → file, in git</text><rect x="200" y="140" width="150" height="54" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="275" y="164.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">parsePost</text><text x="275" y="186.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">sets audioSrc</text><rect x="20" y="140" width="140" height="54" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="90" y="164.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">post page</text><text x="90" y="186.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">picks a player</text><line x1="160" y1="83" x2="200" y2="83" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="350" y1="83" x2="390" y2="83" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="460" y1="110" x2="460" y2="138" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="390" y1="167" x2="350" y2="167" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="200" y1="167" x2="160" y2="167" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="570" y="56" width="130" height="54" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="635" y="80.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">RecordedAudio</text><text x="635" y="102.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">if audioSrc</text><rect x="570" y="140" width="130" height="54" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="635" y="164.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">AudioPlayer</text><text x="635" y="186.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">otherwise</text><text x="20" y="230" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Nothing in a post's frontmatter changes. A recording is two commands and a commit of audio.json; a post without</text><text x="20" y="245.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">one keeps the browser voice.</text></svg>

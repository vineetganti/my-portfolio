<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>hidden route</title><desc>Before and after for leaving a post while it is being read aloud. Before: you click a link, Next hides the page with display none instead of removing it, and the player's cleanup cancels the speech but leaves its own state saying playing, so coming back shows Stop listening and a Pause button while nothing is spoken. After: the same cleanup also resets the player's state, so coming back shows Listen to this post.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="300" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Leaving a post while it is being read</text><text x="20" y="62" font-size="12.5" font-weight="700" fill="#b0273f" text-anchor="start">Before</text><text x="380" y="62" font-size="12.5" font-weight="700" fill="#4b7d33" text-anchor="start">After</text><rect x="20" y="72" width="320" height="44" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="180" y="98.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">You click a link to another page</text><line x1="180" y1="116" x2="180" y2="138" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="20" y="138" width="320" height="48" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="180" y="159.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Next hides the post</text><text x="180" y="181.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">display: none, nothing is unmounted</text><line x1="180" y1="186" x2="180" y2="208" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="380" y="72" width="320" height="44" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="540" y="98.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">You click a link to another page</text><line x1="540" y1="116" x2="540" y2="138" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="380" y="138" width="320" height="48" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="540" y="159.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Next hides the post</text><text x="540" y="181.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">display: none, nothing is unmounted</text><line x1="540" y1="186" x2="540" y2="208" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="20" y="208" width="320" height="48" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="180" y="229.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Speech stops, the state says playing</text><text x="180" y="251.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">back: Stop listening, but silence</text><rect x="380" y="208" width="320" height="48" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="540" y="229.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">The cleanup resets the state too</text><text x="540" y="251.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">back: Listen to this post</text><text x="20" y="280" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Measured on 2026-11-13 with a stubbed speech engine, before and after the fix.</text></svg>

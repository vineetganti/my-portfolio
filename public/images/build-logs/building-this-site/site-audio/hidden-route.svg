<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>hidden route</title><desc>Before and after for leaving the podcasts pages while an episode plays. Before: you click a link to a post, Next hides the page with display none instead of removing it, and the audio element keeps playing while its player bar is hidden, so there is no way to stop it. After: the same hide runs a layout-effect cleanup that pauses the audio, and coming back shows the episode paused where it was.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="300" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Leaving /podcasts while an episode plays</text><text x="20" y="62" font-size="12.5" font-weight="700" fill="#b0273f" text-anchor="start">Before</text><text x="380" y="62" font-size="12.5" font-weight="700" fill="#4b7d33" text-anchor="start">After</text><rect x="20" y="72" width="320" height="44" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="180" y="98.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">You click a link to a post</text><line x1="180" y1="116" x2="180" y2="138" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="20" y="138" width="320" height="48" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="180" y="159.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Next hides the page</text><text x="180" y="181.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">display: none, nothing is unmounted</text><line x1="180" y1="186" x2="180" y2="208" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="380" y="72" width="320" height="44" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="540" y="98.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">You click a link to a post</text><line x1="540" y1="116" x2="540" y2="138" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="380" y="138" width="320" height="48" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="540" y="159.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Next hides the page</text><text x="540" y="181.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">display: none, nothing is unmounted</text><line x1="540" y1="186" x2="540" y2="208" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="20" y="208" width="320" height="48" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="180" y="229.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">The audio keeps playing</text><text x="180" y="251.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">its bar is hidden too: no controls</text><rect x="380" y="208" width="320" height="48" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="540" y="229.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">A layout-effect cleanup pauses it</text><text x="540" y="251.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">coming back: paused, position kept</text><text x="20" y="280" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Measured on 2026-11-13 before the fix: two seconds after leaving, the position had moved from 5.4 s to 7.4 s.</text></svg>

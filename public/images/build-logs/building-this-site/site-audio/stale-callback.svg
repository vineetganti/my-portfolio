<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>stale callback</title><desc>The bug the generation counter prevents. Before: the reader presses pause, the player cancels the utterance, but the cancelled utterance still fires its end event, which starts the next chunk, so pause undoes itself. After: every speak call takes a new generation number, pause bumps it too, and the late end event sees an old number and does nothing.</desc><defs><marker id="ah-b0273f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b0273f"/></marker><marker id="ah-4b7d33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b7d33"/></marker></defs><rect width="720" height="270" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Before and after: a cancelled utterance that still ends</text><text x="20" y="62" font-size="12.5" font-weight="700" fill="#b0273f" text-anchor="start">Before</text><rect x="20" y="72" width="150" height="44" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="95" y="98.2" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">speak(4)</text><rect x="192" y="72" width="150" height="44" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="267" y="98.2" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">pause</text><line x1="170" y1="94" x2="190" y2="94" stroke="#b0273f" stroke-width="1.6" marker-end="url(#ah-b0273f)"/><rect x="364" y="72" width="150" height="44" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="439" y="98.2" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">old onend fires</text><line x1="342" y1="94" x2="362" y2="94" stroke="#b0273f" stroke-width="1.6" marker-end="url(#ah-b0273f)"/><rect x="536" y="72" width="150" height="44" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="611" y="98.2" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">speak(5) starts</text><line x1="514" y1="94" x2="534" y2="94" stroke="#b0273f" stroke-width="1.6" marker-end="url(#ah-b0273f)"/><text x="20" y="150" font-size="12.5" font-weight="700" fill="#4b7d33" text-anchor="start">After</text><rect x="20" y="160" width="150" height="44" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="95" y="186.2" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">speak(4), gen 7</text><rect x="192" y="160" width="150" height="44" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="267" y="186.2" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">pause, gen 8</text><line x1="170" y1="182" x2="190" y2="182" stroke="#4b7d33" stroke-width="1.6" marker-end="url(#ah-4b7d33)"/><rect x="364" y="160" width="150" height="44" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="439" y="186.2" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">old onend: gen 7</text><line x1="342" y1="182" x2="362" y2="182" stroke="#4b7d33" stroke-width="1.6" marker-end="url(#ah-4b7d33)"/><rect x="536" y="160" width="150" height="44" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="611" y="186.2" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">ignored: 7 ≠ 8</text><line x1="514" y1="182" x2="534" y2="182" stroke="#4b7d33" stroke-width="1.6" marker-end="url(#ah-4b7d33)"/><text x="20" y="236" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">The fix is one number compared in the callback, not a flag that has to be reset in every code path.</text></svg>

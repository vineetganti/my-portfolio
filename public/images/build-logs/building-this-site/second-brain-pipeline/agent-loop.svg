<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>agent loop</title><desc>The working loop behind this project, as the build log shows it. The owner asks for something in the chat. Claude Code, the agent, reads files, runs commands and edits code through tools, and each tool result goes back into its context before the next step. Some actions need the owner: running live Gmail fetches, approving installs into the global Python, and making the signing key. The loop ends with tests run and an entry written to the build log.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-9a5400" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a5400"/></marker><marker id="ah-4b7d33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b7d33"/></marker></defs><rect width="720" height="320" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">The agent loop, and where the human sits in it</text><rect x="20" y="120" width="130" height="60" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="85" y="147.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">owner asks</text><text x="85" y="169.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">goal, decisions</text><rect x="210" y="120" width="140" height="60" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="280" y="147.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Claude Code</text><text x="280" y="169.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">plans the next step</text><rect x="420" y="50" width="160" height="56" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="500" y="75.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">tool call</text><text x="500" y="97.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Read, Bash, Edit, Write</text><rect x="420" y="190" width="160" height="56" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="500" y="215.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">tool result</text><text x="500" y="237.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">into the context</text><line x1="150" y1="150" x2="210" y2="150" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="350" y1="130" x2="418" y2="80" stroke="#9a5400" stroke-width="1.6" marker-end="url(#ah-9a5400)"/><line x1="500" y1="106" x2="500" y2="190" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="418" y1="216" x2="350" y2="170" stroke="#9a5400" stroke-width="1.6" marker-end="url(#ah-9a5400)"/><text x="394.2" y="217.9" font-size="11" font-weight="700" fill="#9a5400" text-anchor="middle">next step</text><rect x="610" y="50" width="100" height="56" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="660" y="75.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">owner</text><text x="660" y="97.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">runs live fetch</text><rect x="610" y="190" width="100" height="56" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="660" y="215.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">tests + log</text><text x="660" y="237.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">then report</text><line x1="580" y1="78" x2="608" y2="78" stroke="#4b7d33" stroke-width="1.6" marker-start="url(#ah-4b7d33)" marker-end="url(#ah-4b7d33)"/><line x1="580" y1="218" x2="608" y2="218" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="20" y="270" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Private mail was fetched by the owner, not the agent, so it never entered the agent's context; installs outside</text><text x="20" y="285.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">the project's venv were run only after the owner approved them.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>quota before after</title><desc>The first real failure, before and after. Before: the fetch asked Gmail for every email from the last day and fetched each one in full, back to back. A full fetch costs 60 quota units and the limit is 6,000 units per user per minute, so the run hit 403 rateLimitExceeded after 103 messages. After: a sender allowlist narrows the search at Gmail, each fetch is followed by a 0.7-second pause, about 5,100 units a minute, and a rate-limit error is retried with exponential backoff and jitter.</desc><defs><marker id="ah-b0273f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b0273f"/></marker><marker id="ah-4b7d33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b7d33"/></marker></defs><rect width="720" height="270" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Before and after: Gmail's per-minute quota</text><text x="20" y="62" font-size="12.5" font-weight="700" fill="#b0273f" text-anchor="start">Before</text><rect x="20" y="72" width="150" height="52" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="95" y="95.09" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">newer_than:1d</text><text x="95" y="115.73" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">whole inbox</text><rect x="192" y="72" width="150" height="52" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="267" y="95.09" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">get(format=full)</text><text x="267" y="115.73" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">60 units each</text><line x1="170" y1="98" x2="190" y2="98" stroke="#b0273f" stroke-width="1.6" marker-end="url(#ah-b0273f)"/><rect x="364" y="72" width="150" height="52" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="439" y="95.09" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">no pause</text><text x="439" y="115.73" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">back to back</text><line x1="342" y1="98" x2="362" y2="98" stroke="#b0273f" stroke-width="1.6" marker-end="url(#ah-b0273f)"/><rect x="536" y="72" width="150" height="52" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="611" y="95.09" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">403 at 103</text><text x="611" y="115.73" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">rateLimitExceeded</text><line x1="514" y1="98" x2="534" y2="98" stroke="#b0273f" stroke-width="1.6" marker-end="url(#ah-b0273f)"/><text x="20" y="160" font-size="12.5" font-weight="700" fill="#4b7d33" text-anchor="start">After</text><rect x="20" y="170" width="150" height="52" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="95" y="193.09" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">from:(allowlist)</text><text x="95" y="213.73" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">newsletters only</text><rect x="192" y="170" width="150" height="52" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="267" y="193.09" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">0.7 s pause</text><text x="267" y="213.73" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">≈ 5,100 units/min</text><line x1="170" y1="196" x2="190" y2="196" stroke="#4b7d33" stroke-width="1.6" marker-end="url(#ah-4b7d33)"/><rect x="364" y="170" width="150" height="52" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="439" y="193.09" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">backoff + jitter</text><text x="439" y="213.73" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">5, 10, 20 … 60 s</text><line x1="342" y1="196" x2="362" y2="196" stroke="#4b7d33" stroke-width="1.6" marker-end="url(#ah-4b7d33)"/><rect x="536" y="170" width="150" height="52" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="611" y="193.09" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">11 emails, 7 days</text><text x="611" y="213.73" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">no errors</text><line x1="514" y1="196" x2="534" y2="196" stroke="#4b7d33" stroke-width="1.6" marker-end="url(#ah-4b7d33)"/><text x="20" y="252" font-size="11" font-weight="400" fill="#7a6d57" text-anchor="start">6,000 units per user per minute ÷ 60 units per full message ≈ 100 messages a minute.</text></svg>

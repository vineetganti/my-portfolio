<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>pipeline</title><desc>The Second brain pipeline end to end. Sources: Gmail newsletters through an allowlist, RSS and Atom feeds, sitemaps and listing pages, NITI PDFs and SEC EDGAR filings. Parse: HTML to text, tracking links unwrapped or resolved, paywalled stories dropped. Triage: claude -p with no tools and a JSON schema scores each document. SQLite stores items, the seen-set and the owner's labels. The local curator page collects ratings. nb publish signs the public files, and the upload script sends them to the website.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="330" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">From a newsletter to a signed public file</text><rect x="20" y="46" width="130" height="52" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="85" y="69.27" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">Gmail</text><text x="85" y="90.41" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">allowlist</text><rect x="20" y="108" width="130" height="52" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="85" y="131.27" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">RSS / Atom</text><text x="85" y="152.41" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">feeds by topic</text><rect x="20" y="170" width="130" height="52" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="85" y="193.27" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">sitemaps, pages</text><text x="85" y="214.41" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">watched</text><rect x="20" y="232" width="130" height="52" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="85" y="255.27" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">NITI, EDGAR</text><text x="85" y="276.41" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">PDFs, filings</text><rect x="190" y="120" width="120" height="60" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="250" y="140.51" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">parse</text><text x="250" y="162.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">text, links,</text><text x="250" y="176.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">paywall</text><rect x="350" y="120" width="120" height="60" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="410" y="147.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">triage</text><text x="410" y="169.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">claude -p, no tools</text><rect x="510" y="120" width="120" height="60" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="570" y="147.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">SQLite</text><text x="570" y="169.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">items, labels</text><rect x="510" y="220" width="120" height="54" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="570" y="244.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">nb brief</text><text x="570" y="266.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">rate on localhost</text><rect x="350" y="220" width="120" height="54" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="410" y="244.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">nb publish</text><text x="410" y="266.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">whitelist + sign</text><rect x="190" y="220" width="120" height="54" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="250" y="244.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">upload</text><text x="250" y="266.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">to Vercel Blob</text><line x1="150" y1="72" x2="188" y2="150" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="150" y1="134" x2="188" y2="150" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="150" y1="196" x2="188" y2="150" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="150" y1="258" x2="188" y2="150" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="310" y1="150" x2="350" y2="150" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="470" y1="150" x2="510" y2="150" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="570" y1="180" x2="570" y2="218" stroke="#5e5241" stroke-width="1.6" marker-start="url(#ah-5e5241)" marker-end="url(#ah-5e5241)"/><line x1="508" y1="247" x2="472" y2="247" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="348" y1="247" x2="312" y2="247" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="640" y="120" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">The website</text><text x="640" y="134.175" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">only ever</text><text x="640" y="148.35" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">sees what was</text><text x="640" y="162.525" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">signed.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" width="720" height="310" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>triage sandbox</title><desc>How an untrusted newsletter reaches the model. The document goes in on stdin, never on the command line. claude -p runs in an empty throwaway folder with all tools disabled, no settings, no MCP servers and no session saved. The output must match a JSON schema. API keys are removed from the environment so the subscription is used. Code then drops any item whose URL was not in the document. In the live test, a planted instruction to create a file and add a fake item had no effect.</desc><defs><marker id="ah-b0273f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b0273f"/></marker><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="310" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Treat every document as hostile input</text><rect x="20" y="110" width="130" height="60" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="85" y="137.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">document</text><text x="85" y="159.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">untrusted text</text><rect x="190" y="50" width="300" height="190" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5" stroke-dasharray="5 4"/><text x="206" y="72" font-size="11.5" font-weight="700" fill="#5e5241" text-anchor="start">empty throwaway folder</text><rect x="210" y="110" width="260" height="60" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="340" y="137.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">claude -p</text><text x="340" y="159.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">--tools "" · --json-schema · stdin</text><text x="210" y="196" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">no settings, no MCP, no session saved,</text><text x="210" y="210.175" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">ANTHROPIC_API_KEY removed</text><rect x="530" y="110" width="170" height="60" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="615" y="137.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">code checks</text><text x="615" y="159.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">schema, URL whitelist</text><line x1="150" y1="140" x2="210" y2="140" stroke="#b0273f" stroke-width="1.6" marker-end="url(#ah-b0273f)"/><text x="168" y="130" font-size="11" font-weight="700" fill="#b0273f" text-anchor="middle">stdin</text><line x1="470" y1="140" x2="530" y2="140" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="20" y="262" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Live test with a planted "echo PWNED &gt; pwned.txt" and a fake HACKED item: no file created, no fake item. One</text><text x="20" y="277.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">test, not a proof.</text></svg>

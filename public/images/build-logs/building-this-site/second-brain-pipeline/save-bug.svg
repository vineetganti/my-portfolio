<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>save bug</title><desc>The bug that reached the owner, before and after. Before: the store opened its SQLite connection on the main thread, Gradio ran the Save handler on a worker thread, and SQLite refused with a ProgrammingError, so no rating was stored. Unit tests passed because they ran on one thread. After: the connection allows other threads and a lock guards every write, and the check that matters was repeated through the real page: Saved 17 labels.</desc><defs><marker id="ah-b0273f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b0273f"/></marker><marker id="ah-4b7d33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b7d33"/></marker></defs><rect width="720" height="260" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Before and after: the Save button</text><text x="20" y="62" font-size="12.5" font-weight="700" fill="#b0273f" text-anchor="start">Before</text><rect x="20" y="72" width="150" height="50" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="95" y="94.27" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">main thread</text><text x="95" y="115.41" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">opens SQLite</text><rect x="192" y="72" width="150" height="50" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="267" y="94.27" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">Gradio worker</text><text x="267" y="115.41" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">runs Save</text><line x1="170" y1="97" x2="190" y2="97" stroke="#b0273f" stroke-width="1.6" marker-end="url(#ah-b0273f)"/><rect x="364" y="72" width="150" height="50" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="439" y="94.27" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">ProgrammingError</text><text x="439" y="115.41" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">other thread</text><line x1="342" y1="97" x2="362" y2="97" stroke="#b0273f" stroke-width="1.6" marker-end="url(#ah-b0273f)"/><rect x="536" y="72" width="150" height="50" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="611" y="94.27" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">0 ratings saved</text><text x="611" y="115.41" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle"></text><line x1="514" y1="97" x2="534" y2="97" stroke="#b0273f" stroke-width="1.6" marker-end="url(#ah-b0273f)"/><text x="20" y="158" font-size="12.5" font-weight="700" fill="#4b7d33" text-anchor="start">After</text><rect x="20" y="168" width="150" height="50" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="95" y="190.27" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">check_same_thread</text><text x="95" y="211.41" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">False</text><rect x="192" y="168" width="150" height="50" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="267" y="190.27" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">RLock</text><text x="267" y="211.41" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">around writes</text><line x1="170" y1="193" x2="190" y2="193" stroke="#4b7d33" stroke-width="1.6" marker-end="url(#ah-4b7d33)"/><rect x="364" y="168" width="150" height="50" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="439" y="190.27" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">real page, real Save</text><text x="439" y="211.41" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">via a client</text><line x1="342" y1="193" x2="362" y2="193" stroke="#4b7d33" stroke-width="1.6" marker-end="url(#ah-4b7d33)"/><rect x="536" y="168" width="150" height="50" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="611" y="190.27" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">Saved 17 labels</text><text x="611" y="211.41" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">matched</text><line x1="514" y1="193" x2="534" y2="193" stroke="#4b7d33" stroke-width="1.6" marker-end="url(#ah-4b7d33)"/><text x="20" y="246" font-size="11" font-weight="400" fill="#7a6d57" text-anchor="start">The tests ran on one thread; the page did not. Test the user's action, not only the function.</text></svg>

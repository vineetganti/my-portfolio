<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>learning loop</title><desc>How the model learns from the owner's ratings without fine-tuning. The owner rates items skip, good or top learning on the curator page. Once there are at least three good-or-top and three skip ratings, the four most recent of each are shown to the triage model as labelled examples, in the user message and never the system prompt, with each item's own rating hidden when it is re-scored. nb eval then measures agreement against gates written down in advance before automatic mode is allowed.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-4b7d33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b7d33"/></marker></defs><rect width="720" height="280" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Ratings become examples, examples are measured</text><rect x="20" y="100" width="130" height="60" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="85" y="127.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">ratings</text><text x="85" y="149.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">skip · good · top</text><rect x="190" y="100" width="140" height="60" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="260" y="127.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">≥ 3 and ≥ 3?</text><text x="260" y="149.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">likes and skips</text><rect x="370" y="100" width="150" height="60" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="445" y="127.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">examples</text><text x="445" y="149.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">in the user message</text><rect x="560" y="100" width="140" height="60" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="630" y="127.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">triage</text><text x="630" y="149.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">own rating hidden</text><rect x="370" y="196" width="150" height="56" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="445" y="221.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">nb eval</text><text x="445" y="243.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">gap, precision, recall</text><line x1="150" y1="130" x2="190" y2="130" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="330" y1="130" x2="370" y2="130" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="520" y1="130" x2="560" y2="130" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="630" y1="160" x2="522" y2="214" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><path d="M368 224 L85 224 L85 162" fill="none" stroke="#4b7d33" stroke-width="1.6" marker-end="url(#ah-4b7d33)"/><text x="226" y="240" font-size="11" font-weight="700" fill="#4b7d33" text-anchor="middle">gates before automatic</text></svg>

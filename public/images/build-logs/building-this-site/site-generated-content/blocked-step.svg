<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>blocked step</title><desc>How a blocked statement is recorded. Session A updates a row and holds its lock. Session B tries to update the same row and blocks. The recorder does not wait for B: it records B as waiting, moves on, and when session A commits it notes that B returned at that step, with B's real result. The theater replays it the same way.</desc><defs><marker id="ah-4b7d33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b7d33"/></marker></defs><rect width="720" height="250" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">A blocked statement is recorded as waiting, then released</text><text x="130" y="58" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">Session A</text><text x="430" y="58" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">Session B</text><text x="20" y="88" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">step 1</text><rect x="70" y="66" width="120" height="32" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="130" y="85.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">UPDATE row 1</text><text x="20" y="128" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">step 2</text><rect x="370" y="106" width="150" height="32" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="445" y="125.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">UPDATE row 1</text><text x="20" y="168" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">step 3</text><rect x="70" y="146" width="120" height="32" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="130" y="165.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">COMMIT</text><rect x="370" y="146" width="150" height="32" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="445" y="165.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">…waiting</text><text x="20" y="208" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">step 4</text><rect x="370" y="186" width="150" height="32" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="445" y="205.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">returns: UPDATE 1</text><line x1="190" y1="162" x2="368" y2="182" stroke="#4b7d33" stroke-width="1.6" marker-end="url(#ah-4b7d33)"/><text x="279" y="168" font-size="11" font-weight="700" fill="#4b7d33" text-anchor="middle">releases</text><text x="560" y="80" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">The recorder notes which</text><text x="560" y="94.175" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">step released B, so the</text><text x="560" y="108.35" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">replay shows the wait and</text><text x="560" y="122.525" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">the moment it ends.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 225" width="720" height="225" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>summary map</title><desc>A map of the generated-content post. SQL bank: specs, DuckDB, real outputs and traces. Database harness: Docker engines and real sessions, recorded to JSON. Components: replay recordings without a database. Rules: prose numbers are re-checked after any re-run.</desc><defs></defs><rect width="720" height="225" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Content generated from real runs</text><rect x="20" y="50" width="162" height="105" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="101" y="86.08" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">SQL bank</text><text x="101" y="107.72" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Python specs</text><text x="101" y="121.58" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">DuckDB per question</text><text x="101" y="135.44" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">MDX + traces</text><rect x="192" y="50" width="162" height="105" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="273" y="86.08" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">DB harness</text><text x="273" y="107.72" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">5 engines in Docker</text><text x="273" y="121.58" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">real sessions</text><text x="273" y="135.44" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">JSON recordings</text><rect x="364" y="50" width="162" height="105" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="445" y="86.08" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Components</text><text x="445" y="107.72" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">DataTrace</text><text x="445" y="121.58" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">TxnTheater, Ran</text><text x="445" y="135.44" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">LabChart</text><rect x="536" y="50" width="162" height="105" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="617" y="86.08" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Rule</text><text x="617" y="107.72" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">never type an output</text><text x="617" y="121.58" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">re-run, then re-read</text><text x="617" y="135.44" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">prose quotes the run</text><text x="20" y="185" font-size="12" font-weight="700" fill="#5e5241" text-anchor="start">A number in these posts comes from a run that can be repeated, not from memory.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>sql bank</title><desc>How a SQL practice post is generated. A Python spec holds each question's sample tables, answer and explanation. build.py creates a fresh in-memory DuckDB database per question, runs the setup and the answer, and runs a re-runnable answer twice to prove it is idempotent. From the real results it writes the post's MDX and a JSON file of trace steps that the DataTrace component reads.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-b0273f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b0273f"/></marker></defs><rect width="720" height="280" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">No output in the SQL posts is typed by hand</text><rect x="20" y="60" width="140" height="60" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="90" y="87.09" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">posts/pN_*.py</text><text x="90" y="107.73" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">question specs</text><rect x="210" y="60" width="150" height="60" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="285" y="87.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">DuckDB</text><text x="285" y="109.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">fresh database each</text><rect x="420" y="40" width="130" height="50" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="485" y="69.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&lt;slug&gt;.mdx</text><rect x="420" y="110" width="130" height="50" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="485" y="132.09" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&lt;slug&gt;.json</text><text x="485" y="152.73" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">trace steps</text><rect x="590" y="110" width="110" height="50" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="645" y="139.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">DataTrace</text><line x1="160" y1="90" x2="210" y2="90" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="360" y1="80" x2="418" y2="65" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="360" y1="100" x2="418" y2="135" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="550" y1="135" x2="590" y2="135" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="210" y="160" width="150" height="50" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="285" y="182.09" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">rerun=True</text><text x="285" y="202.73" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">run twice, must match</text><line x1="285" y1="120" x2="285" y2="158" stroke="#b0273f" stroke-width="1.6" marker-end="url(#ah-b0273f)"/><text x="20" y="236" font-size="11.5" font-weight="700" fill="#5e5241" text-anchor="start">Re-run on 2026-11-13: 92 questions in 5 seconds, and git showed no file changed.</text></svg>

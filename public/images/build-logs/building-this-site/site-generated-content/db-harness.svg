<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>db harness</title><desc>How the Database Engineering recordings are made. A spec describes sessions and steps. record.mjs starts the engines in Docker: PostgreSQL, MySQL, MongoDB, Redis and Memcached. Each session is a real connection, and a step that blocks is recorded with the step that released it. The results go to content/db-lab as JSON, and every live box is also checked on PGlite before anything is written.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-4b7d33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b7d33"/></marker></defs><rect width="720" height="300" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Recordings from real engines, replayed by components</text><rect x="20" y="110" width="130" height="60" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="85" y="137.09" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">specs/*.mjs</text><text x="85" y="157.73" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">sessions, steps</text><rect x="190" y="110" width="130" height="60" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="255" y="137.09" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">record.mjs</text><text x="255" y="157.73" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">one run per item</text><rect x="360" y="40" width="140" height="36" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="430" y="62.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">PostgreSQL 18</text><rect x="360" y="84" width="140" height="36" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="430" y="106.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">MySQL 8.4</text><rect x="360" y="128" width="140" height="36" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="430" y="150.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">MongoDB 8</text><rect x="360" y="172" width="140" height="36" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="430" y="194.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">Redis 8</text><rect x="360" y="216" width="140" height="36" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="430" y="238.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">Memcached</text><text x="430" y="268" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Docker, real connections</text><rect x="540" y="80" width="160" height="56" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="620" y="105.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">content/db-lab</text><text x="620" y="127.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">JSON per post</text><rect x="540" y="170" width="160" height="56" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="620" y="195.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">TxnTheater, Ran</text><text x="620" y="217.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">LabChart, PgPlayground</text><line x1="150" y1="140" x2="190" y2="140" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/>
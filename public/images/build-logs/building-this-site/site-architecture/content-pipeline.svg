<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="720" height="372" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>From a file to a page</title><desc>Three lanes. Read: a content file goes through gray-matter and parsePost to become a BlogPost object. Ask: the queries in blog.ts feed the blog index, section, series and post pages. Render: the post body goes through MDXRemote with remark-gfm, rehype-slug and rehype-highlight and custom components, and every page is built to static HTML.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-7d8257" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7a6d57"/></marker></defs><rect width="720" height="372" fill="#fffdf8"/><text x="14" y="32" font-size="12.5" font-weight="700" fill="#9a5400" text-anchor="start">1. Read</text><text x="14" y="142" font-size="12.5" font-weight="700" fill="#9a5400" text-anchor="start">2. Ask</text><text x="14" y="254" font-size="12.5" font-weight="700" fill="#9a5400" text-anchor="start">3. Render</text><rect x="14" y="40" width="150" height="64" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="89" y="68.925" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">content/blog/*.mdx</text><text x="89" y="84.425" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">one file per post</text><rect x="204" y="40" width="150" height="64" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="279" y="62.1" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">gray-matter</text><text x="279" y="77.6" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">splits frontmatter</text><text x="279" y="91.25" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">from the body</text><rect x="394" y="40" width="150" height="64" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="469" y="62.1" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">parsePost()</text><text x="469" y="77.6" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">defaults, section check,</text><text x="469" y="91.25" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">reading + listen time</text><rect x="584" y="40" width="150" height="64" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="659" y="62.1" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">BlogPost</text><text x="659" y="77.6" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">title, date, tags,</text><text x="659" y="91.25" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">section, series, body</text><line x1="166" y1="72" x2="202" y2="72" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><line x1="356" y1="72" x2="392" y2="72" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><line x1="546" y1="72" x2="582" y2="72" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="14" y="150" width="330" height="74" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="179" y="176.6" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">queries in blog.ts</text><text x="179" y="192.72" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">getAllPosts · getPostsBySection</text><text x="179" y="207.02" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">getPostsBySeries · getSeriesPosition</text><rect x="386" y="150" width="320" height="74" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="546" y="176.6" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">pages (all prerendered)</text><text x="546" y="192.72" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">/blog · /blog/topic/[section]</text><text x="546" y="207.02" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">/blog/series/[series] · /blog/[slug]</text><line x1="344" y1="187" x2="384" y2="187" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><path d="M 647 104 L 647 126 L 179 126 L 179 148" fill="none" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)" stroke-linejoin="round" stroke-linecap="round"/><text x="413" y="120" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">every page asks for posts at build time</text><rect x="14" y="262" width="220" height="66" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="124" y="278.425" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">MdxContent</text><text x="124" y="294.545" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">MDXRemote (server) +</text><text x="124" y="308.195" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">remark-gfm, rehype-slug,</text><text x="124" y="321.845" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">rehype-highlight</text><rect x="262" y="262" width="200" height="66" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="362" y="285.25" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">custom components</text><text x="362" y="301.37" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Callout, CodeBlock,</text><text x="362" y="315.02" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Table, # heading links</text><rect x="490" y="262" width="216" height="66" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="598" y="285.25" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">static HTML</text><text x="598" y="301.37" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">generateStaticParams lists</text><text x="598" y="315.02" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">every slug to build</text><line x1="234" y1="295" x2="260" y2="295" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><line x1="462" y1="295" x2="488" y2="295" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><path d="M 546 224 L 546 244 L 124 244 L 124 260" fill="none" stroke="#7a6d57" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah-7d8257)" stroke-linejoin="round" stroke-linecap="round"/><text x="335" y="239" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">the post page hands its body to MdxContent</text><text x="360" y="358" font-size="12" font-weight="400" fill="#5e5241" text-anchor="middle" font-style="italic">No database and no API: the repo is the CMS, and next build turns it into pages.</text></svg>

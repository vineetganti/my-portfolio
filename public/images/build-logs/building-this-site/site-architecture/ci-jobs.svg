<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>ci jobs</title><desc>The checks every push and pull request runs on GitHub Actions: a public-safety job that fails if a private file or secret is tracked, a site job that lints, runs the Node tests, type-checks and builds, and a pipeline job that runs the Python tests for the Second brain.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="250" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Three independent CI jobs</text><rect x="20" y="104" width="130" height="60" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="85" y="131.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">push or PR</text><text x="85" y="153.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">GitHub Actions</text><rect x="230" y="50" width="200" height="54" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="330" y="74.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">public-safety</text><text x="330" y="96.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">no tracked key, token, path</text><rect x="230" y="112" width="200" height="54" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="330" y="136.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">site</text><text x="330" y="158.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">lint, tests, tsc, build</text><rect x="230" y="174" width="200" height="54" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="330" y="198.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">second-brain</text><text x="330" y="220.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">pytest, Python 3.12</text><line x1="150" y1="122" x2="228" y2="77" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="150" y1="134" x2="230" y2="139" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="150" y1="146" x2="228" y2="201" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="470" y="70" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">A job that fails blocks the merge. The</text><text x="470" y="85.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">safety job needs no install, so it</text><text x="470" y="101.05" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">reports first.</text><text x="470" y="150" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">The site job builds with no Second</text><text x="470" y="165.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">brain settings on purpose: the page</text><text x="470" y="181.05" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">must still build when it is not set</text><text x="470" y="196.575" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">up.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>server and client</title><desc>Which code runs where. Server components run at build time and send only HTML: the pages, MdxContent with its diagram inliner, the post and lab readers, and the Second brain verifier. Client components are small islands that ship JavaScript: the audio players, the table of contents, diagram motion and flow animation, live charts, the database labs and the flash cards.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="330" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Server components send HTML, client islands send JavaScript</text><rect x="20" y="46" width="330" height="262" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="36" y="70" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">Server: runs at build time</text><rect x="36" y="82" width="298" height="46" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="185" y="102.6" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">pages and layouts</text><text x="185" y="123.3" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">read content with fs</text><rect x="36" y="136" width="298" height="46" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="185" y="156.6" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">MdxContent</text><text x="185" y="177.3" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">compiles MDX, inlines SVGs</text><rect x="36" y="190" width="298" height="46" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="185" y="210.6" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">blog.ts, notes.ts, dbLab.ts</text><text x="185" y="231.3" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">parse files into objects</text><rect x="36" y="244" width="298" height="46" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="185" y="264.6" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">secondBrain.ts</text><text x="185" y="285.3" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">fetch, verify, cache</text><rect x="370" y="46" width="330" height="262" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="386" y="70" font-size="12.5" font-weight="700" fill="#9a5400" text-anchor="start">Client: hydrates in the browser</text><rect x="386" y="82" width="298" height="46" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="535" y="102.6" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">AudioPlayer, PodcastProvider</text><text x="535" y="123.3" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">speech and the podcast bar</text><rect x="386" y="136" width="298" height="46" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="535" y="156.6" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">TableOfContents</text><text x="535" y="177.3" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">scrollspy, progress bar</text><rect x="386" y="190" width="298" height="46" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="535" y="210.6" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">DiagramMotion, FlowDiagram</text><text x="535" y="231.3" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">reveal and message flow</text><rect x="386" y="244" width="298" height="46" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="535" y="264.6" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">charts, db labs, flash cards</text><text x="535" y="285.3" font-size="10" font-weight="400" fill="#5e5241" text-anchor="middle">state that changes on input</text><line x1="350" y1="180" x2="368" y2="180" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/></svg>

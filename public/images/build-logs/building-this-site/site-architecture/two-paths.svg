<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>two paths</title><desc>Two ways a page reaches a reader. At build time, a git push starts next build on Vercel, which prerenders every page to static HTML that a CDN serves to readers. At request time, only the Second brain page does work: its cached render fetches signed files from Vercel Blob at most every 15 minutes.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="300" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Almost everything happens before anyone visits</text><text x="20" y="62" font-size="12.5" font-weight="700" fill="#9a5400" text-anchor="start">Build time: once per push</text><rect x="20" y="74" width="120" height="56" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="80" y="99.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">git push</text><text x="80" y="121.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">to main</text><rect x="190" y="74" width="150" height="56" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="265" y="99.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">next build</text><text x="265" y="121.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">prerenders every page</text><rect x="390" y="74" width="130" height="56" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="455" y="99.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">CDN</text><text x="455" y="121.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">static HTML and JS</text><rect x="570" y="74" width="130" height="56" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="635" y="99.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">reader</text><text x="635" y="121.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">any page</text><line x1="140" y1="102" x2="190" y2="102" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="340" y1="102" x2="390" y2="102" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="520" y1="102" x2="570" y2="102" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="20" y="182" font-size="12.5" font-weight="700" fill="#4b7d33" text-anchor="start">Request time: one page, at most every 15 minutes</text><rect x="20" y="194" width="120" height="56" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="80" y="219.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">visitor</text><text x="80" y="241.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">/second-brain</text><rect x="190" y="194" width="150" height="56" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="265" y="219.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">cached render</text><text x="265" y="241.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">'use cache', 15 min</text><rect x="390" y="194" width="130" height="56" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="455" y="219.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Vercel Blob</text><text x="455" y="241.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">signed files</text><line x1="140" y1="222" x2="190" y2="222" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="340" y1="222" x2="390" y2="222" stroke="#5e5241" stroke-width="1.6" marker-start="url(#ah-5e5241)" marker-end="url(#ah-5e5241)"/><text x="560" y="210" font-size="11" font-weight="400" fill="#5e5241" text-anchor="start">Everything else is fixed</text><text x="560" y="224.85" font-size="11" font-weight="400" fill="#5e5241" text-anchor="start">until the next push.</text><line x1="20" y1="160" x2="700" y2="160" stroke="#7a6d57" stroke-width="1" stroke-dasharray="3 4"/></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>verify order</title><desc>What the site does with each file. It fetches the file and its signature from current, then verifies the signature over the raw bytes before parsing anything. Only then does it parse the JSON and validate the schema, age, count, field types and that every link is https. If any step fails it tries the copy in previous. If that fails too, the file is not shown, and if the status file fails the whole page shows Temporarily unavailable.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-b0273f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b0273f"/></marker></defs><rect width="720" height="290" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Verify the bytes first, parse second</text><rect x="20" y="70" width="120" height="56" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="80" y="95.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">fetch</text><text x="80" y="117.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">file + .sig</text><rect x="160" y="70" width="120" height="56" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="220" y="95.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">verify</text><text x="220" y="117.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">raw bytes, Ed25519</text><line x1="140" y1="98" x2="158" y2="98" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="300" y="70" width="120" height="56" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="95.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">parse</text><text x="360" y="117.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">JSON</text><line x1="280" y1="98" x2="298" y2="98" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="440" y="70" width="120" height="56" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="500" y="95.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">validate</text><text x="500" y="117.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">schema, age, https</text><line x1="420" y1="98" x2="438" y2="98" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="580" y="70" width="120" height="56" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="640" y="95.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">render</text><text x="640" y="117.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">text only</text><line x1="560" y1="98" x2="578" y2="98" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><path d="M220 126 L220 170 L80 170 L80 128" fill="none" stroke="#b0273f" stroke-width="1.6" marker-end="url(#ah-b0273f)"/><text x="150" y="186" font-size="11" font-weight="700" fill="#b0273f" text-anchor="middle">fails: try previous/</text><text x="20" y="214" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">A bad signature never reaches JSON.parse. Neither copy verifying means the item isn't shown; a status file that</text><text x="20" y="229.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">doesn't verify means the page fails closed: "Temporarily unavailable".</text></svg>

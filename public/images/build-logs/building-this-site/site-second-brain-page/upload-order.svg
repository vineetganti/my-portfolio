<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>upload order</title><desc>The upload script's order of work. First it verifies all five files and signatures with the same code the site runs, and refuses to upload anything if one fails. Then it copies the live current files to previous, so the site always has a verified fallback. Then it uploads the data files and their signatures, and the status file last, so a new status never points at half-uploaded lists.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="230" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">The upload script: refuse early, keep a fallback, status last</text><rect x="20" y="70" width="150" height="60" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="95" y="97.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">verify all 5</text><text x="95" y="119.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">same code as the site</text><rect x="192" y="70" width="150" height="60" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="267" y="97.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">copy live</text><text x="267" y="119.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">current → previous</text><line x1="170" y1="100" x2="190" y2="100" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="364" y="70" width="150" height="60" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="439" y="97.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">upload lists</text><text x="439" y="119.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">files + .sig</text><line x1="342" y1="100" x2="362" y2="100" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="536" y="70" width="150" height="60" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="611" y="97.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">status.json</text><text x="611" y="119.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">last</text><line x1="514" y1="100" x2="534" y2="100" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="20" y="160" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">A tampered file stops the run before the network is touched. The first upload had no live copy to keep, which the</text><text x="20" y="175.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">script now treats as normal.</text></svg>

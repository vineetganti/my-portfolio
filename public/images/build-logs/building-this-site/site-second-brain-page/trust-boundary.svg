<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" width="720" height="310" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>trust boundary</title><desc>Where the trust boundary sits. On the owner's machine: the private database, the private signing key, nb publish which writes and signs five files, and the upload script which holds the Blob token. In Vercel Blob: the five files and their signatures, in current and previous folders. On the website: only the public key. The site fetches, verifies and renders, and has no path that writes anything back.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-4b7d33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b7d33"/></marker></defs><rect width="720" height="310" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">The site can read, verify and show. It cannot write.</text><rect x="20" y="46" width="250" height="220" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="36" y="70" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">Owner's machine (private)</text><rect x="36" y="84" width="218" height="52" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="145" y="107.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">nb publish</text><text x="145" y="129.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">writes + signs 5 files</text><rect x="36" y="150" width="218" height="52" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="145" y="173.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">upload script</text><text x="145" y="195.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">holds the Blob token</text><text x="145" y="226" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">private.pem never leaves</text><text x="145" y="244" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">the database stays local</text><rect x="320" y="120" width="150" height="70" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="395" y="145.51" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Vercel Blob</text><text x="395" y="167.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">current/ previous/</text><text x="395" y="181.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">public files</text><rect x="520" y="46" width="180" height="220" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="536" y="70" font-size="12.5" font-weight="700" fill="#4b7d33" text-anchor="start">Website (public)</text><rect x="536" y="84" width="148" height="52" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="610" y="107.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">secondBrain.ts</text><text x="610" y="129.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">public key only</text><rect x="536" y="150" width="148" height="52" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="610" y="173.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">/second-brain</text><text x="610" y="195.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">text only, no form</text><line x1="145" y1="136" x2="145" y2="150" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="254" y1="176" x2="318" y2="155" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="470" y1="140" x2="534" y2="110" stroke="#4b7d33" stroke-width="1.6" marker-end="url(#ah-4b7d33)"/><line x1="610" y1="136" x2="610" y2="148" stroke="#4b7d33" stroke-width="1.6" marker-end="url(#ah-4b7d33)"/><text x="360" y="290" font-size="11" font-weight="400" fill="#7a6d57" text-anchor="middle">No API route accepts data, so there is nothing to attack on the site side but the files.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>page states</title><desc>The five states the Second brain page can be in. Off: SECOND_BRAIN_ENABLED is false, the page is a 404 and the nav link is hidden. Not configured: no base URL or public key, the page says not set up yet. Paused: the signed status says enabled false, the page shows the note. Unavailable: the status did not verify, or no list did. OK: verified lists are shown, with a notice if they are older than 7 days.</desc><defs></defs><rect width="720" height="230" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Every outcome has a state, and only one shows data</text><rect x="20" y="70" width="126" height="70" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="83" y="102.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">off</text><text x="83" y="124.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">env says false: 404</text><rect x="158" y="70" width="126" height="70" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="221" y="102.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">not configured</text><text x="221" y="124.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">no URL or key</text><rect x="296" y="70" width="126" height="70" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="359" y="102.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">paused</text><text x="359" y="124.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">signed status off</text><rect x="434" y="70" width="126" height="70" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="497" y="102.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">unavailable</text><text x="497" y="124.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">nothing verified</text><rect x="572" y="70" width="126" height="70" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="635" y="102.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">ok</text><text x="635" y="124.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">verified lists</text><text x="20" y="172" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Only ok renders items, and an ok older than 7 days carries a notice; older than 30 days is rejected outright.</text></svg>

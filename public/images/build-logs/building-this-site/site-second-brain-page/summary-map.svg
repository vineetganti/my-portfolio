<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 225" width="720" height="225" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>summary map</title><desc>A map of the Second brain page post. Boundary: no write path, the private key stays local. Verify: signature on raw bytes first, then validation. Fail safe: a previous copy, closed failure, five explicit states. Operate: verified upload, a kill switch and a rollback ladder.</desc><defs></defs><rect width="720" height="225" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">The Second brain page</text><rect x="20" y="50" width="162" height="105" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="101" y="86.08" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Boundary</text><text x="101" y="107.72" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">no write path</text><text x="101" y="121.58" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">public key only</text><text x="101" y="135.44" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">token stays local</text><rect x="192" y="50" width="162" height="105" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="273" y="86.08" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Verify</text><text x="273" y="107.72" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Ed25519 on bytes</text><text x="273" y="121.58" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">then parse</text><text x="273" y="135.44" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">then validate</text><rect x="364" y="50" width="162" height="105" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="445" y="86.08" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Fail safe</text><text x="445" y="107.72" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">previous/ copy</text><text x="445" y="121.58" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">fail closed</text><text x="445" y="135.44" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">five states</text><rect x="536" y="50" width="162" height="105" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="617" y="86.08" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Operate</text><text x="617" y="107.72" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">verified upload</text><text x="617" y="121.58" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">signed kill switch</text><text x="617" y="135.44" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">rollback ladder</text><text x="20" y="185" font-size="12" font-weight="700" fill="#5e5241" text-anchor="start">The page can be wrong only if the owner's own key signs something wrong.</text></svg>

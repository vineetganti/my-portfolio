<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>url space</title><desc>The blog's URL space. /blog lists everything. /blog/[slug] is one segment deep and is a post. /blog/topic/[section] and /blog/series/[series] are two segments deep, so they can never collide with a post slug. Each dynamic route lists its pages with generateStaticParams, so every one is prerendered.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="280" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Depth keeps the routes apart</text><rect x="20" y="112" width="110" height="50" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="75" y="134.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">/blog</text><text x="75" y="156.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">every post</text><rect x="200" y="46" width="210" height="50" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="305" y="68.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">/blog/[slug]</text><text x="305" y="90.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">one segment: a post</text><rect x="200" y="112" width="210" height="50" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="305" y="134.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">/blog/topic/[section]</text><text x="305" y="156.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">two segments: a shelf</text><rect x="200" y="178" width="210" height="50" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="305" y="200.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">/blog/series/[series]</text><text x="305" y="222.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">two segments: an order</text><line x1="130" y1="126" x2="198" y2="71" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="130" y1="137" x2="200" y2="137" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="130" y1="148" x2="198" y2="203" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="440" y="60" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">generateStaticParams lists every slug,</text><text x="440" y="75.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">section and series with posts, so each page</text><text x="440" y="91.05" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">is built as HTML ahead of time.</text><text x="440" y="150" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">A post slug can't be 'topic' or 'series'</text><text x="440" y="165.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">and shadow a shelf, because a slug is a</text><text x="440" y="181.05" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">single segment.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>three layers</title><desc>Three ways to label a post. A section is the shelf it sits on, one per post, from a short fixed list: AI and LLMs, Systems, Data Engineering, Build Logs, Essays. A series is an optional reading order with a part number. Tags are free-form detail. One post carries all three, for example section build-logs, series building-this-site part 2, and a few tags.</desc><defs></defs><rect width="720" height="330" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Section, series and tag do three different jobs</text><rect x="20" y="50" width="216" height="46" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="128" y="70.62" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Section</text><text x="128" y="92.75" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">which shelf?</text><rect x="32" y="106" width="192" height="24" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="128" y="121.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">AI &amp; LLMs</text><rect x="32" y="136" width="192" height="24" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="128" y="151.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">Systems</text><rect x="32" y="166" width="192" height="24" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="128" y="181.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">Data Engineering</text><rect x="32" y="196" width="192" height="24" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="128" y="211.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">Build Logs</text><rect x="32" y="226" width="192" height="24" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="128" y="241.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">Essays</text><text x="128" y="268" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">one per post, fixed list</text><rect x="252" y="50" width="216" height="46" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="360" y="70.62" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Series</text><text x="360" y="92.75" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">what order?</text><rect x="264" y="106" width="192" height="24" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="121.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">LLM Architectures</text><rect x="264" y="136" width="192" height="24" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="151.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">Agentic AI</text><rect x="264" y="166" width="192" height="24" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="181.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">Database Engineering</text><rect x="264" y="196" width="192" height="24" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="211.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">Building this site</text><text x="360" y="268" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">optional, Part N of M</text><rect x="484" y="50" width="216" height="46" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="592" y="70.62" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Tag</text><text x="592" y="92.75" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">what about?</text><rect x="496" y="106" width="192" height="24" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="592" y="121.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">Next.js</text><rect x="496" y="136" width="192" height="24" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="592" y="151.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">MDX</text><rect x="496" y="166" width="192" height="24" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="592" y="181.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">PGlite</text><rect x="496" y="196" width="192" height="24" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="592" y="211.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">anything</text><text x="592" y="268" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">free-form, any number</text><rect x="20" y="282" width="680" height="34" rx="8" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="304" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">One post: section build-logs, series building-this-site (part 2), tags Next.js, MDX</text></svg>

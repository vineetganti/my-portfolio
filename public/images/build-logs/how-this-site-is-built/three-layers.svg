<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 312" width="720" height="312" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Section, series and tag</title><desc>Three layers. A section is the shelf a post sits on, with four today. A series is a reading order with Part N of M and previous and next links. A tag is free-form detail. One post carries all three, for example How agents talk: section ai-llms, series agentic-ai part 5, tags MCP and Strands.</desc><defs></defs><rect width="720" height="312" fill="#ffffff"/><rect x="10" y="10" width="226" height="196" rx="14" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="123" y="34" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">Section</text><text x="123" y="51" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">which shelf?</text><rect x="26" y="58" width="194" height="24" rx="7" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="123" y="74.14" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">AI &amp; LLMs</text><rect x="26" y="88" width="194" height="24" rx="7" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><text x="123" y="104.14" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">Systems &amp; Engineering</text><rect x="26" y="118" width="194" height="24" rx="7" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="123" y="134.14" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">Build Logs</text><rect x="26" y="148" width="194" height="24" rx="7" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><text x="123" y="164.14" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">Essays &amp; Ideas</text><text x="123" y="190" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">one per post · set in sections.ts</text><rect x="251" y="10" width="226" height="196" rx="14" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="364" y="34" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">Series</text><text x="364" y="51" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">what order?</text><rect x="267" y="58" width="194" height="24" rx="7" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="364" y="74.14" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">LLM Architectures</text><rect x="267" y="88" width="194" height="24" rx="7" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><text x="364" y="104.14" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">Agentic AI</text><rect x="267" y="118" width="194" height="24" rx="7" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="364" y="134.14" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">MIT Distributed Systems</text><text x="364" y="190" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">optional · Part N of M + prev/next</text><rect x="492" y="10" width="226" height="196" rx="14" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="605" y="34" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">Tag</text><text x="605" y="51" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">what about?</text><rect x="508" y="58" width="194" height="24" rx="7" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="605" y="74.14" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">MCP</text><rect x="508" y="88" width="194" height="24" rx="7" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><text x="605" y="104.14" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">Strands</text><rect x="508" y="118" width="194" height="24" rx="7" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" width="720" height="392" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>How the audio player works</title><desc>Top: the rendered post is turned into chunks by collectChunks, which reads the text and each image's alt text, skips code, tables and details with a spoken note, cleans symbols and splits long text into pieces of at most 180 characters. Middle: speak(i) creates an utterance with the chosen voice and rate; when it ends, speak(i+1) runs, guarded by a generation counter. Bottom: each step also highlights the block, updates the progress state and saves speed and voice to localStorage.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b5f4d"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a00"/></marker></defs><rect width="720" height="392" fill="#ffffff"/><text x="14" y="28" font-size="12.5" font-weight="700" fill="#8a5a00" text-anchor="start">1. Prepare (once, when you press Listen)</text><rect x="14" y="40" width="170" height="78" rx="10" fill="#ffffff" stroke="#6b5f4d" stroke-width="1.5"/><text x="99" y="69.1" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">#post-content</text><text x="99" y="84.6" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">the rendered article</text><text x="99" y="98.25" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">headings, p, li, pre…</text><rect x="224" y="40" width="250" height="78" rx="10" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.5"/><text x="349" y="62.425" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">collectChunks()</text><text x="349" y="78.545" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">read text + image alt text</text><text x="349" y="92.195" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">skip code, table, details (with a note)</text><text x="349" y="105.845" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">clean symbols · split ≤ 180 chars</text><rect x="514" y="40" width="192" height="78" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="610" y="69.25" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">chunks[ ]</text><text x="610" y="85.37" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">text · element · item</text><text x="610" y="99.02" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">264 for a 39-minute post</text><line x1="186" y1="79" x2="222" y2="79" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><line x1="476" y1="79" x2="512" y2="79" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><text x="14" y="154" font-size="12.5" font-weight="700" fill="#8a5a00" text-anchor="start">2. Speak, one chunk at a time</text><rect x="14" y="166" width="150" height="66" rx="10" fill="#f6ecd6" stroke="#8a5a00" stroke-width="1.5"/><text x="89" y="189.25" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">speak(i)</text><text x="89" y="205.37" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">gen = ++generation</text><text x="89" y="219.02" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">cancel if busy</text><rect x="204" y="166" width="230" height="66" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="319" y="189.1" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">SpeechSynthesisUtterance</text><text x="319" y="204.6" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">text, voice, rate</text><text x="319" y="218.25" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">browser reads it aloud</text><rect x="474" y="166" width="232" height="66" rx="10" fill="#e6ecd5" stroke="#6b5f4d" stroke-width="1.5"/><text x="590" y="189.25" font-size="13" font-weight="700" fill="#3a3226" text-anchor="middle">onend</text><text x="590" y="205.37" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">if gen is still current:</text><text x="590" y="219.02" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">speak(i + 1)</text><line x1="166" y1="199" x2="202" y2="199" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><line x1="436" y1="199" x2="472" y2="199" stroke="#6b5f4d" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><path d="M 590 234 L 590 256 L 89 256 L 89 236" fill="none" stroke="#8a5a00" stroke-width="1.6" marker-end="url(#ah-8a5a00)" stroke-linejoin="round" stroke-linecap="round"/><text x="340" y="250" font-size="10.5" font-weight="400" fill="#8a5a00" text-anchor="middle" font-style="italic">next chunk</text><text x="14" y="290" font-size="11.5" font-weight="400" fill="#6b5f4d" text-anchor="start" font-style="italic">Pause cancels the utterance and bumps the generation, so a late onend is ignored.</text><text x="14" y="322" font-size="12.5" font-weight="700" fill="#8a5a00" text-anchor="start">3. Along the way</text><rect x="14" y="332" width="220" height="48" rx="10" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="124" y="352.925" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">highlight</text><text x="124" y="368.425" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">tts-active on the block</text><rect x="250" y="332" width="220" height="48" rx="10" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="360" y="352.925" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">progress</text><text x="360" y="368.425" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">part N of M, time left</text><rect x="486" y="332" width="220" height="48" rx="10" fill="#fffdf8" stroke="#6b5f4d" stroke-width="1.5"/><text x="596" y="352.925" font-size="12.5" font-weight="700" fill="#3a3226" text-anchor="middle">preferences</text><text x="596" y="368.425" font-size="10.5" font-weight="400" fill="#6b5f4d" text-anchor="middle">speed + voice in localStorage</text></svg>

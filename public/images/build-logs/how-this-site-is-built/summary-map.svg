<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 302" width="720" height="302" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>At a glance: what changed and how the site works</title><desc>A map in four columns. Sections and series: three layers, a config file, new routes, Part N of M. The move: renamed slugs, permanent redirects, images by section, a check script. Audio: the Web Speech API, prose plus diagram descriptions, a generation counter, phone fixes, tested with a stub. The site: an MDX pipeline, tokens and Tailwind, static pages and a scrollspy table of contents.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d36"/></marker></defs><rect width="720" height="302" fill="#ffffff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#2c361c" text-anchor="start">At a glance: what changed and how the site works</text><rect x="10" y="44" width="161.5" height="192" rx="14" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="90.75" y="71" font-size="13.5" font-weight="700" fill="#2c361c" text-anchor="middle">Sections + series</text><rect x="20" y="88" width="141.5" height="28" rx="8" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.1"/><text x="90.75" y="106.5" font-size="11" font-weight="400" fill="#2c361c" text-anchor="middle">section, series, tags</text><rect x="20" y="124" width="141.5" height="28" rx="8" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.1"/><text x="90.75" y="142.5" font-size="11" font-weight="400" fill="#2c361c" text-anchor="middle">sections.ts config</text><rect x="20" y="160" width="141.5" height="28" rx="8" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.1"/><text x="90.75" y="178.5" font-size="11" font-weight="400" fill="#2c361c" text-anchor="middle">topic + series routes</text><rect x="20" y="196" width="141.5" height="28" rx="8" fill="#
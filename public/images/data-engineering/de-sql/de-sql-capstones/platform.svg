<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>The six capstones as one platform</title><desc>Raw feeds and change streams on the left. Q87 loads conformed dimensions before facts. Q88 keeps dimension history with a two-question SCD2 loader. Q89 loads facts incrementally: a frozen window, a merge on the grain, touched-day recomputes, a reconciliation, and the watermark moved last. Q90 turns change streams into a temporal history queried with a half-open window. Q91's quality framework gates every publish. Q92 builds the executive mart from per-week models joined at one grain.</desc><defs><marker id="ah-cap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="330" fill="#fffdf8"/><rect x="12" y="30" width="120" height="70" rx="12" fill="#f3eadb" stroke="#5e5241" stroke-width="1.3"/><text x="72" y="58" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">raw feeds</text><text x="72" y="78" font-size="10.5" fill="#5e5241" text-anchor="middle">files, snapshots</text><rect x="12" y="150" width="120" height="70" rx="12" fill="#f3eadb" stroke="#5e5241" stroke-width="1.3"/><text x="72" y="178" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">change streams</text><text x="72" y="198" font-size="10.5" fill="#5e5241" text-anchor="middle">I / U / D</text><rect x="164" y="18" width="170" height="94" rx="12" fill="#faf3e3" stroke="#5e5241" stroke-width="1.4"/><text x="249" y="42" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Q87 · load order</text><text x="249" y="62" font-size="10.5" fill="#2f281e" text-anchor="middle">dims → Unknown →</text><text x="249" y="78" font-size="10.5" fill="#2f281e" text-anchor="middle">facts → snapshots</text><text x="249" y="98" font-size="10.5" fill="#5e5241" text-anchor="middle">grain proof at the end</text><rect x="164" y="130" width="170" height="94" rx="12" fill="#faf3e3" stroke="#5e5241" stroke-width="1.4"/><text x="249" y="154" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Q88 · SCD2 loader</text><text x="249" y="174" font-size="10.5" fill="#2f281e" text-anchor="middle">close what isn't exact</text><text x="249" y="190" font-size="10.5" fill="#2f281e" text-anchor="middle">open what has no current</text><text x="249" y="210" font-size="10.5" fill="#5e5241" text-anchor="middle">full snapshots only</text><rect x="164" y="242" width="170" height="74" rx="12" fill="#faf3e3" stroke="#5e5241" stroke-width="1.4"/><text x="249" y="266" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Q90 · temporal history</text><text x="249" y="286" font-size="10.5" fill="#2f281e" text-anchor="middle">from every change</text><text x="249" y="302" font-size="10.5" fill="#2f281e" text-anchor="middle">valid_from &lt;= T &lt; valid_to</text><rect x="366" y="18" width="190" height="206" rx="12" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="461" y="42" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Q89 · incremental facts</text><text x="461" y="68" font-size="10.5" fill="#2f281e" text-anchor="middle">1 freeze (lower, upper]</text><text x="461" y="90" font-size="10.5" fill="#2f281e" text-anchor="middle">2 MERGE on the grain</text><text x="461" y="112" font-size="10.5" fill="#2f281e" text-anchor="middle">3 recompute touched days</text><text x="461" y="134" font-size="10.5" fill="#2f281e" text-anchor="middle">4 reconcile with source</text><text x="461" y="156" font-size="10.5" fill="#2f281e" text-anchor="middle">5 move the watermark</text><text x="461" y="172" font-size="10.5" fill="#2f281e" text-anchor="middle">only if 4 passed</text><text x="461" y="200" font-size="10.5" fill="#9a5400" text-anchor="middle">every step idempotent</text><rect x="366" y="242" width="190" height="74" rx="12" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="461" y="266" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Q91 · quality gate</text><text x="461" y="286" font-size="10.5" fill="#2f281e" text-anchor="middle">config + templates</text><text x="461" y="302" font-size="10.5" fill="#2f281e" text-anchor="middle">publish if BOOL_AND(passed)</text><rect x="588" y="100" width="120" height="124" rx="12" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="648" y="126" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Q92 · mart</text><text x="648" y="150" font-size="10.5" fill="#2f281e" text-anchor="middle">per-week models</text><text x="648" y="168" font-size="10.5" fill="#2f281e" text-anchor="middle">joined at one</text><text x="648" y="184" font-size="10.5" fill="#2f281e" text-anchor="middle">grain</text><path d="M132 65 L162 65" fill="none" stroke="#5e5241" stroke-width="1.4" marker-end="url(#ah-cap)"/><path d="M132 185 L162 177" fill="none" stroke="#5e5241" stroke-width="1.4" marker-end="url(#ah-cap)"/><path d="M132 200 L162 265" fill="none" stroke="#5e5241" stroke-width="1.4" marker-end="url(#ah-cap)"/><path d="M334 65 L364 65" fill="none" stroke="#5e5241" stroke-width="1.4" marker-end="url(#ah-cap)"/><path d="M334 177 L364 177" fill="none" stroke="#5e5241" stroke-width="1.4" marker-end="url(#ah-cap)"/><path d="M556 162 L586 162" fill="none" stroke="#5e5241" stroke-width="1.4" marker-end="url(#ah-cap)"/><path d="M461 242 L461 226" fill="none" stroke="#7a6d57" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ah-cap)"/><path d="M556 279 L648 226" fill="none" stroke="#7a6d57" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ah-cap)"/></svg>

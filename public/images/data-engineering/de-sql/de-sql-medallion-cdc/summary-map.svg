<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Post 03 at a glance: medallion layers and CDC</title><desc>Four columns. Bronze: everything as text, lineage columns, append-only, duplicates kept. Silver: dedup by change identity, order by log position, MERGE with soft deletes, history from every change. Gold: recompute from the earliest affected day, running sums over full history, a day spine, aggregate before joining. Quality: COALESCE the contract, checksums before diffs, lineage hashes, a refresh with five guards.</desc><rect width="720" height="240" fill="#fffdf8"/><text x="20" y="28" font-size="14" font-weight="700" fill="#2f281e">Post 03 at a glance: medallion layers and CDC</text><rect x="10" y="44" width="167" height="180" rx="12" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.4"/><text x="93" y="68" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Bronze</text><text x="93" y="94" font-size="10.5" fill="#2f281e" text-anchor="middle">everything as text</text><text x="93" y="114" font-size="10.5" fill="#2f281e" text-anchor="middle">lineage columns</text><text x="93" y="134" font-size="10.5" fill="#2f281e" text-anchor="middle">append-only</text><text x="93" y="154" font-size="10.5" fill="#2f281e" text-anchor="middle">duplicates kept</text><rect x="187" y="44" width="167" height="180" rx="12" fill="#fde3ad" stroke="#9a5400" stroke-width="1.4"/><text x="270" y="68" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Silver</text><text x="270" y="94" font-size="10.5" fill="#2f281e" text-anchor="middle">dedup on (key, seq_no)</text><text x="270" y="114" font-size="10.5" fill="#2f281e" text-anchor="middle">order by log position</text><text x="270" y="134" font-size="10.5" fill="#2f281e" text-anchor="middle">MERGE + soft delete</text><text x="270" y="154" font-size="10.5" fill="#2f281e" text-anchor="middle">history from every</text><text x="270" y="170" font-size="10.5" fill="#2f281e" text-anchor="middle">change</text><rect x="364" y="44" width="167" height="180" rx="12" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><text x="447" y="68" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Gold</text><text x="447" y="94" font-size="10.5" fill="#2f281e" text-anchor="middle">recompute from the</text><text x="447" y="110" font-size="10.5" fill="#2f281e" text-anchor="middle">earliest affected day</text><text x="447" y="130" font-size="10.5" fill="#2f281e" text-anchor="middle">ROWS, not RANGE</text><text x="447" y="150" font-size="10.5" fill="#2f281e" text-anchor="middle">day spine</text><text x="447" y="170" font-size="10.5" fill="#2f281e" text-anchor="middle">aggregate, then join</text><rect x="541" y="44" width="169" height="180" rx="12" fill="#faf3e3" stroke="#5e5241" stroke-width="1.4"/><text x="625" y="68" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Quality</text><text x="625" y="94" font-size="10.5" fill="#2f281e" text-anchor="middle">COALESCE(rule, FALSE)</text><text x="625" y="114" font-size="10.5" fill="#2f281e" text-anchor="middle">checksums, then diff</text><text x="625" y="134" font-size="10.5" fill="#2f281e" text-anchor="middle">lineage hashes</text><text x="625" y="154" font-size="10.5" fill="#2f281e" text-anchor="middle">a refresh with</text><text x="625" y="170" font-size="10.5" fill="#2f281e" text-anchor="middle">five guards</text></svg>

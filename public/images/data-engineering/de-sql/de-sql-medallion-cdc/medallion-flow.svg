<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>NovaBank's medallion pipeline</title><desc>Sources on the left: CSV transaction files and a CDC stream of inserts, updates and deletes. Bronze keeps every delivery as text with lineage columns, append-only. Silver deduplicates by change identity, collapses each batch to the last change per key by log position, applies inserts, updates and soft deletes with MERGE, builds SCD2 history from every change and quarantines rows that break the contract. Gold recomputes daily balances from the earliest affected day and builds a customer 360. Under the layers, a watermark with a frozen upper bound drives each run, and checksums reconcile Silver with the source.</desc><defs><marker id="ah-med" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="360" fill="#fffdf8"/><rect x="12" y="40" width="120" height="70" rx="12" fill="#f3eadb" stroke="#5e5241" stroke-width="1.3"/><text x="72" y="68" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">CSV files</text><text x="72" y="88" font-size="10.5" fill="#5e5241" text-anchor="middle">transactions</text><rect x="12" y="140" width="120" height="70" rx="12" fill="#f3eadb" stroke="#5e5241" stroke-width="1.3"/><text x="72" y="168" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">CDC stream</text><text x="72" y="188" font-size="10.5" fill="#5e5241" text-anchor="middle">I / U / D + seq_no</text><rect x="164" y="30" width="160" height="200" rx="14" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="244" y="56" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Bronze</text><text x="244" y="82" font-size="10.5" fill="#2f281e" text-anchor="middle">everything as text</text><text x="244" y="102" font-size="10.5" fill="#2f281e" text-anchor="middle">_file_name, _ingested_at,</text><text x="244" y="118" font-size="10.5" fill="#2f281e" text-anchor="middle">_batch_id</text><text x="244" y="140" font-size="10.5" fill="#2f281e" text-anchor="middle">duplicates kept</text><text x="244" y="162" font-size="10.5" fill="#9a5400" text-anchor="middle">append-only</text><text x="244" y="180" font-size="10.5" fill="#9a5400" text-anchor="middle">never updated</text><rect x="356" y="30" width="180" height="200" rx="14" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="446" y="56" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Silver</text><text x="446" y="82" font-size="10.5" fill="#2f281e" text-anchor="middle">dedup on (key, seq_no)</text><text x="446" y="102" font-size="10.5" fill="#2f281e" text-anchor="middle">last change by seq_no</text><text x="446" y="122" font-size="10.5" fill="#2f281e" text-anchor="middle">MERGE: upsert, soft delete</text><text x="446" y="142" font-size="10.5" fill="#2f281e" text-anchor="middle">SCD2 from every change</text><text x="446" y="162" font-size="10.5" fill="#2f281e" text-anchor="middle">typed, contract checked</text><text x="446" y="186" font-size="10.5" fill="#b0273f" text-anchor="middle">rejects → quarantine</text><rect x="568" y="30" width="140" height="200" rx="14" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="638" y="56" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Gold</text><text x="638" y="82" font-size="10.5" fill="#2f281e" text-anchor="middle">daily balances,</text><text x="638" y="98" font-size="10.5" fill="#2f281e" text-anchor="middle">recomputed from the</text><text x="638" y="114" font-size="10.5" fill="#2f281e" text-anchor="middle">earliest affected day</text><text x="638" y="140" font-size="10.5" fill="#2f281e" text-anchor="middle">customer 360,</text><text x="638" y="156" font-size="10.5" fill="#2f281e" text-anchor="middle">aggregated before</text><text x="638" y="172" font-size="10.5" fill="#2f281e" text-anchor="middle">joining</text><path d="M132 75 L162 95" fill="none" stroke="#5e5241" stroke-width="1.5" marker-end="url(#ah-med)"/><path d="M132 175 L162 155" fill="none" stroke="#5e5241" stroke-width="1.5" marker-end="url(#ah-med)"/><path d="M324 130 L354 130" fill="none" stroke="#5e5241" stroke-width="1.5" marker-end="url(#ah-med)"/><path d="M536 130 L566 130" fill="none" stroke="#5e5241" stroke-width="1.5" marker-end="url(#ah-med)"/><rect x="164" y="262" width="372" height="74" rx="12" fill="#faf3e3" stroke="#5e5241" stroke-width="1.3"/><text x="350" y="286" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">every run: a watermark window (lower, upper]</text><text x="350" y="306" font-size="10.5" fill="#2f281e" text-anchor="middle">freeze upper first · load by _ingested_at · advance with COALESCE</text><text x="350" y="324" font-size="10.5" fill="#2f281e" text-anchor="middle">touched days → which Gold days to recompute</text><rect x="568" y="262" width="140" height="74" rx="12" fill="#faf3e3" stroke="#5e5241" stroke-width="1.3"/><text x="638" y="288" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">reconcile</text><text x="638" y="308" font-size="10.5" fill="#2f281e" text-anchor="middle">COUNT + SUM(hash)</text><text x="638" y="324" font-size="10.5" fill="#2f281e" text-anchor="middle">then a row diff</text><path d="M350 262 L350 232" fill="none" stroke="#7a6d57" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ah-med)"/><path d="M638 262 L638 232" fill="none" stroke="#7a6d57" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ah-med)"/></svg>

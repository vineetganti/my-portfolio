<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Post 04 at a glance: product analytics</title><desc>Four columns. Events in: flatten JSON once, measure duplication. Sessions and funnels: a running sum of session starts, steps found in order, LEAD with an exit. Users over time: cohorts, a 28-day window, a spine for rolling distinct counts, a full-frame LAST_VALUE, a user-month grid for MRR and churn, percentiles that skip NULLs. Incremental: an insert-only MERGE for cross-batch duplicates, touched dates, first day over all history.</desc><rect width="720" height="240" fill="#fffdf8"/><text x="20" y="28" font-size="14" font-weight="700" fill="#2f281e">Post 04 at a glance: product analytics</text><rect x="10" y="44" width="167" height="180" rx="12" fill="#faf3e3" stroke="#5e5241" stroke-width="1.4"/><text x="93" y="68" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Events in</text><text x="93" y="94" font-size="10.5" fill="#2f281e" text-anchor="middle">flatten JSON once</text><text x="93" y="114" font-size="10.5" fill="#2f281e" text-anchor="middle">arrays change grain</text><text x="93" y="134" font-size="10.5" fill="#2f281e" text-anchor="middle">measure duplication</text><rect x="187" y="44" width="167" height="180" rx="12" fill="#fde3ad" stroke="#9a5400" stroke-width="1.4"/><text x="270" y="68" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Sessions, funnels</text><text x="270" y="94" font-size="10.5" fill="#2f281e" text-anchor="middle">running sum of starts</text><text x="270" y="114" font-size="10.5" fill="#2f281e" text-anchor="middle">steps found in order</text><text x="270" y="134" font-size="10.5" fill="#2f281e" text-anchor="middle">LEAD with (exit)</text><rect x="364" y="44" width="167" height="180" rx="12" fill="#faf3e3" stroke="#5e5241" stroke-width="1.4"/><text x="447" y="68" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Users over time</text><text x="447" y="94" font-size="10.5" fill="#2f281e" text-anchor="middle">cohort triangle</text><text x="447" y="114" font-size="10.5" fill="#2f281e" text-anchor="middle">spine for rolling distinct</text><text x="447" y="134" font-size="10.5" fill="#2f281e" text-anchor="middle">full-frame LAST_VALUE</text><text x="447" y="154" font-size="10.5" fill="#2f281e" text-anchor="middle">user × month grid</text><text x="447" y="174" font-size="10.5" fill="#2f281e" text-anchor="middle">percentiles skip NULL</text><rect x="541" y="44" width="169" height="180" rx="12" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><text x="625" y="68" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Incremental</text><text x="625" y="94" font-size="10.5" fill="#2f281e" text-anchor="middle">insert-only MERGE</text><text x="625" y="114" font-size="10.5" fill="#2f281e" text-anchor="middle">touched dates</text><text x="625" y="134" font-size="10.5" fill="#2f281e" text-anchor="middle">first day over</text><text x="625" y="150" font-size="10.5" fill="#2f281e" text-anchor="middle">all history</text></svg>

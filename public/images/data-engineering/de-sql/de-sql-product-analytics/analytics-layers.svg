<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>StreamLoop's analytics layer</title><desc>Raw JSON events are flattened and deduplicated by event_id, then sessionized with a 30-minute gap. Four families of models are built on top: funnels and next-step paths per session; cohorts and retention per signup week; active users and stickiness per day, with a date spine for rolling distinct counts; and revenue movement and churn per user-month on a zero-filled grid. An incremental mart with an insert-only MERGE and touched-date recomputes keeps them current.</desc><defs><marker id="ah-pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="340" fill="#fffdf8"/><rect x="12" y="26" width="150" height="80" rx="12" fill="#f3eadb" stroke="#5e5241" stroke-width="1.3"/><text x="87" y="54" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">raw events</text><text x="87" y="74" font-size="10.5" fill="#5e5241" text-anchor="middle">JSON, at-least-once,</text><text x="87" y="90" font-size="10.5" fill="#5e5241" text-anchor="middle">late arrivals</text><rect x="196" y="26" width="160" height="80" rx="12" fill="#fde3ad" stroke="#9a5400" stroke-width="1.4"/><text x="276" y="54" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">typed, deduped</text><text x="276" y="74" font-size="10.5" fill="#2f281e" text-anchor="middle">path + cast + UNNEST</text><text x="276" y="90" font-size="10.5" fill="#2f281e" text-anchor="middle">one row per event_id</text><rect x="390" y="26" width="160" height="80" rx="12" fill="#fde3ad" stroke="#9a5400" stroke-width="1.4"/><text x="470" y="54" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">sessionized</text><text x="470" y="74" font-size="10.5" fill="#2f281e" text-anchor="middle">gap &gt; 30 min → new</text><text x="470" y="90" font-size="10.5" fill="#2f281e" text-anchor="middle">running sum of starts</text><rect x="584" y="26" width="124" height="80" rx="12" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><text x="646" y="54" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">incremental</text><text x="646" y="74" font-size="10.5" fill="#2f281e" text-anchor="middle">insert-only MERGE</text><text x="646" y="90" font-size="10.5" fill="#2f281e" text-anchor="middle">touched dates</text><path d="M162 66 L194 66" fill="none" stroke="#5e5241" stroke-width="1.5" marker-end="url(#ah-pa)"/><path d="M356 66 L388 66" fill="none" stroke="#5e5241" stroke-width="1.5" marker-end="url(#ah-pa)"/><path d="M584 66 L552 66" fill="none" stroke="#7a6d57" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ah-pa)"/><rect x="12" y="160" width="166" height="150" rx="12" fill="#faf3e3" stroke="#5e5241" stroke-width="1.3"/><text x="95" y="186" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">funnels and paths</text><text x="95" y="210" font-size="10.5" fill="#2f281e" text-anchor="middle">steps found in order</text><text x="95" y="228" font-size="10.5" fill="#2f281e" text-anchor="middle">24-hour window</text><text x="95" y="246" font-size="10.5" fill="#2f281e" text-anchor="middle">LEAD, with (exit)</text><text x="95" y="264" font-size="10.5" fill="#2f281e" text-anchor="middle">bounce rate</text><rect x="190" y="160" width="166" height="150" rx="12" fill="#faf3e3" stroke="#5e5241" stroke-width="1.3"/><text x="273" y="186" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">cohorts</text><text x="273" y="210" font-size="10.5" fill="#2f281e" text-anchor="middle">signup week × week no.</text><text x="273" y="228" font-size="10.5" fill="#2f281e" text-anchor="middle">retention triangle</text><text x="273" y="246" font-size="10.5" fill="#2f281e" text-anchor="middle">percentiles skip NULL</text><rect x="368" y="160" width="166" height="150" rx="12" fill="#faf3e3" stroke="#5e5241" stroke-width="1.3"/><text x="451" y="186" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">active users</text><text x="451" y="210" font-size="10.5" fill="#2f281e" text-anchor="middle">DAU, 28-day MAU</text><text x="451" y="228" font-size="10.5" fill="#2f281e" text-anchor="middle">spine join for rolling</text><text x="451" y="244" font-size="10.5" fill="#2f281e" text-anchor="middle">distinct counts</text><text x="451" y="262" font-size="10.5" fill="#2f281e" text-anchor="middle">new vs returning</text><rect x="546" y="160" width="162" height="150" rx="12" fill="#faf3e3" stroke="#5e5241" stroke-width="1.3"/><text x="627" y="186" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">revenue and churn</text><text x="627" y="210" font-size="10.5" fill="#2f281e" text-anchor="middle">user × month grid</text><text x="627" y="228" font-size="10.5" fill="#2f281e" text-anchor="middle">new, expansion,</text><text x="627" y="244" font-size="10.5" fill="#2f281e" text-anchor="middle">contraction, churn</text><text x="627" y="262" font-size="10.5" fill="#2f281e" text-anchor="middle">reactivation labels</text><path d="M470 106 L95 158" fill="none" stroke="#5e5241" stroke-width="1.3" marker-end="url(#ah-pa)"/><path d="M276 106 L273 158" fill="none" stroke="#5e5241" stroke-width="1.3" marker-end="url(#ah-pa)"/><path d="M300 106 L451 158" fill="none" stroke="#5e5241" stroke-width="1.3" marker-end="url(#ah-pa)"/><path d="M330 106 L627 158" fill="none" stroke="#5e5241" stroke-width="1.3" marker-end="url(#ah-pa)"/></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Four time patterns from this post</title><desc>Four rows on a shared timeline. Interval merge: three overlapping and touching spans collapse into one continuous period, using a running maximum of earlier end dates. State intervals: repeated RUN, IDLE and RUN readings compress into three states, each ending where the next begins rather than at its last reading. Sweep line: trips become plus one at start and minus one at end, with a zero marker at each hour, and the running sum is the number in progress. As-of join: each trade is matched to the latest quote at or before it.</desc><rect width="720" height="400" fill="#fffdf8"/><text x="20" y="30" font-size="13" font-weight="700" fill="#2f281e">1 · Interval merge</text><text x="20" y="48" font-size="10.5" fill="#5e5241">running MAX(end) of earlier spans</text><rect x="240" y="20" width="200" height="12" rx="4" fill="#fde3ad" stroke="#9a5400" stroke-width="1"/><rect x="290" y="36" width="60" height="12" rx="4" fill="#fde3ad" stroke="#9a5400" stroke-width="1"/><rect x="440" y="20" width="110" height="12" rx="4" fill="#fde3ad" stroke="#9a5400" stroke-width="1"/><rect x="600" y="20" width="90" height="12" rx="4" fill="#fde3ad" stroke="#9a5400" stroke-width="1"/><rect x="240" y="56" width="310" height="12" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><rect x="600" y="56" width="90" height="12" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.2"/><text x="395" y="84" font-size="10" fill="#4b7d33" text-anchor="middle">period 1 (contained and touching spans merged)</text><text x="645" y="84" font-size="10" fill="#4b7d33" text-anchor="middle">period 2</text><line x1="12" y1="102" x2="708" y2="102" stroke="#dccfb1" stroke-width="1"/><text x="20" y="128" font-size="13" font-weight="700" fill="#2f281e">2 · State intervals</text><text x="20" y="146" font-size="10.5" fill="#5e5241">end where the next state starts</text><circle cx="250" cy="126" r="4" fill="#4b7d33"/><circle cx="290" cy="126" r="4" fill="#4b7d33"/><circle cx="330" cy="126" r="4" fill="#4b7d33"/><circle cx="370" cy="126" r="4" fill="#9a5400"/><circle cx="410" cy="126" r="4" fill="#9a5400"/><circle cx="450" cy="126" r="4" fill="#4b7d33"/><circle cx="570" cy="126" r="4" fill="#b0273f"/><rect x="250" y="140" width="120" height="14" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><text x="310" y="151" font-size="9.5" fill="#2f281e" text-anchor="middle">RUN 15 min</text><rect x="370" y="140" width="80" height="14" rx="4" fill="#fde3ad" stroke="#9a5400" stroke-width="1"/><text x="410" y="151" font-size="9.5" fill="#2f281e" text-anchor="middle">IDLE 10</text><rect x="450" y="140" width="120" height="14" rx="4" fill="#dfedcc" stroke="#4b7d33" stroke-width="1"/><text x="510" y="151" font-size="9.5" fill="#2f281e" text-anchor="middle">RUN 15</text><rect x="570" y="140" width="120" height="14" rx="4" fill="#fbd8d1" stroke="#b0273f" stroke-width="1" stroke-dasharray="4 3"/><text x="630" y="151" font-size="9.5" fill="#2f281e" text-anchor="middle">DOWN (open)</text><line x1="12" y1="176" x2="708" y2="176" stroke="#dccfb1" stroke-width="1"/><text x="20" y="202" font-size="13" font-weight="700" fill="#2f281e">3 · Sweep line</text><text x="20" y="220" font-size="10.5" fill="#5e5241">+1 at start, −1 at end, 0 at</text><text x="20" y="235" font-size="10.5" fill="#5e5241">each hour; running sum</text><rect x="250" y="192" width="140" height="10" rx="3" fill="#faf3e3" stroke="#5e5241" stroke-width="1"/><rect x="310" y="206" width="120" height="10" rx="3" fill="#faf3e3" stroke="#5e5241" stroke-width="1"/><rect x="390" y="220" width="120" height="10" rx="3" fill="#faf3e3" stroke="#5e5241" stroke-width="1"/><rect x="450" y="234" width="250" height="10" rx="3" fill="#faf3e3" stroke="#5e5241" stroke-width="1"/><line x1="240" y1="188" x2="240" y2="252" stroke="#9a5400" stroke-width="1.4" stroke-dasharray="3 3"/><line x1="480" y1="188" x2="480" y2="252" stroke="#9a5400" stroke-width="1.4" stroke-dasharray="3 3"/><line x1="680" y1="188" x2="680" y2="252" stroke="#9a5400" stroke-width="1.4" stroke-dasharray="3 3"/><text x="240" y="266" font-size="9.5" fill="#9a5400" text-anchor="middle">08:00</text><text x="480" y="266" font-size="9.5" fill="#9a5400" text-anchor="middle">09:00 → 2</text><text x="680" y="266" font-size="9.5" fill="#9a5400" text-anchor="middle">10:00 → 1</text><line x1="12" y1="282" x2="708" y2="282" stroke="#dccfb1" stroke-width="1"/><text x="20" y="308" font-size="13" font-weight="700" fill="#2f281e">4 · As-of join</text><text x="20" y="326" font-size="10.5" fill="#5e5241">latest quote at or before</text><text x="20" y="341" font-size="10.5" fill="#5e5241">each trade</text><line x1="240" y1="312" x2="700" y2="312" stroke="#5e5241" stroke-width="1"/><text x="230" y="316" font-size="9.5" fill="#5e5241" text-anchor="end">quotes</text><circle cx="270" cy="312" r="5" fill="#9a5400"/><circle cx="420" cy="312" r="5" fill="#9a5400"/><circle cx="520" cy="312" r="5" fill="#9a5400"/><line x1="240" y1="362" x2="700" y2="362" stroke="#5e5241" stroke-width="1"/><text x="230" y="366" font-size="9.5" fill="#5e5241" text-anchor="end">trades</text><circle cx="340" cy="362" r="5" fill="#4b7d33"/><circle cx="420" cy="362" r="5" fill="#4b7d33"/><circle cx="640" cy="362" r="5" fill="#4b7d33"/><path d="M340 356 L272 318" fill="none" stroke="#4b7d33" stroke-width="1.3"/><path d="M420 356 L420 318" fill="none" stroke="#4b7d33" stroke-width="1.3"/><path d="M640 356 L522 318" fill="none" stroke="#4b7d33" stroke-width="1.3"/><text x="470" y="390" font-size="10" fill="#5e5241" text-anchor="middle">an equality join on time would match only the middle trade</text></svg>

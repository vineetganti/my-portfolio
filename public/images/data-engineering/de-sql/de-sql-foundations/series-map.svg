<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" width="720" height="370" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>The Data Engineering SQL series at a glance</title><desc>Post 01 builds the foundations: DDL, constraints, safe casting, MERGE, dedup and NULL logic. Three case studies follow: 02 ShopWave builds a retail dimensional warehouse (grain, SCD 1, 2 and 3, as-of joins, fact loads); 03 NovaBank builds medallion layers with CDC (bronze landing, CDC apply, watermarks, idempotent gold); 04 StreamLoop builds product analytics (sessions, funnels, cohorts, MRR). Then 05 covers hard problems across industries (intervals, as-of joins, sweep lines, survivorship) and 06 assembles whole pipelines as capstones.</desc><defs><marker id="ah-ser" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="370" fill="#fffdf8"/><rect x="190" y="16" width="340" height="62" rx="14" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="360" y="40" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">01 · Foundations</text><text x="360" y="61" font-size="11.5" fill="#2f281e" text-anchor="middle">DDL and constraints · safe casts · MERGE · dedup · NULL logic</text><rect x="12" y="122" width="220" height="112" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="122" y="147" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">02 · ShopWave</text><text x="122" y="165" font-size="11" fill="#5e5241" text-anchor="middle">retail dimensional warehouse</text><text x="122" y="189" font-size="11" fill="#2f281e" text-anchor="middle">grain · surrogate keys</text><text x="122" y="206" font-size="11" fill="#2f281e" text-anchor="middle">SCD 1, 2 and 3 · as-of joins</text><text x="122" y="223" font-size="11" fill="#2f281e" text-anchor="middle">fact loads · quality gates</text><rect x="250" y="122" width="220" height="112" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="147" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">03 · NovaBank</text><text x="360" y="165" font-size="11" fill="#5e5241" text-anchor="middle">medallion layers and CDC</text><text x="360" y="189" font-size="11" fill="#2f281e" text-anchor="middle">bronze landing · CDC apply</text><text x="360" y="206" font-size="11" fill="#2f281e" text-anchor="middle">watermarks · late data</text><text x="360" y="223" font-size="11" fill="#2f281e" text-anchor="middle">idempotent gold · reconciliation</text><rect x="488" y="122" width="220" height="112" rx="14" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="598" y="147" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">04 · StreamLoop</text><text x="598" y="165" font-size="11" fill="#5e5241" text-anchor="middle">SaaS product analytics</text><text x="598" y="189" font-size="11" fill="#2f281e" text-anchor="middle">JSON flattening · sessions</text><text x="598" y="206" font-size="11" fill="#2f281e" text-anchor="middle">funnels · cohorts · retention</text><text x="598" y="223" font-size="11" fill="#2f281e" text-anchor="middle">MRR movement · churn</text><rect x="60" y="282" width="280" height="70" rx="14" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="200" y="309" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">05 · Hard problems across industries</text><text x="200" y="330" font-size="11" fill="#2f281e" text-anchor="middle">intervals · as-of · sweep line · survivorship</text><rect x="380" y="282" width="280" height="70" rx="14" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="520" y="309" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">06 · Capstones</text><text x="520" y="330" font-size="11" fill="#2f281e" text-anchor="middle">whole pipelines, from raw to published</text><path d="M290 78 L150 120" fill="none" stroke="#5e5241" stroke-width="1.5" marker-end="url(#ah-ser)"/><path d="M360 78 L360 120" fill="none" stroke="#5e5241" stroke-width="1.5" marker-end="url(#ah-ser)"/><path d="M430 78 L570 120" fill="none" stroke="#5e5241" stroke-width="1.5" marker-end="url(#ah-ser)"/><path d="M200 234 L200 280" fill="none" stroke="#7a6d57" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ah-ser)"/><path d="M360 234 L300 280" fill="none" stroke="#7a6d57" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ah-ser)"/><path d="M360 234 L440 280" fill="none" stroke="#7a6d57" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ah-ser)"/><path d="M598 234 L560 280" fill="none" stroke="#7a6d57" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#ah-ser)"/></svg>

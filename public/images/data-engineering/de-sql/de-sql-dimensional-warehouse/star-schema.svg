<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>The ShopWave star schema</title><desc>fact_sales sits in the middle at order-line grain, keyed by order_id and line_no, with measures quantity, gross_amount and net_amount. It points by surrogate key to four dimensions: dim_date; dim_customer, an SCD Type 2 dimension with effective_from, effective_to, is_current, row_hash and version; dim_product, with Type 1 corrections, a Type 3 previous_category and inferred members; and dim_store. Every dimension has a -1 Unknown member. Around it are the other facts in this post: fact_returns, fact_inventory_snapshot, fact_order_fulfillment and fact_promotion_coverage, which share the same conformed dimensions.</desc><defs><marker id="ah-star" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="430" fill="#fffdf8"/><rect x="240" y="150" width="240" height="128" rx="14" fill="#fde3ad" stroke="#9a5400" stroke-width="1.6"/><text x="360" y="176" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">fact_sales</text><text x="360" y="195" font-size="11" fill="#9a5400" text-anchor="middle">grain: one row per order line</text><text x="360" y="218" font-size="11" fill="#2f281e" text-anchor="middle">date_sk · customer_sk · product_sk</text><text x="360" y="236" font-size="11" fill="#2f281e" text-anchor="middle">order_id · line_no (degenerate)</text><text x="360" y="254" font-size="11" fill="#2f281e" text-anchor="middle">quantity · gross_amount · net_amount</text><text x="360" y="270" font-size="10" fill="#5e5241" text-anchor="middle">_loaded_at · _batch_id</text><rect x="24" y="24" width="200" height="104" rx="12" fill="#faf3e3" stroke="#5e5241" stroke-width="1.4"/><text x="124" y="48" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">dim_customer</text><text x="124" y="66" font-size="10.5" fill="#9a5400" text-anchor="middle">SCD Type 2</text><text x="124" y="86" font-size="10.5" fill="#2f281e" text-anchor="middle">effective_from · effective_to</text><text x="124" y="102" font-size="10.5" fill="#2f281e" text-anchor="middle">is_current · row_hash · version</text><text x="124" y="119" font-size="10" fill="#5e5241" text-anchor="middle">-1 = Unknown</text><rect x="496" y="24" width="200" height="104" rx="12" fill="#faf3e3" stroke="#5e5241" stroke-width="1.4"/><text x="596" y="48" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">dim_product</text><text x="596" y="66" font-size="10.5" fill="#9a5400" text-anchor="middle">Type 1 fixes · Type 3 previous</text><text x="596" y="86" font-size="10.5" fill="#2f281e" text-anchor="middle">previous_category</text><text x="596" y="102" font-size="10.5" fill="#2f281e" text-anchor="middle">is_inferred placeholders</text><text x="596" y="119" font-size="10" fill="#5e5241" text-anchor="middle">-1 = Unknown</text><rect x="24" y="300" width="200" height="66" rx="12" fill="#faf3e3" stroke="#5e5241" stroke-width="1.4"/><text x="124" y="326" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">dim_date</text><text x="124" y="346" font-size="10.5" fill="#2f281e" text-anchor="middle">a generated spine (post 01)</text><rect x="496" y="300" width="200" height="66" rx="12" fill="#faf3e3" stroke="#5e5241" stroke-width="1.4"/><text x="596" y="326" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">dim_store</text><text x="596" y="346" font-size="10.5" fill="#2f281e" text-anchor="middle">-1 for online orders</text><path d="M260 150 L200 128" fill="none" stroke="#5e5241" stroke-width="1.5" marker-end="url(#ah-star)"/><path d="M460 150 L520 128" fill="none" stroke="#5e5241" stroke-width="1.5" marker-end="url(#ah-star)"/><path d="M260 278 L200 300" fill="none" stroke="#5e5241" stroke-width="1.5" marker-end="url(#ah-star)"/><path d="M460 278 L520 300" fill="none" stroke="#5e5241" stroke-width="1.5" marker-end="url(#ah-star)"/><rect x="236" y="22" width="248" height="106" rx="12" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.2" stroke-dasharray="5 4"/><text x="360" y="44" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">other facts, same dimensions</text><text x="360" y="64" font-size="10.5" fill="#2f281e" text-anchor="middle">fact_returns (return line)</text><text x="360" y="80" font-size="10.5" fill="#2f281e" text-anchor="middle">fact_inventory_snapshot (daily)</text><text x="360" y="96" font-size="10.5" fill="#2f281e" text-anchor="middle">fact_order_fulfillment (per order)</text><text x="360" y="112" font-size="10.5" fill="#2f281e" text-anchor="middle">fact_promotion_coverage (factless)</text><rect x="236" y="300" width="248" height="106" rx="12" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><text x="360" y="324" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">before publishing</text><text x="360" y="344" font-size="10.5" fill="#2f281e" text-anchor="middle">quality gate: grain, rules, orphans</text><text x="360" y="360" font-size="10.5" fill="#2f281e" text-anchor="middle">control totals against the source</text><text x="360" y="376" font-size="10.5" fill="#2f281e" text-anchor="middle">bridge weights for many-to-many</text><text x="360" y="392" font-size="10.5" fill="#2f281e" text-anchor="middle">drill-across on conformed keys</text></svg>

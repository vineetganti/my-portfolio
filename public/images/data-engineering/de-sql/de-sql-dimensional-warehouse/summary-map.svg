<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Post 02 at a glance: a dimensional warehouse</title><desc>Five columns. Model: grain, SCD scaffolding with an Unknown member, clean staging, a NULL-safe hash. History: Type 1 overwrite, Type 2 expire then insert, Type 3 previous value. Load: Unknown routing, point-in-time joins, additivity, a race-free watermark, partition reloads, inferred members. Fact types: factless, bridge with weights, periodic and accumulating snapshots, drill-across. Quality: a pre-publish gate, control totals and top-N with subtotals.</desc><rect width="720" height="260" fill="#fffdf8"/><text x="20" y="28" font-size="14" font-weight="700" fill="#2f281e">Post 02 at a glance: a dimensional warehouse</text><rect x="10" y="44" width="132" height="200" rx="12" fill="#faf3e3" stroke="#5e5241" stroke-width="1.4"/><text x="76" y="68" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Model</text><text x="76" y="94" font-size="10.5" fill="#2f281e" text-anchor="middle">grain first</text><text x="76" y="114" font-size="10.5" fill="#2f281e" text-anchor="middle">SCD2 columns</text><text x="76" y="134" font-size="10.5" fill="#2f281e" text-anchor="middle">-1 Unknown member</text><text x="76" y="154" font-size="10.5" fill="#2f281e" text-anchor="middle">clean, then dedup</text><text x="76" y="174" font-size="10.5" fill="#2f281e" text-anchor="middle">NULL-safe hash</text><rect x="152" y="44" width="132" height="200" rx="12" fill="#faf3e3" stroke="#5e5241" stroke-width="1.4"/><text x="218" y="68" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">History</text><text x="218" y="94" font-size="10.5" fill="#2f281e" text-anchor="middle">Type 1: overwrite</text><text x="218" y="114" font-size="10.5" fill="#2f281e" text-anchor="middle">Type 2: expire,</text><text x="218" y="130" font-size="10.5" fill="#2f281e" text-anchor="middle">then insert</text><text x="218" y="150" font-size="10.5" fill="#2f281e" text-anchor="middle">Type 3: previous</text><text x="218" y="166" font-size="10.5" fill="#2f281e" text-anchor="middle">value only</text><rect x="294" y="44" width="132" height="200" rx="12" fill="#fde3ad" stroke="#9a5400" stroke-width="1.4"/><text x="360" y="68" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Load</text><text x="360" y="94" font-size="10.5" fill="#2f281e" text-anchor="middle">missing key → -1</text><text x="360" y="114" font-size="10.5" fill="#2f281e" text-anchor="middle">as-of joins</text><text x="360" y="134" font-size="10.5" fill="#2f281e" text-anchor="middle">know additivity</text><text x="360" y="154" font-size="10.5" fill="#2f281e" text-anchor="middle">(lower, upper] watermark</text><text x="360" y="174" font-size="10.5" fill="#2f281e" text-anchor="middle">delete + insert a day</text><text x="360" y="194" font-size="10.5" fill="#2f281e" text-anchor="middle">inferred members</text><rect x="436" y="44" width="132" height="200" rx="12" fill="#faf3e3" stroke="#5e5241" stroke-width="1.4"/><text x="502" y="68" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Fact types</text><text x="502" y="94" font-size="10.5" fill="#2f281e" text-anchor="middle">factless</text><text x="502" y="114" font-size="10.5" fill="#2f281e" text-anchor="middle">bridge + weights</text><text x="502" y="134" font-size="10.5" fill="#2f281e" text-anchor="middle">periodic snapshot</text><text x="502" y="154" font-size="10.5" fill="#2f281e" text-anchor="middle">accumulating</text><text x="502" y="174" font-size="10.5" fill="#2f281e" text-anchor="middle">drill-across</text><rect x="578" y="44" width="132" height="200" rx="12" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.4"/><text x="644" y="68" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Quality</text><text x="644" y="94" font-size="10.5" fill="#2f281e" text-anchor="middle">gate must return</text><text x="644" y="110" font-size="10.5" fill="#2f281e" text-anchor="middle">no rows</text><text x="644" y="130" font-size="10.5" fill="#2f281e" text-anchor="middle">sums, not just</text><text x="644" y="146" font-size="10.5" fill="#2f281e" text-anchor="middle">counts</text><text x="644" y="166" font-size="10.5" fill="#2f281e" text-anchor="middle">rank within the</text><text x="644" y="182" font-size="10.5" fill="#2f281e" text-anchor="middle">right partition</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>summary map</title><desc>A map of this post in three columns. Replication: a primary streams its log to standbys, which are read-only. Sync or async: wait for the copy or don't, and each has a measured price. CAP: during a partition choose between stale answers and no answers.</desc><defs></defs><rect width="720" height="260" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">The post on one page</text><rect x="20" y="56" width="220" height="44" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="130" y="82.73" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Replication</text><rect x="20" y="108" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="130" y="128.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">One primary takes writes</text><rect x="20" y="150" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="130" y="170.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">WAL streams to standbys</text><rect x="20" y="192" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="130" y="212.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">Standbys are read-only</text><rect x="250" y="56" width="220" height="44" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="360" y="82.73" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Sync or async</text><rect x="250" y="108" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="128.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">Async: lag, and lost commits</text><rect x="250" y="150" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="170.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">Sync: slower, can hang</text><rect x="250" y="192" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="212.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">Read your writes needs care</text><rect x="480" y="56" width="220" height="44" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="590" y="82.73" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">CAP</text><rect x="480" y="108" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="590" y="128.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">C here means latest data</text><rect x="480" y="150" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="590" y="170.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">P is a network split</text><rect x="480" y="192" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="590" y="212.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">Choose stale or unavailable</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>primary standby</title><desc>Primary and standby replication. All writes go to the primary, which streams its write-ahead log over TCP to the standbys, which replay it. Reads can go to the primary or to any standby.</desc><defs><marker id="ah-9a5400" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a5400"/></marker><marker id="ah-4b7d33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b7d33"/></marker></defs><rect width="720" height="280" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">One primary, read-only copies</text><rect x="20" y="110" width="120" height="60" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="80" y="144.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">application</text><rect x="230" y="110" width="140" height="60" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="300" y="137.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">primary</text><text x="300" y="159.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">takes all writes</text><rect x="520" y="50" width="170" height="60" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="605" y="77.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">standby 1</text><text x="605" y="99.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">read-only, replays WAL</text><rect x="520" y="170" width="170" height="60" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="605" y="197.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">standby 2</text><text x="605" y="219.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">read-only, replays WAL</text><line x1="140" y1="140" x2="230" y2="140" stroke="#9a5400" stroke-width="1.6" marker-end="url(#ah-9a5400)"/><text x="185" y="134" font-size="11" font-weight="700" fill="#9a5400" text-anchor="middle">writes</text><line x1="370" y1="126" x2="518" y2="86" stroke="#4b7d33" stroke-width="1.6" marker-end="url(#ah-4b7d33)"/><text x="430" y="94" font-size="11" font-weight="700" fill="#4b7d33" text-anchor="middle">WAL stream</text><line x1="370" y1="154" x2="518" y2="194" stroke="#4b7d33" stroke-width="1.6" marker-end="url(#ah-4b7d33)"/><text x="430" y="196" font-size="11" font-weight="700" fill="#4b7d33" text-anchor="middle">WAL stream</text><text x="20" y="262" font-size="12" font-weight="700" fill="#5e5241" text-anchor="start">Reads can go to the primary or to any standby.</text></svg>

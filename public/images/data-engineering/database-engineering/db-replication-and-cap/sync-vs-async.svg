<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>sync vs async</title><desc>Two commit timelines. In asynchronous replication the primary replies to the client as soon as its own log is safe, and the standby receives the change later, so a read there can be stale. In synchronous replication the primary waits for the standby before replying, so every commit pays a network round trip.</desc><defs></defs><rect width="720" height="300" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">When does the client get its reply?</text><text x="20" y="78" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">Asynchronous</text><rect x="150" y="62" width="120" height="30" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="210" y="80.67" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">commit locally</text><rect x="280" y="62" width="110" height="30" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="335" y="80.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">reply</text><rect x="480" y="62" width="170" height="30" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="565" y="80.67" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">standby gets it later</text><text x="150" y="110" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Fast, and the standby can lag. If the primary dies now, that commit is gone.</text><text x="20" y="180" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">Synchronous</text><rect x="150" y="164" width="120" height="30" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="210" y="182.67" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">commit locally</text><rect x="280" y="164" width="170" height="30" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="365" y="182.67" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">standby gets it</text><rect x="460" y="164" width="110" height="30" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="515" y="182.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">reply</text><text x="150" y="212" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Every commit pays a round trip. If the standby is unreachable, commits wait.</text></svg>

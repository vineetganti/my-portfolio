<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>cap choices</title><desc>The CAP choices for a primary with replicas during a network partition. Reply right away and the system stays available but stale reads are possible. Wait for the replica and the data stays consistent but writes hang or fail. A single server has no partition to tolerate, so it's both consistent and available until it fails.</desc><defs></defs><rect width="720" height="270" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">When the network splits, pick one</text><rect x="20" y="60" width="216" height="48" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="128" y="88.55" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">AP: stay available</text><text x="24" y="132" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">Keep accepting writes and</text><text x="24" y="148.2" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">answering reads, knowing some</text><text x="24" y="164.4" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">reads are stale.</text><text x="24" y="214" font-size="11" font-weight="700" fill="#5e5241" text-anchor="start">async replication, caches</text><rect x="252" y="60" width="216" height="48" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="360" y="88.55" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">CP: stay consistent</text><text x="256" y="132" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">Refuse or hold writes until the</text><text x="256" y="148.2" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">copies agree, so clients wait or</text><text x="256" y="164.4" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">fail.</text><text x="256" y="214" font-size="11" font-weight="700" fill="#5e5241" text-anchor="start">sync replication</text><rect x="484" y="60" width="216" height="48" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="592" y="88.55" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">CA: no partition</text><text x="488" y="132" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">One machine has no network</text><text x="488" y="148.2" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">between copies to fail, until the</text><text x="488" y="164.4" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">machine itself fails.</text><text x="488" y="214" font-size="11" font-weight="700" fill="#5e5241" text-anchor="start">a single big server</text></svg>

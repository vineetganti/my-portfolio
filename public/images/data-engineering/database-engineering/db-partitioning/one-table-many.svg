<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>one table many</title><desc>A million-row customers table split into five partitions of 200,000 rows each. The parent table holds no data. A query for id 700001 reads the metadata, goes straight to the partition from 600,000 to 800,000, and works with 200,000 rows and that partition's own index.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-4b7d33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b7d33"/></marker></defs><rect width="720" height="280" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">One logical table, five physical ones</text><rect x="20" y="60" width="200" height="54" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="120" y="91.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">WHERE id = 700001</text><rect x="280" y="60" width="170" height="54" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="365" y="84.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">customers</text><text x="365" y="106.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">the parent holds no rows</text><line x1="220" y1="87" x2="280" y2="87" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="250" y="81" font-size="11" font-weight="700" fill="#5e5241" text-anchor="middle">query</text><rect x="20" y="170" width="130" height="54" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="85" y="194.27" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">part 1</text><text x="85" y="215.41" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">1 to 200K</text><line x1="365" y1="114" x2="85" y2="170" stroke="#7a6d57" stroke-width="1" stroke-dasharray="3 4"/><rect x="158" y="170" width="130" height="54" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="223" y="194.27" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">part 2</text><text x="223" y="215.41" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">200K to 400K</text><line x1="365" y1="114" x2="223" y2="170" stroke="#7a6d57" stroke-width="1" stroke-dasharray="3 4"/><rect x="296" y="170" width="130" height="54" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="361" y="194.27" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">part 3</text><text x="361" y="215.41" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">400K to 600K</text><line x1="365" y1="114" x2="361" y2="170" stroke="#7a6d57" stroke-width="1" stroke-dasharray="3 4"/><rect x="434" y="170" width="130" height="54" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="499" y="194.27" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">part 4</text><text x="499" y="215.41" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">600K to 800K</text><line x1="405" y1="114" x2="499" y2="168" stroke="#4b7d33" stroke-width="2" marker-end="url(#ah-4b7d33)"/><rect x="572" y="170" width="130" height="54" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="637" y="194.27" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">part 5</text><text x="637" y="215.41" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">800K to 1M</text><line x1="365" y1="114" x2="637" y2="170" stroke="#7a6d57" stroke-width="1" stroke-dasharray="3 4"/><text x="20" y="252" font-size="11.5" font-weight="700" fill="#5e5241" text-anchor="start">The motto from the course: the quickest way to query a billion rows is not to query a billion rows.</text></svg>

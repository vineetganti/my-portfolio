<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>three kinds</title><desc>Three ways to choose a partition. By range, for example dates or ids. By list, for example a state or a country. By hash, where a hash of the key picks the partition and spreads rows evenly.</desc><defs></defs><rect width="720" height="220" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Three ways to choose a partition</text><rect x="20" y="60" width="216" height="58" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="128" y="86.47" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">By range</text><text x="128" y="109.53" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">2023, 2024, 2025</text><text x="24" y="142" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">Dates and ids. Old ranges can</text><text x="24" y="158.2" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">move to cheap storage.</text><rect x="252" y="60" width="216" height="58" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="360" y="86.47" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">By list</text><text x="360" y="109.53" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">California, Texas, Ohio</text><text x="256" y="142" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">Known discrete values, such as a</text><text x="256" y="158.2" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">region.</text><rect x="484" y="60" width="216" height="58" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="592" y="86.47" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">By hash</text><text x="592" y="109.53" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">hash(key) % 4</text><text x="488" y="142" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">Spreads rows evenly when there's</text><text x="488" y="158.2" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">no natural range.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>horizontal vertical</title><desc>Two ways to split a table. Horizontal partitioning splits by rows, so each piece has the same columns and fewer rows. Vertical partitioning splits by columns, so a large rarely-used blob column moves to its own storage while the small hot columns stay compact.</desc><defs></defs><rect width="720" height="250" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Horizontal or vertical?</text><text x="20" y="60" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start">Horizontal: by rows</text><rect x="20" y="72" width="38" height="20" rx="2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><rect x="60" y="72" width="38" height="20" rx="2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><rect x="100" y="72" width="38" height="20" rx="2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><rect x="140" y="72" width="38" height="20" rx="2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><rect x="20" y="94" width="38" height="20" rx="2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><rect x="60" y="94" width="38" height="20" rx="2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><rect x="100" y="94" width="38" height="20" rx="2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><rect x="140" y="94" width="38" height="20" rx="2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><rect x="20" y="116" width="38" height="20" rx="2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><rect x="60" y="116" width="38" height="20" rx="2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><rect x="100" y="116" width="38" height="20" rx="2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><rect x="140" y="116" width="38" height="20" rx="2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><rect x="20" y="138" width="38" height="20" rx="2" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><rect x="60" y="138" width="38" height="20" rx="2" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><rect x="100" y="138" width="38" height="20" rx="2" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><rect x="140" y="138" width="38" height="20" rx="2" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><rect x="20" y="160" width="38" height="20" rx="2" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><rect x="60" y="160" width="38" height="20" rx="2" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><rect x="100" y="160" width="38" height="20" rx="2" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><rect x="140" y="160" width="38" height="20" rx="2" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><rect x="20" y="182" width="38" height="20" rx="2" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><rect x="60" y="182" width="38" height="20" rx="2" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><rect x="100" y="182" width="38" height="20" rx="2" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><rect x="140" y="182" width="38" height="20" rx="2" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><line x1="20" y1="137" x2="180" y2="137" stroke="#9a5400" stroke-width="2"/><text x="200" y="88" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Same columns, fewer rows</text><text x="200" y="103.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">each. By range, list or</text><text x="200" y="119.05" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">hash. This is what people</text><text x="200" y="134.575" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">usually mean by</text><text x="200" y="150.1" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">partitioning.</text><text x="380" y="60" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start">Vertical: by columns</text><rect x="380" y="72" width="38" height="20" rx="2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><rect x="420" y="72" width="38" height="20" rx="2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><rect x="460" y="72" width="38" height="20" rx="2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><rect x="500" y="72" width="38" height="20" rx="2" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="380" y="94" width="38" height="20" rx="2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><rect x="420" y="94" width="38" height="20" rx="2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><rect x="460" y="94" width="38" height="20" rx="2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><rect x="500" y="94" width="38" height="20" rx="2" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="380" y="116" width="38" height="20" rx="2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><rect x="420" y="116" width="38" height="20" rx="2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><rect x="460" y="116" width="38" height="20" rx="2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><rect x="500" y="116" width="38" height="20" rx="2" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="380" y="138" width="38" height="20" rx="2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><rect x="420" y="138" width="38" height="20" rx="2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><rect x="460" y="138" width="38" height="20" rx="2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><rect x="500" y="138" width="38" height="20" rx="2" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="380" y="160" width="38" height="20" rx="2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><rect x="420" y="160" width="38" height="20" rx="2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><rect x="460" y="160" width="38" height="20" rx="2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><rect x="500" y="160" width="38" height="20" rx="2" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="380" y="182" width="38" height="20" rx="2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><rect x="420" y="182" width="38" height="20" rx="2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><rect x="460" y="182" width="38" height="20" rx="2" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><rect x="500" y="182" width="38" height="20" rx="2" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><line x1="500" y1="70" x2="500" y2="204" stroke="#9a5400" stroke-width="2"/><text x="556" y="88" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">A blob column moves to</text><text x="556" y="103.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">its own storage. The hot</text><text x="556" y="119.05" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">columns stay compact, so</text><text x="556" y="134.575" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">more rows fit in a page.</text></svg>

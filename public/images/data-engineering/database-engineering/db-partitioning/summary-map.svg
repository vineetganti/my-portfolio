<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>summary map</title><desc>A map of this post in three columns. What it is: one logical table split into smaller ones, by range, list or hash, routed by the database. When it helps: pruning, a sequential scan over less data, dropping old data fast. What it costs: queries off the key scan everything, updates can move rows, and more objects to manage.</desc><defs></defs><rect width="720" height="260" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">The post on one page</text><rect x="20" y="56" width="220" height="44" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="130" y="82.73" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">What it is</text><rect x="20" y="108" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="130" y="128.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">Smaller tables behind one name</text><rect x="20" y="150" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="130" y="170.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">Range, list or hash</text><rect x="20" y="192" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="130" y="212.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">The database routes queries</text><rect x="250" y="56" width="220" height="44" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="360" y="82.73" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">When it helps</text><rect x="250" y="108" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="128.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">Pruning skips partitions</text><rect x="250" y="150" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="170.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">Less data to scan</text><rect x="250" y="192" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="212.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">Dropping old data is instant</text><rect x="480" y="56" width="220" height="44" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="590" y="82.73" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">What it costs</text><rect x="480" y="108" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="590" y="128.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">Off-key queries scan all</text><rect x="480" y="150" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="590" y="170.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">Key updates move rows</text><rect x="480" y="192" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="590" y="212.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">More objects to manage</text></svg>

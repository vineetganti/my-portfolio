<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>partition vs shard</title><desc>Partitioning against sharding. Partitions are tables inside one database on one server, so the client sends one query and the database routes it, and joins and transactions still work. Shards are the same table on different servers, so the client or a proxy must pick the server, and joins and transactions across them stop working.</desc><defs></defs><rect width="720" height="280" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Same idea, different boundary</text><text x="20" y="56" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">Partitioning: one server</text><rect x="20" y="66" width="320" height="120" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><rect x="36" y="112" width="88" height="54" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="80" y="143.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">g0035</text><rect x="136" y="112" width="88" height="54" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="180" y="143.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">g3560</text><rect x="236" y="112" width="88" height="54" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="280" y="143.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">g6080</text><text x="180" y="92" font-size="11.5" font-weight="700" fill="#4b7d33" text-anchor="middle">the database routes each query</text><text x="20" y="212" font-size="12" font-weight="400" fill="#5e5241" text-anchor="start">The client doesn't know. Joins and transactions</text><text x="20" y="228.2" font-size="12" font-weight="400" fill="#5e5241" text-anchor="start">still work.</text><text x="380" y="56" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">Sharding: many servers</text><rect x="380" y="112" width="96" height="54" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="428" y="136.09" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">server 1</text><text x="428" y="156.73" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">url_table</text><rect x="492" y="112" width="96" height="54" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="540" y="136.09" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">server 2</text><text x="540" y="156.73" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">url_table</text><rect x="604" y="112" width="96" height="54" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="652" y="136.09" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">server 3</text><text x="652" y="156.73" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">url_table</text><text x="540" y="92" font-size="11.5" font-weight="700" fill="#b0273f" text-anchor="middle">the client must pick one</text><text x="380" y="212" font-size="12" font-weight="400" fill="#5e5241" text-anchor="start">Each server is a separate database. Cross-shard</text><text x="380" y="228.2" font-size="12" font-weight="400" fill="#5e5241" text-anchor="start">joins and transactions are gone.</text></svg>

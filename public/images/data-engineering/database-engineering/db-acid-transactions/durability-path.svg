<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>durability path</title><desc>The path of a commit. The client sends COMMIT to the server, the server writes the change to the write-ahead log file through the operating system cache, and an fsync forces it onto the disk. Only then does the client get its acknowledgement. The table's data pages change in memory and reach the disk later, at a checkpoint. After a crash the log replays what the data files missed.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-4b7d33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b7d33"/></marker></defs><rect width="720" height="300" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">What has to happen before COMMIT returns</text><rect x="20" y="80" width="110" height="60" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="75" y="114.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">client</text><rect x="190" y="80" width="130" height="60" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="255" y="107.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">server</text><text x="255" y="129.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">shared memory</text><rect x="380" y="80" width="130" height="60" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="445" y="107.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">OS page cache</text><text x="445" y="129.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">still only RAM</text><rect x="570" y="80" width="130" height="60" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="635" y="107.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">WAL on disk</text><text x="635" y="129.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">survives power loss</text><rect x="380" y="210" width="130" height="60" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="445" y="237.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">data files</text><text x="445" y="259.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">catch up later</text><line x1="130" y1="110" x2="190" y2="110" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="160" y="104" font-size="11" font-weight="700" fill="#5e5241" text-anchor="middle">COMMIT</text><line x1="320" y1="110" x2="380" y2="110" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="350" y="104" font-size="11" font-weight="700" fill="#5e5241" text-anchor="middle">write</text><line x1="510" y1="110" x2="570" y2="110" stroke="#4b7d33" stroke-width="1.6" marker-end="url(#ah-4b7d33)"/><text x="540" y="104" font-size="11" font-weight="700" fill="#4b7d33" text-anchor="middle">fsync</text><path d="M635 142 L635 170 L255 170 L255 142" fill="none" stroke="#4b7d33" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah-4b7d33)"/><text x="445" y="165" font-size="11" font-weight="700" fill="#4b7d33" text-anchor="middle">durable: safe to reply</text><path d="M255 142 L255 240 L378 240" fill="none" stroke="#5e5241" stroke-width="1.6" stroke-dasharray="2 4" marker-end="url(#ah-5e5241)"/><text x="316" y="234" font-size="11" font-weight="700" fill="#5e5241" text-anchor="middle">checkpoint, later</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>acid map</title><desc>The four ACID properties as four cards. Atomicity: all or nothing, broken by a crash halfway, provided by rollback and the log. Consistency: only valid states, broken by rule violations, provided by constraints you define. Isolation: concurrent transactions don't see each other's work in progress, broken by read phenomena, provided by locks and snapshots. Durability: committed means safe, broken by a crash after commit, provided by the write-ahead log and fsync.</desc><defs></defs><rect width="720" height="280" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Four promises, and what each one protects you from</text><rect x="20" y="62" width="164" height="84" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="102" y="101.64" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Atomicity</text><text x="102" y="125.21" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">All of it or none of it</text><text x="24" y="170" font-size="10.5" font-weight="400" fill="#7a6d57" text-anchor="start">protects against</text><text x="24" y="186" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">a crash halfway through a</text><text x="24" y="201.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">transfer</text><text x="24" y="232" font-size="10.5" font-weight="400" fill="#7a6d57" text-anchor="start">made of</text><text x="24" y="248" font-size="11.5" font-weight="700" fill="#5e5241" text-anchor="start">rollback, the log</text><rect x="192" y="62" width="164" height="84" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="274" y="101.64" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Consistency</text><text x="274" y="125.21" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">Only valid states</text><text x="196" y="170" font-size="10.5" font-weight="400" fill="#7a6d57" text-anchor="start">protects against</text><text x="196" y="186" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">a row that breaks your</text><text x="196" y="201.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">rules</text><text x="196" y="232" font-size="10.5" font-weight="400" fill="#7a6d57" text-anchor="start">made of</text><text x="196" y="248" font-size="11.5" font-weight="700" fill="#5e5241" text-anchor="start">constraints you define</text><rect x="364" y="62" width="164" height="84" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="446" y="94.38" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Isolation</text><text x="446" y="117.95" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">Others' work in progress</text><text x="446" y="132.47" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">stays hidden</text><text x="368" y="170" font-size="10.5" font-weight="400" fill="#7a6d57" text-anchor="start">protects against</text><text x="368" y="186" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">reports that don't add up</text><text x="368" y="232" font-size="10.5" font-weight="400" fill="#7a6d57" text-anchor="start">made of</text><text x="368" y="248" font-size="11.5" font-weight="700" fill="#5e5241" text-anchor="start">snapshots and locks</text><rect x="536" y="62" width="164" height="84" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="618" y="101.64" font-size="14" font-weight="700" fill="#2f281e" text-anchor="middle">Durability</text><text x="618" y="125.21" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">Committed means safe</text><text x="540" y="170" font-size="10.5" font-weight="400" fill="#7a6d57" text-anchor="start">protects against</text><text x="540" y="186" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">a power cut just after</text><text x="540" y="201.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">COMMIT</text><text x="540" y="232" font-size="10.5" font-weight="400" fill="#7a6d57" text-anchor="start">made of</text><text x="540" y="248" font-size="11.5" font-weight="700" fill="#5e5241" text-anchor="start">write-ahead log, fsync</text></svg>

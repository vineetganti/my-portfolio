<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>row versions</title><desc>How Postgres keeps two versions of one row. Version one has xmin 100 and xmax 105, with quantity 2. Version two has xmin 105 and xmax 0, with quantity 7. A transaction whose snapshot was taken before transaction 105 committed sees version one. A transaction that started after sees version two. Nobody copied the table: the old version is simply still there.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-9a5400" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a5400"/></marker></defs><rect width="720" height="270" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">A snapshot isn't a copy: old row versions are still there</text><text x="20" y="44" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Every row version records which transaction made it (xmin) and which ended it (xmax).</text><rect x="250" y="70" width="220" height="60" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="360" y="97.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">version 1: quantity 2</text><text x="360" y="119.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">xmin 100, xmax 105</text><rect x="250" y="170" width="220" height="60" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="360" y="197.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">version 2: quantity 7</text><text x="360" y="219.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">xmin 105, xmax 0 (still live)</text><line x1="360" y1="130" x2="360" y2="170" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="448" y="154" font-size="11" font-weight="700" fill="#5e5241" text-anchor="middle">UPDATE by transaction 105</text><rect x="20" y="70" width="170" height="60" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="105" y="90.52" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">report started early</text><text x="105" y="112.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">105 not committed in its</text><text x="105" y="126.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">snapshot</text><rect x="530" y="170" width="170" height="60" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="615" y="190.51" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">report started later</text><text x="615" y="212.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">105 committed in its</text><text x="615" y="226.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">snapshot</text><line x1="190" y1="100" x2="250" y2="100" stroke="#9a5400" stroke-width="1.6" marker-end="url(#ah-9a5400)"/><text x="220" y="94" font-size="11" font-weight="700" fill="#9a5400" text-anchor="middle">sees</text><line x1="530" y1="200" x2="470" y2="200" stroke="#9a5400" stroke-width="1.6" marker-end="url(#ah-9a5400)"/><text x="500" y="194" font-size="11" font-weight="700" fill="#9a5400" text-anchor="middle">sees</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>snapshots</title><desc>Two timelines of the same report. At read committed each statement takes a fresh snapshot, so the second statement sees a change committed in between. At repeatable read the first statement takes the snapshot and the second reuses it, so the committed change stays invisible until the transaction ends.</desc><defs></defs><rect width="720" height="300" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">When is the snapshot taken?</text><text x="20" y="80" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">Read committed</text><rect x="150" y="62" width="500" height="28" rx="6" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="160" y="80" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">BEGIN</text><text x="640" y="80" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="end">COMMIT</text><rect x="230" y="100" width="120" height="42" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="290" y="118.09" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">statement 1</text><text x="290" y="138.73" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">snapshot A</text><rect x="470" y="100" width="120" height="42" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="530" y="118.09" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">statement 2</text><text x="530" y="138.73" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">fresh snapshot B</text><line x1="290" y1="62" x2="290" y2="100" stroke="#9a5400" stroke-width="1.5"/><line x1="530" y1="62" x2="530" y2="100" stroke="#b0273f" stroke-width="1.5"/><text x="20" y="200" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">Repeatable read</text><rect x="150" y="182" width="500" height="28" rx="6" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="160" y="200" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="start">BEGIN</text><text x="640" y="200" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="end">COMMIT</text><rect x="230" y="220" width="120" height="42" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="290" y="238.09" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">statement 1</text><text x="290" y="258.73" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">snapshot A</text><rect x="470" y="220" width="120" height="42" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="530" y="238.09" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">statement 2</text><text x="530" y="258.73" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">reuses snapshot A</text><line x1="290" y1="182" x2="290" y2="220" stroke="#9a5400" stroke-width="1.5"/><line x1="530" y1="182" x2="530" y2="220" stroke="#4b7d33" stroke-width="1.5"/><rect x="346" y="148" width="128" height="28" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="410" y="166" font-size="10" font-weight="700" fill="#2f281e" text-anchor="middle">another session commits</text><line x1="410" y1="34" x2="410" y2="280" stroke="#7a6d57" stroke-width="1" stroke-dasharray="3 4"/></svg>

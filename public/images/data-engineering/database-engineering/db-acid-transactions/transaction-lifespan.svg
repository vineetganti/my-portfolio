<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>transaction lifespan</title><desc>The life of a transaction. BEGIN opens it, then a SELECT checks the balance and two UPDATEs move 100 from account 1 to account 2. COMMIT makes all of it permanent together. Any error or crash along the way leads to ROLLBACK instead, which leaves the data as if the transaction never ran.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-4b7d33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b7d33"/></marker><marker id="ah-b0273f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b0273f"/></marker></defs><rect width="720" height="270" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">One transaction: send 100 from account 1 to account 2</text><rect x="20" y="70" width="90" height="56" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="65" y="102.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">BEGIN</text><rect x="146" y="70" width="130" height="56" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="211" y="95.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">SELECT</text><text x="211" y="117.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">balance &gt; 100?</text><rect x="312" y="70" width="130" height="56" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="377" y="95.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">UPDATE</text><text x="377" y="117.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">account 1 - 100</text><rect x="478" y="70" width="130" height="56" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="543" y="95.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">UPDATE</text><text x="543" y="117.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">account 2 + 100</text><line x1="110" y1="98" x2="146" y2="98" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="276" y1="98" x2="312" y2="98" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="442" y1="98" x2="478" y2="98" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="478" y="180" width="130" height="56" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="543" y="205.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">COMMIT</text><text x="543" y="227.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">all three stick</text><rect x="146" y="180" width="180" height="56" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="236" y="205.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">ROLLBACK</text><text x="236" y="227.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">as if none of it ran</text><line x1="543" y1="126" x2="543" y2="180" stroke="#4b7d33" stroke-width="1.6" marker-end="url(#ah-4b7d33)"/><text x="581" y="157" font-size="11" font-weight="700" fill="#4b7d33" text-anchor="middle">all worked</text><path d="M211 126 L211 178" fill="none" stroke="#b0273f" stroke-width="1.6" marker-end="url(#ah-b0273f)"/><path d="M377 126 L377 150 L300 150 L300 178" fill="none" stroke="#b0273f" stroke-width="1.6" marker-end="url(#ah-b0273f)"/><text x="388" y="160" font-size="11" font-weight="700" fill="#b0273f" text-anchor="start">any error, or a crash</text></svg>

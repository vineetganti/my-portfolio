<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>summary map</title><desc>A map of this post in four columns. Transactions: begin, commit, rollback; a crash means rollback; one failure aborts the whole transaction. Isolation: four phenomena, four levels, snapshots from row versions, write skew needs serializable or locks. Consistency: rules you declare, and reads that may lag. Durability: the log reaches disk before the reply, and async commit trades safety for speed.</desc><defs></defs><rect width="720" height="280" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">The post on one page</text><rect x="20" y="56" width="164" height="44" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="102" y="82.73" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Transactions</text><rect x="20" y="108" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="102" y="127.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">One unit of work</text><rect x="20" y="148" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="102" y="167.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Crash means rollback</text><rect x="20" y="188" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="102" y="207.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">One failure aborts the rest</text><rect x="192" y="56" width="164" height="44" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="274" y="82.73" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Isolation</text><rect x="192" y="108" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="274" y="127.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Four read phenomena</text><rect x="192" y="148" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="274" y="167.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Levels pick which you allow</text><rect x="192" y="188" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="274" y="207.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Snapshots are row versions</text><rect x="192" y="228" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="274" y="240.27" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Write skew: serializable or</text><text x="274" y="254.13" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">locks</text><rect x="364" y="56" width="164" height="44" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="446" y="82.73" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Consistency</text><rect x="364" y="108" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="446" y="127.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Rules you declare</text><rect x="364" y="148" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="446" y="167.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Constraints enforce them</text><rect x="364" y="188" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="446" y="207.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Reads can lag: see post 9</text><rect x="536" y="56" width="164" height="44" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="618" y="82.73" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Durability</text><rect x="536" y="108" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="618" y="127.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Log first, then reply</text><rect x="536" y="148" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="618" y="167.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">fsync beats the OS cache</text><rect x="536" y="188" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="618" y="200.27" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Async commit trades safety</text><text x="618" y="214.13" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">for speed</text></svg>

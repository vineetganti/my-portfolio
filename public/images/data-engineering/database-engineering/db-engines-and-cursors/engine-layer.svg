<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>engine layer</title><desc>A database management system is layers. Client connections, SQL parsing, planning and replication sit on top. The storage engine underneath handles the low-level job of putting rows on disk and getting them back. MySQL lets you swap that bottom layer, per table.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="280" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">The engine is the bottom layer</text><rect x="180" y="56" width="360" height="44" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="82.2" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">connections, SQL parser, planner, replication</text><line x1="360" y1="100" x2="360" y2="128" stroke="#5e5241" stroke-width="1.6" marker-start="url(#ah-5e5241)" marker-end="url(#ah-5e5241)"/><rect x="180" y="130" width="360" height="50" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="360" y="159.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">storage engine API</text><rect x="80" y="200" width="128" height="44" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="144" y="226.2" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">InnoDB</text><line x1="360" y1="180" x2="144" y2="200" stroke="#7a6d57" stroke-width="1"/><rect x="224" y="200" width="128" height="44" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="288" y="226.2" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">MyISAM</text><line x1="360" y1="180" x2="288" y2="200" stroke="#7a6d57" stroke-width="1"/><rect x="368" y="200" width="128" height="44" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="432" y="226.2" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">RocksDB</text><line x1="360" y1="180" x2="432" y2="200" stroke="#7a6d57" stroke-width="1"/><rect x="512" y="200" width="128" height="44" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="576" y="226.2" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">Memory</text><line x1="360" y1="180" x2="576" y2="200" stroke="#7a6d57" stroke-width="1"/></svg>

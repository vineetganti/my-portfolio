<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>cursor kinds</title><desc>A client-side cursor against a server-side cursor. Client-side: the server runs the query and sends every row, and the client holds them all in memory. Server-side: the server keeps the query open in a transaction and sends a batch when asked, so the client uses little memory, and the server holds state.</desc><defs><marker id="ah-b0273f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b0273f"/></marker><marker id="ah-4b7d33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b7d33"/></marker></defs><rect width="720" height="240" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Who holds the result?</text><rect x="20" y="70" width="110" height="60" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="75" y="90.52" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">client</text><text x="75" y="112.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">all rows in</text><text x="75" y="126.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">memory</text><rect x="240" y="70" width="110" height="60" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="295" y="97.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">server</text><text x="295" y="119.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">query finished</text><line x1="240" y1="100" x2="130" y2="100" stroke="#b0273f" stroke-width="1.6" marker-end="url(#ah-b0273f)"/><text x="185" y="94" font-size="11" font-weight="700" fill="#b0273f" text-anchor="middle">everything</text><rect x="380" y="70" width="110" height="60" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="435" y="97.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">client</text><text x="435" y="119.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">one batch</text><rect x="590" y="70" width="110" height="60" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="645" y="97.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">server</text><text x="645" y="119.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">cursor stays open</text><line x1="490" y1="100" x2="590" y2="100" stroke="#4b7d33" stroke-width="1.6" marker-end="url(#ah-4b7d33)"/><text x="540" y="94" font-size="11" font-weight="700" fill="#4b7d33" text-anchor="middle">FETCH 50</text><text x="20" y="160" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">Simple and stateless. Costs client memory, and the</text><text x="20" y="176.2" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">first row waits for the last.</text><text x="380" y="160" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">Starts fast. Holds a transaction and server state,</text><text x="380" y="176.2" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">so it ties you to one connection.</text><line x1="365" y1="44" x2="365" y2="220" stroke="#7a6d57" stroke-width="1" stroke-dasharray="3 4"/></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>myisam vs innodb</title><desc>How the two MySQL engines find a row. In MyISAM, indexes point straight to a byte offset in a data file, and locks cover the whole table. In InnoDB, the table is stored in the primary key's tree, secondary indexes hold the primary key, and locks cover single rows.</desc><defs><marker id="ah-9a5400" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a5400"/></marker></defs><rect width="720" height="270" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Two engines, one server</text><text x="20" y="56" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start">MyISAM</text><rect x="20" y="70" width="130" height="56" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="85" y="95.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">index</text><text x="85" y="117.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">key → byte offset</text><rect x="210" y="70" width="140" height="56" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="280" y="95.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">.MYD file</text><text x="280" y="117.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">rows in a flat file</text><line x1="150" y1="98" x2="210" y2="98" stroke="#9a5400" stroke-width="1.6" marker-end="url(#ah-9a5400)"/><text x="20" y="156" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">Table locks. No transactions. No crash recovery.</text><text x="20" y="172.2" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">Fast inserts at the end of the file.</text><text x="380" y="56" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start">InnoDB</text><rect x="380" y="70" width="130" height="56" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="445" y="95.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">secondary index</text><text x="445" y="117.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">key → primary key</text><rect x="560" y="70" width="140" height="56" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="630" y="95.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">primary key tree</text><text x="630" y="117.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">rows in the leaves</text><line x1="510" y1="98" x2="560" y2="98" stroke="#9a5400" stroke-width="1.6" marker-end="url(#ah-9a5400)"/><text x="380" y="156" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">Row locks. ACID transactions. Crash recovery.</text><text x="380" y="172.2" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">Foreign keys.</text><line x1="365" y1="40" x2="365" y2="240" stroke="#7a6d57" stroke-width="1" stroke-dasharray="3 4"/></svg>

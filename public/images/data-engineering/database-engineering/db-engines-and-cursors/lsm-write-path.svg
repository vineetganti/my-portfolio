<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>lsm write path</title><desc>An LSM tree's write path. A write goes to a log on disk and a sorted memtable in memory, and returns. When the memtable fills it's flushed to an immutable sorted file at level 0. Background compaction merges files into larger sorted runs at lower levels.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="260" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">An LSM tree never updates in place</text><rect x="20" y="70" width="100" height="60" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="70" y="104.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">write</text><rect x="170" y="40" width="130" height="50" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="235" y="62.45" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">log</text><text x="235" y="84.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">append only</text><rect x="170" y="110" width="130" height="50" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="235" y="132.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">memtable</text><text x="235" y="154.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">sorted, in RAM</text><rect x="346" y="110" width="96" height="50" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="394" y="132.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">level 0</text><text x="394" y="154.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">sorted files</text><rect x="506" y="110" width="90" height="50" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="551" y="132.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">level 1</text><text x="551" y="154.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">merged</text><rect x="620" y="110" width="80" height="50" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="660" y="139.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">level 2</text><line x1="120" y1="88" x2="168" y2="68" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="120" y1="112" x2="168" y2="132" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="300" y1="135" x2="346" y2="135" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="323" y="129" font-size="11" font-weight="700" fill="#5e5241" text-anchor="middle">flush</text><line x1="442" y1="135" x2="506" y2="135" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="474" y="129" font-size="11" font-weight="700" fill="#5e5241" text-anchor="middle">compact</text><line x1="596" y1="135" x2="620" y2="135" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="170" y="200" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Writes are sequential, which is why it's fast and gentle on SSDs. Reads may check</text><text x="170" y="215.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">several files, and compaction rewrites data in the background.</text></svg>

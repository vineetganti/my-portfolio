<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>engine family</title><desc>A family tree of database engines. B-tree engines include MyISAM, Aria, InnoDB, XtraDB, SQLite and Berkeley DB. LSM engines include LevelDB, its fork RocksDB, and the MyRocks engine for MySQL, which is built on RocksDB.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="250" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Two families of engine</text><rect x="20" y="54" width="330" height="36" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="185" y="76.2" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">B-tree family: update pages in place</text><rect x="20" y="100" width="106" height="40" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="73" y="124.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">MyISAM</text><rect x="132" y="100" width="106" height="40" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="185" y="124.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">Aria</text><rect x="244" y="100" width="106" height="40" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="297" y="124.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">InnoDB</text><rect x="20" y="148" width="106" height="40" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="73" y="172.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">XtraDB</text><rect x="132" y="148" width="106" height="40" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="185" y="172.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">SQLite</text><rect x="244" y="148" width="106" height="40" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="297" y="172.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">Berkeley DB</text><rect x="370" y="54" width="330" height="36" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="535" y="76.2" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">LSM family: append, then merge</text><rect x="370" y="100" width="106" height="40" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="423" y="124.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">LevelDB</text><rect x="482" y="100" width="106" height="40" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="535" y="124.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">RocksDB</text><rect x="594" y="100" width="106" height="40" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="647" y="124.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">MyRocks</text><line x1="476" y1="120" x2="482" y2="120" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="588" y1="120" x2="594" y2="120" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="370" y="170" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">RocksDB is a fork of LevelDB, and MyRocks plugs it</text><text x="370" y="186.2" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">into MySQL.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>write path</title><desc>The write path of the sharded URL shortener. A client posts a long URL. The server hashes it with SHA-256 and keeps the first five characters as the short code. The hash ring maps that code to one of three Postgres servers, and the row is inserted there.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-7a6d57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7a6d57"/></marker><marker id="ah-4b7d33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b7d33"/></marker></defs><rect width="720" height="300" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Shortening a URL across three servers</text><rect x="20" y="110" width="100" height="60" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="70" y="137.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">client</text><text x="70" y="159.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">POST a URL</text><rect x="170" y="110" width="130" height="60" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="235" y="137.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">server</text><text x="235" y="159.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">sha256, first 5</text><rect x="350" y="110" width="120" height="60" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="410" y="137.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">hash ring</text><text x="410" y="159.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">code → server</text><rect x="540" y="40" width="160" height="56" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="620" y="65.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">shard 1</text><text x="620" y="87.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">port 5432</text><rect x="540" y="112" width="160" height="56" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="620" y="137.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">shard 2</text><text x="620" y="159.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">port 5433</text><rect x="540" y="184" width="160" height="56" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="620" y="209.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">shard 3</text><text x="620" y="231.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">port 5434</text><line x1="120" y1="140" x2="170" y2="140" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="300" y1="140" x2="350" y2="140" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="470" y1="124" x2="538" y2="72" stroke="#7a6d57" stroke-width="1.6" stroke-dasharray="3 4" marker-end="url(#ah-7a6d57)"/><line x1="470" y1="140" x2="540" y2="140" stroke="#4b7d33" stroke-width="2" marker-end="url(#ah-4b7d33)"/><text x="505" y="134" font-size="11" font-weight="700" fill="#4b7d33" text-anchor="middle">INSERT</text><line x1="470" y1="156" x2="538" y2="208" stroke="#7a6d57" stroke-width="1.6" stroke-dasharray="3 4" marker-end="url(#ah-7a6d57)"/><text x="20" y="268" font-size="11.5" font-weight="700" fill="#5e5241" text-anchor="start">Reads run the same code through the same ring, so they reach the same server.</text></svg>

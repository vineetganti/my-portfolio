<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>escalation</title><desc>What to try before sharding, in order. Partition the table, cache hot reads, replicate to serve reads from copies, use multi-region replication, and only then shard. Each step adds complexity, and reads are far easier to scale than writes.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-7a6d57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7a6d57"/></marker></defs><rect width="720" height="240" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Sharding is the last step, not the first</text><rect x="20" y="74" width="122" height="76" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="81" y="102.52" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Partition</text><text x="81" y="124.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">smaller tables,</text><text x="81" y="138.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">same server</text><rect x="160" y="74" width="122" height="76" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="221" y="102.52" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Cache</text><text x="221" y="124.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">hot reads skip the</text><text x="221" y="138.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">database</text><line x1="142" y1="112" x2="160" y2="112" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="300" y="74" width="122" height="76" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="361" y="109.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Replicate</text><text x="361" y="131.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">reads from copies</text><line x1="282" y1="112" x2="300" y2="112" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="440" y="74" width="122" height="76" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="501" y="109.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Multi-region</text><text x="501" y="131.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">writes near users</text><line x1="422" y1="112" x2="440" y2="112" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="580" y="74" width="122" height="76" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="641" y="109.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Shard</text><text x="641" y="131.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">split the writes</text><line x1="562" y1="112" x2="580" y2="112" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="40" y1="184" x2="680" y2="184" stroke="#7a6d57" stroke-width="1.6" marker-end="url(#ah-7a6d57)"/><text x="360" y="178" font-size="11" font-weight="700" fill="#5e5241" text-anchor="middle">more complexity, fewer guarantees</text><text x="20" y="214" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">Find the real bottleneck first. Reads are easy to spread out, and writes are the hard case.</text></svg>

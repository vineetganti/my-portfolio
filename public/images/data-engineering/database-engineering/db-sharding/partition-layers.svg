<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>partition layers</title><desc>How the layers stack. A billion rows are spread over shards on separate servers. Within each shard the table is partitioned, and within each partition an index narrows the search further, until a query only looks at a few thousand rows.</desc><defs></defs><rect width="720" height="230" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">The layers stack</text><rect x="40" y="54" width="640" height="36" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="360" y="76.2" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">1,000,000,000 rows</text><rect x="110" y="96" width="500" height="36" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="360" y="118.2" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">a shard: 100,000,000 rows</text><rect x="180" y="138" width="360" height="36" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="360" y="160.2" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">a partition: 10,000,000 rows</text><rect x="240" y="180" width="240" height="36" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="360" y="202.2" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">an index range: a few thousand</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>summary map</title><desc>A map of this post in three columns. Routing: a shard key, then range, list or hash, and the client must know. Hashing: modulo moves most keys when servers change, while a ring moves about one share, and virtual nodes even out the load. The cost: no cross-shard transactions or joins, and schema changes on every server.</desc><defs></defs><rect width="720" height="260" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">The post on one page</text><rect x="20" y="56" width="220" height="44" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="130" y="82.73" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Routing</text><rect x="20" y="108" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="130" y="128.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">A shard key picks the server</text><rect x="20" y="150" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="130" y="170.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">Range, list or hash</text><rect x="20" y="192" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="130" y="212.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">The client has to know</text><rect x="250" y="56" width="220" height="44" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="360" y="82.73" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Hashing</text><rect x="250" y="108" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="128.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">Modulo moves most keys</text><rect x="250" y="150" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="170.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">A ring moves about 1 in N</text><rect x="250" y="192" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="212.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">More points, even load</text><rect x="480" y="56" width="220" height="44" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="590" y="82.73" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">The cost</text><rect x="480" y="108" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="590" y="128.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">No cross-shard transactions</text><rect x="480" y="150" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="590" y="170.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">No cross-shard joins</text><rect x="480" y="192" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="590" y="212.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">Every change, on every server</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>redis durability</title><desc>Redis durability options. A write lands in memory. RDB saves a snapshot of everything from time to time, so a crash loses what came after the last snapshot. AOF appends every command to a log, flushed every second or on each write, so a crash loses at most a moment or nothing, at more cost.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-4b7d33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b7d33"/></marker></defs><rect width="720" height="260" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Redis keeps data in memory, and optionally on disk</text><rect x="20" y="90" width="100" height="60" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="70" y="124.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">SET</text><rect x="180" y="90" width="120" height="60" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="240" y="117.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">memory</text><text x="240" y="139.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">the real store</text><rect x="390" y="40" width="150" height="60" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="465" y="67.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">RDB snapshot</text><text x="465" y="89.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">everything, now and then</text><rect x="390" y="140" width="150" height="60" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="465" y="167.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">AOF</text><text x="465" y="189.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">every command</text><line x1="120" y1="120" x2="180" y2="120" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="300" y1="106" x2="388" y2="74" stroke="#5e5241" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah-5e5241)"/><line x1="300" y1="134" x2="388" y2="166" stroke="#4b7d33" stroke-width="1.6" marker-end="url(#ah-4b7d33)"/><text x="560" y="56" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">Loses everything since</text><text x="560" y="72.2" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">the last save.</text><text x="560" y="156" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">Loses up to a second, or</text><text x="560" y="172.2" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">nothing, by fsync</text><text x="560" y="188.4" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">policy.</text></svg>

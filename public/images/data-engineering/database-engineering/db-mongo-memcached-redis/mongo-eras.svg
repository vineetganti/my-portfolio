<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>mongo eras</title><desc>Three ways MongoDB has found a document. With MMAPv1 the _id index held a direct file location, one index walk. With WiredTiger the _id index holds a record id, and a second tree maps that to the document, two walks. A clustered collection stores documents in the _id tree itself, one walk.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="300" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Three eras of finding a document by _id</text><text x="20" y="82" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">MMAPv1</text><rect x="170" y="56" width="120" height="42" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="230" y="80.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">_id index</text><rect x="324" y="56" width="130" height="42" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="389" y="80.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">file + offset</text><line x1="290" y1="77" x2="324" y2="77" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="170" y="116" font-size="11" font-weight="400" fill="#5e5241" text-anchor="start">One tree walk, then a direct read. Removed in 4.2.</text><text x="20" y="160" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">WiredTiger</text><rect x="170" y="134" width="120" height="42" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="230" y="158.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">_id index</text><rect x="324" y="134" width="130" height="42" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="389" y="158.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">recordId tree</text><line x1="290" y1="155" x2="324" y2="155" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="488" y="134" width="100" height="42" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="538" y="158.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">document</text><line x1="454" y1="155" x2="488" y2="155" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="170" y="194" font-size="11" font-weight="400" fill="#5e5241" text-anchor="start">Two tree walks, and the recordId stays small.</text><text x="20" y="238" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">Clustered</text><rect x="170" y="212" width="240" height="42" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="290" y="236.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">_id tree with documents</text><text x="170" y="272" font-size="11" font-weight="400" fill="#5e5241" text-anchor="start">One tree walk. Secondary indexes hold _id instead, as in InnoDB.</text></svg>

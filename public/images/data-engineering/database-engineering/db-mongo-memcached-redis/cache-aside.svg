<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>cache aside</title><desc>The usual way to use a cache. The application asks the cache first. On a hit it's done. On a miss it reads the database, stores the result in the cache, and returns it.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-7a6d57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7a6d57"/></marker></defs><rect width="720" height="230" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">A cache sits beside the database</text><rect x="40" y="90" width="130" height="60" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="105" y="124.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">application</text><rect x="300" y="40" width="150" height="60" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="375" y="67.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Memcached</text><text x="375" y="89.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">RAM, expires</text><rect x="300" y="140" width="150" height="60" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="375" y="167.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">database</text><text x="375" y="189.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">source of truth</text><line x1="170" y1="106" x2="298" y2="74" stroke="#5e5241" stroke-width="1.6" marker-start="url(#ah-5e5241)" marker-end="url(#ah-5e5241)"/><text x="234" y="82" font-size="11" font-weight="700" fill="#5e5241" text-anchor="middle">1. get</text><line x1="170" y1="134" x2="298" y2="166" stroke="#7a6d57" stroke-width="1.6" marker-end="url(#ah-7a6d57)"/><text x="234" y="166" font-size="11" font-weight="700" fill="#7a6d57" text-anchor="middle">2. on a miss</text><text x="490" y="76" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">No server-to-server traffic at</text><text x="490" y="92.2" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">all: the client decides which</text><text x="490" y="108.4" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">server holds a key.</text></svg>

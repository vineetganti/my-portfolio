<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>three tools</title><desc>Three tools compared. MongoDB is a durable document database on disk. Memcached is a volatile key-value cache in memory, with no persistence and no server-to-server traffic. Redis is an in-memory data structure server with optional persistence, replication and clustering.</desc><defs></defs><rect width="720" height="250" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Three different jobs</text><rect x="20" y="56" width="216" height="46" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="128" y="83.73" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">MongoDB</text><text x="28" y="130" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="start">Documents on disk</text><text x="28" y="156" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="start">Indexes, queries, durability</text><text x="28" y="182" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="start">A primary database</text><rect x="252" y="56" width="216" height="46" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="360" y="83.73" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Memcached</text><text x="260" y="130" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="start">Keys and values in RAM</text><text x="260" y="156" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="start">Gone on restart</text><text x="260" y="182" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="start">A cache and nothing more</text><rect x="484" y="56" width="216" height="46" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="592" y="83.73" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Redis</text><text x="492" y="130" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="start">Data structures in RAM</text><text x="492" y="156" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="start">Optional persistence</text><text x="492" y="182" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="start">A cache, or a small store</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>summary map</title><desc>A map of this post in three columns. MongoDB: BSON documents, WiredTiger pages, clustered collections remove a tree walk. Memcached: slabs, LRU, and client-side hashing. Redis: single-threaded commands, RESP, RDB and AOF, with measured data loss.</desc><defs></defs><rect width="720" height="260" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">The post on one page</text><rect x="20" y="56" width="220" height="44" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="130" y="82.73" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">MongoDB</text><rect x="20" y="108" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="130" y="128.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">WiredTiger is a B-tree</text><rect x="20" y="150" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="130" y="170.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">_id then recordId: two walks</text><rect x="20" y="192" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="130" y="212.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">Clustered: one walk</text><rect x="250" y="56" width="220" height="44" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="360" y="82.73" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Memcached</text><rect x="250" y="108" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="128.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">Slabs avoid fragmentation</text><rect x="250" y="150" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="170.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">LRU evicts per class</text><rect x="250" y="192" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="212.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">Clients do the hashing</text><rect x="480" y="56" width="220" height="44" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="590" y="82.73" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Redis</text><rect x="480" y="108" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="590" y="128.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">One thread runs commands</text><rect x="480" y="150" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="590" y="170.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">RDB or AOF for durability</text><rect x="480" y="192" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="590" y="212.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">Real crashes lost real keys</text></svg>

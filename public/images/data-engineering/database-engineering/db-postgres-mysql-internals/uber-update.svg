<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>uber update</title><desc>Why updates cost Postgres more in Uber's account. In Postgres an update writes a new row version at a new address, so every index needs a new entry, unless the update is heap-only. In InnoDB secondary indexes hold the primary key, so an update to a column they don't cover touches only the primary key tree.</desc><defs><marker id="ah-b0273f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b0273f"/></marker></defs><rect width="720" height="280" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">One update, and who has to know</text><text x="20" y="56" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start">Postgres</text><rect x="20" y="72" width="130" height="52" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="85" y="95.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">new row version</text><text x="85" y="117.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">new address</text><rect x="220" y="62" width="120" height="36" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="280" y="84.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">index 1</text><line x1="150" y1="98" x2="220" y2="80" stroke="#b0273f" stroke-width="1.2" marker-end="url(#ah-b0273f)"/><rect x="220" y="106" width="120" height="36" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="280" y="128.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">index 2</text><line x1="150" y1="98" x2="220" y2="124" stroke="#b0273f" stroke-width="1.2" marker-end="url(#ah-b0273f)"/><rect x="220" y="150" width="120" height="36" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="280" y="172.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">index 3</text><line x1="150" y1="98" x2="220" y2="168" stroke="#b0273f" stroke-width="1.2" marker-end="url(#ah-b0273f)"/><text x="20" y="218" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">Every index holds an address, so each may need a new</text><text x="20" y="234.2" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">entry. HOT avoids this when no indexed column</text><text x="20" y="250.4" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">changed and the page has room.</text><text x="380" y="56" font-size="13" font-weight="700" fill="#2f281e" text-anchor="start">InnoDB</text><rect x="380" y="72" width="130" height="52" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="445" y="95.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">primary key tree</text><text x="445" y="117.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">row changed in place</text><rect x="580" y="62" width="120" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="640" y="84.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">index 1</text><rect x="580" y="106" width="120" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="640" y="128.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">index 2</text><rect x="580" y="150" width="120" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="640" y="172.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">index 3</text><text x="380" y="218" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">Secondary indexes hold the primary key, which</text><text x="380" y="234.2" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">didn't change, so they're left alone. The old value</text><text x="380" y="250.4" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">goes to the undo log.</text><line x1="362" y1="44" x2="362" y2="270" stroke="#7a6d57" stroke-width="1" stroke-dasharray="3 4"/></svg>

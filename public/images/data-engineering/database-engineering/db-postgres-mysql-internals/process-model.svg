<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>process model</title><desc>Postgres's process model. The postmaster listens and forks one backend process per client connection. All backends share memory, including shared buffers and the WAL buffers. Background processes write pages, write the log, checkpoint and vacuum.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="320" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">A process per connection, and shared memory</text><rect x="20" y="62" width="110" height="48" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="75" y="90.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">client</text><rect x="190" y="62" width="130" height="48" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="255" y="83.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">postmaster</text><text x="255" y="105.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">listens, forks</text><rect x="380" y="40" width="130" height="40" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="445" y="64.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">backend</text><rect x="380" y="92" width="130" height="40" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="445" y="116.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">backend</text><line x1="130" y1="86" x2="190" y2="86" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="160" y="80" font-size="11" font-weight="700" fill="#5e5241" text-anchor="middle">connect</text><line x1="320" y1="78" x2="378" y2="60" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="320" y1="94" x2="378" y2="112" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="190" y="160" width="510" height="56" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="445" y="185.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">shared memory</text><text x="445" y="207.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">shared buffers, WAL buffers, locks</text><line x1="445" y1="132" x2="445" y2="158" stroke="#5e5241" stroke-width="1.6" marker-start="url(#ah-5e5241)" marker-end="url(#ah-5e5241)"/><rect x="190" y="240" width="97" height="44" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="238.5" y="265.5" font-size="10" font-weight="700" fill="#2f281e" text-anchor="middle">checkpointer</text><rect x="293" y="240" width="97" height="44" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="341.5" y="259.5" font-size="10" font-weight="700" fill="#2f281e" text-anchor="middle">background</text><text x="341.5" y="271.5" font-size="10" font-weight="700" fill="#2f281e" text-anchor="middle">writer</text><rect x="396" y="240" width="97" height="44" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="444.5" y="265.5" font-size="10" font-weight="700" fill="#2f281e" text-anchor="middle">WAL writer</text><rect x="499" y="240" width="97" height="44" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="547.5" y="265.5" font-size="10" font-weight="700" fill="#2f281e" text-anchor="middle">autovacuum</text><rect x="602" y="240" width="97" height="44" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="650.5" y="265.5" font-size="10" font-weight="700" fill="#2f281e" text-anchor="middle">io workers</text><line x1="445" y1="216" x2="445" y2="240" stroke="#7a6d57" stroke-width="1"/></svg>

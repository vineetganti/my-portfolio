<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>two phase commit</title><desc>Two-phase commit across two databases. In phase one the coordinator asks each to prepare, and each writes its changes durably and votes yes. In phase two the coordinator tells both to commit. If the coordinator dies between the phases, the participants hold their locks until it returns.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="260" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Two-phase commit</text><rect x="20" y="90" width="130" height="64" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="85" y="126.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">coordinator</text><rect x="560" y="40" width="140" height="60" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="630" y="74.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">database A</text><rect x="560" y="150" width="140" height="60" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="630" y="184.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">database B</text><line x1="150" y1="108" x2="558" y2="66" stroke="#5e5241" stroke-width="1.6" marker-start="url(#ah-5e5241)" marker-end="url(#ah-5e5241)"/><text x="321.4" y="76.4" font-size="11" font-weight="700" fill="#5e5241" text-anchor="middle">1. PREPARE, then 2. COMMIT</text><line x1="150" y1="136" x2="558" y2="174" stroke="#5e5241" stroke-width="1.6" marker-start="url(#ah-5e5241)" marker-end="url(#ah-5e5241)"/><text x="20" y="222" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">Between the phases each database has promised to commit, and holds its locks until told. That's the</text><text x="20" y="238.2" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">protocol's weak spot.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>two phase locking</title><desc>Two-phase locking. In the first phase a transaction only acquires locks, and the number it holds rises. In the second it only releases them. In strict two-phase locking, as in real databases, all locks are held until commit and released together.</desc><defs><marker id="ah-9a5400" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a5400"/></marker></defs><rect width="720" height="240" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Two-phase locking: acquire, then release</text><line x1="60" y1="190" x2="680" y2="190" stroke="#5e5241" stroke-width="1.2"/><text x="60" y="208" font-size="11" font-weight="400" fill="#5e5241" text-anchor="start">BEGIN</text><text x="680" y="208" font-size="11" font-weight="400" fill="#5e5241" text-anchor="end">COMMIT</text><text x="24" y="120" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle" transform="rotate(-90 24 120)">locks held</text><path d="M60 190 L130 190 L130 150 L240 150 L240 110 L370 110 L370 74 L660 74 L660 188" fill="none" stroke="#9a5400" stroke-width="2.2" marker-end="url(#ah-9a5400)"/><text x="235" y="66" font-size="12" font-weight="700" fill="#9a5400" text-anchor="middle">acquire phase</text><text x="520" y="66" font-size="12" font-weight="700" fill="#4b7d33" text-anchor="middle">held until the end</text><text x="380" y="120" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Real databases hold locks until COMMIT, so</text><text x="380" y="135.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">nobody reads a value that might still roll</text><text x="380" y="151.05" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">back.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>pessimistic optimistic</title><desc>Two approaches to concurrency. Pessimistic control locks first, so a second transaction waits and then proceeds: never a failure, less concurrency. Optimistic control lets both run and checks at the end, so one may fail and retry: more concurrency, and the application needs retry logic.</desc><defs></defs><rect width="720" height="240" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Assume conflict, or assume none?</text><rect x="20" y="56" width="330" height="42" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="185" y="81.73" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Pessimistic</text><text x="32" y="124" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="start">Take the lock first</text><text x="32" y="150" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="start">Others wait</text><text x="32" y="176" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="start">Nothing fails, things queue</text><text x="32" y="202" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="start">Postgres, MySQL row locks</text><rect x="370" y="56" width="330" height="42" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="535" y="81.73" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Optimistic</text><text x="382" y="124" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="start">Work without locks</text><text x="382" y="150" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="start">Check at commit</text><text x="382" y="176" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="start">A conflict means retry</text><text x="382" y="202" font-size="12.5" font-weight="400" fill="#2f281e" text-anchor="start">SERIALIZABLE, version columns</text></svg>

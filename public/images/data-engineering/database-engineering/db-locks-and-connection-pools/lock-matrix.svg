<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>lock matrix</title><desc>Which row locks conflict. A shared lock is compatible with another shared lock, so many readers can hold it together. A shared lock conflicts with an exclusive lock, and an exclusive lock conflicts with both. In Postgres a plain SELECT takes neither.</desc><defs></defs><rect width="720" height="230" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Which locks can share a row?</text><rect x="180" y="60" width="150" height="40" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="255" y="84.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">shared held</text><rect x="336" y="60" width="150" height="40" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="411" y="84.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">exclusive held</text><rect x="20" y="106" width="154" height="44" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="97" y="132.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">ask for shared</text><rect x="20" y="156" width="154" height="44" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="97" y="182.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">ask for exclusive</text><rect x="180" y="106" width="150" height="44" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="255" y="132.2" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">allowed</text><rect x="336" y="106" width="150" height="44" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="411" y="132.2" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">wait</text><rect x="180" y="156" width="150" height="44" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="255" y="182.2" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">wait</text><rect x="336" y="156" width="150" height="44" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="411" y="182.2" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">wait</text><text x="506" y="112" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">A plain SELECT in Postgres takes</text><text x="506" y="128.2" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">neither, so it's never in this</text><text x="506" y="144.4" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">table.</text></svg>

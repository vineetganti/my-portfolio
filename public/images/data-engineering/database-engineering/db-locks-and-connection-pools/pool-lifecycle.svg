<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>pool lifecycle</title><desc>A connection pool. Requests borrow a ready connection, run a query and return it, so the TCP and authentication cost is paid once. When all connections are busy, new requests wait in a queue. A request that never returns its connection shrinks the pool.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-9a5400" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a5400"/></marker></defs><rect width="720" height="280" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">A pool: pay for the connection once</text><rect x="20" y="100" width="120" height="70" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="80" y="132.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">requests</text><text x="80" y="154.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">many, short</text><rect x="190" y="100" width="110" height="70" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="245" y="125.52" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">queue</text><text x="245" y="147.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">waiting for a</text><text x="245" y="161.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">free one</text><rect x="350" y="60" width="170" height="150" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="435" y="82" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">pool</text><rect x="366" y="94" width="138" height="30" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="435" y="112.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">busy</text><rect x="366" y="130" width="138" height="30" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="435" y="148.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">idle</text><rect x="366" y="166" width="138" height="30" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="435" y="184.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">idle</text><rect x="570" y="100" width="130" height="70" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="635" y="125.52" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">database</text><text x="635" y="147.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">a process per</text><text x="635" y="161.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">connection</text><line x1="140" y1="135" x2="190" y2="135" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="300" y1="135" x2="348" y2="135" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="520" y1="135" x2="570" y2="135" stroke="#9a5400" stroke-width="1.6" marker-start="url(#ah-9a5400)" marker-end="url(#ah-9a5400)"/><text x="20" y="238" font-size="11.5" font-weight="700" fill="#b0273f" text-anchor="start">Forget to return a connection and the pool quietly shrinks, until every request waits forever.</text></svg>

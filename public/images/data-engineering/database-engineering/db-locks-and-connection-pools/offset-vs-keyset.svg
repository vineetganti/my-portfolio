<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>offset vs keyset</title><desc>Two ways to fetch page 1,000 of a list. OFFSET walks past 10,000 rows, reading each, and throws them away before returning ten. Keyset pagination uses the last id seen to jump straight to the right place in the index and reads only ten rows.</desc><defs><marker id="ah-4b7d33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b7d33"/></marker></defs><rect width="720" height="260" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Getting page 1,000 of a list, ten rows a page</text><text x="20" y="62" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">OFFSET 10000 LIMIT 10</text><rect x="20" y="72" width="22" height="24" rx="2" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="46" y="72" width="22" height="24" rx="2" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="72" y="72" width="22" height="24" rx="2" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="98" y="72" width="22" height="24" rx="2" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="124" y="72" width="22" height="24" rx="2" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="150" y="72" width="22" height="24" rx="2" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="176" y="72" width="22" height="24" rx="2" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="202" y="72" width="22" height="24" rx="2" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="228" y="72" width="22" height="24" rx="2" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="254" y="72" width="22" height="24" rx="2" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="280" y="72" width="22" height="24" rx="2" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="306" y="72" width="22" height="24" rx="2" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="332" y="72" width="22" height="24" rx="2" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="358" y="72" width="22" height="24" rx="2" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="384" y="72" width="22" height="24" rx="2" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="410" y="72" width="22" height="24" rx="2" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="436" y="72" width="22" height="24" rx="2" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="462" y="72" width="22" height="24" rx="2" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="488" y="72" width="22" height="24" rx="2" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="514" y="72" width="22" height="24" rx="2" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="540" y="72" width="22" height="24" rx="2" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="566" y="72" width="22" height="24" rx="2" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="592" y="72" width="22" height="24" rx="2" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="618" y="72" width="22" height="24" rx="2" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><rect x="644" y="72" width="22" height="24" rx="2" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><rect x="670" y="72" width="22" height="24" rx="2" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="20" y="118" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Reads every skipped row, and throws them away. The work grows with the page number.</text><text x="20" y="158" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">WHERE id &lt; 12345 ORDER BY id DESC LIMIT 10</text><rect x="20" y="168" width="22" height="24" rx="2" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="46" y="168" width="22" height="24" rx="2" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="72" y="168" width="22" height="24" rx="2" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="98" y="168" width="22" height="24" rx="2" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="124" y="168" width="22" height="24" rx="2" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="150" y="168" width="22" height="24" rx="2" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="176" y="168" width="22" height="24" rx="2" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="202" y="168" width="22" height="24" rx="2" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="228" y="168" width="22" height="24" rx="2" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="254" y="168" width="22" height="24" rx="2" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="280" y="168" width="22" height="24" rx="2" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="306" y="168" width="22" height="24" rx="2" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="332" y="168" width="22" height="24" rx="2" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="358" y="168" width="22" height="24" rx="2" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="384" y="168" width="22" height="24" rx="2" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="410" y="168" width="22" height="24" rx="2" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="436" y="168" width="22" height="24" rx="2" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="462" y="168" width="22" height="24" rx="2" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="488" y="168" width="2
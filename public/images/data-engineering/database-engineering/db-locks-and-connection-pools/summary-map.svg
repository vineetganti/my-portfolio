<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>summary map</title><desc>A map of this post in four columns. Locks: shared and exclusive, held until commit, plain reads take none in Postgres. Deadlocks: a cycle of waits, detected after a second, and the victim depends on timing. Double booking: lock the read, or put the check in the update. Pagination and pools: keyset beats offset, and pools need a release on every path.</desc><defs></defs><rect width="720" height="280" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">The post on one page</text><rect x="20" y="56" width="164" height="44" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="102" y="82.73" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Locks</text><rect x="20" y="108" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="102" y="127.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Shared and exclusive</text><rect x="20" y="148" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="102" y="167.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Held until commit</text><rect x="20" y="188" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="102" y="207.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Plain reads take none</text><rect x="192" y="56" width="164" height="44" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="274" y="82.73" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Deadlocks</text><rect x="192" y="108" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="274" y="127.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">A cycle of waits</text><rect x="192" y="148" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="274" y="167.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Detected after a second</text><rect x="192" y="188" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="274" y="207.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Timing picks the victim</text><rect x="364" y="56" width="164" height="44" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="446" y="82.73" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Double booking</text><rect x="364" y="108" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="446" y="127.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Reads alone don't protect</text><rect x="364" y="148" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="446" y="160.27" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">FOR UPDATE, or check in</text><text x="446" y="174.13" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">UPDATE</text><rect x="364" y="188" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="446" y="207.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Levels change the behaviour</text><rect x="536" y="56" width="164" height="44" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="618" y="82.73" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">At scale</text><rect x="536" y="108" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="618" y="127.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Keyset, not OFFSET</text><rect x="536" y="148" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="618" y="167.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Reuse connections</text><rect x="536" y="188" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="618" y="207.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Release on every path</text></svg>

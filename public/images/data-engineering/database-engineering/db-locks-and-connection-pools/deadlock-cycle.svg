<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>deadlock cycle</title><desc>A deadlock. Session A holds row 20 and waits for row 21. Session B holds row 21 and waits for row 20. Each is waiting for the other, so neither can move until the database aborts one.</desc><defs><marker id="ah-b0273f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b0273f"/></marker></defs><rect width="720" height="240" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">A deadlock is a cycle of waits</text><rect x="90" y="80" width="150" height="60" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="165" y="107.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">session A</text><text x="165" y="129.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">holds row 20</text><rect x="480" y="80" width="150" height="60" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="555" y="107.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">session B</text><text x="555" y="129.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">holds row 21</text><line x1="240" y1="96" x2="478" y2="96" stroke="#b0273f" stroke-width="2" marker-end="url(#ah-b0273f)"/><text x="359" y="90" font-size="11" font-weight="700" fill="#b0273f" text-anchor="middle">wants row 21</text><line x1="480" y1="126" x2="242" y2="126" stroke="#b0273f" stroke-width="2" marker-end="url(#ah-b0273f)"/><text x="361" y="144" font-size="11" font-weight="700" fill="#b0273f" text-anchor="middle">wants row 20</text><text x="90" y="186" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">Neither can finish. After deadlock_timeout (1 second by default), a waiting backend</text><text x="90" y="202.2" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">checks for a cycle, and the one that finds it aborts itself.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>fan out</title><desc>Two ways to build a home timeline. Pull: on each read, look up everyone you follow and merge their latest tweets, so reads are expensive and writes are cheap. Push: on each tweet, copy it into every follower's timeline, so reads are cheap and a celebrity's tweet means millions of writes.</desc><defs><marker id="ah-9a5400" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a5400"/></marker><marker id="ah-4b7d33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b7d33"/></marker></defs><rect width="720" height="260" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">A home timeline: pay at read time or write time</text><text x="20" y="56" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">Pull (fan-out on read)</text><rect x="20" y="70" width="100" height="50" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="70" y="99.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">reader</text><rect x="210" y="66" width="120" height="34" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="270" y="86.67" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">followee 1</text><line x1="120" y1="95" x2="210" y2="83" stroke="#9a5400" stroke-width="1.2" marker-end="url(#ah-9a5400)"/><rect x="210" y="108" width="120" height="34" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="270" y="128.68" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">followee 2</text><line x1="120" y1="95" x2="210" y2="125" stroke="#9a5400" stroke-width="1.2" marker-end="url(#ah-9a5400)"/><rect x="210" y="150" width="120" height="34" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="270" y="170.67" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">followee 3</text><line x1="120" y1="95" x2="210" y2="167" stroke="#9a5400" stroke-width="1.2" marker-end="url(#ah-9a5400)"/><text x="20" y="208" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Cheap to tweet. Each read costs one lookup per</text><text x="20" y="223.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">account you follow.</text><text x="380" y="56" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">Push (fan-out on write)</text><rect x="380" y="70" width="100" height="50" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="430" y="99.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">tweet</text><rect x="570" y="66" width="130" height="34" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="635" y="86.67" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">timeline 1</text><line x1="480" y1="95" x2="570" y2="83" stroke="#4b7d33" stroke-width="1.2" marker-end="url(#ah-4b7d33)"/><rect x="570" y="108" width="130" height="34" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="635" y="128.68" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">timeline 2</text><line x1="480" y1="95" x2="570" y2="125" stroke="#4b7d33" stroke-width="1.2" marker-end="url(#ah-4b7d33)"/><rect x="570" y="150" width="130" height="34" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="635" y="170.67" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">timeline 3</text><line x1="480" y1="95" x2="570" y2="167" stroke="#4b7d33" stroke-width="1.2" marker-end="url(#ah-4b7d33)"/><text x="380" y="208" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Cheap to read. A celebrity's tweet is millions of</text><text x="380" y="223.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">writes.</text></svg>

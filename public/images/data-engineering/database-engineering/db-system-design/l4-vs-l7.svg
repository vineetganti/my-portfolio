<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>l4 vs l7</title><desc>Two kinds of load balancer. A layer 4 balancer forwards TCP connections without reading them, so one client connection maps to one backend connection. A layer 7 balancer terminates the connection, reads HTTP, and can route each request separately, but it holds the TLS keys and two connections per request.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="250" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Load balancing at layer 4 or layer 7</text><text x="20" y="58" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">Layer 4: forwards packets</text><rect x="20" y="70" width="90" height="44" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="65" y="96.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">client</text><rect x="150" y="70" width="110" height="44" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="205" y="89.75" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">L4</text><text x="205" y="109.52" font-size="9.5" font-weight="400" fill="#5e5241" text-anchor="middle">can't read it</text><rect x="300" y="70" width="60" height="44" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="330" y="95.67" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">server</text><line x1="110" y1="92" x2="150" y2="92" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="260" y1="92" x2="300" y2="92" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="20" y="140" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">One TLS session, end to end. All requests on a</text><text x="20" y="155.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">connection go to one server.</text><text x="380" y="58" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">Layer 7: reads HTTP</text><rect x="380" y="70" width="90" height="44" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="425" y="96.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">client</text><rect x="506" y="70" width="100" height="44" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="556" y="89.75" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">L7</text><text x="556" y="109.52" font-size="9.5" font-weight="400" fill="#5e5241" text-anchor="middle">reads it</text><rect x="640" y="70" width="60" height="44" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="670" y="95.67" font-size="10.5" font-weight="700" fill="#2f281e" text-anchor="middle">server</text><line x1="470" y1="92" x2="506" y2="92" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="606" y1="92" x2="640" y2="92" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="380" y="140" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Two connections. Can route by URL, cache and retry.</text><text x="380" y="155.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">It terminates TLS, so it holds the keys.</text><line x1="368" y1="44" x2="368" y2="220" stroke="#7a6d57" stroke-width="1" stroke-dasharray="3 4"/></svg>

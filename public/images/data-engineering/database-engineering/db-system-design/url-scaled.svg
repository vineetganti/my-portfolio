<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>url scaled</title><desc>The URL shortener at scale. A reverse proxy sends POST requests to a writer connected to the primary, and GET requests to readers connected to read replicas, which are placed near users. Reads far outnumber writes, so most traffic never touches the primary.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-9a5400" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a5400"/></marker><marker id="ah-4b7d33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b7d33"/></marker></defs><rect width="720" height="300" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Reads and writes take different paths</text><rect x="20" y="118" width="100" height="60" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="70" y="152.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">clients</text><rect x="170" y="118" width="120" height="60" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="230" y="145.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">reverse proxy</text><text x="230" y="167.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">splits by method</text><rect x="350" y="56" width="120" height="54" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="410" y="80.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">writer</text><text x="410" y="102.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">POST</text><rect x="350" y="186" width="120" height="54" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="410" y="210.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">readers</text><text x="410" y="232.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">GET</text><rect x="540" y="56" width="150" height="54" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="615" y="87.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">primary</text><rect x="540" y="186" width="150" height="54" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="615" y="210.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">read replicas</text><text x="615" y="232.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">near users</text><line x1="120" y1="148" x2="170" y2="148" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="290" y1="134" x2="348" y2="92" stroke="#9a5400" stroke-width="1.6" marker-end="url(#ah-9a5400)"/><line x1="290" y1="162" x2="348" y2="204" stroke="#4b7d33" stroke-width="1.6" marker-end="url(#ah-4b7d33)"/><line x1="470" y1="83" x2="540" y2="83" stroke="#9a5400" stroke-width="1.6" marker-end="url(#ah-9a5400)"/><line x1="470" y1="213" x2="540" y2="213" stroke="#4b7d33" stroke-width="1.6" marker-end="url(#ah-4b7d33)"/><line x1="615" y1="110" x2="615" y2="186" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="657" y="152" font-size="11" font-weight="700" fill="#5e5241" text-anchor="middle">replication</text></svg>

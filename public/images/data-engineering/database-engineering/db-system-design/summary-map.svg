<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>summary map</title><desc>A map of this post in three columns. Method: start simple, ask what fails, add a box only for a reason. Twitter: post, follow, and the timeline trade-off. URL shortener: generated ids or hashes, split reads from writes.</desc><defs></defs><rect width="720" height="260" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">The post on one page</text><rect x="20" y="56" width="220" height="44" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="130" y="82.73" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">The method</text><rect x="20" y="108" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="130" y="128.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">Start with the simple version</text><rect x="20" y="150" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="130" y="170.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">Ask what fails, then fix that</text><rect x="20" y="192" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="130" y="212.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">Every box has a cost</text><rect x="250" y="56" width="220" height="44" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="360" y="82.73" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Twitter</text><rect x="250" y="108" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="128.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">Queues absorb write spikes</text><rect x="250" y="150" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="170.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">A follows row is cheap</text><rect x="250" y="192" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="212.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">Timelines: pull or push</text><rect x="480" y="56" width="220" height="44" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="590" y="82.73" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">URL shortener</text><rect x="480" y="108" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="590" y="128.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">Ids are simple and guessable</text><rect x="480" y="150" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="590" y="170.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">Hashes clash at short lengths</text><rect x="480" y="192" width="220" height="36" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="590" y="212.31" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">Reads go to replicas</text></svg>

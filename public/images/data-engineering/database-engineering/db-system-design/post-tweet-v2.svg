<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>post tweet v2</title><desc>The design after asking what can fail. A load balancer spreads clients over servers, which hold pools of ready database connections. A queue between the servers and the database absorbs spikes and retries failed writes. Workers drain the queue into the database.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="300" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">After asking what fails</text><rect x="20" y="110" width="96" height="60" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="68" y="144.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">clients</text><rect x="150" y="110" width="110" height="60" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="205" y="137.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">load balancer</text><text x="205" y="159.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">L4 or L7</text><rect x="300" y="60" width="110" height="56" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="355" y="85.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">server 1</text><text x="355" y="107.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">conn pool</text><rect x="300" y="164" width="110" height="56" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="355" y="189.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">server 2</text><text x="355" y="211.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">conn pool</text><rect x="450" y="110" width="110" height="60" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="505" y="137.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">queue</text><text x="505" y="159.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">absorbs spikes</text><rect x="600" y="110" width="100" height="60" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="650" y="144.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">database</text><line x1="116" y1="140" x2="150" y2="140" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="260" y1="126" x2="298" y2="92" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="260" y1="154" x2="298" y2="188" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="410" y1="92" x2="448" y2="126" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="410" y1="188" x2="448" y2="154" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="560" y1="140" x2="600" y2="140" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="20" y="256" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Workers drain the queue into the database. Each box is there because of a failure mode, and each adds something</text><text x="20" y="271.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">new to run.</text></svg>

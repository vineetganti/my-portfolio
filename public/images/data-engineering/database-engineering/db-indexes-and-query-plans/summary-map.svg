<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>summary map</title><desc>A map of this post in four columns. Reading plans: cost is estimated in arbitrary units, startup then total, and rows estimated against actual. Scans: index, bitmap, sequential, index-only. Designing indexes: key and include columns, composite order, selectivity. Living with them: statistics, visibility, write cost, building without blocking.</desc><defs></defs><rect width="720" height="280" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">The post on one page</text><rect x="20" y="56" width="164" height="44" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="102" y="82.73" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Reading plans</text><rect x="20" y="108" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="102" y="127.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Cost isn't milliseconds</text><rect x="20" y="148" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="102" y="167.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Startup, then total</text><rect x="20" y="188" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="102" y="207.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Estimated vs actual rows</text><rect x="192" y="56" width="164" height="44" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="274" y="82.73" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Scans</text><rect x="192" y="108" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="274" y="127.2" font-si
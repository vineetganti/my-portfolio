<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>bitmap and or</title><desc>Combining two indexes. A bitmap from the index on a and a bitmap from the index on b are combined before the table is read. AND keeps pages marked in both, which leaves very few. OR keeps pages marked in either, which leaves many more.</desc><defs></defs><rect width="720" height="230" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Two indexes, one trip to the heap</text><text x="20" y="79" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start">a = 70</text><rect x="150" y="60" width="22" height="28" rx="3" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><rect x="176" y="60" width="22" height="28" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="202" y="60" width="22" height="28" rx="3" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><rect x="228" y="60" width="22" height="28" rx="3" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><rect x="254" y="60" width="22" height="28" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="280" y="60" width="22" height="28" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="306" y="60" width="22" height="28" rx="3" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><rect x="332" y="60" width="22" height="28" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="20" y="115" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start">b = 40</text><rect x="150" y="96" width="22" height="28" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="176" y="96" width="22" height="28" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="202" y="96" width="22" height="28" rx="3" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><rect x="228" y="96" width="22" height="28" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="254" y="96" width="22" height="28" rx="3" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><rect x="280" y="96" width="22" height="28" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="306" y="96" width="22" height="28" rx="3" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><rect x="332" y="96" width="22" height="28" rx="3" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="390" y="78" font-size="13" font-weight="700" fill="#4b7d33" text-anchor="start">AND</text><text x="20" y="79" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start"></text><rect x="440" y="60" width="22" height="28" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="466" y="60" width="22" height="28" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="492" y="60" width="22" height="28" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><rect x="518" y="60" width="22" height="28" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="544" y="60" width="22" height="28" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="570" y="60" width="22" height="28" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="596" y="60" width="22" height="28" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><rect x="622" y="60" width="22" height="28" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="392" y="114" font-size="13" font-weight="700" fill="#b0273f" text-anchor="start">OR</text><rect x="440" y="96" width="22" height="28" rx="3" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="466" y="96" width="22" height="28" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="492" y="96" width="22" height="28" rx="3" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="518" y="96" width="22" height="28" rx="3" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="544" y="96" width="22" height="28" rx="3" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="570" y="96" width="22" height="28" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="596" y="96" width="22" height="28" rx="3" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="622" y="96" width="22" height="28" rx="3" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="150" y="160" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Each index is searched once, and the bits are combined in memory. AND leaves a tiny</text><text x="150" y="175.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">set of pages to read. OR leaves the union, so it does more work on every side.</text></svg>

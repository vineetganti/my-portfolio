<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>scan spectrum</title><desc>The three scans on a spectrum of how much of the table matches. Few rows: an index scan, with one random heap visit per row. A moderate share: a bitmap scan, visiting each page once in physical order. Most of the table: a sequential scan, reading every page in order.</desc><defs><marker id="ah-7a6d57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7a6d57"/></marker></defs><rect width="720" height="230" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Which scan? It depends on how much matches</text><line x1="40" y1="66" x2="680" y2="66" stroke="#7a6d57" stroke-width="1.6" marker-end="url(#ah-7a6d57)"/><text x="360" y="60" font-size="11" font-weight="700" fill="#5e5241" text-anchor="middle">more of the table matches</text><rect x="20" y="84" width="216" height="54" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="128" y="108.62" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Index Scan</text><text x="128" y="130.75" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">few rows</text><text x="24" y="158" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start">walk the index, jump to the heap</text><text x="24" y="173.525" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start">for each row</text><text x="24" y="202" font-size="11" font-weight="400" fill="#5e5241" text-anchor="start">random reads, one per row</text><rect x="252" y="84" width="216" height="54" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="360" y="108.62" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Bitmap Heap Scan</text><text x="360" y="130.75" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">a moderate share</text><text x="256" y="158" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start">note the pages first, then read</text><text x="256" y="173.525" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start">each page once</text><text x="256" y="202" font-size="11" font-weight="400" fill="#5e5241" text-anchor="start">sorted reads, each page once</text><rect x="484" y="84" width="216" height="54" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="592" y="108.62" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Seq Scan</text><text x="592" y="130.75" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">most of the table</text><text x="488" y="158" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start">read every page in order, filter</text><text x="488" y="173.525" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start">as you go</text><text x="488" y="202" font-size="11" font-weight="400" fill="#5e5241" text-anchor="start">sequential reads, no index</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>composite order</title><desc>A composite index on a and b is sorted by a, then by b within each a. Rows with a equal to 1 sit together, in b order, so a search on a is one range, and a search on a and b is a single point. A search on b alone has no single range: matching entries are scattered across every value of a.</desc><defs></defs><rect width="720" height="280" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Why column order matters in a composite index</text><text x="20" y="44" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Entries are sorted by a, then by b within each a.</text><rect x="20" y="66" width="78" height="40" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="59" y="90.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">1, 2</text><rect x="106" y="66" width="78" height="40" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="145" y="90.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">1, 5</text><rect x="192" y="66" width="78" height="40" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="231" y="90.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">1, 9</text><rect x="278" y="66" width="78" height="40" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="317" y="90.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">2, 1</text><rect x="364" y="66" width="78" height="40" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="403" y="90.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">2, 5</text><rect x="450" y="66" width="78" height="40" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="489" y="90.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">3, 3</text><rect x="536" y="66" width="78" height="40" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="575" y="90.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">3, 5</text><rect x="622" y="66" width="78" height="40" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="661" y="90.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">3, 8</text><text x="20" y="134" font-size="12" font-weight="700" fill="#9a5400" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">WHERE a = 2</text><text x="160" y="134" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Adjacent entries: one range. Fast.</text><text x="20" y="160" font-size="12" font-weight="700" fill="#4b7d33" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">WHERE a = 2 AND b = 5</text><text x="200" y="160" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">A single point: the best case.</text><text x="20" y="186" font-size="12" font-weight="700" fill="#b0273f" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">WHERE b = 5</text><text x="160" y="186" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Scattered, one per value of a. Before Postgres 18 the index was little use. Now a skip</text><text x="160" y="201.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">scan can jump between values of a, if there are few of them.</text></svg>

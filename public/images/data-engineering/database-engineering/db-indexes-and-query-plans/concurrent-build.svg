<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>concurrent build</title><desc>The phases of CREATE INDEX CONCURRENTLY. First the index is registered as invalid, so writes begin to maintain it. Then one table scan builds it, and a second scan adds what changed during the first. Between phases it waits for older transactions. Only then is it marked valid. A failure leaves an invalid index behind.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="240" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">CREATE INDEX CONCURRENTLY: more steps, no write lock</text><rect x="20" y="74" width="124" height="78" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="82" y="103.52" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Register</text><text x="82" y="125.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">invalid, writers</text><text x="82" y="139.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">start updating it</text><rect x="160" y="74" width="124" height="78" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="222" y="103.52" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Scan 1</text><text x="222" y="125.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">build from a</text><text x="222" y="139.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">snapshot</text><line x1="144" y1="113" x2="160" y2="113" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="300" y="74" width="124" height="78" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="362" y="103.52" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Scan 2</text><text x="362" y="125.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">add what changed</text><text x="362" y="139.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">during scan 1</text><line x1="284" y1="113" x2="300" y2="113" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="440" y="74" width="124" height="78" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="502" y="103.52" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Wait</text><text x="502" y="125.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">older transactions</text><text x="502" y="139.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">must finish</text><line x1="424" y1="113" x2="440" y2="113" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="580" y="74" width="124" height="78" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="642" y="110.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Valid</text><text x="642" y="132.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">queries can use it</text><line x1="564" y1="113" x2="580" y2="113" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="20" y="186" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">It reads the table twice and waits for other transactions, so it takes longer. If it fails, for example on a</text><text x="20" y="201.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">duplicate in a unique index, the half-built index stays behind, marked INVALID, and must be dropped.</text></svg>

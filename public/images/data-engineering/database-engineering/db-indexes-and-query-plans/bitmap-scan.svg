<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>bitmap scan</title><desc>How a bitmap scan works. Phase one walks the index and sets a bit for each heap page that holds a match, without touching the table. Phase two reads only the marked pages, in order, each one once, and rechecks the condition, because a page holds other rows too.</desc><defs><marker id="ah-9a5400" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a5400"/></marker><marker id="ah-4b7d33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b7d33"/></marker></defs><rect width="720" height="280" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">A bitmap scan works in two phases</text><rect x="20" y="90" width="130" height="64" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="85" y="119.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">index</text><text x="85" y="141.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">x &lt; 2000</text><text x="220" y="76" font-size="11.5" font-weight="700" fill="#9a5400" text-anchor="start">phase 1: a bit per heap page</text><rect x="220" y="90" width="24" height="30" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="232" y="110" font-size="12" font-weight="700" fill="#7a6d57" text-anchor="middle">0</text><rect x="248" y="90" width="24" height="30" rx="3" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="260" y="110" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">1</text><rect x="276" y="90" width="24" height="30" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="288" y="110" font-size="12" font-weight="700" fill="#7a6d57" text-anchor="middle">0</text><rect x="304" y="90" width="24" height="30" rx="3" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="316" y="110" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">1</text><rect x="332" y="90" width="24" height="30" rx="3" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="344" y="110" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">1</text><rect x="360" y="90" width="24" height="30" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="372" y="110" font-size="12" font-weight="700" fill="#7a6d57" text-anchor="middle">0</text><rect x="388" y="90" width="24" height="30" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="400" y="110" font-size="12" font-weight="700" fill="#7a6d57" text-anchor="middle">0</text><rect x="416" y="90" width="24" height="30" rx="3" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="428" y="110" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">1</text><line x1="150" y1="122" x2="218" y2="105" stroke="#9a5400" stroke-width="1.6" marker-end="url(#ah-9a5400)"/><text x="220" y="246" font-size="11.5" font-weight="700" fill="#4b7d33" text-anchor="start">phase 2: read marked pages, in order, once each</text><rect x="220" y="182" width="24" height="44" rx="3" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><rect x="248" y="182" width="24" height="44" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><line x1="260" y1="122" x2="260" y2="180" stroke="#4b7d33" stroke-width="1.2" marker-end="url(#ah-4b7d33)"/><rect x="276" y="182" width="24" height="44" rx="3" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><rect x="304" y="182" width="24" height="44" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><line x1="316" y1="122" x2="316" y2="180" stroke="#4b7d33" stroke-width="1.2" marker-end="url(#ah-4b7d33)"/><rect x="332" y="182" width="24" height="44" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><line x1="344" y1="122" x2="344" y2="180" stroke="#4b7d33" stroke-width="1.2" marker-end="url(#ah-4b7d33)"/><rect x="360" y="182" width="24" height="44" rx="3" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><rect x="388" y="182" width="24" height="44" rx="3" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><rect x="416" y="182" width="24" height="44" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><line x1="428" y1="122" x2="428" y2="180" stroke="#4b7d33" stroke-width="1.2" marker-end="url(#ah-4b7d33)"/><text x="470" y="96" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">No table access yet. Bitmaps from two</text><text x="470" y="111.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">indexes can be ANDed or ORed here.</text><text x="470" y="190" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">A page holds other rows, so each row</text><text x="470" y="205.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">is rechecked. That's the Recheck Cond</text><text x="470" y="221.05" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">line in EXPLAIN.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>index as a book</title><desc>An index compared with the phone book. Finding a name in the table without an index means reading every page. With an index, a small sorted structure points straight to the row's page, and only that page is read.</desc><defs><marker id="ah-9a5400" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a5400"/></marker></defs><rect width="720" height="250" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Why an index helps: read less</text><text x="20" y="62" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">No index: read every page</text><rect x="20" y="72" width="24" height="34" rx="3" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="50" y="72" width="24" height="34" rx="3" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="80" y="72" width="24" height="34" rx="3" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="110" y="72" width="24" height="34" rx="3" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="140" y="72" width="24" height="34" rx="3" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="170" y="72" width="24" height="34" rx="3" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="200" y="72" width="24" height="34" rx="3" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="230" y="72" width="24" height="34" rx="3" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="260" y="72" width="24" height="34" rx="3" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="290" y="72" width="24" height="34" rx="3" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="20" y="128" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">The database checks each row in turn, and finds</text><text x="20" y="143.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">that rows match only by reading them.</text><text x="380" y="62" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">With an index: follow a sorted structure</text><rect x="380" y="72" width="120" height="44" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="440" y="91.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">index</text><text x="440" y="113.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">sorted, small</text><rect x="380" y="146" width="24" height="34" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="410" y="146" width="24" height="34" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="440" y="146" width="24" height="34" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="470" y="146" width="24" height="34" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="500" y="146" width="24" height="34" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="530" y="146" width="24" height="34" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="560" y="146" width="24" height="34" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><rect x="590" y="146" width="24" height="34" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="620" y="146" width="24" height="34" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="650" y="146" width="24" height="34" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><path d="M500 94 L572 94 L572 144" fill="none" stroke="#9a5400" stroke-width="1.6" marker-end="url(#ah-9a5400)"/><text x="572" y="88" font-size="11" font-weight="700" fill="#9a5400" text-anchor="middle">row address</text><text x="380" y="204" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">A few index pages, then one heap page, instead of the</text><text x="380" y="219.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">whole table. The price: an index takes space, and</text><text x="380" y="235.05" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">every write has to update it.</text></svg>

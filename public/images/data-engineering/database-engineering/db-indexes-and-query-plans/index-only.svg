<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>index only</title><desc>An index-only scan. The index has the value, but it doesn't know whether that row version is visible to this transaction. So it checks the visibility map, one bit per heap page. If the page is all-visible the answer comes straight from the index. If not, the scan visits the heap, and EXPLAIN counts that as a heap fetch.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-4b7d33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b7d33"/></marker><marker id="ah-b0273f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b0273f"/></marker></defs><rect width="720" height="260" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Why an index-only scan can still visit the table</text><rect x="20" y="90" width="140" height="66" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="90" y="113.52" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">index</text><text x="90" y="135.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">has the value, not its</text><text x="90" y="149.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">visibility</text><rect x="230" y="90" width="160" height="66" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="310" y="120.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">visibility map</text><text x="310" y="142.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">one bit per heap page</text><rect x="470" y="60" width="230" height="54" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="585" y="84.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">answer from the index</text><text x="585" y="106.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Heap Fetches stays 0</text><rect x="470" y="150" width="230" height="54" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="585" y="174.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">visit the heap</text><text x="585" y="196.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Heap Fetches goes up</text><line x1="160" y1="123" x2="230" y2="123" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="390" y1="110" x2="468" y2="90" stroke="#4b7d33" stroke-width="1.6" marker-end="url(#ah-4b7d33)"/><text x="423" y="88" font-size="11" font-weight="700" fill="#4b7d33" text-anchor="middle">all-visible</text><line x1="390" y1="136" x2="468" y2="176" stroke="#b0273f" stroke-width="1.6" marker-end="url(#ah-b0273f)"/><text x="415" y="174" font-size="11" font-weight="700" fill="#b0273f" text-anchor="middle">not set</text><text x="20" y="222" font-size="11.5" font-weight="700" fill="#5e5241" text-anchor="start">VACUUM sets the bits. Any write to a page clears its bit.</text></svg>

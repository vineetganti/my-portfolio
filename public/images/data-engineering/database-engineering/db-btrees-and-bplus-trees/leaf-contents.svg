<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>leaf contents</title><desc>What a leaf entry holds in each design. A Postgres index leaf holds the key and a 6-byte heap address. An InnoDB secondary index leaf holds the key and the whole primary key. An InnoDB primary key leaf holds the key and the entire row. So a wide primary key inflates every secondary index in InnoDB.</desc><defs></defs><rect width="720" height="240" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">What's in a leaf entry</text><text x="20" y="82" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start">Postgres, any index</text><rect x="250" y="58" width="90" height="38" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="295" y="81.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">key</text><rect x="344" y="58" width="150" height="38" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="419" y="81.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">heap address, 6 bytes</text><text x="20" y="132" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start">InnoDB, secondary index</text><rect x="250" y="108" width="90" height="38" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="295" y="131.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">key</text><rect x="344" y="108" width="240" height="38" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="464" y="131.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">primary key value</text><text x="20" y="182" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start">InnoDB, primary key</text><rect x="250" y="158" width="90" height="38" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="295" y="181.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">key</text><rect x="344" y="158" width="340" height="38" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="514" y="181.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">the whole row</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>btree vs bplus</title><desc>The same keys in both structures. In a B-tree every node holds keys and values, so internal pages carry values that a search only passes through. In a B+tree internal pages hold keys alone and fit many more per page, while all the values sit in the leaves, which are linked to each other.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-4b7d33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b7d33"/></marker></defs><rect width="720" height="320" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Where the values live</text><text x="20" y="54" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">B-Tree: values in every node</text><rect x="100" y="66" width="130" height="40" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="165" y="90.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">4 + value</text><rect x="20" y="150" width="130" height="40" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="85" y="174.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">2 + value</text><rect x="180" y="150" width="130" height="40" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="245" y="174.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">6 + value</text><line x1="140" y1="106" x2="90" y2="148" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="190" y1="106" x2="240" y2="148" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="20" y="216" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">A search reads values it doesn't want on the way</text><text x="20" y="231.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">down. Fewer keys fit per page, so the tree is</text><text x="20" y="247.05" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">taller.</text><text x="380" y="54" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">B+Tree: keys route, leaves hold values</text><rect x="480" y="66" width="90" height="40" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="525" y="90.2" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">4</text><rect x="380" y="150" width="100" height="40" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="430" y="167.76" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">2, 3</text><text x="430" y="187.52" font-size="9.5" font-weight="400" fill="#5e5241" text-anchor="middle">+ values</text><rect x="490" y="150" width="100" height="40" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="540" y="167.76" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">4, 5</text><text x="540" y="187.52" font-size="9.5" font-weight="400" fill="#5e5241" text-anchor="middle">+ values</text><rect x="600" y="150" width="100" height="40" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="650" y="167.76" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">6, 7</text><text x="650" y="187.52" font-size="9.5" font-weight="400" fill="#5e5241" text-anchor="middle">+ values</text><line x1="510" y1="106" x2="430" y2="148" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="530" y1="106" x2="540" y2="148" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="550" y1="106" x2="650" y2="148" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="480" y1="170" x2="490" y2="170" stroke="#4b7d33" stroke-width="1.6" marker-start="url(#ah-4b7d33)" marker-end="url(#ah-4b7d33)"/><line x1="590" y1="170" x2="600" y2="170" stroke="#4b7d33" stroke-width="1.6" marker-start="url(#ah-4b7d33)" marker-end="url(#ah-4b7d33)"/><text x="380" y="216" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Internal pages are slim and stay in memory. Keys are</text><text x="380" y="231.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">repeated in the leaves, a small price. A range is one</text><text x="380" y="247.05" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">walk along the leaf links.</text><line x1="350" y1="40" x2="350" y2="300" stroke="#7a6d57" stroke-width="1" stroke-dasharray="3 4"/></svg>

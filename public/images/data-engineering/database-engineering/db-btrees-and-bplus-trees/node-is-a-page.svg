<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>node is a page</title><desc>One B-tree node is one disk page. The page holds keys, each with its value, and pointers down to child pages. A node with three children holds two elements. The search rule: go left of a key for smaller values, right for larger.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="280" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">One node is one page</text><text x="20" y="44" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Textbooks draw two keys. A real page holds hundreds.</text><rect x="150" y="70" width="420" height="76" rx="8" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="160" y="90" font-size="11" font-weight="700" fill="#9a5400" text-anchor="start">page 7 (a node with 3 children holds 2 elements)</text><rect x="214" y="98" width="126" height="40" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="277" y="115.75" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">key 20</text><text x="277" y="135.52" font-size="9.5" font-weight="400" fill="#5e5241" text-anchor="middle">+ the row's address</text><rect x="366" y="98" width="126" height="40" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="429" y="115.75" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">key 40</text><text x="429" y="135.52" font-size="9.5" font-weight="400" fill="#5e5241" text-anchor="middle">+ the row's address</text><line x1="176" y1="146" x2="100" y2="212" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="40" y="214" width="120" height="44" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="100" y="233.09" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">child page 1</text><text x="100" y="253.73" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">keys &lt; 20</text><line x1="352" y1="146" x2="360" y2="212" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="300" y="214" width="120" height="44" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="360" y="233.09" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">child page 2</text><text x="360" y="253.73" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">keys 20 to 40</text><line x1="530" y1="146" x2="620" y2="212" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><rect x="560" y="214" width="120" height="44" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="620" y="233.09" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">child page 3</text><text x="620" y="253.73" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">keys &gt; 40</text></svg>

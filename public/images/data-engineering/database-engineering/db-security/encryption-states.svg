<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>encryption states</title><desc>Data in three states. In transit, TLS protects it on the wire. At rest, disk or file encryption protects it in storage. In use, the database must normally decrypt it to compute, and that's the gap homomorphic encryption tries to close.</desc><defs></defs><rect width="720" height="230" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Three places data can be exposed</text><rect x="20" y="60" width="216" height="54" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="128" y="84.47" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">In transit</text><text x="128" y="107.53" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">On the wire</text><text x="24" y="140" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">TLS</text><rect x="252" y="60" width="216" height="54" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="360" y="84.47" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">At rest</text><text x="360" y="107.53" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">On the disk</text><text x="256" y="140" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">Disk or file encryption</text><rect x="484" y="60" width="216" height="54" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="592" y="84.47" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">In use</text><text x="592" y="107.53" font-size="11" font-weight="400" fill="#5e5241" text-anchor="middle">While being computed on</text><text x="488" y="140" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">Normally plain, in memory</text><text x="20" y="188" font-size="12" font-weight="400" fill="#5e5241" text-anchor="start">Homomorphic encryption works on the third row: computing on data that stays encrypted.</text></svg>

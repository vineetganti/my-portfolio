<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>summary map</title><desc>A map of this post in four columns. Encryption: TLS needs a certificate, and hostssl to enforce it. The wire: SCRAM hides the password, but without TLS queries are plain text. Least privilege: separate roles, with sequence and select rights you might miss. Beyond: compute on encrypted data, at a high cost.</desc><defs></defs><rect width="720" height="280" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">The post on one page</text><rect x="20" y="56" width="164" height="44" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="102" y="82.55" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">TLS</text><rect x="20" y="108" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="102" y="127.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">ssl = on and a key</text><rect x="20" y="148" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="102" y="167.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">hostssl makes it required</text><rect x="20" y="188" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="102" y="207.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Verify the certificate</text><rect x="192" y="56" width="164" height="44" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="274" y="82.55" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">The wire</text><rect x="192" y="108" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="274" y="127.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Passwords use SCRAM</text><rect x="192" y="148" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="274" y="167.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Queries are plain text</text><rect x="192" y="188" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="274" y="207.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Errors can say too much</text><rect x="364" y="56" width="164" height="44" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="446" y="82.55" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Least privilege</text><rect x="364" y="108" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="446" y="127.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">A pool per role</text><rect x="364" y="148" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="446" y="167.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">USAGE on the sequence</text><rect x="364" y="188" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="446" y="207.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">DELETE WHERE needs SELECT</text><rect x="536" y="56" width="164" height="44" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="618" y="82.55" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Encrypted compute</text><rect x="536" y="108" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="618" y="127.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Add without decrypting</text><rect x="536" y="148" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="618" y="167.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Works, and it's costly</text><rect x="536" y="188" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="618" y="207.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Not a database feature yet</text></svg>

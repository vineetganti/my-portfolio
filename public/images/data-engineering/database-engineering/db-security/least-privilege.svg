<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>least privilege</title><desc>Three pools for three roles. The read route uses a pool logged in as a role that can only select. The create route uses a role that can only insert, and the delete route a role that can only delete. A SQL injection in the read route can't drop or change anything.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="260" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">One pool per role</text><rect x="570" y="90" width="130" height="80" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="635" y="134.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">todos</text><rect x="20" y="56" width="150" height="48" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="95" y="84.02" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">GET /todos</text><rect x="230" y="56" width="180" height="48" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="320" y="77.27" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">dbread</text><text x="320" y="98.41" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">only SELECT</text><line x1="170" y1="80" x2="230" y2="80" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="410" y1="80" x2="568" y2="130" stroke="#5e5241" stroke-width="1.2" marker-end="url(#ah-5e5241)"/><rect x="20" y="118" width="150" height="48" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="95" y="146.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">POST /todos</text><rect x="230" y="118" width="180" height="48" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="320" y="139.27" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">dbcreate</text><text x="320" y="160.41" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">only INSERT</text><line x1="170" y1="142" x2="230" y2="142" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="410" y1="142" x2="568" y2="130" stroke="#5e5241" stroke-width="1.2" marker-end="url(#ah-5e5241)"/><rect x="20" y="180" width="150" height="48" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="95" y="208.03" font-size="11.5" font-weight="700" fill="#2f281e" text-anchor="middle">DELETE /todos</text><rect x="230" y="180" width="180" height="48" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="320" y="201.27" font-size="12" font-weight="700" fill="#2f281e" text-anchor="middle">dbdelete</text><text x="320" y="222.41" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">only DELETE</text><line x1="170" y1="204" x2="230" y2="204" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="410" y1="204" x2="568" y2="130" stroke="#5e5241" stroke-width="1.2" marker-end="url(#ah-5e5241)"/></svg>

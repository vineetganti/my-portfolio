<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>startup flow</title><desc>How a Postgres connection starts. The TCP handshake comes first. The client may ask for TLS. Then it sends a startup message with its user and database, the server asks for authentication, they exchange SCRAM messages, and the server sends its settings and says it's ready for queries.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-9a5400" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a5400"/></marker><marker id="ah-4b7d33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b7d33"/></marker></defs><rect width="720" height="300" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">A conversation before the first query</text><rect x="40" y="54" width="120" height="40" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="100" y="78.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">client</text><rect x="560" y="54" width="120" height="40" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="620" y="78.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">server</text><line x1="100" y1="94" x2="100" y2="280" stroke="#7a6d57" stroke-width="1"/><line x1="620" y1="94" x2="620" y2="280" stroke="#7a6d57" stroke-width="1"/><line x1="102" y1="116" x2="618" y2="116" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="360" y="112" font-size="11" font-weight="700" fill="#5e5241" text-anchor="middle">TCP handshake</text><line x1="102" y1="144" x2="618" y2="144" stroke="#9a5400" stroke-width="1.6" marker-end="url(#ah-9a5400)"/><text x="360" y="140" font-size="11" font-weight="700" fill="#9a5400" text-anchor="middle">StartupMessage: user, database</text><line x1="618" y1="172" x2="102" y2="172" stroke="#9a5400" stroke-width="1.6" marker-end="url(#ah-9a5400)"/><text x="360" y="168" font-size="11" font-weight="700" fill="#9a5400" text-anchor="middle">AuthenticationSASL: use SCRAM</text><line x1="102" y1="200" x2="618" y2="200" stroke="#4b7d33" stroke-width="1.6" marker-end="url(#ah-4b7d33)"/><text x="360" y="196" font-size="11" font-weight="700" fill="#4b7d33" text-anchor="middle">SCRAM exchange, no password sent</text><line x1="618" y1="228" x2="102" y2="228" stroke="#4b7d33" stroke-width="1.6" marker-end="url(#ah-4b7d33)"/><text x="360" y="224" font-size="11" font-weight="700" fill="#4b7d33" text-anchor="middle">AuthenticationOk, settings</text><line x1="618" y1="256" x2="102" y2="256" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="360" y="252" font-size="11" font-weight="700" fill="#5e5241" text-anchor="middle">ReadyForQuery</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>heap vs clustered</title><desc>Two ways to find a row by a secondary key. In Postgres every index is separate from the heap: the index entry holds the row's address, and one more step reads the row from the heap. In InnoDB the table is itself a tree ordered by primary key: a secondary index entry holds the primary key value, and a second tree walk finds the row inside the clustered index.</desc><defs><marker id="ah-9a5400" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a5400"/></marker></defs><rect width="720" height="300" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Finding a row by email</text><text x="20" y="56" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">Postgres: a heap and separate indexes</text><rect x="20" y="70" width="150" height="70" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="95" y="95.52" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">email index</text><text x="95" y="117.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">entry: email → (page,</text><text x="95" y="131.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">item)</text><rect x="220" y="70" width="130" height="70" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="285" y="102.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">heap</text><text x="285" y="124.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">rows, in no order</text><line x1="170" y1="105" x2="220" y2="105" stroke="#9a5400" stroke-width="1.6" marker-end="url(#ah-9a5400)"/><text x="195" y="99" font-size="11" font-weight="700" fill="#9a5400" text-anchor="middle">ctid</text><text x="20" y="170" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">The address is physical. If the row moves, every index</text><text x="20" y="185.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">on the table may need a new entry.</text><text x="390" y="56" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">InnoDB: the table is the primary key's tree</text><rect x="390" y="70" width="140" height="70" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="460" y="95.52" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">email index</text><text x="460" y="117.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">entry: email → primary</text><text x="460" y="131.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">key</text><rect x="570" y="70" width="130" height="70" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="635" y="95.52" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">primary key tree</text><text x="635" y="117.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">leaf pages hold</text><text x="635" y="131.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">whole rows</text><line x1="530" y1="105" x2="570" y2="105" stroke="#9a5400" stroke-width="1.6" marker-end="url(#ah-9a5400)"/><text x="550" y="99" font-size="11" font-weight="700" fill="#9a5400" text-anchor="middle">id</text><text x="390" y="170" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">The address is logical. Rows can move freely, and</text><text x="390" y="185.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">every secondary lookup pays a second tree walk. A</text><text x="390" y="201.05" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">wide primary key makes every index wider.</text><line x1="372" y1="40" x2="372" y2="280" stroke="#7a6d57" stroke-width="1" stroke-dasharray="3 4"/></svg>

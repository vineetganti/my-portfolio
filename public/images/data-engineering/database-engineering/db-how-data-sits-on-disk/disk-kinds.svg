<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>disk kinds</title><desc>Two kinds of disk. A hard disk reads and writes sectors, and moves a head to reach them, so random access is slow. An SSD has no moving parts, reads and writes pages inside erase blocks, can't overwrite a page in place, and remaps writes to fresh pages, wearing out cells slowly.</desc><defs></defs><rect width="720" height="260" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">What's under the page</text><rect x="20" y="60" width="330" height="170" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="185" y="84" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Hard disk (HDD)</text><circle cx="90" cy="150" r="52" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><circle cx="90" cy="150" r="30" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><circle cx="90" cy="150" r="6" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><line x1="90" y1="150" x2="150" y2="108" stroke="#9a5400" stroke-width="2.5"/><text x="166" y="110" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">A spinning platter and a</text><text x="166" y="125.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">moving head. Reads are</text><text x="166" y="141.05" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">addressed by block, and a</text><text x="166" y="156.575" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">far-away block costs a seek.</text><text x="166" y="172.1" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Rewriting the same block is</text><text x="166" y="187.625" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">fine.</text><rect x="370" y="60" width="330" height="170" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="535" y="84" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">Solid-state drive (SSD)</text><rect x="386" y="104" width="64" height="92" rx="4" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><rect x="392" y="110" width="52" height="16" rx="2" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="392" y="131" width="52" height="16" rx="2" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="392" y="152" width="52" height="16" rx="2" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="392" y="173" width="52" height="16" rx="2" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="458" y="104" width="64" height="92" rx="4" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><rect x="464" y="110" width="52" height="16" rx="2" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="464" y="131" width="52" height="16" rx="2" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="464" y="152" width="52" height="16" rx="2" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><rect x="464" y="173" width="52" height="16" rx="2" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="386" y="210" font-size="10" font-weight="400" fill="#7a6d57" text-anchor="start">erase block</text><text x="536" y="110" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">No moving parts, so random</text><text x="536" y="125.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">reads are cheap. A page</text><text x="536" y="141.05" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">can't be overwritten: a</text><text x="536" y="156.575" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">rewrite goes to a fresh</text><text x="536" y="172.1" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">page, and the old one</text><text x="536" y="187.625" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">waits for its block to be</text><text x="536" y="203.15" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">erased.</text></svg>

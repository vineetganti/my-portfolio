<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>read path</title><desc>The path of a read. The query asks the buffer pool for a page. If the page is there, no I/O happens. Otherwise the database asks the operating system for the file, offset and length. The OS checks its own file cache, and only on a miss does the read reach the disk. The page travels back up into the buffer pool.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker></defs><rect width="720" height="250" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">A read tries two caches before it reaches the disk</text><rect x="20" y="90" width="110" height="70" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="75" y="122.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">query</text><text x="75" y="144.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">needs row 42</text><rect x="180" y="90" width="150" height="70" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="255" y="122.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">buffer pool</text><text x="255" y="144.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">the database's memory</text><rect x="380" y="90" width="140" height="70" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="450" y="122.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">OS file cache</text><text x="450" y="144.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">the kernel's memory</text><rect x="570" y="90" width="130" height="70" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="635" y="115.52" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">disk</text><text x="635" y="137.15" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">file + offset +</text><text x="635" y="151.01" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">length</text><line x1="130" y1="125" x2="180" y2="125" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="155" y="119" font-size="11" font-weight="700" fill="#5e5241" text-anchor="middle">page?</text><line x1="330" y1="125" x2="380" y2="125" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="355" y="119" font-size="11" font-weight="700" fill="#5e5241" text-anchor="middle">miss</text><line x1="520" y1="125" x2="570" y2="125" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="545" y="119" font-size="11" font-weight="700" fill="#5e5241" text-anchor="middle">miss</text><text x="180" y="186" font-size="11" font-weight="700" fill="#4b7d33" text-anchor="start">Found here: no I/O at all</text><text x="380" y="186" font-size="11" font-weight="700" fill="#9a5400" text-anchor="start">Found here: an I/O call,</text><text x="380" y="200.85" font-size="11" font-weight="700" fill="#9a5400" text-anchor="start">but no disk read</text><text x="570" y="186" font-size="11" font-weight="700" fill="#b0273f" text-anchor="start">Found here: a real</text><text x="570" y="200.85" font-size="11" font-weight="700" fill="#b0273f" text-anchor="start">read, the slow case</text></svg>

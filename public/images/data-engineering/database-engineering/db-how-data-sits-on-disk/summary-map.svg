<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>summary map</title><desc>A map of this post in four columns. Pages: fixed size, the unit of every read and write, and an address of file plus offset. Inside a page: header, line pointers, rows, special space. Tables: a heap with separate indexes in Postgres, a clustered tree in InnoDB. Layout: row stores for transactions, column stores for analytics.</desc><defs></defs><rect width="720" height="280" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">The post on one page</text><rect x="20" y="56" width="164" height="44" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="102" y="82.73" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Pages</text><rect x="20" y="108" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="102" y="127.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Fixed size: 8 KB or 16 KB</text><rect x="20" y="148" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="102" y="167.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">The unit of every I/O</text><rect x="20" y="188" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="102" y="207.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">file + page × size</text><rect x="192" y="56" width="164" height="44" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="274" y="82.73" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Inside a page</text><rect x="192" y="108" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="274" y="127.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Header, pointers, rows</text><rect x="192" y="148" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="274" y="167.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">ctid = page, pointer</text><rect x="192" y="188" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="274" y="207.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Updates add versions</text><rect x="364" y="56" width="164" height="44" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="446" y="82.73" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Tables</text><rect x="364" y="108" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="446" y="127.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Postgres: heap + indexes</text><rect x="364" y="148" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="446" y="160.27" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">InnoDB: clustered on the</text><text x="446" y="174.13" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">key</text><rect x="364" y="188" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="446" y="207.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Secondary: address or key</text><rect x="536" y="56" width="164" height="44" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="618" y="82.73" font-size="13.5" font-weight="700" fill="#2f281e" text-anchor="middle">Layout</text><rect x="536" y="108" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="618" y="127.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Row store: whole rows</text><rect x="536" y="148" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="618" y="167.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Column store: one column</text><rect x="536" y="188" width="164" height="34" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="618" y="207.2" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">Match it to the workload</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>logical to physical</title><desc>A logical table of employee rows on the left, each with an internal row id. On the right the same rows packed into fixed-size pages, three rows to a page, so that 1,001 rows need 334 pages. The collection of pages is the heap.</desc><defs><marker id="ah-9a5400" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a5400"/></marker></defs><rect width="720" height="280" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">What you see, and what's stored</text><text x="20" y="60" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start">The table you query</text><rect x="20" y="70" width="150" height="24" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="32" y="86" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1  Ana</text><rect x="20" y="98" width="150" height="24" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="32" y="114" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">2  Ben</text><rect x="20" y="126" width="150" height="24" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="32" y="142" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">3  Cara</text><rect x="20" y="154" width="150" height="24" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="32" y="170" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">4  Dev</text><rect x="20" y="182" width="150" height="24" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="32" y="198" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">5  Eli</text><rect x="20" y="210" width="150" height="24" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="32" y="226" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">6  Fay</text><line x1="180" y1="150" x2="244" y2="150" stroke="#9a5400" stroke-width="1.6" marker-end="url(#ah-9a5400)"/><text x="212" y="144" font-size="11" font-weight="700" fill="#9a5400" text-anchor="middle">stored as</text><text x="254" y="60" font-size="12" font-weight="700" fill="#2f281e" text-anchor="start">The heap: a file of fixed-size pages</text><rect x="254" y="70" width="144" height="112" rx="8" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="264" y="88" font-size="11" font-weight="700" fill="#9a5400" text-anchor="start">page 0</text><text x="266" y="110" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1  Ana</text><text x="266" y="132" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">2  Ben</text><text x="266" y="154" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">3  Cara</text><rect x="406" y="70" width="144" height="112" rx="8" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="416" y="88" font-size="11" font-weight="700" fill="#9a5400" text-anchor="start">page 1</text><text x="418" y="110" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">4  Dev</text><text x="418" y="132" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">5  Eli</text><text x="418" y="154" font-size="11.5" font-weight="400" fill="#2f281e" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">6  Fay</text><rect x="558" y="70" width="144" height="112" rx="8" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="568" y="88" font-size="11" font-weight="700" fill="#9a5400" text-anchor="start">page 2</text><text x="630" y="130" font-size="20" font-weight="400" fill="#5e5241" text-anchor="middle">…</text><text x="254" y="208" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">One read fetches a whole page, so asking for row 2 brings rows 1 and 3</text><text x="254" y="223.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">along. With 3 rows to a page, 1,001 rows need 334 pages.</text></svg>

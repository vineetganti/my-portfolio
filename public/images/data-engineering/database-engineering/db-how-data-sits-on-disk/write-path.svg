<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>write path</title><desc>The path of a write. The database reads the page into the buffer pool and changes the row in memory, which makes the page dirty. It also appends a small log record and forces that to disk, which is what makes the commit durable. The page itself stays in memory, can take many more writes, and is flushed to its file later.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-4b7d33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b7d33"/></marker></defs><rect width="720" height="250" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">A write changes memory now and the data file later</text><rect x="20" y="90" width="110" height="70" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="75" y="122.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">UPDATE</text><text x="75" y="144.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">one row</text><rect x="190" y="60" width="170" height="70" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="275" y="92.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">page in buffer pool</text><text x="275" y="114.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">dirty: differs from disk</text><rect x="190" y="160" width="170" height="60" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="275" y="187.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">log record</text><text x="275" y="209.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">small, written at commit</text><rect x="500" y="60" width="200" height="70" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="600" y="92.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">data file</text><text x="600" y="114.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">many changes, one write, later</text><rect x="500" y="160" width="200" height="60" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="600" y="187.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">WAL file</text><text x="600" y="209.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">appended and fsynced</text><line x1="130" y1="110" x2="188" y2="95" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="130" y1="140" x2="188" y2="188" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="360" y1="95" x2="500" y2="95" stroke="#5e5241" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah-5e5241)"/><text x="430" y="89" font-size="11" font-weight="700" fill="#5e5241" text-anchor="middle">at a checkpoint</text><line x1="360" y1="190" x2="500" y2="190" stroke="#4b7d33" stroke-width="1.6" marker-end="url(#ah-4b7d33)"/><text x="430" y="184" font-size="11" font-weight="700" fill="#4b7d33" text-anchor="middle">at COMMIT</text></svg>

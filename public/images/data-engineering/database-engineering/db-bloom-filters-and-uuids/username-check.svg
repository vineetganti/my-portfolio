<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>username check</title><desc>Checking whether a username exists. The request reaches the server, which looks in a small in-memory Bloom filter. A clear bit means the name is definitely free, so the server answers without touching the database. A set bit means maybe, so the server asks the database for the real answer.</desc><defs><marker id="ah-5e5241" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5e5241"/></marker><marker id="ah-9a5400" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a5400"/></marker><marker id="ah-4b7d33" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4b7d33"/></marker></defs><rect width="720" height="260" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">A Bloom filter in front of the database</text><rect x="20" y="100" width="110" height="60" rx="10" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="75" y="127.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">client</text><text x="75" y="149.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">is 'sara' taken?</text><rect x="190" y="100" width="120" height="60" rx="10" fill="#faf3e3" stroke="#5e5241" stroke-width="1.5"/><text x="250" y="134.38" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">server</text><rect x="370" y="60" width="150" height="60" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="445" y="87.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">Bloom filter</text><text x="445" y="109.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">a few KB, in memory</text><rect x="570" y="150" width="130" height="60" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="635" y="177.44" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="middle">database</text><text x="635" y="199.08" font-size="10.5" font-weight="400" fill="#5e5241" text-anchor="middle">the real answer</text><line x1="130" y1="130" x2="190" y2="130" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><text x="160" y="124" font-size="11" font-weight="700" fill="#5e5241" text-anchor="middle">GET</text><line x1="310" y1="116" x2="368" y2="96" stroke="#5e5241" stroke-width="1.6" marker-end="url(#ah-5e5241)"/><line x1="520" y1="110" x2="598" y2="148" stroke="#9a5400" stroke-width="1.6" marker-end="url(#ah-9a5400)"/><text x="603" y="119" font-size="11" font-weight="700" fill="#9a5400" text-anchor="middle">maybe: ask</text><path d="M445 122 L445 190 L250 190 L250 162" fill="none" stroke="#4b7d33" stroke-width="1.6" marker-end="url(#ah-4b7d33)"/><text x="346" y="206" font-size="11" font-weight="700" fill="#4b7d33" text-anchor="middle">definitely not: answer now</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>thrashing</title><desc>Why random keys thrash the buffer pool. With ordered keys, inserts keep hitting the same few pages at the tail of the index, and those stay in memory. With random keys, each insert needs a different page anywhere in the index, so a page has to be read in and another written out, again and again.</desc><defs></defs><rect width="720" height="280" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">The same memory, two insert patterns</text><text x="20" y="84" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">Ordered keys</text><rect x="150" y="62" width="26" height="34" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="180" y="62" width="26" height="34" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="210" y="62" width="26" height="34" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="240" y="62" width="26" height="34" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="270" y="62" width="26" height="34" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="300" y="62" width="26" height="34" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="330" y="62" width="26" height="34" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="360" y="62" width="26" height="34" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="390" y="62" width="26" height="34" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="420" y="62" width="26" height="34" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="450" y="62" width="26" height="34" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="480" y="62" width="26" height="34" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="510" y="62" width="26" height="34" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="540" y="62" width="26" height="34" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="570" y="62" width="26" height="34" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="600" y="62" width="26" height="34" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><rect x="630" y="62" width="26" height="34" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><rect x="660" y="62" width="26" height="34" rx="3" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="150" y="116" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Inserts land on the last pages, which stay in memory until they're full. Each page is</text><text x="150" y="131.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">written once.</text><text x="20" y="178" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">Random keys</text><rect x="150" y="156" width="26" height="34" rx="3" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="180" y="156" width="26" height="34" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="210" y="156" width="26" height="34" rx="3" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="240" y="156" width="26" height="34" rx="3" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="270" y="156" width="26" height="34" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="300" y="156" width="26" height="34" rx="3" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="330" y="156" width="26" height="34" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="360" y="156" width="26" height="34" rx="3" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="390" y="156" width="26" height="34" rx="3" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="420" y="156" width="26" height="34" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="450" y="156" width="26" height="34" rx="3" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="480" y="156" width="26" height="34" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="510" y="156" width="26" height="34" rx="3" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="540" y="156" width="26" height="34" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="570" y="156" width="26" height="34" rx="3" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="600" y="156" width="26" height="34" rx="3" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><rect x="630" y="156" width="26" height="34" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><rect x="660" y="156" width="26" height="34" rx="3" fill="#fffdf8" stroke="#5e5241" stroke-width="1.5"/><text x="150" y="210" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">Inserts land anywhere, so nearly every page is needed sooner or later. Once the index</text><text x="150" y="225.525" font-size="11.5" font-weight="400" fill="#5e5241" text-anchor="start">outgrows memory, each insert may read one page in and push another out.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>uuid anatomy</title><desc>The bit layout of three kinds of identifier. UUIDv4 is 122 random bits, so consecutive values have no order. UUIDv7 starts with a 48-bit timestamp in milliseconds followed by random bits. ULID also starts with a 48-bit timestamp, followed by 80 random bits. Time-first identifiers sort in creation order.</desc><defs></defs><rect width="720" height="250" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Three 128-bit identifiers</text><text x="20" y="83" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">UUIDv4</text><rect x="110" y="60" width="590" height="36" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="405" y="81.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">122 random bits (and 6 fixed)</text><text x="20" y="135" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">UUIDv7</text><rect x="110" y="112" width="220" height="36" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="220" y="133.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">48-bit time, ms</text><rect x="333" y="112" width="56" height="36" rx="10" fill="#f3eadb" stroke="#7a6d57" stroke-width="1.5"/><text x="361" y="133.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">version</text><rect x="392" y="112" width="308" height="36" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="546" y="133.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">random bits</text><text x="20" y="187" font-size="12.5" font-weight="700" fill="#2f281e" text-anchor="start">ULID</text><rect x="110" y="164" width="220" height="36" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="220" y="185.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">48-bit time, ms</text><rect x="333" y="164" width="367" height="36" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="516.5" y="185.85" font-size="11" font-weight="700" fill="#2f281e" text-anchor="middle">80 random bits</text><text x="110" y="222" font-size="11.5" font-weight="700" fill="#5e5241" text-anchor="start">Green sorts by creation time. New values land next to each other at the end of an index.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>billion row ladder</title><desc>A ladder of options for a billion-row table, in the order to try them. First avoid it with a better design. Then index the columns you search. Then partition the table within one server. Then shard across servers. Last, brute-force it in parallel, which only suits analytical work.</desc><defs></defs><rect width="720" height="300" fill="#fffdf8"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2f281e" text-anchor="start">Five ways to deal with a billion rows, in order</text><rect x="20" y="52" width="190" height="40" rx="10" fill="#dfedcc" stroke="#4b7d33" stroke-width="1.5"/><text x="115" y="76.55" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">1  Avoid it</text><text x="226" y="77" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">Does this table need to exist in this shape?</text><rect x="46" y="100" width="190" height="40" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="141" y="124.55" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">2  Index it</text><text x="252" y="125" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">Search a small structure, not the table</text><rect x="72" y="148" width="190" height="40" rx="10" fill="#fdf0d4" stroke="#9a5400" stroke-width="1.5"/><text x="167" y="172.55" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">3  Partition it</text><text x="278" y="173" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">Smaller pieces on one server, invisible to clients</text><rect x="98" y="196" width="190" height="40" rx="10" fill="#fde3ad" stroke="#9a5400" stroke-width="1.5"/><text x="193" y="220.55" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">4  Shard it</text><text x="304" y="221" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">Pieces on many servers, and clients must know</text><rect x="124" y="244" width="190" height="40" rx="10" fill="#fbd8d1" stroke="#b0273f" stroke-width="1.5"/><text x="219" y="268.55" font-size="13" font-weight="700" fill="#2f281e" text-anchor="middle">5  Brute force</text><text x="330" y="269" font-size="12" font-weight="400" fill="#2f281e" text-anchor="start">Scan in parallel, for analytics, not transactions</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 306" width="720" height="306" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Padding and the attention mask</title><desc>Two sequences of different lengths are padded to the same length. The attention mask has 1 for real tokens and 0 for padding, and masked positions get a very large negative score before softmax.</desc><defs></defs><rect width="720" height="306" fill="#ffffff"/><text x="130" y="34" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="start" font-style="italic">tokens, padded to the same length</text><text x="20" y="72" font-size="13" font-weight="700" fill="#2c361c" text-anchor="start">Sequence A</text><rect x="130" y="46" width="108" height="40" rx="8" fill="#f3e5ab" stroke="#4f5d36" stroke-width="1.3"/><text x="184" y="71" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">[bos]</text><rect x="246" y="46" width="108" height="40" rx="8" fill="#ffffff" stroke="#4f5d36" stroke-width="1.3"/><text x="300" y="71" font-size="13" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">The</text><rect x="362" y="46" width="108" height="40" rx="8" fill="#ffffff" stroke="#4f5d36" stroke-width="1.3"/><text x="416" y="71" font-size="13" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">cat</text><rect x="478" y="46" width="108" height="40" rx="8" fill="#ffffff" stroke="#4f5d36" stroke-width="1.3"/><text x="532" y="71" font-size="13" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">sat</text><rect x="594" y="46" width="108" height="40" rx="8" fill="#f3e5ab" stroke="#4f5d36" stroke-width="1.3"/><text x="648" y="71" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">[eos]</text><text x="20" y="124" font-size="13" font-weight="700" fill="#2c361c" text-anchor="start">Sequence B</text><rect x="130" y="98" width="108" height="40" rx="8" fill="#f3e5ab" stroke="#4f5d36" stroke-width="1.3"/><text x="184" y="123" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">[bos]</text><rect x="246" y="98" width="108" height="40" rx="8" fill="#ffffff" stroke="#4f5d36" stroke-width="1.3"/><text x="300" y="123" font-size="13" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">Hi</text><rect x="362" y="98" width="108" height="40" rx="8" fill="#f3e5ab" stroke="#4f5d36" stroke-width="1.3"/><text x="416" y="123" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">[eos]</text><rect x="478" y="98" width="108" height="40" rx="8" fill="#efefe0" stroke="#7d8257" stroke-width="1.3" stroke-dasharray="4 3"/><text x="532" y="123" font-size="13" font-weight="700" fill="#7d8257" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">[pad]</text><rect x="594" y="98" width="108" height="40" rx="8" fill="#efefe0" stroke="#7d8257" stroke-width="1.3" stroke-dasharray="4 3"/><text x="648" y="123" font-size="13" font-weight="700" fill="#7d8257" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">[pad]</text><text x="130" y="168" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="start">attention mask</text><text x="20" y="199" font-size="13" font-weight="700" fill="#2c361c" text-anchor="start">A</text><rect x="130" y="178" width="108" height="30" rx="6" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="184" y="198" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">1</text><rect x="246" y="178" width="108" height="30" rx="6" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="300" y="198" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">1</text><rect x="362" y="178" width="108" height="30" rx="6" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="416" y="198" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">1</text><rect x="478" y="178" width="108" height="30" rx="6" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="532" y="198" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">1</text><rect x="594" y="178" width="108" height="30" rx="6" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="648" y="198" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">1</text><text x="20" y="237" font-size="13" font-weight="700" fill="#2c361c" text-anchor="start">B</text><rect x="130" y="216" width="108" height="30" rx="6" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="184" y="236" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">1</text><rect x="246" y="216" width="108" height="30" rx="6" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="300" y="236" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">1</text><rect x="362" y="216" width="108" height="30" rx="6" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="416" y="236" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">1</text><rect x="478" y="216" width="108" height="30" rx="6" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.2"/><text x="532" y="236" font-size="13" font-weight="700" fill="#a3283f" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">0</text><rect x="594" y="216" width="108" height="30" rx="6" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.2"/><text x="648" y="236" font-size="13" font-weight="700" fill="#a3283f" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">0</text><text x="360" y="276" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">Before softmax, positions with mask 0 get a very large negative score,</text><text x="360" y="294" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">so their attention weight becomes (almost exactly) zero.</text></svg>

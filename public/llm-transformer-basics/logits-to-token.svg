<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" width="720" height="336" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>From logits to a chosen token</title><desc>The final layer produces raw logits for each vocabulary token. Softmax turns them into probabilities. Greedy decoding takes the top token, sampling draws one at random weighted by probability, and beam search keeps the best partial sequences.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d36"/></marker></defs><rect width="720" height="336" fill="#ffffff"/><rect x="20" y="14" width="220" height="158" rx="12" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="130" y="40" font-size="13.5" font-weight="700" fill="#2c361c" text-anchor="middle">Logits (raw scores)</text><text x="44" y="72" font-size="13" font-weight="400" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">cat</text><text x="216" y="72" font-size="13" font-weight="700" fill="#2c361c" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">2.0</text><text x="44" y="98" font-size="13" font-weight="400" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">dog</text><text x="216" y="98" font-size="13" font-weight="700" fill="#2c361c" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">1.0</text><text x="44" y="124" font-size="13" font-weight="400" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">car</text><text x="216" y="124" font-size="13" font-weight="700" fill="#2c361c" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">0.1</text><text x="44" y="150" font-size="13" font-weight="400" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">the</text><text x="216" y="150" font-size="13" font-weight="700" fill="#2c361c" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">−1.0</text><line x1="242" y1="93" x2="296" y2="93" stroke="#4f5d36" stroke-width="2" marker-end="url(#ah-4f5d36)"/><text x="270" y="84" font-size="12" font-weight="700" fill="#4f5d36" text-anchor="middle">softmax</text><rect x="300" y="14" width="410" height="158" rx="12" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="505" y="40" font-size="13.5" font-weight="700" fill="#2c361c" text-anchor="middle">Probabilities (they sum to 1)</text><text x="318" y="70" font-size="13" font-weight="400" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">cat</text><rect x="362" y="54" width="191.4" height="22" rx="4" fill="#e8c26a" stroke="#8a5a00" stroke-width="1.2"/><text x="561.4" y="70" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="start">63.8%</text><text x="318" y="98" font-size="13" font-weight="400" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">dog</text><rect x="362" y="82" width="70.5" height="22" rx="4" fill="#f6ebc4" stroke="#8a5a00" stroke-width="1.2"/><text x="440.5" y="98" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="start">23.5%</text><text x="318" y="126" font-size="13" font-weight="400" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">car</text><rect x="362" y="110" width="28.5" height="22" rx="4" fill="#f6ebc4" stroke="#8a5a00" stroke-width="1.2"/><text x="398.5" y="126" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="start">9.5%</text><text x="318" y="154" font-size="13" font-weight="400" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">the</text><rect x="362" y="138" width="9.6" height="22" rx="4" fill="#f6ebc4" stroke="#8a5a00" stroke-width="1.2"/><text x="379.6" y="154" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="start">3.2%</text><rect x="20" y="200" width="220" height="96" rx="10" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.5"/><text x="130.0" y="221" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">Greedy decoding</text><text x="130.0" y="239" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle">always takes the top token:</text><text x="130.0" y="253" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle">“cat”</text><text x="130.0" y="267" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle">the same input gives the same output</text><rect x="250" y="200" width="220" height="96" rx="10" fill="#f3e5ab" stroke="#4f5d36" stroke-width="1.5"/><text x="360.0" y="221" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">Sampling</text><text x="360.0" y="239" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle">draws a token at random,</text><text x="360.0" y="253" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle">weighted by probability:</text><text x="360.0" y="267" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle">cat 64%, dog 24%, …</text><rect x="480" y="200" width="220" height="96" rx="10" fill="#f6ebc4" stroke="#4f5d36" stroke-width="1.5"/><text x="590.0" y="221" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">Beam search</text><text x="590.0" y="239" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle">keeps the k best partial</text><text x="590.0" y="253" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle">sequences, extends each,</text><text x="590.0" y="267" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle">returns the best overall</text><text x="360" y="326" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">Probabilities are softmax of the logits: e^2.0 / (e^2.0 + e^1.0 + e^0.1 + e^−1.0) ≈ 0.64 for “cat”.</text></svg>

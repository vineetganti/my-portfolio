<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>What goes into a Strands agent</title><desc>A Strands Agent takes a model, optional tools and an optional system prompt, runs the agent loop, and returns an AgentResult with the message, the stop reason and the metrics.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d36"/></marker></defs><rect width="720" height="290" fill="#ffffff"/><rect x="20" y="28" width="210" height="64" rx="12" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.5"/><text x="125" y="54" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">model</text><text x="125" y="75" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle">OpenAIModel pointing at Groq</text><rect x="20" y="112" width="210" height="64" rx="12" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="125" y="138" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">tools</text><text x="125" y="159" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle">plain Python functions (optional)</text><rect x="20" y="196" width="210" height="64" rx="12" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="125" y="222" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">system_prompt</text><text x="125" y="243" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle">role, tone and rules (optional)</text><line x1="232" y1="60" x2="288" y2="100" stroke="#4f5d36" stroke-width="2" marker-end="url(#ah-4f5d36)"/><line x1="232" y1="144" x2="288" y2="143" stroke="#4f5d36" stroke-width="2" marker-end="url(#ah-4f5d36)"/><line x1="232" y1="228" x2="288" y2="186" stroke="#4f5d36" stroke-width="2" marker-end="url(#ah-4f5d36)"/><rect x="290" y="58" width="170" height="170" rx="14" fill="#f3e5ab" stroke="#2c361c" stroke-width="1.8"/><text x="375" y="86" font-size="16" font-weight="700" fill="#2c361c" text-anchor="middle">Agent</text><text x="375" y="112" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="middle">runs the loop:</text><text x="375" y="129" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="middle">decide,</text><text x="375" y="146" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="middle">call a tool,</text><text x="375" y="163" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="middle">read the result,</text><text x="375" y="180" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="middle">repeat until done</text><line x1="462" y1="143" x2="518" y2="143" stroke="#4f5d36" stroke-width="2" marker-end="url(#ah-4f5d36)"/><text x="490" y="134" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">returns</text><rect x="520" y="58" width="180" height="170" rx="14" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.5"/><text x="610" y="86" font-size="15" font-weight="700" fill="#2c361c" text-anchor="middle">AgentResult</text><text x="610" y="112" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">.message</text><text x="610" y="128" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="middle">the final answer</text><text x="610" y="148" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">.stop_reason</text><text x="610" y="164" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="middle">why it stopped</text><text x="610" y="184" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve" style="white-space:pre">.metrics</text><text x="610" y="200" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="middle">tokens, cycles, tool calls</text><text x="375" y="258" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">agent(“your prompt”) starts the loop</text></svg>

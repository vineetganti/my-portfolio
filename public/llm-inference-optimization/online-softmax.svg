<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="720" height="372" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Online softmax worked example</title><desc>The scores 1, 3, 2, 4 are processed in two blocks. After the first block the running maximum is 3 and the running sum is 1.135. The second block raises the maximum to 4, so the old sum is rescaled by exp of minus one, giving a final sum of 1.553, which equals the sum computed in a single pass.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d36"/></marker></defs><rect width="720" height="372" fill="#ffffff"/><text x="20" y="24" font-size="14" font-weight="700" fill="#2c361c" text-anchor="start">Softmax over [1, 3, 2, 4], computed one block at a time</text><rect x="10" y="40" width="220" height="190" rx="14" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="120" y="64" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">Block 1</text><text x="120" y="81" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">scores [1, 3]</text><text x="120" y="98" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">m = max(1, 3) = 3</text><text x="120" y="126" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">l = e^(1−3) + e^(3−3)</text><text x="120" y="148" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">  = 0.135 + 1</text><rect x="40" y="168" width="160" height="40" rx="8" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.5"/><text x="120" y="191.9" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">m = 3,  l = 1.135</text><line x1="232" y1="135" x2="258" y2="135" stroke="#4f5d36" stroke-width="2" marker-end="url(#ah-4f5d36)"/><rect x="260" y="40" width="270" height="190" rx="14" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="395" y="64" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">Block 2</text><text x="395" y="81" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">scores [2, 4]</text><text x="395" y="98" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">m_new = max(3, 4) = 4</text><text x="395" y="122" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">old sum shrinks by e^(3−4) = 0.368</text><text x="395" y="146" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">l = 0.368·1.135 + e^(2−4) + 1</text><text x="395" y="166" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">  = 0.418 + 0.135 + 1</text><rect x="285" y="180" width="220" height="40" rx="8" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.5"/><text x="395" y="203.9" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">m = 4,  l = 1.553</text><line x1="532" y1="135" x2="558" y2="135" stroke="#4f5d36" stroke-width="2" marker-end="url(#ah-4f5d36)"/><rect x="560" y="40" width="150" height="190" rx="14" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="635" y="64" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">Check</text><text x="635" y="81" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">one pass over all four</text><text x="635" y="98" font-size="11" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">l = e^(1−4) + e^(3−4)</text><text x="635" y="118" font-size="11" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">  + e^(2−4) + e^(0)</text><text x="635" y="138" font-size="11" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">  = 0.050 + 0.368</text><text x="635" y="158" font-size="11" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">  + 0.135 + 1</text><rect x="575" y="172" width="120" height="40" rx="8" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.5"/><text x="635" y="195.9" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">l = 1.553 ✓</text><rect x="10" y="250" width="700" height="100" rx="12" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="30" y="276" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="start">General update when block j arrives (S_ij = scores, rowmax and rowsum over the block):</text><text x="30" y="300" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">m_new = max(m_old, rowmax(S_ij))</text><text x="30" y="320" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">l_new = e^(m_old − m_new)·l_old + rowsum(e^(S_ij − m_new))</text><text x="30" y="340" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">O_new = e^(m_old − m_new)·O_old + e^(S_ij − m_new)·V_j      (divide O by l at the very end)</text></svg>

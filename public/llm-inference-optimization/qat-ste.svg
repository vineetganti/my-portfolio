<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="720" height="372" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Quantization-aware training and the straight-through estimator</title><desc>In the forward pass the FP32 weight is quantized and de-quantized so the layer sees quantization noise. In the backward pass the rounding step has no useful gradient, so the straight-through estimator passes the gradient through as if rounding were the identity, and the optimizer updates the FP32 master weight.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d36"/></marker><marker id="ah-a3283f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a3283f"/></marker></defs><rect width="720" height="372" fill="#ffffff"/><text x="20" y="24" font-size="14" font-weight="700" fill="#2c361c" text-anchor="start">Forward: simulate quantization.  Backward: pretend rounding is the identity.</text><text x="20" y="62" font-size="12.5" font-weight="700" fill="#4f5d36" text-anchor="start">forward pass</text><rect x="14" y="72" width="118" height="62" rx="10" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><text x="73" y="106.75" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">FP32 weight w</text><line x1="134" y1="103" x2="155" y2="103" stroke="#4f5d36" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="157" y="72" width="118" height="62" rx="10" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.4"/><text x="216" y="99.6" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">quantize</text><text x="216" y="115.1" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">q = round(w / s)</text><line x1="277" y1="103" x2="298" y2="103" stroke="#4f5d36" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="300" y="72" width="118" height="62" rx="10" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.4"/><text x="359" y="99.6" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">dequantize</text><text x="359" y="115.1" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">ŵ = s · q</text><line x1="420" y1="103" x2="441" y2="103" stroke="#4f5d36" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="443" y="72" width="118" height="62" rx="10" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><text x="502" y="99.6" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">layer uses ŵ</text><text x="502" y="115.1" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">y = x · ŵ</text><line x1="563" y1="103" x2="584" y2="103" stroke="#4f5d36" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="586" y="72" width="118" height="62" rx="10" fill="#ffffff" stroke="#4f5d36" stroke-width="1.4"/><text x="645" y="106.75" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">loss L</text><text x="20" y="170" font-size="12.5" font-weight="700" fill="#a3283f" text-anchor="start">backward pass</text><rect x="14" y="182" width="118" height="62" rx="10" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><text x="73" y="209.6" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">∂L/∂w</text><text x="73" y="225.1" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">update FP32 w</text><rect x="157" y="182" width="118" height="62" rx="10" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.4"/><text x="216" y="209.6" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">STE</text><text x="216" y="225.1" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">∂ŵ/∂w ≈ 1 in range</text><line x1="155" y1="213" x2="134" y2="213" stroke="#a3283f" stroke-width="1.8" marker-end="url(#ah-a3283f)"/><rect x="300" y="182" width="118" height="62" rx="10" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.4"/><text x="359" y="209.6" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">pass through</text><text x="359" y="225.1" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">dequantize is linear</text><line x1="298" y1="213" x2="277" y2="213" stroke="#a3283f" stroke-width="1.8" marker-end="url(#ah-a3283f)"/><rect x="443" y="182" width="118" height="62" rx="10" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.4"/><text x="502" y="209.6" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">∂L/∂ŵ</text><text x="502" y="225.1" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">from the layer</text><line x1="441" y1="213" x2="420" y2="213" stroke="#a3283f" stroke-width="1.8" marker-end="url(#ah-a3283f)"/><rect x="586" y="182" width="118" height="62" rx="10" fill="#ffffff" stroke="#4f5d36" stroke-width="1.4"/><text x="645" y="209.6" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">start here</text><text x="645" y="225.1" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">∂L/∂L = 1</text><line x1="584" y1="213" x2="563" y2="213" stroke="#a3283f" stroke-width="1.8" marker-end="url(#ah-a3283f)"/><rect x="14" y="264" width="692" height="92" rx="12" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="30" y="288" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="start">Why a trick is needed: round() is flat almost everywhere, so its true gradient is 0 and nothing would learn.</text><text x="30" y="310" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="start">The master weights stay in FP32 so tiny updates are not lost; only the forward pass sees the low-bit values.</text><text x="30" y="336" font-size="12.5" font-weight="700" fill="#8a5a00" text-anchor="start">QLoRA applies the idea to fine-tuning: a frozen 4-bit base model plus small trainable BF16 adapters.</text></svg>

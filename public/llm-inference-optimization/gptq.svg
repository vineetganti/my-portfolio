<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>GPTQ quantizes one column at a time and compensates the error</title><desc>A weight matrix is quantized column by column. Columns already done are INT4, the current column is rounded and its rounding error is spread onto the columns that are still in full precision using the inverse Hessian computed from a small calibration set, so the layer output stays close to the original.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d36"/></marker><marker id="ah-a3283f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a3283f"/></marker></defs><rect width="720" height="420" fill="#ffffff"/><text x="20" y="24" font-size="14" font-weight="700" fill="#2c361c" text-anchor="start">GPTQ: quantize a column, then push its error onto the columns still to come</text><rect x="20" y="52" width="150" height="62" rx="10" fill="#ffffff" stroke="#4f5d36" stroke-width="1.4"/><text x="95" y="78.8" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">calibration data X</text><text x="95" y="94.4" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">(a few hundred samples)</text><line x1="172" y1="83" x2="208" y2="83" stroke="#4f5d36" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="210" y="52" width="190" height="62" rx="10" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.4"/><text x="305" y="78.625" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">Hessian of the layer</text><text x="305" y="94.875" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">H = 2 · X · Xᵀ</text><line x1="402" y1="83" x2="438" y2="83" stroke="#4f5d36" stroke-width="1.8" marker-end="url(#ah-4f5d36)"/><rect x="440" y="52" width="260" height="62" rx="10" fill="#ffffff" stroke="#4f5d36" stroke-width="1.4"/><text x="570" y="78.8" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle">tells us how much each</text><text x="570" y="94.4" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle">weight matters for the output</text><rect x="130" y="168" width="54" height="30" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><text x="157" y="187" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">int4</text><rect x="184" y="168" width="54" height="30" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><text x="211" y="187" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">int4</text><rect x="238" y="168" width="54" height="30" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><text x="265" y="187" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">int4</text><rect x="292" y="168" width="54" height="30" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.4"/><text x="319" y="187" font-size="11" font-weight="700" fill="#8a5a00" text-anchor="middle">round</text><rect x="346" y="168" width="54" height="30" rx="0" fill="#ffffff" stroke="#7d8257" stroke-width="1" stroke-dasharray="3 3"/><text x="373" y="187" font-size="11" font-weight="400" fill="#7d8257" text-anchor="middle">fp16</text><rect x="400" y="168" width="54" height="30" rx="0" fill="#ffffff" stroke="#7d8257" stroke-width="1" stroke-dasharray="3 3"/><text x="427" y="187" font-size="11" font-weight="400" fill="#7d8257" text-anchor="middle">fp16</text><rect x="454" y="168" width="54" height="30" rx="0" fill="#ffffff" stroke="#7d8257" stroke-width="1" stroke-dasharray="3 3"/><text x="481" y="187" font-size="11" font-weight="400" fill="#7d8257" text-anchor="middle">fp16</text><rect x="508" y="168" width="54" height="30" rx="0" fill="#ffffff" stroke="#7d8257" stroke-width="1" stroke-dasharray="3 3"/><text x="535" y="187" font-size="11" font-weight="400" fill="#7d8257" text-anchor="middle">fp16</text><rect x="130" y="198" width="54" height="30" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><text x="157" y="217" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">int4</text><rect x="184" y="198" width="54" height="30" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><text x="211" y="217" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">int4</text><rect x="238" y="198" width="54" height="30" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><text x="265" y="217" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">int4</text><rect x="292" y="198" width="54" height="30" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.4"/><text x="319" y="217" font-size="11" font-weight="700" fill="#8a5a00" text-anchor="middle">round</text><rect x="346" y="198" width="54" height="30" rx="0" fill="#ffffff" stroke="#7d8257" stroke-width="1" stroke-dasharray="3 3"/><text x="373" y="217" font-size="11" font-weight="400" fill="#7d8257" text-anchor="middle">fp16</text><rect x="400" y="198" width="54" height="30" rx="0" fill="#ffffff" stroke="#7d8257" stroke-width="1" stroke-dasharray="3 3"/><text x="427" y="217" font-size="11" font-weight="400" fill="#7d8257" text-anchor="middle">fp16</text><rect x="454" y="198" width="54" height="30" rx="0" fill="#ffffff" stroke="#7d8257" stroke-width="1" stroke-dasharray="3 3"/><text x="481" y="217" font-size="11" font-weight="400" fill="#7d8257" text-anchor="middle">fp16</text><rect x="508" y="198" width="54" height="30" rx="0" fill="#ffffff" stroke="#7d8257" stroke-width="1" stroke-dasharray="3 3"/><text x="535" y="217" font-size="11" font-weight="400" fill="#7d8257" text-anchor="middle">fp16</text><rect x="130" y="228" width="54" height="30" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><text x="157" y="247" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">int4</text><rect x="184" y="228" width="54" height="30" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><text x="211" y="247" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">int4</text><rect x="238" y="228" width="54" height="30" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><text x="265" y="247" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">int4</text><rect x="292" y="228" width="54" height="30" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.4"/><text x="319" y="247" font-size="11" font-weight="700" fill="#8a5a00" text-anchor="middle">round</text><rect x="346" y="228" width="54" height="30" rx="0" fill="#ffffff" stroke="#7d8257" stroke-width="1" stroke-dasharray="3 3"/><text x="373" y="247" font-size="11" font-weight="400" fill="#7d8257" text-anchor="middle">fp16</text><rect x="400" y="228" width="54" height="30" rx="0" fill="#ffffff" stroke="#7d8257" stroke-width="1" stroke-dasharray="3 3"/><text x="427" y="247" font-size="11" font-weight="400" fill="#7d8257" text-anchor="middle">fp16</text><rect x="454" y="228" width="54" height="30" rx="0" fill="#ffffff" stroke="#7d8257" stroke-width="1" stroke-dasharray="3 3"/><text x="481" y="247" font-size="11" font-weight="400" fill="#7d8257" text-anchor="middle">fp16</text><rect x="508" y="228" width="54" height="30" rx="0" fill="#ffffff" stroke="#7d8257" stroke-width="1" stroke-dasharray="3 3"/><text x="535" y="247" font-size="11" font-weight="400" fill="#7d8257" text-anchor="middle">fp16</text><rect x="130" y="258" width="54" height="30" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><text x="157" y="277" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">int4</text><rect x="184" y="258" width="54" height="30" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><text x="211" y="277" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">int4</text><rect x="238" y="258" width="54" height="30" rx="0" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><text x="265" y="277" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="middle">int4</text><rect x="292" y="258" width="54" height="30" rx="0" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.4"/><text x="319" y="277" font-size="11" font-weight="700" fill="#8a5a00" text-anchor="middle">round</text><rect x="346" y="258" width="54" height="30" rx="0" fill="#ffffff" stroke="#7d8257" stroke-width="1" stroke-dasharray="3 3"/><text x="373" y="277" font-size="11" font-weight="400" fill="#7d8257" text-anchor="middle">fp16</text><rect x="400" y="258" width="54" height="30" rx="0" fill="#ffffff" stroke="#7d8257" stroke-width="1" stroke-dasharray="3 3"/><text x="427" y="277" font-size="11" font-weight="400" fill="#7d8257" text-anchor="middle">fp16</text><rect x="454" y="258" width="54" height="30" rx="0" fill="#ffffff" stroke="#7d8257" stroke-width="1" stroke-dasharray="3 3"/><text x="481" y="277" font-size="11" font-weight="400" fill="#7d8257" text-anchor="middle">fp16</text><rect x="508" y="258" width="54" height="30" rx="0" fill="#ffffff" stroke="#7d8257" stroke-width="1" stroke-dasharray="3 3"/><text x="535" y="277" font-size="11" font-weight="400" fill="#7d8257" text-anchor="middle">fp16</text><text x="116" y="232" font-size="16" font-weight="700" fill="#2c361c" text-anchor="end">W</text><text x="116" y="248" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="end">(rows = outputs)</text><text x="211" y="160" font-size="12" font-weight="700" fill="#4f5d36" text-anchor="middle">done</text><text x="319" y="160" font-size="12" font-weight="700" fill="#8a5a00" text-anchor="middle">now</text><text x="454" y="160" font-size="12" font-weight="700" fill="#7d8257" text-anchor="middle">still full precision</text><path d="M300 292 Q336.5 328 373 292" fill="none" stroke="#a3283f" stroke-width="1.4" marker-end="url(#ah-a3283f)" stroke-linejoin="round" stroke-linecap="round"/><path d="M310 292 Q368.5 332 427 292" fill="none" stroke="#a3283f" stroke-width="1.4" marker-end="url(#ah-a3283f)" stroke-linejoin="round" stroke-linecap="round"/><path d="M320 292 Q400.5 336 481 292" fill="none" stroke="#a3283f" stroke-width="1.4" marker-end="url(#ah-a3283f)" stroke-linejoin="round" stroke-linecap="round"/><path d="M330 292 Q432.5 340 535 292" fill="none" stroke="#a3283f" stroke-width="1.4" marker-end="url(#ah-a3283f)" stroke-linejoin="round" stroke-linecap="round"/><text x="427" y="346" font-size="12" font-weight="700" fill="#a3283f" text-anchor="middle">error spread: w ← w − δ · (H⁻¹ row)</text><rect x="14" y="318" width="692" height="90" rx="12" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="30" y="342" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">goal per layer:  minimise ‖W·X − Ŵ·X‖²  with Ŵ on a 4-bit grid</text><text x="30" y="364" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">δ = (w_q − quant(w_q)) / [H⁻¹]_qq</text><text x="30" y="384" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">w_rest ← w_rest − δ · [H⁻¹]_(q, rest)</text><text x="690" y="364" font-size="12" font-weight="700" fill="#8a5a00" text-anchor="end">one-shot, no retraining</text><text x="690" y="384" font-size="12" font-weight="400" fill="#4f5d36" text-anchor="end">uses only the calibration activations</text></svg>

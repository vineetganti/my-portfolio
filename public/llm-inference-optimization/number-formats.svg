<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384" width="720" height="384" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Bit layouts of FP32, BF16, FP16, INT8 and INT4</title><desc>Each row shows the bits of a number format. FP32 uses 1 sign, 8 exponent and 23 mantissa bits. BF16 keeps the 8 exponent bits but only 7 mantissa bits. FP16 uses 1, 5 and 10 bits and tops out at 65,504. INT8 has 256 evenly spaced levels from minus 128 to 127 and INT4 has 16.</desc><defs></defs><rect width="720" height="384" fill="#ffffff"/><text x="20" y="24" font-size="14" font-weight="700" fill="#2c361c" text-anchor="start">Same idea, different budgets: how many bits go to range and how many to precision</text><text x="20" y="79" font-size="14" font-weight="700" fill="#2c361c" text-anchor="start">FP32</text><text x="20" y="94" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="start">4 bytes</text><rect x="100" y="64" width="11" height="26" rx="1" fill="#f8e1d6" stroke="#a3283f" stroke-width="1"/><rect x="111" y="64" width="11" height="26" rx="1" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="122" y="64" width="11" height="26" rx="1" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="133" y="64" width="11" height="26" rx="1" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="144" y="64" width="11" height="26" rx="1" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="155" y="64" width="11" height="26" rx="1" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="166" y="64" width="11" height="26" rx="1" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="177" y="64" width="11" height="26" rx="1" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="188" y="64" width="11" height="26" rx="1" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="199" y="64" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="210" y="64" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="221" y="64" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="232" y="64" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="243" y="64" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="254" y="64" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="265" y="64" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="276" y="64" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="287" y="64" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="298" y="64" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="309" y="64" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="320" y="64" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="331" y="64" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="342" y="64" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="353" y="64" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="364" y="64" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="375" y="64" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="386" y="64" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="397" y="64" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="408" y="64" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="419" y="64" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="430" y="64" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="441" y="64" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><text x="468" y="76" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="start" font-style="italic">1 · 8 · 23</text><text x="468" y="92" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="start">±3.4×10³⁸, about 7 digits</text><text x="20" y="131" font-size="14" font-weight="700" fill="#2c361c" text-anchor="start">BF16</text><text x="20" y="146" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="start">2 bytes</text><rect x="100" y="116" width="11" height="26" rx="1" fill="#f8e1d6" stroke="#a3283f" stroke-width="1"/><rect x="111" y="116" width="11" height="26" rx="1" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="122" y="116" width="11" height="26" rx="1" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="133" y="116" width="11" height="26" rx="1" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="144" y="116" width="11" height="26" rx="1" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="155" y="116" width="11" height="26" rx="1" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="166" y="116" width="11" height="26" rx="1" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="177" y="116" width="11" height="26" rx="1" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="188" y="116" width="11" height="26" rx="1" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="199" y="116" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="210" y="116" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="221" y="116" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="232" y="116" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="243" y="116" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="254" y="116" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="265" y="116" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><text x="468" y="128" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="start" font-style="italic">1 · 8 · 7</text><text x="468" y="144" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="start">±3.4×10³⁸, about 2–3 digits</text><text x="20" y="183" font-size="14" font-weight="700" fill="#2c361c" text-anchor="start">FP16</text><text x="20" y="198" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="start">2 bytes</text><rect x="100" y="168" width="11" height="26" rx="1" fill="#f8e1d6" stroke="#a3283f" stroke-width="1"/><rect x="111" y="168" width="11" height="26" rx="1" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="122" y="168" width="11" height="26" rx="1" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="133" y="168" width="11" height="26" rx="1" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="144" y="168" width="11" height="26" rx="1" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="155" y="168" width="11" height="26" rx="1" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1"/><rect x="166" y="168" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="177" y="168" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="188" y="168" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="199" y="168" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="210" y="168" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="221" y="168" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="232" y="168" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="243" y="168" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="254" y="168" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><rect x="265" y="168" width="11" height="26" rx="1" fill="#e9efcf" stroke="#4f5d36" stroke-width="1"/><text x="468" y="180" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="start" font-style="italic">1 · 5 · 10</text><text x="468" y="196" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="start">±65,504, about 3–4 digits</text><text x="20" y="235" font-size="14" font-weight="700" fill="#2c361c" text-anchor="start">INT8</text><text x="20" y="250" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="start">1 byte</text><rect x="100" y="220" width="11" height="26" rx="1" fill="#f8e1d6" stroke="#a3283f" stroke-width="1"/><rect x="111" y="220" width="11" height="26" rx="1" fill="#cfd6a6" stroke="#4f5d36" stroke-width="1"/><rect x="122" y="220" width="11" height="26" rx="1" fill="#cfd6a6" stroke="#4f5d36" stroke-width="1"/><rect x="133" y="220" width="11" height="26" rx="1" fill="#cfd6a6" stroke="#4f5d36" stroke-width="1"/><rect x="144" y="220" width="11" height="26" rx="1" fill="#cfd6a6" stroke="#4f5d36" stroke-width="1"/><rect x="155" y="220" width="11" height="26" rx="1" fill="#cfd6a6" stroke="#4f5d36" stroke-width="1"/><rect x="166" y="220" width="11" height="26" rx="1" fill="#cfd6a6" stroke="#4f5d36" stroke-width="1"/><rect x="177" y="220" width="11" height="26" rx="1" fill="#cfd6a6" stroke="#4f5d36" stroke-width="1"/><text x="468" y="232" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="start" font-style="italic">two's complement</text><text x="468" y="248" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="start">−128 … 127, 256 even steps</text><text x="20" y="287" font-size="14" font-weight="700" fill="#2c361c" text-anchor="start">INT4</text><text x="20" y="302" font-size="11" font-weight="400" fill="#4f5d36" text-anchor="start">½ byte</text><rect x="100" y="272" width="11" height="26" rx="1" fill="#f8e1d6" stroke="#a3283f" stroke-width="1"/><rect x="111" y="272" width="11" height="26" rx="1" fill="#cfd6a6" stroke="#4f5d36" stroke-width="1"/><rect x="122" y="272" width="11" height="26" rx="1" fill="#cfd6a6" stroke="#4f5d36" stroke-width="1"/><rect x="133" y="272" width="11" height="26" rx="1" fill="#cfd6a6" stroke="#4f5d36" stroke-width="1"/><text x="468" y="284" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="start" font-style="italic">two's complement</text><text x="468" y="300" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="start">−8 … 7, 16 even steps</text><rect x="100" y="334" width="14" height="14" rx="2" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.2"/><text x="120" y="346" font-size="12" font-weight="400" fill="#2c361c" text-anchor="start">sign</text><rect x="250" y="334" width="14" height="14" rx="2" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><text x="270" y="346" font-size="12" font-weight="400" fill="#2c361c" text-anchor="start">exponent: range</text><rect x="400" y="334" width="14" height="14" rx="2" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="420" y="346" font-size="12" font-weight="400" fill="#2c361c" text-anchor="start">mantissa: precision</text><rect x="550" y="334" width="14" height="14" rx="2" fill="#cfd6a6" stroke="#4f5d36" stroke-width="1.2"/><text x="570" y="346" font-size="12" font-weight="400" fill="#2c361c" text-anchor="start">integer bits</text><text x="360" y="372" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">BF16 trades precision for FP32's range, which is why it avoids the overflow problems of FP16 in training.</text></svg>

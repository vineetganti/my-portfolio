<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 376" width="720" height="376" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Autograd keeps activations alive, no_grad frees them</title><desc>Top: with gradient tracking, every layer's output is saved for the backward pass, so memory grows with depth. Bottom: inside torch.no_grad, each output is released as soon as the next layer has consumed it, so only about one layer's output is alive at a time.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d36"/></marker></defs><rect width="720" height="376" fill="#ffffff"/><text x="20" y="28" font-size="13.5" font-weight="700" fill="#a3283f" text-anchor="start">Default: autograd records a graph</text><text x="22" y="73" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">x</text><rect x="54" y="48" width="100" height="40" rx="8" fill="#ffffff" stroke="#4f5d36" stroke-width="1.5"/><text x="104" y="71.75" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">layer 1</text><line x1="26" y1="68" x2="52" y2="68" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="64" y="108" width="80" height="30" rx="5" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.4"/><text x="104" y="128" font-size="11.5" font-weight="700" fill="#8a5a00" text-anchor="middle">a1 saved</text><line x1="104" y1="90" x2="104" y2="106" stroke="#7d8257" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="192" y="48" width="100" height="40" rx="8" fill="#ffffff" stroke="#4f5d36" stroke-width="1.5"/><text x="242" y="71.75" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">layer 2</text><line x1="156" y1="68" x2="190" y2="68" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="202" y="108" width="80" height="30" rx="5" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.4"/><text x="242" y="128" font-size="11.5" font-weight="700" fill="#8a5a00" text-anchor="middle">a2 saved</text><line x1="242" y1="90" x2="242" y2="106" stroke="#7d8257" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="330" y="48" width="100" height="40" rx="8" fill="#ffffff" stroke="#4f5d36" stroke-width="1.5"/><text x="380" y="71.75" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">layer 3</text><line x1="294" y1="68" x2="328" y2="68" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="340" y="108" width="80" height="30" rx="5" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.4"/><text x="380" y="128" font-size="11.5" font-weight="700" fill="#8a5a00" text-anchor="middle">a3 saved</text><line x1="380" y1="90" x2="380" y2="106" stroke="#7d8257" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="468" y="48" width="100" height="40" rx="8" fill="#ffffff" stroke="#4f5d36" stroke-width="1.5"/><text x="518" y="71.75" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">layer 4</text><line x1="432" y1="68" x2="466" y2="68" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="478" y="108" width="80" height="30" rx="5" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.4"/><text x="518" y="128" font-size="11.5" font-weight="700" fill="#8a5a00" text-anchor="middle">a4 saved</text><line x1="518" y1="90" x2="518" y2="106" stroke="#7d8257" stroke-width="1.2" stroke-dasharray="3 3"/><text x="620" y="73" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">y</text><line x1="570" y1="68" x2="590" y2="68" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><text x="360" y="162" font-size="12.5" font-weight="700" fill="#a3283f" text-anchor="middle">memory ∝ number of layers, kept for the backward pass</text><text x="20" y="212" font-size="13.5" font-weight="700" fill="#4f5d36" text-anchor="start">torch.no_grad(): no graph</text><text x="22" y="257" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">x</text><rect x="54" y="232" width="100" height="40" rx="8" fill="#ffffff" stroke="#4f5d36" stroke-width="1.5"/><text x="104" y="255.75" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">layer 1</text><line x1="26" y1="252" x2="52" y2="252" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="64" y="292" width="80" height="30" rx="5" fill="#ffffff" stroke="#7d8257" stroke-width="1.2" stroke-dasharray="4 3"/><text x="104" y="312" font-size="11.5" font-weight="400" fill="#7d8257" text-anchor="middle" font-style="italic">a1 freed</text><rect x="192" y="232" width="100" height="40" rx="8" fill="#ffffff" stroke="#4f5d36" stroke-width="1.5"/><text x="242" y="255.75" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">layer 2</text><line x1="156" y1="252" x2="190" y2="252" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="202" y="292" width="80" height="30" rx="5" fill="#ffffff" stroke="#7d8257" stroke-width="1.2" stroke-dasharray="4 3"/><text x="242" y="312" font-size="11.5" font-weight="400" fill="#7d8257" text-anchor="middle" font-style="italic">a2 freed</text><rect x="330" y="232" width="100" height="40" rx="8" fill="#ffffff" stroke="#4f5d36" stroke-width="1.5"/><text x="380" y="255.75" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">layer 3</text><line x1="294" y1="252" x2="328" y2="252" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="340" y="292" width="80" height="30" rx="5" fill="#ffffff" stroke="#7d8257" stroke-width="1.2" stroke-dasharray="4 3"/><text x="380" y="312" font-size="11.5" font-weight="400" fill="#7d8257" text-anchor="middle" font-style="italic">a3 freed</text><rect x="468" y="232" width="100" height="40" rx="8" fill="#ffffff" stroke="#4f5d36" stroke-width="1.5"/><text x="518" y="255.75" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">layer 4</text><line x1="432" y1="252" x2="466" y2="252" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="478" y="292" width="80" height="30" rx="5" fill="#ffffff" stroke="#7d8257" stroke-width="1.2" stroke-dasharray="4 3"/><text x="518" y="312" font-size="11.5" font-weight="400" fill="#7d8257" text-anchor="middle" font-style="italic">a4 freed</text><text x="620" y="257" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">y</text><line x1="570" y1="252" x2="590" y2="252" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><text x="360" y="346" font-size="12.5" font-weight="700" fill="#4f5d36" text-anchor="middle">memory ≈ one or two layer outputs at a time</text></svg>

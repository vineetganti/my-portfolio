<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 344" width="720" height="344" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Forward pass and training loop</title><desc>Inference uses only the forward pass from input through the model to a prediction. Training adds a loss against the target, gradients from backpropagation, and an optimizer that updates the weights.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d36"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a00"/></marker></defs><rect width="720" height="344" fill="#ffffff"/><rect x="6" y="62" width="446" height="130" rx="14" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4" stroke-dasharray="7 5" fill-opacity="0.45"/><text x="18" y="84" font-size="12.5" font-weight="700" fill="#4f5d36" text-anchor="start">Inference: the forward pass only</text><rect x="20" y="104" width="90" height="62" rx="10" fill="#ffffff" stroke="#4f5d36" stroke-width="1.5"/><text x="65.0" y="125" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">Input</text><text x="65.0" y="143" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle">x</text><rect x="140" y="104" width="170" height="62" rx="10" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="225.0" y="125" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">Model</text><text x="225.0" y="143" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle">weights + biases,</text><text x="225.0" y="157" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle">activation functions</text><rect x="340" y="104" width="96" height="62" rx="10" fill="#ffffff" stroke="#4f5d36" stroke-width="1.5"/><text x="388.0" y="125" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">Prediction</text><text x="388.0" y="143" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle">ŷ</text><line x1="112" y1="135" x2="138" y2="135" stroke="#4f5d36" stroke-width="2" marker-end="url(#ah-4f5d36)"/><line x1="312" y1="135" x2="338" y2="135" stroke="#4f5d36" stroke-width="2" marker-end="url(#ah-4f5d36)"/><rect x="482" y="104" width="110" height="62" rx="10" fill="#f6ebc4" stroke="#8a5a00" stroke-width="1.5"/><text x="537.0" y="125" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">Loss</text><text x="537.0" y="143" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle">how wrong?</text><rect x="620" y="104" width="90" height="62" rx="10" fill="#f6ebc4" stroke="#8a5a00" stroke-width="1.5"/><text x="665.0" y="125" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">Target</text><text x="665.0" y="143" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle">ground truth</text><line x1="438" y1="135" x2="480" y2="135" stroke="#4f5d36" stroke-width="2" marker-end="url(#ah-4f5d36)"/><line x1="618" y1="135" x2="594" y2="135" stroke="#4f5d36" stroke-width="2" marker-end="url(#ah-4f5d36)"/><rect x="140" y="252" width="170" height="62" rx="10" fill="#f6ebc4" stroke="#8a5a00" stroke-width="1.5"/><text x="225.0" y="273" font-size="14" font-weight="700" fill="#2c361c" text-anchor="middle">Optimizer</text><text x="225.0" y="291" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle">Adam / SGD:</text><text x="225.0" y="305" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle">uses the gradients</text><path d="M537 168 L537 283 L314 283" fill="none" stroke="#8a5a00" stroke-width="2" marker-end="url(#ah-8a5a00)"/><text x="425" y="272" font-size="12" font-weight="400" fill="#8a5a00" text-anchor="middle" font-style="italic">gradients (backpropagation)</text><line x1="225" y1="250" x2="225" y2="170" stroke="#8a5a00" stroke-width="2" marker-end="url(#ah-8a5a00)"/><text x="236" y="216" font-size="12" font-weight="400" fill="#8a5a00" text-anchor="start" font-style="italic">update weights and biases</text><text x="360" y="334" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="middle">Training adds a loss, gradients and an optimizer (with its own state) on top of the forward pass.</text></svg>

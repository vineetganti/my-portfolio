<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="720" height="372" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Activation checkpointing trades compute for memory</title><desc>Top: storing every activation of an 8-layer network keeps 8 tensors alive for the backward pass. Bottom: with checkpoints after layers 2, 4, 6 and 8, only those are kept, and during the backward pass the layers in between are recomputed from the nearest checkpoint, at the cost of roughly one extra forward pass.</desc><defs><marker id="ah-a3283f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a3283f"/></marker></defs><rect width="720" height="372" fill="#ffffff"/><text x="20" y="22" font-size="13.5" font-weight="700" fill="#a3283f" text-anchor="start">Store every activation: fastest, most memory</text><rect x="56" y="36" width="66" height="36" rx="6" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.4"/><text x="89" y="59" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">a1</text><rect x="130" y="36" width="66" height="36" rx="6" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.4"/><text x="163" y="59" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">a2</text><rect x="204" y="36" width="66" height="36" rx="6" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.4"/><text x="237" y="59" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">a3</text><rect x="278" y="36" width="66" height="36" rx="6" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.4"/><text x="311" y="59" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">a4</text><rect x="352" y="36" width="66" height="36" rx="6" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.4"/><text x="385" y="59" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">a5</text><rect x="426" y="36" width="66" height="36" rx="6" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.4"/><text x="459" y="59" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">a6</text><rect x="500" y="36" width="66" height="36" rx="6" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.4"/><text x="533" y="59" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">a7</text><rect x="574" y="36" width="66" height="36" rx="6" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.4"/><text x="607" y="59" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">a8</text><text x="360" y="96" font-size="12.5" font-weight="700" fill="#a3283f" text-anchor="middle">8 activations alive when backward starts</text><text x="20" y="142" font-size="13.5" font-weight="700" fill="#4f5d36" text-anchor="start">Checkpoint every 2nd layer: slower, much less memory</text><rect x="56" y="156" width="66" height="36" rx="6" fill="#ffffff" stroke="#7d8257" stroke-width="1.2" stroke-dasharray="4 3"/><text x="89" y="179" font-size="11" font-weight="400" fill="#7d8257" text-anchor="middle" font-style="italic">freed</text><rect x="130" y="156" width="66" height="36" rx="6" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.6"/><text x="163" y="179" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">a2</text><rect x="204" y="156" width="66" height="36" rx="6" fill="#ffffff" stroke="#7d8257" stroke-width="1.2" stroke-dasharray="4 3"/><text x="237" y="179" font-size="11" font-weight="400" fill="#7d8257" text-anchor="middle" font-style="italic">freed</text><rect x="278" y="156" width="66" height="36" rx="6" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.6"/><text x="311" y="179" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">a4</text><rect x="352" y="156" width="66" height="36" rx="6" fill="#ffffff" stroke="#7d8257" stroke-width="1.2" stroke-dasharray="4 3"/><text x="385" y="179" font-size="11" font-weight="400" fill="#7d8257" text-anchor="middle" font-style="italic">freed</text><rect x="426" y="156" width="66" height="36" rx="6" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.6"/><text x="459" y="179" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">a6</text><rect x="500" y="156" width="66" height="36" rx="6" fill="#ffffff" stroke="#7d8257" stroke-width="1.2" stroke-dasharray="4 3"/><text x="533" y="179" font-size="11" font-weight="400" fill="#7d8257" text-anchor="middle" font-style="italic">freed</text><rect x="574" y="156" width="66" height="36" rx="6" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.6"/><text x="607" y="179" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="middle">a8</text><path d="M163 196 Q200 232 237 196" fill="none" stroke="#a3283f" stroke-width="1.6" marker-end="url(#ah-a3283f)" stroke-linejoin="round" stroke-linecap="round"/><path d="M311 196 Q348 232 385 196" fill="none" stroke="#a3283f" stroke-width="1.6" marker-end="url(#ah-a3283f)" stroke-linejoin="round" stroke-linecap="round"/><path d="M459 196 Q496 232 533 196" fill="none" stroke="#a3283f" stroke-width="1.6" marker-end="url(#ah-a3283f)" stroke-linejoin="round" stroke-linecap="round"/><text x="360" y="252" font-size="12.5" font-weight="700" fill="#a3283f" text-anchor="middle">backward recomputes the freed layers from the nearest checkpoint</text><rect x="14" y="276" width="692" height="84" rx="12" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="30" y="300" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="start">Keep √L checkpoints of L layers and memory falls from O(L) to about O(√L).</text><text x="30" y="322" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="start">Cost: roughly one extra forward pass, about 30–35% more compute per training step.</text><text x="30" y="344" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="start">Inference needs none of this: with no backward pass, nothing has to be saved.</text></svg>

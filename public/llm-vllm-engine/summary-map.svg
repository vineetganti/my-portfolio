<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 338" width="720" height="338" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Post 05 at a glance: how vLLM serves many users</title><desc>A map of this post in three columns. Why vLLM: static batches waste slots and memory, PagedAttention stores the KV cache in blocks found through a block table, and continuous batching re-forms the batch every step. Memory: one pool sized at startup, prefix caching by block hash, max_model_len and sliding windows, no fragmentation, and preemption by recomputation. Interaction: an API server and an engine core, a request lifecycle with aborts at step boundaries, a serving stack around the engine, and settings for the tokenizer, cache and scheduler.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d36"/></marker></defs><rect width="720" height="338" fill="#ffffff"/><text x="20" y="28" font-size="14" font-weight="700" fill="#2c361c" text-anchor="start">Post 05 at a glance: how vLLM serves many users</text><rect x="10" y="44" width="221.333" height="228" rx="14" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="120.667" y="71" font-size="13.5" font-weight="700" fill="#2c361c" text-anchor="middle">Why vLLM</text><rect x="20" y="88" width="201.333" height="28" rx="8" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.1"/><text x="120.667" y="106.5" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">static batches waste slots</text><rect x="20" y="124" width="201.333" height="28" rx="8" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.1"/><text x="120.667" y="142.5" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">KV cache in 16-token blocks</text><rect x="20" y="160" width="201.333" height="28" rx="8" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.1"/><text x="120.667" y="178.5" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">block table: ⌊t/B⌋, t mod B</text><rect x="20" y="196" width="201.333" height="28" rx="8" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.1"/><text x="120.667" y="214.5" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">continuous batching</text><rect x="20" y="232" width="201.333" height="28" rx="8" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.1"/><text x="120.667" y="250.5" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">token budget, chunked prefill</text><line x1="233.333" y1="66" x2="247.333" y2="66" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="249.333" y="44" width="221.333" height="228" rx="14" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="360" y="71" font-size="13.5" font-weight="700" fill="#2c361c" text-anchor="middle">Memory</text><rect x="259.333" y="88" width="201.333" height="28" rx="8" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.1"/><text x="360" y="106.5" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">one pool sized at startup</text><rect x="259.333" y="124" width="201.333" height="28" rx="8" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.1"/><text x="360" y="142.5" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">prefix caching by block hash</text><rect x="259.333" y="160" width="201.333" height="28" rx="8" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.1"/><text x="360" y="178.5" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">max_model_len, sliding windows</text><rect x="259.333" y="196" width="201.333" height="28" rx="8" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.1"/><text x="360" y="214.5" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">no external fragmentation</text><rect x="259.333" y="232" width="201.333" height="28" rx="8" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.1"/><text x="360" y="250.5" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">preempt: free and recompute</text><line x1="472.667" y1="66" x2="486.667" y2="66" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><rect x="488.667" y="44" width="221.333" height="228" rx="14" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="599.333" y="71" font-size="13.5" font-weight="700" fill="#2c361c" text-anchor="middle">Interaction</text><rect x="498.667" y="88" width="201.333" height="28" rx="8" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.1"/><text x="599.333" y="106.5" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">API server and engine core</text><rect x="498.667" y="124" width="201.333" height="28" rx="8" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.1"/><text x="599.333" y="142.5" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">request states and aborts</text><rect x="498.667" y="160" width="201.333" height="28" rx="8" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.1"/><text x="599.333" y="178.5" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">streaming over SSE</text><rect x="498.667" y="196" width="201.333" height="28" rx="8" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.1"/><text x="599.333" y="214.5" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">gateway, router, replicas</text><rect x="498.667" y="232" width="201.333" height="28" rx="8" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.1"/><text x="599.333" y="250.5" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="middle">tokenizer, cache, scheduler</text><rect x="10" y="288" width="700" height="36" rx="10" fill="#f6ebc4" stroke="#8a5a00" stroke-width="1.3"/><text x="360" y="311" font-size="13" font-weight="700" fill="#2c361c" text-anchor="middle">Treat the KV cache like virtual memory, and re-form the batch at every step.</text></svg>

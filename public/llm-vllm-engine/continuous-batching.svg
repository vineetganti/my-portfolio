<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 498" width="720" height="498" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Static batching versus continuous batching</title><desc>Seven requests on four batch slots. With static batching the first batch runs until its longest request ends at step 7, leaving 11 slot-steps idle, and requests E, F and G wait an average of 4.3 steps for the second batch. With continuous batching each finished slot is refilled at the next step, the waits average 0.7 steps, and all work is done at step 10 instead of 12.</desc><defs><marker id="ah-a3283f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a3283f"/></marker></defs><rect width="720" height="498" fill="#ffffff"/><rect x="10" y="12" width="700" height="216" rx="14" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="24" y="36" font-size="13.5" font-weight="700" fill="#2c361c" text-anchor="start">Static batching: the batch is fixed until its longest request ends</text><text x="84" y="70" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="end" font-style="italic">queue</text><line x1="139" y1="56" x2="360" y2="56" stroke="#a3283f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah-a3283f)"/><circle cx="134" cy="56" r="4.5" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.3"/><text x="126" y="60" font-size="10.5" font-weight="700" fill="#2c361c" text-anchor="end">E</text><line x1="215" y1="68" x2="360" y2="68" stroke="#a3283f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah-a3283f)"/><circle cx="210" cy="68" r="4.5" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.3"/><text x="202" y="72" font-size="10.5" font-weight="700" fill="#2c361c" text-anchor="end">F</text><line x1="253" y1="80" x2="360" y2="80" stroke="#a3283f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah-a3283f)"/><circle cx="248" cy="80" r="4.5" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.3"/><text x="240" y="84" font-size="10.5" font-weight="700" fill="#2c361c" text-anchor="end">G</text><text x="84" y="112" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="end">slot 1</text><rect x="97.5" y="96" width="187" height="22" rx="5" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="191" y="111.5" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">A · 5</text><rect x="287.5" y="96" width="73" height="22" rx="5" fill="#f8e1d6" stroke="#a3283f" stroke-width="1" stroke-dasharray="3 3"/><text x="324" y="111.5" font-size="10.5" font-weight="400" fill="#a3283f" text-anchor="middle" font-style="italic">idle</text><rect x="363.5" y="96" width="149" height="22" rx="5" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><text x="438" y="111.5" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">E · 4</text><rect x="515.5" y="96" width="35" height="22" rx="5" fill="#f8e1d6" stroke="#a3283f" stroke-width="1" stroke-dasharray="3 3"/><text x="84" y="140" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="end">slot 2</text><rect x="97.5" y="124" width="73" height="22" rx="5" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="134" y="139.5" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">B · 2</text><rect x="173.5" y="124" width="187" height="22" rx="5" fill="#f8e1d6" stroke="#a3283f" stroke-width="1" stroke-dasharray="3 3"/><text x="267" y="139.5" font-size="10.5" font-weight="400" fill="#a3283f" text-anchor="middle" font-style="italic">idle</text><rect x="363.5" y="124" width="111" height="22" rx="5" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><text x="419" y="139.5" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">F · 3</text><rect x="477.5" y="124" width="73" height="22" rx="5" fill="#f8e1d6" stroke="#a3283f" stroke-width="1" stroke-dasharray="3 3"/><text x="514" y="139.5" font-size="10.5" font-weight="400" fill="#a3283f" text-anchor="middle" font-style="italic">idle</text><text x="84" y="168" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="end">slot 3</text><rect x="97.5" y="152" width="263" height="22" rx="5" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="229" y="167.5" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">C · 7</text><rect x="363.5" y="152" width="187" height="22" rx="5" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><text x="457" y="167.5" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">G · 5</text><text x="84" y="196" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="end">slot 4</text><rect x="97.5" y="180" width="111" height="22" rx="5" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="153" y="195.5" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">D · 3</text><rect x="211.5" y="180" width="149" height="22" rx="5" fill="#f8e1d6" stroke="#a3283f" stroke-width="1" stroke-dasharray="3 3"/><text x="286" y="195.5" font-size="10.5" font-weight="400" fill="#a3283f" text-anchor="middle" font-style="italic">idle</text><rect x="363.5" y="180" width="187" height="22" rx="5" fill="#ffffff" stroke="#7d8257" stroke-width="1" stroke-dasharray="3 3"/><text x="457" y="195.5" font-size="10.5" font-weight="400" fill="#7d8257" text-anchor="middle" font-style="italic">empty</text><line x1="362" y1="90" x2="362" y2="206" stroke="#8a5a00" stroke-width="1.3" stroke-dasharray="5 3"/><text x="366" y="88" font-size="10.5" font-weight="700" fill="#8a5a00" text-anchor="start">batch 2 starts</text><text x="96" y="220" font-size="10.5" font-weight="400" fill="#7d8257" text-anchor="middle">0</text><text x="172" y="220" font-size="10.5" font-weight="400" fill="#7d8257" text-anchor="middle">2</text><text x="248" y="220" font-size="10.5" font-weight="400" fill="#7d8257" text-anchor="middle">4</text><text 
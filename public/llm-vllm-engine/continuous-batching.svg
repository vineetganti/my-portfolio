a3283f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah-a3283f)"/><circle cx="248" cy="310" r="4.5" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.3"/><text x="240" y="314" font-size="10.5" font-weight="700" fill="#2c361c" text-anchor="end">G</text><text x="84" y="342" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="end">slot 1</text><rect x="97.5" y="326" width="187" height="22" rx="5" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="191" y="341.5" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">A · 5</text><rect x="287.5" y="326" width="187" height="22" rx="5" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><text x="381" y="341.5" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">G · 5</text><text x="84" y="370" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="end">slot 2</text><rect x="97.5" y="354" width="73" height="22" rx="5" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="134" y="369.5" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">B · 2</text><rect x="173.5" y="354" width="149" height="22" rx="5" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><text x="248" y="369.5" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">E · 4</text><text x="84" y="398" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="end">slot 3</text><rect x="97.5" y="382" width="263" height="22" rx="5" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="229" y="397.5" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">C · 7</text><text x="84" y="426" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="end">slot 4</text><rect x="97.5" y="410" width="111" height="22" rx="5" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="153" y="425.5" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">D · 3</text><rect x="211.5" y="410" width="111" height="22" rx="5" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.2"/><text x="267" y="425.5" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle">F · 3</text><text x="96" y="450" font-size="10.5" font-weight="400" fill="#7d8257" text-anchor="middle">0</text><text x="172" y="450" font-size="10.5" font-weight="400" fill="#7d8257" text-anchor="middle">2</text><text x="248" y="450" font-size="10.5" font-weight="400" fill="#7d8257" text-anchor="middle">4</text><text x="324" y="450" font-size="10.5" font-weight="400" fill="#7d8257" text-anchor="middle">6</text><text x="400" y="450" font-size="10.5" font-weight="400" fill="#7d8257" text-anchor="middle">8</text><text x="476" y="450" font-size="10.5" font-weight="400" fill="#7d8257" text-anchor="middle">10</text><text x="552" y="450" font-size="10.5" font-weight="400" fill="#7d8257" text-anchor="middle">12</text><text x="562" y="450" font-size="10.5" font-weight="400" fill="#7d8257" text-anchor="start">step</text><text x="576" y="342" font-size="12" font-weight="700" fill="#2c361c" text-anchor="start">all done at step 10</text><text x="576" y="362" font-size="12" font-weight="400" fill="#2c361c" text-anchor="start">no slot idles while</text><text x="576" y="382" font-size="12" font-weight="400" fill="#2c361c" text-anchor="start">work is waiting</text><text x="576" y="402" font-size="12" font-weight="400" fill="#2c361c" text-anchor="start">E, F, G wait</text><text x="576" y="422" font-size="12" font-weight="400" fill="#2c361c" text-anchor="start">1, 0 and 1 steps</text><text x="360" y="484" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">Letters are requests and numbers their decode steps. A to D arrive at step 0; E, F and G arrive later.</text></svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 436" width="720" height="436" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Finding a token's key and value through the block table</title><desc>A ten-token sequence split into logical blocks of four tokens. Its block table maps logical blocks 0, 1 and 2 to physical blocks 7, 1 and 4, which sit among blocks owned by other sequences. To find token 9, divide by the block size: logical block 2, slot 1, which the table resolves to slot 1 of physical block 4.</desc><defs><marker id="ah-7d8257" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7d8257"/></marker><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a00"/></marker><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d36"/></marker></defs><rect width="720" height="436" fill="#ffffff"/><text x="20" y="26" font-size="14" font-weight="700" fill="#2c361c" text-anchor="start">Finding token 9 through the block table</text><text x="700" y="26" font-size="11.5" font-weight="400" fill="#4f5d36" text-anchor="end" font-style="italic">block size 4 here (vLLM's default is 16)</text><text x="130" y="50" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">logical block 0</text><rect x="24" y="58" width="50" height="30" rx="5" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="49" y="78" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle">The</text><text x="49" y="102" font-size="10.5" font-weight="400" fill="#7d8257" text-anchor="middle">t = 0</text><rect x="78" y="58" width="50" height="30" rx="5" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="103" y="78" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle">cat</text><text x="103" y="102" font-size="10.5" font-weight="400" fill="#7d8257" text-anchor="middle">t = 1</text><rect x="132" y="58" width="50" height="30" rx="5" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="157" y="78" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle">sat</text><text x="157" y="102" font-size="10.5" font-weight="400" fill="#7d8257" text-anchor="middle">t = 2</text><rect x="186" y="58" width="50" height="30" rx="5" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="211" y="78" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle">on</text><text x="211" y="102" font-size="10.5" font-weight="400" fill="#7d8257" text-anchor="middle">t = 3</text><text x="364" y="50" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">logical block 1</text><rect x="258" y="58" width="50" height="30" rx="5" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="283" y="78" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle">a</text><text x="283" y="102" font-size="10.5" font-weight="400" fill="#7d8257" text-anchor="middle">t = 4</text><rect x="312" y="58" width="50" height="30" rx="5" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="337" y="78" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle">warm</text><text x="337" y="102" font-size="10.5" font-weight="400" fill="#7d8257" text-anchor="middle">t = 5</text><rect x="366" y="58" width="50" height="30" rx="5" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="391" y="78" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle">mat</text><text x="391" y="102" font-size="10.5" font-weight="400" fill="#7d8257" text-anchor="middle">t = 6</text><rect x="420" y="58" width="50" height="30" rx="5" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="445" y="78" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle">and</text><text x="445" y="102" font-size="10.5" font-weight="400" fill="#7d8257" text-anchor="middle">t = 7</text><text x="598" y="50" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">logical block 2</text><rect x="492" y="58" width="50" height="30" rx="5" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.2"/><text x="517" y="78" font-size="12" font-weight="400" fill="#2c361c" text-anchor="middle">then</text><text x="517" y="102" font-size="10.5" font-weight="400" fill="#7d8257" text-anchor="middle">t = 8</text><rect x="546" y="58" width="50" height="30" rx="5" fill="#f3e5ab" stroke="#8a5a00" stroke-width="2"/><text x="571" y="78" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle">slept</text><text x="571" y="102" font-size="10.5" font-weight="700" fill="#8a5a00" text-anchor="middle">t = 9</text><rect x="600" y="58" width="50" height="30" rx="5" fill="#ffffff" stroke="#7d8257" stroke-width="1" stroke-dasharray="3 3"/><text x="625" y="78" font-size="10.5" font-weight="400" fill="#7d8257" text-anchor="middle" font-style="italic">empty</text><rect x="654" y="58" width="50" height="30" rx="5" fill="#ffffff" stroke="#7d8257" stroke-width="1" stroke-dasharray="3 3"/><text x="679" y="78" font-size="10.5" font-weight="400" fill="#7d8257" text-anchor="middle" font-style="italic">empty</text><text x="24" y="126" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="start">block table</text><line x1="130" y1="108" x2="130" y2="128" stroke="#7d8257" stroke-width="1.3" marker-end="url(#ah-7d8257)"/><rect x="74" y="132" width="112" height="32" rx="6" fill="#ffffff" stroke="#4f5d36" stroke-width="1.3"/><text x="130" y="153" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">j = 0 → P7</text><line x1="364" y1="108" x2="364" y2="128" stroke="#7d8257" stroke-width="1.3" marker-end="url(#ah-7d8257)"/><rect x="308" y="132" width="112" height="32" rx="6" fill="#ffffff" stroke="#4f5d36" stroke-width="1.3"/><text x="364" y="153" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">j = 1 → P1</text><line x1="598" y1="108" x2="598" y2="128" stroke="#8a5a00" stroke-width="1.3" marker-end="url(#ah-8a5a00)"/><rect x="542" y="132" width="112" height="32" rx="6" fill="#f3e5ab" stroke="#8a5a00" stroke-width="2"/><text x="598" y="153" font-size="12" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">j = 2 → P4</text><text x="20" y="216" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="start">physical blocks in the GPU pool, shared by every sequence</text><rect x="22" y="226" width="74" height="40" rx="5" fill="#efefe0" stroke="#7d8257" stroke-width="1.2"/><text x="59" y="251" font-size="10.5" font-weight="400" fill="#7d8257" text-anchor="middle" font-style="italic">other seq</text><text x="59" y="282" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">P0</text><rect x="108" y="226" width="74" height="40" rx="5" fill="#ffffff" stroke="#4f5d36" stroke-width="1.4"/><rect x="111" y="230" width="16" height="32" rx="2" fill="#e9efcf" stroke="#4f5d36" stroke-width="0.8"/><rect x="128.2" y="230" width="16" height="32" rx="2" fill="#e9efcf" stroke="#4f5d36" stroke-width="0.8"/><rect x="145.4" y="230" width="16" height="32" rx="2" fill="#e9efcf" stroke="#4f5d36" stroke-width="0.8"/><rect x="162.6" y="230" width="16" height="32" rx="2" fill="#e9efcf" stroke="#4f5d36" stroke-width="0.8"/><text x="145" y="298" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">logical 1</text><text x="145" y="282" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">P1</text><rect x="194" y="226" width="74" height="40" rx="5" fill="#efefe0" stroke="#7d8257" stroke-width="1.2"/><text x="231" y="251" font-size="10.5" font-weight="400" fill="#7d8257" text-anchor="middle" font-style="italic">other seq</text><text x="231" y="282" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">P2</text><rect x="280" y="226" width="74" height="40" rx="5" fill="#ffffff" stroke="#7d8257" stroke-width="1.2" stroke-dasharray="4 3"/><text x="317" y="251" font-size="10.5" font-weight="400" fill="#7d8257" text-anchor="middle" font-style="italic">free</text><text x="317" y="282" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">P3</text><rect x="366" y="226" width="74" height="40" rx="5" fill="#ffffff" stroke="#4f5d36" stroke-width="1.4"/><rect x="369" y="230" width="16" height="32" rx="2" fill="#e9efcf" stroke="#4f5d36" stroke-width="0.8"/><rect x="386.2" y="230" width="16" height="32" rx="2" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.8"/><rect x="403.4" y="230" width="16" height="32" rx="2" fill="#ffffff" stroke="#7d8257" stroke-width="0.8" stroke-dasharray="2 2"/><rect x="420.6" y="230" width="16" height="32" rx="2" fill="#ffffff" stroke="#7d8257" stroke-width="0.8" stroke-dasharray="2 2"/><text x="403" y="298" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">logical 2</text><text x="403" y="282" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">P4</text><rect x="452" y="226" width="74" height="40" rx="5" fill="#ffffff" stroke="#7d8257" stroke-width="1.2" stroke-dasharray="4 3"/><text x="489" y="251" font-size="10.5" font-weight="400" fill="#7d8257" text-anchor="middle" font-style="italic">free</text><text x="489" y="282" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">P5</text><rect x="538" y="226" width="74" height="40" rx="5" fill="#efefe0" stroke="#7d8257" stroke-width="1.2"/><text x="575" y="251" font-size="10.5" font-weight="400" fill="#7d8257" text-anchor="middle" font-style="italic">other seq</text><text x="575" y="282" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">P6</text><rect x="624" y="226" width="74" height="40" rx="5" fill="#ffffff" stroke="#4f5d36" stroke-width="1.4"/><rect x="627" y="230" width="16" height="32" rx="2" fill="#e9efcf" stroke="#4f5d36" stroke-width="0.8"/><rect x="644.2" y="230" width="16" height="32" rx="2" fill="#e9efcf" stroke="#4f5d36" stroke-width="0.8"/><rect x="661.4" y="230" width="16" height="32" rx="2" fill="#e9efcf" stroke="#4f5d36" stroke-width="0.8"/><rect x="678.6" y="230" width="16" height="32" rx="2" fill="#e9efcf" stroke="#4f5d36" stroke-width="0.8"/><text x="661" y="298" font-size="10.5" font-weight="400" fill="#4f5d36" text-anchor="middle">logical 0</text><text x="661" y="282" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">P7</text><line x1="130" y1="166" x2="661" y2="222" stroke="#4f5d36" stroke-width="1.2" marker-end="url(#ah-4f5d36)" opacity="0.95"/><line x1="364" y1="166" x2="145" y2="222" stroke="#4f5d36" stroke-width="1.2" marker-end="url(#ah-4f5d36)" opacity="0.95"/><line x1="598" y1="166" x2="403" y2="222" stroke="#8a5a00" stroke-width="1.6" marker-end="url(#ah-8a5a00)" opacity="0.95"/><rect x="110" y="318" width="500" height="58" rx="10" fill="#f6ebc4" stroke="#8a5a00" stroke-width="1.4"/><text x="360" y="341" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">token 9:  j = ⌊9 / 4⌋ = 2,   r = 9 mod 4 = 1</text><text x="360" y="364" font-size="12.5" font-weight="400" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">block_table[2] = P4   →   physical block 4, slot 1</text><text x="360" y="400" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">The sequence sees one continuous cache, while its blocks sit anywhere in the pool.</text><text x="360" y="420" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">Only the last block of a sequence can be partly empty, and a free block can go to any sequence.</text></svg>

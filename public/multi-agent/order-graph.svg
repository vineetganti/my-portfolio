<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>The order-processing graph and three paths through it</title><desc>Risk analysis routes to manual review if high value, fraud check if suspicious, or straight to inventory if low risk. Review and fraud check both lead to inventory, which routes to shipping if in stock or refund if out of stock. Three example orders take three different paths.</desc><defs><marker id="ah-4f5d36" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4f5d36"/></marker></defs><rect width="720" height="400" fill="#ffffff"/><rect x="14" y="150" width="118" height="40" rx="10" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.5"/><text x="73" y="173.45" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">risk_analysis</text><rect x="196" y="40" width="118" height="40" rx="10" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.5"/><text x="255" y="63.45" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">manual_review</text><rect x="196" y="150" width="118" height="40" rx="10" fill="#ffffff" stroke="#7d8257" stroke-width="1.5"/><text x="255" y="173.45" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">(straight on)</text><rect x="196" y="260" width="118" height="40" rx="10" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.5"/><text x="255" y="283.45" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">fraud_check</text><rect x="388" y="150" width="118" height="40" rx="10" fill="#f3e5ab" stroke="#8a5a00" stroke-width="1.5"/><text x="447" y="173.45" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">inventory_check</text><rect x="580" y="60" width="118" height="40" rx="10" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.5"/><text x="639" y="83.45" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">shipping</text><rect x="580" y="240" width="118" height="40" rx="10" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.5"/><text x="639" y="263.45" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">refund</text><line x1="132" y1="160" x2="194" y2="66" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><text x="126" y="98" font-size="10.5" font-weight="700" fill="#8a5a00" text-anchor="end">HIGH_VALUE</text><line x1="132" y1="170" x2="194" y2="170" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><text x="162" y="160" font-size="10.5" font-weight="700" fill="#8a5a00" text-anchor="middle">LOW_RISK</text><line x1="132" y1="180" x2="194" y2="274" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><text x="126" y="246" font-size="10.5" font-weight="700" fill="#8a5a00" text-anchor="end">SUSPICIOUS</text><line x1="314" y1="66" x2="386" y2="158" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><line x1="314" y1="170" x2="386" y2="170" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><line x1="314" y1="274" x2="386" y2="182" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><line x1="506" y1="158" x2="578" y2="84" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><text x="580" y="128" font-size="10.5" font-weight="700" fill="#8a5a00" text-anchor="end">IN_STOCK</text><line x1="506" y1="182" x2="578" y2="258" stroke="#4f5d36" stroke-width="1.6" marker-end="url(#ah-4f5d36)"/><text x="580" y="232" font-size="10.5" font-weight="700" fill="#8a5a00" text-anchor="end">OUT_OF_STOCK</text><rect x="14" y="316" width="692" height="72" rx="10" fill="#f6ebc4" stroke="#8a5a00" stroke-width="1.3"/><text x="24" y="338" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="start">$1,500 laptop:</text><text x="190" y="338" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">risk → manual_review → inventory → shipping</text><text x="24" y="358" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="start">$45 book:</text><text x="190" y="358" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">risk → inventory → shipping</text><text x="24" y="378" font-size="11.5" font-weight="700" fill="#2c361c" text-anchor="start">$800 suspicious order:</text><text x="190" y="378" font-size="11.5" font-weight="400" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">risk → fraud_check → inventory → refund</text></svg>

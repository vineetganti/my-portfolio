<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>Scalar versus SIMD addition</title><desc>Adding two arrays of 16 floats. Scalar code runs 16 separate add instructions. With AVX-512, one instruction adds all 16 pairs at once, because a 512-bit register holds 16 32-bit floats.</desc><defs></defs><rect width="720" height="290" fill="#ffffff"/><text x="20" y="24" font-size="14" font-weight="700" fill="#2c361c" text-anchor="start">c[i] = a[i] + b[i] for 16 floats</text><text x="20" y="56" font-size="13" font-weight="700" fill="#a3283f" text-anchor="start">Scalar: one add per instruction</text><rect x="20" y="66" width="39" height="30" rx="4" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.2"/><text x="39.5" y="86" font-size="11" font-weight="700" fill="#2c361c" text-anchor="middle">add</text><rect x="63" y="66" width="39" height="30" rx="4" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.2"/><text x="82.5" y="86" font-size="11" font-weight="700" fill="#2c361c" text-anchor="middle">add</text><rect x="106" y="66" width="39" height="30" rx="4" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.2"/><text x="125.5" y="86" font-size="11" font-weight="700" fill="#2c361c" text-anchor="middle">add</text><rect x="149" y="66" width="39" height="30" rx="4" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.2"/><text x="168.5" y="86" font-size="11" font-weight="700" fill="#2c361c" text-anchor="middle">add</text><rect x="192" y="66" width="39" height="30" rx="4" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.2"/><text x="211.5" y="86" font-size="11" font-weight="700" fill="#2c361c" text-anchor="middle">add</text><rect x="235" y="66" width="39" height="30" rx="4" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.2"/><text x="254.5" y="86" font-size="11" font-weight="700" fill="#2c361c" text-anchor="middle">add</text><rect x="278" y="66" width="39" height="30" rx="4" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.2"/><text x="297.5" y="86" font-size="11" font-weight="700" fill="#2c361c" text-anchor="middle">add</text><rect x="321" y="66" width="39" height="30" rx="4" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.2"/><text x="340.5" y="86" font-size="11" font-weight="700" fill="#2c361c" text-anchor="middle">add</text><rect x="364" y="66" width="39" height="30" rx="4" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.2"/><text x="383.5" y="86" font-size="11" font-weight="700" fill="#2c361c" text-anchor="middle">add</text><rect x="407" y="66" width="39" height="30" rx="4" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.2"/><text x="426.5" y="86" font-size="11" font-weight="700" fill="#2c361c" text-anchor="middle">add</text><rect x="450" y="66" width="39" height="30" rx="4" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.2"/><text x="469.5" y="86" font-size="11" font-weight="700" fill="#2c361c" text-anchor="middle">add</text><rect x="493" y="66" width="39" height="30" rx="4" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.2"/><text x="512.5" y="86" font-size="11" font-weight="700" fill="#2c361c" text-anchor="middle">add</text><rect x="536" y="66" width="39" height="30" rx="4" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.2"/><text x="555.5" y="86" font-size="11" font-weight="700" fill="#2c361c" text-anchor="middle">add</text><rect x="579" y="66" width="39" height="30" rx="4" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.2"/><text x="598.5" y="86" font-size="11" font-weight="700" fill="#2c361c" text-anchor="middle">add</text><rect x="622" y="66" width="39" height="30" rx="4" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.2"/><text x="641.5" y="86" font-size="11" font-weight="700" fill="#2c361c" text-anchor="middle">add</text><rect x="665" y="66" width="39" height="30" rx="4" fill="#f8e1d6" stroke="#a3283f" stroke-width="1.2"/><text x="684.5" y="86" font-size="11" font-weight="700" fill="#2c361c" text-anchor="middle">add</text><text x="700" y="114" font-size="12.5" font-weight="700" fill="#a3283f" text-anchor="end">16 instructions</text><text x="20" y="156" font-size="13" font-weight="700" fill="#4f5d36" text-anchor="start">AVX-512: one instruction adds a whole 512-bit register</text><rect x="20" y="166" width="40.4" height="40" rx="4" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><text x="40.2" y="191" font-size="15" font-weight="700" fill="#4f5d36" text-anchor="middle">+</text><rect x="62.4" y="166" width="40.4" height="40" rx="4" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><text x="82.6" y="191" font-size="15" font-weight="700" fill="#4f5d36" text-anchor="middle">+</text><rect x="104.8" y="166" width="40.4" height="40" rx="4" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><text x="125" y="191" font-size="15" font-weight="700" fill="#4f5d36" text-anchor="middle">+</text><rect x="147.2" y="166" width="40.4" height="40" rx="4" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><text x="167.4" y="191" font-size="15" font-weight="700" fill="#4f5d36" text-anchor="middle">+</text><rect x="189.6" y="166" width="40.4" height="40" rx="4" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><text x="209.8" y="191" font-size="15" font-weight="700" fill="#4f5d36" text-anchor="middle">+</text><rect x="232" y="166" width="40.4" height="40" rx="4" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><text x="252.2" y="191" font-size="15" font-weight="700" fill="#4f5d36" text-anchor="middle">+</text><rect x="274.4" y="166" width="40.4" height="40" rx="4" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><text x="294.6" y="191" font-size="15" font-weight="700" fill="#4f5d36" text-anchor="middle">+</text><rect x="316.8" y="166" width="40.4" height="40" rx="4" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><text x="337" y="191" font-size="15" font-weight="700" fill="#4f5d36" text-anchor="middle">+</text><rect x="359.2" y="166" width="40.4" height="40" rx="4" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><text x="379.4" y="191" font-size="15" font-weight="700" fill="#4f5d36" text-anchor="middle">+</text><rect x="401.6" y="166" width="40.4" height="40" rx="4" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><text x="421.8" y="191" font-size="15" font-weight="700" fill="#4f5d36" text-anchor="middle">+</text><rect x="444" y="166" width="40.4" height="40" rx="4" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><text x="464.2" y="191" font-size="15" font-weight="700" fill="#4f5d36" text-anchor="middle">+</text><rect x="486.4" y="166" width="40.4" height="40" rx="4" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><text x="506.6" y="191" font-size="15" font-weight="700" fill="#4f5d36" text-anchor="middle">+</text><rect x="528.8" y="166" width="40.4" height="40" rx="4" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><text x="549" y="191" font-size="15" font-weight="700" fill="#4f5d36" text-anchor="middle">+</text><rect x="571.2" y="166" width="40.4" height="40" rx="4" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><text x="591.4" y="191" font-size="15" font-weight="700" fill="#4f5d36" text-anchor="middle">+</text><rect x="613.6" y="166" width="40.4" height="40" rx="4" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><text x="633.8" y="191" font-size="15" font-weight="700" fill="#4f5d36" text-anchor="middle">+</text><rect x="656" y="166" width="40.4" height="40" rx="4" fill="#e9efcf" stroke="#4f5d36" stroke-width="1.4"/><text x="676.2" y="191" font-size="15" font-weight="700" fill="#4f5d36" text-anchor="middle">+</text><rect x="16" y="162" width="686" height="48" rx="8" fill="none" stroke="#4f5d36" stroke-width="2.2"/><text x="20" y="232" font-size="12.5" font-weight="700" fill="#2c361c" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">vaddps zmm0, zmm1, zmm2   (16 float lanes in one register)</text><text x="700" y="232" font-size="12.5" font-weight="700" fill="#4f5d36" text-anchor="end">1 instruction</text><text x="360" y="262" font-size="12.5" font-weight="400" fill="#4f5d36" text-anchor="middle" font-style="italic">AVX2 registers are 256 bits wide (8 floats). NumPy, MKL and OpenBLAS pick the widest set the CPU supports.</text></svg>

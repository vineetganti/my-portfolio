<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 344" width="720" height="344" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img"><title>One agent per user</title><desc>Mona's agent holds a memory tool fixed to the user_id mona_mona. It can read and write Mona's memories in the shared FAISS index but cannot reach another user's.</desc><defs><marker id="ah-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a5a00"/></marker></defs><rect width="720" height="344" fill="#ffffff"/><rect x="20" y="24" width="310" height="262" rx="14" fill="#fbf6df" stroke="#4f5d36" stroke-width="1.5"/><text x="36" y="50" font-size="15" font-weight="700" fill="#2c361c" text-anchor="start">Agent for Mona Mona</text><rect x="36" y="64" width="278" height="60" rx="10" fill="#ffffff" stroke="#4f5d36" stroke-width="1.2"/><text x="46" y="84" font-size="13" font-weight="700" fill="#2c361c" text-anchor="start">system prompt</text><text x="46" y="102" font-size="12" font-weight="400" fill="#2c361c" text-anchor="start">“You are a personal assistant</text><text x="46" y="117" font-size="12" font-weight="400" fill="#2c361c" text-anchor="start">for Mona Mona…”</text><rect x="36" y="136" width="278" height="72" rx="10" fill="#f6ebc4" stroke="#8a5a00" stroke-width="1.6"/><text x="46" y="156" font-size="13" font-weight="700" fill="#8a5a00" text-anchor="start">mem0_memory tool</text><text x="46" y="175" font-size="12" font-weight="400" fill="#2c361c" text-anchor="start">bound to user_id = mona_mona</text><text x="46" y="191" font-size="12" font-weight="400" fill="#2c361c" text-anchor="start">set in code, not chosen by the model</text><rect x="36" y="220" width="278" height="52" rx="10" fill="#ffffff" stroke="#4f5d36" stroke-width="1.2"/><text x="46" y="240" font-size="13" font-weight="700" fill="#2c361c" text-anchor="start">websearch tool</text><text x="46" y="257" font-size="12" font-weight="400" fill="#2c361c" text-anchor="start">DuckDuckGo, no API key</text><rect x="410" y="24" width="290" height="262" rx="14" fill="#f7edc4" stroke="#4f5d36" stroke-width="1.5"/><text x="426" y="50" font-size="15" font-weight="700" fill="#2c361c" text-anchor="start">Mem0 on disk (FAISS index)</text><rect x="426" y="68" width="258" height="90" rx="10" fill="#f3e5ab" stroke="#4f5d36" stroke-width="1.4"/><text x="440" y="92" font-size="13" font-weight="700" fill="#2c361c" text-anchor="start">memories of mona_mona</text><text x="440" y="112" font-size="12" font-weight="400" fill="#2c361c" text-anchor="start">veggie lover, low-sodium,</text><text x="440" y="128" font-size="12" font-weight="400" fill="#2c361c" text-anchor="start">decaf only, …</text><rect x="426" y="178" width="258" height="90" rx="10" fill="#efefe0" stroke="#7d8257" stroke-width="1.4" stroke-dasharray="6 4"/><text x="440" y="202" font-size="13" font-weight="700" fill="#7d8257" text-anchor="start">memories of bunny_kaushik</text><text x="440" y="222" font-size="12" font-weight="400" fill="#7d8257" text-anchor="start" font-style="italic">another user's facts</text><line x1="316" y1="164" x2="420" y2="118" stroke="#8a5a00" stroke-width="2" marker-end="url(#ah-8a5a00)"/><text x="366" y="126" font-size="12" font-weight="400" fill="#8a5a00" text-anchor="middle" font-style="italic">read / write</text><line x1="316" y1="190" x2="396" y2="224" stroke="#a3283f" stroke-width="2" stroke-dasharray="5 4"/><line x1="395" y1="215" x2="407" y2="231" stroke="#a3283f" stroke-width="2.6"/><line x1="407" y1="215" x2="395" y2="231" stroke="#a3283f" stroke-width="2.6"/><text x="356" y="252" font-size="12" font-weight="400" fill="#a3283f" text-anchor="middle" font-style="italic">can't reach</text><text x="360" y="320" font-size="13" font-weight="400" fill="#4f5d36" text-anchor="middle">The model can't pick a different user_id: Mem0MemoryTool(user_id=…) fixes it in code.</text></svg>
